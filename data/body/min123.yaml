    course_objectives:
    - 1. Identify the central message and primary purpose of evangelism.
    - 2. Identify the source of evangelism’s power and the believer’s ability to evangelize.
    - 3. Describe the relationship between evangelism and discipleship.
    - 4. Define the church’s role in world ministry.
    - 5. Explain a theology of evangelism and the theological role of believers in
      evangelism.
    - 6. Explain the value of personal evangelism to the church’s outreach mission.
    - 7. Identify the role of pastoral leadership in the effectiveness of church evangelism.
    - 8. Identify key aspects and characteristics of evangelism. 14 The Local Church
      in Evangelism.
