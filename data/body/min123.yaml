    glossary:
    - term: allegory
      definition: Goes beyond a parable by making several points and assigning symbolic
        meaning to multiple elements in the story.
      chapter: 4
      paragraph: MIN123.4.1.1.P.5
      page: 47
    - term: alliteration
      definition: The repetition of beginning consonant sounds in a string of words,
        commonly used by preachers as an aid to the audience’s memory when composing
        points in a sermon.
      chapter: 12
      paragraph: MIN123.12.2.1.P.12
      page: 157
    - term: altar
      definition: A place of consecration and personal sacrifice in which the believer
        is more fully aware of God’s presence.
      chapter: 12
      paragraph: MIN123.12.3.1.P.5
      page: 159
    - term: anointing
      definition: The Holy Spirit’s work in the lives of both the speaker and hearer
        of the Word, giving the first the ability to clearly communicate a message
        with inspired clarity and giving the second the ability to understand and
        apply that message to life.
      chapter: 12
      paragraph: MIN123.12.1.1.P.20
      page: 154
    - term: Antioch
      definition: One of the earliest centers of Christianity; it was here that the
        followers of Christ were first called Christians . Antioch served as the headquarters
        for Paul’s missionary journeys.
      chapter: 1
      paragraph: MIN123.1.1.1.P.15
      page: 18
    - term: Calvinism
      definition: The theological system of John Calvin (1509-1564), a French pastor
        in Geneva, prominent reformer, and the first systematic theologian of the
        Protestant movement. Calvinists believe that God has determined in advance
        who will be saved and who will be condemned and that Jesus died only for the
        elect. All the elect will ultimately be saved and apostasy (the deliberate
        abandonment of salvation) is impossible.
      chapter: 2
    - term: ceremonially unclean
      definition: A condition of societal exclusion called for in the Law of Moses
        when a person was considered contaminated (temporarily or long-term) by eating
        prohibited food, exhibiting evidence of certain diseases, coming in contact
        with human bodily fluids, or any number of minor violations of the Law. The
        condition was not necessarily a sign of moral failure but was usually intended
        as a reminder of the sinful nature of all people.
      chapter: 5
      paragraph: MIN123.5.1.1.P.22
      page: 62
    - term: church planting model
      definition: A structural relationship between a host church and a church plant
        that accounts for varying levels of assistance by the host church and varying
        levels of independence of the church plant.
      chapter: 11
    - term: Codex Vaticanus
      definition: A Greek manuscript, possibly the most important of all the manuscripts
        of Holy Scripture. It is named such because it belongs to the Vatican Library.
      chapter: 1
      paragraph: MIN123.1.1.1.P.6
      page: 17
    - term: Codex Sinaiticus
      definition: A Greek manuscript of the Old and New Testaments, of great antiquity
        and value, found on Mount Sinai, in St. Catherine’s Monastery, by Constantine
        Tischendorf.
      chapter: 1
      paragraph: MIN123.1.1.1.P.6
      page: 17
    - term: dependence
      definition: The believer’s reliance on God to divinely influence the person
        with whom he or she is sharing the gospel.
      chapter: 8
      paragraph: MIN123.8.3.1.P.2
      page: 102
    - term: disciple
      definition: As a verb, the process of nurturing spiritual growth in another.
        As a noun, a follower of Christ who lives in obedience to Christ’s teachings.
      chapter: 1
      paragraph: MIN123.1.1.1.P.11
      page: 17
    - term: discipleship
      definition: Developing spiritual growth in the believer with the end objective
        of spiritual multiplication.
      chapter: 2
      paragraph: MIN123.2.1.1.P.1
      page: 27
    - term: discipline
      definition: The believer’s recognition of personal responsibility to prepare
        for evangelism through Bible study, prayer, and consistent Christian living.
      chapter: 8
      paragraph: MIN123.8.3.1.P.2
      page: 102
    - term: evangelism
      definition: The presentation of Jesus Christ in the power of the Holy Spirit
        so that people might come to trust Him as Savior and serve Him as Lord in
        the fellowship of His church.
      chapter: 2
      paragraph: MIN123.2.1.1.P.1
      page: 27
    - term: exegesis
      definition: The careful, systematic study of the Scriptures, including critical
        analysis, to discover the original intended meaning and bring the meaning
        out of Scripture; distinguished from the error of eisegesis, which is reading
        meaning into the text.
      chapter: 12
      paragraph: MIN123.12.2.1.P.7
      page: 156
    - term: exegetical theology
      definition: The study of theology as solely revealed through Scripture.
      chapter: 15
      paragraph: MIN123.15.1.1.P.21
      page: 194
    - term: exponential
      definition: Increasing at a consistent and usually rapid rate.
      chapter: 2
      paragraph: MIN123.2.1.1.P.16
      page: 28
    - term: fruit of the Spirit
      definition: Personal characteristics created and nurtured by the Holy Spirit
        in the believer who maintains fellowship with Him.
      chapter: 6
      paragraph: MIN123.6.2.1.P.11
    - term: full gospel
      definition: The ministry focus that assumes that what God promised to the New
        Testament church is still true for the church today.
      chapter: 14
      paragraph: MIN123.14.1.1.P.42
      page: 186
    - term: Great Commission
      definition: The summary term for Christ’s commands and instructions to His followers
        to proclaim the gospel and make disciples in all nations.
      chapter: 1
      paragraph: MIN123.1.1.1.P.3
      page: 17
    - term: Great Commission cycle
      definition: The constant interchange between evangelism of the lost and discipleship
        of new believers in preparation for their own ministry as evangelists to the
        lost.
      chapter: 2
      paragraph: MIN123.2.1.1.P.3
      page: 27
    - term: hermeneutics
      definition: The rules, principles, and procedures of Bible interpretation, often
        with special attention given to current life-application of the text.
      chapter: 12
      paragraph: MIN123.12.2.1.P.7
      page: 156
    - term: homogeneous principle
      definition: The idea that a group will usually grow more quickly and easily
        if it is comprised primarily of one kind of people.
      chapter: 2
      paragraph: MIN123.2.2.1.P.12
      page: 30
    - term: illumination
      definition: The means by which the Holy Spirit enlightens or gives understanding
        of God’s revelation in the Bible.
      chapter: 12
      paragraph: MIN123.12.1.1.P.14
      page: 154
    - term: imperative mood
      definition: Form of a verb that expresses a command.
      chapter: 1
      paragraph: MIN123.1.1.1.P.4
      page: 17
    - term: indigenous
      definition: Something that begins, grows, and lives in its natural setting or
        environment.
      chapter: 14
      paragraph: MIN123.14.1.1.P.15
      page: 184
    - term: initial evidence
      definition: The first outward sign that a believer has received the baptism
        in the Holy Spirit, namely, speaking in other tongues.
      chapter: 6
      paragraph: MIN123.6.3.1.P.7
      page: 79
    - term: inspiration
      definition: The extraordinary supernatural influence exerted by the Holy Spirit
        on the thought processes of the writers of Scripture so that their words were
        rendered the words of God and are infallible.
      chapter: 12
      paragraph: MIN123.12.1.1.P.14
      page: 154
    - term: Irenaeus
      definition: ca. 125– ca. 202, Greek theologian, Bishop of Lyons, and the church
        father who systematized Christian beliefs that would later be accepted as
        orthodox doctrine and cited frequently by theologians.
      chapter: 1
      paragraph: MIN123.1.1.1.P.11
      page: 17
    - term: metaphor
      definition: 'A literary or poetic device in which one object is described as
        another. Example: Jesus is the Lion of Judah.'
      chapter: 4
    - term: mission
      definition: A derived term not found in the Bible but based on the Latin word
        missio, which means “sent.” The purpose of a mission, or missionary, is to
        extend a message and activity to new territory.
      chapter: 15
      paragraph: MIN123.15.1.1.P.1
      page: 193
    - term: missions conventions
      definition: Coordinated services and associated activities in a local church
        that connect the congregation with missionaries, missions projects, and missions
        vision. Usually commitments are received for regular missions giving in the
        form of faith promises.
      chapter: 14
      paragraph: MIN123.14.2.1.P.1
      page: 186
    - term: Missions Sunday
      definition: The first Sunday of the month, designated throughout the history
        of the Assemblies of God as an opportunity to promote vision for missions
        ministry within the local church.
      chapter: 14
      paragraph: MIN123.14.2.1.P.3
      page: 186
    - term: neighbor
      definition: Translated from Greek meaning “near.” Whoever is there—near enough
        to require a responsibility to relate to the person.
      chapter: 2
      paragraph: MIN123.2.2.1.P.27
      page: 32
    - term: ontological argument
      definition: The argument that originated with Anselm (1033-1109) and was developed
        further by French philosopher René Descartes (1596-1650). The ontological
        argument basically postulates that it is illogical to say that God does not
        exist, so He must exist. It associates three concepts—the concepts of God
        , perfection , and existence . The ontological argument was rejected by Saint
        Thomas Aquinas, the brilliant thirteenth-century Dominican philosopher.
      chapter: 12
      paragraph: MIN123.12.2.1.P.21
      page: 158
    - term: outsider
      definition: A biblical description of the nonbeliever emphasizing that person’s
        inability to connect with the language and culture of the church.
      chapter: 9
      paragraph: MIN123.9.3.1.P.7
      page: 115
    - term: perish
      definition: A description of the eternal judgment to be suffered by the lost;
        not a description of personal annihilation.
      chapter: 3
      paragraph: MIN123.3.1.1.P.15
      page: 38
    - term: preaching
      definition: Publicly or personally sharing the truth of the gospel. Not intended
        to describe only pulpit activity.
      chapter: 1
      paragraph: MIN123.1.2.1.P.10
      page: 20
    - term: prevenient grace
      definition: Activity of the Holy Spirit to bring people and circumstances to
        bear in a nonbeliever’s life in preparation for salvation.
      chapter: 8
      paragraph: MIN123.8.2.1.P.10
      page: 100
    - term: response evangelism
      definition: Acknowledging God’s sovereignty and His work in people’s lives and
        circumstances, then responding to people and their needs while relying on
        the Holy Spirit’s guidance.
      chapter: 5
      paragraph: MIN123.5.2.1.P.5
      page: 64
    - term: Samaria
      definition: A region in Israel occupied by a people group of mixed ethnicity,
        including Jewish, who practiced an altered form of Judaism. The Jews looked
        down on the Samaritans.
      chapter: 5
      paragraph: MIN123.5.1.1.P.9
      page: 61
    - term: self-governing
      definition: A church in which leadership is raised up by the Holy Spirit from
        among converts within its own body and is not accountable to or controlled
        by an outside church organization.
      chapter: 14
      paragraph: MIN123.14.1.1.P.16
      page: 184
    - term: self-propagating
      definition: A church that extends itself throughout and beyond its own region
        and is not dependent on outside influence to grow and multiply.
      chapter: 14
      paragraph: MIN123.14.1.1.P.16
      page: 184
    - term: self-supporting
      definition: A church that does not subsist or depend on outside or foreign sources
        for finances.
      chapter: 14
      paragraph: MIN123.14.1.1.P.16
      page: 184
    - term: Synoptic Gospels
      definition: The Bible books of Matthew, Mark, and Luke which record many of
        the same events in Jesus’ life offering a similar synopsis of His ministry—a
        beginning-to-end examination of Jesus’ life—as distinct from the thematic
        approach of John.
      chapter: 1
      paragraph: MIN123.1.2.1.P.17
      page: 20
    - term: systematic theology
      definition: The branch of theology that deals with the logical categorization
        of biblical truths; examining the Scriptures doctrinally rather than sequentially.
      chapter: 15
      paragraph: MIN123.15.1.1.P.21
      page: 194
    - term: voluntary cooperative fellowship
      definition: The distinctive organizational nature of the Assemblies of God.
        The founding delegates intended to distinguish the newly formed Pentecostal
        group as nonsectarian.
      chapter: 14
      paragraph: MIN123.14.1.1.P.13
      page: 184
