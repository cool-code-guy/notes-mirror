    - last_modified: '2026-05-22'
      title: 12 - Evangelism in the Pulpit
      print_page: 19
      lessons:
      - last_modified: '2026-05-22'
        title: The Power of the Preached Word
        subobjectives:
          12.1.1:
            last_modified: '2026-05-22'
            text: Explain the priority of the authority of God’s Word in pulpit ministry.
            glossary:
            - term: anointing
              definition: The Holy Spirit’s work in the lives of both the speaker
                and hearer of the Word, giving the first the ability to clearly communicate
                a message with inspired clarity and giving the second the ability
                to understand and apply that message to life.
              paragraph: MIN123.12.1.1.P.20
              page: 154
              UID: MIN123.12.1.1.G.1
            - term: illumination
              definition: The means by which the Holy Spirit enlightens or gives understanding
                of God’s revelation in the Bible.
              paragraph: MIN123.12.1.1.P.14
              page: 154
              UID: MIN123.12.1.1.G.2
            - term: inspiration
              definition: The extraordinary supernatural influence exerted by the
                Holy Spirit on the thought processes of the writers of Scripture so
                that their words were rendered the words of God and are infallible.
              paragraph: MIN123.12.1.1.P.14
              page: 154
              UID: MIN123.12.1.1.G.3
          12.1.2:
            last_modified: '2026-05-22'
            text: Describe the divine inspiration of God’s Word, and apply it as the
              infallible, authoritative rule of faith and conduct.
            glossary: []
          12.1.3:
            last_modified: '2026-05-22'
            text: Cite the role of God’s Word and the Holy Spirit in sermon preparation.
            glossary: []
          12.1.4:
            last_modified: '2026-05-22'
            text: Communicate the Word of God under the Holy Spirit’s anointing in
              a culturally and age-relevant manner.
            glossary: []
      - last_modified: '2026-05-22'
        title: Preparation for Proclamation
        subobjectives:
          12.2.1:
            last_modified: '2026-05-22'
            text: Dedicate yourself to in-depth study of the Scriptures to discern
              original meaning and current application.
            glossary:
            - term: alliteration
              definition: The repetition of beginning consonant sounds in a string
                of words, commonly used by preachers as an aid to the audience’s memory
                when composing points in a sermon.
              paragraph: MIN123.12.2.1.P.12
              page: 157
              UID: MIN123.12.2.1.G.1
            - term: exegesis
              definition: The careful, systematic study of the Scriptures, including
                critical analysis, to discover the original intended meaning and bring
                the meaning out of Scripture; distinguished from the error of eisegesis,
                which is reading meaning into the text.
              paragraph: MIN123.12.2.1.P.7
              page: 156
              UID: MIN123.12.2.1.G.2
            - term: hermeneutics
              definition: The rules, principles, and procedures of Bible interpretation,
                often with special attention given to current life-application of
                the text.
              paragraph: MIN123.12.2.1.P.7
              page: 156
              UID: MIN123.12.2.1.G.3
            - term: ontological argument
              definition: The argument that originated with Anselm (1033-1109) and
                was developed further by French philosopher René Descartes (1596-1650).
                The ontological argument basically postulates that it is illogical
                to say that God does not exist, so He must exist. It associates three
                concepts—the concepts of God , perfection , and existence . The ontological
                argument was rejected by Saint Thomas Aquinas, the brilliant thirteenth-century
                Dominican philosopher.
              paragraph: MIN123.12.2.1.P.21
              page: 158
              UID: MIN123.12.2.1.G.4
          12.2.2:
