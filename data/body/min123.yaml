    - last_modified: '2026-05-22'
      title: 14 - World Missions
      lessons:
      - last_modified: '2026-05-22'
        title: Our Worldwide Mission
        subobjectives:
          14.1.1:
            last_modified: '2026-05-22'
            text: Identify the Assemblies of God’s cooperative nature and its distinction
              as a Fellowship.
            glossary:
            - term: full gospel
              definition: The ministry focus that assumes that what God promised to
                the New Testament church is still true for the church today.
              paragraph: MIN123.14.1.1.P.42
              page: 186
              UID: MIN123.14.1.1.G.1
            - term: indigenous
              definition: Something that begins, grows, and lives in its natural setting
                or environment.
              paragraph: MIN123.14.1.1.P.15
              page: 184
              UID: MIN123.14.1.1.G.2
            - term: self-governing
              definition: A church in which leadership is raised up by the Holy Spirit
                from among converts within its own body and is not accountable to
                or controlled by an outside church organization.
              paragraph: MIN123.14.1.1.P.16
              page: 184
              UID: MIN123.14.1.1.G.3
            - term: self-propagating
              definition: A church that extends itself throughout and beyond its own
                region and is not dependent on outside influence to grow and multiply.
              paragraph: MIN123.14.1.1.P.16
              page: 184
              UID: MIN123.14.1.1.G.4
            - term: self-supporting
              definition: A church that does not subsist or depend on outside or foreign
                sources for finances.
              paragraph: MIN123.14.1.1.P.16
              page: 184
              UID: MIN123.14.1.1.G.5
            - term: voluntary cooperative fellowship
              definition: The distinctive organizational nature of the Assemblies
                of God. The founding delegates intended to distinguish the newly formed
                Pentecostal group as nonsectarian.
              paragraph: MIN123.14.1.1.P.13
              page: 184
              UID: MIN123.14.1.1.G.6
          14.1.2:
            last_modified: '2026-05-22'
            text: Describe the Fellowship’s commitment to worldwide evangelization.
            glossary: []
          14.1.3:
            last_modified: '2026-05-22'
            text: Explain the fourfold strategy of Assemblies of God World Missions
              (AGWM).
            glossary: []
          14.1.4:
            last_modified: '2026-05-22'
            text: Explain the comprehensive methodology of AGWM.
            glossary: []
      - last_modified: '2026-05-22'
        title: World Missions in the Local Church
        subobjectives:
          14.2.1:
            last_modified: '2026-05-22'
            text: Embrace the practice of observing Missions Sunday.
            glossary:
            - term: missions conventions
              definition: Coordinated services and associated activities in a local
                church that connect the congregation with missionaries, missions projects,
                and missions vision. Usually commitments are received for regular
                missions giving in the form of faith promises.
              paragraph: MIN123.14.2.1.P.1
              page: 186
              UID: MIN123.14.2.1.G.1
            - term: Missions Sunday
              definition: The first Sunday of the month, designated throughout the
                history of the Assemblies of God as an opportunity to promote vision
                for missions ministry within the local church.
              paragraph: MIN123.14.2.1.P.3
              page: 186
              UID: MIN123.14.2.1.G.2
          14.2.2:
            last_modified: '2026-05-22'
            text: Prioritize at least one, preferably two, missions conventions each
              year.
            glossary: []
          14.2.3:
            last_modified: '2026-05-22'
            text: Explain the biblical foundation for faith-promise giving.
            glossary: []
          14.2.4:
            last_modified: '2026-03-27'
            text: Outline the integration of the practice of faith-promise giving
              with the church’s commitment to tithes and offerings.
            glossary: []
    - last_modified: '2026-05-22'
      title: 15 - The Church in Mission
      lessons:
      - last_modified: '2026-05-22'
        title: The Redemptive Mission of the Church
        subobjectives:
          15.1.1:
            last_modified: '2026-05-22'
            text: Describe the nature of Christ’s redemptive mission.
            glossary:
            - term: exegetical theology
              definition: The study of theology as solely revealed through Scripture.
              paragraph: MIN123.15.1.1.P.21
              page: 194
              UID: MIN123.15.1.1.G.1
            - term: mission
              definition: A derived term not found in the Bible but based on the Latin
                word missio, which means “sent.” The purpose of a mission, or missionary,
                is to extend a message and activity to new territory.
              paragraph: MIN123.15.1.1.P.1
              page: 193
              UID: MIN123.15.1.1.G.2
            - term: systematic theology
              definition: The branch of theology that deals with the logical categorization
                of biblical truths; examining the Scriptures doctrinally rather than
                sequentially.
              paragraph: MIN123.15.1.1.P.21
              page: 194
              UID: MIN123.15.1.1.G.3
          15.1.2:
            last_modified: '2026-05-22'
            text: Summarize Christ’s commitment to empower His church to fulfill its
              mission.
            glossary: []
          15.1.3:
            last_modified: '2026-05-22'
            text: Explain the interconnected functions of evangelism, worship, discipleship,
              and demonstrating compassion.
            glossary: []
          15.1.4:
            last_modified: '2026-05-22'
            text: Identify the comprehensive role of evangelism.
            glossary: []
      - last_modified: '2026-05-22'
        title: Fulfilling the Mission
        subobjectives:
          15.2.1:
            last_modified: '2026-05-22'
            text: Identify faithful prayer as the foundation on which a church fulfills
              its mission.
            glossary: []
          15.2.2:
            last_modified: '2026-05-22'
            text: Prepare sermons using biblical principles to motivate the congregation.
            glossary: []
          15.2.3:
            last_modified: '2026-05-22'
            text: Dedicate money and time to the church’s priority mission of evangelism.
            glossary: []
          15.2.4:
            last_modified: '2026-05-22'
            text: Integrate dependence and discipline whenever the church acts in
              ministry.
            glossary: []
