            text: Identify the founder and popularizer of dispensationalism.
            glossary:
            - term: dispensationalism
              definition: a teaching that God’s activity in history can be divided
                into seven dispensations or periods when God deals with humans according
                to a special standard.
              paragraph: THE245.11.3.1.P.1
              page: 140
              UID: THE245.11.3.1.G.1
            - term: ultradispensationalists
              definition: Dispensationalists who take extreme positions and find additional
                periods when God deals differently with humankind.
              paragraph: THE245.11.3.1.P.35
              UID: THE245.11.3.1.G.2
          11.3.2:
