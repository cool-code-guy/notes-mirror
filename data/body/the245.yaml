      print_page: 62
      lessons:
      - last_modified: '2026-03-27'
        title: The Rapture of the Church
        subobjectives:
          5.1.1:
            last_modified: '2026-03-27'
            text: Explain “the Blessed Hope” of all believers in Christ Jesus.
            glossary:
            - term: Day of the Lord
              definition: the period of God’s judgment on evil and wickedness, beginning
                after the Rapture and ending after the Great White Throne Judgment.
              paragraph: THE245.5.1.1.P.25
              page: 65
              UID: THE245.5.1.1.G.1
            - term: mid-Tribulation rapture
              definition: Christ comes for the faithful during the Tribulation (many
                variations).
              paragraph: THE245.5.1.1.P.16
              page: 64
              UID: THE245.5.1.1.G.2
            - term: post-Tribulation rapture
              definition: Christ comes for the Church after the Tribulation.
              paragraph: THE245.5.1.1.P.14
              page: 64
              UID: THE245.5.1.1.G.3
            - term: pre-Tribulation rapture
              definition: Christ comes for the church prior to the Tribulation.
              paragraph: THE245.5.1.1.P.19
              page: 65
              UID: THE245.5.1.1.G.4
            - term: pre-wrath Rapture
              definition: modified view of mid-Tribulation Rapture that places Rapture
                any time after middle of the seventh year on up to the Second Coming,
                if God’s wrath is poured out quickly when it is unleashed on those
                left on earth.
              paragraph: THE245.5.1.1.P.18
              UID: THE245.5.1.1.G.5
            - term: revelation
              definition: God’s act of disclosing himself and His will. “The Revelation
                of Jesus Christ” is the full title of the last book of the Bible.
              paragraph: THE245.5.1.1.P.17
              page: 64
              UID: THE245.5.1.1.G.6
            - term: Second Coming
              definition: Christ’s return to earth at the end of the Tribulation to
                defeat Satan and his hosts. The First Coming was when Jesus came to
                earth as a baby.
              paragraph: THE245.5.1.1.P.5
              page: 63
              UID: THE245.5.1.1.G.7
            - term: Tribulation
              definition: seven-year period of time between the Rapture and Christ’s
                return to earth when God’s wrath is poured out. The last three and
                a half years are sometimes called the Great Tribulation.
              paragraph: THE245.5.1.1.P.5
              page: 63
              UID: THE245.5.1.1.G.8
          5.1.2:
            last_modified: '2026-03-27'
            text: Describe the “snatching away” of believers.
            glossary: []
          5.1.3:
            last_modified: '2026-03-27'
            text: Summarize the various views on the time of the Rapture.
            glossary: []
          5.1.4:
            last_modified: '2026-03-27'
