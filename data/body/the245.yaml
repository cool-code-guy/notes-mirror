    chapters:
    - last_modified: '2026-05-28'
      title: 1 - Understanding Bible Eschatology
      print_page: 14
      lessons:
      - last_modified: '2026-03-27'
        title: The Value of Studying End-Time Events
        subobjectives:
          1.1.1:
            last_modified: '2026-03-27'
            text: Examine how prophecy in general is evidence that the Bible is inspired
              by God.
            glossary:
            - term: eschatology
              definition: literally, “last things.” The branch of theology that is
                concerned with end-time events, particularly life after death, Bible
                events yet in the future, and the final state of the redeemed and
                the unsaved.
              paragraph: THE245.1.1.1.P.12
              page: 16
              UID: THE245.1.1.1.G.1
            - term: Rapture
              definition: literally “caught up” or “snatched up.” Christ’s sudden
                coming for His saints, bringing an end to the Church Age and ushering
                in the Tribulation.
              paragraph: THE245.1.1.1.P.13
              UID: THE245.1.1.1.G.2
          1.1.2:
            last_modified: '2026-03-27'
            text: Indicate how our understanding of end-time prophecy influences our
              worldview.
            glossary: []
          1.1.3:
            last_modified: '2026-03-27'
            text: Describe the impact of prophecy on evangelism and missionary outreach.
            glossary: []
      - last_modified: '2026-05-28'
        title: Overview of the History of Prophecy in Relation to End-Time Events
        subobjectives:
          1.2.1:
            last_modified: '2026-03-27'
            text: Summarize the early church’s position on premillennialism.
            glossary:
            - term: allegorize
              definition: to interpret extensive details as symbolic rather than literal.
              paragraph: THE245.1.2.1.P.25
              page: 20
              UID: THE245.1.2.1.G.1
            - term: allegory
              definition: a literary form that uses symbolic fictional characters
                and actions to emphasize general truth. Those who apply this method
                of interpreting prophecy look for a deeper “spiritual” meaning behind
                the actual descriptions.
              paragraph: THE245.1.2.1.P.19
              page: 19
              UID: THE245.1.2.1.G.2
            - term: amillennialism
              definition: literally “no Millennium.” Rather than a physical future
                reign of Christ on earth, this view spiritualizes the Millennium,
                identifying it as Christ’s reign in heaven throughout the present
                Church Age.
              paragraph: THE245.1.2.1.P.18
              page: 19
              UID: THE245.1.2.1.G.3
            - term: postmillennialism
              definition: the belief that the Millennium is actually the Church Age
                or period immediately following; a view that Christ reigns, but is
                not physically present during this period.
              paragraph: THE245.1.2.1.P.18
              page: 19
              UID: THE245.1.2.1.G.4
          1.2.2:
            last_modified: '2026-05-28'
            text: Explain why amillennialism and postmillennialism prevailed after
              Bible days.
            glossary: []
      - last_modified: '2026-05-28'
        title: The Biblical Validity of Premillennialism
        subobjectives:
          1.3.1:
            last_modified: '2026-05-28'
            text: Distinguish between the Rapture and the Second Coming.
            glossary:
            - term: inerrancy
              definition: the assurance that the Bible is without error of any kind
              paragraph: THE245.1.3.1.P.2
              page: 21
              UID: THE245.1.3.1.G.1
            - term: literalist
              definition: a person who believes Bible prophecy will take place literally
                as described in Scripture.
              paragraph: THE245.1.3.1.P.12
              page: 23
              UID: THE245.1.3.1.G.2
            - term: premillennialists
              definition: those who teach that Jesus will physically return and establish
                His kingdom on earth for a thousand years.
              paragraph: THE245.1.3.1.P.3
              page: 21
              UID: THE245.1.3.1.G.3
          1.3.2:
            last_modified: '2026-03-27'
            text: Summarize the weaknesses of a postmillennial view of eschatology.
            glossary: []
          1.3.3:
            last_modified: '2026-05-28'
            text: Outline the bases of amillennialism.
            glossary: []
