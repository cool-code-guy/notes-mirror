            text: Explain how the amillennial view affects one’s attitude toward society.
            glossary: []
      - last_modified: '2026-03-27'
        title: Postmillennialism
        subobjectives:
          11.2.1:
            last_modified: '2026-03-27'
            text: Explain postmillennialism’s loss of influence in the twentieth century.
            glossary:
            - term: dominion theology
              definition: the belief that the believer should have dominion over every
                area of human life because Christ provided that dominion through His
                death and resurrection.
              paragraph: THE245.11.2.1.P.11
              page: 139
              UID: THE245.11.2.1.G.1
            - term: humanism
              definition: a philosophy or way of life that values human achievements
                over submission to a supernatural God.
              paragraph: THE245.11.2.1.P.7
              page: 138
              UID: THE245.11.2.1.G.2
            - term: kingdom now
              definition: the belief that Christ’s kingdom exists on earth now, so
                believers should operate in the authority given by Christ.
              paragraph: THE245.11.2.1.P.11
              page: 139
              UID: THE245.11.2.1.G.3
            - term: reconstructionism
              definition: the teaching that the church is called to change (reconstruct)
                society so it conforms to Old and New Testament mandates; its mission
                is more than spiritual transformation of individuals.
              paragraph: THE245.11.2.1.P.11
              page: 139
              UID: THE245.11.2.1.G.4
            - term: theocracy
              definition: a government administered by God or His representative.
              paragraph: THE245.11.2.1.P.13
              page: 139
              UID: THE245.11.2.1.G.5
          11.2.2:
            last_modified: '2026-03-27'
            text: Identify new versions of postmillennialism in recent years.
            glossary: []
