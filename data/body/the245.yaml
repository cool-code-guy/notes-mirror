      title: 3 - The Believer’s Afterlife Between Death and the Rapture
      print_page: 40
      lessons:
      - last_modified: '2026-05-28'
        title: Death for the Believer
        subobjectives:
          3.1.1:
            last_modified: '2026-03-27'
            text: Identify the effect of sin on God’s creation.
            glossary: []
          3.1.2:
            last_modified: '2026-05-28'
            text: Explain what the believer’s attitude toward the inevitability of
              death should be.
            glossary: []
      - last_modified: '2026-05-28'
        title: The Place of the Afterlife
        subobjectives:
          3.2.1:
            last_modified: '2026-05-28'
            text: Give reasons for the belief that Old Testament saints did not go
              to Sheol after death.
            glossary:
            - term: Great White Throne Judgment
              definition: judgment of the wicked (including the resurrected wicked
                dead) at the end of the Millennium.
              paragraph: THE245.3.2.1.P.1
              page: 43
              UID: THE245.3.2.1.G.1
            - term: hades
              definition: the New Testament translation of the Hebrew Sheol, a place
                of torment and agony for the wicked.
              paragraph: THE245.3.2.1.P.12
              page: 44
              UID: THE245.3.2.1.G.2
            - term: intermediate state
              definition: the condition of believers and non-believers between death
                and their resurrection.
              paragraph: THE245.3.2.1.P.29
              UID: THE245.3.2.1.G.3
            - term: purgatory
              definition: the Afterlife place where, according to Roman Catholic teaching,
                the souls of the faithful are purified before entering heaven.
              paragraph: THE245.3.2.1.P.6
              page: 43
              UID: THE245.3.2.1.G.4
            - term: reincarnation
              definition: the passing of a human soul at death into a new body, either
                human or animal.
              paragraph: THE245.3.2.1.P.4
              page: 43
              UID: THE245.3.2.1.G.5
            - term: sheol
              definition: Old Testament Hebrew word for the place where the souls
                of the wicked go at death.
              paragraph: THE245.3.2.1.P.8
              UID: THE245.3.2.1.G.6
            - term: soul sleep
              definition: false belief that when one dies, the soul is in a state
                of stupor or goes completely out of existence. The teaching misinterprets
                Paul’s reference to sleep as a figure or image for physical death.
              paragraph: THE245.3.2.1.P.5
              page: 43
              UID: THE245.3.2.1.G.7
            - term: universalism
              definition: the belief that all humans, fallen angels, and even Satan
                will finally be saved and accept God’s blessing and love.
              paragraph: THE245.3.2.1.P.3
              page: 43
              UID: THE245.3.2.1.G.8
          3.2.2:
            last_modified: '2026-03-27'
            text: Explain the rewards of death for the believer.
            glossary: []
          3.2.3:
            last_modified: '2026-03-27'
            text: Identify the eternal resting places reserved for the wicked.
            glossary: []
