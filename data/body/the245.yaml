        choices:
          A: the end of all possible rebellion against God.
          B: that peace will reign in human relationships.
          C: that the new Jerusalem will descend to earth.
          D: that all temptations to sin will be done away with.
        answer: B
      - uid: THE245.13.1.1.F.1
        subobj: 13.1.1
        type: final
        question: At the end of the Millennium, Satan is
        choices:
          A: released from the Abyss to deceive and test one last time.
          B: allowed to go briefly before God and accuse the saints of wrongdoing.
          C: moved immediately from the Abyss into the lake of fire.
          D: powerless because his evil powers were destroyed at Calvary.
        answer: A
