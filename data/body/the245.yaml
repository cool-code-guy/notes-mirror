    glossary:
    - term: Abrahamic Covenant
      definition: God’s promises to Abraham, including a promised people, a promised
        blessing, and a promised land.
      chapter: 4
      paragraph: THE245.4.1.1.P.3
      page: 53
    - term: allegorize
      definition: to interpret extensive details as symbolic rather than literal.
      chapter: 11
      paragraph: THE245.1.2.1.P.25
      page: 20
    - term: allegory
      definition: a literary form that uses symbolic fictional characters and actions
        to emphasize general truth. Those who apply this method of interpreting prophecy
        look for a deeper “spiritual” meaning behind the actual descriptions.
      chapter: 1
      paragraph: THE245.1.2.1.P.19
      page: 19
    - term: amillennialism
      definition: literally “no Millennium.” Rather than a physical future reign of
        Christ on earth, this view spiritualizes the Millennium, identifying it as
        Christ’s reign in heaven throughout the present Church Age.
      chapter: 1
      paragraph: THE245.1.2.1.P.18
      page: 19
    - term: apocalypse
      definition: an unveiling or revealing of the future; Revelation is apocalyptic
        literature.
      chapter: 9
      paragraph: THE245.9.1.1.P.14
      page: 114
    - term: Armageddon
      definition: the final battle between Christ and the Antichrist (Revelation 16:16);
        takes place at the end of the Tribulation when Christ returns to earth to
        defeat Satan and his followers (second advent or coming).
      chapter: 10
      paragraph: THE245.10.1.1.P.1
      page: 125
    - term: Davidic Covenant
      definition: God’s promises to David, including an established house, kingdom,
        and throne forever.
      chapter: 4
      paragraph: THE245.4.1.1.P.20
      page: 55
    - term: Day of the Lord
      definition: the period of God’s judgment on evil and wickedness, beginning after
        the Rapture and ending after the Great White Throne Judgment.
      chapter: 7
      paragraph: THE245.5.1.1.P.25
      page: 65
    - term: dispensationalism
      definition: a teaching that God’s activity in history can be divided into seven
        dispensations or periods when God deals with humans according to a special
        standard.
      chapter: 11
      paragraph: THE245.11.3.1.P.1
      page: 140
    - term: divine attribute
      definition: a quality or characteristic of God, such as eternal, omnipotent,
        omnipresent, omniscient; also moral attributes such as holy, just, loving,
        and good.
      chapter: 2
    - term: dominion theology
      definition: the belief that the believer should have dominion over every area
        of human life because Christ provided that dominion through His death and
        resurrection.
      chapter: 11
      paragraph: THE245.11.2.1.P.11
      page: 139
    - term: eschatology
      definition: literally, “last things.” The branch of theology that is concerned
        with end-time events, particularly life after death, Bible events yet in the
        future, and the final state of the redeemed and the unsaved.
      chapter: 1
      paragraph: THE245.1.1.1.P.12
      page: 16
    - term: evil triad
      definition: Satan, the Antichrist, and the False Prophet.
      chapter: 8
      paragraph: THE245.8.1.1.P.2
      page: 101
    - term: futurist view of prophecy
      definition: a belief that unfulfilled biblical prophecies will literally be
        fulfilled in God’s end-time activity.
      chapter: 7
    - term: Gog
      definition: king of Magog who in latter days invades Israel from the north as
        recorded in Ezekiel 38 and 39.
      chapter: 10
      paragraph: THE245.10.1.1.P.14
    - term: Great White Throne Judgment
      definition: judgment of the wicked (including the resurrected wicked dead) at
        the end of the Millennium.
      chapter: 3
      paragraph: THE245.3.2.1.P.1
      page: 43
    - term: hades
      definition: the New Testament translation of the Hebrew Sheol, a place of torment
        and agony for the wicked.
      chapter: 3
      paragraph: THE245.3.2.1.P.12
      page: 44
    - term: historicist view of prophecy
      definition: views biblical prophecy as having been gradually fulfilled throughout
        church history.
      chapter: 7
    - term: humanism
      definition: a philosophy or way of life that values human achievements over
        submission to a supernatural God.
      chapter: 11
      paragraph: THE245.11.2.1.P.7
      page: 138
    - term: idealist view of prophecy
      definition: views biblical prophecy as symbolic description of the continuing
        conflict between good and evil, with good ultimately winning.
      chapter: 7
    - term: inerrancy
      definition: the assurance that the Bible is without error of any kind
      chapter: 1
      paragraph: THE245.1.3.1.P.2
      page: 21
    - term: intermediate state
      definition: the condition of believers and non-believers between death and their
        resurrection.
      chapter: 3
      paragraph: THE245.3.2.1.P.29
    - term: kingdom now
      definition: the belief that Christ’s kingdom exists on earth now, so believers
        should operate in the authority given by Christ.
      chapter: 11
      paragraph: THE245.11.2.1.P.11
      page: 139
    - term: kingdom of God / heaven
      definition: God’s reign over His creation; more specifically, God’s reign and
        rule in the world, the church, the hearts of believers, and ultimately in
        the Millennium and eternity.
      chapter: 12
    - term: literalist
      definition: a person who believes Bible prophecy will take place literally as
        described in Scripture.
      chapter: 1
      paragraph: THE245.1.3.1.P.12
      page: 23
    - term: mid-Tribulation rapture
      definition: Christ comes for the faithful during the Tribulation (many variations).
      chapter: 5
      paragraph: THE245.5.1.1.P.16
      page: 64
    - term: Mosaic Covenant
      definition: God’s covenant of the Old Testament law delivered through Moses
        at Mt. Sinai; Israel failed to keep the covenant.
      chapter: 4
      paragraph: THE245.4.1.1.P.14
      page: 54
    - term: New Covenant
      definition: God’s salvation covenant with Church Age believers; it supersedes
        the covenant of the law.
      chapter: 4
      paragraph: THE245.4.1.1.P.24
      page: 55
    - term: omnipotent
      definition: all-powerful. God is omnipotent.
      chapter: 6
      paragraph: THE245.6.2.1.P.13
      page: 83
    - term: patriarchal cultures
      definition: social customs that prevailed in the time of Old Testament ancestors
        of the Jewish people like Abraham, Isaac, and Jacob.
      chapter: 6
      paragraph: THE245.6.1.1.P.1
      page: 79
    - term: Pentateuch
      definition: the first five books of the Old Testament, attributed to Moses.
      chapter: 7
      paragraph: THE245.7.2.1.P.3
      page: 91
    - term: postmillennialism
      definition: the belief that the Millennium is actually the Church Age or period
        immediately following; a view that Christ reigns, but is not physically present
        during this period.
      chapter: 1
      paragraph: THE245.1.2.1.P.18
      page: 19
    - term: post-Tribulation rapture
      definition: Christ comes for the Church after the Tribulation.
      chapter: 5
      paragraph: THE245.5.1.1.P.14
      page: 64
    - term: premillennialists
      definition: those who teach that Jesus will physically return and establish
        His kingdom on earth for a thousand years.
      chapter: 8
      paragraph: THE245.1.3.1.P.3
      page: 21
    - term: preterist view of prophecy
      definition: views biblical prophecy as having already been fulfilled.
      chapter: 7
      paragraph: THE245.7.3.1.P.6
      page: 95
    - term: pre-Tribulation rapture
      definition: Christ comes for the church prior to the Tribulation.
      chapter: 5
      paragraph: THE245.5.1.1.P.19
      page: 65
    - term: pre-wrath Rapture
      definition: modified view of mid-Tribulation Rapture that places Rapture any
        time after middle of the seventh year on up to the Second Coming, if God’s
        wrath is poured out quickly when it is unleashed on those left on earth.
      chapter: 5
      paragraph: THE245.5.1.1.P.18
    - term: purgatory
      definition: the Afterlife place where, according to Roman Catholic teaching,
        the souls of the faithful are purified before entering heaven.
      chapter: 3
      paragraph: THE245.3.2.1.P.6
      page: 43
    - term: Rapture
      definition: literally “caught up” or “snatched up.” Christ’s sudden coming for
        His saints, bringing an end to the Church Age and ushering in the Tribulation.
      chapter: 1
      paragraph: THE245.1.1.1.P.13
    - term: reconstructionism
      definition: the teaching that the church is called to change (reconstruct) society
        so it conforms to Old and New Testament mandates; its mission is more than
        spiritual transformation of individuals.
      chapter: 11
      paragraph: THE245.11.2.1.P.11
      page: 139
    - term: reincarnation
      definition: the passing of a human soul at death into a new body, either human
        or animal.
      chapter: 3
      paragraph: THE245.3.2.1.P.4
      page: 43
    - term: revelation
      definition: God’s act of disclosing himself and His will. “The Revelation of
        Jesus Christ” is the full title of the last book of the Bible.
      chapter: 5
      paragraph: THE245.5.1.1.P.17
      page: 64
    - term: sanctification
      definition: progressive sanctification (as opposed to instant sanctification
        at salvation) is the process of becoming more and more like Jesus in our Christian
        walk.
      chapter: 6
      paragraph: THE245.6.1.1.P.7
      page: 79
    - term: Second Advent
      definition: another name for the Second Coming. “Advent” literally means arrival
        or coming. Jesus’ birth was the first advent.
      chapter: 5
      paragraph: THE245.5.3.1.P.1
      page: 68
    - term: Second Coming
      definition: Christ’s return to earth at the end of the Tribulation to defeat
        Satan and his hosts. The First Coming was when Jesus came to earth as a baby.
      chapter: 5
      paragraph: THE245.5.1.1.P.5
      page: 63
    - term: sheol
      definition: Old Testament Hebrew word for the place where the souls of the wicked
        go at death.
      chapter: 3
      paragraph: THE245.3.2.1.P.8
    - term: soul sleep
      definition: false belief that when one dies, the soul is in a state of stupor
        or goes completely out of existence. The teaching misinterprets Paul’s reference
        to sleep as a figure or image for physical death.
      chapter: 3
      paragraph: THE245.3.2.1.P.5
      page: 43
    - term: theocracy
      definition: a government administered by God or His representative.
      chapter: 11
      paragraph: THE245.11.2.1.P.13
      page: 139
    - term: theonomists
      definition: persons who believe society should be governed by God or subject
        to God’s authority.
      chapter: 11
    - term: Tribulation
      definition: seven-year period of time between the Rapture and Christ’s return
        to earth when God’s wrath is poured out. The last three and a half years are
        sometimes called the Great Tribulation.
      chapter: 5
      paragraph: THE245.5.1.1.P.5
      page: 63
    - term: ultradispensationalists
      definition: Dispensationalists who take extreme positions and find additional
        periods when God deals differently with humankind.
      chapter: 11
      paragraph: THE245.11.3.1.P.35
    - term: universalism
      definition: the belief that all humans, fallen angels, and even Satan will finally
        be saved and accept God’s blessing and love.
      chapter: 3
      paragraph: THE245.3.2.1.P.3
      page: 43
