      lessons:
      - last_modified: '2026-03-27'
        title: John’s Vision of the Seven Seals of Judgment
        subobjectives:
          9.1.1:
            last_modified: '2026-03-27'
            text: Indicate the significance and results of the broken seals.
            glossary:
