      print_page: 52
      lessons:
      - last_modified: '2026-03-27'
        title: The Covenants of the Old Testament
        subobjectives:
          4.1.1:
            last_modified: '2026-03-27'
            text: Give the rationale for conditions and promises in God’s covenant
              with Abraham.
            glossary:
            - term: Abrahamic Covenant
              definition: God’s promises to Abraham, including a promised people,
                a promised blessing, and a promised land.
              paragraph: THE245.4.1.1.P.3
              page: 53
              UID: THE245.4.1.1.G.1
            - term: Davidic Covenant
              definition: God’s promises to David, including an established house,
                kingdom, and throne forever.
              paragraph: THE245.4.1.1.P.20
              page: 55
              UID: THE245.4.1.1.G.2
            - term: Mosaic Covenant
              definition: God’s covenant of the Old Testament law delivered through
                Moses at Mt. Sinai; Israel failed to keep the covenant.
              paragraph: THE245.4.1.1.P.14
              page: 54
              UID: THE245.4.1.1.G.3
            - term: New Covenant
              definition: God’s salvation covenant with Church Age believers; it supersedes
                the covenant of the law.
              paragraph: THE245.4.1.1.P.24
              page: 55
              UID: THE245.4.1.1.G.4
          4.1.2:
            last_modified: '2026-03-27'
            text: Describe God’s renewal of the promise to Abraham with later generations.
            glossary: []
          4.1.3:
            last_modified: '2026-03-27'
            text: Explain how the Covenant of the Law, or the Mosaic Covenant, spoke
              to all of Israel.
            glossary: []
          4.1.4:
            last_modified: '2026-03-27'
            text: Outline the relationship of the Davidic Covenant to the line of
              Christ’s earthly birth.
            glossary: []
      - last_modified: '2026-03-27'
        title: The New Covenant Through Christ
        subobjectives:
