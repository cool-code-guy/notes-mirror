            last_modified: '2026-03-27'
            text: Distinguish between the New Covenant and the Covenant of the Law.
            glossary: []
          4.2.2:
            last_modified: '2026-03-27'
            text: Describe the provisions of the New Covenant.
            glossary: []
          4.2.3:
            last_modified: '2026-03-27'
            text: Point out the role of the Holy Spirit in the New Covenant.
            glossary: []
          4.2.4:
            last_modified: '2026-03-27'
            text: Explain the culmination of the Old Testament covenants.
            glossary: []
