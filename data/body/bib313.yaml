            last_modified: '2026-03-27'
            text: Describe the moral situation that called for immediate discipline.
            glossary: []
          2.1.2:
            last_modified: '2026-03-27'
            text: Identify four reasons church discipline is needed today.
            glossary: []
      - last_modified: '2026-03-27'
        title: Legal Disputes and Immorality (6:1–20)
        subobjectives:
          2.2.1:
            last_modified: '2026-03-27'
            text: Explain how and why Paul uses eschatological grounds to rebuke the
              Corinthians.
            glossary: []
          2.2.2:
            last_modified: '2026-03-27'
            text: Identify and illustrate ways Christians’ end-time destiny should
              affect their present conduct.
            glossary: []
      - last_modified: '2026-03-27'
        title: Marriage (7:1–40)
        subobjectives:
          2.3.1:
            last_modified: '2026-03-27'
            text: Explain why the Corinthians failed to understand God’s plan for
              sexual fulfillment in marriage.
            glossary:
            - term: asceticism
              definition: the practice of strict (and often extreme) self-denial to
                advance a person’s spiritual development; usually included denial
                or delay of certain physical needs or desires to devote oneself to
                spiritual matters
              paragraph: BIB313.2.3.1.P.2
              page: 34
              UID: BIB313.2.3.1.G.1
            - term: libertinism
              definition: a belief that faith in Christ frees one from all moral obligations
                of the law. Coupled with the Greek notion that a person’s body and
                spirit are radically separate, it often led to sexual immorality.
              paragraph: BIB313.2.3.1.P.2
              page: 34
              UID: BIB313.2.3.1.G.2
            - term: sanctified
              definition: Hebrew qadash or Greek hagiazo ; set apart or consecrated
                to God’s holy use or purpose
              paragraph: BIB313.2.3.1.P.9
              page: 35
              UID: BIB313.2.3.1.G.3
          2.3.2:
            last_modified: '2026-03-27'
            text: Summarize Paul’s advice to those who consider remaining unmarried.
            glossary: []
          2.3.3:
            last_modified: '2026-03-27'
            text: Explain why Paul counsels against divorce.
            glossary: []
    - last_modified: '2026-05-28'
      title: 3 - Christian Choices (1 Corinthians 8–10)
      print_page: 39
      intro_body:
      - text: In chapters 8–10, Paul continues to respond to questions regarding ethical
          issues in the church. The discussion shifts specifically to believers’ liberty
          in eating food offered to idols. Essentially, some things in Scripture are
          clearly right or clearly wrong; other issues are a matter of conscience.
          Paul suggests to the Corinthian saints that in matters of conscience, they
          must be sensitive to the potentially adverse effects of their actions on
          others, particularly on weaker believers. They should not allow their own
          personal liberties to offend or discourage others. Love must be the principal
          motivation.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH3.INTRO.P.1
      - text: Read 1 Corinthians 8–10 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Center-Header
        md: '*Read 1 Corinthians 8–10 before you begin study in this chapter.*'
        UID: BIB313.CH3.INTRO.P.2
      lessons:
