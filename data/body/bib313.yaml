    - last_modified: '2026-05-28'
      title: 6 - Christian Doctrine (1 Corinthians 15–16)
      print_page: 67
      intro_body:
      - text: 'This section in our study of 1 Corinthians takes an in-depth look at
          the doctrine concerning the resurrection of the dead. The resurrection would
          have been a disputed doctrine among the Corinthian believers for two reasons:
          (1) Greek philosophy, with its arrogance in human reasoning, scoffed at
          the idea of the dead being resurrected, and (2) the Jewish sect of the Sadducees
          rejected the resurrection of the dead.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH6.INTRO.P.1
      - text: These schools of influence created confusion and uncertainty among the
          Christians in Corinth. Thus, the assurance and hope of the resurrection
          is the pervasive truth that Paul desired to leave with the Corinthian believers.
          Surely a deep conviction of this ultimate reality would go far to put all
          other issues and problems in the perspective of eternity.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH6.INTRO.P.2
      - text: Read 1 Corinthians 15–16 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Center-Header
        md: '*Read 1 Corinthians* *15–16* *before you begin study in this chapter.*'
        UID: BIB313.CH6.INTRO.P.3
      lessons:
      - last_modified: '2026-05-28'
        title: Truths About the Resurrection (15:1–58)
        subobjectives:
          6.1.1:
            last_modified: '2026-08-21'
            text: Describe the doctrinal error that caused Paul to teach on the resurrection.
            glossary:
            - term: apocalyptic
              definition: relating to the end-time; describes visionary prophecy that
                deals with God’s ultimate triumph over sin and death at the end of
                the age, or human history as we know it
              paragraph: BIB313.6.1.1.P.11
              page: 69
              UID: BIB313.6.1.1.G.1
            - term: Rapture
              definition: also called the “blessed hope” (Titus 2:13); an event associated
                with Christ’s second coming that includes a resurrection of the believers
                who have died, who, along with believers who are alive at His return,
                will be caught up in the clouds to meet the Lord
              paragraph: BIB313.6.1.1.P.11
              page: 69
              UID: BIB313.6.1.1.G.2
          6.1.2:
            last_modified: '2026-08-21'
            text: Identify what is at stake if Christ was not bodily raised from the
              dead.
            glossary: []
          6.1.3:
            last_modified: '2026-08-21'
            text: Explain the event that will signal Christ’s ultimate conquest of
              death and the realization of the Christian’s hope.
