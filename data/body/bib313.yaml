    - last_modified: '2026-05-28'
      title: 10 - Paul Confronts His Critics (2 Corinthians 10:1–11:15)
      print_page: 107
      intro_body:
      - text: Most of 2 Corinthians touches on the attacks of Paul’s critics and the
          charges they lay at his doorstep. However, the apostle now takes these opponents
          head-on in a lengthy defense of his apostolic ministry. While his critics
          question the legitimacy of his apostolic office, Paul devotes considerable
          time to defending himself personally. Kruse notes that the “crisis Paul
          faced in this situation was the most crucial in all his relationships with
          the Corinthians” (1987, 170). Therefore, it is understandable that Paul’s
          tone would be marked by strains of satire. It is this mockery that prompts
          Paul to engage in boasting against his opponents, boasts that we will soon
          learn are steeped in sarcasm.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH10.INTRO.P.1
      - text: Read 2 Corinthians 10:1–11:15 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Center-Header
        md: '*Read 2 Corinthians* *10:1–11:15* *before you begin study in this chapter.*'
        UID: BIB313.CH10.INTRO.P.2
      lessons:
      - last_modified: '2026-03-27'
        title: True Apostolic Authority (10:1–11)
        subobjectives:
          10.1.1:
            last_modified: '2026-03-27'
            text: Assess Paul’s opponents’ criticism and misunderstanding of apostolic
              authority.
            glossary:
            - term: apostolic authority
              definition: the authority possessed by the apostles, that is, those
                of Jesus’ disciples chosen to testify of the risen Christ and to recall
                and transmit His teachings to the church through the power of the
                Spirit (John 14:26; 15:26–27; 16:14; Matthew 28:18–20)
              paragraph: BIB313.10.1.1.P.11
              UID: BIB313.10.1.1.G.1
              page: 91
            - term: canon
              definition: The recognized collection of books that the church accepts
                as Scripture. These books are regarded as inspired by God and authoritative
                for faith, doctrine, and practice. For Christians, the biblical canon
                consists of the Old Testament and the New Testament.
              paragraph: BIB313.10.1.1.P.12
              page: 109
              UID: BIB313.10.1.1.G.2
          10.1.2:
            last_modified: '2026-03-27'
            text: Identify truths Paul teaches about apostolic authority.
            glossary: []
      - last_modified: '2026-03-27'
        title: To Boast or Not to Boast (10:12–18)
        subobjectives:
          10.2.1:
            last_modified: '2026-03-27'
            text: Analyze 2 Corinthians 10:12–18, and describe boasting that is acceptable
              for believers.
            glossary: []
      - last_modified: '2026-05-28'
