    - last_modified: '2026-05-28'
      title: 9 - The Macedonian Collection (2 Corinthians 8–9)
      print_page: 97
      intro_body:
      - text: Concern for the poor had been one of Paul’s priorities from the time
          his apostleship was confirmed by the other apostles in Jerusalem (Galatians
          2:9–10). In this instance, Judea had fallen on hard times due to a famine,
          and many believers were afflicted (Acts 11:28–29). To help, Paul had been
          collecting money gifts for the saints in Jerusalem for some time. 1 Paul
          felt that the Gentile churches owed a debt of gratitude to the Jerusalem
          church for their role in bringing the other congregations to faith in Jesus
          (Romans 11:13–25; 15:27). Undoubtedly, he saw this offering as a powerful
          symbol of the spiritual unity of both Jews and Gentiles in Christ (Ephesians
          2:13–18).
        kind: prose
        cls: IST_Body-Indent
        md: Concern for the poor had been one of Paul’s priorities from the time his
          apostleship was confirmed by the other apostles in Jerusalem (Galatians
          2:9–10). In this instance, Judea had fallen on hard times due to a famine,
          and many believers were afflicted (Acts 11:28–29). To help, Paul had been
          collecting money gifts for the saints in Jerusalem for some time.1 Paul
          felt that the Gentile churches owed a debt of gratitude to the Jerusalem
          church for their role in bringing the other congregations to faith in Jesus
          (Romans 11:13–25; 15:27). Undoubtedly, he saw this offering as a powerful
          symbol of the spiritual unity of both Jews and Gentiles in Christ (Ephesians
          2:13–18).
        UID: BIB313.CH9.INTRO.P.1
      - text: The Corinthians had begun an offering (2 Corinthians 8:6; 1 Corinthians
          16:1–4), but it had stalled, probably due to the conflicts in the church.
          Now with the good news from Titus, Paul feels confident that he can urge
          them to complete their offering.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH9.INTRO.P.2
