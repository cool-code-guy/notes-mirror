    - last_modified: '2026-05-28'
      title: 7 - Paul’s Recent Past Revisited (2 Corinthians 1:1–2:11)
      print_page: 77
      intro_body:
      - text: Paul wrote 2 Corinthians from somewhere in Macedonia, probably Philippi,
          in AD 56 during his third missionary journey (when compared with Philippians
          4:15, Macedonia in 2 Corinthians 11:9 seems to refer to Philippi). He most
          likely wrote it shortly after Titus joined him in Macedonia as described
          in 2 Corinthians 7:5–7.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH7.INTRO.P.1
      - text: Paul first visited Corinth in AD 51 (Carson, Moo, and Morris 1992, 223–231)
          during his second missionary journey and founded the church there. Through
          the gospel, he had become their spiritual father (1 Corinthians 4:15). But
          his relationship with the church was a stormy one and not without its problems.
          Outsiders who wanted the title, prestige, and power for themselves brought
          a serious challenge to his apostleship (2 Corinthians 11:12–13). Thus, Paul
          opens his letter with a clear declaration of his apostleship, which is the
          result of God’s choosing (Acts 9:15) and intervention in Paul’s life (Galatians
          1:15–16).
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH7.INTRO.P.2
      - text: Read 1 Corinthians 1:1–2:11 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Center-Header
        md: '*Read 1 Corinthians* *1:1–2:11* *before you begin study in this chapter.*'
        UID: BIB313.CH7.INTRO.P.3
