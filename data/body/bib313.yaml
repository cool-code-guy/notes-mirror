              divisions.
            glossary: []
    - last_modified: '2026-03-27'
      title: 2 - Christian Conduct (1 Corinthians 5–7)
      print_page: 29
      intro_body:
      - text: In 1 Corinthians 5–7, Paul addresses the moral and ethical behaviors
          that members of the church at Corinth were practicing. One situation was
          so despicable that the apostle described it as a sin worse than even that
          of pagans. As we continue to study God’s Word regarding the issues in the
          Corinthian church, we must pay attention to the principles the Spirit teaches
          through Paul. Some of us may never be confronted with incestuous relationships
          in our congregations, but we will face other situations involving questions
          of social and spiritual integrity. The principles in this chapter will serve
          as a guide in addressing these issues.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH2.INTRO.P.1
      - text: Read 1 Corinthians 5–7 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Center-Header
        md: '*Read 1 Corinthians 5–7 before you begin study in this chapter.*'
        UID: BIB313.CH2.INTRO.P.2
      lessons:
