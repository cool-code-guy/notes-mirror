              the character of their ministry.
            glossary: []
    - last_modified: '2026-05-28'
      title: 11 - Strange Boastings (2 Corinthians 11:16–13:14)
      print_page: 117
      intro_body:
      - text: Paul is well aware that not only is his apostleship under attack but,
          more importantly, the integrity of the gospel is being threatened. So after
          apologizing for stooping to his opponents’ level, he continues to defend
          the legitimacy of his ministry by engaging in “foolish” boasting. The list
          of accomplishments includes his ethnic qualifications, trials and sufferings,
          experiences of great revelation, and ultimate proof of apostleship.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH11.INTRO.P.1
      - text: Unfortunately, Paul’s defense did not signal an end to false teachers.
          The church today is even more susceptible to the dangers of false teaching.
          Thus, Christian leaders must be vigilant stewards of the gospel of Jesus
          Christ and must teach their congregations to be equally guarded about the
          integrity of the gospel.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH11.INTRO.P.2
      - text: Read 2 Corinthians 11:16–13:14 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Center-Header
        md: '*Read 2 Corinthians* *11:16–13:14* *before you begin study in this chapter.*'
        UID: BIB313.CH11.INTRO.P.3
      lessons:
      - last_modified: '2026-05-28'
        title: Paul’s Boasts (11–12)
        subobjectives:
          11.1.1:
            last_modified: '2026-05-28'
            text: Describe ways in which Paul’s boasts differ from those of his opponents.
            glossary: []
          11.1.2:
            last_modified: '2026-03-27'
