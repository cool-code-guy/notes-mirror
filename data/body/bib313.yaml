    - last_modified: '2026-05-28'
      title: 8 - Paul’s Apostolic Ministry (2 Corinthians 2:12–7:16)
      print_page: 85
      intro_body:
      - text: 2 Corinthians 2:12–7:16 focuses on Paul’s apostolic ministry under the
          new covenant. Within this text are bits of key evidence pointing to the
          reason Paul is writing this letter. False apostles who have infiltrated
          the Corinthian church are having some success in convincing the Christians
          to follow their leadership rather than Paul’s. Paul’s eloquent description
          of his Christ-centered ministry is an important part of his purpose to expose
          these troublemakers as false workmen.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH8.INTRO.P.1
      - text: As you study this lesson, keep in mind that Paul wrote 2 Corinthians
          in the early years of the church when Jewish believers still struggled to
          let go of thousands of years of teaching and beliefs. Many refused to entirely
          let go of their dependence on the Law for salvation and created numerous
          problems by trying to convince others of their views. Apparently, the false
          apostles Paul is encountering are of this persuasion, and Paul is eager
          to demonstrate the superiority of the new covenant under which he ministers
          for Christ.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH8.INTRO.P.2
      - text: Read 2 Corinthians 2:12–7:16 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Center-Header
        md: '*Read 2 Corinthians* *2:12–7:16* *before you begin study in this chapter.*'
        UID: BIB313.CH8.INTRO.P.3
      lessons:
