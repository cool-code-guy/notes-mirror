    - last_modified: '2026-05-28'
      title: 4 - Christian Worship (1 Corinthians 11:2–12:11)
      print_page: 49
      intro_body:
      - text: The circumstances behind 1 Corinthians 11 have made it difficult for
          modern readers to see Paul’s respect and appreciation for women. However,
          the great majority of commentators agree that most of the apostle’s instructions
          here concern local and temporary social customs. Understanding how these
          customs relate to spiritual principles is the challenge for the contemporary
          reader.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH4.INTRO.P.1
      - text: Later in the chapter, Paul responds to reports that the Corinthians’
          celebration of the Lord’s Supper had become a deplorable fanfare of greed
          and self-indulgence. Then, Paul teaches about spiritual gifts. His message
          promotes the truth that “the manifestations of the Holy Spirit have both
          unity and variety” (Carlson, Hamar, and Wisehart 1989, 413). This demonstration
          of oneness in diversity is a fundamental concept that the Corinthian body
          needs to understand.
        kind: prose
        cls: IST_Body-Indent
