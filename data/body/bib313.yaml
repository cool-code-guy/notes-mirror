    title: Corinthian Correspondence
    units:
    - title: Guidelines for Daily Living (1 Corinthians 1–10)
      chapters:
      - 1
      - 2
      - 3
      intro_body:
      - text: Imagine that you are a pastor, and three friends have shown up on your
          doorstep with a strange request. These friends are members of a church you
          founded years ago. Your time as their pastor was lengthy, and when you left
          the church, it was strong and growing. Now your friends say the church is
          full of problems that can no longer be ignored. The church had several pastors
          after you, each with their own peculiar teachings. As a result, the church
          has moved dangerously away from the truth and has embraced unbiblical teachings.
          Other issues that have arisen because of those teachings threaten the church’s
          spiritual well-being. In an effort to solve their problems, the church has
          held a meeting and formed a committee. The committee chose your three friends
          to visit you and ask you to address a list of questions related to their
          problems. Since you are their founding pastor and are well respected, they
          trust your wisdom and counsel Meanwhile, you have also received reports
          from other parties regarding problems in the church (1 Corinthians 1:11;
          5:1). The church you founded is clearly in trouble.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.UNIT1.INTRO.P.1
      - text: However unlikely the above story seems, it is very close to picturing
          what the apostle Paul faced when writing 1 Corinthians. Paul founded the
          church at Corinth during his second missionary journey. When he left, the
          church was a vibrant, growing community. Now he learns from a Corinthian
          delegation (1 Corinthians 1:11; 16:17) that a multitude of problems exist.
          To a large extent, these problems arose because the Corinthians adopted
          beliefs, values, and attitudes that produced unchristian conduct. They forgot
          and misunderstood much of what Paul had taught them.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.UNIT1.INTRO.P.2
      - text: Paul’s pastoral heart cannot ignore their situation. He writes them
          a letter addressing their concerns and teaches valuable principles for daily
          living as a Christian.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.UNIT1.INTRO.P.3
    - title: Guidelines for Worshipping and Believing (1 Corinthians 11–16)
      chapters:
      - 4
      - 5
      - 6
      intro_body:
      - text: In 1 Corinthians 4:15, we learned that Paul founded the church at Corinth.
          Although Acts records no correspondence with the Corinthians, Paul’s epistles
          indicate that he wrote to them several times (Hernando 1999, 916–917). Acts
          records two visits of Paul to Corinth (Acts 18:1; 20:2), and 2 Corinthians
          13:1 suggests a third. On at least one occasion (Acts 18:11), Paul ministered
          there for eighteen months. Here was a church that the apostle knew well
          and loved. Moreover, despite the controversies and problems, this was a
          church that recognized Paul as their “spiritual father” and sought his counsel
          on a number of issues.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.UNIT2.INTRO.P.1
      - text: 'In this section of the epistle, we see two categories of issues: liturgy
          and doctrine. The first occupies most of Paul’s attention, since it seems
          that the Corinthian church had many questions relating to worship. Students
          of Paul’s letters recognize that it is not easy to separate worship from
          doctrine. In fact, some of Paul’s most profound theology arises in portions
          of his letters dealing with practical problems or situations. In 1 Corinthians
          12–14, we encounter a major component of Paul’s understanding of the Holy
          Spirit and His work in the church. In chapter 15, Paul deals with the doctrine
          of the resurrection and presents its centrality to the Christian faith.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.UNIT2.INTRO.P.2
    - title: Paul’s Apostolic Ministry (2 Corinthians 1–9)
      chapters:
      - 7
      - 8
      - 9
      intro_body:
      - text: Identifying the time frame and the condition of the believing community
          at Corinth is important in understanding the relationship between Paul and
          the church. About one or two years have elapsed between his writing of 1
          and 2 Corinthians. The first of these two letters emphasizes righteous relationships
          among members of the body of Christ. The latter stresses the relationship
          between the Body and Paul, its spiritual leader. Paul writes a major portion
          of 2 Corinthians to express his relief that the “sorrowful letter” and Titus’s
          mission have been a success. Then, as Paul continues his pastoral concern
          for the church, he takes time to defend his ministry and apostleship and
          to teach the Corinthians principles about giving.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.UNIT3.INTRO.P.1
    - title: In Defense of Apostolic Authority (2 Corinthians 10–13)
      chapters:
      - 10
      - 11
      intro_body:
      - text: In the closing chapters of 2 Corinthians, Paul switches gears to address
          the accusations of false teachers and their adherents who challenge his
          apostolic authority. The change of tone in chapter 10 is appropriate for
          the issues Paul addresses and the style of argument common in his day. Paul
          has no intention of letting false teachers corrupt the gospel. In fact,
          Paul takes the problem of false teachers working in the church to mislead
          and confuse people so seriously that he challenges the Corinthians to see
          if they are in right relationship to the faith and to Christ. These final
          chapters of 2 Corinthians are a powerful warning to those who preached a
          different gospel at Corinth as well as those who accepted this erroneous
          teaching.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.UNIT4.INTRO.P.1
    glossary:
    - term: apocalyptic
      definition: relating to the end-time; describes visionary prophecy that deals
        with God’s ultimate triumph over sin and death at the end of the age, or human
        history as we know it
      chapter: 6
      paragraph: BIB313.6.1.1.P.11
      page: 69
    - term: apostolic authority
      definition: the authority possessed by the apostles, that is, those of Jesus’
        disciples chosen to testify of the risen Christ and to recall and transmit
        His teachings to the church through the power of the Spirit (John 14:26; 15:26–27;
        16:14; Matthew 28:18–20)
      chapter: 10
      paragraph: BIB313.10.1.1.P.11
      page: 91
    - term: asceticism
      definition: the practice of strict (and often extreme) self-denial to advance
        a person’s spiritual development; usually included denial or delay of certain
        physical needs or desires to devote oneself to spiritual matters
      chapter: 2
      paragraph: BIB313.2.3.1.P.2
      page: 34
    - term: Asia Minor
      definition: the ancient region equivalent to the modern nation of Turkey. The
        Greeks referred to this region simply as “Asia”; however, more commonly Asia
        referred to the western part of Asia Minor, with its major city of Ephesus.
      chapter: 1
      paragraph: BIB313.1.1.1.P.5
      page: 18
    - term: canon
      definition: The recognized collection of books that the church accepts as Scripture.
        These books are regarded as inspired by God and authoritative for faith, doctrine,
        and practice. For Christians, the biblical canon consists of the Old Testament
        and the New Testament.
      chapter: 1
      paragraph: BIB313.10.1.1.P.12
      page: 109
    - term: Corinth
      definition: a Greek city located on the isthmus between central Greece and the
        southern section know as Pelopponesus. Harbors on both the Corinthian and
        Saronic gulfs gave it strategic location to control the major trade routes.
        In Paul’s day, it was a Roman colony, very prosperous and home to the Temple
        of Aphrodite. It was also notorious for its immorality, even among the Greeks.
      chapter: 1
      paragraph: BIB313.1.1.1.P.1
      page: 18
    - term: Eucharist
      definition: the rite of Holy Communion or the Lord’s Supper; taken from the
        Greek word eucharistein , which means “to give thanks”; commemorates Jesus’
        giving of thanks before blessing the bread and cup at the Passover meal (Matthew
        26:27; Luke 22:17–19)
      chapter: 4
      paragraph: BIB313.4.2.1.P.4
      page: 52
    - term: glory
      definition: a complex term stemming from the Hebrew word kabod , which often
        referred to the revealed presence and power of God in a variety of forms.
        Paul similarly uses the Greek word doxa in 2 Corinthians to refer to the display
        or revelation of God’s true nature, presence, and power, especially as revealed
        in Christ and through the work of the Spirit.
      chapter: 8
      paragraph: BIB313.8.1.1.P.11
      page: 87
    - term: Gospel of Thomas
      definition: A non-canonical collection of sayings attributed to Jesus, likely
        written in the second century. It lacks a narrative of Jesus’ life, death,
        and resurrection and reflects theological views that differ from Scripture.
        The Early Church rejected it as authoritative because it does not meet the
        standards of apostolic authorship and orthodox teaching. It may be studied
        for historical interest but does not carry doctrinal authority, since the
        Bible alone is the inspired rule of faith and practice.
      chapter: 1
    - term: incarnation
      definition: God the Son’s taking upon himself a complete human nature and existence
        in the person of Jesus Christ for the divine purpose of redemption
      chapter: 4
      paragraph: BIB313.4.1.1.P.10
    - term: libertinism
      definition: a belief that faith in Christ frees one from all moral obligations
        of the law. Coupled with the Greek notion that a person’s body and spirit
        are radically separate, it often led to sexual immorality.
      chapter: 2
      paragraph: BIB313.2.3.1.P.2
      page: 34
    - term: liturgical
      definition: pertaining to the practice of rites and customs within the church
      chapter: 1
      paragraph: BIB313.1.1.1.P.35
      page: 19
    - term: Palestine
      definition: An ancient term originally designating the territory of the Philistines
        (Israel’s enemies) that the Hebrews conquered and occupied after the Exodus;
        originally extended from Dan in the north to Beersheba in the south and from
        the Mediterranean Sea in the west to territory east of the Jordan River. This
        descriptive term has been used since the fifth century
      chapter: 1
      paragraph: BIB313.1.1.1.P.4.1
      page: 18
    - term: philosophy
      definition: the intellectual pursuit of knowledge, wisdom, and truth
      chapter: 1
      paragraph: BIB313.1.1.1.P.39
      page: 20
    - term: Rapture
      definition: also called the “blessed hope” (Titus 2:13); an event associated
        with Christ’s second coming that includes a resurrection of the believers
        who have died, who, along with believers who are alive at His return, will
