    - last_modified: '2026-05-28'
      title: 1 - Unchristian Conduct and Attitudes (1 Corinthians 1–4)
      print_page: 17
      intro_body:
      - text: Corinth was the hub of commerce and art in the ancient world, and while
          the city boasted of its wealth and social progression, it was also a morally
          base society. But God had prompted Paul to start a church there, a church
          that would become a positive and negative example to Christians everywhere.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH1.INTRO.P.1
      - text: In writing to this congregation, Paul first addresses the lack of unity
          among the Corinthian Christians. The disunity centered on which spiritual
          leader the believers should follow. Apollos was an impressive orator; Paul
          was a man of powerful demonstrations of the Spirit; Cephas or Peter was
          the hero of Pentecost (Carlson, Hamar, and Wisehart 1989, 267); and Christ
          . . . well, of course, He needs no introduction. Rather than celebrating
          the diversity in leadership and uniting as one body, many Corinthian believers
          separated themselves in various factions surrounding each leader. Thus,
          Paul sought to teach them the importance of unity under Christ.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH1.INTRO.P.2
      - text: Read 1 Corinthians 1–4 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Center-Header
        md: '*Read 1 Corinthians 1–4 before you begin study in this chapter.*'
        UID: BIB313.CH1.INTRO.P.3
      lessons:
      - last_modified: '2026-05-28'
        title: Introduction and Background to 1 Corinthians (1:1–9)
        subobjectives:
          1.1.1:
            last_modified: '2026-03-27'
            text: Summarize facts related to the authorship of 1 Corinthians.
            glossary:
            - term: Asia Minor
              definition: the ancient region equivalent to the modern nation of Turkey.
                The Greeks referred to this region simply as “Asia”; however, more
                commonly Asia referred to the western part of Asia Minor, with its
                major city of Ephesus.
              paragraph: BIB313.1.1.1.P.5
              page: 18
              UID: BIB313.1.1.1.G.1
            - term: Corinth
              definition: a Greek city located on the isthmus between central Greece
                and the southern section know as Pelopponesus. Harbors on both the
                Corinthian and Saronic gulfs gave it strategic location to control
                the major trade routes. In Paul’s day, it was a Roman colony, very
                prosperous and home to the Temple of Aphrodite. It was also notorious
                for its immorality, even among the Greeks.
              paragraph: BIB313.1.1.1.P.1
              page: 18
              UID: BIB313.1.1.1.G.2
            - term: liturgical
              definition: pertaining to the practice of rites and customs within the
                church
              paragraph: BIB313.1.1.1.P.35
              page: 19
              UID: BIB313.1.1.1.G.3
            - term: Palestine
              definition: An ancient term originally designating the territory of
                the Philistines (Israel’s enemies) that the Hebrews conquered and
                occupied after the Exodus; originally extended from Dan in the north
                to Beersheba in the south and from the Mediterranean Sea in the west
                to territory east of the Jordan River. This descriptive term has been
                used since the fifth century
              paragraph: BIB313.1.1.1.P.4.1
              page: 18
              UID: BIB313.1.1.1.G.4
            - term: philosophy
              definition: the intellectual pursuit of knowledge, wisdom, and truth
              paragraph: BIB313.1.1.1.P.39
              page: 20
              UID: BIB313.1.1.1.G.5
          1.1.2:
            last_modified: '2026-03-27'
            text: Identify the problematic questions and issues Paul addresses in
              this letter.
            glossary: []
          1.1.3:
            last_modified: '2026-05-28'
            text: Describe how the Corinthian church could be called a blessed church.
            glossary: []
