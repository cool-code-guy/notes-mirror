    - last_modified: '2026-05-28'
      title: 5 - Christian Relationships and Spiritual Gifts (1 Corinthians 12:12–14:40)
      print_page: 57
      intro_body:
      - text: The human body has hundreds of muscles, bones, tendons, and ligaments,
          in addition to almost a dozen organ systems. Yet each part works in conjunction
          with the others. Similarly, God designed the body of Christ—with millions
          of local churches and members worldwide—to work in synchrony, amid its obvious
          diversity.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH5.INTRO.P.1
      - text: As the Church universal then lives out this unity, the Holy Spirit will
          continue to produce in us attitudes, motives, and behaviors that reflect
          the love of God. When this love motivates and controls the operation of
          spiritual gifts, all things will be done decently to the glory of the Father.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB313.CH5.INTRO.P.2
      - text: Read 1 Corinthians 12:12–14:40 before you begin study in this chapter.
