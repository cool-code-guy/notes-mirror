      title: 3 - The Book of Job
      print_page: 47
      intro_body:
      - text: The book of Job is a literary masterpiece. The themes and personalities
          give glimpses into the theology of the day. The debates over whether Job
          deserves what he suffers are motivated by both indignation and fear. God’s
          final responses to Job’s demands for an audience are satisfying, not because
          they are answered, but because His arrival in a personal encounter makes
          answers unnecessary.
        kind: prose
