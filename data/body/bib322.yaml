    - last_modified: '2026-05-28'
      title: 6 - The Book of Proverbs
      print_page: 91
      intro_body:
      - text: A mother scolds, “Idle hands are a devil’s workshop,” as she interrupts
          her children in the act of smearing mud on the side of the house to help
          “build” the house. Once the siding is free of mud, she hurries them off
          to clean their rooms.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.CH6.INTRO.P.1
      - text: A businessman selecting supplies for his office observes eager customers
          flocking toward an animated salesperson and mutters, “A fool and his money
          are soon parted.”
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.CH6.INTRO.P.2
      - text: Both the mother and the businessman are using proverbs, the mother to
          teach her children about staying busy with constructive activity, and the
          businessman to remind himself to make wise use of his money.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.CH6.INTRO.P.3
      - text: The Bible is no stranger to proverbs. In fact, in addition to proverbs
          scattered throughout Scripture, an entire book of the Bible is dedicated
          to listing proverbs from a variety of sources.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.CH6.INTRO.P.4
      - text: 'Old Testament literature can be divided into three categories: the
          Law, the Prophets, and the Writings. The last category—the Writings—includes
          the poetic books of the Bible. Similarly, ancient Israel had three categories
          of ministers: priests, prophets, and wise men. Wise men were gifted by God
          with the ability to provide counsel and godly wisdom. Much of their wisdom
          was preserved in the Writings and became part of the canon of Scripture
          known as the book of Proverbs.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.CH6.INTRO.P.5
      lessons:
      - last_modified: '2026-05-28'
        title: Introduction to Proverbs
        subobjectives:
          6.1.1:
            last_modified: '2026-05-28'
            text: Define the word proverb and the forms mashal can take in Scripture.
            glossary:
            - term: byword
              definition: a short, familiar, or popular saying expressing a wise thought
              paragraph: BIB322.6.1.1.P.2
              page: 79
              UID: BIB322.6.1.1.G.1
            - term: mashal
              definition: originally, a comparison; to compare or to be like; a short
                sentence or phrase, often repeated, that expresses a commonly known
                fact learned by experience or observation; a byword; a name often
                repeated and frequently used as a reproach or indication of contempt.
                The Hebrew use of the mashal also includes prophetic allegory, oracles,
                the discourses of Job, a lament, and an active curse.
              paragraph: BIB322.6.1.1.P.2
              page: 79
              UID: BIB322.6.1.1.G.2
            - term: prophetic allegory
              definition: a fiction story in which the figures represent a principle
                or truth about something that will happen in the future
              paragraph: BIB322.6.1.1.P.7.1
              UID: BIB322.6.1.1.G.3
            - term: proverb
              definition: a short sentence often repeated, expressing a well-known
                truth or common fact learned by experience or observation
              paragraph: BIB322.6.1.1.P.1
              page: 79
              UID: BIB322.6.1.1.G.4
          6.1.2:
            last_modified: '2026-05-28'
            text: Identify the structure of the book of Proverbs.
            glossary: []
