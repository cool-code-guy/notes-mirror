      title: 2 - Wisdom in Poetry
      print_page: 29
      intro_body:
      - text: Wisdom literature makes up a significant portion of the poetic books.
          These books contain some of the most interesting material in Scripture.
          Certain elements are straightforward, addressing issues that can be easily
          understood. At other times, the authors struggle with questions about God
          and the meaning of life that require careful thought and seem to present
          no easy answers.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.CH2.INTRO.P.1
