      - last_modified: '2026-03-27'
        title: Recognizing Poetic Devices
        subobjectives:
          1.3.1:
            last_modified: '2026-03-27'
            text: Describe poetic devices of Hebrew poetry.
            glossary:
            - term: antithetic parallelism
              definition: parallelism in which one part reflects the antithesis (opposite)
                of the first
              paragraph: BIB322.1.3.1.P.23
              page: 20
              UID: BIB322.1.3.1.G.1
            - term: chiasm
              definition: arrangement of a poem’s words and phrases so the second
                half of the poem creates a mirror image of the first, in reverse order
              paragraph: BIB322.1.3.1.P.64
              UID: BIB322.1.3.1.G.2
              page: 21
            - term: conventions
              definition: methods that most people accept and follow; in regard to
                language, refers to techniques, rules, and practices
              paragraph: BIB322.1.3.1.P.40.1
              UID: BIB322.1.3.1.G.3
              page: 21
            - term: dynamic equivalence
              definition: following the conventions of the English language when translating
                Scripture
              paragraph: BIB322.1.3.1.P.40.1
              UID: BIB322.1.3.1.G.4
              page: 21
            - term: emblematic parallelism
              definition: parallel thoughts in a poetic line that form a simile or
                metaphor
              paragraph: BIB322.1.3.1.P.30
              page: 20
              UID: BIB322.1.3.1.G.5
            - term: formal equivalence
              definition: following the conventions of the original language of Scripture
                when translating into English
              paragraph: BIB322.1.3.1.P.40.1
              UID: BIB322.1.3.1.G.13
            - term: metaphor
              definition: a word or phrase meaning one kind of object or idea that
                is used in place of another to suggest they are similar
              paragraph: BIB322.1.3.1.P.31.1
              UID: BIB322.1.3.1.G.7
              page: 20
            - term: repetition
              definition: a restatement of something; a common device used in Hebrew
                poetry
              paragraph: BIB322.1.3.1.P.52
              UID: BIB322.1.3.1.G.8
              page: 19
            - term: simile
              definition: a comparison between two things using the word like or as
              paragraph: BIB322.1.3.1.P.31.1
              UID: BIB322.1.3.1.G.9
              page: 20
            - term: synonymous parallelism
              definition: repetition of the same thought using two different yet closely
                related sets of words
              paragraph: BIB322.1.3.1.P.17
              page: 20
              UID: BIB322.1.3.1.G.10
            - term: syntax
              definition: the way in which words are put together to form phrases
                or clauses
              paragraph: BIB322.1.3.1.P.39.1
              UID: BIB322.1.3.1.G.11
              page: 21
            - term: synthetic parallelism
              definition: parallelism in which the thought of the first part is completed
                by the second part
              paragraph: BIB322.1.3.1.P.27
              page: 20
              UID: BIB322.1.3.1.G.12
            - term: literal translation
              definition: following the conventions of the source language when translating
                Scripture
              paragraph: BIB322.1.3.1.P.40
              page: 21
              UID: BIB322.1.3.1.G.6
              status: outdated 2026-10-06
              outdated_reason: struck
          1.3.2:
            last_modified: '2026-03-27'
            text: Compare the use of repetition in English and Hebrew literature.
