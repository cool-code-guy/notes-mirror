      title: 7 - The Book of Ecclesiastes
      print_page: 107
      intro_body:
      - text: Which is correct, the contemporary teaching that life should always
          be viewed as a source of blessing and full of meaning or that of the writer
          of Ecclesiastes who labels everything in life as meaningless? This is an
          interesting question and one that needs to be answered in light of all Scripture.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.CH7.INTRO.P.1
      - text: The book of Ecclesiastes is unique in its attitude toward life. The
          author has tried everything that people pursue in the hope of finding fulfillment
          and happiness. His experiments have left him empty and frustrated. Where
          is meaning or hope or a realistic basis of finding joy in life? All these
          questions are part of the study of this book, but the answers go beyond
          its boundaries, even into later centuries of New Testament writers.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.CH7.INTRO.P.2
      - text: Again, a writer of Old Testament wisdom literature proves to be honest,
          if limited, in seeking answers that go to the heart of life as a human being.
          His choices in life, both of attitude and of perspective, leave him cynical.
          But the student is invited to explore the topic further, in light of all
          the revelation of Scripture and the counsel of those who knew Jesus personally.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.CH7.INTRO.P.3
