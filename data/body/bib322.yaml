              paragraph: BIB322.1.2.1.P.1.1
              UID: BIB322.1.2.1.G.1
              page: 17
            - term: imagery
              definition: figurative language (a word used in a different way than
                its normal usage or meaning) used to create a picture or sensation
                in the reader’s mind
              paragraph: BIB322.1.2.1.P.19
              UID: BIB322.1.2.1.G.2
              page: 18
            - term: meter
              definition: the systematic rhythm found in poetry, usually repeated
              paragraph: BIB322.1.2.1.P.5.1
              UID: BIB322.1.2.1.G.3
              page: 17
            - term: parallelism
              definition: similar construction of phrases for effect; a repetition
