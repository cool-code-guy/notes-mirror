    chapters:
    - last_modified: '2026-03-27'
      title: 1 - Introduction to Hebrew Poetry
      print_page: 17
      intro_body:
      - text: A significant portion of the Old Testament is written in the form of
          poetry . Paging through a contemporary version of the Bible reveals white
          space on many pages because the text is printed in verse. Much of the books
          of prophecy, such as Isaiah and Daniel, appear in verse, and all of the
          psalms are poetry. Although most of the five books of Moses (Genesis through
          Deuteronomy) are written in prose , the narrative occasionally uses poetry,
          as in the songs of Moses (Exodus 15:1–19) and of Miriam (Exodus 15:21),
          which celebrate the Israelites’ deliverance from the Egyptians at the Red
          Sea (Exodus 15:1–19).
        kind: prose
        cls: IST_Body-Indent
        md: A significant portion of the Old Testament is written in the form of **poetry**.
          Paging through a contemporary version of the Bible reveals white space on
          many pages because the text is printed in verse. Much of the books of prophecy,
          such as Isaiah and Daniel, appear in verse, and all of the psalms are poetry.
          Although most of the five books of Moses (Genesis through Deuteronomy) are
          written in **prose**, the narrative occasionally uses poetry, as in the
          songs of Moses (Exodus 15:1–19) and of Miriam (Exodus 15:21), which celebrate
          the Israelites’ deliverance from the Egyptians at the Red Sea (Exodus 15:1–19).
        UID: BIB322.CH1.INTRO.P.1
      - text: 'However, this study will focus on the poetic books: Job, Psalms, Proverbs,
          Ecclesiastes, and Song of Solomon. Because correctly interpreting the poetic
          books requires correctly interpreting the Bible as a whole, we begin with
          a brief look at basic principles of interpretation.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.CH1.INTRO.P.2
      lessons:
      - last_modified: '2026-03-27'
        title: Reading the Bible
        subobjectives:
          1.1.1:
            last_modified: '2026-03-27'
            text: Explain why the Bible is our guide for living.
            glossary:
            - term: context
              definition: the parts surrounding a word or passage that help explain
                its meaning; environment, setting; the relationship between conditions
                in which something exists or happens
              paragraph: BIB322.1.1.1.P.10
              page: 16
              UID: BIB322.1.1.1.G.1
            - term: exile
              definition: the forcing of people to leave their country or homeland
              paragraph: BIB322.1.1.1.P.3.1
              UID: BIB322.1.1.1.G.2
              page: 15
            - term: inspiration
              definition: the doctrine that the Bible was written by people under
                the direction of the Holy Spirit so that they wrote what He wanted
                them to write
              paragraph: BIB322.1.1.1.P.5
              page: 15
              UID: BIB322.1.1.1.G.3
            - term: poetry
              definition: writing selected and arranged to create emotional response
                through meaning, sound, and rhythm; imaginative writing that evokes
                emotions using the meaning, sound, and rhythm of words
              paragraph: BIB322.1.1.1.P.10
              page: 16
              UID: BIB322.1.1.1.G.4
            - term: revelation
              definition: God making known more of His plans for the redemption of
                humanity as history progressed
              paragraph: BIB322.1.1.1.P.3.1
              UID: BIB322.1.1.1.G.5
              page: 15
          1.1.2:
            last_modified: '2026-10-06'
            text: Explain why understanding the progression of revelation is important
              when studying the poetic books.
            glossary: []
            text_history:
            - text: Explain why understanding the progression of revelation is important
