      title: 8 - The Song of Solomon (Song of Songs)
      print_page: 121
      intro_body:
      - text: What are sexual themes doing in the Bible? Can they be a vital part
          of biblical theology? Is sex innately sinful, a result of the Fall? Or is
          it a good gift of God, accepted and blessed in human relationships?
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.CH8.INTRO.P.1
      - text: The Song of Solomon may be one of the most controversial books of the
          Bible. Its authorship remains uncertain, and the writer is neither shy nor
          embarrassed to speak candidly of the joys of sexual union. As a part of
          the canon, the book has proved a source of discomfort for some and freedom
          for others. It challenges cultural views both inside and outside the church.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.CH8.INTRO.P.2
      - text: This final chapter of the course may make some uncomfortable. But the
          wisdom offered provides humankind the opportunity to relax in their humanity,
          be that spiritual or physical. Either way, they are naturally creations
          of God.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.CH8.INTRO.P.3
      lessons:
