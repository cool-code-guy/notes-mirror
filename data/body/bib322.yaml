    title: The Poetic Books
    units:
    - title: Introduction to the Poetic Books
      chapters:
      - 1
      - 2
      intro_body:
      - text: Acclaimed poet Myra Cohn Livingston once said, “Poetry humanizes because
          it links the individual by its distilled experience, its rhythms, its words
          to another in a way which no other form of communication can. Poetry also
          helps to ease the aloneness which we all share in common” (as cited in Lerner
          1994).
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.UNIT1.INTRO.P.1
      - text: ''
        kind: image
        src: BBIB322ENE03-90_03.26.01-web-resources/image/Myra_Cohn_Livingston,_1973.png
        alt: A close-up of a textured surface with cursive white writing on a dark
          background.
        caption: Myra Cohn Livingston, Poet-in-Residence of Beverly Hills School District
          (Frampton 1973 / Cropped from original)
        UID: BIB322.UNIT1.INTRO.IMG.1
      - text: Poets write to the human experience, bridging the lonely gulf between
          people, producing communication and response, rapport and empathy. Readers
          experience the message through imagery and sound in ways that speak to their
          senses, their ideas, their convictions.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.UNIT1.INTRO.P.3
      - text: While more than one-third of the Bible is composed of poetry, the books
          of Job, Psalms, Proverbs, Ecclesiastes, and the Song of Solomon specifically
          make up the poetic books. This study examines how to read and interpret
          Hebrew poetry as found in the poetic books. It also explores the message
          of the poets. Though much of the poetic books falls into the category of
          “wisdom” literature, other segments include history, love sonnets, worship,
          and praise.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.UNIT1.INTRO.P.4
      - text: Contemporary Christianity may at times perceive emotion as a type of
          weakness, a sign of immaturity in the faith. But emotion is part of the
          human experience, and the ancient Hebrew poets are refreshingly honest in
          reflecting their experience with real-life situations. It is through such
          open expression that deep issues of life are addressed and, if not always
          resolved, accepted in the light of the mystery of God.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.UNIT1.INTRO.P.5
    - title: Job and the Psalms
      chapters:
      - 3
      - 4
      - 5
      intro_body:
      - text: Reader beware. Does this seem an odd opening to a unit of study? Indeed,
          it is not. One cannot approach the topics addressed in the books of Job
          and Psalms without facing a challenge to what he or she believes to be true
          about God. For serious seekers of a fresh revelation of God, these books
          are the doorway to enter. The journey will not be easy, but for those who
          persevere, a fresh revelation of God will be their reward.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.UNIT2.INTRO.P.1
    - title: Proverbs, Ecclesiastes, and Song of Solomon
      chapters:
      - 6
      - 7
      - 8
      intro_body:
      - text: Mysterious writers, painfully honest attitudes, forbidden topics—with
          these elements, the books of Proverbs, Ecclesiastes, and Song of Solomon
          challenge simplistic views of God and His Word. No easy answers are found
          here, yet all the answers a person needs for a full life become obvious.
          Full of seeming contradictions, warring with self and life, the writers
          struggle with issues of good and evil, life and death, and day-to-day triumphs
          and monotony and find God himself to be the source of all life’s meaning.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.UNIT3.INTRO.P.1
      - text: Each book represents a distinctly different approach to writing. Some
          have one author; others are compilations. But each has a strong message
          for the reader, not always easily interpreted, not always easily comprehended.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.UNIT3.INTRO.P.2
      - text: While King Solomon plays a key role in all three books, other writers
          emerge, including unnamed wise men of Israel. Wisdom, questioning, love
          stories, and philosophies all confront readers. Once again, the writers
          touch the readers where they live.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB322.UNIT3.INTRO.P.3
