    - title: Thirteen Letters of Paul
      chapters:
      - 5
      - 6
      - 7
      - 8
      - 9
      intro_body:
      - text: Whether traveling or coping with imprisonment, Paul yearned to strengthen
          and teach the churches he founded and the friends he discipled. Writing
          letters provided an effective method for accomplishing both goals.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB116.UNIT2.INTRO.P.1
      - text: Paul’s epistles deal with a variety of issues. To the Romans, Corinthians,
          and Galatians, he emphasized that we receive salvation, that is, God’s righteousness,
          through His grace. In the epistles he wrote from prison—Ephesians, Philippians,
          Colossians, and Philemon—Paul expressed his concern and passion for practical
          Christian living. Since he could not visit these churches personally while
          imprisoned, he spoke through his letters with apostolic authority, clarifying
          some theology and offering instruction. In 1 and 2 Thessalonians, Paul spoke
          about the future. Most believers want to learn all they can about the events
          that lie ahead. Finally, Paul’s letters for pastors, 1 Timothy, 2 Timothy,
          and Titus, were both personal and practical. The principles and exhortations
          they contain will help you in your ministry.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB116.UNIT2.INTRO.P.2
      - text: Although Paul addressed his epistles to specific churches and individuals,
          the truth he presents unquestionably applied to all churches and applies
          to us today. As we face similar questions and situations, the Holy Spirit
          uses Paul’s words of encouragement and instruction to guide us.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB116.UNIT2.INTRO.P.3
    - title: Eight Letters for All and the Apocalypse
      chapters:
      - 10
      - 11
      - 12
      - 13
      intro_body:
      - text: The books in the final portion of the Bible were written to strengthen
          and encourage believers. They urge us to persevere when suffering for our
          faith. They warn us to be on guard against distortions of the truth. And
          in Revelation, John offers us hope, peace, and knowledge as we look forward
          to Christ’s return.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB116.UNIT3.INTRO.P.1
      - text: Trials and false teachings have not disappeared over the centuries.
          In fact, they seem to have worsened. The same God-inspired truths that nurtured
          and taught the early believers still fortify and teach believers today.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB116.UNIT3.INTRO.P.2
