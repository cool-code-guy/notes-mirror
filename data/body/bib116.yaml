    - last_modified: '2026-03-27'
      title: '11 - Letters about False Teaching, Part 1: 1, 2, and 3 John'
      print_page: 203
      intro_body:
      - text: A marathon is a race of 42 kilometers (26.2 miles). Although the best
          runners strive to finish first, or as quickly as possible, most people who
          run a race like this have only one goal—to cross the finish line. For many
          marathon runners, the finish line is the goal that drives them on.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH11.INTRO.P.1
      - text: 'Biblical writers compare the Christian life to running a race:'
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH11.INTRO.P.2
      - text: Do you not know that in a race all the runners run, but only one gets
          the prize? Run in such a way as to get the prize. Everyone who competes
          in the games goes into strict training. They do it to get a crown that will
          not last; but we do it to get a crown that will last forever. Therefore
          I do not run like a man running aimlessly; I do not fight like a man beating
          the air. No, I beat my body and make it my slave so that after I have preached
          to others, I myself will not be disqualified for the prize. (1 Corinthians
          9:24–27)
        kind: quote
        cls: IST_Body-Block-Quote
        UID: BIB116.CH11.INTRO.P.3
      - text: 'Brothers, I do not consider myself yet to have taken hold of it. But
          one thing I do: Forgetting what is behind and straining toward what is ahead,
          I press on toward the goal to win the prize for which God has called me
          heavenward in Christ Jesus. (Philippians 3:13–14)'
        kind: quote
        cls: IST_Body-Block-Quote
        UID: BIB116.CH11.INTRO.P.4
      - text: Similarly, if anyone competes as an athlete, he does not receive the
          victor’s crown unless he competes according to the rules. (2 Timothy 2:5)
        kind: quote
        cls: IST_Body-Block-Quote
        UID: BIB116.CH11.INTRO.P.5
      - text: I have fought the good fight, I have finished the race, I have kept
          the faith. Now there is in store for me the crown of righteousness, which
          the Lord, the righteous Judge, will award to me on that day—and not only
          to me, but also to all who have longed for his appearing. (2 Timothy 4:7–8)
        kind: quote
        cls: IST_Body-Block-Quote
        UID: BIB116.CH11.INTRO.P.6
      - text: Therefore, since we are surrounded by such a great cloud of witnesses,
          let us throw off everything that hinders and the sin that so easily entangles,
          and let us run with perseverance the race marked out for us. (Hebrews 12:1)
        kind: quote
        cls: IST_Body-Block-Quote
        UID: BIB116.CH11.INTRO.P.7
      - text: The goal of the Christian life is to cross the finish line and win the
          crown of life. It is not enough to begin walking in the light of God. The
          Christian must continue walking in the light until the end. False teachers
          want believers to stop walking in the light, to quit before they cross the
          finish line. John wrote to warn against these false teachers. His letters
          encourage us to keep running the race.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH11.INTRO.P.8
      lessons:
      - last_modified: '2026-03-27'
        title: First John
        subobjectives:
          11.1.1:
            last_modified: '2026-03-27'
            text: Explain how 1 John relates to the errors of the Gnostics.
            glossary:
            - term: Gnosticism
