    course_objectives:
    - 1. Explain how God used the Jews, Greeks, and Romans to prepare the world for
      His Son.
    - 2. Analyze the political, social, and religious characteristics of New Testament
      times.
    - 3. Explain the formation of the New Testament canon.
    - 4. Identify five nations, five districts, ten cities, and five bodies of water
      related to New Testament times.
    - 5. Divide the New Testament into four groups, listing the books and characteristics
      of each group.
    - 6. Summarize how Jesus Christ is a unifying theme of the New Testament.
    - 7. Analyze the authorship and historical context of each New Testament book.
    - 8. Explain and apply the theme and purpose of each New Testament book.
