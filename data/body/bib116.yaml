    - last_modified: '2026-03-27'
      title: '10 - Letters to Suffering Believers: Hebrews, James, and 1 Peter'
      print_page: 179
      intro_body:
      - text: On his desk, Dr. Mark Barclift has a beautiful picture to remind him
          that God is with us, even in our sufferings. The picture is made from small
          scraps of cloth torn from the dresses of women who were imprisoned during
          World War II. One of these women was his great-aunt Kathryn, a missionary
          to the land of the East Indies. She returned to the island of Sumatra knowing
          not only that she faced great danger, but also that God had called her.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH10.INTRO.P.1
      - text: At the onset of the war, Kathryn was arrested and placed in a prison
          camp. The camp had little food and much disease. Hundreds of women and children
          died from hunger and sickness. When the end of the war liberated Kathryn,
          she too was near death.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH10.INTRO.P.2
      - text: However, her best memory from this time of suffering was the Lord’s
          help. She wrote, “Surely, if the Lord was ever sufficient, He was during
          this time. To know Him as I do now, I would be willing to endure it all
          again, if necessary.” The light of His presence shines brightest in the
          darkest hours.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH10.INTRO.P.3
      - text: Suffering has always been a part of the Christian life. In this chapter,
          the letters to suffering believers show us that God is with us in the midst
          of trials.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH10.INTRO.P.4
