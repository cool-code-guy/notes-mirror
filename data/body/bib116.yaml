    - last_modified: '2026-03-27'
      title: '9 - Letters for Pastors: 1 and 2 Timothy and Titus'
      print_page: 159
      intro_body:
      - text: When Marcus finished Bible school, he was invited to start a new church.
          He not only prayed, asking God if this was His will, but he also talked
          with a more experienced pastor in a nearby city. The other pastor prayed
          with him and encouraged him to start the church.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH9.INTRO.P.1
      - text: The pastor’s encouragement did not stop there. In fact, he kept encouraging
          Marcus for many years. The neighboring pastor took time to meet with Marcus
          regularly and shared much of his wisdom about the ministry. He answered
          Marcus’s tough questions and helped him to understand what it means to be
          a pastor. Without the counsel of this other pastor, Marcus would not have
          grown in the ministry as he did.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH9.INTRO.P.2
      - text: In the same way, Paul encouraged Timothy and Titus in their pastoral
          calling. He helped them get started in the ministry, and he wrote letters
          to them to share his wisdom regarding the ministry. Whereas almost all of
          Paul’s other letters were written to churches, the three Pastoral Epistles
          were written to individuals. In these letters, Paul tells Timothy and Titus
          how to be effective pastors and ministers of the gospel. He also intends
          for the churches to understand key principles of community life, organization,
          and leadership.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH9.INTRO.P.3
