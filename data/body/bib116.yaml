    - last_modified: '2026-03-27'
      title: 3 - The Gospel of John
      print_page: 59
      intro_body:
      - text: 'John’s Gospel enriches our lives. It presents the life and teachings
          of Jesus in a way that adds to the Synoptics and emphasizes Christ’s deity.
          It tells of Jesus’ miracles and stresses the eternal life that Jesus offers
          to all who believe in Him. In fact, inspiring belief in Jesus is John’s
          purpose in writing his Gospel: “But these are written that you may believe
          that Jesus is the Christ, the Son of God, and that by believing you may
          have life in his name” (John 20:31). Together, the four Gospels give us
          a thorough understanding of Jesus—who He is, what He did, and what He taught.'
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH3.INTRO.P.1
      lessons:
