    - last_modified: '2026-05-28'
      title: '5 - Letters about the Gospel and Faith: Romans and Galatians'
      print_page: 95
      intro_body:
      - text: The epistles of Romans and Galatians firmly declare that true righteousness,
          or salvation, comes only through faith in Jesus Christ. Such faith brings
          freedom from the slavery and condemnation of sin, introducing a new way
          of life.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH5.INTRO.P.1
      - text: Paul knew this truth firsthand. Having zealously persecuted believers
          before his conversion, Paul had experienced the life-changing grace of God’s
          gift of righteousness to all who believe. Now his zeal turned to serving
          the Christ who had saved him and freed him from sin. Paul wanted to strengthen
          and renew the Romans’ and Galatians’ faith. He wanted them to remember what
          God had delivered them from and what He was leading them to with His gift.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH5.INTRO.P.2
      lessons:
      - last_modified: '2026-05-28'
        title: Paul
        subobjectives:
          5.1.1:
            last_modified: '2026-05-28'
            text: Summarize Paul’s background, conversion, and public ministry.
            glossary:
            - term: Damascus
              definition: the capital city of Syria, about 150 miles (242 km) north
                of Jerusalem and about halfway between Jerusalem and Tarsus. Damascus
                was famous for business.
