    - last_modified: '2026-03-27'
      title: '7 - Letters from Prison: Ephesians, Philippians, Colossians, and Philemon'
      print_page: 129
      intro_body:
      - text: 'In 1873, a lawyer named Horatio Spafford planned a trip with his family
          to Europe. Business delayed him, but he sent his wife and four young daughters
          on ahead. Their ship, the Ville Du Havre , never made it to England but
          sank into the cold grave of the Atlantic Ocean. Horatio’s wife, Anna, was
          among the few who survived. His four daughters—Maggie, Tanetta, Annie, and
          Bessie—all drowned. He received the terrible news from his wife with only
          these two words: “Saved alone.” As Spafford traveled to meet his grieving
          wife, his ship sailed near the place where his daughters had drowned. There,
          in the midst of his sorrow, the Spirit of God comforted him. Spafford wrote
          the poem “It Is Well with My Soul,” which was later put to music. Today,
          believers around the world sing this great hymn of the Church. It has brought
          comfort to millions of sad hearts (Kauffman 2018).'
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
