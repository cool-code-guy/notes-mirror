            glossary:
            - term: Assyria
              definition: a strong nation northeast of Israel whose capital was Nineveh;
                took the ten northern tribes of Israel into exile in 722 BC. Babylon
                conquered Assyria in 612 BC
              paragraph: BIB116.1.1.1.P.41
              page: 22
              UID: BIB116.1.1.1.G.1
            - term: Babylon
              definition: the kingdom north of the Euphrates River that ruled the
                world from 612–539 BC. It was the head of gold in Daniel 2 and the
                lion in Daniel 7. Its first ruler was Nebuchadnezzar. Also, Babylon
                is a name used to represent Rome. It stands for all who love the world
