    - last_modified: '2026-03-27'
      title: '6 - Letters about Church Problems: 1 and 2 Corinthians'
      print_page: 115
      intro_body:
      - text: Have you ever tried to find a perfect church? Can you imagine a church
          with no problems? Such a church is impossible to find on earth; it does
          not exist. Churches consist of people, and people are imperfect.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH6.INTRO.P.1
      - text: Paul’s letters to the church at Corinth remind us that all people have
          problems. Although Paul had founded the Corinthian church and it was rich
          in spiritual gifts (1 Corinthians 1:7), the church had many problems. One
          of the largest problems, and central to all others, was division (1 Corinthians
          1–4), but other issues included sexual sins, believers fighting each other
          in court, and confusion during church services.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH6.INTRO.P.2
      - text: Studying Corinthians emphasizes the important truth that no matter how
          bad a church’s problems are, God has a solution. Corinth was one of the
          darkest, most sinful cities of Paul’s day. Yet the gospel light shone brightly
          there, and those who were saved learned to live at peace with other believers.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH6.INTRO.P.3
      lessons:
