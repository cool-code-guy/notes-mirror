      - text: Likewise, in a prison, the Holy Spirit encouraged Paul. In chains, he
          wrote four of his most glorious letters. Spiritual giants of the Church
          like John Bunyan, Dietrich Bonhoeffer, Martin Luther King Jr., and Watchman
