    chapters:
    - last_modified: '2026-05-28'
      title: 1 - An Overview of the New Testament
      print_page: 17
      intro_body:
      - text: God plans ahead. He told Abraham that his descendants would be slaves
          for four hundred years, but He promised to deliver them (Genesis 15:13–16).
          When Joseph was only a boy, God gave him dreams about ruling (Genesis 37:5–11).
          Those dreams did not begin to be fulfilled until Joseph was thirty years
          old (Genesis 41:46).
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH1.INTRO.P.10
        source_uid: BIB116.CH1.INTRO.P.1
      - text: The Almighty made every nation of people from one man. He planned the
          times for each nation and the places where each nation would live (Acts
          17:26). He showed Daniel that the Medes and Persians would conquer the Babylonians,
          the Greek kingdom would then arise, and the Romans would in time conquer
          the Greeks. Finally, God said that an eternal kingdom would rise above the
          ruins of all human kingdoms (Daniel 2:24–47).
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH1.INTRO.P.2
      - text: 'Therefore, we are not surprised that God planned for our salvation.
          Although He allows each person to accept or reject the gospel, He made a
          plan to save us before He created us:'
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH1.INTRO.P.3
      - text: “Then the King will say to those on his right, ‘Come, you who are blessed
          by my Father; take your inheritance, the kingdom prepared for you since
          the creation of the world’” (Matthew 25:34).
        kind: list
        cls: IST_Body-Bullet-2
        UID: BIB116.CH1.INTRO.P.4
      - text: God “chose us in [Christ] before the creation of the world to be holy
          and blameless in his sight” (Ephesians 1:4).
        kind: list
        cls: IST_Body-Bullet-2
        UID: BIB116.CH1.INTRO.P.5
      - text: God “has saved us and called us to a holy life—not because of anything
          we have done but because of his own purpose and grace. This grace was given
          us in Christ Jesus before the beginning of time” (2 Timothy 1:9).
        kind: list
        cls: IST_Body-Bullet-2
        UID: BIB116.CH1.INTRO.P.6
      - text: “For you know that it was not with perishable things such as silver
          or gold that you were redeemed from the empty way of life handed down to
          you from your forefathers, but with the precious blood of Christ, a lamb
          without blemish or defect. He was chosen before the creation of the world,
          but was revealed in these last times for your sake” (1 Peter 1:18–20).
        kind: list
        cls: IST_Body-Bullet-2
        UID: BIB116.CH1.INTRO.P.7
      - text: “But when the time had fully come, God sent his Son, born of a woman,
          born under law, to redeem those under law, that we might receive the full
          rights of sons” (Galatians 4:4–5).
        kind: list
        cls: IST_Body-Bullet-2
        UID: BIB116.CH1.INTRO.P.8
      - text: In this chapter, we will consider God’s ways of preparing the world
          for Jesus through the Jews, the Greeks, and the Romans; the historical context
          and elements of the New Testament; and the unique ways Jesus is presented
          in each New Testament book. Throughout our study, we will be reminded of
          God’s preparation for our salvation through Jesus and for our eternity in
          heaven with Him. Indeed, God plans ahead, and we are part of His plans.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH1.INTRO.P.11
        source_uid: BIB116.CH1.INTRO.P.9
      - text: God plans ahead. He told Abraham that his descendants would be slaves
          for four hundred years, but He promised to deliver them (Genesis 15:13–16).
          When Joseph was only a boy, God gave him dreams about ruling (Genesis 37:2,
          30). Those dreams were not fulfilled until Joseph was thirty (Genesis 41:46).
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH1.INTRO.P.1
        status: outdated 2026-09-29
        outdated_reason: revised
        replaced_by: BIB116.CH1.INTRO.P.10
