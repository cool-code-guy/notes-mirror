    - last_modified: '2026-03-27'
      title: 4 - The Book of Acts
      print_page: 73
      intro_body:
      - text: Acts records the fulfillment of Jesus’ promise to send the Holy Spirit.
          The early church would need the Spirit’s help and power to share the truth
          of Jesus and endure persecution. In fact, in Acts persecution was a key
          to the spread of the gospel. Through it, God scattered the believers and
          sent His message of salvation from Jerusalem to Judea, Samaria, and the
          entire known world.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH4.INTRO.P.1
      - text: Among the many other persons described in Acts, the book highlights
          the ministries of Peter and Paul—two men who were radically changed by the
          power of the Spirit and the truth of Jesus’ salvation. As you read through
          the book of Acts, may the Spirit’s power enrich your life in a new way and
          may it strengthen you to fulfill the purpose He has given you to complete,
          just as it did for the believers of the early church.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH4.INTRO.P.2
