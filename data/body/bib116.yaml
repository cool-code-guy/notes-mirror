    - last_modified: '2026-05-28'
      title: '2 - The Synoptic Gospels: Matthew, Mark, and Luke'
      print_page: 39
      intro_body:
      - text: In studying a crime or car accident, a former police officer explains,
          “If everyone describes what happened in exactly the same words, the policeman
          knows that there is a problem. On the other hand, if each witness tells
          what happened from a slightly different point of view, it has the sound
          of truth.”
        kind: prose
        cls: IST_Body-Indent
        UID: BIB116.CH2.INTRO.P.1
      - text: In London’s National Gallery of Art, three paintings of King Charles
          I hang together within one frame. In the first painting, his head is turned
          to the left; in the second, his head is turned to the right; in the third,
          he is looking straight ahead. An artist named Van Dyck painted these three
          views—that is, different perspectives—of the king to help another artist
          who wanted to make a stone statue of the king (Mears 1983, 340).
        kind: prose
        cls: IST_Body-Indent
        UID: BIB116.CH2.INTRO.P.2
      - text: Likewise, the Synoptic Gospels—Matthew, Mark, and Luke—allow us to learn
          about Jesus Christ from three different points of view. The Synoptics, together
          with John, give us four portraits of Jesus. Matthew emphasizes that Jesus
          was a king, but Mark shows that He was a perfect servant. Luke shows that
          Jesus was the Son of Man, but John emphasizes that He was the Son of God.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB116.CH2.INTRO.P.3
      intro_interactive_questions:
      - p: 1
        text: How might you respond to someone who doubts the validity of the Bible,
          due to the variations in each of the Gospel accounts?
        after_body_index: 3
        response: Answers will vary, but the idea that different people have different
          perspectives and interpretations of the same events should be included.
