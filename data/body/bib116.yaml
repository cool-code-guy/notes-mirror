              paragraph: BIB116.1.1.1.P.8
              page: 19
              UID: BIB116.1.1.1.G.5
            - term: Macedonia
              definition: a province in northern Greece whose capital was Thessalonica;
                also included the city of Philippi
              paragraph: BIB116.1.1.1.P.11
              page: 19
              UID: BIB116.1.1.1.G.6
            - term: Pharisees
              definition: literally, the separate people; members of a Jewish group
                who strictly followed the law of Moses and Jewish religious customs.
              paragraph: BIB116.1.1.1.P.30.2
              page: 19
              UID: BIB116.1.1.1.G.7
            - term: Romans
              definition: people who conquered the Greeks and ruled from 63 BC to
