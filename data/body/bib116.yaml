    title: New Testament Survey
    units:
    - title: The Gospels and Acts
      chapters:
      - 1
      - 2
      - 3
      - 4
      intro_body:
      - text: In the midst of Roman rule, a child was born who would change the world.
          That child—Jesus, the Son of God—lived, died, and rose from the dead. After
          ascending to heaven, God sent His Spirit as a helper, guide, and comforter.
          On the Day of Pentecost, 120 believers were filled with the Spirit, receiving
          power to witness for Jesus through words, deeds of kindness, and supernatural
          signs and wonders. The new community began as a group so small it met in
          one upper room, yet it grew and spread all over the Roman Empire. While
          the new community began as one Jewish group, it grew to be an international
          Church of many languages and cultures.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB116.UNIT1.INTRO.P.5
        source_uid: BIB116.UNIT1.INTRO.P.1
      - text: The books of the New Testament were written for the Church (groups of
          believers). The Gospels teach believers about the life and teachings of
          Christ. Acts and the Epistles, Romans through Jude, record the history and
          development of the Church and teach how to live the Christian life. The
          last book, Revelation, predicts the final victory of God over His enemies.
          Regardless of the audience or subject or genre, however, each book of the
          New Testament provides a picture of Christ.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB116.UNIT1.INTRO.P.6
        source_uid: BIB116.UNIT1.INTRO.P.2
      - text: In this unit, after a brief synopsis of the New Testament, we will focus
          on the Gospels and Acts. We will consider the background or setting, purpose,
          and outline of each book, along with its major teachings and emphasis. Most
          of all, we will discover the truths God wants to teach us through the unique
          perspective of each writer. Please take time to read each of the books of
          the New Testament as you approach the specific lessons.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB116.UNIT1.INTRO.P.3
