    - last_modified: '2026-03-27'
      title: 13 - The Book of Revelation
      print_page: 241
      intro_body:
      - text: To teach their children about the armor of God in Ephesians 6:10–18,
          some children’s ministry workers staged a drama in which one man represented
          a believer. He was dressed in white clothes overlaid with armor and carried
          a sword and shield. His enemy was dressed in black and represented the devil.
          In the skit, the two men pretended to fight each other. Finally, the warrior
          in white conquered the one in black.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH13.INTRO.P.1
      - text: 'At the end of the drama, the leader asked the children to explain the
          skit’s meaning. What did it teach them? Some said it showed the importance
          of wearing the armor of God. Others said it represented the need for truth
          or faith. But one small child captured the essence of the drama in a simple
          statement: “It shows us that the man in white wins in the end.”'
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH13.INTRO.P.2
      - text: 'Despite all of the hard-to-understand details in the book of Revelation,
          this message stands out above everything else: In the end, Jesus wins! John
          saw Him returning as a conqueror on a white horse, followed by an army clothed
          in white and also riding white horses (Revelation 19:11–14). Christ will
          return as the King of kings and Lord of lords to reward His holy ones and
          judge His enemies. The great theme of Revelation is that Jesus wins and
          that those who overcome evil will reign with Him.'
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: BIB116.CH13.INTRO.P.3
      lessons:
