    - last_modified: '2026-03-27'
      title: '8 - Paul’s Appeal and God’s Goal: Christ Fully Expressed at Home and
        at Work (Ephesians 5:21–6:9)'
      print_page: 141
      intro_body:
      - text: The institution of marriage and the home are facing tremendous challenges
          today. These time-honored institutions are being assaulted by a secularism
          (with no acknowledgment of the living God) and an enculturation that rejects
          biblical principles and substitutes an attitude that says, “I will do it
          (whatever) my way!” Marriage relationships are also endangered by the mixing
          of social perceptions and traditions with excerpts from God’s Word.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH8.INTRO.P.1
      - text: The foundational premise or the crucial principle for a Holy Spirit-directed
          home life and marriage is clearly established in verse 21. It governs everything
          that follows in this section of Ephesians (5:21–6:9). It reads, “Submit
          to one another out of reverence for Christ” (5:21). Submission is to be
          mutual. It is one of the great one another verses of the Bible. Each member
          of the households of ancient Ephesians—husbands, wives, children, and enslaved
          persons—had a responsibility to “submit to one another out of reverence
          for Christ.”
        kind: prose
        cls: IST_Body-Indent
        md: The foundational premise or the crucial principle for a Holy Spirit-directed
          home life and marriage is clearly established in verse 21. It governs everything
          that follows in this section of Ephesians (5:21–6:9). It reads, “Submit
          to one another out of reverence for Christ” (5:21). Submission is to be
          mutual. It is one of the great *one another* verses of the Bible. Each member
          of the households of ancient Ephesians—husbands, wives, children, and enslaved
          persons—had a responsibility to “submit to one another out of reverence
          for Christ.”
        UID: BIB217.CH8.INTRO.P.2
      - text: The word submit is also a link, a transition from the previous passage.
          It functions as the final, modifying participle describing the Spirit-filled
          life commanded in verse 18. Spirit-filled Christians speak, sing, give thanks,
          and submit to one another. Any other understanding of spirituality is a
          masquerade.
        kind: prose
        cls: IST_Body-Indent
        md: The word *submit* is also a link, a transition from the previous passage.
          It functions as the final, modifying participle describing the Spirit-filled
          life commanded in verse 18. Spirit-filled Christians speak, sing, give thanks,
          and submit to one another. Any other understanding of spirituality is a
          masquerade.
        UID: BIB217.CH8.INTRO.P.3
      - text: Understanding what is meant by submission is crucial. The Greek word
          used here, hypotasso , is in the middle voice. While the active voice would
          have referred to forced subordination, in this passage, hypotasso is used
          in reference to a voluntary act. This subordination is not coerced, but
          is an attitude marking every Christian in relation to God, to other Christians,
          to civil authorities, to church leaders, to one’s spouse, and to one another
          (Opperwall 1988, 643–644). This subordination is exemplified by our Savior
          (Philippians 2:3–8). “It describes a voluntary attitude of giving in, cooperating,
          assuming responsibility, and carrying a burden” (Barth 1974, 710). In marriage,
          “each partner subordinates their own interests to their spouse’s, the motivation
          of sacrificial love in which each partner strives to help the other” (Marshall
          2005, 204).
        kind: prose
        cls: IST_Body-Indent
        md: Understanding what is meant by *submission* is crucial. The Greek word
          used here, *hypotasso*, is in the middle voice. While the active voice would
          have referred to forced subordination, in this passage, *hypotasso* is used
          in reference to a voluntary act. This subordination is not coerced, but
          is an attitude marking every Christian in relation to God, to other Christians,
          to civil authorities, to church leaders, to one’s spouse, and to one another
          (Opperwall 1988, 643–644). This subordination is exemplified by our Savior
          (Philippians 2:3–8). “It describes a voluntary attitude of giving in, cooperating,
          assuming responsibility, and carrying a burden” (Barth 1974, 710). In marriage,
          “each partner subordinates their own interests to their spouse’s, the motivation
          of sacrificial love in which each partner strives to help the other” (Marshall
          2005, 204).
        UID: BIB217.CH8.INTRO.P.4
      - text: What is the character of this section (Ephesians 5:21–6:9)? Paul addressed
          how life in the Spirit transforms the relationships of those within a household—wives
          and husbands, children and parents, enslaved persons and masters. As briefly
          mentioned earlier, Martin Luther coined the technical term haustafel (household
          table) in German to describe this very list of household relationships and
          duties in Ephesians and Colossians. Although Paul used lists of duties found
          in pagan literature, there are important distinctions between theirs and
          his. New Testament lists emphasize reciprocal responsibilities and the motivation
          is the practical expression of a vibrant relationship with Jesus Christ.
        kind: prose
        cls: IST_Body-Indent
        md: What is the character of this section (Ephesians 5:21–6:9)? Paul addressed
          how life in the Spirit transforms the relationships of those within a household—wives
          and husbands, children and parents, enslaved persons and masters. As briefly
          mentioned earlier, Martin Luther coined the technical term *haustafel* (household
          table) in German to describe this very list of household relationships and
          duties in Ephesians and Colossians. Although Paul used lists of duties found
          in pagan literature, there are important distinctions between theirs and
          his. New Testament lists emphasize reciprocal responsibilities and the motivation
          is the practical expression of a vibrant relationship with Jesus Christ.
        UID: BIB217.CH8.INTRO.P.5
      - text: Paul’s instructions to live in mutual love and submission were alien
          to that culture. Husbands were accustomed to having complete authority over
          their households, including their wives, children, and enslaved persons.
          Women were often considered inferior beings and as such had no legal rights
          or standing. Children and enslaved persons had no rights. The levels of
          power were so unequal that for Paul to give such instruction without explaining
          how to carry it out could have led to more abuses than blessings. Therefore,
          he gives specific examples of how believers, within each social stratum,
          could express Christ’s life in their homes (Gundry 1980, 95). Such understanding
          also helps us more accurately apply the principles of living in the Spirit
          to our lives, centuries later.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH8.INTRO.P.6
      - text: Read Ephesians 5:21–6:9 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Left-Subhead
        md: '*Read Ephesians 5:21–6:9 before you begin study in this chapter.*'
        UID: BIB217.CH8.INTRO.P.7
