      title: 2 - Who Christ Is and What He Has Accomplished (Colossians 1:15–2:23)
      print_page: 35
      intro_body:
      - text: In this section of his letter to the Colossian congregation, Paul dealt
          in a straightforward way with the Colossian error. He identified its dangerous
          character and prescribed the antidote—Jesus Christ, supreme Savior and Lord.
          He began this section of the epistle with a hymn extolling Jesus Christ
          as the supreme creator, sustainer, and reconciler (1:15–23). Then, in order
          to ensure that these believers understand his motives, he shared with them
          the values, character, and goals of his ministry on their behalf (1:24–2:5).
          Finally, he exposed the character of the error the church was facing and
          again proclaimed the supremacy and sufficiency of Christ (2:6–23).
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH2.INTRO.P.1
      - text: Read Colossians 1:15–2:23 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Left-Subhead
