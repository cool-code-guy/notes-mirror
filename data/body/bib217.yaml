    course_objectives:
    - 1. Summarize background information related to the Prison Epistles.
    - 2. Identify key facts related to authorship, dating, and the recipients of these
      letters.
    - 3. Identify the major themes of each letter, and explain how these themes can
      apply to modern believers.
    - 4. Describe the organizational structure of each epistle, identifying major
      divisions.
    - 5. Recount key issues addressed in the Prison Epistles, such as conflicts, false
      teaching, and church successes.
    - 6. Identify key Christian doctrines addressed by Paul, and describe how Paul
      develops these teachings.
