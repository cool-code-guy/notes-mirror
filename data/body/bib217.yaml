      title: 3 - How Christians Should Live (Colossians 3:1–4:18)
      print_page: 49
      intro_body:
      - text: As Christians, what we live daily really matters because it reflects
          what we believe, and what we believe is crucial to the witness of our lives.
          Our daily life should be the acknowledgment of what our Heavenly Father
          has provided for us through His Son. And our lives should attest to the
          fact that the Holy Spirit’s work is vital. But without these truths showing
          forth in the lives of believers, individually and corporately, all is futile.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH3.INTRO.P.1
      - text: 'That is why in this section of the epistle, Paul moved from the doctrinal
          to the practical. He had dealt with the false doctrine and those who taught
          it. He had prescribed the antidote for the error—a return to the simplicity
          of the gospel and the absolute supremacy of Christ. He had emphasized who
          Christ is and what He accomplished through His death, burial, resurrection,
          and ascension. Now he stressed the importance of seeing the evidence of
          these beliefs in the everyday lives of Christians. He addressed three key
          areas in which the Christ-life should be lived out:'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH3.INTRO.P.2
      - text: 1. in believers’ relationships with one another and the world
        kind: hang
        cls: IST_Body-Hang-2
        UID: BIB217.CH3.INTRO.P.3
      - text: 2. in their home lives
        kind: hang
        cls: IST_Body-Hang-2
        UID: BIB217.CH3.INTRO.P.4
      - text: 3. in their workplaces
        kind: hang
        cls: IST_Body-Hang-2
        UID: BIB217.CH3.INTRO.P.5
      - text: Finally, he closes the letter by soliciting their intercessory prayer,
          highlighting several key people in the Lord’s work, and giving some final
          instructions.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH3.INTRO.P.6
      - text: Read Colossians 3:1–4:18 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Left-Subhead
        md: '*Read Colossians 3:1–4:18 before you begin study in this chapter.*'
        UID: BIB217.CH3.INTRO.P.7
