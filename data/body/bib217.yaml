    title: Prison Epistles
    units:
    - title: Colossians and Philemon
      chapters:
      - 1
      - 2
      - 3
      - 4
      intro_body:
      - text: Have you ever experienced the frustration of having to deal with problems
          and situations long distance? Can you imagine how complicated things would
          be if you could not use your cell phone or email? What if the only way to
          travel to deal with a situation was walking or, at best, on horseback or
          a long trip on a slow ship? What if you had to cope with the added difficulties
          brought about by imprisonment, which would mean there would be no traveling
          to anywhere at all? The only recourse left to you would be snail mail, better
          known as a personal letter, but it would be one of such a sensitive nature
          it would have to be hand delivered by a trusted friend.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.UNIT1.INTRO.P.1
      - text: That was precisely the challenge the great apostle Paul faced as he
          wrote the epistles or letters to the Colossians and to Philemon. Paul was
          in prison in Rome for the sake of the gospel. His apostolic letter to the
          Colossians was written to an individual congregation located in a small
          city in ancient Asia, about one hundred miles east of Ephesus. The letter
          to Philemon, on the other hand, was a very personal letter written to a
          wealthy church leader by the name of Philemon, on behalf of an enslaved
          man, Onesimus, who had run away. The blessing was that Onesimus had been
          converted through Paul’s ministry.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.UNIT1.INTRO.P.2
      - text: Colossians was written to deal with the problems Paul had heard the
          church in Colosse was facing. The letter begins with a customary greeting,
          a prayer of thanksgiving for their Christian character and vitality, and
          an apostolic prayer. Paul was deeply concerned about an unhealthy emphasis
          and false teaching that had found a footing in the congregation at Colosse.
          The dangerous doctrines that had infiltrated the church played to human
          pride, emphasized esoteric ideas and unusual experiences, and de-emphasized
          the sufficiency of Christ. Therefore, Paul extolled the supremacy, centrality,
          and sufficiency of Christ. In order to counter this false teaching, Paul
          emphasized how being “in Christ” and putting Him first in one’s life made
          all the difference in the world in daily living and interpersonal relationships.
          Being in Christ was to be lived out in the marriage and at home, as well
          as in the everyday world. Although he could not visit them personally because
          of his situation, the apostle was sending a delegation of trusted friends
          and colleagues with his apostolic letter to help them through this crisis.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.UNIT1.INTRO.P.3
      - text: On the other hand, the letter to Philemon was written to a respected
          member of the church in Colosse. Philemon was a wealthy landowner and businessman.
          Onesimus, a person enslaved by him, had run away and escaped to Rome. Somehow
          he had come in contact with Paul in Rome, heard the gospel, and experienced
          the life-transforming power of Christ. Now Paul was sending him back to
          Philemon. This was a risky venture, for legally Philemon could have Onesimus
          severely punished or even killed. Yet Paul wrote a gospel-centered appeal
          on behalf of Onesimus. The letter is filled with Christian character and
          values. It asks Philemon to demonstrate Christian love toward Onesimus,
          welcoming him back without punishment and writing off any debt he might
          owe. Going a step further, Paul suggested that Philemon should release him
          from slavery to resume his ministry alongside Paul. The letter asks Philemon
          to demonstrate full restoration, and hints at freedom for Onesimus. The
          social and spiritual dynamics of this letter have been revolutionary through
          the ages, challenging racism and classism, encouraging the abolition of
          slavery, and affirming the inclusion of all people on equal footing in the
          gospel and within the church.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.UNIT1.INTRO.P.4
    - title: Ephesians
      chapters:
      - 5
      - 6
      - 7
      - 8
      - 9
      intro_body:
      - text: Ephesians is definitely a seminal statement of Paul’s theology. So,
          clearly, is the book of Romans. This is true of Romans because of its emphasis
          on justification—how sinful humanity can become right with God through faith
          in Christ. I would argue, however, that Ephesians should be regarded as
          one of Paul’s strongest and most clearly explained theological statements
          because it fully spells out the dominant theme of all of his writings, the
          believer’s position in Christ. In Ephesians, Paul told us (1) what it means
          to be in Christ and (2) how that plays itself out in our daily lives.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.UNIT2.INTRO.P.1
      - text: Paul faced a daunting challenge in writing Ephesians. By the time of
          its writing, Colossians had probably been completed. In the meantime, however,
          he seems to have become aware of the fact that the doctrinal errors that
          plagued the Colossians were much more pervasive. They had infected all of
          the churches in ancient Asia. How do you deal with a situation like that
          from long distance (when you are imprisoned)? Paul wrote an apostolic letter.
          And we are forever grateful! The message of Ephesians has enriched and instructed
          Christians down through the centuries.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.UNIT2.INTRO.P.2
      - text: Although Ephesians lacks the vivid immediacy and concrete descriptions
          found in the smaller letter to the Colossians, together they provide us
          with a fairly clear picture of the situation that caused Paul to write it.
          Colossians gives us the apostle’s first response to a disturbing situation.
          Ephesians is the follow-up document, written like a comprehensive treatise
          designed to instruct and correct the situation in the churches of the Lycus
          Valley.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.UNIT2.INTRO.P.3
      - text: The first half of Ephesians (chapters 1–3) systematically emphasizes
          what Christ has accomplished through His death, burial, resurrection, and
          ascension. It stresses who Christians are and what is available to them
          in Christ. It paints a vivid picture of what it means to be lost and the
          rich blessing of being forgiven, restored, and included in Christ.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.UNIT2.INTRO.P.4
      - text: The second half of the epistle (chapters 4–6) points out the practical
          outcome of being in Christ. It reveals the difference that He makes within
          a local church, our personal lives, and our homes. It challenges believers
          to be engaged in the spiritual conflict and assures them of victory through
          the power of the Holy Spirit, the complete armor of God, and prayer!
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.UNIT2.INTRO.P.5
    - title: Philippians
      chapters:
      - 10
      - 11
      - 12
      - 13
      intro_body:
      - text: How amazing and inspiring it is to observe committed Christians who
          face pressure, problems, and persecution with grace, dignity, patience,
          and joy! When others who are facing similar situations observe their vibrant,
          victorious Christianity, they take heart. It encourages them to draw on
          the strength of the Lord, view their problems from a Christian perspective,
          and “rejoice in the Lord!” This is really the message of Paul’s great epistle
          to the Philippians.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.UNIT3.INTRO.P.1
      - text: Philippi was a prosperous and influential Roman colony located in ancient
          Macedonia. It was a special church to Paul and his memories of its planting
          and the people who made it up were warm and rich. Paul’s imprisonment made
          it impossible for him to visit them. So he writes an apostolic letter to
          them that radiates love, friendship, and concern for their welfare.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.UNIT3.INTRO.P.2
      - text: The congregation in Philippi was facing challenges within and without.
          There was pressure and persecution. A competitive, self-seeking atmosphere
          poisoned the fellowship. Disagreements and petty bickering troubled their
          fellowship. In this letter Paul drew upon his own experience and situation
          in prison to encourage the believers in Philippi to sustain or regain their
          perspective. He points to Jesus as the model of the servant leadership needed
          in their situation. Paul’s passion is that the progress of the gospel not
          be hindered by the actions and attitudes of professing Christians in Philippi.
          Yet in all of the pastoral concern Paul exhibited in the letter, an atmosphere
          of radiant, overcoming rejoicing dominates.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.UNIT3.INTRO.P.3
      - text: What an appropriate message for Christians in the modern world who face
          the daily pressures of living for Christ. Problems and pressures can rob
          us of the divine perspective on our lives. Interpersonal issues can damage
          the fellowship among believers. Disagreements can explode into conflicts
          that hinder the progress of the gospel. Joy evaporates, complaining increases,
          the church is damaged, and the lost are disillusioned. The answer presented
          in Philippians is for us to keep our eyes upon Jesus, follow His example
          of servanthood, put Him first in our lives, pray about everything, and rejoice
          in the Lord.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.UNIT3.INTRO.P.4
