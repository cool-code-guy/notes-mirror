      title: 12 - Encouragement, Exhortation, and Evaluation (Philippians 2:19–4:1)
      print_page: 203
      intro_body:
      - text: Timothy and Epaphroditus brought great encouragement to Paul in prison.
          Timothy was a faithful and capable “son” in the Lord (1 Timothy 1:2). Paul
          had depended on him many times. Epaphroditus had come to Paul as the personal
          representative of the church in Philippi. He brought a valuable report,
          much-needed money, and most of all, encouragement and help. Paul loved him
          and the church in Philippi.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH12.INTRO.P.1
      - text: Paul had planned to finish his letter to the church, but the report
          from Epaphroditus and others prompted him to write further exhortations
          and warnings. Apparently, legalism had made inroads into the church as well
          as teaching that corrupted the church’s understanding of God’s grace. In
          dealing with this situation, Paul testified to God’s working in his own
          life to bring about a marvelous transformation of his personal priorities.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH12.INTRO.P.2
      - text: Read Philippians 2:19–4:1 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Left-Subhead
        md: '*Read Philippians 2:19–4:1 before you begin study in this chapter.*'
        UID: BIB217.CH12.INTRO.P.3
      lessons:
