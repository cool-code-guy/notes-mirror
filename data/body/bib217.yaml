    - last_modified: '2026-03-27'
      title: 6 - What God Has Accomplished in Christ (Ephesians 2:1–3:21)
      print_page: 103
      intro_body:
      - text: The theme of Christ’s provision and Christian responsibility dominates
          Ephesians. This pattern is sometimes called the indicative–imperative motif
          (see chapter 5 in this IST). This terminology is based on how Paul used
          two verbal moods in the Greek language. The indicative mood is used to describe
          reality or facts from the perspective of someone looking at things objectively.
          In Ephesians the indicative mood is used to describe who Christ is, what
          He has done, and all the spiritual provision and realities that flow out
          of that. In the part of Ephesians we are dealing with in this chapter, the
          indicative mood dominates. The imperative mood is used extensively in chapters
          4–6 of Ephesians. Paul used this mood to deal with how Christians should
          live in light of what Christ has done and who they are in Him. Without fail,
          Paul moved logically from the indicative to the imperative—first emphasizing
          Christ’s provision and then dealing with Christian responsibility in light
          of that provision. In other words, chapters 4–6 of Ephesians flow out of
          what Paul has established, doctrinally, in chapters 1–3.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH6.INTRO.P.1
      - text: Chapter 2 of Ephesians is built on a before-and-after pattern. In the
          first part of chapter 2, Paul reminded the Ephesian Christians of what Christ
          has done for them personally through salvation. He has reconciled them to
          God in Christ. In the second part of Ephesians 2, Paul emphasized reconciliation
          through Christ on an interpersonal and collective level. In Christ, all
          are accepted and included as God’s covenant people, regardless of their
          background. Chapter 3:1–13 amplifies this theme around the concept of the
          mystery of Christ. And finally, Paul prayed that these believers would become
          aware of and appropriate all they have and are in Christ. The section ends
          with a powerful doxology of praise to God for all He is able to do in the
          lives of Christians personally and within the church collectively.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH6.INTRO.P.2
      - text: Read Ephesians 2:1–3:21 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Left-Subhead
        md: '*Read Ephesians 2:1–3:21 before you begin study in this chapter.*'
        UID: BIB217.CH6.INTRO.P.3
