    - last_modified: '2026-03-27'
      title: 11 - Christ’s Example and Christian Responsibility (Philippians 1:12–2:18)
      print_page: 183
      intro_body:
      - text: This part of Paul’s epistle to the church in Philippi is one of the
          most theologically profound, yet practical sections of the Bible. The believers
          in Philippi were facing challenges both within and outside of the church.
          They were in danger of losing a godly perspective in their circumstances
          and falling prey to attitudes and actions that could render them ineffective,
          neutralizing their witness and leading to the ruin of their congregation.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH11.INTRO.P.1
      - text: How can people maintain a positive perspective in difficult circumstances?
          In Philippians 1:12–26, Paul himself became an example to follow. How can
          we live overcoming Christian lives in a pagan world? Paul taught us how
          in Philippians 1:27–30. What brings joy to the heart of God and true Christian
          leaders? Paul said it is unity and Christlikeness in Philippians 2:1–11.
          How can congregations deal with the periodic challenges they face? Paul
          provided advice in 2:12–18.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH11.INTRO.P.2
      - text: In all of this, Paul emphasized the importance of a godly perspective,
          unity in the Spirit, Christlike character, and a consistent Christian lifestyle.
          What wonderful advice for individual Christians and congregations who seek
          to positively impact a godless culture.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH11.INTRO.P.3
      - text: Read Philippians 1:12–2:18 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Left-Subhead
        md: '*Read Philippians 1:12–2:18 before you begin study in this chapter.*'
        UID: BIB217.CH11.INTRO.P.4
