      title: 10 - Introducing Philippians (Philippians 1:1–11)
      print_page: 171
      intro_body:
      - text: Perspective is important. Perspective makes a difference in our ability
          to see things accurately, in evaluating their true roles. The story is told
          of a group of blindfolded children trying to describe an elephant. One described
          the elephant like the trunk of a tree. Another said after taking hold of
          its tail, “It seems to me like a rope.” Another was sure the elephant was
          like a big curved pipe because of its trunk. None had the total picture.
          None saw the elephant in full perspective.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH10.INTRO.P.1
      - text: Losing perspective can be dangerous. It causes us to panic when there
          is no reason to panic. We do dangerous and silly things when we see things
          improperly. We act in inappropriate ways because we think things are different
          from how they really are. It is essential for Christians to maintain proper
          perspective.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH10.INTRO.P.2
      - text: 'Although we find Paul in prison at the writing of this epistle and
          the believers in Philippi are struggling, his message to them is this: having
          Christ in your life brings perspective to difficult situations and produces
          unquenchable joy within.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH10.INTRO.P.3
      - text: Read Philippians 1:1–11 before you begin study in this chapter.
        kind: heading
        cls: IST_Body-Left-Subhead
        md: '*Read Philippians 1:1–11 before you begin study in this chapter.*'
        UID: BIB217.CH10.INTRO.P.4
