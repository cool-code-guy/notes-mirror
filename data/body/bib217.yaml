    - last_modified: '2026-03-27'
      title: 5 - Introducing Ephesians (1:1–23)
      print_page: 85
      intro_body:
      - text: Early in my Christian experience I heard an illustration I have never
          forgotten. It communicated so much truth about the way Christians sometimes
          live below their privilege. A man and his wife had worked hard, scrimped,
          saved, and finally purchased tickets for a long-awaited trip on a wonderful
          cruise. After purchasing the tickets, however, they had little money left.
          The wife was an enterprising person and purchased cheese, lunch meat, bread,
          and other items for meals on the trip. Day after day, while other passengers
          went to the formal dining room and dined upon sumptuous fare, this couple
          would slip away to eat cold sandwiches and snack items. The captain noticed
          this unusual behavior and inquired why they were not eating in the dining
          room with the other passengers. They self-consciously admitted they could
          not afford it. The captain was shocked and showed them their ticket. All
          meals were included in the price of passage. They had been living far below
          their privileges.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH5.INTRO.P.1
      - text: Ephesians was written to the churches of the Lycus Valley in ancient
          Asia near Ephesus. It informed believers of their blessings and benefits
          in Christ. Paul did not want these believers to live below their privilege.
          He did not want anyone to intimidate them. He wanted them to know who they
          were and what they had in Christ.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH5.INTRO.P.2
      - text: The rich bounty that was theirs had come to them through the death,
          burial, resurrection, and ascension of Jesus. They needed to be aware of
          their position and privilege. Paul opened this letter with praise to God
          for every spiritual blessing in Christ. Then he fell to his knees and asked
          God to open the spiritual eyes of the believers to grasp who they were and
          what they had in Christ Jesus. Christians today need the same enlightening
          experience. It is tragic to live below your privilege.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB217.CH5.INTRO.P.3
