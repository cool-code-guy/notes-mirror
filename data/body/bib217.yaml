      title: 1 - Introducing Colossians (1:1–14)
      print_page: 17
      intro_body:
      - text: 'An important key to effectiveness and success in life is expressed
          by the saying, “Keep first things first.” The truth of this saying is also
          applicable to Christians. We can easily lose sight of godly priorities.
          We can forget what is most significant in our lives—Jesus first, last, and
          everything in between. The believers in the ancient city of Colosse (also
          commonly spelled Colossae) were in danger of this error. Paul wrote the
          letter to the Colossians to emphasize this single principle: the absolute
          supremacy and sufficiency of Jesus Christ in the Christian life. And the
          ultimate objective is “so that in everything he might have the supremacy”
          (1:18). Paul was saying, keep first things first! Believer, keep Jesus first.'
        kind: prose
        cls: IST_Body-Indent
        md: 'An important key to effectiveness and success in life is expressed by
          the saying, “Keep first things first.” The truth of this saying is also
          applicable to Christians. We can easily lose sight of godly priorities.
          We can forget what is most significant in our lives—Jesus first, last, and
          everything in between. The believers in the ancient city of Colosse (also
          commonly spelled Colossae) were in danger of this error. Paul wrote the
          letter to the Colossians to emphasize this single principle: the absolute
          **supremacy** and **sufficiency** of Jesus Christ in the Christian life.
          And the ultimate objective is “so that in everything he might have the supremacy”
          (1:18). Paul was saying, keep first things first! Believer, keep Jesus first.'
        UID: BIB217.CH1.INTRO.P.1
