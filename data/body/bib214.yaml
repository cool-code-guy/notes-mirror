    course_objectives:
    - 1. Discuss the importance, structure, authors, and canon of the Old Testament.
    - 2. Explain how Genesis 1–11 serves as the introduction to the Old Testament,
      and summarize what it says about Creation, the Fall, the Flood, Noah and his
      sons, and Babel.
    - 3. Evaluate God’s covenants with Abraham, Moses, and David, and tell how each
      covenant influenced the history, religious life, and political relationships
      of the Jews.
    - 4. Describe the Exodus, the Covenant, the tabernacle, the offerings, priests,
      laws, and feasts.
    - 5. Summarize events that happened at Sinai, Kadesh, Moab, and Mount Nebo (Pisgah).
    - 6. Identify characteristics and themes from the five poetic and wisdom books.
    - 7. Comment on key leaders and prophets of each period from Abraham to Malachi.
    - 8. Summarize and apply two cross-cultural, timeless principles from each book
      of the Old Testament.
