        subobjectives:
          11.1.1:
            last_modified: '2026-05-28'
            text: Summarize what Joel says about locusts, repentance, Pentecost, and
              the Day of the Lord.
            glossary:
            - term: Day of the Lord
              definition: the term used in the Old Testament to describe God’s coming
                judgment on a nation or nations. It is also used in a wider sense
                in Scripture to describe future events in the last days of human history
                (ie., the period of time from the Rapture to the Great White Throne
                Judgment).
              paragraph: BIB214.11.1.1.P.9
              UID: BIB214.11.1.1.G.1
            - term: harbinger
              definition: a person or thing that indicates or hints at what is about
                to happen
              paragraph: BIB214.11.1.1.P.28
              page: 168
              UID: BIB214.11.1.1.G.2
            - term: Pentecost
              definition: the day on which the disciples received the baptism in the
                Holy Spirit (Acts 2) as promised by Jesus before He ascended to the
                right hand of the Father (Acts 1:8); in the Old Testament, this was
                the Jewish Feast of Weeks, a festival that celebrated the firstfruits
                of the harvest; called “Pentecost” because it was celebrated fifty
                days after the feast of the Passover
              paragraph: BIB214.11.1.1.P.21
              UID: BIB214.11.1.1.G.3
