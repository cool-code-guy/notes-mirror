      paragraph: THE311.7.1.1.P.4
      page: 117
    - term: spiritual journal
      definition: Christians can benefit from regularly writing in a journal (not
        necessarily daily) as a discipline to focus attention on our relationship
        with God throughout our lives. This discipline will help to clarify the heart
        and mission of our individual lives. We should write the thoughts concerning
        our lives that we long to share with God and record what we feel God is saying
        to us. This would also include making note of the answers we receive to our
        prayers.
      chapter: 5
      paragraph: THE311.5.2.1.P.37
