    - term: church at Laodicea
      definition: one of the seven churches (all in Turkey) addressed in Revelation.
        Located on a commercial route, the city was very rich. Laodicea produced wool
        clothes and eye salve. Church members considered themselves rich, having need
        of nothing from Christ. They were spiritually blind; they needed to repent.
        This was the only church of the seven about which Christ had nothing positive
        to say, yet He was still knocking on the doors of their minds and hearts,
        hoping to be invited in.
      chapter: 1
      paragraph: THE311.1.1.1.P.4
      page: 15
    - term: Dagon
      definition: this idol worshipped by the Philistines was represented as half
        human and half fish. He was a god of nature and fertility.
      chapter: 11
