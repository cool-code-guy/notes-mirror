      page: 30
    - term: Samaritan
      definition: an ethic group that descended from the Israelites. While they have
        connections to ancient Samaria, the group gets its name from their religion,
        Samaritanism. Their religion is based on the Torah and the keeping of the
        law. The Torah they profess differs from that of the Jews. Estimates claim
        that there are currently less than eight hundred Samaritans.
