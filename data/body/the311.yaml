    - term: Brother Lawrence
      definition: (1610–1691) a French monk who worked in the monastery kitchen most
        of his life. He performed every task out of his love for God. He wrote The
        Practice of the Presence of God . He died in obscurity and is remembered for
        the closeness of his relationship to God.
      chapter: 1
