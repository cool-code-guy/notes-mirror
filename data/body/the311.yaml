    - term: Sychar
      definition: An ancient city in Samaria, south of Nazareth, and located between
        the Mediterranean Sea and the Jordan River. At one time this land had been
        purchased by Jacob and it is said that Joseph is buried in a tomb not far
        from the well where Jesus asked the Samaritan woman for a drink. The ancients
