        subobjectives:
          1.1.1:
            last_modified: '2026-03-27'
            text: Explain the significance of God’s invitation to prayer.
            glossary:
            - term: church at Laodicea
              definition: one of the seven churches (all in Turkey) addressed in Revelation.
                Located on a commercial route, the city was very rich. Laodicea produced
                wool clothes and eye salve. Church members considered themselves rich,
                having need of nothing from Christ. They were spiritually blind; they
                needed to repent. This was the only church of the seven about which
                Christ had nothing positive to say, yet He was still knocking on the
                doors of their minds and hearts, hoping to be invited in.
