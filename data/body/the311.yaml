    course_objectives:
    - 1. Define prayer by describing its benefits, purposes, and motivations.
    - 2. Review the Bible’s treatment of prayer, including both biblical instructions
      and historical accounts of praying.
    - 3. Explain the relationship between faith and prayer, and describe prayer’s
      spiritual power.
    - 4. Explain how prayer is a reciprocal experience between God and the one who
      prays.
    - 5. Describe the relationship between spiritual discipline and prayer, and list
      practical activities necessary toward developing a life of prayer.
    - 6. Identify challenges and obstacles to a consistent and effective life of prayer.
    - 7. Explain several key factors related to the role of prayer in effective spiritual
      leadership.
    - 8. Define worship, and relate the Bible’s treatment of worship in both Testaments.
    - 9. List and explain principles and methods related to biblical leadership in
      corporate worship.
