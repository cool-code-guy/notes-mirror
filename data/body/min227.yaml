      - uid: MIN227.15.1.4.TY.2
        subobj: 15.1.4
        type: ty
        question: Jesus spoke of the “gates of hell” as a
        choices:
          A: powerful enemy rampaging against the Church.
          B: target for successful attacks by the Church.
          C: symbol of the believer’s inner struggle with sin.
          D: reminder of death and the Great White Throne judgment.
        answer: B
