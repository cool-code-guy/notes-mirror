        subobj: 15.1.4
        type: ty
        question: Evangelism is best understood as a
        choices:
          A: persuasive act that convinces the lost of the gospel’s truth.
          B: God-centered work of the Holy Spirit in which the believer cooperates.
          C: divine gift available to all believers who ask for it.
