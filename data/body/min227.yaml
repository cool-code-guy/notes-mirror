        choices:
          A: Evangelism, worship, discipleship, demonstrating compassion
          B: Worship, tithing, spiritual gifts, demonstrating compassion
          C: Evangelism, discipleship, communion, spiritual gifts
          D: Water baptism, Pentecost, evangelism, prayer
        answer: A
