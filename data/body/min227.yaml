      - uid: MIN227.13.2.3.TY.1
        subobj: 13.2.3
        type: ty
        question: The ultimate goal of the disciple is to
        choices:
          A: live a life of sinless perfection.
          B: become like his or her master.
          C: absorb the theological position statements of his or her church.
          D: achieve material blessing as proof of God’s favor.
        answer: B
      - uid: MIN227.13.2.4.TY.1
        subobj: 13.2.4
        type: ty
        question: When considering personal responsibility in relationship to discipleship,
        choices:
          A: each person is responsible to identify the discipler for his or her life.
          B: each person’s soul is the responsibility of a specific believer.
          C: each person is responsible for his or her spiritual condition, but other
            believers are responsible to spiritually nurture him or her.
          D: God takes full responsibility to choose disciplers for His followers.
        answer: C
      - uid: MIN227.13.2.4.TY.2
        subobj: 13.2.4
        type: ty
        question: In the lifelong discipleship process, the moment of salvation is
        choices:
          A: a spiritual starting point rather than a finish line.
          B: a partial act of regeneration that requires nurturing to inherit eternal
            life.
          C: symbolic, with discipleship creating the fullness of God’s work of grace.
          D: irreversible, with discipleship following a pre-ordained path of spiritual
            growth.
