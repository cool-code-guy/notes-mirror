      - uid: MIN227.14.2.4.TY.1
        subobj: 14.2.4
        type: ty
        question: Experience has shown that it is most effective to ask for new faith
          promises every
        choices:
          A: year.
          B: six months.
          C: Missions Sunday.
          D: General Council.
        answer: B
