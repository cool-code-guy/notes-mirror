        title: 'Keys to Interpreting Poetry: Historical Context, Parallelism, and
          Figurative Language'
        subobjectives:
          9.1.1:
            last_modified: '2026-03-27'
            text: Explain how to find the historical context of a psalm and how it
              can help you interpret.
            glossary:
            - term: antithetic
              definition: marked by the rhetorical contrast of ideas by means of parallel
                arrangements of words, clauses, or sentences
              paragraph: BIB121.9.1.1.P.191
              page: 184
              UID: BIB121.9.1.1.G.1
            - term: chiasm
              definition: a literary, intersecting pattern found in the verses in
                some of the psalms
              paragraph: BIB121.9.1.1.P.179
              page: 183
              UID: BIB121.9.1.1.G.2
            - term: parallelism
              definition: The use of equivalent grammatical forms or matching sentence
                structures to express the same ideas
              paragraph: BIB121.9.1.1.P.98
              page: 182
              UID: BIB121.9.1.1.G.3
            - term: superscriptions
              definition: writings (scriptions) above (super) a psalm. Superscriptions
                (headings) are above 116 of the 150 Psalms. In your Bible, you will
                find these writings between the number of the Psalm and verse 1. These
                writings above the Psalms were not part of the original psalms, but
                they are very old. All of them were written before the Septuagint
                (200 BC), which is the Greek translation of the Hebrew Bible.
              paragraph: BIB121.9.1.1.P.26
              page: 179
              UID: BIB121.9.1.1.G.4
            - term: synonyms
              definition: different words that mean the same thing
              paragraph: BIB121.9.1.1.P.100
              page: 182
              UID: BIB121.9.1.1.G.5
            - term: synthetic
              definition: In a synthetic poem, all of the lines together give the
                whole thought or big picture
              paragraph: BIB121.9.1.1.P.209
              page: 184
              UID: BIB121.9.1.1.G.6
          9.1.2:
            last_modified: '2026-05-22'
            text: Identify and give examples of five types of parallelism in Hebrew
              poetry.
            glossary: []
          9.1.3:
            last_modified: '2026-05-22'
            text: Give two examples of how to interpret figurative language in poetry.
            glossary: []
