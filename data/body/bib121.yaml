      title: 2 - Past and Present Methods of Interpreting Scripture
      print_page: 36
      lessons:
      - last_modified: '2026-05-22'
        title: Jewish Interpreters, the Apostles, and Church Fathers (200 BC–AD 600)
        subobjectives:
          2.1.1:
            last_modified: '2026-03-27'
            text: Contrast the way the schools of Alexandria and Antioch interpreted
              Scripture.
            glossary:
            - term: Arius
              definition: a priest who proposed that if the Father begat the Son,
                Christ must have had a beginning, that there was a time when he was
                not, and that his essence was from nothing like the rest of creation
              paragraph: BIB121.2.1.1.P.100
              page: 42
              UID: BIB121.2.1.1.G.1
            - term: Christologically
              definition: in reference to Christ; about Christ
              paragraph: BIB121.2.1.1.P.31
              page: 39
              UID: BIB121.2.1.1.G.2
            - term: church fathers
              definition: Christian writers, living in the era of AD 100–600, who
                were accepted by the church as an authoritative witnesses to its teaching
                and practices
              paragraph: BIB121.2.1.1.P.68
              page: 41
              UID: BIB121.2.1.1.G.3
            - term: Council of Nicea
              definition: a gathering similar to the one described in Acts 15:4-22;
                it condemned the beliefs of Arius and wrote the first version of the
                creed proclaiming that the Son was “one in being with the Father.”
              paragraph: BIB121.2.1.1.P.100
              page: 42
              UID: BIB121.2.1.1.G.4
            - term: Hellenistic
              definition: of or relating to Greek history, culture, or art after Alexander
                the Great
              paragraph: BIB121.2.1.1.P.3
              page: 37
              UID: BIB121.2.1.1.G.5
            - term: Jewish interpreters
              definition: refers to the rabbis who interpreted scripture in the era
                following the Babylonian captivity, after 457 BC. As Ezra read the
                Hebrew scriptures aloud to the people, these interpreters translated
                his Hebrew readings into Aramaic.
              paragraph: BIB121.2.1.1.P.1
              page: 37
              UID: BIB121.2.1.1.G.6
            - term: Nestorianism
              definition: the false belief that the divine and human persons remained
                separate in the incarnate Christ
              paragraph: BIB121.2.1.1.P.105
              page: 42
              UID: BIB121.2.1.1.G.7
            - term: Reformation
              definition: a sixteenth-century religious movement marked ultimately
                by rejection or alteration of some Roman Catholic doctrine and practice
                and establishment of the Protestantism.
              paragraph: BIB121.2.1.1.P.72
              page: 41
              UID: BIB121.2.1.1.G.8
            - term: Septuagint
              definition: a Greek version of the Jewish Scriptures redacted in the
                third and second centuries BC by Jewish scholars and adopted by Greek-speaking
                Christians
              paragraph: BIB121.2.1.1.P.19
              page: 38
              UID: BIB121.2.1.1.G.9
            - term: Targum
              definition: an Aramaic translation and interpretation of the Old Testament
                by Jewish rabbis
              paragraph: BIB121.2.1.1.P.2
              page: 37
              UID: BIB121.2.1.1.G.10
          2.1.2:
            last_modified: '2026-05-22'
            text: Explain four ways the apostles interpreted Scripture.
            glossary: []
