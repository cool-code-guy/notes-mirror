    level: 3
    status: active
    title: Preaching in the Contemporary World
    units:
    - chapters:
      - 1
      - 2
      - 3
      title: Is It True?
      intro_body:
      - text: Truth remains a deeply important issue in our world today. While many
          people wrestle with what truth really is, there is still a shared longing
          to find something steady, something trustworthy. As preachers, we stand
          in a sacred place; we have been entrusted with the truth of God’s Word and
          called to share it with others in a way that brings life. Before focusing
          on structure, delivery, or relevance, we must first be sure that what we
          are proclaiming is true and rooted in Scripture. At the same time, we must
          understand how those we are speaking to perceive truth, so that we can communicate
          it in a way that meets them where they are. When truth is both faithfully
          held and compassionately shared, it has the power to truly shape lives.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.UNIT1.INTRO.P.1
      - text: In chapter 1 of this course, you will learn how the definition of truth
          has changed in the modern and postmodern world, and will discover how the
          world’s definition of truth will affect biblical preaching. Chapter 2 will
          help you understand the importance of the Bible, the authority of the Bible,
          and how the Bible speaks truth in today’s world. Once this foundation of
          biblical authority is laid, chapter 3 will help you discover keys to prepare
          a message true to Scripture and learn how to avoid mistakes common in biblical
          interpretation.
        kind: prose
        cls: IST_Body-Indent
        md: In chapter 1 of this course, you will learn how the definition of *truth*
          has changed in the modern and postmodern world, and will discover how the
          world’s definition of *truth* will affect biblical preaching. Chapter 2
          will help you understand the importance of the Bible, the authority of the
          Bible, and how the Bible speaks truth in today’s world. Once this foundation
          of biblical authority is laid, chapter 3 will help you discover keys to
          prepare a message true to Scripture and learn how to avoid mistakes common
          in biblical interpretation.
        UID: MIN325.UNIT1.INTRO.P.2
    - chapters:
      - 4
      - 5
      - 6
      - 7
      title: Is It Clear?
      intro_body:
      - text: The first step to presenting a sermon that will connect with the contemporary
          world is having a message that is true. The second step is having a message
          that is clear. Just because a message is right does not mean that the way
          it is organized or delivered will be easy to understand. In unit 2, we will
          look at sermons and ask the question, “Is it clear?” To begin this study,
          chapter 4 will develop the idea of centering the sermon. The sermon should
          have one main idea and be centered on God. This is accomplished through
          study and hard work on the part of the minister, and revelation and power
          on the part of the Holy Spirit. In chapter 5, the structure of the sermon
          will be examined. First, the preacher will be shown how to anticipate audience
          challenges to the sermon. Second, the preacher will learn how to organize
          and structure the sermon for clear presentation and maximum understanding.
          In chapter 6, preachers will learn how to study the audience in order to
          prepare sermons geared for a specific audience. Issues like mixed congregations
          (Christian and non-Christian) and church language will be addressed with
          the goal of helping a preacher make the sermon as clear as possible. Finally,
          in chapter 7, the preacher’s personal life will be discussed. A preacher’s
          life cannot be separated from the message he or she preaches. In order for
          a sermon to be clear, the message of the preacher’s life must also be clear
          and match the words he or she professes.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.UNIT2.INTRO.P.1
    - chapters:
      - 8
      - 9
      - 10
      title: Is It Interesting?
      intro_body:
      - text: Today’s preaching has more concern for how the sermon is knitted together
          with the rest of the worship experience. The most effective preachers in
          the twenty-first century view preaching as part of a much larger worship
          experience. The art of creating engaging worship experiences is crucial
          to effective ministry in today’s contemporary culture. Great communicators
          of the gospel leading healthy, growing churches will guide the entire congregation
          on a path to spiritual maturity.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.UNIT3.INTRO.P.1
      - text: The basic elements of a contemporary worship experience include, but
          are not limited to, the spoken word (the preaching event), uplifting worship
          music and singing, prayer and contemplative reflection, multimedia presentations,
          personal testimony and drama, stage decor, lighting and sound, and audience
          interaction. When you discover how to design a meaningful worship experience
          that incorporates a variety of these creative elements, you partner more
          effectively with the Holy Spirit in a combined effort to cultivate radical
          life change in the hearts and minds of the congregation.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.UNIT3.INTRO.P.2
      - text: Unit 3, beginning with chapter 8, will help present-day preachers design
          creative, engaging worship experiences through a combination of contemporary,
          multisensory worship elements and age-old biblical principles. Special emphasis
          will be placed on how to develop the God-given gift of creativity. Chapter
          9 will focus on the use of narrative preaching styles and how to connect
          with today’s culture. The chapter following will demonstrate how to develop
          an annual preaching calendar and work with creative preaching teams.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.UNIT3.INTRO.P.3
      - text: Unit 3 is designed to help the preaching professional gain new insights
          and practical tools to reach today’s audience, as well as inspire those
          up-and-coming preachers who have yet to deliver their first sermon. Whatever
          category you might find yourself in, study this material with an open mind,
          and ask the Holy Spirit to saturate your soul with an ever-growing desire
          to preach the Word in hopes of reaching the lost and strengthening the found.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.UNIT3.INTRO.P.4
    - chapters:
      - 11
      - 12
      title: Is It Relevant?
      intro_body:
      - text: 'While the church has the greatest story ever told, many people seem
          to be turning a deaf ear. What is true of preaching is true of all communication:
          what you say matters, but how you say it also matters. Effective preachers
          in the twenty-first century not only need solid biblical content, but also
          innovative and insightful delivery. If we are to counter the stereotype
          about preaching that is widespread in contemporary culture, we must develop
          and discover new ways to tell an old story.'
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.UNIT4.INTRO.P.1
      - text: This final unit will help today’s preacher reach the contemporary world
          through preaching with relevance. Relevant preaching and worship experiences
          are keys to connecting with and ministering to today’s culture. In chapter
          11, we will learn a lesson from early Pentecostal missionaries as they navigated
          difficult circumstances, encumbered by language and cultural barriers. Chapter
          12 will then provide modern principles of how to preach with relevance and
          imagination in a culture that needs to hear the story of God’s love and
          forgiveness.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.UNIT4.INTRO.P.2
      - text: After you have studied this material, it is our prayer that you will
          develop a deep passion to preach relevant messages that connect with today’s
          audience. Please prayerfully seek the leading of the Holy Spirit and make
          a lifelong commitment to creating a difference for Christ, even if that
          means reworking your preaching style and sacrificing personal preference
          for evangelistic effectiveness.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.UNIT4.INTRO.P.3
