    - last_modified: '2026-06-16'
      title: 11 - Getting the Message Across
      print_page: 143
      intro_body:
      - text: Communicating the gospel is no easy task, especially when we do not
          speak the language of the listener. The early missionaries of the Pentecostal
          movement learned this lesson the hard way. Filled with evangelistic zeal
          to take the gospel to all corners of the earth, they set sail for faraway
          lands with nothing more than a few supplies and a fire in their hearts to
          win souls for Christ. While their priorities were in the right place, history
          has proven that their methodology was unfortunately misguided.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.CH11.INTRO.P.1
      - text: This chapter will take a brief look at the work of early Pentecostal
          missionaries who set out to communicate the gospel in a culture that did
          not speak their language or understand their customs. Much can be learned
          by their initial failure. Practical lessons will also be gleaned along with
          significant implications for contemporary preachers ministering in the twenty-first
          century culture that, much like the mission fields of old, no longer speaks
          the language of the church or understands its outdated culture and old-fashioned
          customs.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.CH11.INTRO.P.2
