    - last_modified: '2026-05-22'
      title: 9 - Communication that Connects
      print_page: 117
      intro_body:
      - text: Four common words in the English language are once upon a time . Stories
          are found in every culture, and everyone loves a good story. People tell
          stories through every possible medium, including commercials, talk shows,
          the news, video games, reality television, sitcoms, within families, and
          the list goes on. Clearly, storytelling is an effective and enjoyable way
          to communicate.
        kind: prose
        cls: IST_Body-Indent
        md: Four common words in the English language are *once upon a time*. Stories
          are found in every culture, and everyone loves a good story. People tell
          stories through every possible medium, including commercials, talk shows,
          the news, video games, reality television, sitcoms, within families, and
          the list goes on. Clearly, storytelling is an effective and enjoyable way
          to communicate.
        UID: MIN325.CH9.INTRO.P.1
      - text: An accomplished storyteller invites the listener into another world
          and paints pictures with words where one can experience firsthand the environment
          and emotions felt by the characters in the narrative. Similar to storytelling,
          narrative preaching brings biblical stories, and what are often deemed dry
          doctrinal dogma, to life. The art of narrative preaching, as we will discover
          in this chapter, is a learned communication style that, when perfected,
          makes familiar things new and new things familiar.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.CH9.INTRO.P.2
      - text: Robert Schuller, who was known for his ministry and leadership teaching,
          said, “The most effective preachers of the twenty-first century will possess
          the uncanny ability to write a sermon much like a modern-day sitcom writer
          weaves multiple stories together to form a cohesive plot. And they will
          be able to do it in a half-hour or less.” In other words, the effective
          communicator unleashes the truth of Scripture through storytelling, which
          is built on a creative plot line that moves toward resolution and catharsis.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.CH9.INTRO.P.3
      - text: This chapter will explain why narrative preaching is one of the most
          powerful communication styles in our culture today. We will discuss some
          of the strengths and weaknesses of narrative preaching and provide practical
          evaluation tools and techniques for this creative form of communication.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.CH9.INTRO.P.4
