    - last_modified: '2026-06-16'
      title: 3 - True to the Text
      print_page: 39
      intro_body:
      - text: Knowing your audience’s definition of truth and understanding biblical
          authority are only two of the important pieces necessary for presenting
          a sermon that is true. The third piece to this puzzle is staying true to
          the text itself. Just because a minister believes the Bible is absolute
          truth does not mean a minister will present a true message. Preaching a
          clear, life-changing sermon requires commitment to preaching a message that
          is true to the intent of Scripture. Paul’s instruction to Timothy was for
          him not to preach his own opinion, what his hearers simply wanted to hear,
          or what he thought was sound doctrine. Timothy’s words and instructions
          were to be guided by, true to, and filled with sound biblical study and
          understanding of what Scripture taught. Like Timothy, preachers today should
          preach the Word.
        kind: prose
        cls: IST_Body-Indent
        md: Knowing your audience’s definition of *truth* and understanding biblical
          authority are only two of the important pieces necessary for presenting
          a sermon that is true. The third piece to this puzzle is staying true to
          the text itself. Just because a minister *believes* the Bible is absolute
          truth does not mean a minister will present a true message. Preaching a
          clear, life-changing sermon requires commitment to preaching a message that
          is true to the intent of Scripture. Paul’s instruction to Timothy was for
          him not to preach his own opinion, what his hearers simply wanted to hear,
          or what he thought was sound doctrine. Timothy’s words and instructions
          were to be guided by, true to, and filled with sound biblical study and
          understanding of what Scripture taught. Like Timothy, preachers today should
          preach the Word.
        UID: MIN325.CH3.INTRO.P.1
