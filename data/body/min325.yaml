    course_objectives:
    - 1. Distinguish between modernism and postmodernism and explain how these movements
      influenced the church’s presentation of the gospel.
    - 2. Defend the reliability of the Bible as the preacher’s foundation.
    - 3. Summarize the process of developing sermons that effectively communicate
      biblical truth.
    - 4. Identify elements of effective sermons for modernists and postmodernist audiences.
    - 5. Describe the elements of effective communication in a modern and postmodern
      world.
    - 6. Discuss the impact of the preacher’s personal life on the effectiveness of
      sermons.
    - 7. Explain the relationship between creativity, technology, and effective worship
      experiences.
    - 8. Compare and contrast the effectiveness of inductive, deductive, and narrative
      preaching in a modern and postmodern world.
    - 9. Explain the value and process of leading a creative preaching planning team.
    - 10. Analyze the relationship between the decline of church attendance in North
      America and the perceived relevance of the church.
