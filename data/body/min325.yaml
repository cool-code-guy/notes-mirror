    - last_modified: '2026-06-16'
      title: 1 - The Search for Truth
      print_page: 15
      intro_body:
      - text: A person cannot face the topic of preaching without first considering
          the fact that ministers preach what they consider to be true. They are convinced
          of their message, and their job, as they see it, is to preach in such a
          way that others are convinced as well. Ministers believe that what they
          say is not only true; it is truth. The problem is that what the minister
          considers truth and what others consider truth can be vastly different.
          Knowing how to speak an unchanging truth to people with differing ideas
          of what truth means can be daunting.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.CH1.INTRO.P.1
      - text: Today’s world is experiencing a shift away from a philosophy known as
          modernism . The present world is challenging assumptions of the modern era
          and developing its own set of assumptions. This shift in philosophy presents
          special challenges to the preacher. This chapter will look at how modern
          and postmodern worldviews developed, will examine each perspective’s view
          of truth, and will look at how this mix of modern and postmodern worldviews
          affects preachers’ presentation of a true message.
        kind: prose
        cls: IST_Body-Indent
        md: Today’s world is experiencing a shift away from a philosophy known as
          *modernism*. The present world is challenging assumptions of the modern
          era and developing its own set of assumptions. This shift in philosophy
          presents special challenges to the preacher. This chapter will look at how
          modern and postmodern **worldviews** developed, will examine each perspective’s
          view of truth, and will look at how this mix of modern and postmodern worldviews
          affects preachers’ presentation of a true message.
        UID: MIN325.CH1.INTRO.P.2
      lessons:
      - last_modified: '2026-05-22'
        title: The Modern View of Truth
        subobjectives:
          1.1.1:
            last_modified: '2026-05-22'
            text: Define truth from a modern viewpoint.
            glossary:
            - term: Enlightenment
              definition: a philosophic movement of the eighteenth century that rejected
                traditional social, religious, and political ideas and emphasized
                rationalism
              paragraph: MIN325.1.1.1.P.3
              page: 16
              UID: MIN325.1.1.1.G.1
            - term: Middle Ages
              definition: the period of European history from about AD 500 to about
                1500
              paragraph: MIN325.1.1.1.P.4.1
              page: 16
              UID: MIN325.1.1.1.G.2
            - term: modernism
              definition: a move away from any idea of truth as separate from science
                and scientific
              paragraph: MIN325.1.1.1.P.7.1
              page: 17
              UID: MIN325.1.1.1.G.3
            - term: Renaissance
              definition: the European transition from medieval to modern times, from
                the fourteenth to the seventeenth century; a time of the revival of
                classical teaching and expression which resulted in developing the
                arts and literature and the beginning of modern science
              paragraph: MIN325.1.1.1.P.3
              page: 16
              UID: MIN325.1.1.1.G.4
            - term: Romanticism
              definition: an eighteenth-century literary, artistic, and philosophical
                movement, marked by an emphasis on imagination and emotions, exaltation
                of the primitive and the common man, appreciation of nature, an interest
                in melancholy, and use of older forms of poetry
              paragraph: MIN325.1.1.1.P.7.1
              page: 17
              UID: MIN325.1.1.1.G.5
            - term: worldview
              definition: basic assumptions about reality, which are the reasons for
                the beliefs and behavior of a culture
