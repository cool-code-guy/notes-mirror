    - last_modified: '2026-06-17'
      title: 12 - Preaching with Imagination
      print_page: 155
      intro_body:
      - text: Creative thinking is a popular term and practice in many businesses
          today as it opens the door to new ideas and solutions to old and new problems.
          The premise of this imaginative thinking is adopting a culture of innovation,
          where each person’s contribution is valued within the organization. Often,
          such valuing of personnel translates into success for the organization—satisfied
          employees are eager to fulfill organizational goals.
        kind: prose
        cls: IST_Body-Indent
        md: '*Creative thinking* is a popular term and practice in many businesses
          today as it opens the door to new ideas and solutions to old and new problems.
          The premise of this imaginative thinking is adopting a culture of innovation,
          where each person’s contribution is valued within the organization. Often,
          such valuing of personnel translates into success for the organization—satisfied
          employees are eager to fulfill organizational goals.'
        UID: MIN325.CH12.INTRO.P.1
      - text: As a slightly different kind of organization, the church can benefit
          from the merits of creative thinking. In fact, successful preaching in the
          postmodern world demands creative thinking. For today’s preachers to be
          relevant in contemporary society, they must not be reluctant to explore
          new ways of presenting the timeless message of Christ. Furthermore, as beneficiaries
          of the original creative thinker—God, the Creator—Christians may be more
          infused to set the pace on creativity. This final chapter presents some
          outside-the-box approaches to thinking about and communicating the gospel
          in ways that will stimulate both interest and life change in this postmodern
          world.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.CH12.INTRO.P.2
