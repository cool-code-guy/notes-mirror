    - last_modified: '2026-06-17'
      title: 2 - Biblical Authority
      print_page: 25
      intro_body:
      - text: Numerous religions, religious books, and religious beliefs exist in
          the world, so when preachers stand up to preach, they need to have confidence
          that the message they are going to present is right. Paul’s admonition to
          Timothy to “preach the Word” (2 Timothy 4:2) is still a good instruction
          for preachers in the contemporary world. The foundation for sermons must
          be the Bible. The Bible is trustworthy and true, and preachers can trust
          its authority and power; they can stake their lives on it. In fact, the
          Bible is so important that the Holy Spirit often speaks to people through
          the Bible’s words.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.CH2.INTRO.P.1
      - text: While preachers can do many things to increase the effectiveness and
          enjoyment of their sermons, nothing can make up for a lack of biblical teaching.
          In order to have a say in matters of truth to modern and postmodern people,
          and in order to present a sermon that has life-changing capability, preachers
          need to understand and trust the Bible’s authority, recognize its powerful
          role in salvation, and trust the Holy Spirit’s ability to make the Bible
          alive to its hearers.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.CH2.INTRO.P.2
      lessons:
