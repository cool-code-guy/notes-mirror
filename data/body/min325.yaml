    - last_modified: '2026-06-16'
      title: '6 - Speaker / Audience Dynamics Part 1: Know Your Audience'
      print_page: 79
      intro_body:
      - text: The effective preacher not only desires to preach a solid message, but
          also desires to preach in a way that connects with the audience. One of
          the best ways to relate to an audience is to know them. The issues, questions,
          struggles, and interests of a group of Midwestern farmers are vastly different
          from those of a group of business people in New York. Knowing the audience,
          what they do, their experiences, their backgrounds, their education, and
          their occupations can aid the preacher in developing a sermon that speaks
          specifically to them.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.CH6.INTRO.P.1
      - text: This chapter will look at challenges preachers face with audience identification,
          ways to present the gospel message, and how the Holy Spirit helps the preacher
          and audience connect.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.CH6.INTRO.P.2
