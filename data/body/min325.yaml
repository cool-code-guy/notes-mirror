    - last_modified: '2026-05-22'
      title: '7 - Speaker/Audience Dynamics Part 2: Know Yourself'
      print_page: 91
      intro_body:
      - text: 'It is hard to believe people when they say one thing and do another.
          The same can be said for preaching. All the eloquence, scholarship, and
          creativity in the world cannot overcome the genuine message of the preacher’s
          life. Though the expression is somewhat overused, it is still true: you
          have to walk the walk and talk the talk. The preacher’s lifestyle cannot
          be separated from a sermon. The personal life of the preacher will speak
          as loudly as, if not louder than, the sermon itself. Thus, clear sermons
          require the preacher to have a clear lifestyle.'
        kind: prose
        cls: IST_Body-Indent
        UID: MIN325.CH7.INTRO.P.1
