      title: 9 - Living the Holy Life (Leviticus 17–27)
      print_page: 125
      intro_body:
      - text: 'Leviticus 17 makes the transition from the first half of the book on
          approaching the holy God through atonement (the theological category of
          justification) to the second half on living the atoned-for, holy life (the
          theological category of sanctification) in response to reconciliation with
          the holy God. Chapters 17–27 call God’s people to sanctification, living
          to honor the Lord by reflecting His values. The message of Leviticus is
          holiness: living under God’s lordship, separated from evil, dedicated to
          His purposes, and becoming more like Him. Holiness involves outward, visible
          actions as well as inner attitudes and character, all based on God’s character
          as revealed in Scripture.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH9.INTRO.P.1
      - text: 'Before you begin working in these lessons, read these chapters in your
          Bible: Leviticus 17–27.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH9.INTRO.P.2
