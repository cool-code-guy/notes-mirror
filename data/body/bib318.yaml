    - last_modified: '2026-05-22'
      title: 4 - Jacob and Joseph—Continuing the Promise(Genesis 25–50)
      print_page: 51
      intro_body:
      - text: Half of the Book of Genesis is devoted to the stories of Jacob and Joseph.
          The detailed accounts of select periods of their lives emphatically demonstrate
          two great truths about life at work in human history. They are the sovereign
          good purposes of God and the free good and bad choices of people. These
          truths have been seen from the beginning of Genesis, but are demonstrated
          at length in the stories of these two men. The reader receives the implied
          message that God patiently works with people to move His promise-plan toward
          fulfillment. It will not be accomplished in a short time or without pain,
          but it will keep moving forward and His Word will be carried out.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH4.INTRO.P.1
      - text: God’s promise continued in the lives of Jacob and Joseph in spite of
          threats from kings and nature and despite selfish choices. The process focused
          on God’s development of the people of the promise, both individually in
          godly character, and corporately in national mission as He established the
          twelve tribes of Israel in Egypt. These chapters are full of examples from
          which believers can learn, especially of how God can use our lives in spite
          of our weaknesses and mistakes.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH4.INTRO.P.2
      - text: Before you begin working in these lessons, read Genesis 25–50.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH4.INTRO.P.3
      lessons:
      - last_modified: '2026-05-22'
