      title: 7 - The Tabernacle and theGolden Calf Apostasy (Exodus 25–40)
      print_page: 95
      intro_body:
      - text: After establishing the covenant with Israel, the Lord established the
          place of His presence. He would meet with His people at His throne on earth,
          the tabernacle, in the center of Israel’s camp. In the process, He had to
          deal with the golden calf apostasy that threatened His relationship with
          the Israelites. These two subjects, covering sixteen chapters in Exodus,
          teach much about the Lord and how we can appropriately respond to Him.
        kind: prose
        cls: IST_Body-Indent
        md: After establishing the covenant with Israel, the Lord established the
          place of His presence. He would meet with His people at His throne on earth,
          the tabernacle, in the center of Israel’s camp. In the process, He had to
          deal with the golden calf **apostasy** that threatened His relationship
          with the Israelites. These two subjects, covering sixteen chapters in Exodus,
          teach much about the Lord and how we can appropriately respond to Him.
        UID: BIB318.CH7.INTRO.P.1
      - text: Before you begin working in these lessons, read Exodus 25–40.
