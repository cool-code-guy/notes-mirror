      title: 3 - Abraham—God’s Promise (Genesis 12–25)
      print_page: 35
      intro_body:
      - text: After the repopulating of the earth by sinful humanity for an unknown
          period of time after the Flood, God began to deal with one man and his family
          to further His plan of salvation. The man He chose was Abram, a Semite from
          Mesopotamia. He promised that Abram would become a great people through
          whom the whole world would be blessed. This would take place in a land God
          would give them.
        kind: prose
        cls: IST_Body-Indent
        md: After the repopulating of the earth by sinful humanity for an unknown
          period of time after the Flood, God began to deal with one man and his family
          to further His plan of salvation. The man He chose was Abram, a **Semite**
          from Mesopotamia. He promised that Abram would become a great people through
          whom the whole world would be blessed. This would take place in a land God
          would give them.
        UID: BIB318.CH3.INTRO.P.1
      - text: These chapters about Abram’s life focus on God’s promise of a son to
          begin fulfilling the promise of blessing the world. They describe Abram’s
          walk of faith as he moved to the Promised Land, waited to have a son, and
          interacted with people of the land. God demonstrated His sovereign power
          to fulfill His plan and illustrated His personal interaction with individuals
          in the process. Much precedent is set here for walking with God as a person
          of faith. This portion of Genesis records the background for ongoing world
          problems originating in the Middle East, which epitomize the human condition.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH3.INTRO.P.2
      - text: 'Before you begin working in these lessons, read these chapters in your
          Bible: Genesis 12–25.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH3.INTRO.P.3
      lessons:
      - last_modified: '2026-05-22'
        title: Call and Promise (Genesis 12–15)
        subobjectives:
          3.1.1:
            last_modified: '2026-05-22'
            text: Describe the time, location, and culture of Abram.
            glossary:
            - term: circumcision
              definition: the act of cutting off the foreskin of the penis; commanded
                by God for the eighth day after birth as a sign of membership in God’s
                covenant with Israel; practiced by other Near Eastern cultures at
                puberty as a rite of manhood
              paragraph: BIB318.3.1.1.P.28.1
              UID: BIB318.3.1.1.G.1
              page: 36
            - term: faith-obedience
              definition: the course author’s way of expressing the understanding
                that biblical, saving faith is always understood to include the follow-through
                of obedience. It also includes and is preceded by biblical repentance,
                which means sorrow for one’s sins and turning from continuing in the
                sins.
              paragraph: BIB318.3.1.1.P.11.1
              UID: BIB318.3.1.1.G.2
              page: 34
            - term: Melchizedek
              definition: the king of Salem—possibly Jerusalem—at the time of Abram;
                means “king of righteousness.” He met Abram after the battle to deliver
                Lot and shared a sacred meal in worship with him. Abram paid a tithe
                to him from the spoils of the victory.
              paragraph: BIB318.3.1.1.P.17.1
              UID: BIB318.3.1.1.G.3
              page: 35
            - term: Sumerians
              definition: possibly the most ancient, civilized people in the Near
                East, living around the Persian Gulf with their capital called Ur;
                not Semitic as Abraham was; Their language was the first worldwide
                language of trade.
              paragraph: BIB318.3.1.1.P.3.1
              UID: BIB318.3.1.1.G.4
              page: 33
            - term: suzerain
              definition: the greater, more powerful king in a relationship with a
                lesser king (vassal)
              paragraph: BIB318.3.1.1.P.25
              page: 35
              UID: BIB318.3.1.1.G.5
            - term: tithe
              definition: giving to God one-tenth of what one has gained from working
                to make a living or from what God has provided
              paragraph: BIB318.3.1.1.P.17.1
              UID: BIB318.3.1.1.G.6
              page: 35
