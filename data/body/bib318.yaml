    - last_modified: '2026-05-22'
      title: 2 - The Fall and the Flood (Genesis 3–11)
      print_page: 25
      intro_body:
      - text: If humanity started in an ideal state at creation, what happened that
          we are so far from that state today? How did the world become so cruel,
          full of pain, and headed for death? Humanity broke the relationship with
          God and brought on world suffering and death. The sinfulness of people and
          the deadly effects of sin have increased as the population has multiplied.
          But God not only stated the consequences in judgment, He also announced
          His plan to restore His relationship with people and reverse the death penalty
          through His gift of salvation. His promise is epitomized in the Flood by
          the salvation of, and new beginning through, Noah’s family, God’s faithful
          remnant . The lesson for humanity is that all the problems of the world
          trace back to people’s selfish, devil -suggested choices opposing God. Humanity’s
          selfishness and the resulting sinful choices have unleashed great havoc
          on the world. The way of restoration is to repent and believe in God’s gift
          of salvation.
        kind: prose
        cls: IST_Body-Indent
        md: If humanity started in an ideal state at creation, what happened that
          we are so far from that state today? How did the world become so cruel,
          full of pain, and headed for death? Humanity broke the relationship with
          God and brought on world suffering and death. The sinfulness of people and
          the deadly effects of sin have increased as the population has multiplied.
          But God not only stated the consequences in judgment, He also announced
          His plan to restore His relationship with people and reverse the death penalty
          through His gift of salvation. His promise is epitomized in the Flood by
          the salvation of, and new beginning through, Noah’s family, God’s faithful
          **remnant**. The lesson for humanity is that all the problems of the world
          trace back to people’s selfish, **devil**-suggested choices opposing God.
          Humanity’s selfishness and the resulting sinful choices have unleashed great
          havoc on the world. The way of restoration is to **repent** and believe
          in God’s gift of salvation.
        UID: BIB318.CH2.INTRO.P.1
      - text: Before you begin working in these lessons, read Genesis 3–11.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH2.INTRO.P.2
      lessons:
      - last_modified: '2026-05-22'
        title: The Fall (Genesis 3–5)
        subobjectives:
          2.1.1:
            last_modified: '2026-03-27'
            text: Explain how the Fall is the root of humanity’s problems.
            glossary:
            - term: devil
              definition: a created, finite being who rebelled against God; the originator
                of evil in the world, always opposing God and His people; also called
                Satan
              paragraph: BIB318.2.1.1.P.3.1
              UID: BIB318.2.1.1.G.1
              page: 25
            - term: the Fall
              definition: the event and its effects resulting from Adam and Eve breaking
                the relationship between them and God, their expulsion from the Garden
                of Eden, when sin and death entered the world
              paragraph: BIB318.2.1.1.P.1.1
              UID: BIB318.2.1.1.G.2
              page: 25
            - term: protoevangelium
              definition: a Latin term meaning the “first gospel”; refers to the promise
                of Christ in Genesis 3:15
              paragraph: BIB318.2.1.1.P.9.1
              UID: BIB318.2.1.1.G.3
              page: 26
            - term: repent
              definition: to turn from sin and back to God with true sorrow for the
                seriousness of sin against Him
              paragraph: BIB318.2.1.1.P.7.1
              UID: BIB318.2.1.1.G.4
              page: 25
            - term: Septuagint
              definition: the name of the Greek translation of the Old Testament by
                Jews within the Greek culture in Alexandria, Egypt, from about 250–150
                BC; one of the earliest translations; Note that it was the Bible of
                the Early Church.
              paragraph: BIB318.2.1.1.P.9.1
              UID: BIB318.2.1.1.G.5
              page: 26
