      title: 8 - Approaching the Holy God (Leviticus 1–16)
      print_page: 109
      intro_body:
      - text: 'Questions implied by Leviticus 1–16 include the following: “How may
          people have an ongoing, experiential relationship with God?” “How may unholy
          people approach and experience the presence of the holy God?” “How may Israel,
          whom God has brought to himself, continue to approach Him when they have
          violated His covenant and sinned against His holiness?” Leviticus teaches
          that the Lord wanted people to approach Him the way He stipulated: through
          sacrifices at the tabernacle, through mediators He chose, and in the manner
          He described. Approaching Him obediently and in His way showed faith in
          His gift of forgiveness. God would consider them holy and allow them to
          enter into fellowship with Him.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH8.INTRO.P.1
      - text: In contrast, the ANE religions sought to appease angry, fickle gods
          with bribery. The gods represented certain forces, such as weather, love,
          or fertility that the ancients wanted to control. People hoped to manipulate
          the powers of the gods by acts of magic. The Bible does not allow any such
          attitudes or rites in the worship of the Lord. He is personal and loving
          and calls for people to trust His good purposes and be sincere in worship.
          We are to submit to and depend on His wisdom and power.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH8.INTRO.P.2
      - text: Before you begin working in these lessons, read Leviticus 1–16.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH8.INTRO.P.3
