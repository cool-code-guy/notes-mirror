      title: Book of Beginnings
      intro_body:
      - text: Book of Beginnings
        kind: heading
        cls: IST_Body-Center-Header
        UID: BIB318.UNIT1.INTRO.P.1
      - text: 'In the Book of Genesis, God has recorded beginnings concerning every
          human being: creation, the first sin, suffering and death, and God’s plan
          to restore humankind from death through a descendant of Abraham.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.UNIT1.INTRO.P.2
      - text: 'We all wonder how we got here, what life is all about, and why we experience
          suffering and death. The ultimate questions ask: “Is there a divine plan,
          an answer to the great problems of life?” “Can we know the Creator?” “Does
          life exist after death?” Genesis answers these questions with God’s promise
          of hope. His plan would restore humankind from death into fellowship with
          himself. Everyone needs to hear the message of Genesis, understand humankind’s
          beginnings, receive the hope God offers, and seek to be part of His plan.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.UNIT1.INTRO.P.3
    - chapters:
      - 5
      - 6
      - 7
      title: Becoming the People of God Through the Presence of God
      intro_body:
      - text: Becoming the People of God Through the Presence of God
        kind: heading
        cls: IST_Body-Center-Header
        UID: BIB318.UNIT2.INTRO.P.1
      - text: Genesis ended with the twelve tribes of Israel in Egypt looking forward
          to returning to the Promised Land, taking Joseph’s bones with them. The
          Book of Exodus continues God’s plan for the world’s salvation through His
          promise to Abraham. He developed Israel in the pressure of Egyptian bondage
          and then delivered them. He did this through His chosen leader, Moses, with
          signs and wonders culminating in an act of power. Finally, the book records
          God’s establishing the people of Israel as His covenantal, theocratic nation
          through His revelation at Sinai. He established among them the place of
          His presence, His throne on earth, the tabernacle.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.UNIT2.INTRO.P.2
    - chapters:
      - 8
      - 9
      title: Continuing Fellowship with the Holy God
      intro_body:
      - text: 'Holiness of Worship and Life: Continuing Fellowship with the Holy God'
        kind: heading
        cls: IST_Body-Center-Header
        md: Holiness of Worship and Life:<br/>Continuing Fellowship with the Holy
          God
        UID: BIB318.UNIT3.INTRO.P.1
      - text: 'Leviticus deals with one of the fundamental concerns of human existence:
          an ongoing relationship with the one true God who created and rules the
          universe. It assumes readers know they are separated from God, hopeless
          without His intervention, as explained in Genesis 3. However, they should
          also know He has revealed himself as the Lord who offers salvation by grace
          through faith. The Book of Exodus records how He delivered the Israelites
          from Egyptian bondage and established a covenantal relationship with them
          as His priestly, missionary nation in the world. Then, the instructions
          in Leviticus are some of the specific stipulations of that covenant. The
          Israelites had built a tabernacle, or portable headquarters, for the Lord
          so He could dwell in their midst. He wants to meet with people and let us
          experience the goodness of His presence. However, humanity is not in harmony
          with His pure character, and He will not allow sin in any association with
          himself.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.UNIT3.INTRO.P.2
      - text: This is where the instructions in Leviticus 1–16 fit in, revealing how
          people who have violated the covenant with God may be reconciled to Him
          and continue to enjoy His presence. This material is about restoring broken
          fellowship with God in the way He has provided.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.UNIT3.INTRO.P.3
      - text: Leviticus 17–27 is about holiness in the lives of people with whom the
          Lord has a relationship. Sin is serious; it is a matter of life and death
          because it cannot be allowed in God’s presence. God’s holiness requires
          His people to sanctify or honor Him as holy in all they are, say, and do.
          Anything associated with worship must be treated as sacred. God’s people
          must learn to identify what disqualifies them from entering His presence
          and learn what is in harmony with Him. Leviticus presents God’s offer of
          the gift of being made qualified for His presence and thus restored to fellowship
          with Him.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.UNIT3.INTRO.P.4
    - chapters:
      - 10
      - 11
      title: Learning to Obey God's Leading on the Journey
      intro_body:
      - text: Learning to Obey God’s Leading on the Journey
        kind: heading
        cls: IST_Body-Center-Header
        UID: BIB318.UNIT4.INTRO.P.1
      - text: 'The title of the Book of Numbers, coming from the Septuagint , relates
          to the censuses listed in the book but to little else. The Hebrew title
          is a good summary of the book: “In the Wilderness.” The book’s subject is
          the journey from Sinai, beginning a year after the Exodus, to the Promised
          Land, a journey of forty years.'
        kind: prose
        cls: IST_Body-Indent
        md: 'The title of the Book of Numbers, coming from the *Septuagint*, relates
          to the censuses listed in the book but to little else. The Hebrew title
          is a good summary of the book: “In the Wilderness.” The book’s subject is
          the journey from Sinai, beginning a year after the Exodus, to the Promised
          Land, a journey of forty years.'
        UID: BIB318.UNIT4.INTRO.P.2
      - text: The authorship and dating of the Book of Numbers are the same as that
          of the previous three books of the Pentateuch. No reason exists to doubt
          that Moses was essentially the author. The details of the contents fit the
          wilderness journey and period of Moses and the Exodus.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.UNIT4.INTRO.P.3
      - text: 'The book seems to divide easily into three sections based on Israel’s
          broad movements:'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.UNIT4.INTRO.P.4
      - text: Numbers 1:1–10:10
        kind: prose
        cls: IST_Body-No-Indent
        table: 3
        row: 1
        col: 1
        UID: BIB318.UNIT4.INTRO.P.5
      - text: Preparing for the journey
        kind: prose
        cls: IST_Body-No-Indent
        table: 3
        row: 1
        col: 2
        UID: BIB318.UNIT4.INTRO.P.6
      - text: Numbers 10:11–25:18
        kind: prose
        cls: IST_Body-No-Indent
        table: 3
        row: 2
        col: 1
        UID: BIB318.UNIT4.INTRO.P.7
      - text: Trials on the journey
        kind: prose
        cls: IST_Body-No-Indent
        table: 3
        row: 2
        col: 2
        UID: BIB318.UNIT4.INTRO.P.8
      - text: Numbers 26–36
        kind: prose
        cls: IST_Body-No-Indent
        table: 3
        row: 3
        col: 1
        UID: BIB318.UNIT4.INTRO.P.9
      - text: The new generation prepares to enter the land
        kind: prose
        cls: IST_Body-No-Indent
        table: 3
        row: 3
        col: 2
        UID: BIB318.UNIT4.INTRO.P.10
      - text: The lessons of this book relate to the challenges God’s people have
          experienced through the ages as they sought to fulfill God’s mission for
          them.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.UNIT4.INTRO.P.11
    - chapters:
      - 12
      - 13
      title: Renewing God's Covenant Relationship with Israel
      intro_body:
      - text: Moses’ Farewell Address— Renewing God’s Covenant Relationship with Israel
        kind: heading
        cls: IST_Body-Center-Header
        md: Moses’ Farewell Address—<br/>Renewing God’s Covenant Relationship with
          Israel
        UID: BIB318.UNIT5.INTRO.P.1
      - text: Deuteronomy, the fifth and final book of the Pentateuch, got its name
          from the Greek word for “second law,” a translation of 17:18 which should
          have been “a copy of this law.” The Jewish title is from the first words,
          “These are the words,” which, as Christopher Wright (1996) says, “more aptly
          points to the prophetic character of the book as both words of Moses and
          words of God, to be heard, heeded, and obeyed in each generation . . . [and]
          to the similarity between Deuteronomy and the Ancient Near Eastern treaty
          documents that often began in the same way” (1). Throughout his commentary,
          Wright shows the principles of God’s covenant with Israel and their relevance
          to Christians. He, more than any other scholar, emphasizes the missionary
          purpose of the book.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.UNIT5.INTRO.P.2
      - text: Deuteronomy clearly identifies its setting as the plains of Moab, across
          the Jordan from the Promised Land. Israel is about to fulfill God’s plan
          to occupy the land after forty years in the wilderness. The book contains
          Moses’ farewell addresses to Israel in a covenantal format. He was not allowed
          by the Lord to lead them into the land because of his disobedience at Meribah.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.UNIT5.INTRO.P.3
      - text: Scholars since the time of the Enlightenment have questioned Mosaic
          authorship for various subjective reasons, including a resistance to accept
          the idea of divine inspiration. They came up with the idea that it was written
          in Josiah’s day and placed in the temple to be “found” during that revival.
          Nevertheless, good answers are available that offset such ideas. For example,
          Deuteronomy compares closely to the international treaties from the time
          of Moses and to the law collections a few hundred years earlier (Wenham
          1985a, 15–20; Wenham 1985b, 15–18). No evidence exists to discredit Moses’
          authoring of Deuteronomy. Recognition that this book is inspired Scripture
          is not dependent on knowing for certain by whose hands it has come to us.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.UNIT5.INTRO.P.4
    glossary:
    - term: Albright, William F.
      definition: the most famous U.S. Near Eastern archaeologist and Semitics scholar
        (1920–1971). He showed the substantial accuracy of many Old Testament historical,
        cultural, and geographical references.
      chapter: 5
    - term: Amalekites
      definition: the descendants of Amalek, a descendant of Esau; Bedouins living
        in the Negev or southern end of the Promised Land and in the Sinai; perpetual
        enemies of Israel
      chapter: 5
      paragraph: BIB318.5.3.1.P.10.1
    - term: ANE
      definition: Ancient Near East; countries of southwest Asia and northeast Africa;
        known more commonly today as the Middle East
      chapter: 1
      paragraph: BIB318.1.1.1.P.25.1
      page: 18
    - term: anointing
      definition: the Ancient Near Eastern ceremony of pouring oil on the head of
        a person and thereby officially designating him or her to a leadership function
        in the community; when God appointed a priest, a prophet, or a king, He also
        empowered them by His Holy Spirit to fulfill His purposes; corresponds to
        our service of ordination
      chapter: 7
      paragraph: BIB318.7.2.1.P.8.1
    - term: antinomy
      definition: a contradiction between two seemingly equally valid principles;
        an apparently unresolvable conflict or contradiction; the situation where
        two laws, principles, or truths in life (here, in theology) contradict and
        are not simply a paradox. The chief, if not the only, antinomy in theology
        is between the sovereignty of God and the responsibility of humans. They are
        both true and yet ultimately, philosophically, each should rule out the other.
        The answer is only known in heaven. Both truths should be affirmed, based
        on Scripture (see, for example, Philippians 2:12–13).
      chapter: 5
      paragraph: BIB318.5.1.1.P.33.1
    - term: apodictic laws
      definition: a direct command or prohibition in the form of “you must” or “you
        must not,” or “any who [behavior] . . . shall be [punished in a certain way]”
      chapter: 6
      paragraph: BIB318.6.3.1.P.4.1
      page: 78
    - term: apostasy
      definition: turning away from one’s faith; here, of Israel openly violating
        their relationship with the Lord, rejecting Him by turning to idolatry
      chapter: 7
      paragraph: BIB318.7.1.1.P.13
    - term: ark
      definition: the boat God had Noah build for his family and two / seven of every
        animal in which to survive the Flood; a rectangular, barge-like vessel, stable
        in water, with no keel, three stories, almost the length of two football fields
      chapter: 2
      paragraph: BIB318.2.2.1.P.8
      page: 27
    - term: ark of the covenant
      definition: a rectangular chest God had Israel construct to carry the tablets
        of the Ten Commandments, a testimony of the covenant between God and Israel;
        the throne of God on earth, among Israel; placed in the tabernacle’s holiest
        chamber as the most sacred place of His presence, experienced directly only
        by the high priest, once a year, on the Day of Atonement. The lid was called
        the mercy seat or atonement cover because there, the high priest applied the
        sacrificial blood that annually gave Israel a fresh start in forgiveness on
        the Day of Atonement.
      chapter: 7
      paragraph: BIB318.7.2.1.P.3.1
    - term: atonement
      definition: the removal of the barrier in a relationship, releasing the other
        from wrath and restoring fellowship through a costly price. It probably did
        not mean “to cover,” as previously thought.
      chapter: null
      paragraph: BIB318.7.2.1.P.10
      page: 87
    - term: Balaam
      definition: a prophet from northwest Mesopotamia hired by King Balak of Moab
        to curse Israel, indicating he was known to be able to use God’s name. God
        warned him through a donkey to only say what He told him.
      chapter: 11
      paragraph: BIB318.11.1.1.P.14
      page: 129
    - term: bedouin
      definition: the nomadic Arab people of the deserts of the Near East and North
        Africa
      chapter: 3
    - term: Big Bang
      definition: a theory supposing the universe originated billions of years ago
        in an explosion from a single point of energy density
      chapter: 1
      paragraph: BIB318.1.2.1.P.3.1
      page: 19
    - term: blessing
      definition: God’s provisions from His abundant goodness to enable His creation
        to fulfill His purposes and be fulfilled
      chapter: 1
      paragraph: BIB318.1.2.1.P.15
      page: 20
    - term: blessings and curses
      definition: God’s promised provisions for His people and consequences and judgments
        for disobedience
      chapter: 6
      paragraph: BIB318.6.3.1.P.26.1
      page: 80
    - term: Canaan and Canaanites
      definition: the original Hebrew name of the Promised Land; from the name of
        its inhabitants, the Canaanites; the land bridge between Europe, Asia, and
        Africa due to the desert on the east and the Mediterranean Sea on the west
      chapter: 2
    - term: casuistic laws
      definition: the laws describing specific cases or situations in the form of
        “If . . . then . . .”
      chapter: 6
      paragraph: BIB318.6.3.1.P.2
      page: 78
    - term: cherem
      definition: an irreversible, total dedication of something to the Lord, usually
        through consuming it with fire
      chapter: 9
      paragraph: BIB318.9.3.1.P.19.1
      page: 112
    - term: circumcision
      definition: the act of cutting off the foreskin of the penis; commanded by God
        for the eighth day after birth as a sign of membership in God’s covenant with
        Israel; practiced by other Near Eastern cultures at puberty as a rite of manhood
      chapter: 3
      paragraph: BIB318.3.1.1.P.28.1
    - term: clean / unclean
      definition: being qualified for God’s presence, decontaminated spiritually from
        sin’s defilement, freed from anything not in harmony with God’s nature, or
        animals fit or unfit for human food or the ritual sacrifice
      chapter: 2
      paragraph: BIB318.8.3.1.P.21
    - term: consecration
      definition: dedication to God’s purpose (usually translates the same Hebrew
        word as does sanctification )
      chapter: 8
      paragraph: BIB318.8.2.1.P.7.1
      page: 99
    - term: constitution
      definition: the foundation of a nation’s legal system upon which all their laws
        and government are based and must be in harmony with
      chapter: 6
      paragraph: BIB318.6.3.1.P.1.1
    - term: covenant
      definition: a specific, binding agreement between two parties; a committed relationship
        with accountability
      chapter: 2
      paragraph: BIB318.2.2.1.P.9
      page: 27
    - term: deistic
      definition: a system of thought denying the interference of the Creator with
        the laws of the universe
      chapter: 1
      paragraph: BIB318.1.2.1.P.6.1
      page: 19
    - term: devil
      definition: a created, finite being who rebelled against God; the originator
        of evil in the world, always opposing God and His people; also called Satan
      chapter: 2
      paragraph: BIB318.2.1.1.P.3.1
      page: 25
    - term: faith-obedience
      definition: the course author’s way of expressing the understanding that biblical,
        saving faith is always understood to include the follow-through of obedience.
        It also includes and is preceded by biblical repentance, which means sorrow
        for one’s sins and turning from continuing in the sins.
      chapter: 3
      paragraph: BIB318.3.1.1.P.11.1
    - term: the Fall
      definition: the event and its effects resulting from Adam and Eve breaking the
        relationship between them and God, their expulsion from the Garden of Eden,
        when sin and death entered the world
      chapter: 2
      paragraph: BIB318.2.1.1.P.1.1
    - term: fertility cult
      definition: the heathen ceremonies, practices, and religious beliefs focused
        on bringing fertility to the people’s families, livestock, and crops; involved
        magical acts to manipulate the powers or gods; They often included sexual
        activity with the priests or priestesses.
      chapter: 6
      paragraph: BIB318.6.3.1.P.24
    - term: the Flood
      definition: God’s judgment, in the distant past, on all life on earth for people’s
        great corruption. Many people groups have ancient stories of a flood. The
        true account is in Genesis 6–9. God made a new beginning for humanity through
        Noah and his family.
      chapter: 1
      paragraph: BIB318.1.1.1.P.13.1
    - term: genealogy
      definition: a list of a person’s ancestors or those of a people; the Old Testament
        has several kinds of genealogies with different purposes; they may list one
        generation after another or several names from the same generation. Some lists
        include people having historical or geographical connection with other people
        who are related, but not by blood.
      chapter: 1
      paragraph: BIB318.1.1.1.P.12.1
    - term: Hammurabi’s Code
      definition: the most famous ancient law collection, written on a stone pillar
        from around 1700 BC, by the Babylonian king Hammurabi; contains parallels
        to some of the biblical laws
      chapter: 6
      paragraph: BIB318.6.3.1.P.4.1
      page: 78
    - term: holiness
      definition: to be or to make holy, separated from common, evil use to the exclusive,
        pure, eternal use of the Lord; set apart for and dedicated to His purposes;
        brought into harmony with His values; special to God (see sanctification)
      chapter: 2
      paragraph: BIB318.2.2.1.P.5
      page: 27
    - term: homicide
      definition: one person causing the death of another, whether accidentally or
        intentionally
      chapter: 11
      paragraph: BIB318.11.2.1.P.11
      page: 131
    - term: Hur
      definition: the man who helped Aaron hold up Moses’ hands during the battle
        with the Amalekites. Some think he could be the same Hur who was the son of
        Caleb and grandfather of Bazalel, one of the builders of the tabernacle.
      chapter: 5
      paragraph: BIB318.5.3.1.P.10.1
    - term: immanent
      definition: said of a god; existing in time and space; very near
      chapter: 1
      paragraph: BIB318.1.2.1.P.9.1
    - term: intercessor
      definition: someone who pleads with God on behalf of another, usually for a
        serious need; Israel needed forgiveness for apostasy; intercession
      chapter: 3
      paragraph: BIB318.3.3.1.P.6
      page: 39
    - term: Jethro
      definition: the father-in-law of Moses and priest of Midian; his other name,
        Reuel, means “friend of God.” He expressed faith in the Lord and wisdom about
        leadership.
      chapter: 5
      paragraph: BIB318.5.1.1.P.24.1
    - term: Joshua
      definition: the young man Moses trained as assistant and successor
      chapter: 1
      paragraph: BIB318.1.1.1.P.5
      page: 17
    - term: legalistic or legalism
      definition: focusing on the letter of the law; being consumed with the goal
        of getting credit for keeping it more perfectly than other people; having
        the law only for its strict observance; A legalistic relationship is based
        strictly on performance.
      chapter: 6
    - term: leprosy
      definition: conditions of the skin or surface (of houses, clothing) viewed negatively
        in that culture; in the Old Testament, not restricted to the disease called
        leprosy today
      chapter: 8
      paragraph: BIB318.8.3.1.P.17
    - term: mediator
      definition: an agent required for communicating between two parties to bring
        them together
      chapter: 3
      paragraph: BIB318.3.2.1.P.8.1
      page: 37
    - term: Melchizedek
      definition: the king of Salem—possibly Jerusalem—at the time of Abram; means
        “king of righteousness.” He met Abram after the battle to deliver Lot and
        shared a sacred meal in worship with him. Abram paid a tithe to him from the
        spoils of the victory.
      chapter: 3
      paragraph: BIB318.3.1.1.P.17.1
    - term: Mesopotamia or Mesopotamian
      definition: the Greek term for “the land between the rivers”—the Tigris and
        Euphrates; one of the oldest cradles of civilization; includes Babylon, Nineveh,
        Ur, and many other ancient cities; now mostly known as Iraq
      chapter: 2
    - term: Midian
      definition: the place the semi-nomadic Midianites lived who were probably descendants
        of Abraham; most likely on the east side of the Sinai and west side of Arabia,
        along the Gulf of Aqaba. Jethro was a priest of Midian.
      chapter: 5
      paragraph: BIB318.5.1.1.P.24.1
      page: 60
    - term: Millennium
      definition: the one-thousand-year reign of Christ on earth after His second
        coming; The curse is removed and Satan bound, a kind of return to Eden before
        the end of this world and the advent of the new heavens and new earth.
      chapter: 6
      paragraph: BIB318.6.3.1.P.28.1
    - term: Nazirite
      definition: a layperson in Israel making a commitment to the Lord for a set
        period of time; as dedicated as a priest; teaching that God ultimately wants
        all His people to live holy lives and be priests to Him
      chapter: 10
      paragraph: BIB318.10.2.1.P.5.1
      page: 120
    - term: Nephilim
      definition: the Hebrew term used in Genesis 6:4 and Numbers 13:31–33, the latter
        for tall inhabitants of part of Canaan; The Septuagint translates it “giants”
        (Genesis 6:4); it could be translated “fallen ones.” However, it can also
        be from a different root and mean “separated ones.” If these are “the men
        of the Name” (not renown) at the end of the verse, then this is a term for
        those true to God and of whom Noah was the last.
      chapter: 2
      paragraph: BIB318.2.2.1.P.3.1
    - term: new covenant
      definition: the culmination of God’s plan for a personal and eternal relationship
        with all who accept His gift of salvation through His Son, thus superseding
        the Sinai Covenant as promised in Jeremiah 31:31 and announced at the Last
        Supper by Jesus Christ
      chapter: 3
      paragraph: BIB318.3.2.1.P.11.1
    - term: non-evangelical
      definition: not in agreement with the basic beliefs of the evangelical, such
        as salvation by faith in the atoning death of Jesus Christ through personal
        conversion, the authority of Scripture, and the importance of preaching as
        contrasted with ritual
      chapter: 1
      paragraph: BIB318.1.1.1.P.4
      page: 17
    - term: paradigm
      definition: a pattern that others in the same situation follow; a way of looking
        at something
      chapter: 4
      paragraph: BIB318.4.1.1.P.12.1
      page: 49
    - term: pastoralist
      definition: a graizer or landholder raising sheep, cattle, etc., on a large
        scale
      chapter: 4
    - term: patriarchal blessing or birthright
      definition: the privileges and responsibilities of the head of the extended
        family passed from the current head or patriarch to the heir designate, usually
        the firstborn in the ANE; It involved twice the inheritance of the other heirs
        and a prophetic word of blessing and empowerment from the patriarch, near
        his death.
      chapter: 4
    - term: patriarchs
      definition: three generations of fathers of the nation of Israel—Abraham, Isaac,
        and Jacob
      chapter: 1
      paragraph: BIB318.1.1.1.P.23.1
    - term: Pentateuch
      definition: the first five books of the Old Testament—Genesis, Exodus, Leviticus,
        Numbers, and Deuteronomy; Most of its writing was credited to Moses.
      chapter: 1
      paragraph: BIB318.1.1.1.P.1
      page: 17
    - term: Pentecostal
      definition: the evangelical, holiness, healing, premillennial, back-to-the-Bible
        movement of Christians; largely began around 1900, of whom the Assemblies
        of God is the largest denomination; They believe God wants to baptize Christians
        in the Holy Spirit to be His witnesses to the world, with the outward sign
