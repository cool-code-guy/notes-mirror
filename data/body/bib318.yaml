      title: 1 - Creation (Genesis 1–2)
      print_page: 15
      intro_body:
      - text: God created the universe to be good. His love focused on humanity, male
          and female, created in His image. Only people were created to have a personal
          relationship with God. They should be treated differently than animals or
          things.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH1.INTRO.P.1
      - text: Genesis 1 and 2 are God’s revelation of His creation of the universe
          and emphasize that He made it all good. No evil existed in the original
          creation. These chapters give foundational perspective on life and lead
          to the third chapter, which explains why the world no longer exists in this
          ideal state.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH1.INTRO.P.2
      - text: Before you begin working in these lessons, read Genesis 1–2.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH1.INTRO.P.3
      lessons:
      - last_modified: '2026-05-22'
        title: Book of Genesis
        subobjectives:
          1.1.1:
            last_modified: '2026-10-06'
            text: Explain the major views on the authorship and dating of the Book
              of Genesis.
            glossary:
            - term: ANE
              definition: Ancient Near East; countries of southwest Asia and northeast
                Africa; known more commonly today as the Middle East
              paragraph: BIB318.1.1.1.P.25.1
              UID: BIB318.1.1.1.G.1
              page: 18
            - term: the Flood
              definition: God’s judgment, in the distant past, on all life on earth
                for people’s great corruption. Many people groups have ancient stories
                of a flood. The true account is in Genesis 6–9. God made a new beginning
                for humanity through Noah and his family.
              paragraph: BIB318.1.1.1.P.13.1
              UID: BIB318.1.1.1.G.2
            - term: genealogy
              definition: a list of a person’s ancestors or those of a people; the
                Old Testament has several kinds of genealogies with different purposes;
                they may list one generation after another or several names from the
                same generation. Some lists include people having historical or geographical
                connection with other people who are related, but not by blood.
              paragraph: BIB318.1.1.1.P.12.1
              UID: BIB318.1.1.1.G.3
            - term: Joshua
              definition: the young man Moses trained as assistant and successor
              paragraph: BIB318.1.1.1.P.5
              page: 17
              UID: BIB318.1.1.1.G.4
            - term: non-evangelical
              definition: not in agreement with the basic beliefs of the evangelical,
                such as salvation by faith in the atoning death of Jesus Christ through
                personal conversion, the authority of Scripture, and the importance
                of preaching as contrasted with ritual
              paragraph: BIB318.1.1.1.P.4
              page: 17
              UID: BIB318.1.1.1.G.5
            - term: patriarchs
              definition: three generations of fathers of the nation of Israel—Abraham,
                Isaac, and Jacob
              paragraph: BIB318.1.1.1.P.23.1
              UID: BIB318.1.1.1.G.6
            - term: Pentateuch
              definition: the first five books of the Old Testament—Genesis, Exodus,
                Leviticus, Numbers, and Deuteronomy; Most of its writing was credited
                to Moses.
              paragraph: BIB318.1.1.1.P.1
              page: 17
              UID: BIB318.1.1.1.G.7
            text_history:
            - text: Explain the major views on the authorship and dating of the book
                of Genesis.
              outdated: '2026-10-06'
              outdated_reason: re-parsed
              change: typographic
          1.1.2:
            last_modified: '2026-05-22'
            text: Outline the basic divisions of Genesis, and identify the differences
              in purpose of chapters 1 and 2.
            glossary: []
