      title: 5 - The Exodus and Journey to Sinai (Exodus 1–18)
      print_page: 63
      intro_body:
      - text: The Book of Exodus begins by giving the setting for Israel’s exodus
          out of Egyptian bondage. In the process, the Lord reveals more of himself
          to Israel through Moses. He accomplishes their deliverance through signs
          and wonders, the awesome Passover, and the parting of the Red Sea. Then
          He leads them to Mt. Sinai, where He speaks to them His covenant and its
          laws, which will be discussed in the next chapter.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH5.INTRO.P.1
      - text: Before you begin working in these lessons, read Exodus 1–18.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH5.INTRO.P.2
      lessons:
      - last_modified: '2026-05-22'
        title: Preparation for the Exodus (Exodus 1–10)
        subobjectives:
          5.1.1:
            last_modified: '2026-10-06'
            text: Identify the author and structure of the Book of Exodus and the
              date Israel left Egypt.
            glossary:
            - term: antinomy
              definition: a contradiction between two seemingly equally valid principles;
                an apparently unresolvable conflict or contradiction; the situation
                where two laws, principles, or truths in life (here, in theology)
                contradict and are not simply a paradox. The chief, if not the only,
                antinomy in theology is between the sovereignty of God and the responsibility
                of humans. They are both true and yet ultimately, philosophically,
                each should rule out the other. The answer is only known in heaven.
                Both truths should be affirmed, based on Scripture (see, for example,
                Philippians 2:12–13).
              paragraph: BIB318.5.1.1.P.33.1
              UID: BIB318.5.1.1.G.1
              page: 61
            - term: Jethro
              definition: the father-in-law of Moses and priest of Midian; his other
                name, Reuel, means “friend of God.” He expressed faith in the Lord
                and wisdom about leadership.
              paragraph: BIB318.5.1.1.P.24.1
              UID: BIB318.5.1.1.G.2
              page: 60
            - term: Midian
              definition: the place the semi-nomadic Midianites lived who were probably
                descendants of Abraham; most likely on the east side of the Sinai
                and west side of Arabia, along the Gulf of Aqaba. Jethro was a priest
                of Midian.
              paragraph: BIB318.5.1.1.P.24.1
              UID: BIB318.5.1.1.G.3
              page: 60
            - term: sovereignty of God
              definition: God’s power to do what He chooses without restriction or
                any necessary cause outside of himself, His character, or His purposes
              paragraph: BIB318.5.1.1.P.33.1
              UID: BIB318.5.1.1.G.4
              page: 61
            text_history:
            - text: Identify the author and structure of the book of Exodus and the
                date Israel left Egypt.
              outdated: '2026-10-06'
              outdated_reason: re-parsed
              change: typographic
          5.1.2:
            last_modified: '2026-05-22'
            text: Describe Israel’s bondage and the raising up of Moses as deliverer
              (Exodus 1–4).
            glossary: []
          5.1.3:
