      title: 12 - Covenantal Perspectives and Commandments 1–4(Deuteronomy 1:1–16:17)
      print_page: 167
      intro_body:
      - text: The Book of Deuteronomy follows the structure of an Ancient Near Eastern
          international treaty, as will be discussed in the first lesson. As such,
          it first gives a historical prologue (1–3), then general exhortations and
          basic stipulations (4–11). The center of the book is the section of detailed
          stipulations (chapters 12–26). In order to divide Deuteronomy into two chapters
          for study, the collection of laws discussed in this chapter will extend
          through 16:17. Because of the focus on the covenant relationship between
          Israel and the Lord, Deuteronomy’s principles can be directly applied to
          relationships in general and each person’s relationship with God.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH12.INTRO.P.1
      - text: Before you begin working in these lessons, read Deuteronomy 1:1–16:17.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH12.INTRO.P.2
