      title: 13 - Commandments 5–10 (Deuteronomy 16:18–34:12)and Conclusion
      print_page: 177
      intro_body:
      - text: The specific laws divide at Deuteronomy 16:18. The last six commandments
          are applied under the theme of righteousness in judgment among God’s people.
          The topics deal with issues and principles of functioning together as His
          people, applying His values in Canaan of the Ancient Near East. This is
          followed by accountability for the covenantal relationship, expressed in
          blessings and curses. Finally, Moses gives his prophetic, farewell song
          and blessings for each tribe. He gives instructions for their continued
          commitment to the covenant and for the transition of leadership to Joshua.
          These passages contain principles for God’s people of all time and for all
          relationships.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH13.INTRO.P.1
      - text: Before you begin working in these lessons, read Deuteronomy 16:18–34:12.
        kind: prose
