        title: The Flood (Genesis 6–9)
        subobjectives:
          2.2.1:
            last_modified: '2026-05-22'
            text: Describe how sin has increased since the Fall.
            glossary:
            - term: ark
              definition: the boat God had Noah build for his family and two / seven
                of every animal in which to survive the Flood; a rectangular, barge-like
                vessel, stable in water, with no keel, three stories, almost the length
                of two football fields
              paragraph: BIB318.2.2.1.P.8
              page: 27
              UID: BIB318.2.2.1.G.1
            - term: covenant
              definition: a specific, binding agreement between two parties; a committed
                relationship with accountability
              paragraph: BIB318.2.2.1.P.9
              page: 27
              UID: BIB318.2.2.1.G.2
            - term: holiness
              definition: to be or to make holy, separated from common, evil use to
                the exclusive, pure, eternal use of the Lord; set apart for and dedicated
                to His purposes; brought into harmony with His values; special to
                God (see sanctification)
              paragraph: BIB318.2.2.1.P.5
              page: 27
              UID: BIB318.2.2.1.G.3
            - term: Nephilim
              definition: the Hebrew term used in Genesis 6:4 and Numbers 13:31–33,
                the latter for tall inhabitants of part of Canaan; The Septuagint
                translates it “giants” (Genesis 6:4); it could be translated “fallen
                ones.” However, it can also be from a different root and mean “separated
                ones.” If these are “the men of the Name” (not renown) at the end
                of the verse, then this is a term for those true to God and of whom
                Noah was the last.
              paragraph: BIB318.2.2.1.P.3.1
              UID: BIB318.2.2.1.G.4
              page: 27
            - term: remnant
              definition: an Old Testament theme referring to those who remain and
                are saved after God’s judgment on a people (usually on His people)
              paragraph: BIB318.2.2.1.P.6
              page: 27
              UID: BIB318.2.2.1.G.5
            - term: righteous
              definition: living according to God’s standard of what is right, especially
                His moral values, flowing out of a healthy relationship with God
              paragraph: BIB318.2.2.1.P.6
              page: 27
              UID: BIB318.2.2.1.G.6
            - term: signs
              definition: something physical God declares to have significance as
                pointing to a promise or truth about His relationship with people.
                As a wedding ring is a sign of a marriage commitment, the Sabbath
                was a sign of Israel’s covenant with God.
              paragraph: BIB318.2.2.1.P.10.1
              UID: BIB318.2.2.1.G.7
              page: 27
            - term: sons of God
              definition: a figurative term; John 1:12 (KJV) speaks of humans becoming
                the “sons of God,” but Matthew 22:30 says angels do not marry and
                after the Resurrection, believers will be “as the angels in heaven.”
                That the “sons of God” married and had children in Genesis 6:1–4,
                in this context these “sons of God” had to be men.
              paragraph: BIB318.2.2.1.P.3.1
              UID: BIB318.2.2.1.G.8
              page: 27
