                creation to fulfill His purposes and be fulfilled
              paragraph: BIB318.1.2.1.P.15
              UID: BIB318.1.2.1.G.2
              page: 20
            - term: deistic
              definition: a system of thought denying the interference of the Creator
                with the laws of the universe
              paragraph: BIB318.1.2.1.P.6.1
              UID: BIB318.1.2.1.G.3
