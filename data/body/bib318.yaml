      title: 10 - Preparing for the Journey (Numbers 1–20:13)
      print_page: 141
      intro_body:
      - text: Though the Book of Numbers divides easily into three divisions, this
          unit will cover the book in two chapters in order to keep them reasonably
          similar in length. Thus, chapter 10 will cover the first division and part
          A of the second division. Chapter 11 will begin with part B of the second
          division and continue through the third division. The first division, 1:1–10:10,
          relates the preparation for the journey and covers instructions for how
          to function together as God’s holy people on His mission. An emphasis of
          the second division is the development of a walk of faith by the Spirit.
        kind: prose
        cls: IST_Body-Indent
