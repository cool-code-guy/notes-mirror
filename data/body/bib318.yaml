      title: 6 - The Covenant at Sinai (Exodus 19–24)
      print_page: 79
      intro_body:
      - text: God established His covenant with the people of Israel as His unique,
          theocratic nation through His revelation at Sinai. He would continue His
          promise-plan of salvation for the world through them. He gave them His laws
          for their national constitution to specify how they were to function together.
          His law specified how their daily lives could reflect His character and
          values to the world.
        kind: prose
        cls: IST_Body-Indent
        md: God established His covenant with the people of Israel as His unique,
          **theocratic** nation through His revelation at Sinai. He would continue
          His promise-plan of salvation for the world through them. He gave them His
          laws for their national constitution to specify how they were to function
          together. His law specified how their daily lives could reflect His character
          and values to the world.
        UID: BIB318.CH6.INTRO.P.1
      - text: Before you begin working in these lessons, read Exodus 19–24.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB318.CH6.INTRO.P.2
