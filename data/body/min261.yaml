        subobj: 9.1.1
        type: final
        question: The great shift in Christendom’s center over the past century is
          from
        choices:
          A: the Far East to the western nations.
          B: Europe to America.
          C: the western nations to America.
          D: the western nations to the Majority World.
        answer: D
