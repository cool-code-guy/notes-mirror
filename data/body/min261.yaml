    course_objectives:
    - 1. Understand what the Bible teaches about missions.
    - 2. Trace the theme of God’s mission throughout the Old and New Testaments.
    - 3. Appreciate the role of missions in church history and in the Assemblies of
      God, both in the United States and in other countries.
    - 4. Explain various methods used in the task of missions.
    - 5. Apply principles of partnership to missions on the local, national, and international
      levels.
    - 6. Understand the key role of the local church in missions.
    - 7. Identify and examine current trends in modern missions.
    - 8. Appreciate the role of missions in the social and political environment.
