        type: final
        question: The proper attitude toward proclamation of the gospel and social
          service to others is that
        choices:
          A: proclamation and social service are both involved in sharing the gospel.
          B: proclamation must be preferred even to the neglect of humanitarian activities.
          C: social service must be done to show God’s love even if proclamation is
            not.
          D: proclamation is the duty of missionaries; social service should be left
            to others.
        answer: A
      - uid: MIN261.10.2.2.F.1
        subobj: 10.2.2
        type: final
        question: Salvation in both the Old and New Testaments is best defined as
        choices:
          A: the transformation of a person's soul.
          B: a radical change in a person's whole being and relationships.
          C: separation from the world, the flesh, and the devil.
          D: deliverance from bondage.
        answer: B
      - uid: MIN261.11.1.2.F.1
        subobj: 11.1.2
        type: final
        question: Among the types of prayer, the one most important to Christians
          regarding unbelievers is
        choices:
          A: petition.
          B: intercession.
          C: praise.
          D: repentance.
        answer: B
      - uid: MIN261.11.1.4.F.1
        subobj: 11.1.4
        type: final
        question: The term “laity” in the church, as derived from Scripture, refers
          to those who are
        choices:
          A: skilled in leadership and organization.
          B: the people of God with distinctiveness in gifts, functions, and roles.
          C: leaders who serve without pay.
          D: people in general, whether believers or not.
        answer: B
