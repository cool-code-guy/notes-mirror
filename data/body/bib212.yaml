      chapter: 1
      paragraph: BIB212.1.1.1.P.11
      page: 15
    - term: mediator
      definition: someone who goes between two people or groups of people
      chapter: 10
      paragraph: BIB212.10.1.1.P.26
      page: 158
    - term: Messiah
      definition: (Hebrew) anointed one. The Greek word is Christ . The Jews believed
