      lessons:
      - last_modified: '2026-03-27'
        title: The Background of Revelation
        subobjectives:
          13.1.1:
            last_modified: '2026-03-27'
            text: Indicate the title, author, date, setting, and themes of Revelation.
            glossary:
            - term: Lamb
              definition: a title of Jesus emphasizing that He became the sacrifice
                to take away our sins
              paragraph: BIB212.13.1.1.P.9
              UID: BIB212.13.1.1.G.1
      - last_modified: '2026-03-27'
        title: Understanding Revelation
        subobjectives:
          13.2.1:
            last_modified: '2026-03-27'
            text: Evaluate four ways of interpreting Revelation.
            glossary:
            - term: futurist
              definition: a view that focuses mostly on the future to interpret Revelation.
                It teaches that Revelation 4–22 will happen in the future.
              paragraph: BIB212.13.2.1.P.9
              page: 214
              UID: BIB212.13.2.1.G.1
            - term: harlot
              definition: a prostitute; in Revelation, a symbol of Rome and the people
                with her values. The harlot represents all who love the world (see
                1 John 2:15–17).
              paragraph: BIB212.13.2.1.P.40
              UID: BIB212.13.2.1.G.2
            - term: historicist
              definition: a view that focuses on the past and present to interpret
                Revelation. It matches Revelation with events of history from the
                early church to the present.
              paragraph: BIB212.13.2.1.P.5
              page: 213
              UID: BIB212.13.2.1.G.3
            - term: idealist
              definition: a view that says Revelation is about spiritual ideas, not
                real people or events. It interprets Revelation like a parable that
                did not and will not happen.
              paragraph: BIB212.13.2.1.P.7
              UID: BIB212.13.2.1.G.4
            - term: preterist
              definition: a view that focuses on the past to interpret Revelation
                and teaches that Revelation 1–18 happened in the first century
              paragraph: BIB212.13.2.1.P.3
              UID: BIB212.13.2.1.G.5
          13.2.2:
            last_modified: '2026-03-27'
            text: Divide Revelation into three parts based on Revelation 1:19. Note
              the chapters for each part.
            glossary: []
          13.2.3:
            last_modified: '2026-03-27'
            text: Summarize five descriptions of Jesus in Revelation.
            glossary: []
