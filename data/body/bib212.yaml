      paragraph: BIB212.2.1.1.P.45
      page: 34
    - term: Lamb
      definition: a title of Jesus emphasizing that He became the sacrifice to take
        away our sins
      chapter: 13
      paragraph: BIB212.13.1.1.P.9
    - term: life
      definition: as used in John, eternal life. Life results from believing in Christ.
      chapter: 3
      paragraph: BIB212.3.1.1.P.5
      page: 51
    - term: Macedonia
      definition: a province in northern Greece whose capital was Thessalonica; also
