      paragraph: BIB212.1.3.1.P.80
      page: 25
    - term: Gnosticism
      definition: the teachings of the Gnostics. Gnostic false teachers claimed to
        have secret knowledge for salvation and taught that the body and all matter
        were evil.
      chapter: 11
      paragraph: BIB212.11.1.1.P.58
      page: 178
    - term: Greeks
      definition: a people who, under Alexander the Great and his generals, ruled
        from 330–166 BC and spread their language and culture across the world
      chapter: 1
      paragraph: BIB212.1.1.1.P.34
      page: 16
    - term: harlot
      definition: a prostitute; in Revelation, a symbol of Rome and the people with
        her values. The harlot represents all who love the world (see 1 John 2:15–17).
      chapter: 13
      paragraph: BIB212.13.2.1.P.40
    - term: high priest
      definition: the most important religious leader of Israel who entered the inner
        part of the temple once a year to make a sacrifice for the nation’s sin
      chapter: 1
      paragraph: BIB212.1.1.1.P.42
      page: 18
    - term: historicist
      definition: a view that focuses on the past and present to interpret Revelation.
        It matches Revelation with events of history from the early church to the
        present.
      chapter: 13
      paragraph: BIB212.13.2.1.P.5
      page: 213
    - term: idealist
      definition: a view that says Revelation is about spiritual ideas, not real people
        or events. It interprets Revelation like a parable that did not and will not
        happen.
      chapter: 13
      paragraph: BIB212.13.2.1.P.7
    - term: Jerome
      definition: a Catholic Church leader who made a list of books in the Apocrypha
        and translated the Bible into Latin. This famous translation is called the
        Vulgate.
      chapter: 12
      paragraph: BIB212.12.2.1.P.192
    - term: Jews
      definition: those from the twelve tribes of Israel. A person who is not a Jew
        is called a Gentile.
      chapter: 1
      paragraph: BIB212.1.1.1.P.8
      page: 15
    - term: Judaizers
      definition: Jewish believers who were Pharisees and taught that all believers
