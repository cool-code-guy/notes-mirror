      chapter: 4
      paragraph: BIB212.4.2.1.P.113
      page: 70
    - term: justification
      definition: God’s counting an individual as righteous
      chapter: 5
      paragraph: BIB212.5.1.1.P.49
      page: 85
    - term: kingdom of heaven
      definition: the place where the King reigns. On earth, this is in the hearts
