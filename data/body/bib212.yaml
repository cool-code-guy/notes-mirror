      chapter: 7
      paragraph: BIB212.7.3.1.P.27
    - term: futurist
      definition: a view that focuses mostly on the future to interpret Revelation.
        It teaches that Revelation 4–22 will happen in the future.
      chapter: 13
      paragraph: BIB212.13.2.1.P.9
      page: 214
    - term: Galatia
      definition: a province that included cities such as Pisidian Antioch, Iconium,
