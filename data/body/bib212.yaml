      chapter: 2
      paragraph: BIB212.2.1.1.P.9
      page: 222
    - term: parousia
      definition: (Greek) refers to the coming of Christ at the end of this age
      chapter: 8
      paragraph: BIB212.8.2.1.P.26
    - term: perseverance
      definition: determination not to give up; resolution to continue in spite of
        hard situations
      chapter: 10
      paragraph: BIB212.10.1.1.P.34
    - term: Pharisees
      definition: literally, the separate people; members of a Jewish group who strictly
        followed the law of Moses and Jewish religious customs. Many did not like
        Jesus because He did not follow all of their rules.
      chapter: 1
      paragraph: BIB212.1.1.1.P.30
      page: 16
    - term: predestine
