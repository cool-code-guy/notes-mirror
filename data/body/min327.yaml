          B: an acknowledgement that something has been received in exchange for something
            else of value.
          C: a written record prepared as merchandise is received, counted, and checked.
          D: a document attesting to the details and accuracy of a transaction.
        answer: A
      - uid: MIN327.7.3.1.F.1
        subobj: 7.3.1
        type: final
        question: Which term describes a large amount of cash kept on hand for making
          cash payments?
        choices:
          A: Bank transfer
          B: Petty cash fund
          C: Imprest fund
          D: Unrestricted fund
        answer: C
      - uid: MIN327.7.3.2.F.1
        subobj: 7.3.2
        type: final
        question: A guideline for internal control of cash disbursements is that
        choices:
          A: only one bank account should be used and all major payments should be
            made by check.
          B: personnel should keep their job assignments indefinitely to avoid diverse
            approaches.
          C: one person should write purchase orders, physically receive goods, and
            write accounts payable disbursement.
          D: one person should match vouchers with accounts and verify the presence
            of all necessary documents for
        answer: A
      - uid: MIN327.8.2.2.F.1
        subobj: 8.2.2
        type: final
        question: The greatest benefit of permanent repair over temporary repair is
          that it
        choices:
          A: provides time for further study.
          B: solves the problem.
          C: is inexpensive.
          D: temporarily deters further deterioration.
        answer: B
      - uid: MIN327.8.3.1.F.1
        subobj: 8.3.1
        type: final
        question: Before purchasing additional equipment and vehicles, the church
          leadership should
        choices:
          A: sell, trade, and discard unneeded and irreparable equipment.
          B: consider purchasing the cheapest vehicles and equipment available.
          C: give unused and excess equipment and vehicles to people in the church.
          D: do all of the above.
        answer: A
      - uid: MIN327.9.2.2.F.1
        subobj: 9.2.2
        type: final
        question: The three major steps in preparing an annual budget are
        choices:
          A: distributing projected budgets, planning meetings, and distributing proposed
            budget requests.
          B: preparing budget requests, planning meetings, and distributing proposed
            budget requests.
          C: preparing budget requests, planning meetings, and reviewing personnel.
          D: distributing budget information and worksheets, planning meetings, and
