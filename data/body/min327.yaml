    course_objectives:
    - 1. Locate and interpret Scripture passages that form a biblical basis for good
      management of the local church; the giving of tithes and offerings; and the
      stewardship of the church’s money, facilities, and resources.
    - 2. Identify the roles and responsibilities of the pastor, board, and officers
      for the financial management of the local church.
    - 3. Define the basic terms, principles, and operating procedures associated with
      church business management.
    - 4. Establish a set of recognized procedures for conducting church business in
      a professional, responsible manner.
    - 5. Choose to demonstrate a positive attitude toward the use of business tools
      and techniques in the work of the church.
    - 6. Implement business management ideas, procedures, and techniques to improve
      the effectiveness of the local church’s business operations.
    - 7. Recount and explain many of the substantive legal principles that apply to
      churches and clergy.
    - 8. Identify circumstances that require professional legal counsel.
    - 9. Explain why many pastoral decisions must be made in light of their legal
      consequences.
    - 10. Describe the more common forms of church and clergy legal liability.
    - 11. Explain the legal rights and responsibilities of the clergy.
    - 12. Identify and describe several risk management principles and strategies
      to help churches and clergy lower their risk of liability.
    - 13. Apply skills in and knowledge of church administration in preparation for
      a leadership position that involves greater competence and responsibility.
