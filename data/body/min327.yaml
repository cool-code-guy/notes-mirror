        choices:
          A: Protestant church.
          B: denominational church.
          C: hierarchical church.
          D: congregational church.
        answer: D
      - uid: MIN327.10.3.1.F.1
        subobj: 10.3.1
        type: final
        question: When a congregation is aware of a minister’s unauthorized action
