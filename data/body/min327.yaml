        answer: D
      - uid: MIN327.9.2.3.F.1
        subobj: 9.2.3
        type: final
        question: What is a church’s stewardship potential?
        choices:
          A: A total of all investments owned by all the church members
          B: The tithes and offerings of last year divided by the number of members
            in the church
          C: Ten percent of the average annual household income multiplied by the
            number of families in the church
          D: The total value of all church property less depreciation
        answer: C
      - uid: MIN327.10.1.1.F.1
