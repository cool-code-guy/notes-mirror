          B: a written record prepared as merchandise is received.
          C: a document that attests to the details and accuracy of a transaction.
          D: an unpaid, short-term account that a purchaser owes a vendor.
        answer: C
      - uid: MIN327.7.2.3.F.1
        subobj: 7.2.3
        type: final
