      - last_modified: '2026-03-27'
        title: American Life and the Church in the 1800s
        subobjectives:
          1.1.1:
            last_modified: '2026-03-27'
            text: Explain what is meant by the Second Great Awakening and identify
              five major shifts that transformed America in the 1800s.
            glossary:
            - term: American Revolution
              definition: the American colonies’ war for independence from Great Britain
                (1775–1783)
              paragraph: THE154.1.1.1.P.2
              page: 20
              UID: THE154.1.1.1.G.1
            - term: Anglican
              definition: a church denomination, forbear of the Episcopalian denomination
              paragraph: THE154.1.1.1.P.18
              page: 22
              UID: THE154.1.1.1.G.2
            - term: Arminianism
              definition: Protestant theological school of thought that rejects the
                doctrine of double-predestination
              paragraph: THE154.1.1.1.P.20
              page: 22
              UID: THE154.1.1.1.G.3
            - term: Calvinism
              definition: Protestant theological school of thought that emphasizes
                justification by faith, God’s grace, and predestination
              paragraph: THE154.1.1.1.P.20
              page: 22
              UID: THE154.1.1.1.G.4
            - term: Congregationalist
              definition: a church denomination, descendants of the Puritans
              paragraph: THE154.1.1.1.P.18
              page: 22
              UID: THE154.1.1.1.G.5
            - term: cultural Christianity
              definition: religion that superficially identifies with Christianity
                but does not involve a personal relationship with or commitment to
                God
              paragraph: THE154.1.1.1.P.28
              page: 23
              UID: THE154.1.1.1.G.6
            - term: Louisiana Purchase
              definition: 828,000 square miles of land the United States bought from
                France, including all or parts of 15 states and Canada
              paragraph: THE154.1.1.1.P.3
              page: 20
              UID: THE154.1.1.1.G.7
            - term: modernism
              definition: a movement toward modifying traditional beliefs to better
                fit with modern ideas and sensibilities
              paragraph: THE154.1.1.1.P.24
              page: 23
              UID: THE154.1.1.1.G.8
            - term: postmillennialism
              definition: the doctrine that Christ’s Second Coming would come after
                the thousand-year era of peace on earth
              paragraph: THE154.1.1.1.P.27
              page: 23
              UID: THE154.1.1.1.G.9
            - term: quaker
              definition: a Christian sect that stresses Inner Light, rejects sacraments
                and an ordained ministry, and opposes war
              paragraph: THE154.1.1.1.P.18
              page: 22
              UID: THE154.1.1.1.G.10
            - term: social gospel
              definition: a social reform movement that grew from the church that
                often led to the error of focusing on good works more than on God’s
                grace and salvation
              paragraph: THE154.1.1.1.P.27
              page: 23
              UID: THE154.1.1.1.G.11
            - term: temperance
              definition: movement that pushed abstinence from alcoholic drinks, including
                laws against the sale or consumption of alcohol
              paragraph: THE154.1.1.1.P.22
              page: 23
              UID: THE154.1.1.1.G.12
          1.1.2:
            last_modified: '2026-03-27'
            text: Summarize the effect of modernism and secularism on American society
              and churches.
            glossary: []
          1.1.3:
            last_modified: '2026-03-27'
            text: Compare the crisis points before the Great Pentecostal Revival with
              conditions in society today.
            glossary: []
