        type: final
        question: What was one of the key reasons that the Assemblies of God adopted
          the Sixteen Fundamental Truths?
        choices:
          A: To create a comprehensive manual for worship
          B: To ensure doctrinal unity and prevent future divisions
          C: To align with other Pentecostal organizations
          D: To introduce new doctrinal revelations
        answer: B
      - uid: THE154.5.5.1.F.2
        subobj: 5.5.1
        type: final
        question: What doctrine was most strongly emphasized in the 1917 General Council?
        choices:
          A: The role of women in ministry
          B: The requirement of water baptism for salvation
          C: Speaking in tongues as the initial physical evidence of Spirit baptism
          D: The ordination of bishops
        answer: C
      - uid: THE154.6.1.1.F.1
        subobj: 6.1.1
        type: final
        question: Which of the following facts demonstrates the Assemblies of God’s
          early passion for missions?
        choices:
          A: The first department created by the AG was the Missionary Department
            in 1919.
          B: The AG focused exclusively on domestic missions in its early years.
          C: The AG restricted missionary work to trained ministers only.
          D: The AG did not emphasize missionary outreach until the 1940s.
        answer: A
      - uid: THE154.6.2.1.F.1
        subobj: 6.2.1
        type: final
        question: What was one of the six principles the 1921 General Council outlined
          for missionary endeavors?
        choices:
          A: Only trained pastors should be sent as missionaries.
          B: Missions should focus exclusively on English-speaking nations.
          C: Missionaries should follow the indigenous church principle.
          D: Missionary work should be based on a hierarchical model.
        answer: C
      - uid: THE154.6.3.3.F.1
        subobj: 6.3.3
        type: final
        question: What is one way people on the home front have contributed to missions?
        choices:
          A: By discouraging new missionary efforts
          B: Through sacrificial giving and prayer support
          C: By limiting financial support to U.S.-based churches
          D: By keeping missions work exclusive to ordained ministers
        answer: B
      - uid: THE154.6.3.4.F.1
        subobj: 6.3.4
        type: final
        question: Which of the following is one of the seven ”windows” of U.S. Missions
          ministry?
        choices:
          A: Private Business Expansion
          B: Chaplaincy Ministries
          C: Political Outreach
          D: Academic Research
        answer: B
      - uid: THE154.6.4.1.F.1
        subobj: 6.4.1
        type: final
        question: Which of the following is NOT one of the fourfold missions strategies
          of the Assemblies of God?
        choices:
          A: Evangelism
          B: Church Planting
          C: Political Reform
          D: Education
        answer: C
      - uid: THE154.6.4.2.F.1
        subobj: 6.4.2
        type: final
        question: What is a major emphasis of AG World Missions in the twenty-first
          century?
        choices:
          A: Shifting resources away from evangelism to focus on administration
          B: Partnering with other organizations to reach unreached people groups
          C: Limiting missionary work to regions with existing AG churches
          D: Requiring all missionaries to return home after 10 years of service
        answer: B
      - uid: THE154.7.1.1.F.1
        subobj: 7.1.1
        type: final
        question: Why were early Pentecostals concerned about modern theological education?
        choices:
          A: They believed it would corrupt their doctrine with antibiblical modernism.
          B: They thought universities would demand financial support from churches.
          C: They feared students would refuse to pursue pastoral ministry.
          D: They were uncertain about how education aligned with biblical prophecy.
        answer: A
      - uid: THE154.8.1.1.F.1
        subobj: 8.1.1
        type: final
        question: What role did women play in the early Assemblies of God?
        choices:
          A: They primarily served in administrative and supportive roles
          B: They were limited to missionary work abroad
          C: They were active as pastors, evangelists, missionaries, and church planters
          D: They were officially excluded from ministry leadership
        answer: C
      - uid: THE154.9.1.1.F.1
        subobj: 9.1.1
        type: final
        question: How did liberal churches generally respond to the Pentecostal movement
          in the early 20th century?
        choices:
          A: They welcomed Pentecostals as a fresh move of the Holy Spirit.
          B: They ignored or ridiculed Pentecostals as uneducated fanatics.
          C: They sought to merge Pentecostalism with their own traditions.
          D: They actively encouraged their members to seek Spirit baptism.
        answer: B
      - uid: THE154.10.2.1.F.2
        subobj: 10.2.1
        type: final
        question: What policy did the Assemblies of God General Presbytery adopt in
          1939 regarding black ministers?
        choices:
          A: Full and equal ordination at all levels
          B: Licensing only at the district level, not national ordination
          C: Immediate expulsion from the fellowship
          D: Assignment to segregated congregations
        answer: B
      - uid: THE154.11.1.1.F.1
        subobj: 11.1.1
        type: final
        question: Which ethnic groups have been key to the growth and vitality of
          the Assemblies of God?
        choices:
          A: Hispanic, Black, and other ethnic minorities
          B: White evangelicals
          C: European immigrants from Catholic backgrounds
          D: Primarily second-generation American-born citizens
        answer: A
      - uid: THE154.12.1.1.F.1
        subobj: 12.1.1
        type: final
        question: What is the primary mission of AGTrust?
        choices:
          A: To provide financial aid for Bible college students
          B: To promote social justice causes worldwide
          C: To advance a healthy, growing Assemblies of God Fellowship and empower
            future generations
          D: To transition the Assemblies of God into an interfaith organization
        answer: C
      - uid: THE154.13.1.1.F.3
        subobj: 13.1.1
        type: final
        question: How do Bylaws differ from the Constitution in an organization’s
          governance?
        choices:
          A: The Bylaws outline administrative details and procedures, while the Constitution
            defines the organization’s identity
          B: The Bylaws are superior to the Constitution in decision-making authority
          C: The Bylaws determine doctrinal beliefs, while the Constitution focuses
            only on financial matters
          D: The Bylaws remain unchanged, while the Constitution is frequently updated
        answer: A
      - uid: THE154.14.1.2.F.2
        subobj: 14.1.2
        type: final
        question: What governing body functions as the trustees for the General Council?
        choices:
          A: The General Presbytery
          B: The Executive Presbytery
          C: The Executive Leadership Team
          D: The General Superintendent alone
        answer: B
