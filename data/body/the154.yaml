    course_objectives:
    - 1. Explain the societal and spiritual circumstances that led to the Pentecostal
      revival of the early 1900s.
    - 2. Recount key facts pertaining to the Pentecostal Movement and leading up to
      the birth of the Assemblies of God.
    - 3. Identify central leaders and influencers during defining moments in the Assemblies
      of God’s history.
    - 4. Summarize doctrines, beliefs, and values that define the Assemblies of God
      and distinguish it from other evangelical and Pentecostal organizations.
    - 5. Trace the development of Assemblies of God missions from the beginning to
      the present and identify factors that have contributed to its remarkable growth
      and success.
    - 6. Outline the histories, missions, and impact of various Assemblies of God
      programs, ministries, and educational institutions.
    - 7. Evaluate the associations that impacted and were impacted by the Assemblies
      of God over the years.
    - 8. Describe key areas of transformation in the Assemblies of God today and explain
      what must be done to meet the challenges of the future.
    - 9. Describe the events that led to the formation of the Statement of Fundamental
      Truths.
    - 10. Explain the structure and organization of the Assemblies of God.
    - '11. Identify the Assemblies of God’s historical emphasis on the ministry of
      the Holy Spirit: baptism and gifts.'
    - 12. Analyze and apply lessons and biblical principles learned from this course
      to life and ministry.
