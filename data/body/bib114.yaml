    course_objectives:
    - 1. Explain the term Synoptic Gospels, when it came into focus, and the nature
      of the so-called “Synoptic problem.”
    - 2. Discuss the historical background of Palestine and the Jewish religious development
      that prepared the way for Christ’s coming.
    - 3. Identify key events in the early life of Christ, His public ministry, and
      His final days on earth.
    - 4. Distinguish between Christ’s early ministry, greater Galilean ministry, later
      Judean / Perean ministry, and Passion Week.
    - 5. Summarize Christ’s teachings on the kingdom of God as they relate to the
      church and the world.
    - 6. Explain Christ’s purpose in using parables and miracles and discuss His teaching
      method.
    - 7. Analyze and participate in God’s plan to redeem through the life, death,
      resurrection, and commission of Christ.
