    - last_modified: '2026-06-09'
      title: 8 - Humanity’s Appeals to God (Job, Psalms)
      print_page: 143
      intro_body:
      - text: The Book of Job deals with the age-old question, “If God is good and
          loving, why does He allow people to suffer?” Many people in ancient Israel
          believed that a person’s situation is always directly related to his or
          her righteousness. If you honored God, you would inevitably experience His
          blessing. If you dishonored God, you would experience discipline. The Book
          of Job acknowledges that life is not always so simple. It describes the
          experience of a righteous individual who faced numerous tragic life situations
          yet persevered in his faith in God.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH8.INTRO.P.1
      - text: As the prayer book for the nation of Israel, Psalms highlights the gamut
          of human emotions. Its 150 prayers and songs were originally set to music
          and expressed strong emotions about life’s difficulties. While many of the
          psalms express adoration and love for God, others express frustration and
          anger about God’s apparent inaction. Since we continue to experience many
          of the emotions expressed in Israel’s songs, the Book of Psalms has provided
          powerful examples of prayer for Jews and Christians until today.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH8.INTRO.P.2
      lessons:
