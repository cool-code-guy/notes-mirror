      title: 11 - Judah’s Early Prophets (Joel, Isaiah, Micah)
      print_page: 191
      intro_body:
      - text: In the previous chapter, we discussed the early prophets who ministered
          to the nation of Israel during the divided kingdom. In this chapter, we
          will consider the early prophets who ministered in Judah during the same
          era. (Review the following chart.)
        kind: prose
