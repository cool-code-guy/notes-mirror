    - last_modified: '2026-05-28'
      title: 3 - Israel’s Early Years (Exodus–Deuteronomy)
      print_page: 47
      intro_body:
      - text: Many years after Joseph’s death, the cry of the enslaved Israelites
          “went up to God” (Exodus 2:23). God had not forgotten His covenant with
          Israel’s patriarchs. Specifically, He remembered His promise that they would
          inhabit the land of Canaan. It was now time to fulfill that promise.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH3.INTRO.P.1
      - text: To do so, He would need a strong leader—an imperfect yet righteous prophet
          to mediate between God and His people. He needed Moses. Throughout the grueling
          ordeal of leading the disgruntled, rebellious Israelites to the land of
          their inheritance, Moses not only served as God’s mouthpiece to the people
          but also interceded several times to allay God’s wrath against them. In
          the process, he became the Lord’s friend (Exodus 33:11) yet remained “more
          humble than anyone else on the face of the earth” (Numbers 12:3). Until
          the time of Jesus, no prophet could compare to Moses’s example of “mighty
          power” and “awesome deeds” (Deuteronomy 34:12).
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH3.INTRO.P.2
      - text: The last four books of the Pentateuch entwine the life of Moses with
          the journey of the Israelites to the Promised Land. As we study Exodus through
          Deuteronomy, you will notice the contrast between the Israelites’ rebellion
          and Moses’s faithfulness.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH3.INTRO.P.3
