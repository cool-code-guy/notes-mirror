    glossary:
    - term: agnostics
      definition: people who are not sure whether God exists
      chapter: 8
      paragraph: BIB111.8.1.1.P.18.1
      page: 145
    - term: Alexander the Great
      definition: the man, also known as Alexander III or Alexander of Macedonia,
        who lived from 365 to 323 BC; king of Macedonia who led the Greek army to
        victory over much of the known ancient world; credited with making Greek culture,
        literature, and language the standard for all
      chapter: 13
      paragraph: BIB111.13.2.1.P.51.1
    - term: allegorical
      definition: having hidden spiritual meaning beyond the literal interpretation
        of a text
      chapter: 9
      paragraph: BIB111.9.3.1.P.15.1
      page: 167
    - term: Amalekites
      definition: the descendants of Amalek, a descendant of Esau; nomadic people
        living in the Negev desert or the southern end of the Promised Land and in
        the Sinai; perpetual enemies of Israel
      chapter: 4
      paragraph: BIB111.4.4.1.P.38
      page: 82
    - term: Ammonites
      definition: sometimes referred to as the “sons of Ammon,” they were linked to
        the Moabites by ancestry and often acted with them; they were also distant
        relatives of the Israelites
      chapter: 4
      paragraph: BIB111.4.2.1.P.66.1
    - term: Amorites
      definition: the Semitic people who occupied much of Southern Canaan (both east
        and west of the Jordan) when Joshua led the Israelites into the Promised Land;
        Israel battled the five Amorite kings of Jerusalem, Hebron, Marmuth, Lachish,
        and Eglon for the purpose of taking the land and destroying its evil influence
        and hostility
      chapter: 4
      paragraph: BIB111.4.1.1.P.40.1
      page: 72
    - term: antithesis
      definition: the direct opposite of something or someone
      chapter: 6
      paragraph: BIB111.6.1.1.P.126
      page: 114
    - term: Apocrypha
      definition: the books included in the Septuagint and Vulgate but excluded from
        the Jewish and Protestant canons of the Old Testament; literally means “to
        hide away”; this word denotes noncanonical writings about God, Jesus, the
        Church, and related topics
      chapter: 1
      paragraph: BIB111.1.1.1.P.22.1
      page: 19
    - term: ark of the covenant
      definition: the rectangular wooden chest overlaid with gold and constructed
        to carry the tablets of the Ten Commandments—a testimony of the covenant between
        God and Israel that was placed in the tabernacle’s holiest chamber; the ark
        represented God’s presence among His chosen people Israel and His covenant
        blessing upon them
      chapter: 3
      paragraph: BIB111.3.3.1.P.41
      page: 59
    - term: atheists
      definition: the people who do not believe God exists
      chapter: 8
      paragraph: BIB111.8.1.1.P.18.1
      page: 145
    - term: Baal
      definition: the most significant god among the many gods worshipped by the Canaanites;
        considered the god of fertility for the land, animals, and humans; incense
        and sacrifice (even human) were offered to Baal and fertility rites were performed
        that involved sexual acts with temple prostitutes
      chapter: 5
