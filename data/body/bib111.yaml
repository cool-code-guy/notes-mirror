    - title: The Later Prophets
      chapters:
      - 12
      - 13
      - 14
      - 15
      intro_body:
      - text: Studying the books of prophecy in relation to their historical time
          period helps us develop a historical overview and understand God’s overarching
          purposes in the different eras. It also helps us coordinate the various
          prophets with not only the kings who ruled at the time but also the circumstances
          that sparked some of the prophecies.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.UNIT5.INTRO.P.1
      - text: 'In the previous unit, we considered the prophets who ministered in
          the divided kingdom until and immediately following Israel’s captivity.
          Now, we turn our attention to those who prophesied before, during, and after
          the time of Judah’s exile:'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.UNIT5.INTRO.P.2
