      - 5
      - 6
      - 7
      intro_body:
      - text: 'The books of the Bible from Joshua through Esther chronicle the establishment,
          destruction, and restoration of Israel as a nation. They trace Israel’s
          history from the first days of conquering Canaan, through the spiritually
          trying times of the judges and kings and the divided nation, to the people’s
          exile and return. Geisler (1981, 83) presents the Law and historical books
          in terms of the nation of Israel as follows:'
