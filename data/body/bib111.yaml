    - last_modified: '2026-05-28'
      title: 15 - The Connection (The Old and New Testaments)
      print_page: 251
      intro_body:
      - text: 'After surveying the entire Old Testament, a few issues remain for consideration:
          How does the Old Testament relate to the New Testament? In view of divine
          inspiration of all Scripture, how do believers determine what Old Testament
          principles and commands apply today?'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH15.INTRO.P.1
      - text: The Old Testament lays the groundwork for the New Testament. Without
          the Old Testament, it would be very difficult, perhaps impossible, to understand
          the New Testament. But is that its only purpose? According to 2 Timothy
          3:16, “ All Scripture is God-breathed and is useful for teaching, rebuking,
          correcting and training in righteousness.” While Paul’s statement can be
          appropriately extended to the New Testament documents, his original intention
          likely focused on the Old Testament. Thus, when he said that Scripture is
          God-breathed, he meant that it is inspired by God. And this undoubtedly
          includes the Old Testament.
        kind: prose
        cls: IST_Body-Indent
        md: The Old Testament lays the groundwork for the New Testament. Without the
          Old Testament, it would be very difficult, perhaps impossible, to understand
          the New Testament. But is that its only purpose? According to 2 Timothy
          3:16, “*All* Scripture is God-breathed and is useful for teaching, rebuking,
          correcting and training in righteousness.” While Paul’s statement can be
          appropriately extended to the New Testament documents, his original intention
          likely focused on the Old Testament. Thus, when he said that Scripture is
          God-breathed, he meant that it is inspired by God. And this undoubtedly
          includes the Old Testament.
        UID: BIB111.CH15.INTRO.P.2
      - text: While all faithful Christians affirm the value of the Old Testament,
          many still find it difficult to know how to apply the Old Testament. Unfortunately,
          many people neglect the Old Testament except for the famous passages that
          either make sense or have been traditionally interpreted as messianic prophecies.
          This situation resembles the early heretical position adopted by Marcion.
          In the second century of Christianity, Marcion rejected the Old Testament
          and any part of the New Testament that relied heavily upon it. By neglecting
          the Old Testament, many Christians fall into the same trap Marcion led others
          into nearly 2,000 years ago.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH15.INTRO.P.3
      - text: In this last chapter of our study, we will attempt to address these
          issues in a biblically balanced way. Based on the principle that all Scripture
          is God-inspired, we will examine the relationship between the two testaments
          and consider the Old Testament’s relevance to today’s believers.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH15.INTRO.P.4
