    - last_modified: '2026-03-27'
      title: 14 - The Postexilic Prophets (Haggai, Zechariah, Malachi)
      print_page: 239
      intro_body:
      - text: After the Exile, as Ezra and Nehemiah promoted the rebuilding of the
          temple and the wall around Jerusalem, God raised up the prophets Haggai,
          Zechariah, and Malachi. Both Haggai and Zechariah encouraged the rebuilding
          of the temple. Malachi encouraged the people to give God their very best.
          In this sense, all of these prophets can be called prophets of encouragement.
          Although they offered harsh words for the people’s going astray, their primary
          message was positive. They encouraged the people to live according to God’s
          covenant and plan. Haggai, Zechariah, and Malachi were prophets who exhorted
          the people to return to proper priorities.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH14.INTRO.P.1
      lessons:
      - last_modified: '2026-03-27'
        title: 'Haggai: The Prophet of Rebuilding the Temple'
        subobjectives:
          14.1.1:
            last_modified: '2026-03-27'
            text: Summarize the setting, purposes, and theme of Haggai.
            glossary:
            - term: signet
              definition: an official seal used to give personal authority to a message,
                decree, or document; in ancient times used in place of a signature;
                often a signet was part of a ring worn by a person to signify that
                he or she spoke with the authority of the ruler to whom the signet
                belonged
              paragraph: BIB111.14.1.1.P.36
              page: 241
              UID: BIB111.14.1.1.G.1
          14.1.2:
            last_modified: '2026-08-07'
            text: Discuss how Haggai conveyed his theme.
            glossary: []
      - last_modified: '2026-03-27'
