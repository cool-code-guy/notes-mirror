    title: Old Testament Survey
    units:
    - title: The Law
      chapters:
      - 1
      - 2
      - 3
      intro_body:
      - text: The Old Testament is a treasure filled with narratives about God’s creative
          power and the history of the nation of Israel. Yet some believers do not
          fully appreciate the value of studying the Old Testament. In part, this
          attitude has developed because some teachers take Old Testament passages
          out of context, ignoring valid principles of interpretation and imposing
          an unjustified legalism. Other teachers have gone to the opposite extreme,
          claiming that the Old Testament does not apply at all to today’s Christians.
          However, this view fails to account for the New Testament’s numerous quotations
          from the Old Testament. The New Testament writers obviously viewed the Old
          Testament as God’s Word. In fact, without a proper understanding of the
          Old Testament, we cannot fully understand and appreciate the New Testament.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.UNIT1.INTRO.P.1
      - text: Therefore, in Unit 1, we will begin to discover the Old Testament’s
          riches by examining the books of the Law. These first three chapters will
          survey the value of the Old Testament and the account of beginnings, the
          lives of the patriarchs, and the early years of Israel’s history. They will
          also trace the formation of God’s covenant with Abraham and his descendants.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.UNIT1.INTRO.P.2
      - text: Please take time to read each Book of the Old Testament as you approach
          the specific lessons.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.UNIT1.INTRO.P.3
    - title: The Historical Books
      chapters:
