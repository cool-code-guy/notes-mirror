    - last_modified: '2026-06-16'
      title: 4 - Conquest and Life in Canaan (Joshua–1 Samuel)
      print_page: 69
      intro_body:
      - text: 'Moses’s exhortations throughout Deuteronomy had been clear: Be faithful
          to God, keep Him central to every aspect of life, and you will be blessed.
          Turn away from Him, reject His authority, and He will turn you over to your
          enemies (Deuteronomy 30:15–18).'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH4.INTRO.P.1
      - text: Had the Israelites remembered these key principles, their years of entering
          and settling in Canaan would have been far more peaceful and far less volatile.
          Yet, as the years passed, the people forgot the words of Moses. They became
          more interested in their own pursuits than in the pursuits of their God.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH4.INTRO.P.2
      - text: Despite the Israelites’ faithlessness, however, God himself remained
          faithful (see 2 Timothy 2:13). Although He punished the Israelites, He also
          raised up godly people such as Joshua, Deborah, Jephthah, Samuel, and David
          to lead Israel back to the worship of the one true God. As the story of
          Ruth illustrates so beautifully, these first few historical books show the
          blessing that comes from remaining faithful to God and loving Him with all
          our heart, soul, mind, and strength.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH4.INTRO.P.3
