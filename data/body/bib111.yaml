    - last_modified: '2026-05-28'
      title: 1 - Treasures from the Old Testament
      print_page: 17
      intro_body:
      - text: We have already mentioned the riches the Old Testament contains. Regardless
          of genre —law, history, poetry, or prophecy—the books of the Old Testament
          display God’s plan of redemption. They reveal His character, and His desire
          to redeem the world. The Old Testament also prepares us for the revelation
          of Jesus as Messiah and Savior.
        kind: prose
        cls: IST_Body-Indent
        md: We have already mentioned the riches the Old Testament contains. Regardless
          of **genre**—law, history, poetry, or prophecy—the books of the Old Testament
          display God’s plan of redemption. They reveal His character, and His desire
          to redeem the world. The Old Testament also prepares us for the revelation
          of Jesus as **Messiah** and Savior.
        UID: BIB111.CH1.INTRO.P.1
      - text: To see the craftsmanship of this tapestry unfold, we must learn to understand
          how the Old Testament is woven together. We must learn what the Old Testament
          is and the role it plays in God’s plan. We must also consider the historical
          context of the Old Testament, and the lessons learned by the people living
          during that time as they tried to follow God. In the Old Testament, God
          has provided a treasure trove of wisdom, understanding, and truth that we
          can seek and apply to our hearts and lives.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH1.INTRO.P.2
      lessons:
      - last_modified: '2026-03-27'
        title: The Old Testament
        subobjectives:
          1.1.1:
            last_modified: '2026-08-07'
            text: Summarize key facts about the Old Testament.
            glossary:
            - term: Apocrypha
              definition: the books included in the Septuagint and Vulgate but excluded
                from the Jewish and Protestant canons of the Old Testament; literally
                means “to hide away”; this word denotes noncanonical writings about
                God, Jesus, the Church, and related topics
              paragraph: BIB111.1.1.1.P.22.1
              page: 19
              UID: BIB111.1.1.1.G.1
            - term: canon
              definition: the list of books that met the standards for being in God’s
                Word; what is authorized or accepted by the laws of the church to
                be holy Scripture
              paragraph: BIB111.1.1.1.P.21.1
              page: 19
              UID: BIB111.1.1.1.G.2
            - term: covenant
              definition: a specific, binding agreement between two parties; a committed
                relationship that involves accountability from one or both parties
              paragraph: BIB111.1.1.1.P.6.1
              page: 18
              UID: BIB111.1.1.1.G.3
            - term: Pentateuch
              definition: 'the Law, which included the five books of Moses: Genesis,
                Exodus, Leviticus, Numbers, and Deuteronomy'
              paragraph: BIB111.1.1.1.P.49.1
              page: 268
              UID: BIB111.1.1.1.G.6
            - term: Protestant Reformation
              definition: (or simply the Reformation); the major sixteenth-century
                movement aimed at reforming the beliefs and practices of the Roman
                Catholic Church in Europe; when it became apparent that reform would
                not happen, those who protested the church (Protestants) were forced
                to separate from Roman Catholicism, thus establishing the denominational
                offshoots that would become known as Protestant churches
              paragraph: BIB111.1.1.1.P.22.1
              page: 19
              UID: BIB111.1.1.1.G.7
            - term: Septuagint
              definition: the name given to the Greek translation of the Hebrew Scriptures;
                often designated as LXX (the number 70)
              paragraph: BIB111.1.1.1.P.40.1
              page: 19
              UID: BIB111.1.1.1.G.4
            - term: tabernacle
              definition: the movable tent used as the place of worship for the ancient
                Israelites that housed the ark of the covenant; considered the dwelling
                place of God’s presence among the Israelites while they journeyed
                to the Promised Land
              paragraph: BIB111.1.1.1.P.16
              UID: BIB111.1.1.1.G.5
