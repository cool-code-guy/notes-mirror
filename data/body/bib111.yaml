      - text: Chapter 11
        kind: chart
        cls: IST_Table-Body
        table: 25
        row: 3
        col: 2
        UID: BIB111.CH11.INTRO.P.6
      - text: While the rulers of the Northern Kingdom led Israel further and further
          into idolatry, the Southern Kingdom’s decline under her leaders was more
          gradual. Kings such as Jehoshaphat and Josiah led the nation of Judah in
          worshipping the one true God. Yet other kings turned away from monotheism
          and worshipped idols. As the rule of Judah passed from one king to another,
          God continued to speak through prophets such as Joel, Isaiah, and Micah,
          calling His people to repent and turn to Him wholeheartedly or face judgment.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH11.INTRO.P.7
