    - last_modified: '2026-05-28'
      title: 2 - The Patriarchs (Genesis 12–50)
      print_page: 33
      intro_body:
      - text: 'Genealogical research has become increasingly popular in recent years:
          Where did my last name come from? What were my ancestors like? Were they
          committed to a particular faith tradition? What kind of past did they have?
          What country did they come from? Why did they leave that country? Are people
          with the same last name possibly related to me? Although the questions are
          endless, numerous tools have been developed to help provide answers.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH2.INTRO.P.1
      - text: 'In revealing the family tree of Israel, the Bible provides a framework
          to help us understand more about God and His people. Genesis 12–50 focuses
          on four patriarchs or ancestors of the nation of Israel: Abraham, Isaac,
          Jacob, and Joseph.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH2.INTRO.P.2
      - text: 'What is a patriarch? The term refers to the individuals who stood at
          the fountainhead of our faith: Abraham, Isaac, and Jacob. They, their wives,
          and their families were pioneers of faith who paved the way for ancient
          Israel. They also have an honored position in the New Testament (Hebrews
          11). The patriarchs are the ancestors of our faith (Arnold and Beyer 1999,
          90).'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH2.INTRO.P.3
      - text: In the previous chapter, we found that Genesis 1–11 describes the background
          of humanity and the problem of sin. People were created in God’s image to
          have fellowship with Him. By Genesis 11, we see humans both separated from
          God and separated from one another geographically. However, in Genesis 12,
          we begin to see God’s plan unfold to redeem and restore His people.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH2.INTRO.P.4
