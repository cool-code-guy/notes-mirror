      title: 12 - The Preexilic Prophets(Nahum, Habakkuk, Zephaniah, Obadiah, Jeremiah)
      print_page: 209
      intro_body:
      - text: Following Josiah’s godly rule, the spiritual condition of Judah declined
          yet again. God continually reminded the people of the coming judgment through
          righteous prophets, but the people refused to listen. The prophetic books
          believed to have been authored during this time leading up to the Exile
          are Nahum, Habakkuk, Zephaniah, Obadiah, Jeremiah, and Lamentations.
        kind: prose
