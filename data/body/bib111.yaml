      title: 9 - Divine Appeals to Humanity(Proverbs, Ecclesiastes, Song of Songs)
      print_page: 157
      intro_body:
      - text: While Job and Psalms reflect humanity’s appeals, prayers, and hymns
          to God, the remaining poetical books—Proverbs, Ecclesiastes, and Song of
          Songs—focus on issues of wise, godly living. Proverbs wrestles with wise
          living in a variety of situations, Ecclesiastes tackles the meaning of life,
          and Song of Songs addresses love and sexual relationships. The five poetry
          or wisdom books taken together can be considered a conversation with God.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH9.INTRO.P.1
