    - last_modified: '2026-05-28'
      title: 7 - The Postexilic Books (Ezra, Nehemiah, Esther)
      print_page: 125
      intro_body:
      - text: 'Because of the prophecies of Isaiah, Micah, and Jeremiah, the captive
          people of Judah knew that the Exile was divine judgment for their sins.
          Yet, just as the prophets had warned of the coming exile, they also gave
          the people of Judah a promise: God would restore them. When Cyrus made the
          decree in 538 BC, the people were free to return home and begin the task
          of rebuilding their homeland.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH7.INTRO.P.1
      - text: As the final three historical books, Ezra, Nehemiah, and Esther give
          us the history of God’s people after the Babylonian Exile. They describe
          Jewish life from the return to Jerusalem through the close of the Old Testament.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH7.INTRO.P.2
