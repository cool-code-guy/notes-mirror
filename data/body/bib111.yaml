    - title: The Poetry and Wisdom Books
      chapters:
      - 8
      - 9
      intro_body:
      - text: Job, Psalms, Proverbs, Ecclesiastes, and Song of Songs are poetic books
          frequently described as Wisdom Literature. Most of these books are written
          in poetic form common to ancient Israel. Whereas English poetry is known
          for rhyming and its use of meter, Hebrew poetry is known for its use of
          repetition called parallelism. Additionally, Hebrew poetry uses vivid language
          pulled from its ancient agricultural context.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.UNIT3.INTRO.P.1
      - text: We can also split these books into two broad categories. Job and Psalms
          can be considered humanity’s appeal to God for assistance. Proverbs, Ecclesiastes,
          and Song of Songs demonstrate godly wisdom in everyday life.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.UNIT3.INTRO.P.2
    - title: The Early Prophets
      chapters:
      - 10
      - 11
      intro_body:
      - text: 'In earlier chapters, we discussed the history of the Israelite kingdoms
          in relation to kings and nations. Now we will consider the ministry of the
          leading prophets during those historical eras. The prophets whose stories
          and prophecies conclude the Old Testament probably ministered from approximately
          850 to 450 BC. During these four hundred years, the history of Israel and
          Judah was affected by three major kingdoms: Assyria, Babylon, and Persia.
          To review, Assyria conquered Israel in 722 BC, and Babylon conquered Judah
          in 586 BC. Persia conquered the Medes in 550 BC when Cyrus, king of Persia,
          attacked his father-in-law Astyages, king of Media. Then, in 539 BC, the
          Persians conquered Babylon on the night when Daniel interpreted the handwriting
          on the wall (Daniel 5:1–31).'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.UNIT4.INTRO.P.1
      - text: Two common methods are used to divide the Old Testament books of prophecy.
          One way is to distinguish between the Major Prophets and the Minor Prophets
          (referring to the general length of the books rather than to the prophets
          themselves). According to this method, Isaiah, Jeremiah (with Lamentations),
          Ezekiel, and Daniel are considered the Major Prophets. The Minor Prophets
          are Hosea, Joel, Amos, Obadiah, Jonah, Micah, Nahum, Habakkuk, Zephaniah,
          Haggai, Zechariah, and Malachi.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.UNIT4.INTRO.P.2
      - text: 'In the second method, scholarly literature divides the prophets by
          the historical eras in which they lived and the way they spoke to their
          respective nations or kingdoms. This organizational pattern divides the
          books as follows: prophets during the divided kingdom, prophets before the
          Exile, prophets during the Exile, and prophets after the Exile. In addition,
          during the divided kingdom, prophets to Israel are distinguished from prophets
          to Judah. (See the following chart.) We will use this second approach for
          the purposes of our study.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.UNIT4.INTRO.P.3
