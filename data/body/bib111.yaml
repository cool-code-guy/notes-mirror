      title: 10 - Israel’s Early Prophets (Jonah, Amos, Hosea)
      print_page: 175
      intro_body:
      - text: In chapter 5 of this course, we learned that Israel split into two kingdoms
          under the reign of Rehoboam, Solomon’s son. Jeroboam I became the king of
          the Northern Kingdom (Israel) and led the priests and nation into idolatrous
          worship practices. Eventually, the Israelites fully devoted themselves to
          worshipping Baal. In response, God raised up prophets such as Elijah and
          Elisha to call the people to repentance. Elijah and Elisha ministered and
          lived during the time of Ahab and Jezebel (1 Kings 16:29–18:46). Years later,
          when Jonah, Amos, and Hosea ministered to the nation of Israel, the people
          were still consistently worshipping Baal (Smith 1991, 40).
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH10.INTRO.P.1
      - text: ''
        kind: image
        src: BBIB111ENE01-90_01.26.01-web-resources/image/Ch_10_Timeline_Assyrians_Babylonians.png
        alt: A graph showing the population of Babylonians and Assyrians.
        caption: 'Figure 10.1: Timeline of Israel’s kings and prophets'
        UID: BIB111.CH10.INTRO.IMG.1
      - text: God became angry with Israel because of His people’s participation in
          sinful practices and consistent breaking of their covenant with Him. The
          prophets’ voices fell on deaf ears. God therefore commissioned Syrian kings
          Hazael and Ben-Hadad to defeat the nation of Israel. Finally, the Israelites
          cried out to God in a desperate plea for assistance. God showered His mercy
          on them (see 2 Kings 13:4, 22–23; 14:26–27) and sent the Assyrians to defeat
          the Syrians.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH10.INTRO.P.3
