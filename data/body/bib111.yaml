    - last_modified: '2026-05-28'
      title: 13 - The Exilic Prophets (Ezekiel, Daniel)
      print_page: 227
      intro_body:
      - text: Jeremiah prophesied that the Babylonians would conquer Judah and that
          the Jews would be captives in Babylon for seventy years (Jeremiah 29:10).
          The fulfillment of this prophecy brought a dark time for the people. However,
          “during this time of national despair, God raised up two prophetic voices.
          They gave the Judean exiles hope for their present and for their future.
          These two men had themselves experienced the disorientation and alienation
          of exile in Babylon” (Brubaker 2003b, 784). God used the situations of Ezekiel
          and Daniel to fulfill His plans and purposes.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH13.INTRO.P.1
      - text: Daniel was taken captive when he was approximately seventeen years old,
          in 605 BC. He had been living in Babylon for nine years when the ten thousand
          captives that included Ezekiel were exiled to Babylon in 597 BC. The remaining
          people of Judah were taken into Babylonian captivity and the destruction
          of Jerusalem was complete in 586 BC.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH13.INTRO.P.2
      - text: Ezekiel and Daniel ministered to the people by prophesying and assuring
          them of God’s ultimate control and sovereignty. God’s unique design called
          for Ezekiel to convey his prophetic messages through dramatic acts or plays;
          thus, we refer to Ezekiel as the prophet of dramatic acting. As for Daniel,
          God placed him in a unique position to minister amid an oppressive government.
          Although both prophets emphasize the sovereignty of God, Daniel is called
          the prophet of divine sovereignty.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH13.INTRO.P.3
      lessons:
      - last_modified: '2026-03-27'
        title: 'Ezekiel: The Prophet of Dramatic Acting'
        subobjectives:
          13.1.1:
            last_modified: '2026-08-07'
            text: Recount the setting, purposes, and themes of Ezekiel.
            glossary:
            - term: omnipresence
              definition: the state of being in all places at all times; everywhere
                present
              paragraph: BIB111.13.1.1.P.30.1
              page: 229
              UID: BIB111.13.1.1.G.1
          13.1.2:
            last_modified: '2026-08-07'
