    - last_modified: '2026-05-28'
      title: 5 - The Israelite Empire (2 Samuel, 1 and 2 Kings, 1 Chronicles, 2 Chronicles
        1–9)
      print_page: 89
      intro_body:
      - text: 'Along with 2 Samuel, the Books of Kings and Chronicles highlight three
          phases in Israel’s history: the united kingdom, the divided kingdom, and
          the surviving kingdom. Despite occasional hostility, the nation remained
          united under both David’s wartime rule and Solomon’s peaceful leadership.
          However, soon after Solomon’s death, the tribes separated into the Northern
          Kingdom (Israel) and the Southern Kingdom (Judah). While David’s descendants
          ruled Judah (discussed in the next chapter), the Northern Kingdom was ruled
          by increasingly wicked kings and did not last long.'
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH5.INTRO.P.1
      lessons:
