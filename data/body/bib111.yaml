    - last_modified: '2026-05-28'
      title: 6 - The Southern Kingdom of Judah (1 and 2 Kings, 2 Chronicles 10–36)
      print_page: 109
      intro_body:
      - text: 'According to the biblical account, the kingdom of Israel divided for
          two reasons: (1) Rehoboam demanded unusually high taxes, following the advice
          of younger individuals rather than the counsel of wise elders (1 Kings 12:1–15).
          (2) God carried out His displeasure with Solomon’s sins by judging him (11:9–13),
          although the divided kingdom occurred after Solomon’s death (2 Samuel 7:12–16).
          God delayed His judgment as an expression of grace and mercy to David.'
        kind: prose
        cls: IST_Body-Indent
        md: 'According to the biblical account, the kingdom of Israel divided for
          two reasons: (1) Rehoboam demanded unusually high taxes, following the advice
          of younger individuals rather than the counsel of wise elders (1 Kings 12:1–15).
          <br/>(2) God carried out His displeasure with Solomon’s sins by judging
          him <br/>(11:9–13), although the divided kingdom occurred after Solomon’s
          death <br/>(2 Samuel 7:12–16). God delayed His judgment as an expression
          of grace and mercy to David.'
        UID: BIB111.CH6.INTRO.P.1
      - text: The Southern Kingdom, or the kingdom of Judah, lasted approximately
          350 years (931–586 BC). Twenty kings ruled in Judah, twelve of them during
          the time of the divided kingdom. The events of their reigns are recorded
          in 1 and 2 Kings and the ending chapters of 2 Chronicles.
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH6.INTRO.P.2
      - text: It is helpful to remember that the Books of Kings and Chronicles are
          not like modern history textbooks. While they do record the events that
          happened, they select and arrange the stories for theological reasons primarily.
          Their theological emphasis is most evident in their repeated encouragement
          to learn more about the facts of a king’s reign in supplementary records
          (for example, the book of the kings of Judah and Israel).
        kind: prose
        cls: IST_Body-Indent
        UID: BIB111.CH6.INTRO.P.3
      - text: While these books are primarily concerned with the theological significance
          of Israel’s and Judah’s history, we do know more about this era of biblical
          history than the eras of the patriarchs, exodus, conquest, or judges. Not
          only does the biblical account provide more detail, but we can correlate
          many stories with data from extrabiblical sources. While 1 and 2 Kings describe
          the history of the Southern Kingdom in reference to the Northern Kingdom,
          2 Chronicles gives more detailed information about David’s ruling family.
        kind: prose
        cls: IST_Body-Indent
        md: While these books are primarily concerned with the theological significance
          of Israel’s and Judah’s history, we do know more about this era of biblical
          history than the eras of the patriarchs, exodus, conquest, or judges. Not
          only does the biblical account provide more detail, but we can correlate
          many stories with data from **extrabiblical** sources. While 1 and 2 Kings
          describe the history of the Southern Kingdom in reference to the Northern
          Kingdom, 2 Chronicles gives more detailed information about David’s ruling
          family.
        UID: BIB111.CH6.INTRO.P.4
