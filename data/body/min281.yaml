    course_objectives:
    - 1. Explain the significant place managing conflict has in the work of ministry.
    - 2. Identify varying theories concerning the best approaches to managing and
      resolving conflict.
    - 3. List and explain the various levels of conflict and how they differ from
      one another.
    - 4. Explain how a minister can position himself or herself in a conflict for
      greatest congregational health.
    - 5. Identify key biblical passages that give guidance to attitude and behavior
      in times of conflict and can aid the resolution of conflict.
    - 6. Explain key factors that exist in communities and churches that give additional
      cause for conflict.
    - 7. Identify key principles that aid leaders as they help others manage conflict.
    - 8. Explain how a church’s size, community, and culture become catalysts for
      conflict.
    - 9. List effective ground rules for conflict management.
    - 10. Explain the difference between destructive and constructive conflict and
      how to respond when conflict reaches a destructive level.
