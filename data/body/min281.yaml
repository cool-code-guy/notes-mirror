      - last_modified: '2026-05-22'
        title: Ministry Has Changed
        subobjectives:
          1.1.1:
            last_modified: '2026-05-22'
            text: Define cultural changes and their impact on the ministry of the
              local church.
            glossary:
            - term: authoritarian leadership
              definition: a style of management in which a leader dictates policies
                and procedures, sets goals, and oversees all activities without meaningful
                input from those considered under the leader’s power / influence
              paragraph: MIN281.1.1.1.P.20
              page: 17
              UID: MIN281.1.1.1.G.1
            - term: cosmopolitan
              definition: having wide, varied, or international interests; showing
                sophistication and a broad scope of understanding, rather than a limited
                or local view of the world
              paragraph: MIN281.1.1.1.P.22
              page: 17
              UID: MIN281.1.1.1.G.2
            - term: denomination
              definition: a religious group or organization whose congregations are
                united through the group’s beliefs and practices
              paragraph: MIN281.1.1.1.P.17
              page: 16
              UID: MIN281.1.1.1.G.3
            - term: ecumenical movement
              definition: a philosophical shift that started in the early 1900s (and
                still persists today) that focused on achieving universal Christian
                unity and church union among religious groups through interdenominational
                cooperation
              paragraph: MIN281.1.1.1.P.16
              page: 16
              UID: MIN281.1.1.1.G.4
            - term: laity
              definition: the people within a church who are not ministers
              paragraph: MIN281.1.1.1.P.10
              UID: MIN281.1.1.1.G.5
            - term: mainline denominationalism
              definition: the emphasizing of differences between church beliefs and
                practices to the point of being exclusive, specifically among groups
                considered to have ties with the early Protestant churches founded
                in the United States (The term “mainline” is usually in contrast in
                history and practice with evangelical, fundamentalist, and charismatic
                Protestant denominations.)
              paragraph: MIN281.1.1.1.P.16
              page: 16
              UID: MIN281.1.1.1.G.6
            - term: theological authority
              definition: the power to give orders or make decisions based on a specific
                system of religious beliefs or ideas
              paragraph: MIN281.1.1.1.P.19
              UID: MIN281.1.1.1.G.7
