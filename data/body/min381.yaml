    - last_modified: '2026-05-28'
      title: 5 - The Pastor as Worship Leader
      print_page: 103
      intro_body:
      - text: By calling pastors worship leaders, I refer to their responsibility
          for the overall direction of the church service. Like their parishioners,
          ministers live in the “real world” with its pressing demands and distractions;
          but unlike the congregation, pastors are expected to focus on spiritual
          matters. While others may straggle in to the worship service beset with
          the cares of life, ministers are expected to come tuned and sensitive to
          the eternal. They are responsible to set the tone for worship, to create
          a spiritual atmosphere that turns the congregation’s attention toward God
          by reading Scripture, selecting worship songs, leading congregational prayer,
          and preaching the Word. This is particularly true of churches that lack
          the luxury of adequate staff to distinguish these roles.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH5.INTRO.P.1
      - text: Worship cannot be forced, but it can and must be encouraged. Although
          the Holy Spirit’s presence cannot be manufactured, worshippers must be taught
          to recognize His nearness and accommodate His manifestations. This is the
          true purpose of liturgy. Liturgy in itself is not worship, but it prepares
          the congregation to worship. True worship occurs only as we “see” God. It
          is an act of our will—“a sacrifice of praise” (Hebrews 13:15)—that sensitizes
          us to God’s immanence.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH5.INTRO.P.2
      - text: Pastors can encourage people to be more sensitive to God’s presence,
          but the people themselves must choose to be active participants. To illustrate,
          a friend told me of a time he boarded a small airplane and sat directly
          behind a mother and her small son who was about two to three years old.
          Fascinated by the unfamiliar surroundings, the boy’s attention was focused
          on examining the seat belts and reaching for briefcases and other eye-catching
          carry-ons. The young mother certainly had her hands full. To complicate
          matters, she was trying to persuade the boy to wave good-bye to his daddy.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH5.INTRO.P.3
      - text: ''
        kind: image
        src: BMIN381ENE04-90_04.26.01-web-resources/image/Chapter_05_Boy_on_plane.jpg
        alt: ''
        caption: 'Figure 5.1: Direct their focus.'
        UID: MIN381.CH5.INTRO.IMG.1
      - text: First she asked; then she tried coaxing; and finally, she ordered him,
          all to no avail. She could not divert her son’s attention from the new,
          exciting world inside the plane. Having exhausted all forms of persuasion,
          the mother resorted to gentle force. Wrapping one arm around the boy’s waist,
          she grasped his wrist and turned him toward the window, awkwardly waving
          good-bye with his stiff arm. Yet the boy resisted, squirming and twisting
          until he broke free. With renewed determination, the mother again took hold
          of him, pressed his face close to the plane’s small window and forced his
          reluctant arm to wave.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH5.INTRO.P.5
      - text: Then, suddenly, everything about the boy’s manner changed. He caught
          sight of something. Pressing his face against the window, he cried excitedly,
          “Daddy! I see Daddy!” Now he was waving both chubby arms eagerly, almost
          frantically.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH5.INTRO.P.6
      - text: 'Like the boy’s mother, pastors direct their congregations in acts of
          worship designed to wrestle their attention away from the distractions of
          the world. In effect, pastors press the people’s faces against the window
          of eternity. At first, the people do not “see” anything and merely go through
          the motions of worship. Then, suddenly, they catch sight of God, and their
          mechanical motions transform into reality, into true worship. Now God’s
          presence is undeniable, and without further prompting, their hearts respond
          of their own accord, crying: “‘ Abba , Father.’ [For] the Spirit himself
          testifies with our spirit that we are God’s children” (Romans 8:15–16).'
        kind: prose
        cls: IST_Body-Indent
        md: 'Like the boy’s mother, pastors direct their congregations in acts of
          worship designed to wrestle their attention away from the distractions of
          the world. In effect, pastors press the people’s faces against the window
          of eternity. At first, the people do not “see” anything and merely go through
          the motions of worship. Then, suddenly, they catch sight of God, and their
          mechanical motions transform into reality, into true worship. Now God’s
          presence is undeniable, and without further prompting, their hearts respond
          of their own accord, crying: “‘*Abba*, Father.’ \[For\] the Spirit himself
          testifies with our spirit that we are God’s children” (Romans 8:15–16).'
        UID: MIN381.CH5.INTRO.P.7
