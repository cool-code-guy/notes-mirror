        table: 7
        row: 1
        col: 2
        UID: MIN381.CH12.INTRO.P.9
      - text: Senior Adult Pastor
        kind: list
        cls: IST_Body-Bullet-1
        table: 7
        row: 1
        col: 2
        UID: MIN381.CH12.INTRO.P.10
      - text: Young Adults or Singles Pastor
        kind: list
        cls: IST_Body-Bullet-1
        table: 7
        row: 1
        col: 2
        UID: MIN381.CH12.INTRO.P.11
      - text: Fine Arts Pastor
        kind: list
        cls: IST_Body-Bullet-1
        table: 7
        row: 1
        col: 2
        UID: MIN381.CH12.INTRO.P.12
      - text: Media Pastor
        kind: list
        cls: IST_Body-Bullet-1
        table: 7
        row: 1
        col: 2
        UID: MIN381.CH12.INTRO.P.13
      - text: The purpose of the pastoral staff is not to relieve the laity of their
          ministry but to more effectively equip them for it (Ephesians 4:12). The
          staff accomplishes this through training, pastoral oversight, preaching
          or teaching, and church administration.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH12.INTRO.P.14
      - text: Because few pastors inherit a large church with pastoral staff already
          in place, the challenge for most is how to build an effective staff. How
          do pastors know when to add staff to the church? Which positions should
          they fill first?
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH12.INTRO.P.15
      - text: Some pastors believe in “staffing for growth,” or adding staff before
          the congregation’s actual size mandates it. In their minds, they can facilitate
          growth by filling key positions. Their challenge is to fund the position
          while waiting for the expected increase in attendance and giving.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH12.INTRO.P.16
      - text: Other pastors add more staff only when the congregation’s size makes
          it necessary. This minimizes the financial burden on the church, but it
          often means the current staff is overworked. Consequently, they have little
          or no time for developing vision or adding new ministries.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH12.INTRO.P.17
      - text: Whatever strategy you choose, you will have to decide the first position
          to fill and the best candidate to fill it. Once the staff is in place, you
          will need to exercise a leadership style that develops team spirit and facilitates
          the personal growth and ministry of each individual staff member.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH12.INTRO.P.18
