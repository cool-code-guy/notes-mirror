    - last_modified: '2026-05-28'
      title: 2 - The Devotional Life of a Pastor
      print_page: 35
      intro_body:
      - text: 'Effective ministry flows from a living relationship with the Lord.
          For that reason, it is absolutely critical that every pastor maintain a
          regular devotional life. A pastor’s devotional life differs from their prayer
          and study in the normal course of pastoral duties in one key way: pastoral
          prayer and study are primarily vocational, focusing on ministry issues.
          A pastor’s devotional life, on the other hand, focuses on matters of the
          heart, addressing the pastor’s personal walk with God. Both of these are
          vital to effective ministry. Minimizing either one does a disservice to
          the pastor and those the pastor serves.'
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH2.INTRO.P.1
      - text: 'The first step in developing a meaningful devotional life is finding
          a good model. Any number of godly individuals could fill this role, but
          none is more qualified than Jesus himself. Both the purity of His personal
          life and the power of His ministry flowed from His relationship with the
          Father. The quality of that relationship with God the Father resulted from
          Jesus’ spiritual disciplines , what we refer to as our devotional life.
          When Jesus lived on earth, He voluntarily laid aside the advantages of His
          divine nature (Philippians 2:6–8). He limited himself to the resources available
          to us, making himself as dependent on God as we are. Peter confirmed this
          in his sermon at Cornelius’s home when he said, “God anointed Jesus of Nazareth
          with the Holy Spirit and power, and . . . he went around doing good and
          healing all who were under the power of the devil, because God was with
          him” (Acts 10:38). Although one’s devotional life has many dimensions, in
          this chapter we will limit our study to the three most important spiritual
          disciplines for believers: prayer, study, and fasting.'
        kind: prose
        cls: IST_Body-Indent
        md: 'The first step in developing a meaningful devotional life is finding
          a good model. Any number of godly individuals could fill this role, but
          none is more qualified than Jesus himself. Both the purity of His personal
          life and the power of His ministry flowed from His relationship with the
          Father. The quality of that relationship with God the Father resulted from
          Jesus’ **spiritual disciplines**, what we refer to as our devotional life.
          When Jesus lived on earth, He voluntarily laid aside the advantages of His
          divine nature (Philippians 2:6–8). He limited himself to the resources available
          to us, making himself as dependent on God as we are. Peter confirmed this
          in his sermon at Cornelius’s home when he said, “God anointed Jesus of Nazareth
          with the Holy Spirit and power, and . . . he went around doing good and
          healing all who were under the power of the devil, because God was with
          him” (Acts 10:38). Although one’s devotional life has many dimensions, in
          this chapter we will limit our study to the three most important spiritual
          disciplines for believers: prayer, study, and fasting.'
        UID: MIN381.CH2.INTRO.P.2
