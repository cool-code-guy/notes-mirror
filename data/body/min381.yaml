    chapters:
    - last_modified: '2026-05-28'
      title: 1 - The Considerations of a Pastor
      print_page: 17
      intro_body:
      - text: 'The ministry is not a career you choose but a divine calling to which
          you surrender. The call to ministry may come in any number of ways: through
          a vision or dream, a sermon, or the inner witness of the Holy Spirit. It
          may come instantaneously, or it may be a conviction that develops over a
          period of months or even years. No one should enter the ministry unless
          they are absolutely convinced that God has called them. If you have not
          been called, nothing else matters—not talent, commitment, or even the expectations
          of others. “No one takes this honor upon himself; he must be called by God”
          (Hebrews 5:4).'
        kind: prose
        cls: IST_Body-Indent
        md: 'The ministry is not a career you choose but a divine calling to which
          you surrender. The call to ministry may come in any number of ways: through
          a **vision** or dream, a sermon, or the inner witness of the Holy Spirit.
          It may come instantaneously, or it may be a conviction that develops over
          a period of months or even years. No one should enter the ministry unless
          they are absolutely convinced that God has called them. If you have not
          been called, nothing else matters—not talent, commitment, or even the expectations
          of others. “No one takes this honor upon himself; he must be called by God”
          (Hebrews 5:4).'
        UID: MIN381.CH1.INTRO.P.1
      - text: The call to ministry must be distinguished from both the call to salvation
          (Titus 2:11) and the call to service (Romans 12:6–8; Ephesians 4:12). While
          God calls everyone to salvation (2 Peter 3:9) and every believer to Christian
          service, only those chosen for special service receive the call to be apostles,
          prophets, evangelists, pastors, or teachers (Ephesians 4:11). God sets those
          who receive this calling apart to prepare “God’s people for works of service,
          so that the body of Christ may be built up until we all reach unity in the
          faith and in the knowledge of the Son of God and become mature, attaining
          to the whole measure of the fullness of Christ” (Ephesians 4:12–13).
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH1.INTRO.P.2
