    - last_modified: '2026-06-09'
      title: 3 - The Personal Life of a Pastor
      print_page: 55
      intro_body:
      - text: 'Ministry is almost always public to some degree. Still, the quality
          of ministry is shaped in large part by pastors’ personal lives. An individual’s
          personal life encompasses their core relationships, including relationships
          with God, family members, and friends. Paul addresses these issues in 1
          Timothy 3:2–7, where he lists some qualifications for ministers:'
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH3.INTRO.P.1
      - text: Now the overseer must be above reproach, the husband of but one wife,
          temperate, self-controlled, respectable, hospitable, able to teach, not
          given to drunkenness, not violent but gentle, not quarrelsome, not a lover
          of money. He must manage his own family well and see that his children obey
          him with proper respect. (If anyone does not know how to manage his own
          family, how can he take care of God’s church?) He must not be a recent convert,
          or he may become conceited and fall under the same judgment as the devil.
          He must also have a good reputation with outsiders, so that he will not
          fall into disgrace and into the devil’s trap.
        kind: quote
        cls: IST_Body-Block-Quote
        UID: MIN381.CH3.INTRO.P.2
      - text: Today, many women are answering the call to ministry. They face not
          only all the challenges of confronting people who are opposed to their place
          in the ministry but also a host of other problems unique to their gender.
          One of their greatest challenges is finding a place to serve. Although the
          Assemblies of God has a long history of ordaining women, many congregations
          remain skeptical toward women who serve in the role of pastor. Women who
          are able to find a position must often balance the demands of both ministry
          and family.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH3.INTRO.P.3
      - text: This chapter will address issues surrounding the personal lives of both
          men and women, whether married or single, in ministry.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH3.INTRO.P.4
