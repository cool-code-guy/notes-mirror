    - last_modified: '2026-05-28'
      title: 12 - Pastor–Staff Relationships
      print_page: 213
      intro_body:
      - text: 'Although committed volunteers will always do much of the ministry,
          there is a growing need for effective pastoral staff . As a congregation
          increases in its size and scope of ministry, it requires a competent pastoral
          staff to provide oversight and direction. Staff positions common in larger
          congregations include:'
        kind: prose
        cls: IST_Body-Indent
        md: 'Although committed volunteers will always do much of the ministry, there
          is a growing need for effective pastoral staff. As a congregation increases
          in its size and scope of ministry, it requires a competent pastoral staff
          to provide oversight and direction. Staff positions common in larger congregations
          include:'
        UID: MIN381.CH12.INTRO.P.1
      - text: Assistant or Associate Pastor
        kind: list
