    - last_modified: '2026-05-28'
      title: 7 - The Pastor as a Leader
      print_page: 137
      intro_body:
      - text: Other than obvious character defects or moral failure, nothing limits
          the effectiveness of pastors’ ministry more than lack of leadership. Some
          of the most gifted preachers serve struggling congregations, while some
          of the most dynamic churches are led by pastors who are ordinary preachers
          at best. All other factors being equal, this suggests that leadership is
          more important than preaching when it comes to growing a thriving congregation.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH7.INTRO.P.1
      - text: To be effective leaders, pastors must follow the Holy Spirit’s leading.
          They must know what God wants for their particular congregation. Like Jesus,
          pastors should do only what they see the Father doing (John 5:19); in other
          words, “seeing” comes before “doing.” Only when pastors see God’s plan for
          their congregation can they lead the people in the way they should go.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH7.INTRO.P.2
      - text: Once pastors receive a vision, they are responsible to communicate it
          to the body. Habakkuk 2:2 says, “Write down the revelation and make it plain
          on tablets so that a herald may run with it.” Using both the pulpit and
          one-on-one meetings with lay leaders , wise pastors clearly define their
          goals and objectives, enabling their congregations to see and feel what
          the pastors themselves are seeing and feeling. In this way, the pastor’s
          vision becomes the people’s as well.
        kind: prose
        cls: IST_Body-Indent
        md: Once pastors receive a vision, they are responsible to communicate it
          to the body. Habakkuk 2:2 says, “Write down the revelation and make it plain
          on tablets so that a herald may run with it.” Using both the pulpit and
          one-on-one meetings with **lay leaders**, wise pastors clearly define their
          goals and objectives, enabling their congregations to see and feel what
          the pastors themselves are seeing and feeling. In this way, the pastor’s
          vision becomes the people’s as well.
        UID: MIN381.CH7.INTRO.P.3
      - text: Finally, wise pastors use their gifts and influence to motivate the
          congregation to invest their resources and thus see the vision become reality.
          In this, as in all areas, pastors should lead by example. Their leadership
          will encourage others to follow the pastors’ example as they follow the
          example of Christ (1 Corinthians 11:1).
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH7.INTRO.P.4
