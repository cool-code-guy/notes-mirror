    - last_modified: '2026-05-28'
      title: 6 - The Ministry of Pastoral Care
      print_page: 119
      intro_body:
      - text: 'Pastoral care refers to the ministry a pastor gives to people in crisis.
          While most often related to sickness or death, such crisis includes situations
          of all types: job loss, family conflict, divorce, pregnancy out of wedlock,
          illegal activity, drug or alcohol addictions, abuse, depression, and so
          forth. Virtually every crisis carries with it a sense of loss followed by
          grief. Because of this, the fundamentals of pastoral care—presence, empathy,
          and caregiving—remain the same whatever the difficulty or trial.'
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH6.INTRO.P.1
