    - last_modified: '2026-05-28'
      title: '11 - Working with Lay Leaders: Elders, Deacons, and Trustees'
      print_page: 201
      intro_body:
      - text: What makes a pastor effective? The answers are many and varied—spiritual
          passion, godly character, vision, leadership ability, a genuine love for
          people, a heart to serve, administrative ability, and preaching or teaching
          skills. However, as important as all of these characteristics are, they
          can be rendered largely ineffective if pastors cannot work with the lay
          leaders (generally known as elders , deacons , trustees, and so forth) in
          the congregation.
        kind: prose
        cls: IST_Body-Indent
        md: What makes a pastor effective? The answers are many and varied—spiritual
          passion, godly character, vision, leadership ability, a genuine love for
          people, a heart to serve, administrative ability, and preaching or teaching
          skills. However, as important as all of these characteristics are, they
          can be rendered largely ineffective if pastors cannot work with the **lay
          leaders** (generally known as **elders**, **deacons**, trustees, and so
          forth) in the congregation.
        UID: MIN381.CH11.INTRO.P.1
      - text: Tension among leaders can develop from the poor attitude or character
          of some pastors. They may be insecure and feel threatened by others with
          strong leadership skills. Or they may be quarrelsome, taking offense when
          anyone disagrees with them. Some pastors are overbearing and dictatorial,
          demanding that everyone do things their way; and some are arrogant, refusing
          to listen to counsel or advice. The ministry of any such pastors will flounder
          regardless of their ministry skills.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH11.INTRO.P.2
      - text: However, frequently the problem does not originate with the pastor.
          Many times, pastors inherit a group of lay leaders who are not qualified
          to serve. They may be carnal, lacking spiritual insight and wisdom. They
          may be emotionally wounded, rendering it impossible for them to be objective,
          or they may be good people who are simply misguided, misunderstanding their
          role. Whatever the case, the church’s ministry will be hindered until these
          difficulties can be worked out.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH11.INTRO.P.3
