    - last_modified: '2026-05-28'
      title: 13 - The Rhythm of Life in Ministry
      print_page: 229
      intro_body:
      - text: Once when a Southern Baptist denominational executive was on the Midwestern
          Seminary campus in the late 1990s, he asserted that statistics show that
          for every twenty men who enter the ministry, by the time those men reach
          age sixty-five, only one will still be in the ministry. Despite all the
          commitment with which they began the race, despite all the investment of
          time and money to prepare, despite the years spent in service, despite the
          cost of retooling and redirecting their lives, nearly all will leave the
          ministry. Some will opt out for health reasons. Some will wash out in their
          private lives. Some will bow out, realizing they misread the call of God.
          Some will bail out because the stress is so great. Some will be forced out
          by their churches. Some will walk out from sheer frustration and a sense
          of failure. And if you haven’t given serious thought to leaving the ministry,
          you haven’t been in it very long. (Whitney 2000)
        kind: quote
        cls: IST_Body-Block-Quote
        UID: MIN381.CH13.INTRO.P.1
      - text: One of the leading causes of ministerial dropout is burnout . No one
          is at greater risk for burnout than conscientious ministers who love their
          work. With single-minded devotion, they passionately pursue their calling.
          At first, nothing seems to bother them, not the long hours or the missed
          family times or the canceled vacations. But over time, everything begins
          to take its toll. By mid-life, these pastors are often worn out. When such
          a cycle is well established, they may be tempted to resent the people they
          serve and dread the ministry they have committed to.
        kind: prose
        cls: IST_Body-Indent
        md: One of the leading causes of ministerial dropout is **burnout**. No one
          is at greater risk for burnout than conscientious ministers who love their
          work. With single-minded devotion, they passionately pursue their calling.
          At first, nothing seems to bother them, not the long hours or the missed
          family times or the canceled vacations. But over time, everything begins
          to take its toll. By mid-life, these pastors are often worn out. When such
          a cycle is well established, they may be tempted to resent the people they
          serve and dread the ministry they have committed to.
        UID: MIN381.CH13.INTRO.P.2
      - text: 'This is the dilemma: The people who consistently find fulfillment in
          their ministry are those who sincerely love what they do. Yet these same
          people are at greatest risk of burning out. The challenge, then, is to find
          a way to enjoy your ministry without allowing it to overtake your life.
          The key is to balance the rhythm of ministry with the rhythms of rest and
          worship. Perhaps the first step is learning to live a God-centered life
          rather than a need-centered one.'
        kind: prose
        cls: IST_Body-Indent
        md: 'This is the dilemma: The people who consistently find fulfillment in
          their ministry are those who sincerely love what they do. Yet these same
          people are at greatest risk of burning out. The challenge, then, is to find
          a way to enjoy your ministry without allowing it to overtake your life.
          The key is to balance the **rhythm** of ministry with the rhythms of rest
          and worship. Perhaps the first step is learning to live a God-centered life
          rather than a need-centered one.'
        UID: MIN381.CH13.INTRO.P.3
      - text: 'Note: Much of the material in this chapter is taken from Living in
          Harmony: Moving to a Better Place in Your Life by Richard Exley (New Leaf
          Press, 2003).'
        kind: prose
        cls: IST_Body-Indent
        md: 'Note: Much of the material in this chapter is taken from *Living in Harmony:
          Moving to a Better Place in Your Life* by Richard Exley (New Leaf Press,
          2003).'
        UID: MIN381.CH13.INTRO.P.4
