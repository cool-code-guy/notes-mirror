      title: 9 - Developing Small Groups
      print_page: 165
      intro_body:
      - text: Small groups wear many labels in the church. Some churches call them
          cell groups, spiritual growth groups, support groups, home fellowships,
          or just small groups. No matter how we identify them, small groups represent
          a group of believers (usually about eight to sixteen in number) who meet
          for the purpose of New Testament-type fellowship and personal, spiritual
          growth.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH9.INTRO.P.1
      - text: ''
        kind: image
        src: BMIN381ENE04-90_04.26.01-web-resources/image/Chapter_09_Groups.jpg
        alt: ''
        caption: 'Figure 9.1: Small groups provide fellowship and spiritual growth.'
        UID: MIN381.CH9.INTRO.IMG.1
      - text: 'Although a significant number of highly effective churches utilize
          small groups, many pastors still hesitate to embrace them. Their reasons
          vary but generally fall into two or three categories:'
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH9.INTRO.P.3
      - text: 1. They do not recognize the need for small groups.
        kind: hang
        cls: IST_Body-Hang-2
        UID: MIN381.CH9.INTRO.P.4
      - text: 2. The models they are familiar with would not work in their congregation.
        kind: hang
        cls: IST_Body-Hang-2
        UID: MIN381.CH9.INTRO.P.5
      - text: 3. They feel they lack the expertise to begin a small group ministry.
        kind: hang
        cls: IST_Body-Hang-2
        UID: MIN381.CH9.INTRO.P.6
      - text: This chapter will address each of these issues.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH9.INTRO.P.7
      - text: The size of the group is often eight to sixteen. If a group is too small,
          people may feel they are under pressure. If a group is too big, there is
          less fellowship. The purpose of those in a small group is to enter into
          a spiritual covenant—like believers did in the New Testament—so they can
          have fellowship and grow spiritually.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH9.INTRO.P.8
      lessons:
