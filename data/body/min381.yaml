        title: Administering the Ordinances
        subobjectives:
          10.2.1:
            last_modified: '2026-05-28'
            text: Summarize scriptural teachings regarding water baptism.
            glossary:
            - term: closed Communion
              definition: celebration of the Lord’s Supper in which only members of
