    - last_modified: '2026-05-28'
      title: 10 - Special Services of the Church
      print_page: 179
      intro_body:
      - text: Pastors have the opportunity to share in many of life’s most significant
          experiences. Among them are weddings, funerals, baby dedications, water
          baptism , and Holy Communion. These events are momentous in the lives of
          believers. Because of their character, these services are sometimes described
          as sacraments —literally, “sacred things” or “oaths consecrated by a sacred
          rite”; they are also referred to as ordinances because they are ceremonies
          “ordained by the Lord himself” (Pearlman 1950, 25).
        kind: prose
        cls: IST_Body-Indent
        md: Pastors have the opportunity to share in many of life’s most significant
          experiences. Among them are weddings, funerals, baby dedications, **water
          baptism**, and Holy Communion. These events are momentous in the lives of
          believers. Because of their character, these services are sometimes described
          as *sacraments*—literally, “sacred things” or “oaths consecrated by a sacred
          rite”; they are also referred to as **ordinances** because they are ceremonies
          “ordained by the Lord himself” (Pearlman 1950, 25).
        UID: MIN381.CH10.INTRO.P.1
      - text: As pastors, we have the responsibility to conduct these special services
          in ways that both honor the Lord and edify the worshippers. They must never
          become common or ordinary to us. Each one is an act of worship and should
          be approached and conducted accordingly.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH10.INTRO.P.2
      - text: 'To assist them in the discharge of these duties, pastors should have
          a minister’s service book, which contains ceremonies and orders of service
          for almost every occasion, including weddings, baptisms, child dedication,
          installation of officers and deacons, Communion , and funerals. While you
          will likely modify each order of service to meet the needs of your individual
          situation, the service book provides a helpful overview. Some of the most
          used volumes are these:'
        kind: prose
        cls: IST_Body-Indent
        md: 'To assist them in the discharge of these duties, pastors should have
          a minister’s service book, which contains ceremonies and orders of service
          for almost every occasion, including weddings, baptisms, child dedication,
          installation of officers and deacons, **Communion**, and funerals. While
          you will likely modify each order of service to meet the needs of your individual
          situation, the service book provides a helpful overview. Some of the most
          used volumes are these:'
        UID: MIN381.CH10.INTRO.P.3
      - text: 'Christian Minister’s Manual, by Guthrie Veech (Cincinnati, OH: Standard
          Publishing, 2012).'
        kind: list
        cls: IST_Body-Bullet-2
        md: '*Christian Minister’s Manual,* by Guthrie Veech (Cincinnati, OH: Standard
          Publishing, 2012).'
        UID: MIN381.CH10.INTRO.P.4
      - text: 'Minister’s Manual , Volumes 1–3, compiled and edited by William E.
          Pickthorn (Springfield, MO: Gospel Publishing House).'
        kind: list
        cls: IST_Body-Bullet-2
        md: '*Minister’s Manual*, Volumes 1–3, compiled and edited by William E. Pickthorn
          (Springfield, MO: Gospel Publishing House).'
        UID: MIN381.CH10.INTRO.P.5
      - text: 'The Star Book for Ministers, 2nd rev. ed., by Edward T. Hiscox (Valley
          Forge, PA: Judson Press, 2014).'
        kind: list
        cls: IST_Body-Bullet-2
        md: '*The Star Book for Ministers,* 2nd rev. ed., by Edward T. Hiscox (Valley
          Forge, PA: Judson Press, 2014).'
        UID: MIN381.CH10.INTRO.P.6
      - text: However, there is more to the success of a special service than the
          instructions, samples, and prayers. What happens before these services is
          paramount to their success.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH10.INTRO.P.7
