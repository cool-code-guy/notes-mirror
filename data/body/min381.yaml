      title: 8 - The Pastor as an Equipper
      print_page: 153
      intro_body:
      - text: In many congregations, pastors are the only ones who are paid for serving.
          Everyone else who serves in any capacity of ministry is a volunteer. Even
          in congregations that are able to pay the pastoral staff and support personnel,
          the vast majority of ministry is still accomplished by unpaid volunteers.
          History suggests that no matter how large a local church becomes, it still
          depends on volunteers to do much of the ministry to meet all of the congregation’s
          needs.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH8.INTRO.P.1
      - text: Of greater concern is the reality that pastors are often the only persons
          with any training to prepare for the work of the ministry. Volunteers are
          often recruited on the basis of need rather than competence. As a result,
          churches are frequently staffed by well-meaning but unqualified people or,
          worse yet, talented but uncommitted people.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH8.INTRO.P.2
      - text: Clearly, it is unrealistic to expect volunteers to go to Bible school
          to receive training. Nearly all of them have families and other responsibilities
          such as finances and their occupations. What is the solution then?
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH8.INTRO.P.3
      - text: To resolve this issue, pastors may need to rethink the way they minister.
          Too many pastors have seen themselves as spiritual experts and have been
          reluctant to share their skills or responsibilities. To prepare our congregations
          for ministry, however, we must begin to think of ourselves as equippers.
          We must become spiritual leaders who impart our knowledge and expertise
          to others so they can share the work of the ministry.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH8.INTRO.P.4
      - text: 'Although this may sound like a new idea, it is not. Paul said:'
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH8.INTRO.P.5
      - text: It was he [Jesus] who gave some to be apostles, some to be prophets,
          some to be evangelists, and some to be pastors and teachers, to prepare
          God’s people for works of service, so that the body of Christ may be built
          up until we all reach unity in the faith and in the knowledge of the Son
          of God and become mature, attaining to the whole measure of the fullness
          of Christ. Then we will no longer be infants, tossed back and forth by the
          waves, and blown here and there by every wind of teaching and by the cunning
          and craftiness of men in their deceitful scheming. Instead, speaking the
          truth in love, we will in all things grow up into him who is the Head, that
          is, Christ. From him the whole body, joined and held together by every supporting
          ligament, grows and builds itself up in love, as each part does its work.
          (Ephesians 4:11–16)
        kind: quote
        cls: IST_Body-Block-Quote
        UID: MIN381.CH8.INTRO.P.6
      - text: According to this passage, Jesus gave the fivefold ministry gifts to
          the church “to prepare God’s people for works of service, so that the body
          of Christ may be built up” (4:12). In Paul’s mind, one of the pastor’s primary
          responsibilities is to train and equip the laity to do the work of the ministry.
          Therefore, the question is not whether pastors should equip their congregations
          for ministry, but how .
        kind: prose
        cls: IST_Body-Indent
        md: According to this passage, Jesus gave the fivefold ministry gifts to the
          church “to prepare God’s people for works of service, so that the body of
          Christ may be built up” (4:12). In Paul’s mind, one of the pastor’s primary
          responsibilities is to train and equip the laity to do the work of the ministry.
          Therefore, the question is not *whether* pastors should equip their congregations
          for ministry, but *how*.
        UID: MIN381.CH8.INTRO.P.7
