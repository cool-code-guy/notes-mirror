    - last_modified: '2026-05-28'
      title: 4 - The Ministry of Preaching and Teaching
      print_page: 85
      intro_body:
      - text: 'The pastor has many roles:'
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH4.INTRO.P.1
      - text: Administrator
        kind: list
        cls: IST_Body-Bullet-0
        table: 5
        row: 1
        col: 1
        UID: MIN381.CH4.INTRO.P.2
      - text: Counselor
        kind: list
        cls: IST_Body-Bullet-0
        table: 5
        row: 1
        col: 2
        UID: MIN381.CH4.INTRO.P.3
      - text: Leader
        kind: list
        cls: IST_Body-Bullet-0
        table: 5
        row: 2
        col: 1
        UID: MIN381.CH4.INTRO.P.4
      - text: Mentor
        kind: list
        cls: IST_Body-Bullet-0
        table: 5
        row: 2
        col: 2
        UID: MIN381.CH4.INTRO.P.5
      - text: Visionary
        kind: list
        cls: IST_Body-Bullet-0
        table: 5
        row: 3
        col: 1
        UID: MIN381.CH4.INTRO.P.6
      - text: Teacher
        kind: list
        cls: IST_Body-Bullet-0
        table: 5
        row: 3
        col: 2
        UID: MIN381.CH4.INTRO.P.7
      - text: Caregiver
        kind: list
        cls: IST_Body-Bullet-0
        table: 5
        row: 4
        col: 1
        UID: MIN381.CH4.INTRO.P.8
      - text: Preacher
        kind: list
        cls: IST_Body-Bullet-0
        table: 5
        row: 4
        col: 2
        UID: MIN381.CH4.INTRO.P.9
      - text: 'Although all of these are important to the ministry of the church,
          none is more important than proclaiming God’s eternal Word. The apostles
          affirmed this when they declared:'
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH4.INTRO.P.10
      - text: It would not be right for us to neglect the ministry of the word of
          God in order to wait on tables. Brothers, choose seven men from among you
          who are known to be full of the Spirit and wisdom. We will turn this responsibility
          over to them and will give our attention to prayer and the ministry of the
          word.” . . . So the word of God spread. The number of disciples in Jerusalem
          increased rapidly, and a large number of priests became obedient to the
          faith. (Acts 6:2–4, 7)
        kind: quote
        cls: IST_Body-Block-Quote
        UID: MIN381.CH4.INTRO.P.11
      - text: The apostles did not arbitrarily decide to make prayer and teaching
          their first priority. Rather, they were responding to an internal crisis
          in the infant church. “The Grecian Jews among them complained against the
          Hebraic Jews because their widows were being overlooked in the daily distribution
          of food” (6:1). The resulting antagonism threatened to splinter the fellowship.
          Something had to be done and fast.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH4.INTRO.P.12
      - text: No one would have blamed the apostles if they had given their attention
          to this pressing need. After all, the Bible does teach us to care for widows
          and the needy but not in place of prayer and the ministry of the Word. Thus,
          pastors need to appoint godly men and women to minister in these areas so
          they themselves can remain focused on preaching God’s Word.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN381.CH4.INTRO.P.13
