              paragraph: MIN381.10.2.1.P.28
              page: 191
              UID: MIN381.10.2.1.G.2
            - term: ordinance
              definition: a religious rite or ceremony; a sacred practice of the church
              paragraph: MIN381.10.2.1.P.22
              page: 189
              UID: MIN381.10.2.1.G.3
            - term: water baptism
              definition: an ordinance of the church in which a believer publicly
                and outwardly shows an inward change; a rite symbolizing that a believer
