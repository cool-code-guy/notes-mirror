    glossary:
    - term: Artificial intelligence (AI)
      definition: Computer systems that perform tasks typically requiring human thinking,
        such as learning, problem-solving, or creating content.
      chapter: 2
    - term: Clergy-penitent privilege
      definition: Confidential communications between a minister and an individual
        seeking spiritual counsel or confession that are legally protected from disclosure
        in most circumstances—similar to attorney-client privilege and upheld to preserve
        the sanctity of spiritual guidance.
      chapter: 10
      paragraph: MIN183.10.2.1.P.10
      page: 184
    - term: Deontological
      definition: An approach to ethics that focuses on doing what is right based
        on rules or duties, regardless of the outcome.
      chapter: 1
      paragraph: MIN183.1.1.1.P.1
      page: 21
    - term: Entitlement
      definition: The belief that one deserves special treatment or benefits without
        earning them. In ministry, this attitude can lead to selfishness or abuse
        of authority.
      chapter: 4
      paragraph: MIN183.4.5.1.P.5
      page: 68
    - term: Ethics
      definition: The study and practice of right and wrong behavior. In ministry,
        ethics involves living with integrity and making choices that reflect biblical
        values.
      chapter: 1
      paragraph: MIN183.1.1.1.P.1
      page: 21
    - term: Fishbowl
      definition: A term that describes how people in ministry—and their families—often
        live under public observation, with little privacy.
      chapter: 7
      paragraph: MIN183.7.1.1.P.28
      page: 120
    - term: Fauxnerability
      definition: A mix of the words “faux” (fake) and “vulnerability.” It refers
        to sharing emotional-sounding stories to gain sympathy or admiration, without
        being truly open or accountable.
      chapter: 4
      paragraph: MIN183.4.5.1.P.11
      page: 69
    - term: Gender confusion
      definition: A term used to describe the experience of conflict between one’s
        inner sense of self and one’s biological sex. This experience of conflict
        typically involves a desire to be, or a false belief that one should be, a
        gender incongruent with one’s God-given sex.
      chapter: 5
      paragraph: MIN183.5.5.1.P.4
      page: 91
    - term: Healthy boundaries
      definition: Clear personal limits that protect emotional, physical, and spiritual
        well-being. Boundaries help people in ministry stay balanced, avoid burnout,
        and maintain integrity.
      chapter: 3
      paragraph: MIN183.3.3.1.P.14
    - term: Incarnational
      definition: A way of ministering that follows the example of Jesus who became
        human to live among us. It emphasizes presence, humility, and care in relationships.
      chapter: 1
      paragraph: MIN183.1.3.1.P.5
    - term: Narcissism
      definition: A pattern of self-centered thinking and behavior, often involving
        a lack of empathy and a desire for admiration. In leadership, narcissism can
        damage trust and relationships.
      chapter: 4
      paragraph: MIN183.4.5.1.P.1
      page: 68
    - term: Porneia
      definition: A Greek word used in the New Testament to refer to sexual immorality.
        It includes any sexual activity outside of the biblical standard of marriage
        between one man and one woman.
      chapter: 5
      paragraph: MIN183.5.5.1.P.10
      page: 92
    - term: Privileged communications
      definition: Private conversations, such as those between a minister and someone
        receiving counseling, that are legally and ethically protected from being
        shared without permission—except in certain legal situations.
      chapter: 10
    - term: Teleological
      definition: An approach to ethics that focuses on the outcome or results of
        an action. It asks, “What decision will lead to the best result?”
      chapter: 1
      paragraph: MIN183.1.1.1.P.1
      page: 21
    - term: Transgender
      definition: A term often used to describe someone who chooses to reject his/her
        biological sex (determined by God at conception) and attempts to identify
        and live as something other than that sex. This rejection may involve attempts
        to alter one’s appearance – by dress, surgery, hormone treatment or otherwise
        – and/or attempts to alter identification – by name-change, pronoun-usage
        inconsistent with sex, or otherwise. Importantly, all these efforts are ultimately
        incapable of achieving a real change of one’s sex, which is an immutable characteristic
        of God’s design.
      chapter: 5
      paragraph: MIN183.5.5.1.P.33
      page: 95
    - term: Unwelcome behavior
      definition: Any action—verbal, physical, or emotional—that makes someone uncomfortable
        and is not invited or appropriate. In ministry, this includes respecting personal
        boundaries and avoiding harmful conduct.
      chapter: 5
      paragraph: MIN183.5.2.1.P.17
      page: 83
    - term: Voluntary Cooperative Fellowship
      definition: A term describing the Assemblies of God structure where ministers
        and churches choose to work together under shared beliefs and governance rather
        than under a top-down hierarchy.
      chapter: 9
      paragraph: MIN183.9.1.1.P.1
      page: 165
