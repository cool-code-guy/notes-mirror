    - last_modified: '2026-03-27'
      title: '1'
      print_page: 19
      lessons:
      - last_modified: '2026-03-27'
        title: A Basic Understanding of Ethical Systems
        subobjectives:
          1.1.1:
            last_modified: '2026-07-16'
            text: Define teleological and deontological ethics and explain how Christian
              ethics draws from both while being grounded in Scripture.
            glossary:
            - term: Deontological
              definition: An approach to ethics that focuses on doing what is right
                based on rules or duties, regardless of the outcome.
              paragraph: MIN183.1.1.1.P.1
              page: 21
              UID: MIN183.1.1.1.G.1
            - term: Ethics
              definition: The study and practice of right and wrong behavior. In ministry,
                ethics involves living with integrity and making choices that reflect
                biblical values.
              paragraph: MIN183.1.1.1.P.1
              page: 21
              UID: MIN183.1.1.1.G.2
            - term: Teleological
              definition: An approach to ethics that focuses on the outcome or results
                of an action. It asks, “What decision will lead to the best result?”
              paragraph: MIN183.1.1.1.P.1
              page: 21
              UID: MIN183.1.1.1.G.3
      - last_modified: '2026-03-27'
        title: The Biblical Foundation for Ministerial Ethics
        subobjectives:
          1.2.1:
            last_modified: '2026-03-27'
            text: Identify the biblical books that provide specific wisdom regarding
              ministerial ethics, particularly the Pastoral Epistles.
            glossary: []
      - last_modified: '2026-03-27'
        title: Guarding the Gospel Message
        subobjectives:
          1.3.1:
            last_modified: '2026-03-27'
            text: Explain Paul's instructions to Timothy about guarding the gospel
              and describe what it means for ministry to be incarnational.
            glossary:
            - term: Incarnational
              definition: A way of ministering that follows the example of Jesus who
                became human to live among us. It emphasizes presence, humility, and
                care in relationships.
              paragraph: MIN183.1.3.1.P.5
              UID: MIN183.1.3.1.G.1
      - last_modified: '2026-03-27'
        title: Avoiding Stumbling Blocks in Ministry
        subobjectives:
          1.4.1:
            last_modified: '2026-03-27'
