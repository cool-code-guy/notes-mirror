    course_objectives:
    - 1. Explain the biblical foundations for ministerial ethics.
    - 2. Describe the areas of a minister’s personal life that must be strengthened
      to ensure long-term ministry and avoid moral transgression.
    - 3. Identify common pitfalls of moral transgression and practical steps a minister
      can take to avoid them.
    - 4. Describe the principles involved in working with other ministers and churches
      in a healthy, courteous, and life-giving manner.
    - 5. Define the concept of Voluntary Cooperative Fellowship and the relationship
      a minister has with the Fellowship.
    - 6. Identify the healthy characteristics of both being married and being single
      in ministry.
    - 7. Describe the key values of raising children who love the Lord and His church.
    - 8. Describe ways a church or ministry can incorporate systems in the church
      to protect people and resources.
    - 9. Explain how to execute key ministry responsibilities in an ethical manner
      that builds the body of Christ.
    - 10. Identify how a twenty-first century minister can maintain proper boundaries
      in digital communications and social media.
    - 11. Describe a process for making ethical decisions.
