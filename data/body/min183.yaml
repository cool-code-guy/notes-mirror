      - last_modified: '2026-03-27'
        title: The Effect of Narcissism
        subobjectives:
          4.5.1:
            last_modified: '2026-03-27'
            text: Identify how insecurity and fauxnerability undermine authentic leadership.
            glossary:
            - term: Entitlement
              definition: The belief that one deserves special treatment or benefits
                without earning them. In ministry, this attitude can lead to selfishness
                or abuse of authority.
              paragraph: MIN183.4.5.1.P.5
              page: 68
              UID: MIN183.4.5.1.G.1
            - term: Fauxnerability
              definition: A mix of the words “faux” (fake) and “vulnerability.” It
                refers to sharing emotional-sounding stories to gain sympathy or admiration,
                without being truly open or accountable.
              paragraph: MIN183.4.5.1.P.11
              page: 69
              UID: MIN183.4.5.1.G.2
            - term: Narcissism
              definition: A pattern of self-centered thinking and behavior, often
                involving a lack of empathy and a desire for admiration. In leadership,
                narcissism can damage trust and relationships.
              paragraph: MIN183.4.5.1.P.1
              page: 68
              UID: MIN183.4.5.1.G.3
