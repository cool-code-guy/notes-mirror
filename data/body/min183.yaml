            glossary: []
      - last_modified: '2026-03-27'
        title: Resisting Sexual Temptation
        subobjectives:
          5.4.1:
            last_modified: '2026-03-27'
            text: Identify practical skills for recognizing and resisting sexual temptation,
              including awareness of personal vulnerabilities.
            glossary: []
      - last_modified: '2026-03-27'
        title: Biblical Sexuality
        subobjectives:
          5.5.1:
            last_modified: '2026-03-27'
            text: Explain the biblical foundation for human sexuality (Genesis 2:24)
              and describe how it informs a minister's ethical commitments.
            glossary:
            - term: Gender confusion
              definition: A term used to describe the experience of conflict between
                one’s inner sense of self and one’s biological sex. This experience
                of conflict typically involves a desire to be, or a false belief that
                one should be, a gender incongruent with one’s God-given sex.
              paragraph: MIN183.5.5.1.P.4
              page: 91
              UID: MIN183.5.5.1.G.1
            - term: Porneia
              definition: A Greek word used in the New Testament to refer to sexual
                immorality. It includes any sexual activity outside of the biblical
                standard of marriage between one man and one woman.
              paragraph: MIN183.5.5.1.P.10
              page: 92
              UID: MIN183.5.5.1.G.2
            - term: Transgender
              definition: A term often used to describe someone who chooses to reject
                his/her biological sex (determined by God at conception) and attempts
                to identify and live as something other than that sex. This rejection
                may involve attempts to alter one’s appearance – by dress, surgery,
                hormone treatment or otherwise – and/or attempts to alter identification
                – by name-change, pronoun-usage inconsistent with sex, or otherwise.
                Importantly, all these efforts are ultimately incapable of achieving
                a real change of one’s sex, which is an immutable characteristic of
                God’s design.
              paragraph: MIN183.5.5.1.P.33
              page: 95
              UID: MIN183.5.5.1.G.3
