        name: Joey Ellis
        role: author
    course_objectives:
    - 1. Explain the importance of an inspired and inerrant Bible as the basis for
      sound doctrine.
    - 2. Define the meaning of salvation, and describe how it restores a personal
      relationship with God.
    - 3. Explain to a sinner the steps to receiving God’s gift of salvation, using
      supporting Bible verses.
    - 4. Indicate why all believers who wish to be used by God in effective ministry
      to others need the baptism in the Holy Spirit.
    - 5. List and explain the nine gifts of the Spirit (1 Corinthians 12), and show
      how the Holy Spirit is not limited to working only through these gifts.
    - 6. Describe the many other gifts the Spirit bestows on Spirit-filled believers
      in addition to the traditional nine gifts.
    - 7. Explain from the Scriptures how the fruit of the Spirit along with the gifts
      of the Spirit mark a Spirit-filled life.
    - 8. Describe what the Holy Spirit can do in the personal life of the Spirit-filled
      believer, in addition to imparting power for anointed ministry.
    - 9. Summarize from biblical references possible reasons for physical suffering
      and illness, pointing out how healing is included in Jesus’ atonement for our
      sins.
    - 10. Explain to a person suffering physically how to trust God for healing and
      how to live in faith even after the healing comes.
    - 11. Write a summary chart of end-time events from the Rapture to the New Heavens
      and Earth.
    - 12. Identify reasons for our glorious anticipation of reigning with Christ in
      His eternal Kingdom.
    exam_files:
