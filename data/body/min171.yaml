    - last_modified: '2026-03-27'
      title: 3 - The Priesthood of All Believers
      print_page: 3
      lessons:
      - last_modified: '2026-03-27'
        title: The Paradigm of the Priesthood
        subobjectives:
          3.1.1:
            body:
            - p: 1
              text: In Ephesians, Paul wrote that a pastor’s responsibility is “the
                equipping of the saints for the work of ministry, for the edifying
                of the body of Christ” (Ephesians 4:12, NKJV). Though most leaders
                and churchgoers have never thought of it in these terms, they often
                expect that the pastor is the one doing the work of ministry. This
                assumption promotes the concept that everyone else in the church is
                just a “helper” who has no ownership or buy-in, as we discussed briefly
                in the previous chapter.
              kind: prose
              UID: MIN171.3.1.1.P.1
              page: 40
            - p: 2
              text: Many smaller churches experience this because the burden falls
                on the pastor and his wife to do everything. These “mom and pop” style
                churches put tremendous pressure on the pastor to do the work of ministry,
                and too many pastors think that church growth is the solution for
                this problem.
              kind: prose
              UID: MIN171.3.1.1.P.2
              page: 40
            - p: 3
              text: In reality, we need to change this paradigm—in ourselves and in
                our churches, no matter how large or small they are. While a bigger
                church may have a larger staff who feel they must do all the work
                of ministry by themselves, in point of fact, the staff should be equipping
                God’s people to do the work, not doing the work by themselves.
              kind: prose
              UID: MIN171.3.1.1.P.3
              page: 40
            - p: 4
              text: The Bible teaches that we are a kingdom of priests. Peter wrote,
                “But you are not like that, for you are a chosen people. You are royal
                priests, a holy nation, God’s very own possession. As a result, you
                can show others the goodness of God, for he called you out of the
                darkness into his wonderful light” (1 Peter 2:9, NLT). Preachers are
                not modern priests; each believer has the indwelling presence of the
                Holy Spirit, and the entire congregation shares the mission of showing
                God’s goodness to others.
              kind: prose
              UID: MIN171.3.1.1.P.4
              page: 40
            - p: 5
              text: The plumber in your church is a priest; plumbing is what he does
                to support his priesthood. The accountant is a priest; accounting
                is what she does to support her priesthood. Each believer is part
                of a royal nation and is called to “full-time ministry,” even if they
                are not paid full-time ministers. All of us should be living out our
                ministries on a daily basis.
              kind: prose
              UID: MIN171.3.1.1.P.5
              page: 40
            - p: 6
              text: When ordinary churchgoers catch the revelation that they do not
                come to church to receive ministry but to minister, this incredible
                paradigm shift causes churches to explode with life and health! We
                are all priests, and priests do not come to the temple to be blessed—they
                come to minister. Because of God’s goodness, we get blessed as a supplementary
                benefit of coming to church, but the primary purpose of every priest
                in your congregation is to minister to those who are far from God.
              kind: prose
              UID: MIN171.3.1.1.P.6
              page: 40
            - p: 7
              text: Jewish priests had to pack up and move the tabernacle, slay and
                butcher the sacrifices, and clean up the blood afterward. It was dirty,
                gruesome, difficult work. Modern priests have responsibilities as
                well—inviting friends and co-workers to church, greeting visitors
                warmly, serving the next generation in children’s programs, and doing
                whatever else it takes to do the Lord’s work.
              kind: prose
              UID: MIN171.3.1.1.P.7
              page: 40
            - p: 8
              text: 'Believers come to church to be blessed and ministered to, but
                that is not the end of the story. Like Abraham, they are “blessed
                to be a blessing” in the lives of everyone they meet. Jesus explained
                the principle of overflow at a feast in Jerusalem. Each day of the
                week-long event was a rising crescendo of sacrifices and washings.
                John explains this:'
              kind: prose
              UID: MIN171.3.1.1.P.8
              page: 41
            - p: 9
              text: On the last day, that great day of the feast, Jesus stood and
                cried out, saying, “If anyone thirsts, let him come to Me and drink.
                He who believes in Me, as the Scripture has said, out of his heart
                will flow rivers of living water.” But this He spoke concerning the
                Spirit, whom those believing in Him would receive; for the Holy Spirit
                was not yet given, because Jesus was not yet glorified. (John 7:37–39,
                NKJV)
              kind: quote
              UID: MIN171.3.1.1.P.9
              page: 41
            - p: 10
              text: When you and the people in your church catch this principle, it
                is an incredible ray of hope and a source of strength because you
                will no longer feel alone as a minister. As you teach this and the
                people grasp it, you will not be surrounded by “helpers”; you will
                be surrounded by an increasing number of “priests” who are overflowing
                with the love, forgiveness, and power of the Spirit! People who buy
                into this truth will feel a greater sense of ownership than ever before,
                and it will transform the way you do ministry.
              kind: prose
              UID: MIN171.3.1.1.P.10
              page: 41
            - p: 11
              text: 'The people do not exist to help the pastor; the pastor exists
                to help the people fulfill their callings. That calling for each and
                every Christian includes the Great Commission that is the mission
                and purpose of the church and every part of the body of Christ: “Go
                and make disciples of all nations, baptizing them in the name of the
                Father and of the Son and of the Holy Spirit, and teaching them to
                obey everything I have commanded you” (Matthew 28:19–20, NIV). This
                mandate is not just for pastors; it is for every believer.'
              kind: prose
              UID: MIN171.3.1.1.P.11
              page: 41
            - p: 12
              text: This concept of the priesthood of all believers is the catalyst
                for every other component of the Acts 2 model. None of it will work
                without this shift of perspective; otherwise, the pastor will have
                helpers instead of co-owners of the church’s mission and vision. What
                Acts 2 asks, you cannot do by yourself as a church leader—you must
                have the people with you. It is absolutely essential to grasp this
                concept yourself and to teach it as long as it takes for the people
                to grasp it.
              kind: prose
              UID: MIN171.3.1.1.P.12
              page: 41
            - p: 13
              text: Something amazing will happen when the people really buy in. If
                you catch nothing else that I have learned, hold on to this and watch
                it transform your church and your ministry.
              kind: prose
              UID: MIN171.3.1.1.P.13
              page: 41
            - p: 14
              text: Many Hands
              kind: heading
              UID: MIN171.3.1.1.P.14
              page: 42
            - p: 15
              text: When I began pastoring First Assembly of North Little Rock, it
                was a church of about five hundred people, and a few of them did all
                the work. Beneath the surface of my travel and ministry resources,
                the confrontation with Bill and the board was precipitated by my fifteen
                weeks of preaching that the people in the pews were a kingdom of priests
                and needed to be ministering.
              kind: prose
              UID: MIN171.3.1.1.P.15
              page: 42
            - p: 16
              text: By the time I left, the church had tripled, and perhaps a thousand
                of them were involved in service of some sort. I would never have
                gotten so many people to buy in and get involved if the concept had
                persisted that I was hired to preach and do all the ministering, letting
                the board run the church.
              kind: prose
              UID: MIN171.3.1.1.P.16
              page: 42
            - p: 17
              text: 'This foundational biblical principle has changed more churches
                than just the one I served, and it is a central component in setting
                up the Acts 2 process. You will not get a sense of ownership from
                co-laborers who share your vision unless people understand that it
                is more than simply volunteering: it is a biblical mandate.'
              kind: prose
              UID: MIN171.3.1.1.P.17
              page: 42
            - p: 18
              text: When you have a church full of people who are all about themselves
                and their preferences, their only consideration is their personal
                comfort and care. When you make the leap and people understand they
                are supposed to be contributors and not consumers, everything changes.
              kind: prose
              UID: MIN171.3.1.1.P.18
              page: 42
            - p: 19
              text: People who are consumers come to church, and they may participate
                in many activities, but they are cisterns that continually have to
                be filled. They are not springs of water that are a constant source
                of nourishment for others. What turns a consumer into a contributor
                and turns a cistern into a fresh spring? The answer is the “gospel
                of grace.” When people are thrilled that the God of the universe loves
                them so much that He sent His Son to die in their place, they realize
                He is their greatest treasure and they are His greatest treasure.
                A deep, compelling grasp of God’s magnificent grace is not just an
                entry point to the Christian life. It is the source of our deepest
                contentment and our highest motivation for everything we do each day.
                The grace of God humbles us because we realize our sins required the
                God of glory to pay the ultimate price for us, and it raises us to
                the stars because He loves us so much that He was glad to do it. This
                realization changes everything!
              kind: prose
              UID: MIN171.3.1.1.P.19
              page: 42
            interactive_questions:
            - p: 1
              text: How has this “pastor-does-the-ministry” paradigm led many churchgoers
                to be consumers rather than disciples?
              response: If pastor’s primary role is to care for all of the ministry
                needs of the people, many will be glad to let him or her continue
                doing just that, indefinitely, and they will never learn to look beyond
                their own needs to the needs of others.
              UID: MIN171.3.1.1.IQ.1
            - p: 2
              text: When a pastor does all or most of the ministry, how are God’s
                purposes thwarted?
              response: The pastor is to help Christ’s followers to identify and fulfill
                their individual callings.
              UID: MIN171.3.1.1.IQ.2
            - p: 3
              text: How would the “pastor as equipper” paradigm make pastoring today
                more manageable and effective?
              response: There is much to do in the kingdom of God, and the priesthood
                of believers provides many potential hands to share in the work. Further,
                God has gifted many people in ways that exceed or differ from the
                pastor’s giftings.
              UID: MIN171.3.1.1.IQ.3
            - p: 4
              text: How is the church’s ministry impacted by this paradigm shift?
              response: When the priesthood of believers is in full operation in a
                local church, the potential of that church’s ministry efforts expand
                exponentially.
              UID: MIN171.3.1.1.IQ.4
            last_modified: '2026-03-27'
