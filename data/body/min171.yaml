            - p: 456
              text: Communicating to the Church Family
              kind: heading
              UID: MIN171.17.2.1.P.456
              page: 238
            - p: 457
              text: One of the issues that hinders a church from reaching its full
                kingdom potential is knowing what to say, when to say it, and how
                it should be said. Communication gives your audience a sight line
                of hope for the future along with the ability to grasp the opportunity
                to make it reality.
              kind: prose
              UID: MIN171.17.2.1.P.457
              page: 238
            - p: 458
              text: Communication goes beyond the Sunday morning pulpit. Each team
                member should understand the vision and strategic plan to support
                the pastor as the pastor in turn gives information, inspiration, and
                spiritual direction for the church. This encourages other people to
                capture the vision and understand it is not just one person’s dream,
                but rather a team vision from many hours of prayer, study, and preparation.
                Your pastor needs to connect to the congregation so together everyone
                can go to the next level. Your acceptance and verbal agreement is
                powerful and allows people to realize this is a team effort. It is
                a God thing.
              kind: prose
              UID: MIN171.17.2.1.P.458
              page: 238
            - p: 459
              text: Communication is a spiritually powerful resource that begins when
                God speaks to us. The pastor may ask you to share your heart and excitement
                about the vision and the ministries that are launched. We then can
                share the vision God has given us and communicate the core values
                that give us the potential to stay focused on the pathway and be connected
                to the strategic plan.
              kind: prose
              UID: MIN171.17.2.1.P.459
              page: 238
            - p: 460
              text: Strategic communication reinforces the spiritual connection people
                sense when the vision team speaks and brings confidence to the congregation
                as they hear the new direction.
              kind: prose
              UID: MIN171.17.2.1.P.460
              page: 238
            - p: 461
              text: Planning Your New Initiatives
              kind: prose
              UID: MIN171.17.2.1.P.461
              page: 238
            - p: 462
              text: Best Practices
              kind: prose
              UID: MIN171.17.2.1.P.462
              page: 238
            - p: 463
              text: Strategic planning includes mapping out the dates when various
                aspects of the Acts 2 process are presented to the congregation and
                acted upon.
              kind: list
              UID: MIN171.17.2.1.P.463
            - p: 464
              text: Proper timing is critical. Moving too fast can be unnecessarily
                disorienting. You must include time for (1) planning, (2) adjustment,
                and (3) celebration.
              kind: list
              UID: MIN171.17.2.1.P.464
            - p: 465
              text: Consider making only one to three major changes to your processes
                at a time.
              kind: list
              UID: MIN171.17.2.1.P.465
            - p: 466
              text: It will take time for the congregation to absorb and accept ideas
                that you and your team have already been working on for some time.
                Give them time to process new ideas and direction.
              kind: list
              UID: MIN171.17.2.1.P.466
            - p: 467
              text: Encourage the vision team to remain resilient. Work through the
                change while displaying a positive attitude, emotional control, and
                minimal dysfunctional behavior.
              kind: list
              UID: MIN171.17.2.1.P.467
            - p: 468
              text: Be flexible and adaptable, but only make changes as a team. Resist
                the temptation to pile on new goals, strategies, and activities just
                to satisfy other agendas. Having too many initiatives will cause overload.
                Overload causes progress to slow or come to a complete stop.
              kind: list
              UID: MIN171.17.2.1.P.468
            - p: 469
              text: Remember that the journey is about people! People lead the journey
                and are impacted by the changes that will occur in the journey. People
                will also be transformed as they take the journey.
              kind: list
              UID: MIN171.17.2.1.P.469
            - p: 470
              text: Future Calendar Planning
              kind: prose
              UID: MIN171.17.2.1.P.470
              page: 238
            - p: 471
              text: Use a planning calendar to identify target dates for your strategic
                steps of action. Be careful not to initiate action steps too quickly.
                Refer to the first steps you charted for your strategic plan to focus
                on key items of action. The questions below can also be used with
                your team to identify target dates and to discuss your strategy in
                various areas.
              kind: prose
              UID: MIN171.17.2.1.P.471
              page: 238
            - p: 472
              text: 1. When do you launch the vision statement?
              kind: prose
              UID: MIN171.17.2.1.P.472
              page: 238
            - p: 473
              text: 2. When do you launch the core value system?
              kind: prose
              UID: MIN171.17.2.1.P.473
              page: 238
            - p: 474
              text: 3. When do you initiate the specific steps that you have determined
                are needed to move the church forward in the Acts 2 process?
              kind: prose
              UID: MIN171.17.2.1.P.474
              page: 238
            - p: 475
              text: 4. How do you communicate the vision and core values?
              kind: prose
              UID: MIN171.17.2.1.P.475
              page: 238
            - p: 476
              text: 5. How does your preaching schedule reflect the process?
              kind: prose
              UID: MIN171.17.2.1.P.476
              page: 239
            - p: 477
              text: 6. How does the vision team continue to work on the process?
              kind: prose
              UID: MIN171.17.2.1.P.477
              page: 239
            - p: 478
              text: 7. How do you recruit new people for ministry in the process?
              kind: prose
              UID: MIN171.17.2.1.P.478
              page: 239
            - p: 479
              text: As you initiate strategic steps and work together with your team,
                expect that some refinements and further improvements will be needed
                along the way. You may want to enlist various members of your vision
                team to help communicate the vision. May God’s Holy Spirit empower
                you as Spirit-filled disciples, to fulfill His plans and purposes
                in your church and your community in the months and years ahead!
              kind: prose
              UID: MIN171.17.2.1.P.479
              page: 239
