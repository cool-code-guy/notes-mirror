              UID: MIN171.1.1.1.S.12
            text: Describe the need for a process to lead the church to growth.
            glossary: []
          1.1.2:
            body:
            - UID: MIN171.1.1.2.P.1
              p: 1
              text: My father was thoroughly and spectacularly converted to Christ
                and miraculously delivered from his alcohol addiction. But the transformation
                did not end there. About six months after I was born, Dad was appointed
                the pastor of a small church—after being saved less than a year.
              page: 17
            - UID: MIN171.1.1.2.P.2
              p: 2
              text: He had yet to preach a single sermon.
            - UID: MIN171.1.1.2.P.3
              p: 3
              text: He and my mother pastored that small church in Sour Lake, Texas,
                for twenty-two years. During that time, God used Dad’s salvation experience
                and a message He put in my father’s heart to change lives.
              page: 17
            - UID: MIN171.1.1.2.P.4
              p: 4
              text: My dad started his ministry with a supernatural experience, but
                he spent his ministry without seeing numerical success. I doubt if
                we ever had one hundred people in that little church even on Easter
                or during a great revival when the church was packed each night. You
                see, our church could only seat about ninety people!
              page: 17
            - UID: MIN171.1.1.2.P.5
              p: 5
              text: My dad had a great appreciation for the Spirit-empowered message
                the church received at Pentecost. Dad was a pastor who understood
                the magnificent grace of God. He fasted and prayed; he was sincere
                and dedicated. He often taught about the power of the Spirit, and
                while he had an experience with Christ and had a message to share,
                he was missing something. It was not that he was doing it wrong; he
                just did not have the whole picture.
              page: 17
            - UID: MIN171.1.1.2.P.6
              p: 6
              text: What he lacked was a process .
            - UID: MIN171.1.1.2.P.7
              p: 7
              text: I know what it feels like to try so hard but feel so confused.
                When I became pastor of First Assembly of God, in North Little Rock,
                Arkansas, in 1986, I followed my dad’s example. I had been an evangelist
                for eighteen years; I had the Pentecostal experience, and I had the
                message. When I shared my experience and began to preach a Spirit-empowered
                message, revival came.
              page: 17
            - UID: MIN171.1.1.2.P.8
              p: 8
              text: But I was missing something.
            - UID: MIN171.1.1.2.P.9
              p: 9
              text: I knew how to preach a sermon, how to bring people to the altar,
                and how to help my congregation be blessed, but for all that my father
                taught me, he did not teach me how to take a church from where we
                were to where we needed to be.
              page: 17
            - UID: MIN171.1.1.2.P.10
              p: 10
              text: Dad did not have a process, and neither did I.
              page: 17
            - UID: MIN171.1.1.2.P.11
              p: 11
              text: I did not need a trendy, new, unique process for building a healthy
                church. I needed to look at what God had already done in establishing
                the very first church. I needed a complete Acts 2 church—not just
                the experience and message but also a process and a plan. In my ministry
                and in our church, I needed a process that would show us how a first-century
                church could effectively be reproduced in what was soon to be a twenty-first-century
                world. This realization and process changed many lives, including
                mine and many in the church I pastored and in the denomination I now
                serve.
              page: 17
            - UID: MIN171.1.1.2.P.12
              p: 12
              text: As you pick up this book, you may be in the same place my father
                and I were. You are sincere, dedicated, committed, spiritual, and
                faithful, but you feel you lack something.
              page: 18
            - UID: MIN171.1.1.2.P.13
              p: 13
              text: I believe many of us have missed a complete understanding of what
                the Holy Spirit did in the first-century church. The early church
                impacted the then-known world, walking out God’s plan and doing the
                work of the ministry as a chosen generation and royal priesthood.
                Certainly it had some problems, but the first-century church turned
                the world upside down (see Acts 17:6, ESV).
              page: 18
            - UID: MIN171.1.1.2.P.14
              p: 14
              text: I am convinced the church Luke describes in Acts 2 is the model,
                the plan, and the process that Jesus envisioned for the church on
                the earth.
              page: 18
            - UID: MIN171.1.1.2.P.15
              p: 15
              text: The best part is that anyone can do it. It does not depend on
                the size of your congregation, your building, your town, or your bank
                account. It depends solely on our limitless God with whom all things
                are possible (Matthew 19:26, NIV).
              page: 18
            - UID: MIN171.1.1.2.P.16
              p: 16
              text: The Acts 2 Model
              page: 14
            - UID: MIN171.1.1.2.P.17
              p: 17
              text: In 1988, I began to put together my thoughts on a strategic process
                that eventually became the Acts 2 process. I am not a very creative
                person, but I am conceptual—I can take an idea and flesh it out—and
                I developed the material that I discovered in Luke’s account of the
                early church.
              page: 18
            - UID: MIN171.1.1.2.P.18
              p: 18
              text: This process is not something I have merely read about; it is
                something I have lived . It is something I developed while leading
                a church that had plateaued for thirty years, and it all came together
                as I observed the five functions upon which Jesus founded the first-century
                church.
              page: 18
            - UID: MIN171.1.1.2.P.19
              p: 19
              text: Jesus told the disciples to wait in Jerusalem “until the Holy
                Spirit comes and fills you with power from heaven” (Luke 24:49, NLT
                ). Later He said, “You shall receive power when the Holy Spirit has
                come upon you; and you shall be witnesses to Me in Jerusalem, and
                in all Judea and Samaria, and to the end of the earth” (Acts 1:8,
                NKJV). Then in Acts 2:4, they had a supernatural experience—Pentecost.
                In Acts 2:5–41, Peter went out to the inquisitive Jews and began to
                explain what was happening; he was preaching the message.
              page: 18
            - UID: MIN171.1.1.2.P.20
              p: 20
              text: 'The content of the process God was birthing in my heart is Acts
                2:42–47 (NKJV):'
              page: 18
            - UID: MIN171.1.1.2.P.21
              p: 21
              text: 'In this passage, the Holy Spirit began to explain the process
                of how to move from a temple model to a church model. Before Christ,
                the temple had been the center of life for the Jewish people. There,
                God’s people read the Scriptures, prayed, encouraged each other, and
                worshipped God. The building was carefully constructed and ornately
                decorated. It was the place where heaven and earth met. The Holy of
                Holies was the inner sanctum where the Shekinah glory of God dwelled.
                But when Jesus died on the cross, the thick veil isolating the Holy
                of Holies was torn from top to bottom. The presence of God was unleashed
                and available to all who believe. Then, at Pentecost, an amazing and
                dramatic thing happened: Those who believed in Jesus became the place
                where heaven and earth met!'
              page: 19
            - UID: MIN171.1.1.2.P.22
              p: 22
              text: 'Decades later, Paul explained that our bodies are temples of
                the Holy Spirit (1 Corinthians 6:19, NLT). Freed from a place, all
                believers and all gatherings of believers have become the place where
                heaven and earth meet—and all believers are now priests who love,
                serve, and worship God in all they say and do. Evangelism, discipleship,
                fellowship, ministry (service), and worship were to be the functions
                of an effective, Spirit-empowered church—they are the five functions
                upon which the Acts 2 process is based: connect, grow, serve, go ,
                and worship .'
              page: 19
            interactive_questions:
            - UID: MIN171.1.1.2.IQ.1
              p: 1
              text: What is the Great Commission and how does it intend more than
                just inviting people to connect with God?
            - UID: MIN171.1.1.2.IQ.2
              p: 2
              text: What is it about the Acts 2 Church that many find so appealing
                today?
            - UID: MIN171.1.1.2.IQ.3
              p: 3
              text: How did the experience of the baptism in the Holy Spirit impact
                Simon Peter’s life?
