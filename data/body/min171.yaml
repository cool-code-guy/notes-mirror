                key: isaiah.58.13-14
                bib_gate: https://www.biblegateway.com/passage/?search=Isaiah%2058%3A13-14&version=NIV
              paragraph: MIN171.12.2.1.P.3
              UID: MIN171.12.2.1.S.1
