      - last_modified: '2026-03-27'
        title: An Environment for Growth and Discipleship
        subobjectives:
          12.3.1:
            body:
            - p: 1
              text: The purpose of church is not to help people have a good time but
                to help them mature and grow in their faith, being discipled and discipling
                others in turn.
              kind: prose
              UID: MIN171.12.3.1.P.1
              page: 141
            - p: 2
              text: The church disciples people by encouraging belief, teaching knowledge,
                and facilitating relationship—all in love. When you belong to a church
                family where the Word is emphasized, it will build up your faith,
                clarify your values, and develop your character.
              kind: prose
              UID: MIN171.12.3.1.P.2
              page: 141
            - p: 3
              text: However, the Christian life is more than just theory. It cannot
                simply be taught from a pulpit; it must be lived out. There are only
                a few places where this can happen, and church is one of the best
                because we can do so among other members of our church family who
                are growing and maturing as well. Where better to practice forgiving
                those who have hurt you, to learn to make difficult decisions with
                wisdom and the leading of the Holy Spirit, to develop character necessary
                to be a good spouse, or to overcome a self-destructive behavior?
              kind: prose
              UID: MIN171.12.3.1.P.3
              page: 141
            - p: 4
              text: Practicing the teachings in God’s Word within the context of a
                church family helps with those issues and many more. God does not
                want us to remain spiritual infants; He wants us to mature. Our church
                family helps with that growth.
              kind: prose
              UID: MIN171.12.3.1.P.4
              page: 142
            - p: 5
              text: While some people feel that attending the main service is sufficient,
                smaller groups are ideal for encouraging connection because so much
                growth can happen within these smaller contexts. Sunday school is
                an excellent place to bond with other believers and establish relationships,
                as is being in a small group that meets in homes and shares meals.
              kind: prose
              UID: MIN171.12.3.1.P.5
              page: 142
            - p: 6
              text: Church and its connected programs should help create environments
                for growth and discipleship. Whatever the setting, the objective is
                to have a systematic study of the Bible and have relationship with
                others for peer learning, encouragement, and accountability.
              kind: prose
              UID: MIN171.12.3.1.P.6
              page: 142
            - p: 7
              text: Give Back
              kind: heading
              UID: MIN171.12.3.1.P.7
              page: 142
            - p: 8
              text: Church is more than occupying a pew. God did not plan for us to
                be consumers in the body of Christ without giving back. Think again
                of the priesthood of all believers’ paradigm shift I mentioned earlier.
                God expects each believer to contribute to the body of Christ, and
                He has given us abilities, talents, gifts, and unique backgrounds
                that can help other people. Any time you use your talents or abilities
                to help someone, you are ministering to that person.
              kind: prose
              UID: MIN171.12.3.1.P.8
              page: 142
            - p: 9
              text: Only a small percentage of Christians are called into the full-time
                ministry, but we are all called to minister. A Christian who is not
                ministering is actually a contradiction. One day we will stand before
                Christ and give an account of how we used the talents and gifts He
                gave us. That is why one of the major jobs of the church is to help
                people discover and develop their ministry and to provide a venue
                to help them give to others (we will cover this in more depth in Chapter
                14).
              kind: prose
              UID: MIN171.12.3.1.P.9
              page: 142
            - p: 10
              text: 'Paul explained it like this: “For we are His workmanship, created
                in Christ Jesus for good works, which God prepared beforehand that
                we should walk in them” (Ephesians 2:10, NKJV). You are not a mistake;
                you are a masterpiece, a work of art, truly one-of-a-kind. Even if
                your parents did not plan your birth, God did. He designed you, and
                regardless of the circumstances of your birth, He wants you on this
                earth for a purpose. Your unique offering to the world is your ministry—the
                “good works” Paul mentioned.'
              kind: prose
              UID: MIN171.12.3.1.P.10
              page: 142
            - p: 11
              text: God says to each and every one of us, “I want your life to count.”
              kind: prose
              UID: MIN171.12.3.1.P.11
              page: 142
            - p: 12
              text: Various types of service or ministry combined with people who
                have various gifts operating in their lives form the body of Christ.
                Each one of us is necessary; that message can be countercultural in
                a world that teaches we are nothing more than an upstart ape.
              kind: prose
              UID: MIN171.12.3.1.P.12
              page: 143
            - p: 13
              text: We can spend a great deal of money on therapy, self-help books,
                and motivational seminars, but all of these say the same things. They
                all want to improve your self-esteem, but the true key to healthy
                self-esteem is figuring out what God made you to be—and then being
                it. We do this best in community.
              kind: prose
              UID: MIN171.12.3.1.P.13
              page: 143
            - p: 14
              text: Complete the Mission
              kind: heading
              UID: MIN171.12.3.1.P.14
            - p: 15
              text: Related to but different from helping people find their ministries
                is the role of church in helping people fulfill their life’s mission.
                If finding our ministry is learning what God made us to be and then
                being it, our life mission is the grand purpose for our lives.
              kind: prose
              UID: MIN171.12.3.1.P.15
              page: 143
            - p: 16
              text: 'In Acts 20:24 (CEB), Paul spoke to the Ephesian elders for the
                last time, and he wanted them to grasp his driving purpose in life.
                He told them, “But nothing, not even my life, is more important than
                my completing my mission. This is nothing other than the ministry
                I received from the Lord Jesus: to testify about the good news of
                God’s grace.”'
              kind: prose
              UID: MIN171.12.3.1.P.16
              page: 143
            - p: 17
              text: Part of every Christian’s life mission is the Great Commission.
                Someone once told us the good news, and now we are to pass it on.
                The Bible says we are ambassadors for Christ. Have you cared enough
                lately to tell someone the good news that Christ wants to forgive
                them of their sins? We must train our congregations to share this
                message so others can have a home in heaven and experience God’s presence
                in this life.
              kind: prose
              UID: MIN171.12.3.1.P.17
              page: 143
            - p: 18
              text: Our life mission is to be contagious, infected with the life of
                Christ and spreading to a dying world. We accomplish this outward
                focus best together as a body with each part supplying its intended
                function.
              kind: prose
              UID: MIN171.12.3.1.P.18
              page: 143
            - p: 19
              text: A Place to Meet Needs
              kind: heading
              UID: MIN171.12.3.1.P.19
            - p: 20
              text: God designed the church to help meet some of our most basic needs.
                We each want significance, need fellowship, desire stability, want
                a purpose, and crave inspiration.
              kind: prose
              UID: MIN171.12.3.1.P.20
              page: 143
            - p: 21
              text: If we do not look to meet these needs within a church family,
                we will look to other sources. Where will we meet our need for significance,
                support, stability, self-expression, and stimulation? Our jobs may
                offer a form of significance, and being part of a neighborhood or
                community can offer support, but are these the most qualified, desirable
                people to meet our needs?
              kind: prose
              UID: MIN171.12.3.1.P.21
              page: 143
            - p: 22
              text: 'A church family is the best place to meet needs in a godly way.
                But here is the catch: The church flips our normal expectation on
                its head. Instead of being a place where we go to get our needs met,
                as a priesthood of believers we go to meet needs. If you can grasp
                this and help others do the same, you will completely revolutionize
                the way you do ministry—and the way people’s needs are met.'
              kind: prose
              UID: MIN171.12.3.1.P.22
              page: 143
            - p: 23
              text: 'Millions of people wake up every morning, and the first thought
                they have when their feet hit the floor is, “Do I matter?” We have
                an incredible opportunity to answer that question in the context of
                church family. Our churches can touch the lives of people just trying
                to survive, people who are struggling to succeed, and people striving
                for significance. The question is: Are we willing to push through
                objections, make an impact, and help hurting people find answers to
                their questions?'
              kind: prose
              UID: MIN171.12.3.1.P.23
              page: 144
            - p: 24
              text: Overcoming Objections
              kind: heading
              UID: MIN171.12.3.1.P.24
              page: 144
            - p: 25
              text: Every person who chooses not to go to church has an excuse that
                ranges from preachers asking for money too often, to unfriendly people,
                to busy lives and conflicting activities.
              kind: prose
              UID: MIN171.12.3.1.P.25
              page: 144
            - p: 26
              text: 'The question we must ask is: What are we doing to eliminate as
                many barriers as possible so that when visitors do come, they feel
                welcome? Here is a hint: We started the chapter by talking about this—taking
                the barriers down starts at the door.'
              kind: prose
              UID: MIN171.12.3.1.P.26
              page: 144
            - p: 27
              text: Making people feel welcome involves more than having friendly
                greeters, but this is the first line against offense. They are the
                first faces people see, and as the cliché goes, there is no second
                chance to make a first impression. It is not enough to be “friendly”
                because the tendency is to be friendly with people we know—and neglect
                visitors. We must be outgoing and have our focus on other people and
                not on ourselves.
              kind: prose
              UID: MIN171.12.3.1.P.27
              page: 144
            - p: 28
              text: When someone enters the building, the clock starts ticking. Surveys
                show we may have as many as eighteen weeks to disciple new visitors
                and help them form strong relations and begin to participate. This
                process starts when we connect with people on their first visit and
                provide a way for them to hear about the church. The church has a
                responsibility to communicate its desire and provide activities to
                meet the needs of the new people, to engage in intentional acts of
                love and service throughout the week, and to assist new people in
                finding their place in ministry within this eighteen-week window.
              kind: prose
              UID: MIN171.12.3.1.P.28
              page: 144
            - p: 29
              text: How do you connect people from their first visit and assimilate
                them into the full life of the church in less than eighteen weeks?
                By making sure that one of your focus points is discipleship, not
                just converting the lost. This process allows people to explore belonging
                even before belief or becoming. The sense of family begins when people
                feel a sense of belonging, but belonging is just the beginning.
              kind: prose
              UID: MIN171.12.3.1.P.29
              page: 144
            - p: 30
              text: People’s lives will not change if we “greet” them with scowls
                of judgment and arms crossed while claiming to represent a Savior
                who died with His arms wide open. When people come to our churches
                and feel our love—the love of an entire family welcoming them with
                an overwhelming sense of belonging—they will connect with the church
                just as we have.
              kind: prose
              UID: MIN171.12.3.1.P.30
              page: 145
            interactive_questions:
            - p: 1
              text: In what way(s) does our relationship with one another help us
                mature in our relationship with God?
              response: Answers will vary.
              UID: MIN171.12.3.1.IQ.1
            - p: 2
              text: What do we mean when we say everyone is a minister?
              response: Each person has gifts and abilities that need to be expressed
                in order to serve other people, meet needs, and ultimately, glorify
                God. Gifts and abilities are also used in our life’s calling. God
                has prepared good works for every follower of Christ to walk in (Ephesians
                2:10).
              UID: MIN171.12.3.1.IQ.2
            - p: 3
              text: What is the shift in expectation that must take place in the church
                in order to meet needs?
              response: Every individual in the priesthood of believers should be
                focused on meeting the needs of others.
              UID: MIN171.12.3.1.IQ.3
            - p: 4
              text: What is a key issue that helps new people overcome their previous
                resistance to become a part of a church?
              response: A sense of belonging is a central issue. The sense of family
                begins when people feel a sense of belonging, but belonging is just
                the beginning.
              UID: MIN171.12.3.1.IQ.4
            - p: 5
              text: 'Finish this statement: I dream of a church where fellowship is...'
              UID: MIN171.12.3.1.IQ.5
            - p: 6
              text: Identify 3-5 “Connect” strategies that will help you pursue the
                vision and values you developed in Chapters 9 and 10.
              response: Grow 13 CHAPTER
              UID: MIN171.12.3.1.IQ.6
