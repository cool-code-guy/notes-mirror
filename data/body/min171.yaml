      - last_modified: '2026-03-27'
        title: Worship and Revitalization
        subobjectives:
          16.2.1:
            body:
            - p: 1
              text: Revitalized Through Prayer
              kind: heading
              UID: MIN171.16.2.1.P.1
              page: 203
            - p: 2
              text: Worship is a lifestyle, but in this age of emphasis on worship
                through music, many have forgotten that prayer is a powerful form
                of worship. One of the best ways we connect with people is speaking
                to them. When we speak to God, we call it “prayer”—one of the chief
                expressions of worship.
              kind: prose
              UID: MIN171.16.2.1.P.2
              page: 203
            - p: 3
              text: Worship is a tool for connecting us to God—of reaching up to our
                heavenly Father to ask His glory to come down. David’s language of
                thirst and hunger that we just read from Psalm 63 is a poetic expression
                for the need we all have for God. That need is answered through relationship—not
                signs and wonders or miracles or provision, but real, organic relationship.
              kind: prose
              UID: MIN171.16.2.1.P.3
              page: 203
            - p: 4
              text: Worshipful prayer is nothing like the extravagant, public show
                the Pharisees put on to impress people. It is the urgent, honest opening
                of a heart to God that the tax collector showed in Jesus’ parable
                in Luke 18. It is an expression of personal hunger. We can find amazing
                freedom when we worship God through prayer, hungering and thirsting
                for revitalization in our lives and beyond the walls of our churches.
              kind: prose
              UID: MIN171.16.2.1.P.4
              page: 203
            - p: 5
              text: Someone once asked British revivalist Gipsy Smith how to start
                a revival. He replied, “Find a piece of chalk, and find an empty room.
                Go into that room and shut the door. Draw a circle on the floor with
                that chalk, kneel down in that circle, and ask God to start revival
                right there” (The Shepherd’s Presence 2015).
              kind: prose
              UID: MIN171.16.2.1.P.5
              page: 203
            - p: 6
              text: Empowerment begins when you urgently seek God in worshipful prayer.
              kind: prose
              UID: MIN171.16.2.1.P.6
              page: 203
            - p: 7
              text: Prayer Prepares Your Heart
              kind: heading
              UID: MIN171.16.2.1.P.7
              page: 204
            - p: 8
              text: You and I cannot create revival, but we can pray for the power
                of the Spirit. We can bare our souls, simply talking with God about
                what concerns us, saddens us, and moves us about the condition of
                our nation, city, church, and ourselves.
              kind: prose
              UID: MIN171.16.2.1.P.8
              page: 204
            - p: 9
              text: David prayed, “Search me, God, and know my heart; test me and
                know my anxious thoughts. See if there is any offensive way in me,
                and lead me in the way everlasting” (Psalm 139:23–24, NIV). We can
                prepare for a personal empowerment by asking ourselves hard questions
                about the condition of our hearts—and listening to the Spirit’s truthful
                answers. Believe it or not, this type of soul-searching prayer is
                a form of worship.
              kind: prose
              UID: MIN171.16.2.1.P.9
              page: 204
            - p: 10
              text: Ask yourself where you stand with sin and repentance—are you in
                genuine repentance for your own sins and pursuing open accountability
                with trusted partners? Can you accept God’s correction when you sin?
                Are there people who can tell you when you are wrong and you will
                accept what they say?
              kind: prose
              UID: MIN171.16.2.1.P.10
              page: 204
            - p: 11
              text: How much time do you spend in the Word? Are you feeding yourself
                so you will have oil during the dry times? What about your personal
                devotions? Are they consistent and meaningful?
              kind: prose
              UID: MIN171.16.2.1.P.11
              page: 204
            - p: 12
              text: Do you harbor unforgiveness in your heart? Are you asking for
                forgiveness from those you have wronged? What is the condition of
                your heart?
              kind: prose
              UID: MIN171.16.2.1.P.12
              page: 204
            - p: 13
              text: What do your schedule and checkbook reveal about your priorities?
                Is God first? Is your relationship with your family your next priority,
                or have work commitments or other distractions caused you to lose
                your focus?
              kind: prose
              UID: MIN171.16.2.1.P.13
              page: 204
            - p: 14
              text: What about the fruit of the Spirit? Do you have consistent evidence
                that your life is producing fruit? Are you growing? Are you maturing
                as a disciple of Christ?
              kind: prose
              UID: MIN171.16.2.1.P.14
              page: 204
            - p: 15
              text: Are you as much in love with Jesus as you have ever been?
              kind: prose
              UID: MIN171.16.2.1.P.15
            - p: 16
              text: I could list another hundred questions, but the point is not to
                go through a spiritual checklist in order to make yourself feel good
                or to reproach yourself. The point is to spur yourself on to prayer
                where you seek frank, honest answers from the Holy Spirit, preparing
                your heart for a new move of God.
              kind: prose
              UID: MIN171.16.2.1.P.16
              page: 204
            - p: 17
              text: 'Sooner or later, we all miss the boat. We slip up, fail, and
                falter; it is our human nature. When we do, there is only one solution:
                Spirit empowerment. We must repent and be restored. None of us will
                ever be perfect—Jesus alone pulled that off—so we do not need a system
                to promote perfection but one that takes us quickly to the Restorer
                so we can be made well in body and soul.'
              kind: prose
              UID: MIN171.16.2.1.P.17
              page: 204
            - p: 18
              text: This is the very definition of worshipping God in prayer—and letting
                Him reply back to us with life-changing, Spirit-empowering words of
                life.
              kind: prose
              UID: MIN171.16.2.1.P.18
              page: 204
            - p: 19
              text: Powerful Preaching
              kind: heading
              UID: MIN171.16.2.1.P.19
              page: 205
            - p: 20
              text: Another element of worship is powerful preaching. Yet if we lack
                the power-source of the Spirit, how can we possibly deliver inspired
                words? Get your heart right, pray for the Spirit’s empowerment, and
                open the doors for God to use your words as another form of worship.
              kind: prose
              UID: MIN171.16.2.1.P.20
              page: 205
            - p: 21
              text: Acts 2-style speaking, whether to a congregation, small group,
                or individuals, will create discipleship opportunities. The discipleship
                we demonstrate in our own lives allows us to stand before disciples
                who are at various points in their own faith journeys and encourage
                them to continue along a spiritually fruitful path. We can inspire
                and empower with our words, and this is surely a form of worship.
              kind: prose
              UID: MIN171.16.2.1.P.21
              page: 205
            - p: 22
              text: We build relationships with our words. We can connect believers
                to the future vision the Holy Spirit desires to speak into their lives.
                We can help them discover that every follower of Christ has some form
                of ministry calling. We can offer nuts-and-bolts discipleship through
                the fabric of our words, urging them to examine and fine-tune the
                direction of their daily lives by the power of the Spirit.
              kind: prose
              UID: MIN171.16.2.1.P.22
              page: 205
            - p: 23
              text: Sound like an impossible task? It is without the empowerment of
                the Spirit! Without Holy Spirit empowerment, we can never hope to
                do all of these things consistently and in a life-giving way. But
                when pastors, small-group leaders, and Sunday school teachers who
                are sensitive to the voice of the Holy Spirit worship with their words,
                we have a chance to bring people a message of hope. If giving words
                of life and hope is not a form of honoring God through extravagant
                love and extreme submission, I do not know what is.
              kind: prose
              UID: MIN171.16.2.1.P.23
              page: 205
            - p: 24
              text: Spirit-Inspired Music
              kind: heading
              UID: MIN171.16.2.1.P.24
              page: 205
            - p: 25
              text: I saved music for the end of this chapter because it is the most
                commonly confused and clichéd understanding of worship. That is not
                to diminish the importance of music—it is a vital component of preparing
                the congregation to receive the preaching and ministering of the Holy
                Spirit.
              kind: prose
              UID: MIN171.16.2.1.P.25
              page: 205
            - p: 26
              text: While most churches gear up for Sunday morning experiences, many
                have lost track of the opportunity to connect with God and with people.
                Our worship services can become ritualized and lose their focus on
                helping people to connect vertically to God while connecting horizontally
                with the body of believers.
              kind: prose
              UID: MIN171.16.2.1.P.26
              page: 205
            - p: 27
              text: Praising God through music is a timeless and peerless method for
                connecting at a heart level. Music elicits emotions and helps us express
                those emotions in our hearts. Few things can so powerfully facilitate
                a refreshing emotional-spiritual connection for the congregation—not
                to mention preparing them to receive the Word—as musical praise and
                worship.
              kind: prose
              UID: MIN171.16.2.1.P.27
              page: 205
            - p: 28
              text: I am not going to tell you how to handle your music because every
                church is different. Some will spend a shorter time worshipping with
                music, others much longer. The point is to have a genuine expression
                of worship, not just a musical ritual. I have been in amazing services
                with only ten minutes of music and a great deal of Spirit-inspired
                preaching and prayer. I have also been in churches with long times
                of musical worship that left me hungry for God. It is all about balance.
                You must pray and seek the Holy Spirit’s guidance to create the right
                balance for your congregation.
              kind: prose
              UID: MIN171.16.2.1.P.28
            - p: 29
              text: The Holy Spirit should be as much a part of the worship service
                as we expect Him to be in the message. The two are interrelated and
                interdependent, each complementing the other. I strongly advocate
                leaving some flexibility in your schedule for experiencing the Holy
                Spirit and following His lead. Churches that are Spirit-led have an
                opportunity to experience God’s purpose and unique direction for every
                moment of the worship experience.
              kind: prose
              UID: MIN171.16.2.1.P.29
              page: 206
            - p: 30
              text: Our worship experiences begin long before the first note is played
                or the first word of the message is delivered. They begin in prayer
                before a single person has walked through the door or the first greeter
                has pulled out her best smile. Similarly, they last long after the
                final amen; they follow people as they walk to their cars, drive away,
                and engage with the rest of their week.
              kind: prose
              UID: MIN171.16.2.1.P.30
              page: 206
            - p: 31
              text: All of these points are impossible to impact without the Holy
                Spirit indwelling our lives and services. We seek refreshment and
                connection with God and others from our worship, looking to Him to
                meet our hunger and provide us with hope and freedom. Yet I would
                argue that the primary purpose of worship is to usher in the Spirit,
                from empowering an individual heart to energizing an entire congregation
                or even a city.
              kind: prose
              UID: MIN171.16.2.1.P.31
              page: 206
            - p: 32
              text: We seek to give honor and glory to God through our worship as
                we love Him extravagantly and submit to Him completely. That is why
                we raise our hands or kneel or do any of the other forms of expression
                that come naturally to a heart invigorated by God’s Spirit—because
                He is our focus.
              kind: prose
              UID: MIN171.16.2.1.P.32
              page: 206
            - p: 33
              text: If someone in your church says he did not get anything out of
                the worship, it reveals an incorrect focus. It is okay to remind that
                person that the focus of the service is not on a personal experience
                but on the Holy Spirit.
              kind: prose
              UID: MIN171.16.2.1.P.33
              page: 206
            - p: 34
              text: Our focus is on worshipping the Lord. When we lose that focus
                or pick and choose one of the five functions we like best, this will
                impact our worship. It will also impact our ability to reach out to
                those beyond our churches and to maintain the outward focus that will
                help build the kingdom of God.
              kind: prose
              UID: MIN171.16.2.1.P.34
              page: 206
            citations:
            - citekey: clarensau2015
              pandoc: '[@clarensau2015]'
              intext: (Clarensau 2015)
              paragraph: MIN171.16.2.1.P.5
