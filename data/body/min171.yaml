          14.1.2:
            body:
            - p: 1
              text: If we could convince the members of our congregations that they
                are priests, each fulfilling the church’s mission, our churches would
                experience exponential growth. Equipping, training, and developing
                the laity for ministry is probably the truest demonstration of the
                Great Commandment and the Great Commission.
              kind: prose
              UID: MIN171.14.1.2.P.1
              page: 168
            - p: 2
              text: God calls every believer and gives every believer gifts and abilities.
                Our role as church leaders is to help people discover and utilize
                those gifts—and help them understand they will be held accountable
                for how they used them.
              kind: prose
              UID: MIN171.14.1.2.P.2
              page: 168
            - p: 3
              text: People who have shifted from consumers to contributors will naturally
                fulfill a new role, the biblical function we call serve. This is an
                amazing opportunity, both fulfilling a church’s normal needs and opening
                countless doors into our communities—all while furthering the formation
                of our disciples’ spiritual maturity. Nothing helps a churchgoer feel
                more connected or have a greater sense of ownership than becoming
                involved in a form of service, and this type of organic service is
                indispensable when it comes to ministering personally to as many people
                as possible.
              kind: prose
              UID: MIN171.14.1.2.P.3
              page: 168
            - p: 4
              text: The key to the serve factor is to move away from the leader-helper
                mentality most churches have and toward a team mentality where the
                pastor or other leaders become developers rather than the only ones
                doing ministry.
              kind: prose
              UID: MIN171.14.1.2.P.4
              page: 168
            - p: 5
              text: It Takes a Team
              kind: heading
              UID: MIN171.14.1.2.P.5
              page: 168
            - p: 6
              text: Pastors need to equip the saints for the work of the ministry,
                so developing the next generation of leaders must be a core value
                component as you determine how the serve factor fits your church.
              kind: prose
              UID: MIN171.14.1.2.P.6
              page: 168
            - p: 7
              text: The acronym TEAM can be helpful in this process. Developing a
                team requires building trust, empowering team members to make decisions,
                providing accountability, and creating a climate of mentorship.
              kind: prose
              UID: MIN171.14.1.2.P.7
              page: 168
            - p: 8
              text: People who are on a team must trust each other, and they do so
                through consistency of action, loyalty of devotion, and through time.
                When we each believe we are part of a kingdom of priests who are charged
                with the Great Commission and the Great Commandment, we realize that
                we bear a responsibility.
              kind: prose
              UID: MIN171.14.1.2.P.8
              page: 168
            - p: 9
              text: One of the hardest tasks for a pastor can be delegating decisions
                to Spirit-empowered team members. This is also an issue of trust because
                we must trust that the disciples we are developing are empowered by
                the Holy Spirit. When they are, they can go places, think of things,
                and take Spirit-led initiative that you simply do not have the time
                or resources to match.
              kind: prose
              UID: MIN171.14.1.2.P.9
            - p: 10
              text: 'Accountability is incredibly paramount in this team-building
                process. I define accountability as offering necessary information
                before it is required—transparency. I like to explain it like this:
                for those men who are married, if your wife has to ask you how she
                looks, it is already too late. You needed to offer that information
                before she asked for it.'
              kind: prose
              UID: MIN171.14.1.2.P.10
              page: 169
            - p: 11
              text: 'Or it may help to think about it like this: if I walk through
                the house late at night and my wife hears the garage door open, my
                car start, and me drive off, she is likely to be upset. If she questions
                me and I respond defensively, there will be tension in our home. But
                if I simply offer the information from the onset that I am heading
                to the grocery store and will be back in twenty minutes, it is a non-issue.'
              kind: prose
              UID: MIN171.14.1.2.P.11
              page: 169
            - p: 12
              text: Mentors and those being mentored are disciples. As we discussed
                in the previous chapter, you cannot build disciples through a Sunday
                morning service. As leaders, we must invest in the “Timothies” in
                our lives, pouring into them what we have learned in our own Christian
                walk.
              kind: prose
              UID: MIN171.14.1.2.P.12
              page: 169
            - p: 13
              text: In addition to communicating the priesthood of all believers,
                many things go into making dynamic teams. Two of the most basic are
                having common goals (vision) and engaging in open communication (relationship).
                It is a sad statistic that only 5 percent of church leaders can state
                a vision for their church. How can we expect anyone to share a vision
                if we cannot articulate that vision?
              kind: prose
              UID: MIN171.14.1.2.P.13
              page: 169
            - p: 14
              text: First, catch the vision, then cast it—communicate it so your team
                can buy into it. When you do this, you will create a powerful, ministering
                group with far more reach than you could ever have alone.
              kind: prose
              UID: MIN171.14.1.2.P.14
              page: 169
            - p: 15
              text: 'Here are six additional insights and direction (six “E” words):'
              kind: prose
              UID: MIN171.14.1.2.P.15
            - p: 16
              text: Enlist —Cast a clear, compelling vision. Personally interview
                the person and show the benefits and blessings of serving, not the
                burden of having to serve.
              kind: hang
              UID: MIN171.14.1.2.P.16
            - p: 17
              text: 'Expectations —Explain what is expected of someone serving in
                a particular role, such as in the sound booth or as a parking lot
                greeter. To quote an old adage: You cannot inspect what you have not
                expected.'
              kind: hang
              UID: MIN171.14.1.2.P.17
            - p: 18
              text: Equip —Give a scriptural foundation for the role (biblical examples
                of service), provide adequate resources, and make sure volunteers
                will function in their gifting and ability.
              kind: hang
              UID: MIN171.14.1.2.P.18
            - p: 19
              text: Engage —Actually release them with responsibility and trust them
                with some level of authority.
              kind: hang
              UID: MIN171.14.1.2.P.19
            - p: 20
              text: Evaluate —Review expectations and evaluate performance. This is
                where accountability comes in.
              kind: hang
              UID: MIN171.14.1.2.P.20
            - p: 21
              text: Encourage —Remember that these are volunteers. Praise them in
                public; correct them in private.
              kind: hang
              UID: MIN171.14.1.2.P.21
            - p: 22
              text: Why Did Jesus Come?
              kind: heading
              UID: MIN171.14.1.2.P.22
              page: 170
            - p: 23
              text: When we think of why Jesus came to earth, we can make a list that
                includes saving people from their sins, healing the sick, giving hope
                to the hopeless, and a host of other ministries. In everything He
                said and did, Jesus served others. Someday, He will return as the
                conquering King, but He first came as a humble servant. Jesus told
                His disciples, “But whoever desires to become great among you, let
                him be your servant. And whoever desires to be first among you, let
                him be your slave—just as the Son of Man did not come to be served,
                but to serve, and to give His life a ransom for many” (Matthew 20:26–28,
                NKJV).
              kind: prose
              UID: MIN171.14.1.2.P.23
              page: 170
            - p: 24
              text: We can easily gloss over this as nice-sounding rhetoric, but stop
                and think about the fact that God’s Son, the Word made flesh, came
                down from heaven as a helpless baby, grew up as the son of a carpenter,
                and dedicated His earthly ministry not to glorifying himself but to
                bringing glory to His Father by serving sheep with no shepherd.
              kind: prose
              UID: MIN171.14.1.2.P.24
              page: 170
            - p: 25
              text: This is more than a leadership model; serving is a way of life,
                the foundation of the gospel. Jesus did more than talk about it—He
                lived it. Perhaps one of the greatest demonstrations of servant-heartedness
                was when Jesus washed His disciples’ feet (John 13).
              kind: prose
              UID: MIN171.14.1.2.P.25
              page: 170
            - p: 26
              text: Again, do not simply think you know this story and gloss over
                it. Stop, forget what you have heard or read before, and see it with
                fresh eyes. The Creator of the universe put aside His glory, wrapped
                a towel around himself, and took the position of the lowest servant.
              kind: prose
              UID: MIN171.14.1.2.P.26
              page: 170
            - p: 27
              text: For a moment, consider what people in the ancient Middle East
                would have walked through in their sandaled feet. Think about what
                was on the streets, what the animals left behind and what was clogging
                the gutters. A sewage system did not exist, and people did not drive
                around in nice, neat cars but walked dirt roads with dung-dropping
                animals everywhere. Think of the heat and the sweat that dripped down
                a Middle Eastern man’s legs, cutting runnels through the dirt caked
                to his skin.
              kind: prose
              UID: MIN171.14.1.2.P.27
              page: 171
            - p: 28
              text: This is what Jesus washed off their feet—animal dung and human
                waste and dust and dirt and sweat and grime. It would have quickly
                made the bowl of water brown and revolting!
              kind: prose
              UID: MIN171.14.1.2.P.28
              page: 171
            - p: 29
              text: This was not merely a symbolic gesture. It was a status-quo-destroying
                demonstration of the selfless heart of a true servant.
              kind: prose
              UID: MIN171.14.1.2.P.29
              page: 171
            - p: 30
              text: It was the example Jesus gave to His disciples as one of His final
                acts on this earth.
              kind: prose
              UID: MIN171.14.1.2.P.30
              page: 171
            - p: 31
              text: '"Do you know what I have done to you?” Jesus asked them. “You
                call Me Teacher and Lord, and you say well, for so I am. If I then,
                your Lord and Teacher, have washed your feet, you also ought to wash
                one another’s feet. For I have given you an example, that you should
                do as I have done to you.. . . If you know these things, blessed are
                you if you do them.” (John 13:12–17, NKJV)'
              kind: quote
              UID: MIN171.14.1.2.P.31
              page: 171
            - p: 32
              text: If Jesus did this for His disciples, including Judas, who would
                shortly betray Him, how can we ignore the precedent He set for us?
                How can we not strive to mimic this servant-heartedness to those we
                disciple by serving them sacrificially?
              kind: prose
              UID: MIN171.14.1.2.P.32
              page: 171
            - p: 33
              text: Further, what would happen in any church if most of the churchgoers
                caught on to this? How might they serve one another? What needs would
                we meet if we served as God’s hands and feet?
              kind: prose
              UID: MIN171.14.1.2.P.33
              page: 171
            - p: 34
              text: Jesus was not just serving His disciples; His purpose was not
                just that they would have clean feet. His purpose was to develop them
                into the future leaders of the church, who would in turn equip the
                saints for ministry and teach them to do the same.
              kind: prose
              UID: MIN171.14.1.2.P.34
              page: 171
            - p: 35
              text: We should be no different.
              kind: prose
              UID: MIN171.14.1.2.P.35
              page: 171
            interactive_questions:
            - p: 1
              text: What happens when people in the church shift from being consumers
                to contributors?
              response: People find fulfillment in service, because they are using
                their gifts for God-ordained purposes. This fulfills a church’s normal
                ministry needs and can open countless doors of service into the community—all
                while furthering the formation of the believer’s spiritual maturity.
              UID: MIN171.14.1.2.IQ.1
            - p: 2
              text: What are four key dimensions for building an effective ministry
                team?
              response: The four key dimensions are (1) building trust, (2) empowering
                team members to make decisions, (3) providing accountability, and
                (4) creating a climate of mentorship.
              UID: MIN171.14.1.2.IQ.2
            - p: 3
              text: How is accountability defined and why is it critical for the effective
                ministry team?
              response: Accountability is defined as offering necessary information
                before it is required. While people need to trust their leader, accountability
                helps the leader trust his or her team. That trust is what makes accountability
                critical to an effective ministry team.
              UID: MIN171.14.1.2.IQ.3
            - p: 4
              text: What are two basic factors that go into making a dynamic team?
              response: Two basic factors are having common goals (vision) and engaging
                in open communication (relationship).
              UID: MIN171.14.1.2.IQ.4
            - p: 5
              text: Which of the “E” words seems most significant to you and why?
              response: Answers will vary.
              UID: MIN171.14.1.2.IQ.5
            - p: 6
              text: What does the Incarnation reveal about the place of serving in
                the disciple’s life?
              response: The heart of a servant is fundamental to the disciples’ life.
                Frankly, you cannot be following a servant unless you are a servant
                too.
              UID: MIN171.14.1.2.IQ.6
            - p: 7
              text: How does serving relate to the task of equipping others for ministry?
              response: Training people to have the heart of a servant in their ministry
                efforts is just as critical as mastering the tasks they will perform.
                The Great Commandment shows us that how we do something is as essential
                as the work itself.
              UID: MIN171.14.1.2.IQ.7
            last_modified: '2026-03-27'
            scripture:
            - intext: Matthew 20:26–28
              version: NKJV
