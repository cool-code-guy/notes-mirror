      - last_modified: '2026-03-27'
        title: The Unfinished Task
        subobjectives:
          5.3.1:
            body:
            - p: 1
              text: I became a pastor without even one day of pastoral ministry experience.
                Everything I knew about ministry was from being an evangelist. Though
                First Assembly of God in North Little Rock, Arkansas, probably received
                a hundred resumes, each with more pastoral experience than I had,
                for some reason, they chose me.
              kind: prose
              UID: MIN171.5.3.1.P.1
              page: 63
            - p: 2
              text: I was thirty-nine years old. I had never baptized anyone, dedicated
                a baby, or done any of the dozens of ministry tasks even a young pastor
                has done many times. However, God kept me at First Assembly for fifteen
                years and blessed the church. Why? I believe it was because of the
                transformation that occurred. We were on a journey of Spirit-empowered
                change, and this—more than experience and familiarity with beliefs
                and behaviors—created a relationship dynamic that changed people’s
                lives.
              kind: prose
              UID: MIN171.5.3.1.P.2
              page: 63
            - p: 3
              text: I do not say this to pat myself on the back—quite the contrary.
                I share it to reveal that I felt completely unqualified for the task.
                But because the Holy Spirit had complete freedom in that congregation,
                transformation was possible—and that enabled me to carry out God’s
                work there despite my lack of experience. I was committed, and God
                began to grow and develop what has become the Acts 2 process, because
                I was not content for us to stay where we were.
              kind: prose
              UID: MIN171.5.3.1.P.3
              page: 63
            - p: 4
              text: You may be reading this and thinking that the task before you—not
                just the fulfillment of the Great Commission but seeing revitalization
                in your church—is intimidating, discouraging, and humanly impossible.
                Satan may be insinuating that transformation is impossible, that the
                downward slide is inescapable, and that defeat for the church on earth
                is already spelled out in prophecy.
              kind: prose
              UID: MIN171.5.3.1.P.4
              page: 63
            - p: 5
              text: You may have lost hope.
              kind: prose
              UID: MIN171.5.3.1.P.5
            - p: 6
              text: You may feel under-qualified, insufficient, and underpowered for
                the task God has ahead of you and your congregation. You may feel
                locked into the “mom and pop” model where you are doing the entire
                ministry—and burning yourself out.
              kind: prose
              UID: MIN171.5.3.1.P.6
              page: 63
            - p: 7
              text: I would argue that if this is the case, you are in exactly the
                right place. We must recognize that we do not possess the power, ingenuity,
                and ability to pull this off. Only the transformative power of the
                Holy Spirit will allow us to rekindle the passion for evangelism and
                mission, change the climate of the church, and disciple a priesthood
                of believers within the church.
              kind: prose
              UID: MIN171.5.3.1.P.7
              page: 64
            - p: 8
              text: A Process for Ministry
              kind: heading
              UID: MIN171.5.3.1.P.8
              page: 64
            - p: 9
              text: I believe the process God instituted in Acts 2 provides us with
                the blueprint necessary to remodel how we do ministry, turn the tide,
                stay relevant with current and future generations, and carry out the
                task Jesus gave us before His ascension.
              kind: prose
              UID: MIN171.5.3.1.P.9
              page: 64
            - p: 10
              text: I have mentioned before that I lacked the process, and that is
                what God showed me in Acts 2; He provided the strategy, but the best
                strategy only works when we simultaneously embrace the power of the
                Holy Spirit.
              kind: prose
              UID: MIN171.5.3.1.P.10
              page: 64
            - p: 11
              text: We must never forget that the supernatural power of God was the
                defining element in the first-century church; it ushered in revival
                at various points in history, and it continues to transform lives
                and congregations to this day.
              kind: prose
              UID: MIN171.5.3.1.P.11
              page: 64
            - p: 12
              text: I have never felt qualified when entering any position I have
                held in ministry, and perhaps none of us are qualified to usher revitalization
                into the church. That simply means we all have a strong incentive
                to be totally dependent on God and the leading and power of the Holy
                Spirit. Truly, we can do nothing apart from Him—but with God, all
                things are possible. There is hope.
              kind: prose
              UID: MIN171.5.3.1.P.12
              page: 64
            - p: 13
              text: John and Susan McHaffie
              kind: heading
              UID: MIN171.5.3.1.P.13
              page: 64
            - p: 14
              text: Only a decade before John McHaffie arrived in Mount Vernon, Missouri,
                the church had been a thriving congregation of more than four hundred
                people, worshipping in a new facility. Over the tumultuous decade,
                however, leadership changes and other challenges eroded the vitality
                of the church. When John came, there were less than fifty people in
                the congregation, and the church was in poor financial shape.
              kind: prose
              UID: MIN171.5.3.1.P.14
              page: 64
            - p: 15
              text: John immediately had to make an excruciating decision to sell
                the building. Afterward, he held the small group of believers together
                as they met in various rented facilities. He knew something positive
                needed to happen.
              kind: prose
              UID: MIN171.5.3.1.P.15
              page: 64
            - p: 16
              text: In 2012, Pastor John gathered a team and attended an Acts 2 Journey
                to plan their turnaround. Today, they are a congregation of more than
                130 people on Sunday mornings, with nearly as many coming on Wednesday
                nights. They are meeting in a newly constructed building on choice
                property in the community. Their vision, their leadership team, their
                passion, and their strategic plan position them for a wonderful future.
              kind: prose
              UID: MIN171.5.3.1.P.16
              page: 65
            interactive_questions:
            - p: 1
              text: How can realizing one’s limitations and inability be a good thing?
              response: We must recognize that we do not possess the power, ingenuity,
                or ability to accomplish spiritual transformation. This is the first
                step in truly relying on the Holy Spirit, who can then work through
                us in powerful ways. Only the transformative power of the Holy Spirit
                can bring spiritual renewal and lasting change.
              UID: MIN171.5.3.1.IQ.1
            - p: 2
              text: In what ways is God’s plan for revitalizing a church the same
                as when He launched His church?
              response: We will always be completely dependent on His power and love,
                and our actions will always be to connect, grow, serve, go, and worship,
                just as the Church has always responded to His mission and purpose.
                UNIT 2
              UID: MIN171.5.3.1.IQ.2
            last_modified: '2026-03-27'
