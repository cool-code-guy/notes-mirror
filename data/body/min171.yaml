                growing in Christ and demonstrate a lifestyle corresponding to God’s
                Word.
              kind: list
              UID: MIN171.6.1.2.P.30
            - p: 31
              text: • Servant-Leaders—People who have grown in the direction, ways,
                and timing of the Lord and share their knowledge of Christ with others
                so they, too, can learn His direction, ways, and timing. They are
                involved in different aspects of church life (bus drivers, altar workers,
                greeters, deacons, Sunday school teachers, and so forth).
              kind: list
              UID: MIN171.6.1.2.P.31
            - p: 32
              text: • Reproducers—People who mentor others through relationship to
                the point where they become servant-leaders.
              kind: list
              UID: MIN171.6.1.2.P.32
            - p: 33
              text: The goal is for each believer to continually grow and mature,
                going from glory to glory. The classic example of this process is
                the life of Peter—the disciple who had such incredible highs and lows.
                Peter recognized Jesus as the Messiah, but moments later Jesus rebuked
                him for speaking for Satan. Peter is infamous as the disciple who
                stepped out of the boat and then sank when he took his eyes off Jesus
                and as the one who spoke so bravely about never leaving Jesus’ side
                but then ran off and later denied Jesus three times.
              kind: prose
              UID: MIN171.6.1.2.P.33
              page: 75
            - p: 34
              text: 'This same man, who could not find his voice in front of a servant
                girl, found apophthengomai —Spirit-inspired speech that empowered
                him to speak to thousands after Pentecost. He is also the same man
                who hypocritically associated with Judaizers, neglecting the Gentile
                believers after being the one who saw the vision of a sheet let down
                from heaven. This paved the way for the gospel to go to Gentiles.
                He is the same man who wrote 1 Peter and 2 Peter and who, according
                to tradition, is the first head of the church on earth. Peter knew
                the source of true spiritual life: the gospel of grace. In his second
                letter, he described a process of spiritual growth from virtuous choices
                to authentic love and then explained:'
              kind: prose
              UID: MIN171.6.1.2.P.34
              page: 75
            - p: 35
              text: For if these things are yours and abound, you will be neither
                barren nor unfruitful in the knowledge of our Lord Jesus Christ. For
                he who lacks these things is shortsighted, even to blindness, and
                has forgotten that he was cleansed from his old sins. Therefore, brethren,
                be even more diligent to make your call and election sure, for if
                you do these things you will never stumble; for so an entrance will
                be supplied to you abundantly into the everlasting kingdom of our
                Lord and Savior Jesus Christ. (2 Peter 1:8–11, NKJV)
              kind: quote
              UID: MIN171.6.1.2.P.35
              page: 75
            - p: 36
              text: This surely is the testimony of a man whose life as a believer
                was not a one-time event but a transformation process over time. He
                was never the same after Pentecost, nor was he a finished product—this
                fact should give all of us hope.
              kind: prose
              UID: MIN171.6.1.2.P.36
              page: 75
            - p: 37
              text: Like the process of spiritual growth Peter described, we are all
                in a state of becoming—none of us has arrived. We are discipleship
                works in progress.
              kind: prose
              UID: MIN171.6.1.2.P.37
              page: 75
            - p: 38
              text: We Have What They Want
              kind: heading
              UID: MIN171.6.1.2.P.38
              page: 75
            - p: 39
              text: This generation is hungry for experiences; today’s people are
                fascinated with the paranormal, superhuman, and mystical. They are
                hungry for heroes and powers greater than themselves, flocking to
                movies like Spider-Man, Superman, The Lord of the Rings, The Avengers,
                Twilight Saga, and even Star Wars and Star Trek.
              kind: prose
              UID: MIN171.6.1.2.P.39
              page: 75
            - p: 40
              text: A generation craving for experiences beyond the natural is looking
                for power and is preoccupied with the paranormal. From the brooding
                teen vampires of the Twilight Saga to the curious adolescent wizards
                in Harry Potter, stories of characters with extraordinary powers abound.
                Audiences may recognize the mythical nature of the stories, but they
                are entertained and inspired by heroes who rise above the masses and
                the challenges of a shifting, uncertain world.
              kind: prose
              UID: MIN171.6.1.2.P.40
              page: 75
            - p: 41
              text: 'All of the myths point to a fantastic story that is absolutely
                true: A great King has come to rescue His people. A great conflict
                threatens us all, but the King is the ultimate hero who sacrificed
                himself for us. Thankfully, our story is not a made-up myth. It is
                completely, absolutely, and wonderfully true! I believe this generation
                understands an underlying life truth—we know a reality beyond the
                material world and a greater power is at work in this universe.'
              kind: prose
              UID: MIN171.6.1.2.P.41
              page: 76
            - p: 42
              text: They are ripe for a transformative experience.
              kind: prose
              UID: MIN171.6.1.2.P.42
            - p: 43
              text: We should see ourselves as privileged to live in this time. Beyond
                gleaning symbolic truth from mythical characters, as followers of
                Christ we can experience a real presence and power beyond human capacity.
                We can be Spirit empowered.
              kind: prose
              UID: MIN171.6.1.2.P.43
              page: 76
            - p: 44
              text: What this generation desires, we possess—and can experience on
                a daily basis. And even more, through Spirit-empowered discipleship,
                we can impart this same transformative experience to a hungry generation!
              kind: prose
              UID: MIN171.6.1.2.P.44
              page: 76
            - p: 45
              text: Church leaders talk about how to reach Millennials (those born
                after 1980) and many are making church experiences seeker-friendly.
                I believe the key to staying relevant is not just changing up our
                worship services but also creating an environment where they can experience
                the power of the Holy Spirit.
              kind: prose
              UID: MIN171.6.1.2.P.45
              page: 76
            - p: 46
              text: We are all looking for better answers; however, it is not better
                answers we need but better questions. Our questions have focused on
                us—the people inside the church. The better questions are about them—the
                people outside our churches with whom we should be building relationships.
                The right questions will focus on them, and those better questions
                will give us the answers we need.
              kind: prose
              UID: MIN171.6.1.2.P.46
              page: 76
            - p: 47
              text: We must ask ourselves how well we are demonstrating this experience
                and how well we are participating in it. We have what this generation
                is hungry for, but do they even know we have it? Are we so busy being
                seeker-friendly that we are afraid to talk about the Holy Spirit when
                He should be our calling card with a generation that is hungry to
                experience His power?
              kind: prose
              UID: MIN171.6.1.2.P.47
              page: 76
            citations:
            - citekey: kinnaman2007
              pandoc: '[@kinnaman2007]'
              intext: (Kinnaman 2007)
              paragraph: MIN171.6.1.2.P.3
              UID: MIN171.6.1.2.C.1
            - citekey: mohler2016
              pandoc: '[@mohler2016]'
              intext: (Mohler 2016)
              paragraph: MIN171.6.1.2.P.4
              UID: MIN171.6.1.2.C.2
            interactive_questions:
            - p: 1
              text: Through what settings or ministry programs has your knowledge
                of God’s Word been enhanced?
              response: Answers are personal and will vary, but should include ministry
                efforts focused on biblical discipleship.
              UID: MIN171.6.1.2.IQ.1
            - p: 2
              text: What conclusion should the awareness of our own inadequacy help
                us to reach?
              response: God’s intervention and power alone can accomplish what is
                impossible by human effort alone. This teaches us to rely on God and
                cast our burdens upon Him, knowing that He will intervene to accomplish
                His work.
              UID: MIN171.6.1.2.IQ.2
            - p: 3
              text: How can we avoid making the Holy Spirit our last resort?
              response: By living a life of daily dependence on the Holy Spirit, we
                can rely upon His empowerment and guidance with every step along the
                way. This was modeled by Jesus as He lived a life of daily dependance
                on the guidance of the Father and the empowerment of the Spirit.
              UID: MIN171.6.1.2.IQ.3
            - p: 4
              text: Many Christians use the term “believer” in a different way than
                this definition suggests. How does that difference underscore a discipleship
                problem in today’s Church?
              response: Many today describe a cognitive decision to agree with the
                Bible’s teaching as defining a believer, without requiring the evidence
                of obedience (behavior), but belief that does not impact behavior
                is far from what is demonstrated in Scripture. Sadly, many think their
                agreement with the gospel is all that is necessary to be considered
                a follower of Christ.
              UID: MIN171.6.1.2.IQ.4
            - p: 5
              text: What does Peter advise for growing in spiritual maturity and fruitfulness?
              response: 'He advises each disciple to be diligent to make their call
                and election sure and to put into practice the things mentioned in
                2 Peter 1:5–7 (NIV): “to add to your faith, goodness; and to goodness,
                knowledge; and to knowledge, self-control; and to self-control, perseverance;
                and to perseverance, godliness; and to godliness, mutual affection;
                and to mutual affection, love.”'
              UID: MIN171.6.1.2.IQ.5
            - p: 6
              text: Jesus revealed the kingdom of God through demonstration of God’s
                power. How do you suppose this generation would respond to such evidence?
              response: Just as in Jesus’ generation, those in ours would be drawn
                to Him and then given the opportunity to put their faith in Him and
                become one of His disciples.
              UID: MIN171.6.1.2.IQ.6
            last_modified: '2026-03-27'
