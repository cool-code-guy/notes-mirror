            interactive_questions:
            - p: 1
              text: What is worshipful prayer?
              response: Worshipful prayer is the urgent, honest opening of a heart
                to God that the tax collector showed in Jesus’ parable in Luke 18.
                It is an expression of personal hunger.
              UID: MIN171.16.2.1.IQ.1
            - p: 2
              text: What are some key indicators of the condition of one’s heart?
              response: Indicators include genuine repentance, accountability with
                others, the quality of one’s personal devotions, time spent in God’s
                Word, and prayer. Other indicators include having a forgiving attitude
                towards others, having the right relationship priorities, financial
                priorities, and the fruit of the Spirit evident in one’s life. Answers
                may vary.
              UID: MIN171.16.2.1.IQ.2
            - p: 3
              text: How can recognizing discipleship as a journey for each individual
                and for the congregation impact our preaching?
              response: The discipleship we demonstrate in our own lives allows us
                to stand before disciples who are at various points in their own faith
                journeys and encourage them to continue along a spiritually fruitful
                path. We can inspire and empower others with our words.
              UID: MIN171.16.2.1.IQ.3
            - p: 4
              text: Although worship styles may differ, what should be the goal for
                musical worship in each congregation?
              response: The goal is to have a genuine expression of worship, not just
                a musical ritual.
              UID: MIN171.16.2.1.IQ.4
            - p: 5
              text: What are the results when God’s people engage in true worship?
              response: God is glorified, the Holy Spirit is ushered in, and his empowering
                energizes the entire congregation. Additional answers may vary.
              UID: MIN171.16.2.1.IQ.5
            - p: 6
              text: 'Finish this statement: I dream of a church where worship is...'
              UID: MIN171.16.2.1.IQ.6
            - p: 7
              text: Identify 3-5 “Worship” strategies that will help you pursue the
                vision and values you developed in Chapters 9 and 10.
              UID: MIN171.16.2.1.IQ.7
