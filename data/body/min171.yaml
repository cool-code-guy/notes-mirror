              paragraph: MIN171.14.2.1.P.2
              UID: MIN171.14.2.1.S.2
            text: Describe the importance of helping people discover their spiritual
              gifts and natural abilities in the journey of teaching them to serve.
            glossary: []
      - last_modified: '2026-03-27'
        title: Service Tools
        subobjectives:
          14.3.1:
            body:
            - p: 1
              text: Spiritual-gift assessments help individuals discover their gifts,
                but the assessment also benefits church leaders. When we help others
                discover their spiritual gifts and natural talents, we are investing
                in the most valuable resources within the church. I encourage church
                leaders to sow into their ministry staff and lay leaders in the congregation
                by helping them explore their spiritual gifts.
              kind: prose
              UID: MIN171.14.3.1.P.1
              page: 174
            - p: 2
              text: Assessment tools provide an inventory of the spiritual resources
                each individual can contribute to the body, and it is empowering to
                help people see the gifts that are most evident in their life experiences,
                current ministry efforts, and possible future church involvement.
                When people understand their gifts, it helps us fit them into ministry
                opportunities more confidently. It also helps us as leaders locate
                the right people to meet various needs within the body.
              kind: prose
              UID: MIN171.14.3.1.P.2
              page: 174
            - p: 3
              text: 'Assessment tools and surveys help to identify a person’s gifts
                and abilities, but these tools are not the complete answer. These
                instruments may be an accurate reflection of a person’s desire to
                serve God in a particular role, but the person may or may not have
                the God-given ability to serve effectively in that role. As we help
                people find their proper place in a role that inspires them and expands
                God’s kingdom, we need to encourage them to try different ministry
                opportunities to see where they thrive and excel. Let me offer another
                insight about the gifts: The Holy Spirit can take the improbable,
                unlikely, and least qualified people among us and use them in unimaginable
                ways. The Bible is filled with stories of unlikely candidates whom
                God used in extraordinary ways. Moses stuttered, Elijah got burned
                out and was fearful of Jezebel, Jeremiah was depressed, Thomas doubted,
                Paul was a murderer, and Peter had a short fuse. I could go on, but
                you get the point. The Holy Spirit can trump any flaw, disability,
                or inadequacy.'
              kind: prose
              UID: MIN171.14.3.1.P.3
              page: 174
            - p: 4
              text: I have found that the best way to help people find their place
                of ministry is to teach about spiritual gifts and lead people in a
                discovery activity. At the same time, trust your observations and
                depend on the Holy Spirit to guide.
              kind: prose
              UID: MIN171.14.3.1.P.4
              page: 174
            - p: 5
              text: Every congregation has a variety of ministry needs within the
                church and the community. As you learn the gifts and natural talents
                of your ministry staff and volunteers, you can help them get plugged
                into areas where they can use those gifts most effectively.
              kind: prose
              UID: MIN171.14.3.1.P.5
              page: 174
            - p: 6
              text: Perfection is not the goal here. While we want to help people
                serve in areas that are most aligned with their gifts, simply getting
                people involved and then fine-tuning their areas of service can help
                congregants contribute to the body of Christ and take ownership of
                the church and its various ministries.
              kind: prose
              UID: MIN171.14.3.1.P.6
              page: 174
            - p: 7
              text: A friend of mine likes to tell the story of a woman who had been
                teaching Sunday school for more than twenty years. He was a relatively
                new pastor at the church and after delivering a message on spiritual
                gifts, this woman came up to him and told him that although she had
                been teaching Sunday school for twenty-one years, it was not really
                her gift. Apparently, that was obvious, and the joke was that she
                had gotten stuck teaching Sunday school by walking too slowly in the
                hallway one day and letting the pastor at that time catch up with
                her. He had asked for a few weeks of help, and twenty-one years later
                she was still doing what he had asked her to do—not because it was
                her gift but because she was willing.
              kind: prose
              UID: MIN171.14.3.1.P.7
            - p: 8
              text: They were probably the longest “few weeks” of her life!
              kind: prose
              UID: MIN171.14.3.1.P.8
            - p: 9
              text: As they talked, it became obvious to my friend that she had gifts
                of hospitality, and he promised that in two weeks, he would find someone
                to take over her class so she could join the greeter team. Her eyes
                lit up! Everything began to change for her as she stepped into the
                role that fit her gifts, and God used her in incredible ways once
                she got to the right place.
              kind: prose
              UID: MIN171.14.3.1.P.9
              page: 175
            - p: 10
              text: Many people are serving in our churches because they are trying
                to be helpful, and that is commendable. But how much more effective
                would they be if we took the time to help them learn their gifts and
                place them in areas of service where they could excel?
              kind: prose
              UID: MIN171.14.3.1.P.10
              page: 175
            - p: 11
              text: Our churches are full of people who did not think they could serve
                or succeed in a certain capacity until someone believed in them. As
                leaders, that is our job—to see people as God’s masterpieces and encourage
                them to use the gifts He has given them. Every person has talents
                they can use for God’s glory and their own fulfillment.
              kind: prose
              UID: MIN171.14.3.1.P.11
              page: 175
            - p: 12
              text: Sometimes we may see a person’s gifts before they do. A friend
                tells a story of the need for a Sunday school teacher for a class
                of junior girls. After exhausting a list of the parents whose girls
                were that age, the volunteer leader told my friend that someone had
                been on his mind to lead the class. This young woman was still in
                high school, and there was no obvious indication that she had a teacher’s
                gifts. She was just a quiet, sweet-spirited girl—a bit of a wallflower.
              kind: prose
              UID: MIN171.14.3.1.P.12
              page: 175
            - p: 13
              text: The volunteer leader decided to invite her to become the teacher
                for that class, and over the next several months and years she became
                one of the best teachers that church had ever seen. Young girls flocked
                to her, and she had an enormous impact on many lives! To the natural
                eye, she did not seem a good fit to teach, but the Spirit prompted
                this leader to help her uncover her gifts by putting her in the right
                place to exercise them.
              kind: prose
              UID: MIN171.14.3.1.P.13
              page: 175
            - p: 14
              text: Often times people only need someone to believe in them and give
                them a chance to use their God-given gifts and abilities. Instead
                of simply taking advantage of a willing person, like the Sunday school
                teacher who served twenty-one years, the Holy Spirit’s inspiration
                can help us mine untapped potential in the people around us.
              kind: prose
              UID: MIN171.14.3.1.P.14
              page: 175
            - p: 15
              text: The point is not just to staff various church programs with gifted
                and talented individuals but to help disciples grow and develop by
                serving in ways that benefit both the body as a whole and the individual
                as a maturing believer.
              kind: prose
              UID: MIN171.14.3.1.P.15
              page: 175
            - p: 16
              text: When you begin to emphasize serving, there can be a down side,
                as well. Some people will get involved and prove to be ineffective.
                When I recruited people, I frequently put a sunset on their initial
                time of involvement. I might ask for a six-month commitment with an
                evaluation at the end of that time. If everything went well and they
                wanted to stay in the position, it would continue. If not, we would
                begin an exit strategy. Although it may be risky, releasing people
                to serve is well worth it.
              kind: prose
              UID: MIN171.14.3.1.P.16
            - p: 17
              text: It only takes one person serving to change a life, but in God’s
                economy, the math works a little differently. A lost person may come
                to Christ because one person volunteered to serve. An individual has
                been saved, but the life of the volunteer has changed as well—and
                so do the lives of all who are blessed when the new believer grows
                and matures by serving God and glorifying Him. The ripple effect of
                God’s blessing, power, and love is endless.
              kind: prose
              UID: MIN171.14.3.1.P.17
              page: 176
            - p: 18
              text: We serve a God of multiplication!
              kind: prose
              UID: MIN171.14.3.1.P.18
              page: 176
            interactive_questions:
            - p: 1
              text: Why are assessment tools only part of the answer?
              response: These assessment tools may be an accurate reflection of a
                person’s desire to serve God in a particular role, but the person
                may or may not have the God-given ability to serve effectively in
                that role. Or, an unlikely individual, whom God desires to use, may
                be overlooked in a particular area. The leading of God’s Spirit is
                essential. Additional answers may vary.
              UID: MIN171.14.3.1.IQ.1
            - p: 2
              text: How does discovering gifts lead to rewarding results?
              response: Christ’s followers become active for kingdom service, and
                God’s work is expanded. Needs are met through these gifts, and God
                is glorified. People grow in maturity as they use their gifts in service.
                Additional answers may vary.
              UID: MIN171.14.3.1.IQ.2
            - p: 3
              text: What are some benefits of having a specific time commitment and
                an evaluation for those who begin to serve in a ministry?
              response: The specific time commitment allows for the individual and
                pastoral leadership to evaluate and see if the ministry is a good
                fit. An exit strategy could be planned, or the individual could continue
                to serve if it is going well.
              UID: MIN171.14.3.1.IQ.3
            - p: 4
              text: 'Finish this statement: I dream of a church where serving is …'
              UID: MIN171.14.3.1.IQ.4
            - p: 5
              text: Identify 3-5 “Serve” strategies that will help you pursue the
                vision and values you developed in Chapters 9 and 10.
              response: Go 15 CHAPTER
              UID: MIN171.14.3.1.IQ.5
            last_modified: '2026-03-27'
            text: Identify the role and limitations of assessment tools to help God's
              people discover their gifts and use them in service.
            glossary: []
    - last_modified: '2026-03-27'
      title: 15 - Go
      lessons:
      - last_modified: '2026-03-27'
        title: Going Where God Sends You
        subobjectives:
          15.1.1:
            body:
            - p: 1
              text: 'Jay Martin was serving as a pre-sentence and probation officer
                for a circuit judge while he attended law school in Little Rock, Arkansas.
                As he performed his duties, he was overwhelmed by the number of African-American
                males he saw coming through the court. One of his duties was to record
                these individuals’ stories, and he began to notice common characteristics:
                single-mother households, drug charges, poverty.'
              kind: prose
              UID: MIN171.15.1.1.P.1
              page: 182
            - p: 2
              text: Jay wondered, What might change if someone intervened earlier
                in their lives? Could some be spared a future of crime if someone
                simply loved enough to care? Jay had come from a broken home himself,
                and he began to feel troubled by the young men who came through the
                court.
              kind: prose
              UID: MIN171.15.1.1.P.2
              page: 182
            - p: 3
              text: One day he went to lunch with the head probation officer, but
                they did not go to the hottest foodie destination in suburbia. Instead,
                they went to one of the impoverished areas where many of the people
                they saw in court came from. As they returned from lunch, they passed
                through an area that was boarded up and had all kinds of graffiti
                on the walls.
              kind: prose
              UID: MIN171.15.1.1.P.3
              page: 182
            - p: 4
              text: Jay asked the probation officer what that part of town was called.
                He gave him a knowing look and replied simply, “The projects.”
              kind: prose
              UID: MIN171.15.1.1.P.4
              page: 182
            - p: 5
              text: God put a desire to return to this area on Jay’s heart, and when
                the boarded-up areas reopened, he began to head there on Saturday
                mornings to play basketball. He went first in the spring of 1998—alone.
                That first day, he played basketball with one eight-year-old boy.
                He returned to play basketball every Saturday, slowly earning the
                trust of the boys who came to play.
              kind: prose
              UID: MIN171.15.1.1.P.5
              page: 182
            - p: 6
              text: Eventually, Jay left his position as a college and career ministry
                director for First Assembly of God in North Little Rock in order to
                focus his ministry attention on this area. He is still there today,
                having logged more than seventeen years of ministry in the Amelia
                B. Ives housing project.
              kind: prose
              UID: MIN171.15.1.1.P.6
              page: 182
            - p: 7
              text: While Jay started the work alone, he did not remain alone. First
                Assembly bought property and later added a more worship-friendly sanctuary,
                naming the church Metro Worship Center. Inspired by Matthew Barnett
                and the Los Angeles Dream Center, Metro began a homeless ministry.
                They bussed in homeless people from rescue missions for a 5:30 p.m.
                worship service—where Jay preached. Hot on the heels of this worship
                service, they bussed in students from the ten most challenged neighborhoods
                in Little Rock for ROCK Kids Ministry and Revolution Student Ministry.
              kind: prose
              UID: MIN171.15.1.1.P.7
              page: 182
            - p: 8
              text: Their efforts have inspired children, poverty-stricken families,
                and homeless people to become lifelong followers of Jesus Christ.
                Metro is passionate about building a bridge of relationship from the
                hearts of the displaced, desperate, and unchurched people of Little
                Rock to the heart of Jesus.
              kind: prose
              UID: MIN171.15.1.1.P.8
              page: 182
            - p: 9
              text: Additional ministries and events have caught on, including Camp
                Love, an activity they hold every summer, and an annual Thanksgiving
                dinner buffet that takes over the city fairgrounds. City leaders have
                embraced Metro’s efforts, disregarding party lines in their support,
                and those political opportunities have opened doors for Jay personally.
                As an evangelical Christian, pro-family, small-government guy, he
                was elected to the state legislature and later asked to serve as Majority
                Leader.
              kind: prose
              UID: MIN171.15.1.1.P.9
              page: 183
            - p: 10
              text: 'All the things God has done through this man’s willingness to
                go into the poorest areas of Little Rock could take up an entire chapter
                and more, but the point is not to glorify Jay. The opposite is true:
                Jay’s willingness and efforts to serve others glorify God! The point
                is that Jay is just an ordinary guy who was willing to go where God
                sent him. He could have been anyone.'
              kind: prose
              UID: MIN171.15.1.1.P.10
              page: 183
            - p: 11
              text: Any willing disciple of God can change the world, but we must
                go out into the world in order to make a difference.
              kind: prose
              UID: MIN171.15.1.1.P.11
              page: 183
            - p: 12
              text: The Future Hangs in the Balance
              kind: heading
              UID: MIN171.15.1.1.P.12
              page: 183
            - p: 13
              text: The future of the church hangs in the balance, and go is one of
                the most central factors in how that future will come together. Will
                we stay relevant, or will the church’s influence wane until it is
                impotent?
              kind: prose
              UID: MIN171.15.1.1.P.13
              page: 183
            - p: 14
              text: Leaders long for their churches to grow, for people to experience
                the transforming love of Jesus, for families to be healed, and for
                communities to enjoy reconciliation, but many of these leaders are
                perplexed by the lack of spiritual vitality. What is the problem?
                A church, like anything else, goes through stages. A new church plant
                has new members who grow through spiritual phases as the church grows.
                From birth to infancy to childhood to adolescence, believers grow
                like children—and with them, the church grows.
              kind: prose
              UID: MIN171.15.1.1.P.14
              page: 183
            - p: 15
              text: 'Mature believers are in their prime and should be creating disciples,
                using their growth and maturation to foster younger believers. The
                process should be beginning again and again in a constant flow of
                renewal: Mature Christians should help raise other growing, maturing
                Christians.'
              kind: prose
              UID: MIN171.15.1.1.P.15
              page: 183
            - p: 16
              text: Unlike people who grow old and eventually die, organizations have
                the capacity to reinvigorate themselves, to instill new energy and
                vitality, and to keep growing through countless stages. Unfortunately,
                organizations can also be like people, becoming stiff with age, looking
                backward instead of forward, and failing to find new sources of vitality
                for new growth. Once an organization reaches its prime it may plateau
                and experience declining growth. If the decline is not arrested and
                reversed, the organization can die.
              kind: prose
              UID: MIN171.15.1.1.P.16
              page: 183
            - p: 17
              text: We sometimes see this happen in congregations where the members’
                average ages are far older than the communities they serve. The congregation
                stagnates at some point, and too few new people come in to refresh
                the church with a new vision.
              kind: prose
              UID: MIN171.15.1.1.P.17
              page: 183
            - p: 18
              text: I believe the key they often miss is the process we call go, which
                changes the inward focus into an outward focus.
              kind: prose
              UID: MIN171.15.1.1.P.18
              page: 183
            - p: 19
              text: Every church needs new life, and since we cannot stop or turn
                back the aging process of the people who attend the church, the only
                way to seed new life into the church is through new people and new
                vision.
              kind: prose
              UID: MIN171.15.1.1.P.19
              page: 184
            - p: 20
              text: Though there are exceptions, most churches do not experience a
                regular flow of guests without being intentional about going out and
                inviting them to come. As new people become a part of the congregation,
                the church must invest in them and empower them. Churches that do
                not redirect resources to new ministries will typically lose the new
                people upon whom their future depends.
              kind: prose
              UID: MIN171.15.1.1.P.20
              page: 184
            - p: 21
              text: The unchurched would like to develop a real and sincere relationship
                with a Christian. Over 17 million people would accept Christ if presented
                with the gospel. Another 43 million are close. Dr. Thom Rainer (2003)
                pulls no punches when he writes, “I am convinced that the answer to
                all the troubling questions about the church in America is very simple.
                We Christians have become disobedient and lazy. Investing our lives
                in the lives of lost and unchurched people is inconvenient and messy.
                . . . The silence of Christians may be one of the greatest tragedies
                in the church today” (33, 51).
              kind: prose
              UID: MIN171.15.1.1.P.21
              page: 184
            citations:
            - citekey: ranier2003
              pandoc: '[@ranier2003]'
              intext: (Ranier 2003)
              paragraph: MIN171.15.1.1.P.21
              UID: MIN171.15.1.1.C.1
            interactive_questions:
            - p: 1
              text: What is the bridge that Metro is passionate about building?
              response: They are passionate about building a bridge of relationship
                from the hearts of the displaced and unchurched people of Little Rock,
                to the heart of Jesus.
              UID: MIN171.15.1.1.IQ.1
            - p: 2
              text: What process should be starting over and over again in the life
                of the church?
              response: Mature Christians should help raise up other growing and maturing
                Christians. This process should be beginning again and again in a
                constant flow of renewal.
              UID: MIN171.15.1.1.IQ.2
            - p: 3
              text: Why must new life be brought into the church?
              response: The only way to seed new life into the church is through new
                people and new vision.
              UID: MIN171.15.1.1.IQ.3
            - p: 4
              text: What three steps are essential to connecting new people to the
                church long-term?
              response: The three essential steps to connect new people to the church
                long-term are inviting them, investing in them, and ultimately empowering
                them.
              UID: MIN171.15.1.1.IQ.4
            last_modified: '2026-03-27'
            text: Explain why outward focus is essential to the health and future
              of a congregation.
            glossary: []
      - last_modified: '2026-03-27'
        title: Relational Evangelism
        subobjectives:
          15.2.1:
            body:
            - p: 1
              text: 'So what is the secret? More short-term missions? Long-term missions?
                The answer is simple—and yet difficult. While worldwide missions is
                a core component of go, many churches have seemingly chosen evangelistic
                complacency or missions work in other continents over the most needed
                and effective means of going into all the world: relational evangelism.
                We do not need one or the other; we need both!'
              kind: prose
              UID: MIN171.15.2.1.P.1
              page: 184
            - p: 2
              text: We need to understand what relational evangelism means, what it
                looks like, and how we do it. We are often willing to do second-hand
                evangelism because it means we will talk to anybody about Jesus as
                long as we do not have to see them again, but we are hesitant to share
                Christ with people we will see again. We are willing to travel overseas
                or go downtown and hand out tracts or talk to people because once
                we leave those environments, chances are we will never see those people
                again. Our neighbors are another story.
              kind: prose
              UID: MIN171.15.2.1.P.2
              page: 184
            - p: 3
              text: Too many of us are not willing to share with those nearest to
                us because we will see those people again and could be embarrassed.
                In addition, we are not willing to build relationships with people
                before we witness to them. We want to witness on the front end of
                a relationship, while effective witness has to come on the back end.
              kind: prose
              UID: MIN171.15.2.1.P.3
              page: 185
            - p: 4
              text: We must be willing to share Jesus in the context of relationship,
                and this is a new paradigm for many. Ninety-five percent of churches
                have never understood how to do this, although the statistics indicate
                that 99 percent of all people who know Jesus are saved because someone
                personally reached out to them. Yet we still ignore these facts, thinking
                that we can reach the lost without getting personally involved with
                the lost.
              kind: prose
              UID: MIN171.15.2.1.P.4
              page: 185
            - p: 5
              text: We want to share Jesus without risk, without getting “dirty.”
                We want to send money around the world for others to do it for us,
                and some of us will even go ourselves if there are no strings attached
                and we can walk away without a great deal of personal risk. Witnessing
                to our neighbors or coworkers is a completely different dynamic because
                it is risky and it requires that we be responsible for our daily actions.
              kind: prose
              UID: MIN171.15.2.1.P.5
              page: 185
            - p: 6
              text: Developing relationships with the lost before sharing the good
                news with them is a big shift. We must recognize that we have to earn
                the right to share Jesus before we can share Him.
              kind: prose
              UID: MIN171.15.2.1.P.6
              page: 185
            - p: 7
              text: This shift goes hand-in-hand with the concept of the priesthood
                of all believers, because our churches are not going to grow by sending
                missionaries overseas. They are going to grow when our people learn
                that it is their responsibility to invite guests from their daily
                life to church.
              kind: prose
              UID: MIN171.15.2.1.P.7
              page: 185
            - p: 8
              text: Part of the problem is that we have taught our people to stay
                away from the world. This hothouse mentality makes us want to spend
                all our time with other Christians so we will not be tainted by the
                people of the world. We have adopted a defensive posture instead of
                an offensive posture, partly out of this hothouse mentality and partly
                because we are afraid to offend—and be rejected.
              kind: prose
              UID: MIN171.15.2.1.P.8
              page: 185
            - p: 9
              text: We say the presence of God is manifested when we come together
                in church, but we have forgotten that we are the temples of the living
                God—we take His presence with us everywhere we go. His presence is
                not limited to the church building. When we walk into an office building
                full of unchurched people, we have brought the presence of God into
                that place.
              kind: prose
              UID: MIN171.15.2.1.P.9
              page: 185
            - p: 10
              text: Buildings cannot tell people about Jesus. He is not in a building.
                He is with His priests—each and every one of us who bears His name.
              kind: prose
              UID: MIN171.15.2.1.P.10
              page: 186
            - p: 11
              text: Engines for New Life
              kind: heading
              UID: MIN171.15.2.1.P.11
              page: 186
            - p: 12
              text: Does this mean evangelism does not or should not happen in church
                buildings? No, of course not—it simply means that too many people
                who sit inside the building expect the unsaved to come into the building,
                where the pastor will do the work of evangelism.
              kind: prose
              UID: MIN171.15.2.1.P.12
              page: 186
            - p: 13
              text: Membership surveys testify to the importance of lay ministry.
                Nearly 70 percent of first-time attendees come to church as a result
                of a personal invitation. Think what would happen if everyone in your
                church invited someone next Sunday. Dr. Thom Rainer’s research reports
                that “82 percent of the unchurched are at least ‘somewhat likely’
                to attend church if they were invited. . . . Only 21 percent of active
                churchgoers invite anyone to church in the course of a year. Only
                2 percent of church members invite an unchurched person to church”
                (Rainer 2003, 24–25).
              kind: prose
              UID: MIN171.15.2.1.P.13
              page: 186
            - p: 14
              text: Strategic plans to bring people into church are only as effective
                as our efforts to tackle the problem of relational evangelism. Without
                this, programs and initiatives are missing the point.
              kind: prose
              UID: MIN171.15.2.1.P.14
              page: 186
            - p: 15
              text: While this does not mean that we should not devise efforts to
                bring the unsaved into our churches, it does mean that the burden
                of ministry does not belong to the pastor; it belongs to each and
                every believer. When the people in your church grasp this paradigm
                shift, you can begin to implement methods of making your meetings
                a warm and welcoming place for believers to minister the gospel.
              kind: prose
              UID: MIN171.15.2.1.P.15
              page: 186
            - p: 16
              text: 'We call the efforts that most successfully draw new people into
                the church building “engines.” The most effective methods of bringing
                in new people fall into three categories: friends, neighbors, and
                strengths.'
              kind: prose
              UID: MIN171.15.2.1.P.16
              page: 186
            - p: 17
              text: First, look to your friends. The best place to find the unsaved
                is among the people your congregation members already connect with
                every day. Successful, growing churches have many people—not just
                the ministry staff—who own this responsibility and invite their friends
                to church. As we mentioned previously, many people want to come to
                church but are simply waiting for an invitation.
              kind: prose
              UID: MIN171.15.2.1.P.17
              page: 186
            - p: 18
              text: We must help our congregations understand that attracting new
                people is not the pastor’s job. Pastors are not paid to reach new
                people; they are paid to shepherd those who come. That does not mean
                that pastors cannot reach the lost as well. If we are going to see
                people in the pews become more engaged in evangelism, we must share
                stories of how we are engaging non-Christians.
              kind: prose
              UID: MIN171.15.2.1.P.18
              page: 187
            - p: 19
              text: A church leader in Canada made some statements I love. He asked
                his pastors to give the names of five non-Christians they were talking
                to, interacting with, and establishing relationships with. Then he
                said, “We can either lead from the pulpit or from the streets.”
              kind: prose
              UID: MIN171.15.2.1.P.19
              page: 187
            - p: 20
              text: 'It is our job as pastors and leaders to teach and disciple the
                people in our churches, equipping them for ministry. We must convey
                to each one that as believers they have a mandate to go into their
                worlds and make relationships with the hurting, the oppressed, and
                the sick so they may be helped and healed. Remember this: The building
                is not the church; the people inside the building are the church.'
              kind: prose
              UID: MIN171.15.2.1.P.20
              page: 187
            - p: 21
              text: There are many ways to make it easier for congregants to invite
                their friends, including special events and hospitality initiatives.
                In the end, however, it comes down to having relational evangelism
                as a core value and an active, intentional part of your church’s DNA.
              kind: prose
              UID: MIN171.15.2.1.P.21
              page: 187
            - p: 22
              text: The second engine is identifying your church’s “neighbors.” When
                you look for people to love, why not look “next door”? Plenty of people
                are your geographical neighbors; they drive or walk by your church
                every day.
              kind: prose
              UID: MIN171.15.2.1.P.22
              page: 187
            - p: 23
              text: Do not limit your thinking to blitzing neighborhoods and going
                door to door. Serving the community is a powerful testimony to those
                who need to know God. James admonished us to show people our faith
                by our works, and working in the community to draw in neighbors can
                be an excellent way to touch the lives of individuals who desperately
                need God.
              kind: prose
              UID: MIN171.15.2.1.P.23
              page: 187
            - p: 24
              text: This relates to the third engine, and that is to look to your
                church’s ministry strengths for ways to connect with new people. Every
                church has unique strengths, though some may not be obvious. Ask your
                ministry staff and trusted congregants what your church does well,
                and then do it extremely well in the context of reaching un-churched
                and under-churched people.
              kind: prose
              UID: MIN171.15.2.1.P.24
              page: 187
            - p: 25
              text: If your church excels at ministering with music, you might set
                up concerts in local parks. Grill some burgers and hot dogs, hand
                out cold drinks, and play excellent music. Play some songs everybody
                knows, and then introduce some God-focused worship music. You can
                revolutionize warm summer nights with a few good tunes and a cool
                drink.
              kind: prose
              UID: MIN171.15.2.1.P.25
              page: 187
            - p: 26
              text: Perhaps your church has a group of creative people. Get them busy
                with art shows or videos or web-based platforms that will attract
                other people as cool and creative as they are! There is no end to
                the creative things people can generate when the assignment is to
                make new friends.
              kind: prose
              UID: MIN171.15.2.1.P.26
              page: 188
            - p: 27
              text: Your church may have men who like to repair cars. Consider having
                a Single Mother’s Day where moms can get help maintaining and repairing
                their cars. While the men work on the cars, women can offer the moms
                a place where their kids can play while they enjoy a cup of coffee
                or tea and a chat with other moms from your church. Discover the needs
                of these single moms and determine what your church can do to help
                them.
              kind: prose
              UID: MIN171.15.2.1.P.27
              page: 188
            - p: 28
              text: Most of all, we must encourage the people in our churches not
                to be so afraid of rejection that they avoid engaging with people
                personally and relationally, for that is where real ministry happens.
              kind: prose
              UID: MIN171.15.2.1.P.28
              page: 188
            citations:
            - citekey: ranier2003
              pandoc: '[@ranier2003, 24–25]'
              intext: (Ranier 2003, 24–25)
              page: 24–25
              paragraph: MIN171.15.2.1.P.13
              UID: MIN171.15.2.1.C.1
            interactive_questions:
            - p: 1
              text: How does relational evangelism differ from our world missions
                efforts?
              response: Relational evangelism focused on reaching people with whom
                we will have an ongoing relationship. World missions efforts typically
                focus on reaching people we will never meet or never encounter again.
              UID: MIN171.15.2.1.IQ.1
            - p: 2
              text: How has something we have taught hinder relational evangelism?
              response: Believers are often taught to stay away from the world. A
                hothouse mentality develops that results in believers spending all
                their time with other Christians to avoid being tainted by the people
                of the world.
              UID: MIN171.15.2.1.IQ.2
            - p: 3
              text: How can relational evangelism contribute to developing a “priesthood
                of believers” mentality?
              response: Instead of the pastor taking the entire burden for evangelism,
                all of God’s people become involved. Building relationships with outsiders
                involves every believer—and includes the concept of the priesthood
                of all believers. Personal relationship building, personal ministry,
                and inviting people to church and ministry functions becomes the focus
                of the entire body.
              UID: MIN171.15.2.1.IQ.3
            - p: 4
              text: What are the three most effective engines for drawing people into
                the church?
              response: The three most effective “engines” or methods of bringing
                in new people are friends, neighbors, and your church’s ministry strengths.
              UID: MIN171.15.2.1.IQ.4
            - p: 5
              text: What are some ways we can make relational evangelism effective
                in the local church?
              response: Relational evangelism will be effective when it is a core
                value and an active, intentional part of your church’s DNA. Additional
                answers may vary.
              UID: MIN171.15.2.1.IQ.5
            - p: 6
              text: Why is serving your community a powerful way to connect with the
                church’s neighbors?
              response: When people encounter our heart for them through the good
                works of serving their needs, they become more open to the message
                we can bring.
              UID: MIN171.15.2.1.IQ.6
            last_modified: '2026-03-27'
            text: Summarize the concept of relational evangelism, and analyze its
              potential impact.
            glossary: []
      - last_modified: '2026-03-27'
        title: Using Your Strengths
        subobjectives:
          15.3.1:
            body:
            - p: 1
              text: 'One of our Acts 2 Journey facilitators tells the story of brainstorming
                with a room full of pastors and their dream teams about the strengths
                of their churches. He noticed that one small church was not fully
                participating in the discussion, and, eventually, he had heard from
                every church except this one. The pastor was in his early sixties,
                and everyone in the leadership group was in that age bracket or beyond.
                Finally, he addressed them directly: “What about you guys? What are
                you good at?”'
              kind: prose
              UID: MIN171.15.3.1.P.1
              page: 188
            - p: 2
              text: They were silent for a little while, and the facilitator began
                to feel bad for singling them out, but after a short delay, the pastor’s
                wife blurted out, “Funerals!”
              kind: prose
              UID: MIN171.15.3.1.P.2
              page: 188
            - p: 3
              text: Everyone in the room laughed good-naturedly, and the facilitator
                asked what she meant.
              kind: prose
              UID: MIN171.15.3.1.P.3
              page: 188
            - p: 4
              text: “Well,” she said, “when we have a funeral, our ladies do an incredible
                funeral dinner. The food they prepare for the family is amazing! And
                though a lot of our men do not have suits, they come dressed in the
                best clothes they have got and do a great job of being gracious and
                caring for the family as they grieve.” She looked over at her husband,
                perhaps deciding whether or not to go on, and said, “My husband is
                a good preacher on Sunday, but he is an amazing preacher at funerals!”
              kind: prose
              UID: MIN171.15.3.1.P.4
              page: 188
            - p: 5
              text: Her husband slumped down in his chair a little bit, embarrassed
                that funerals were his best strength, but he nodded his head like
                he knew it was true. Before the facilitator could say anything more,
                the pastor’s wife said, “I know what we can do! We can call the local
                funeral home and tell them that anytime a grieving family does not
                have a church to help with the funeral, we can do it! That can be
                our outreach! Our ladies can cook the meal, our guys can usher, and
                my husband can preach an amazing service and minister to those hurting
                people.”
              kind: prose
              UID: MIN171.15.3.1.P.5
              page: 188
            - p: 6
              text: It turns out the local funeral home did perhaps a dozen such funerals
                a year, and this church was able to help families in this way about
                once a month. They walked out of the room excited to have a strategy
                that used their strengths to go outside the walls of their church
                and gave them a vital outward focus.
              kind: prose
              UID: MIN171.15.3.1.P.6
              page: 189
            - p: 7
              text: Food Service
              kind: heading
              UID: MIN171.15.3.1.P.7
              page: 189
            - p: 8
              text: Maybe your church’s strength is not funerals, but you have a strength.
                Do not let size intimidate you. You can have a high-impact church
                even in a small community because the principles God built the church
                upon are not about size. I love hearing stories about how individuals
                and churches are making impacts on their communities and seeing people
                saved, because go is not limited to big churches with big budgets.
              kind: prose
              UID: MIN171.15.3.1.P.8
              page: 189
            - p: 9
              text: Dave Campbell pastors a small church in Timbo, Arkansas, a town
                that has fewer than one-hundred inhabitants. The last time I visited
                the church, 117 people were present for a service, but what I love
                about them has nothing to do with numbers. While their church routinely
                gives sacrificially to missions, they have a passion for relational
                evangelism and outward focus that I find truly inspiring.
              kind: prose
              UID: MIN171.15.3.1.P.9
              page: 189
            - p: 10
              text: A tornado once ripped through their tiny town and knocked out
                the power there and in the adjacent, larger town of Mountain View.
                The storm devastated these communities, leaving many people homeless
                and struggling to clean up the debris, to get the power running, or
                even to cook a meal.
              kind: prose
              UID: MIN171.15.3.1.P.10
              page: 189
            - p: 11
              text: Just four days after the tornado, Dave and a few of the men from
                his church headed over to Mountain View to see what they could do
                to help. They arrived just as a disaster relief team was packing up
                their station in a local grocery store’s parking lot. When Dave asked
                why they were leaving when the needs were just coming in, the relief
                worker told him, “We are just disaster relief. We can stay four days,
                and then we are gone.”
              kind: prose
              UID: MIN171.15.3.1.P.11
              page: 189
            - p: 12
              text: Dave and his men looked at the needs of that community and decided
                they would do what they could to help. They pulled an old smoker over
                to the parking lot, and he and his guys started cooking food. Someone
                gave them a grill, and the grocery store gave them produce they could
                not sell anymore because they could not keep it refrigerated. Dave
                and his men fed so many people they were cooking long after midnight.
                If someone arrived and was hungry, they got up and cooked food—any
                time, day or night.
              kind: prose
              UID: MIN171.15.3.1.P.12
              page: 189
            - p: 13
              text: Dave put out a cot and slept in that parking lot for six days
                and nights, serving roughly 1,500 meals a day and being available
                twenty-four hours a day. He told me that some days they did not know
                where the food would come from, but as they ran out, people would
                bring more food from their powerless freezers. They cooked everything
                from salmon to hot dogs; whatever people brought, they cooked.
              kind: prose
              UID: MIN171.15.3.1.P.13
              page: 189
            - p: 14
              text: As Dave and his team served the people of Mountain View, others
                began to volunteer, and the food ministry created amazing relationships
                between the people of these communities, Dave, and the church. It
                gave them unparalleled access to people who would normally never set
                foot inside a church, including the meth makers who came out of the
                wooded hills for help.
              kind: prose
              UID: MIN171.15.3.1.P.14
              page: 189
            - p: 15
              text: God got a hold of one of these men who had run a methamphetamine
                lab up in the hills. He got saved and exchanged running a meth lab
                for running a prison ministry, reaching out to the people who used
                to buy drugs from him.
              kind: prose
              UID: MIN171.15.3.1.P.15
              page: 189
            - p: 16
              text: Dave watched God not only show His goodness and love to the people
                of those rural towns as he and his men fed them and helped them in
                practical ways—Dave’s church also saw the impact of all those touched
                lives.
              kind: prose
              UID: MIN171.15.3.1.P.16
              page: 190
            - p: 17
              text: 'A pastor friend of Dave’s, Bob Caldwell, shared with me what
                God was doing in his community as well. Eleven years before we spoke,
                God had impressed a Scripture on him: Matthew 25 is where Jesus says
                that when He was hungry and thirsty and naked, some fed and clothed
                Him while others did not.'
              kind: prose
              UID: MIN171.15.3.1.P.17
              page: 190
            - p: 18
              text: At the time, Bob’s church had only a few families in it, but he
                challenged them each to give a dollar a day for a month so they could
                start a food bank ministry. He had thirty people each give a dollar
                a day, starting their food bank with nine-hundred dollars. Because
                it was such a tight-knit community, a local Baptist church gave them
                another five hundred dollars, and with these funds, they began feeding
                people. Over the years, they experienced problems because they had
                to learn how to run a food ministry, but it survived. Three years
                after they started, Diane Sawyer brought a film crew from ABC to do
                a story on how they were feeding two thousand a month—in a town of
                four-hundred people.
              kind: prose
              UID: MIN171.15.3.1.P.18
              page: 190
            - p: 19
              text: Bob now has thirty other outlets like the one that began in his
                church, and they feed eight-thousand people a month who would otherwise
                go hungry. Because of their work in the community and the trust and
                relationship it has fostered, his church plans to start multiple services.
              kind: prose
              UID: MIN171.15.3.1.P.19
              page: 190
            - p: 20
              text: Bob’s son, Josh, was preaching in a nearby town when a young man
                named Bubba walked up to him and said, “I have only met one other
                Caldwell in my life. When I was nine years old, he walked up to our
                porch to see my daddy and gave him a box of food. Do you know that
                guy?”
              kind: prose
              UID: MIN171.15.3.1.P.20
              page: 190
            - p: 21
              text: “That was my dad,” Josh replied.
              kind: prose
              UID: MIN171.15.3.1.P.21
            - p: 22
              text: Bubba then shared the story about how Pastor Caldwell first met
                his family. One day, a man showed up at their door—a preacher, inviting
                them to church. “My name is Brother Caldwell,” he introduced himself,
                “and I would love to invite you to visit our church next Sunday.”
              kind: prose
              UID: MIN171.15.3.1.P.22
              page: 190
            - p: 23
              text: Bubba said his father, James, was not receptive to the invitation.
                He said, “Do not bother us! I know you are just trying to do your
                job by inviting us to church, but I am not interested. Me and the
                ‘Man Upstairs’ do not have a good relationship. I am not interested.
                Do not bother me anymore.”
              kind: prose
              UID: MIN171.15.3.1.P.23
              page: 190
            - p: 24
              text: As the pastor was leaving, he noticed they were all eating popcorn.
                He said to James, “It is a little early to be eating a snack, isn’t
                it?” My dad replied, “It’s not a snack. This is what I’ve been feeding
                my family for the last three weeks.” Brother Caldwell left and told
                his wife about the incident. They were so moved by the needs of this
                family that they took their grocery money and bought a box of food
                to take back to the family. When they knocked on the door, James came
                to the door and said, “I told you not to bother me anymore.” Pastor
                Caldwell said, “I saw that you didn’t have much to eat. My wife and
                I decided that if my kids had something to eat, we wanted your kids
                to have something, as well. If you will accept this box of food, you
                may have it.” At that moment, my daddy started crying and said, “What
                time does church start tomorrow morning?” They attended for the next
                two Sundays, and on the second Sunday, the entire family came to the
                altar and got saved.
              kind: prose
              UID: MIN171.15.3.1.P.24
              page: 190
            - p: 25
              text: I love this story because we can easily get preoccupied with visions
                of well-developed ministries, but hearing how a food ministry like
                Bob Caldwell’s got started should remind us of the smaller things
                we can do to show Christ’s love to a needy world. The nature of the
                call on Bob’s life did not change—he is still feeding people—but it
                began with small, humble actions like this one.
              kind: prose
              UID: MIN171.15.3.1.P.25
              page: 191
            - p: 26
              text: Your church and your vision do not have to be big for your actions
                to have a big impact on the people around you.
              kind: prose
              UID: MIN171.15.3.1.P.26
              page: 191
            - p: 27
              text: We cannot just wait for people to come into our churches to meet
                Jesus; we must go out and show Him to them.
              kind: prose
              UID: MIN171.15.3.1.P.27
              page: 191
            - p: 28
              text: Open Doors for the Truth
              kind: heading
              UID: MIN171.15.3.1.P.28
              page: 191
            - p: 29
              text: Each church has strengths. Your church can do something to turn
                your focus outward, whether it is having funerals or cooking food.
                Concerts, rallies, food and clothing drives, and other special outreach
                events are all amazing ways to connect with new people.
              kind: prose
              UID: MIN171.15.3.1.P.29
              page: 191
            - p: 30
              text: 'So is teaching the truth! So, how do you get new people to want
                to listen to the truth? It is simple: meet their needs.'
              kind: prose
              UID: MIN171.15.3.1.P.30
              page: 191
            - p: 31
              text: Marriage and parenting events offer valuable help to struggling
                families. Many people have never seen a good model to emulate and
                have never learned a biblical perspective of marriage and rearing
                children.
              kind: prose
              UID: MIN171.15.3.1.P.31
              page: 191
            - p: 32
              text: Finance seminars can bring wisdom to a debt-laden community. Counseling
                ministries can offer hope when life has grown bigger than people can
                manage. If your church is in an ethnically diverse community, classes
                that teach English can help uplift and empower people. Recovery groups
                for the addicted or abused can make your church a place of hope for
                hurting people.
              kind: prose
              UID: MIN171.15.3.1.P.32
              page: 191
            - p: 33
              text: Many churches with excellent teachers limit their gifts to the
                congregation. Some Sunday school teachers or children’s ministers
                may never use their ministry gifts outside the building, so we must
                help them take their gifts outside the four walls of the church. Leaders
                within the church can make excellent mentors, such as at the local
                YMCA, by volunteering with kids’ sports camps. Elementary schools
                need classroom helpers, and parents can always use a safe, wholesome
                place for their kids to go for a “parents’ night out.” When you invest
                in the kids, you invest in the future in more ways than church attendance.
              kind: prose
              UID: MIN171.15.3.1.P.33
              page: 191
            - p: 34
              text: The list of opportunities is endless and only limited by your
                imagination! When you serve others, you will find new friends—and
                these new people will be the life of your church in the future.
              kind: prose
              UID: MIN171.15.3.1.P.34
              page: 192
            - p: 35
              text: The Goal
              kind: heading
              UID: MIN171.15.3.1.P.35
              page: 192
            - p: 36
              text: The goal in all of this is to extend love and friendship to those
                outside the church—to build relationships! The point is to use our
                strengths, geographic location, and friendship circles to make friends
                and connections. Every church has some combination of these, even
                churches who are “only good at funerals”!
              kind: prose
              UID: MIN171.15.3.1.P.36
              page: 192
            - p: 37
              text: Do not let excuses keep you from exploring your opportunities.
                An aging congregation may have lost the energy for community service
                and may not engage in the most modern music or technology, but they
                may find they are better at loving than anyone else. As parents and
                grandparents, they have had the most practice and have seen most of
                the hardships life has to offer, so they can offer great empathy and
                godly wisdom.
              kind: prose
              UID: MIN171.15.3.1.P.37
              page: 192
            - p: 38
              text: Every church has at the least one outstanding strength.
              kind: prose
              UID: MIN171.15.3.1.P.38
            - p: 39
              text: Remember that people came to Jesus because of His power to heal,
                His accessible teaching, and His love and compassion. For these reasons
                and many more, people came running to Jesus—and they still do. We
                must look for ways to empower, teach, disciple, and show love and
                compassion to people who need to see Jesus in our lives. But they
                will not see Him if we do not go to them!
              kind: prose
              UID: MIN171.15.3.1.P.39
              page: 192
            - p: 40
              text: 'If we will look carefully at our churches, we will discover a
                unique evangelism DNA for each one. When we do, we must aim at the
                target: people outside our doors. We can waste a lot of energy trying
                to fix our weaknesses; this is exhausting and frustrating. But when
                we pour our best efforts into our strengths, we will find energy we
                did not know we had.'
              kind: prose
              UID: MIN171.15.3.1.P.40
              page: 192
            - p: 41
              text: An aging church is not destined to pass out of relevance; it simply
                needs to be renewed. It is not enough to simply bring up a new generation
                of young people in a church; there is too big of a gap in generations.
                New life requires new people, and connecting with them requires that
                we go into all the world and show them the love of Jesus.
              kind: prose
              UID: MIN171.15.3.1.P.41
              page: 192
            - p: 42
              text: It can be helpful to find out what unbiased impressions people
                in the community have of our churches. Try to learn why visitors come—and
                whenever possible, even be willing to ask the hard question of why
                visitors do not stay. The answers may be difficult to receive, but
                putting our heads in the sand will not help. We must ask challenging
                questions and be willing to accept hard answers if we want to create
                lasting change.
              kind: prose
              UID: MIN171.15.3.1.P.42
              page: 192
            - p: 43
              text: Go is about missions programs and overseas efforts. It is about
                reaching unreached people groups around the world in every way possible,
                from our neighbors to the farthest corners of the earth. In fact,
                if your church is not giving to worldwide evangelism, I doubt that
                anything else I have written about will be very effective. We must
                help missionaries go to places where the name of Jesus is not known,
                but we must also help the people in our churches to go into our backyards,
                our neighborhoods, and our cities. It is not about throwing money
                at evangelism; it is about building relationships with people who
                need Jesus by bringing the presence of God everywhere we go.
              kind: prose
              UID: MIN171.15.3.1.P.43
              page: 193
            - p: 44
              text: Outward Focus
              kind: heading
              UID: MIN171.15.3.1.P.44
              page: 193
            - p: 45
              text: You are probably familiar with the story of the woman at the well
                from John 4. Jesus had a conversation with a Samaritan woman, and
                there are many reasons why that conversation should never have happened.
                He was a Jewish man; she was a Samaritan woman. He was the Son of
                God; she was living in sin.
              kind: prose
              UID: MIN171.15.3.1.P.45
              page: 193
            - p: 46
              text: But the real story may be what happened after their conversation.
                We read in the text that the disciples were not present for the conversation
                because they were buying food in the town. When they returned from
                town, they saw Jesus talking to the woman but nobody asked what their
                conversation was about. The fact that no one even brought it up is
                incredible to me because it was such a striking incongruity that Jesus
                was talking to a Samaritan woman.
              kind: prose
              UID: MIN171.15.3.1.P.46
              page: 193
            - p: 47
              text: 'Yet nobody asked about the conversation. Why not? A very simple
                answer: Their minds are on something else . . . lunch.'
              kind: prose
              UID: MIN171.15.3.1.P.47
              page: 193
            - p: 48
              text: They offered Jesus something to eat, but He was still focused
                on what had just happened. He talked to them about the harvest—it
                was not a long way off but was right in front of them.
              kind: prose
              UID: MIN171.15.3.1.P.48
              page: 193
            - p: 49
              text: He was saying that the kingdom of God had just walked past them
                on her way back into town—and they had missed it because they were
                focused on lunch.
              kind: prose
              UID: MIN171.15.3.1.P.49
              page: 193
            - p: 50
              text: We face this challenge every day. We must be careful not to have
                our eyes set on such a distant goal that we miss what is right in
                front of us. We cannot be so focused on missions overseas or what
                we might do next year or the next that we forget the people around
                us who need our help today.
              kind: prose
              UID: MIN171.15.3.1.P.50
              page: 193
            - p: 51
              text: God wants us to engage the “women at the well” around us. This
                is the definition of outward focus—lifting our eyes from the distant
                goal in order to perceive the people already around us, near and far.
              kind: prose
              UID: MIN171.15.3.1.P.51
              page: 193
            - p: 52
              text: This is what go is all about.
              kind: prose
              UID: MIN171.15.3.1.P.52
              page: 193
            interactive_questions:
            - p: 1
              text: What ministry strengths does your congregation possess?
              response: Answers will vary.
              UID: MIN171.15.3.1.IQ.1
            - p: 2
              text: How can relational evangelism through acts of service open doors
                for the gospel?
              response: Relational evangelism through acts of service demonstrates
                the love and compassion of Christ for people and breaks down many
                of the walls between us and those in our community.
              UID: MIN171.15.3.1.IQ.2
            - p: 3
              text: In what ways have you seen a congregation aim its strengths outwardly
                into their community?
              response: Answers will vary.
              UID: MIN171.15.3.1.IQ.3
            - p: 4
              text: What three things can be used to help us connect with new people?
              response: Our strengths, our geographical location, and our friendship
                circles can help us connect with new people.
              UID: MIN171.15.3.1.IQ.4
            - p: 5
              text: Why is it often more effective to maximize our strengths than
                to try to fix our weaknesses?
              response: Often something is a weakness because we lack the ability
                or resources to do better. Our strengths can generate a momentum that
                can maximize our current possibilities, and perhaps bring others with
                abilities and resources we currently lack to help us improve the areas
                where we are weak.
              UID: MIN171.15.3.1.IQ.5
            - p: 6
              text: What does go include in addition to friendship evangelism in the
                local church?
              response: Go includes missions programs and overseas efforts. It includes
                reaching unreached people groups around the world and worldwide evangelism.
                This means building relationships with people who need Jesus by bringing
                the presence of God everywhere we go.
              UID: MIN171.15.3.1.IQ.6
            - p: 7
              text: 'Finish this statement: I dream of a church where evangelism is
                …'
              UID: MIN171.15.3.1.IQ.7
            - p: 8
              text: Identify 3-5 “Go” strategies that will help you pursue the vision
                and values you developed in Chapters 9 and 10.
              response: Worship 16 CHAPTER
              UID: MIN171.15.3.1.IQ.8
            last_modified: '2026-03-27'
