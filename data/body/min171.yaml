            - p: 250
              text: Creating the Concise Vision Statement
              kind: heading
              UID: MIN171.17.2.1.P.250
              page: 226
            - p: 251
              text: 'Once you begin to imagine how the five functions could look in
                your church, you can see the impact a vision statement will have in
                focusing your church to go to the next level. This process allows
                us to discover and develop the pattern for our future. Our process
                going forward will include these three key focus points:'
              kind: prose
              UID: MIN171.17.2.1.P.251
              page: 226
            - p: 252
              text: Vision (Where we are going) . A definition of the outcomes for
                our hopes, energy, finances, and ministries.
              kind: prose
              UID: MIN171.17.2.1.P.252
              page: 226
            - p: 253
              text: Values (How we behave) . The guardrails to keep us on the pathway
                toward fulfilling our vision.
              kind: prose
              UID: MIN171.17.2.1.P.253
            - p: 254
              text: Strategic Plan . The pathway to fulfill the vision.
              kind: prose
              UID: MIN171.17.2.1.P.254
            - p: 255
              text: 'Remember , your concise vision statement should bring focus to
                three key relationships: (1) vertical to God, (2) horizontal to the
                church, and (3) horizontal to the lost. This vision statement should
                be clear, thought-provoking, and easy for people to remember.'
              kind: prose
              UID: MIN171.17.2.1.P.255
            - p: 256
              text: Below are a few concise vision statements to assist you in discovering,
                developing, and communicating the vision of your church.
              kind: prose
              UID: MIN171.17.2.1.P.256
              page: 226
            - p: 257
              text: Sample Concise Vision Statements
              kind: prose
              UID: MIN171.17.2.1.P.257
            - p: 258
              text: “Love God; Love People; Pass It On”
              kind: prose
              UID: MIN171.17.2.1.P.258
            - p: 259
              text: “Honor God; Live the Faith; Reach the World”
              kind: prose
              UID: MIN171.17.2.1.P.259
            - p: 260
              text: “Love God; Live the Life; Share Christ”
              kind: prose
              UID: MIN171.17.2.1.P.260
            - p: 261
              text: “Connect with God; Use your Gifts; Love People”
              kind: prose
              UID: MIN171.17.2.1.P.261
            - p: 262
              text: “Loving God, Loving People, Serving the Community”
              kind: prose
              UID: MIN171.17.2.1.P.262
            - p: 263
              text: Working with your team, agree on a concise vision statement that
                is ten words or less and that represents all five functions, either
                specifically or inferred. It should be vertical to God, horizontal
                to the church family, and horizontal to reaching the lost.
              kind: prose
              UID: MIN171.17.2.1.P.263
            - p: 264
              text: Vision Statement
              kind: list
              UID: MIN171.17.2.1.P.264
              page: 226
            - p: 265
              text: 'As you review your congregational vision based on the Five Functions
                of the Acts 2 process and your concise vision statement, ask and answer
                the following questions:'
              kind: prose
              UID: MIN171.17.2.1.P.265
              page: 226
            - p: 266
              text: Does it encompass the biblical functions from Acts 2?
              kind: prose
              UID: MIN171.17.2.1.P.266
              page: 226
            - p: 267
              text: Is it clear and understandable?
              kind: prose
              UID: MIN171.17.2.1.P.267
              page: 226
            - p: 268
              text: Can your congregation put it into practice?
              kind: prose
              UID: MIN171.17.2.1.P.268
              page: 226
            - p: 269
              text: Is it vital and urgent to your church?
              kind: prose
              UID: MIN171.17.2.1.P.269
              page: 226
            - p: 270
              text: Is it future focused?
              kind: prose
              UID: MIN171.17.2.1.P.270
              page: 226
            - p: 271
              text: Does it require faith to fulfill?
              kind: prose
              UID: MIN171.17.2.1.P.271
              page: 226
            - p: 272
              text: Does it matter?
              kind: prose
              UID: MIN171.17.2.1.P.272
              page: 226
            - p: 273
              text: Will it take you to the next level?
              kind: prose
              UID: MIN171.17.2.1.P.273
              page: 226
            - p: 274
              text: Introduction to Core Values
              kind: heading
              UID: MIN171.17.2.1.P.274
              page: 227
            - p: 275
              text: A church’s core values give its members a sense of direction and
                an awareness of what matters most in the life of the church. They
                drive priorities, shape attitudes and actions, direct processes, govern
                relationships, and articulate what the church stands for.
              kind: prose
              UID: MIN171.17.2.1.P.275
              page: 227
            - p: 276
              text: 'In Ministry Nuts and Bolts: What They Don’t Teach Pastors in
                Seminary , Aubrey Malphurs (2009) expands this idea by observing:'
              kind: prose
              UID: MIN171.17.2.1.P.276
              page: 227
            - p: 277
              text: Core values are fundamental to all that the organization does.
                They are what distinguishes one ministry from another, and they explain
                why some people are attracted to your church while others are repelled.
                They dictate personal involvement. If an individual’s core values
                align with the ministry’s, that individual is more likely to invest
                his or her life in that ministry. Values communicate what is essential—
                the organization’s bottom line. Thus, core values define what you
                believe is God’s heart for your ministry or church (17).
              kind: prose
              UID: MIN171.17.2.1.P.277
              page: 227
            - p: 278
              text: Core values are the DNA of the church.
              kind: prose
              UID: MIN171.17.2.1.P.278
            - p: 279
              text: Core values influence behavior. They direct how the congregation
                acts based on what it believes about itself, the world, and its role
                as part of God’s mission in and to the world.
              kind: prose
              UID: MIN171.17.2.1.P.279
            - p: 280
              text: Core values determine attitudes and actions on a daily basis and
                in times of celebration and conflict.
              kind: prose
              UID: MIN171.17.2.1.P.280
            - p: 281
              text: Core values are the priorities in the ministry programming for
                the future vision
              kind: prose
              UID: MIN171.17.2.1.P.281
            - p: 282
              text: Core values are to be shared and modeled to new members.
              kind: prose
              UID: MIN171.17.2.1.P.282
            - p: 283
              text: Core values are protected by the staff and key leaders.
              kind: prose
              UID: MIN171.17.2.1.P.283
            - p: 284
              text: Core values are used to measure all ministry programs for spiritual
                effectiveness, financial commitment, and achievement of purpose.
              kind: prose
              UID: MIN171.17.2.1.P.284
            - p: 285
              text: Core values are to be lived out in the daily lives of the congregation.
              kind: prose
              UID: MIN171.17.2.1.P.285
            - p: 286
              text: Core values represent the core identity of the church and reflect
                how the congregation will live into its preferred future. They create
                boundaries for church life and must be identified and communicated
                for the church to reach its full Kingdom potential.
              kind: prose
              UID: MIN171.17.2.1.P.286
            - p: 287
              text: Uncovering the Difference between Core Values and Personal Preferences
              kind: heading
              UID: MIN171.17.2.1.P.287
              page: 227
            - p: 288
              text: Some elements can often seem like core values when they are something
                completely different. While many people in our churches may not understand
                core values, they do understand convictions. Biblical convictions
                are Spirit-directed boundaries for our core values. However, when
                core values become disconnected or wrongly derived from Scripture,
                unhealthy convictions take over.
              kind: prose
              UID: MIN171.17.2.1.P.288
              page: 227
            - p: 289
              text: Some convictions are not as connected to the Holy Spirit as people
                suppose. Unhealthy convictions can stem from personal issues or hurts
                that are masked by insisting that the issue in question is a spiritual
                conviction. When leaders fail to discern the difference between biblical
                convictions and more personal, dominant ones, the church’s vision
                can be redirected and influenced in unhealthy directions.
              kind: prose
              UID: MIN171.17.2.1.P.289
              page: 227
            - p: 290
              text: 'From Scripture, we know of three levels of conviction:'
              kind: prose
              UID: MIN171.17.2.1.P.290
            - p: 291
              text: 1. Biblical absolutes
              kind: prose
              UID: MIN171.17.2.1.P.291
            - p: 292
              text: 2. Community standards
              kind: prose
              UID: MIN171.17.2.1.P.292
            - p: 293
              text: 3. Personal convictions
              kind: prose
              UID: MIN171.17.2.1.P.293
            - p: 294
              text: These conviction levels begin with scriptural directives and move
                toward the beliefs and behaviors people choose in their own spiritual
                growth. Discerning the differences in these categories affects not
                only individuals but the church as well.
              kind: prose
              UID: MIN171.17.2.1.P.294
              page: 227
            - p: 295
              text: However, when reliable core values are not established and lived
                out, people within the church will create a fourth level called personal
                preference .
              kind: prose
              UID: MIN171.17.2.1.P.295
              page: 228
            - p: 296
              text: Personal preferences are deeply ingrained beliefs that have developed
                over the lifespan of a person’s Christian journey. They are rarely
                questioned by anyone, are not written down, and are invisible to others
                in the church until conflict or vision-casting occurs.
              kind: prose
              UID: MIN171.17.2.1.P.296
              page: 228
            - p: 297
              text: Where personal preferences are accepted as biblical absolutes,
                conflict always erupts.
              kind: prose
              UID: MIN171.17.2.1.P.297
              page: 228
            - p: 298
              text: When someone’s personal preferences become core values, church
                leadership cannot provide for and protect the congregation. When people’s
                preferences become core values, efforts become focused on making people
                happy, giving in to what is unhealthy, and allowing immature Christians
                to dictate the leadership direction of the church.
              kind: prose
              UID: MIN171.17.2.1.P.298
              page: 228
            - p: 299
              text: Steps for Identifying Core Values
              kind: heading
              UID: MIN171.17.2.1.P.299
              page: 228
            - p: 300
              text: 'As you prepare to identify your church’s core values, reflect
                on the following key points concerning values:'
              kind: prose
              UID: MIN171.17.2.1.P.300
            - p: 301
              text: In the Acts 2 Journey, we walk church leaders through the process
                of developing their core values. Remember, core values are your church’s
                identity, so it is important to take the time to pick four or five
                beliefs or principles that your church strongly embraces (Garrison
                2015, 121) .
              kind: prose
              UID: MIN171.17.2.1.P.301
              page: 112
            - p: 302
              text: Our core values are those things we believe are important and
                we demonstrate in our behaviors. When they truly buy in, a congregation
                will live out a church’s core values in their daily lives. It is not
                enough to state values; our true priorities are those things we both
                speak and live (Garrison 2015, 118) .
              kind: prose
              UID: MIN171.17.2.1.P.302
              page: 228
            - p: 303
              text: It is not enough to be aware of core values subconsciously. If
                you want them to help your church stand for something, you must write
                them down and help others grasp them.
              kind: prose
              UID: MIN171.17.2.1.P.303
              page: 228
            - p: 304
              text: 'What you write may look something like this: “We desire to be
                a learning church, a loving church, a praying church, a humble church,
                a supernatural church, a unified church, a generous church, a committed
                church, a fun church, a worshipping church, an influential church,
                and an outward-focused church” (Garrison 2015, 122) .'
              kind: prose
              UID: MIN171.17.2.1.P.304
              page: 228
            - p: 305
              text: Whatever your church’s core values are, their unique shape and
                priority are what give your church its individual identity. When you
                become more aware of them and actively embrace them, you give your
                priesthood of believers a church identity they can truly embrace and
                own (Garrison 2015, 122) .
              kind: prose
              UID: MIN171.17.2.1.P.305
              page: 228
            - p: 306
              text: 'At times, an organization’s core values are listed as key words
                that demonstrate what the organization values: Loyalty, Commitment,
                Compassion, Perseverance, Service to others, Passion, Witness, Unity,
                and so on.'
              kind: prose
              UID: MIN171.17.2.1.P.306
              page: 228
            - p: 307
              text: Or, a core values statement may be stated using sentences or phrases,
                such as the Assemblies of God core values that are given below only
                as an example of a values statement.
              kind: prose
              UID: MIN171.17.2.1.P.307
              page: 228
            - p: 308
              text: Assemblies of God Core Values
              kind: prose
              UID: MIN171.17.2.1.P.308
              page: 228
            - p: 309
              text: 'We are committed to the following core values:'
              kind: heading
              UID: MIN171.17.2.1.P.309
              page: 228
            - p: 310
              text: 1. Passionately proclaim, at home and abroad, by word and deed
                Jesus as Savior, Baptizer in the Holy Spirit, Healer, and Soon Coming
                King.
              kind: heading
              UID: MIN171.17.2.1.P.310
              page: 228
            - p: 311
              text: 2. Strategically invest in the next generation.
              kind: heading
              UID: MIN171.17.2.1.P.311
              page: 228
            - p: 312
              text: 3. Vigorously plant new churches and revitalize existing ones.
              kind: heading
              UID: MIN171.17.2.1.P.312
              page: 228
            - p: 313
              text: 4. Skillfully resource our Fellowship.
              kind: heading
              UID: MIN171.17.2.1.P.313
              page: 228
            - p: 314
              text: 5. Fervently pray for God’s favor and help as we serve Him with
                pure hearts and noble purpose.
              kind: heading
              UID: MIN171.17.2.1.P.314
              page: 228
            - p: 315
              text: Core Values Statement
              kind: heading
              UID: MIN171.17.2.1.P.315
              page: 229
            - p: 316
              text: In the chart below, write down a statement of four to six core
                values that currently drive your church to do what it does. Remember,
                do not list your programs as values. You may have a solid value that
                leads you to pursue a particular program; in that case, list the value
                behind the program. The value is why you do what you do.
              kind: prose
              UID: MIN171.17.2.1.P.316
              page: 229
            - p: 317
              text: Our Core Values
              kind: list
              UID: MIN171.17.2.1.P.317
              page: 229
            - p: 318
              text: Personal Preferences or Core Values?
              kind: heading
              UID: MIN171.17.2.1.P.318
              page: 230
            - p: 319
              text: Are there personal preferences or misguided convictions that your
                church is currently embracing that are holding you back? These are
                often unwritten and unspoken. Write down any personal preferences
                that seem to be hindering your church from moving forward, in the
                chart below. Review Lesson 10.3 for more information on personal preferences
                versus core values.
              kind: prose
              UID: MIN171.17.2.1.P.319
              page: 230
            - p: 320
              text: What values or preferences are being embraced by your church today
                that could be holding you back?
              kind: chart
              UID: MIN171.17.2.1.P.320
              page: 230
            - p: 321
              text: Once you identify any personal preferences or misguided convictions
                that seem to be holding you back, identify a positive core value that
                you can emphasize to replace them. If needed, revise your previous
                list of core values (above) to include this offsetting positive value.
              kind: prose
              UID: MIN171.17.2.1.P.321
              page: 230
            - p: 322
              text: Let us consider how our vision statement, core values, and strategic
                plan work together to lead us to where we are going through Christ.
              kind: prose
              UID: MIN171.17.2.1.P.322
              page: 231
            - p: 323
              text: VISION
              kind: heading
              UID: MIN171.17.2.1.P.323
              page: 99
            - p: 324
              text: Beliefs, Actions, and Where We Are Going
              kind: prose
              UID: MIN171.17.2.1.P.324
            - p: 325
              text: VALUES
              kind: heading
              UID: MIN171.17.2.1.P.325
              page: 231
            - p: 326
              text: Behaviors, Attitudes, and Where We Are Now
              kind: prose
              UID: MIN171.17.2.1.P.326
              page: 231
            - p: 327
              text: Creating the Strategic Plan
              kind: prose
              UID: MIN171.17.2.1.P.327
              page: 231
            - p: 328
              text: Once a congregation establishes its mission, vision, and values,
                it is prepared to create a strategic plan.
              kind: prose
              UID: MIN171.17.2.1.P.328
              page: 231
            - p: 329
              text: When you cast vision, you may think you are not getting traction,
                but what you are really doing is beginning to move the train and preparing
                for the long journey. When the train begins to move, the focus will
                shift to regulating its momentum. The strategic plan will include
                specific steps to strengthen the Acts 2 process in your church, and
                specific steps towards fulfilling the vision.
              kind: prose
              UID: MIN171.17.2.1.P.329
              page: 231
            - p: 330
              text: Developing a Strategic Plan
              kind: heading
              UID: MIN171.17.2.1.P.330
              page: 232
            - p: 331
              text: 'A strategic plan will address the five functions of the Acts
                2 process, with specific steps that can fulfill your church’s vision
                in each of the five areas:'
              kind: prose
              UID: MIN171.17.2.1.P.331
              page: 232
            - p: 332
              text: We established that our mission is universal, we began to build
                a vision around people, and we identified the core values and behaviors
                that reflect those values. Now, it’s time to put it all together into
                a strategic plan that will help you get from where you are (your values)
                to where you want to go (your vision). Now we return to the five biblical
                functions of the first-century church. Described in detail in Acts
                2:42–47, these functions form the pathway from values to vision. The
                five functions are actually a template you can use to develop a plan
                for your church (Garrison 2015, 133–134).
              kind: quote
              UID: MIN171.17.2.1.P.332
            - p: 333
              text: 'As you begin to put together your strategic plan for each of
                the five functions, make sure to keep these four areas in focus: (1)
                Sunday morning experience, (2) guest assimilation, (3) nursery and
                children’s ministry, and (4) serving in the community. See Appendix
                A for additional materials to help you assess and make strategic plans
                in these areas.'
              kind: prose
              UID: MIN171.17.2.1.P.333
            - p: 334
