    - last_modified: '2026-03-27'
      title: 4 - Hope
      print_page: 4
      lessons:
      - last_modified: '2026-03-27'
        title: The Need for Hope
        subobjectives:
          4.1.1:
            body:
            - p: 1
              text: I was recently with an exciting young pastor, Glenn Epps of Puxico,
                Missouri. When he had first arrived, the church had perhaps sixty
                people. He had been there for seven years, and it was now running
                about one hundred twenty. When he arrived, the average age was sixty-five,
                and it was now about forty. I was impressed because this was the most
                energized church in the county. I sensed a buzz about the place. Young
                couples were everywhere, and everything seemed fantastic.
              kind: prose
              UID: MIN171.4.1.1.P.1
              page: 50
            - p: 2
              text: At a luncheon afterwards, I asked him how he did it. He looked
                around at his people and then back at me before saying, “There are
                a lot of strategies out there, and I am sure we have implemented a
                few of them. First of all, what I found to be the most crucial was
                that people had to understand I was there to stay. They needed to
                know I was called to that place, not just stopping off on my way to
                somewhere else. In rural America, if they do not think you are authentic
                and that you really love them, they will not work with you.
              kind: prose
              UID: MIN171.4.1.1.P.2
              page: 50
            - p: 3
              text: “Second, my biggest challenge was lifting the morale. They had
                come to the conclusion that God could not help them and neither could
                anyone else. They thought they were just going to be stuck where they
                were. We did not see people coming in. No one was excited, and no
                one was witnessing. Morale was our biggest issue.”
              kind: prose
              UID: MIN171.4.1.1.P.3
              page: 50
            - p: 4
              text: I asked him what their biggest issue is today.
              kind: prose
              UID: MIN171.4.1.1.P.4
            - p: 5
              text: “Morale,” he replied.
              kind: prose
              UID: MIN171.4.1.1.P.5
            - p: 6
              text: I told him, “I thought you said that was your biggest issue seven
                years ago?”
              kind: prose
              UID: MIN171.4.1.1.P.6
            - p: 7
              text: “I did,” he said, “but it is for a different reason now. Two years
                ago, the wife of one of the board members contracted a horrible, flesh-eating
                bacteria that doctors did not immediately diagnose, let alone treat.
                She died, and because she was such a big part of the community, it
                seemed to suck the life out of people. They just lost hope.”
              kind: prose
              UID: MIN171.4.1.1.P.7
              page: 50
            - p: 8
              text: The Supplier of Hope
              kind: heading
              UID: MIN171.4.1.1.P.8
              page: 50
            - p: 9
              text: We know faith is a process—faith comes by hearing and hearing
                by the word of God (based on Romans 10:17). The more Scripture you
                get inside you and the more you believe it, the more faith you will
                have. Faith is almost educational in nature.
              kind: prose
              UID: MIN171.4.1.1.P.9
              page: 50
            - p: 10
              text: But hope is emotional. You cannot educate people into hope. Yet
                even in our darkest moments of disappointments and heartache, the
                Spirit of God can renew our hope. Paul explains,
              kind: prose
              UID: MIN171.4.1.1.P.10
              page: 51
            - p: 11
              text: And not only that, but we also glory in tribulations, knowing
                that tribulation produces perseverance; and perseverance, character;
                and character, hope. Now hope does not disappoint, because the love
                of God has been poured out in our hearts by the Holy Spirit who was
                given to us. (Romans 5:3–5, NKJV)
              kind: quote
              UID: MIN171.4.1.1.P.11
              page: 51
            - p: 12
              text: Faith is related to miracles, and hope is related to morale. It
                is that confident, happy expectation that something good is going
                to happen.
              kind: prose
              UID: MIN171.4.1.1.P.12
              page: 51
            - p: 13
              text: When I see churches that are plateauing or declining, or when
                I meet a leader who feels unappreciated and cannot get anything going,
                I know their hope tank is on empty.
              kind: prose
              UID: MIN171.4.1.1.P.13
              page: 51
            - p: 14
              text: What they need is a dose of hope.
              kind: prose
              UID: MIN171.4.1.1.P.14
            - p: 15
              text: Roughly a million people are worshipping every Sunday in Assemblies
                of God churches that are plateauing and declining, and they are good
                people—faithful people. But they have lost their hope.
              kind: prose
              UID: MIN171.4.1.1.P.15
              page: 51
            - p: 16
              text: Can we give it back to them?
              kind: prose
              UID: MIN171.4.1.1.P.16
            - p: 17
              text: I believe we can infuse demoralized people and churches with hope
                because it is a scriptural principle. So how do we do it?
              kind: prose
              UID: MIN171.4.1.1.P.17
              page: 51
            - p: 18
              text: Romans 15:13 (NKJV) says, “Now may the God of hope fill you with
                all joy and peace in believing, that you may abound in hope by the
                power of the Holy Spirit.”
              kind: prose
              UID: MIN171.4.1.1.P.18
              page: 51
            - p: 19
              text: Who is the source of our hope? God. His autobiography, the Bible,
                tells us all we need to know of His character. His past performance
                is an accurate predictor of His future behavior. If the source of
                hope is God and the substance of hope is faith, the supplier of hope
                is the Holy Spirit.
              kind: prose
              UID: MIN171.4.1.1.P.19
              page: 51
            - p: 20
              text: A Personal Story of Lost Hope
              kind: heading
              UID: MIN171.4.1.1.P.20
              page: 51
            - p: 21
              text: My father’s life and ministry were punctuated with dramatic miracles,
                so when he contracted Alzheimer’s, we expected that we would pray
                and he would be healed. However, that is not how it happened. Over
                time, his condition got progressively worse. His slide from reformed
                alcoholic and vibrant pastor to unresponsive Alzheimer’s victim was
                a journey of about eight years, and we understood as a family why
                some have called this period “the long goodbye.”
              kind: prose
              UID: MIN171.4.1.1.P.21
              page: 51
            - p: 22
              text: Near the end of that eight-year journey, I was called to the hospital
                and happened to meet Dad’s doctor as he was walking out of my father’s
                room. He reiterated to me that my father’s condition meant Dad would
                never speak to us again—his brain function was gone. In fact, he had
                not spoken intelligible words in several years, and for over three
                months had not even made a single sound.
              kind: prose
              UID: MIN171.4.1.1.P.22
              page: 52
            - p: 23
              text: This was nothing I did not already know, but what he said next
                was what grabbed my attention. “It is not your father I am concerned
                about. We will keep him comfortable until he passes. I am more concerned
                about your mother. She has been his caregiver through this whole journey,
                and she is physically, mentally, emotionally, and spiritually depleted.
                She needs help.”
              kind: prose
              UID: MIN171.4.1.1.P.23
              page: 52
            - p: 24
              text: With those words, he walked out. I went into the hospital room
                and stood at the foot of Dad’s bed. He was unchanged from the last
                time I had seen him. It was hard to see him in that condition, though—he
                had been such a healthy person. At six feet tall, he was now an eighty-seven
                pound emaciated figure curled into a fetal position.
              kind: prose
              UID: MIN171.4.1.1.P.24
              page: 52
            - p: 25
              text: I have seen miracles. I have witnessed firsthand the results of
                great faith, but when my own father needed a miracle, none seemed
                forthcoming. I had no hope left for my father’s recovery.
              kind: prose
              UID: MIN171.4.1.1.P.25
              page: 52
            - p: 26
              text: I was worn out from being on an emotional roller coaster, and
                I did not know how to respond to these condemning thoughts—except
                for quoting Scripture. I stood there wrestling with these thoughts
                and quoting every relevant verse I could remember. I would feel better
                for a few moments, and then the circumstances that confronted me would
                make me feel worse again.
              kind: prose
              UID: MIN171.4.1.1.P.26
              page: 52
            - p: 27
              text: Finally, I fought through and received victory in that fight.
                I said, “Devil, you cannot win! When my father dies, the tabernacle
                will perish, but his soul will live forever! He will be in the presence
                of the King of kings and Lord of lords!”
              kind: prose
              UID: MIN171.4.1.1.P.27
              page: 52
            - p: 28
              text: I walked out in victory to see my mom and sister. They had heard
                me inside, and my mom asked, “Son, what have you been doing?”
              kind: prose
              UID: MIN171.4.1.1.P.28
              page: 52
            - p: 29
              text: “I have been praying with Pop,” I told her.
              kind: prose
              UID: MIN171.4.1.1.P.29
            - p: 30
              text: Her reply surprised me. “Why?” she asked. She had a look on her
                face I had never seen before. “It will not do any good—we have prayed
                for him for years, and look at him. He is so bad, not even really
                there. His body has outlived his brain, and we cannot communicate
                with him. There is no dignity in that room. I have been praying for
                God to release him, let him go to heaven. There is no reason for him
                to linger here, but he lingers on.”
              kind: prose
              UID: MIN171.4.1.1.P.30
              page: 52
            - p: 31
              text: 'Then she said something I never thought I would hear: “When you
                need God the most, He turns His back on you. It is a joke; that is
                what it is.” Pointing her finger at my face, she said, “Do not ever
                pray in my presence again!”'
              kind: prose
              UID: MIN171.4.1.1.P.31
              page: 52
            - p: 32
              text: You cannot imagine the impact her words had on me. Had my mother
                lost her salvation? Had she walked away from her faith? This was my
                mom—a faithful pastor’s spouse for decades and a prayer warrior. She
                had walked with my dad through all the years and all the sacrifices
                during their years of ministry. Hearing her say those words was frightening.
              kind: prose
              UID: MIN171.4.1.1.P.32
            - p: 33
              text: I did not know how to answer her; I simply walked away. Back in
                my car, I began to pray, simply venting to God. Finally I blurted
                out, “God, You have got yourself a big, big problem. What are You
                going to do?”
              kind: prose
              UID: MIN171.4.1.1.P.33
              page: 53
            - p: 34
              text: I was afraid my mother had lost her faith. But she had not lost
                her faith—she had lost her hope.
              kind: prose
              UID: MIN171.4.1.1.P.34
              page: 53
            interactive_questions:
            - p: 1
              text: In your experience, what are some other reasons a church’s morale
                can decline?
              response: Answers will vary but could include declining community population,
                damaging conflict, leadership failures, personal loss or tragedy,
                aging of congregation, etc.
              UID: MIN171.4.1.1.IQ.1
            - p: 2
              text: How does character produce hope and what does it suggest about
                hope?
              response: Character does not fluctuate with our emotions but can produce
                hope because character is founded on who we are and what we know to
                be truth. And hope emerges when what we know begins to overcome what
                we feel.
              UID: MIN171.4.1.1.IQ.2
            - p: 3
              text: Why must real hope be grounded in God’s Word?
              response: The Bible is our principle Source for truth and certainly
                the foundation on which God fulfills His mission through us.
              UID: MIN171.4.1.1.IQ.3
            - p: 4
              text: 'React to the statement: Only truth can produce lasting hope.'
              response: Some seek to build hope by mere “hoping” for a better day
                or wishing things were different. But such an approach rarely endures.
                Only hope that is built on truth can endure because truth endures
                and will ultimately emerge if we do not give up.
              UID: MIN171.4.1.1.IQ.4
            - p: 5
              text: Though hope is built on truth, how can it be impacted by deep
                and difficult emotions?
              response: In times of great challenge, emotion can bury hope for a time,
                leaving us living by what we feel, rather than by what we know.
              UID: MIN171.4.1.1.IQ.5
            last_modified: '2026-03-27'
            scripture:
            - intext: Romans 10:17
              version: NIV
              refs:
              - ref: Romans 10:17
                key: romans.10.17
                bib_gate: https://www.biblegateway.com/passage/?search=Romans%2010%3A17&version=NIV
              paragraph: MIN171.4.1.1.P.9
              UID: MIN171.4.1.1.S.1
