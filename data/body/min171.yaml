    - last_modified: '2026-03-27'
      title: 2 - Change Is Possible
      print_page: 2
      lessons:
      - last_modified: '2026-03-27'
        title: The Courage to Change
        subobjectives:
          2.1.1:
            body:
            - p: 1
              text: It took me two years to realize I needed to have the courage to
                change—I had to look for a process. I had to be willing to change
                the way I had been doing things. I had to trust God, but I also had
                to give a process time to develop and work.
              kind: prose
              UID: MIN171.2.1.1.P.1
              page: 28
            - p: 2
              text: One of two things will happen when we are confronted with the
                need to change. We either accept it, or we try to justify our decisions
                and resist it. Coming to terms with the fact that we need to change
                may be the hardest part of this process. The willingness to admit
                we need to do things differently is one of the biggest challenges
                we face in our Acts 2 Journeys.
              kind: prose
              UID: MIN171.2.1.1.P.2
              page: 28
            - p: 3
              text: That is the biggest obstacle standing in the way of renewal in
                your life and your church. Many leaders are convinced that the problem
                is the people, but the people are not always the problem. We fear
                getting the people to change, but in reality, we are the ones who
                first need to experience change in our own lives.
              kind: prose
              UID: MIN171.2.1.1.P.3
              page: 28
            - p: 4
              text: We have seen what happens when leader after leader and church
                after church accept the need to change and that the Lord is leading
                them into a process of renewal.
              kind: prose
              UID: MIN171.2.1.1.P.4
              page: 28
            - p: 5
              text: I was thirty-nine years old when God showed me I had to change.
                I did not yet know what I needed to do, but God was about to show
                me the way. I accepted that I needed to make an adjustment, and God
                provided the resources to go forward. I believe that if I could find
                the courage to change, you can as well.
              kind: prose
              UID: MIN171.2.1.1.P.5
              page: 28
            - p: 6
              text: God offers each of us hope—hope that His dream for our future
                is greater than our memories of past ministries.
              kind: prose
              UID: MIN171.2.1.1.P.6
              page: 28
            - p: 7
              text: Do You Have the Courage to Change?
              kind: prose
              UID: MIN171.2.1.1.P.7
            - p: 8
              text: Know that right now, whatever your situation, you are not alone.
                Your particular situation may be unique, but the problems we all face
                are actually quite common. We all struggle. We all have difficulties,
                setbacks, and storms, but through them all, it is imperative that
                we move forward. If we want to keep getting the same results we have
                had in the past, we can keep doing what we have been doing. But if
                we want change to occur, we have to take wise, bold steps in a new
                direction.
              kind: prose
              UID: MIN171.2.1.1.P.8
              page: 28
            - p: 9
              text: If we want new results, it is time to change what we do. That
                is what this book is about—the process of moving forward and the hope
                that things can change, as well as what Acts 2 has to tell us about
                those changes.
              kind: prose
              UID: MIN171.2.1.1.P.9
              page: 28
            - p: 10
              text: 'If you have tried to change before and failed, right now, you
                may be reading this skeptically. You may think that you have already
                tried new plans, new programs, and new ways of doing things—all of
                them may have failed or may have had less than momentous success.
                I want to assure you that change is possible. Over the years, I have
                seen leaders from all kinds of churches who have found the courage
                to be objective about their current situations and to take bold steps
                to a better future. These men and women combined deep humility and
                the courage of a lion. They were not willing to settle for anything
                less than God’s best, and He gave them two crucial things:'
              kind: prose
              UID: MIN171.2.1.1.P.10
              page: 28
            - p: 11
              text: a deeper sense of His love and power
              kind: prose
              UID: MIN171.2.1.1.P.11
            - p: 12
              text: a clear, workable plan.
              kind: prose
              UID: MIN171.2.1.1.P.12
            - p: 13
              text: Trusting God’s Spirit and following God’s plan put us in touch
                with the mind and heart of God—we have revelations of His truth, the
                power to love and forgive, courage to speak truth, and humility to
                love difficult people. We no longer feel confused, and we no longer
                feel frustrated and helpless. Finally, we realize we are not alone.
                We are in step with the plan and the power of God, and our vision
                attracts people who want their lives to count.
              kind: prose
              UID: MIN171.2.1.1.P.13
              page: 28
            - p: 14
              text: I know both sides of this experience. I have been there, and I
                have learned the lessons God wanted to teach me. Let me share with
                you what I discovered. It was not that I was doing something wrong;
                I simply did not have all the pieces.
              kind: prose
              UID: MIN171.2.1.1.P.14
              page: 29
            - p: 15
              text: You may be in the same place I was—where many pastors have been—looking
                for the missing pieces and thinking change is impossible. Well, let
                me admit right away that what God is asking us to do—replicating the
                experience of the first-century church— is impossible. It is completely,
                totally impossible—if we rely on our own ingenuity, intellect, and
                human effort.
              kind: prose
              UID: MIN171.2.1.1.P.15
              page: 29
            - p: 16
              text: A look through the New Testament reveals contemporary examples
                of what God did with impossible situations. Every time God moved with
                wisdom and sovereignty, a new leader or a new process preceded it.
              kind: prose
              UID: MIN171.2.1.1.P.16
              page: 29
            - p: 17
              text: I am not suggesting that your church needs a new pastor, but what
                I am advocating is that every one of us can be a new leader by embracing
                change. We can be transformed by the empowerment of the Spirit, and
                we can then change the atmosphere of our churches and congregations
                through the same plan that God used to transform the church of the
                first century.
              kind: prose
              UID: MIN171.2.1.1.P.17
              page: 29
            - p: 18
              text: Change is possible, friend. God did it before—He transformed Jewish
                believers into Christ-followers, and He can reinvigorate the churches
                of today with the power of the same Spirit that raised Christ from
                the dead.
              kind: prose
              UID: MIN171.2.1.1.P.18
              page: 29
            - p: 19
              text: Where Does Change Start?
              kind: heading
              UID: MIN171.2.1.1.P.19
              page: 29
            - p: 20
              text: I want to tell you about some of the obstacles to change that
                I faced and how I got through them. It is easy to get the wrong idea
                about where change starts. It is also easy to think it has to begin
                with the people and with the fear that we will not be able to motivate
                the people to change.
              kind: prose
              UID: MIN171.2.1.1.P.20
              page: 29
            - p: 21
              text: How many small churches in particular are led from the bottom
                up and administered from the pews? The pastor is to equip the saints
                to do the work of the ministry, but all too often, we have the incorrect
                understanding that pastors are paid to do ministry, and everyone else
                is just there to help them. In reality, it is just the reverse, and
                we will talk more about this in the next chapter.
              kind: prose
              UID: MIN171.2.1.1.P.21
              page: 29
            - p: 22
              text: When I became pastor of First Assembly in 1986, we had a board
                of nine people. As many as nine months had passed between pastors;
                each of whom had lasted a shorter time with the church than the one
                before—a trend line that was alarming. My predecessor had only been
                there twelve months, the one before him thirty-six months, and the
                one before that sixty months. During this period, the board had become
                very hands-on, in effect, managing the church.
              kind: prose
              UID: MIN171.2.1.1.P.22
              page: 30
            - p: 23
              text: The vice chairman of the board was a man named Bill. He was a
                wealthy business owner who drove an expensive car, and he had actually
                been instrumental in getting me to come to the church. While my predecessor
                had met with Bill frequently, I had not, and while we ultimately became
                friends, a crisis was developing. I knew something was wrong several
                months before he eventually confronted me, and I suspected that it
                was related to the strategic plan I was beginning to develop.
              kind: prose
              UID: MIN171.2.1.1.P.23
              page: 30
            - p: 24
              text: Having been an evangelist for eighteen years, I still traveled
                to speak occasionally. The arrangement I had with the church, regarding
                this travel and the materials my personal ministry continued to produce,
                were sore topics with him. He finally confronted me one night about
                this.
              kind: prose
              UID: MIN171.2.1.1.P.24
              page: 30
            - p: 25
              text: 'Actually, something other than my travel schedule or ministry
                resources was the real issue: who would lead the church and where
                would it go? I was leading the church in a new direction, setting
                vision, and beginning to develop a strategic plan, but for years,
                the board had run the church. Bill was among those who did not want
                to lose that power.'
              kind: prose
              UID: MIN171.2.1.1.P.25
              page: 30
            - p: 26
              text: Would change happen? Would the direction God was leading me win
                out, or would the board continue to maintain the status quo ?
              kind: prose
              UID: MIN171.2.1.1.P.26
              page: 30
            - p: 27
              text: “I think you misunderstood something,” Bill said in this fateful
                board meeting. “We brought you here to preach, but we are going to
                run this church.” He announced that they did not appreciate my being
                gone or making money from the sale of my ministry’s materials.
              kind: prose
              UID: MIN171.2.1.1.P.27
              page: 30
            - p: 28
              text: I asked him to unpack that a little for me, and Bill began to
                go into more detail about what he thought I was doing wrong and how
                I was wrong for what I was doing. When he was done, he said he wanted
                the rest of the board to share how they felt.
              kind: prose
              UID: MIN171.2.1.1.P.28
              page: 30
            - p: 29
              text: I told him, “No, you have told me how you feel. Now, I am going
                to tell you how I feel. When I am done, anyone else can speak.” I
                responded that their model of church governance was not preferable
                to my way, and then I told them why—it was unbiblical. I told them
                that I was not looking for a dictatorship but a collaborative effort.
                I shared my belief that God had designed a church to be led by a shepherd,
                not a committee.
              kind: prose
              UID: MIN171.2.1.1.P.29
              page: 30
            - p: 30
              text: 'Then I brought up the issue under the surface: As the pastor,
                I wanted to equip the saints for the ministry while Bill wanted me
                to be a hireling who performed the ministry for them.'
              kind: prose
              UID: MIN171.2.1.1.P.30
              page: 31
            - p: 31
              text: “I am willing to die for this church. Are you?” I asked Bill as
                I ended.
              kind: prose
              UID: MIN171.2.1.1.P.31
            - p: 32
              text: This discussion was heated because someone who had been in control
                now had that control threatened. Change threatened Bill and the rest
                of the board.
              kind: prose
              UID: MIN171.2.1.1.P.32
              page: 31
            - p: 33
              text: Before you think I am some sort of aggressive, confrontational
                person, understand that I never raise my voice or bluster. However,
                I was fighting for the life of our church, and if I had not won that
                battle, that church would still be plateauing like it was when I arrived.
              kind: prose
              UID: MIN171.2.1.1.P.33
              page: 31
            - p: 34
              text: “Now, everyone can express themselves,” I told Bill, “and if they
                feel like you do, tonight is my last night.” In all my years of ministry,
                this was the only time I had thrown down the gauntlet and made this
                kind of dramatic statement.
              kind: prose
              UID: MIN171.2.1.1.P.34
              page: 31
            - p: 35
              text: That church was not going to grow if change did not start with
                the board. Let me tell you how that meeting ended. Everyone spoke,
                and they expressed themselves. Some began to cry, and it went from
                a confrontation into a prayer meeting.
              kind: prose
              UID: MIN171.2.1.1.P.35
              page: 31
            - p: 36
              text: A member who had been on the board over forty years and who was
                an advocate for me coming to the church had actually come out of retirement
                to be on the board and help me get started. He stood up after we had
                prayed and said, “I have been on the board over forty years, including
                twenty-two years when Brother Gotcher was pastor. He was always the
                leader, he pastored the church, and we always helped him. This boy,”
                he said, speaking of me, “is going to lead this church, and he is
                going to be the pastor. And we are going to help him.”
              kind: prose
              UID: MIN171.2.1.1.P.36
              page: 31
            - p: 37
              text: Bill later shared with us at another board meeting that the night
                of that confrontation, he started to feel like he was going to die.
                He did not know what was wrong, but he paced the floor and prayed
                intensely. He told us that God had said, “Take your hands off of Alton
                Garrison, and stop trying to control him. If he has a problem and
                needs correction, I will correct him.”
              kind: prose
              UID: MIN171.2.1.1.P.37
              page: 31
            - p: 38
              text: When I left the church fifteen years later, Bill apologized to
                me for what he had put me through. We became friends in the end, and
                what could have served to divide the church was instead a watershed
                moment for the church. Change had to happen, and I had to be willing
                to see it through.
              kind: prose
              UID: MIN171.2.1.1.P.38
              page: 31
            - p: 39
              text: God may not speak prophetically to the people who resist the change
                God wants to begin in you and your church, and you may not have an
                old saint in your corner to stand up in your defense. However, you
                must ask yourself if you are willing to put it on the line in order
                to usher in God’s change for you and for your congregation.
              kind: prose
              UID: MIN171.2.1.1.P.39
              page: 31
            - p: 40
              text: The reality is that some board member or influential person in
                your church is going to resist change, and you must decide right now
                whether you are going to do it their way or God’s way.
              kind: prose
              UID: MIN171.2.1.1.P.40
              page: 31
            - p: 41
              text: 'I will ask you the same question I asked Bill: I was willing
                to die for the church I pastored—are you willing to die for yours?
                And perhaps even more pertinent is this question: Are you willing
                to fight for your church?'
              kind: prose
              UID: MIN171.2.1.1.P.41
              page: 31
            - p: 42
              text: 'Let me ask it this way: Are you willing to lead, equip, model,
                love, sacrifice, convince, shepherd . . . and even fight if necessary.
                . . to see God change lives?'
              kind: prose
              UID: MIN171.2.1.1.P.42
              page: 31
            interactive_questions:
            - p: 1
              text: What is it that typically motivates you toward change?
              response: Answers will vary, but could include recognition of failure,
                desire for more or different results, the need to survive, etc.
              UID: MIN171.2.1.1.IQ.1
            - p: 2
              text: 'How do you respond to the statement: Before God can change your
                church, He first must change you.'
              response: Answers will vary, but should reflect the acceptance of the
                challenge to let God change me in whatever ways are necessary for
                His purposes.
              UID: MIN171.2.1.1.IQ.2
            - p: 3
              text: What is the key paradigm shift that must occur for change to happen
                in the local church?
              response: Those in leadership must grasp what we call “the priesthood
                of all believers” and focus on equipping people for ministry in the
                local church and community.
              UID: MIN171.2.1.1.IQ.3
            last_modified: '2026-03-27'
            scripture:
            - intext: Acts 2
              version: NIV
              refs:
              - ref: Acts 2
                key: acts.2
                bib_gate: https://www.biblegateway.com/passage/?search=Acts%202&version=NIV
              paragraph: MIN171.2.1.1.P.9
              UID: MIN171.2.1.1.S.1
            text: Identify where change needs to start for spiritual transformation.
            glossary: []
      - last_modified: '2026-03-27'
        title: Five Keys to Change
        subobjectives:
          2.2.1:
            body:
            - p: 1
              text: God is not intimidated by any problem in our churches, whether
                they are challenges of rural churches, the struggles of urban society,
                negative trends in the culture, false religions, or anything else.
                So, why should we let these things steal our hope?
              kind: prose
              UID: MIN171.2.2.1.P.1
              page: 32
            - p: 2
              text: What exactly is a healthy church? Before we go any further, let
                me give you my thoughts on what that means.
              kind: prose
              UID: MIN171.2.2.1.P.2
              page: 32
            - p: 3
              text: A healthy church is a Spirit-empowered community of disciples
                who are following Jesus and fulfilling His mission. Healthy churches
                pursue and obey God passionately, engage and maintain loving relationships,
                develop and mobilize their people, act with clear direction and outward
                focus, and reproduce and multiply His mission in other peoples and
                places. We have determined that there are five things necessary for
                churches to experience revitalization.
              kind: prose
              UID: MIN171.2.2.1.P.3
              page: 32
            - p: 4
              text: 1. The Burning Platform
              kind: hang
              UID: MIN171.2.2.1.P.4
              page: 266
            - p: 5
              text: First is what we call a “burning platform,” which is the crisis—it
                is the pressing need for immediate and radical change.
              kind: prose
              UID: MIN171.2.2.1.P.5
              page: 32
            - p: 6
              text: Plateauing and declining churches and the state of the church
                in the West, in particular, are the burning problems of today. We
                have a crisis.
              kind: prose
              UID: MIN171.2.2.1.P.6
              page: 32
            - p: 7
              text: “Dying, Spirit-filled churches” should be an oxymoron, and yet
                all across America, we see churches in crisis.
              kind: prose
              UID: MIN171.2.2.1.P.7
              page: 32
            - p: 8
              text: God has a plan for each and every church, and we want to help
                church leaders find that plan and fulfill it. No church has a future
                unless its dreams are bigger than its memories, and we desire to help
                churches dream the dream that God has for each of them.
              kind: prose
              UID: MIN171.2.2.1.P.8
              page: 32
            - p: 9
              text: The process of discovering that plan is what we have pioneered
                with our Acts 2 Journeys—programs that have helped literally hundreds
                of churches to discover and fulfill God’s destiny for them.
              kind: prose
              UID: MIN171.2.2.1.P.9
              page: 32
            - p: 10
              text: While statistics support the burning platform, there is hope.
                Your church does not have to become another statistic. Your church
                and its ministry have a hope and a future!
              kind: prose
              UID: MIN171.2.2.1.P.10
              page: 32
            - p: 11
              text: 2. Equipping Church Leaders and Pastors to Thrive and Grow
              kind: hang
              UID: MIN171.2.2.1.P.11
            - p: 12
              text: 'We must each be willing to admit we need help, create a community
                of leaders committed to helping one another succeed, and brave one
                of the most frightening words in the church: change. This is the second
                critical element: equipping church leaders and pastors to thrive and
                grow—to change. We fear getting the people to change, but, in reality,
                change starts with the leadership.'
              kind: prose
              UID: MIN171.2.2.1.P.12
              page: 32
            - p: 13
              text: Churches seldom outgrow their leaders. Some have accidentally
                grown beyond the capacity and vision of their pastor and leaders,
                but when they do, the growth is often short-lived. Sustained growth
                is a function of wise, godly, and visionary leadership. While not
                every church leader has the same potential, we can all get better,
                and we can all help one another do it.
              kind: prose
              UID: MIN171.2.2.1.P.13
              page: 33
            - p: 14
              text: To be better leaders, we must keep learning. There is no time
                limit on growth. We can keep learning until the day someone puts us
                in the ground. I have worked with leaders in their seventies who are
                still learning and growing, but sadly, I have also met pastors in
                their thirties who have stopped learning.
              kind: prose
              UID: MIN171.2.2.1.P.14
              page: 33
            - p: 15
              text: 'Jesus used some powerful analogies in His ministry: new cloth
                put on old garments and new wine poured into old wineskins. When we
                lose our capacity to grow, we run the risk of tearing and exploding
                when change comes. We must keep our elasticity—our willingness to
                change and grow and flex.'
              kind: prose
              UID: MIN171.2.2.1.P.15
              page: 33
            - p: 16
              text: The purpose of the Acts 2 process is to enhance the capacity of
                every church leader to respond to the new wine of the Holy Spirit
                that God is giving His church. The process will show that change is
                possible and preferable, revitalizing leaders of all ages.
              kind: prose
              UID: MIN171.2.2.1.P.16
              page: 33
            - p: 17
              text: 3. Empowering Teams
              kind: hang
              UID: MIN171.2.2.1.P.17
              page: 33
            - p: 18
              text: The third critical item is the team behind every pastor—the volunteers
                and lay-leaders who make “church” happen every week. No church can
                turn the corner without a great team of people working together and
                discipling new team members. They will do this when they understand
                the concept of the priesthood of the believer; we will cover that
                concept in more detail in the next chapter.
              kind: prose
              UID: MIN171.2.2.1.P.18
              page: 33
            - p: 19
              text: Often, something is “lost in translation” when pastors attend
                conferences and try to transfer what they have learned to their ministry.
                They may come home excited and full of vision, but if a team of leaders
                does not share that vision and does not work together, but rather
                are at cross-purposes, it will be nearly impossible to implement the
                vision.
              kind: prose
              UID: MIN171.2.2.1.P.19
              page: 33
            - p: 20
              text: It is not enough to revitalize pastors; we must empower teams
                and help them understand that they are not in the church only to be
                blessed, but also to be a blessing to others. Leadership teams who
                engage in the Acts 2 process—working, praying, and dreaming through
                it together—will change churches. When you develop your understanding
                of God’s plan and purpose as a team, the chances of success skyrocket.
                When church leaders work together with empowered teams, our experience
                shows that about 80 percent report significant progress.
              kind: prose
              UID: MIN171.2.2.1.P.20
              page: 34
            - p: 21
              text: The team-centered process does not end with the leadership team;
                the entire church must catch the paradigm shift that they have not
                hired a pastor to do everything for them. They must grasp that all
                believers are a kingdom of priests and that congregation members are
                not helpers brought alongside a leader but are part of a team, serving
                God side by side.
              kind: prose
              UID: MIN171.2.2.1.P.21
              page: 34
            - p: 22
              text: The congregation members who see themselves as no more than helpers
                feel no sense of ownership, no vision for the future, and no drive
                to achieve great things for God. They will not take responsibility
                because they see themselves as helpers, not partners. When people
                see themselves as part of a team—all called to the same mission—they
                feel a sense of ownership.
              kind: prose
              UID: MIN171.2.2.1.P.22
              page: 34
            - p: 23
              text: The future of a church does not belong to one visionary leader.
                It belongs to a team of people who share a God-inspired vision for
                their church. Working as a team enables us to reach people for Jesus
                effectively.
              kind: prose
              UID: MIN171.2.2.1.P.23
              page: 34
            - p: 24
              text: 4. Building an Outward Focus
              kind: hang
              UID: MIN171.2.2.1.P.24
              page: 34
            - p: 25
              text: 5. God Has a Plan for Every Church
              kind: hang
              UID: MIN171.2.2.1.P.25
            - p: 26
              text: The final critical component is a plan. For too long, we have
                believed that the work of the Holy Spirit is only and always spontaneous.
                For too long, we have assumed that unless something happens on the
                spur of the moment, the Spirit is not in it, but that is not true.
                The Spirit of God imparts the plans of God, as well as the heart and
                power of God.
              kind: prose
              UID: MIN171.2.2.1.P.26
              page: 35
            - p: 27
              text: God has a plan for every church.
              kind: prose
              UID: MIN171.2.2.1.P.27
            - p: 28
              text: If He has a plan, why would He not communicate it to us? We have
                the Holy Spirit as our teacher, and He revealed the plan to the church
                in Acts 2. Why would He not share His plan with us for our churches?
              kind: prose
              UID: MIN171.2.2.1.P.28
              page: 35
            - p: 29
              text: He has, and He does.
              kind: prose
              UID: MIN171.2.2.1.P.29
            - p: 30
              text: We believe that a pastor and his or her core team of church leaders
                can sit and pray together and hear what God wants them to do in the
                future —the next service, the next month, the next year, and beyond.
                If we believe the Holy Spirit can speak to us in the moment, we must
                believe He can share with us the plan God has for our tomorrow. The
                plan does not come from a book; it comes from studying the truth of
                the Scriptures, praying together, and asking the Holy Spirit what
                He wants to do in and through us.
              kind: prose
              UID: MIN171.2.2.1.P.30
              page: 35
            - p: 31
              text: The Acts 2 Journey is my best idea of how to create a process
                where this plan can take root, flourish, and grow. It is the process
                my father lacked when he began his ministry and what I lacked when
                I began pastoring.
              kind: prose
              UID: MIN171.2.2.1.P.31
              page: 35
            - p: 32
              text: You will not find God’s plan for your church printed for you in
                this book, but through the Acts 2 process, you will develop a vision;
                you will have renewed hope for positive change; you will discover
                how to disciple co-laborers in Christ; and you will find out how to
                receive a Spirit-led plan from God.
              kind: prose
              UID: MIN171.2.2.1.P.32
              page: 35
            - p: 33
              text: We have seen the fruit from churches that are being revitalized
                by making room for God and embracing the plan God laid out for the
                church in Acts 2. The leaders of these churches were not content with
                the status quo; they did not want to become irrelevant. Their days
                of mediocrity are over, and they are behaving as Spirit-led, Spirit-filled,
                Spirit-directed churches.
              kind: prose
              UID: MIN171.2.2.1.P.33
              page: 35
            - p: 34
              text: My hope is that your local church will become one of these churches,
                too.
              kind: prose
              UID: MIN171.2.2.1.P.34
              page: 35
            - p: 35
              text: Dan and Sherry Davis
              kind: heading
              UID: MIN171.2.2.1.P.35
              page: 35
            - p: 36
              text: At the end of this chapter and the next few chapters, I want to
                give you a glimpse of some men and women who have been on the Acts
                2 Journey and have seen remarkable changes in their leadership, their
                teams, their churches, and their communities.
              kind: prose
              UID: MIN171.2.2.1.P.36
              page: 35
            - p: 37
              text: Danny and Sherry Davis brought the leaders of their Odessa, Missouri,
                church to our Acts 2 Journey (A2J) after Danny had been the pastor
                for only three months. Odessa is an aging community that has suffered
                significant economic setbacks. Some of the church leaders, who had
                been through a difficult season of change in their personal lives
                and in their community, assumed The Acts 2 Journey would be just another
                seminar that offered little real hope for change.
              kind: prose
              UID: MIN171.2.2.1.P.37
            - p: 38
              text: During the event, Danny’s leaders immediately saw the value in
                The Acts 2 Journey vision and strategy. They opened their hearts to
                a renewed vision for a dynamic, growing church. With a fresh passion
                for God and a clear plan, they supported Danny and helped craft a
                strategic plan.
              kind: prose
              UID: MIN171.2.2.1.P.38
              page: 36
            - p: 39
              text: Soon after they returned home, Danny and his leaders launched
                their new plan, establishing creative outreaches in the community,
                developing small groups, and developing new leaders. They also began
                holding services in a community about ten miles away. Already, Danny,
                his leaders, and the church have seen dramatic changes—first in themselves
                and then in the impact they are having for Christ.
              kind: prose
              UID: MIN171.2.2.1.P.39
              page: 36
            interactive_questions:
            - p: 1
              text: What is a healthy church?
              response: A healthy church is a Spirit-empowered community of disciples
                who are following Jesus and fulfilling His mission. Healthy churches
                pursue and obey God passionately, engage and maintain loving relationships,
                develop and mobilize their people, act with clear direction and outward
                focus, and reproduce and multiply His mission in other people and
                places.
              UID: MIN171.2.2.1.IQ.1
            - p: 2
              text: Why is a burning platform critical to pursuing change?
              response: Typically, people will not engage change until they recognize
                that they must or something valuable will be lost. A burning platform
                creates an openness and willingness to engage change.
              UID: MIN171.2.2.1.IQ.2
            - p: 3
              text: How can leaders who are not growing limit those they lead?
              response: Because leaders influence and set the pace for others, rarely
                will people outgrow their leaders. So, leaders who are not growing
                place a “lid” on the growth of those who follow.
              UID: MIN171.2.2.1.IQ.3
            - p: 4
              text: Explain how and why a local church’s impact is greatest when the
                people are doing the work of ministry?
              response: First, there are more of them and they will be in more places,
                encountering more people each week than will their pastor. Second,
                people can dismiss the ministry efforts of a pastor as simply “doing
                his job” where the ministry efforts of the people more clearly suggest
                their love for others and commitment to Christ.
              UID: MIN171.2.2.1.IQ.4
            - p: 5
              text: Why might the best days of the week for a healthy church be Monday
                through Saturday, rather than Sunday?
              response: Sundays are great days for the congregation to celebrate what
                God is doing and encourage one another, but Monday through Saturday,
                the church is scattered in the community with enormous possibilities
                as they love their neighbors and engage Christ’s mission.
              UID: MIN171.2.2.1.IQ.5
            - p: 6
              text: Though we share the same mission, why does God have a unique vision
                and ministry plan for every church?
              response: God is infinitely creative and demonstrates that creativity
                principally through His Church today. Each congregation has unique
                gifts, life experiences, and relationships with the people in their
                community, so it makes sense that God’s plans for each church would
                be designed especially for them. The Priesthood of All Believers 3
                CHAPTER
              UID: MIN171.2.2.1.IQ.6
