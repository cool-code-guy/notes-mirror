    - last_modified: '2026-03-27'
      title: 12 - Connect
      lessons:
      - last_modified: '2026-03-27'
        title: A Loving Connection
        subobjectives:
          12.1.1:
            body:
            - p: 1
              text: 'Love among believers is not optional; it is necessary and central
                to God’s calling for the church. On the night Jesus was betrayed,
                one of His final instructions to His followers was about the nature
                of their relationships: “A new commandment I give to you, that you
                love one another; as I have loved you, that you also love one another.
                By this all will know that you are My disciples, if you have love
                for one another” (John 13:34–35, NKJV).'
              kind: prose
              UID: MIN171.12.1.1.P.1
              page: 136
            - p: 2
              text: 'John was paying attention that night. In his first letter, he
                captured the heart of Jesus’ teaching: Our love for others flows naturally
                (or supernaturally) from our experience of Jesus’ great love for us.'
              kind: prose
              UID: MIN171.12.1.1.P.2
              page: 136
            - p: 3
              text: In this the love of God was manifested toward us, that God has
                sent His only begotten Son into the world, that we might live through
                Him. In this is love, not that we loved God, but that He loved us
                and sent His Son to be the propitiation for our sins. Beloved, if
                God so loved us, we also ought to love one another. (1 John 4:9–11,
                NKJV)
              kind: quote
              UID: MIN171.12.1.1.P.3
              page: 136
            - p: 4
              text: In building an Acts 2 church, love is the glue that holds everything
                together. In his book, Natural Church Development , Christian Schwarz
                (1996) comments,
              kind: prose
              UID: MIN171.12.1.1.P.4
            - p: 5
              text: Growing churches possess a measurably higher ‘love quotient’ than
                stagnant, declining ones. Healthy growing churches practice hospitality
                as believers invite others into their homes as a normal part of their
                Christian lives. People don’t want to hear us talk about love, they
                want to experience how Christian love really works.
              kind: quote
              UID: MIN171.12.1.1.P.5
              page: 136
            - p: 6
              text: The way you welcome and treat people who come into your church
                is the first piece of connect. This is that vital first impression,
                and, cliché or not, people establish a great deal of their opinion
                about your church the moment they walk through the doors—if they have
                not already formed it in the parking lot! We simply cannot overstate
                how essential it is to welcome people warmly.
              kind: prose
              UID: MIN171.12.1.1.P.6
              page: 136
            - p: 7
              text: The second aspect of connect is helping the congregation live
                out an Acts 2-modeled lifestyle. At the beginning of the book, we
                read that the believers of the first-century church shared their lives
                with one another and supported, prayed for, and served one another.
              kind: prose
              UID: MIN171.12.1.1.P.7
              page: 136
            - p: 8
              text: Too often, our idea of fellowship is to talk with people before
                church or to get together for meals, but relationship is all-encompassing.
                Relationship in a biblical, Acts 2-framework is sharing life.
              kind: prose
              UID: MIN171.12.1.1.P.8
              page: 136
            - p: 9
              text: 'We can break down each of the five functions into components,
                but they are not linear and separate. They intersect with one another,
                and they share this in common: they must be lived out in relationship.
                We start with connect—not because it is the highest priority but because
                discipleship, service, evangelism, and worship happen in the context
                of relationship.'
              kind: prose
              UID: MIN171.12.1.1.P.9
              page: 136
            - p: 10
              text: Where Does Connect Begin?
              kind: heading
              UID: MIN171.12.1.1.P.10
              page: 137
            - p: 11
              text: 'Reports declare that over 100 million people attend church every
                Sunday, but more rigorous research shows the number is only about
                50 million (Shattuck 2015). However, most of those people have never
                answered one key question: Why?'
              kind: prose
              UID: MIN171.12.1.1.P.11
              page: 137
            - p: 12
              text: Some go out of guilt. Some go because they feel pressured by family
                members. Some attend church merely out of habit. Some go because they
                think it is “the thing to do.”
              kind: prose
              UID: MIN171.12.1.1.P.12
              page: 137
            - p: 13
              text: 'Tragically, millions more avoid church attendance for a variety
                of reasons: They think the sermons are boring, the people are not
                friendly, all the preacher wants is their money, they need Sunday
                to rest and spend time with family, and so forth. Many never darken
                a church door because they think they do not need God and they do
                not want anything to do with religion.'
              kind: prose
              UID: MIN171.12.1.1.P.13
              page: 137
            - p: 14
              text: Yet many people have never clarified to themselves why they make
                this choice.
              kind: prose
              UID: MIN171.12.1.1.P.14
              page: 137
            - p: 15
              text: If an individual who does not attend church were to ask members
                of your congregation why they go to church, would your members be
                ready with an answer? What would they say?
              kind: prose
              UID: MIN171.12.1.1.P.15
              page: 137
            - p: 16
              text: 'Before we welcome people to church and before we help them get
                plugged in to grow and serve, we must first invite them. And how will
                we invite them if we ourselves do not know why we go? Reaching out
                to the unchurched begins with one simple thing: connecting to others
                and welcoming them to our family.'
              kind: prose
              UID: MIN171.12.1.1.P.16
              page: 137
            - p: 17
              text: All in the Family
              kind: heading
              UID: MIN171.12.1.1.P.17
              page: 137
            - p: 18
              text: The moment you were born, you became part of the human race and
                a family. When you were reborn spiritually, you were born into God’s
                family. Peter writes, God “has given us the privilege of being born
                again so that we are now members of God’s own family” (1 Peter 1:3,
                TLB).
              kind: prose
              UID: MIN171.12.1.1.P.18
              page: 137
            - p: 19
              text: What is the name of this family? The Bible says this family is
                called the church.
              kind: prose
              UID: MIN171.12.1.1.P.19
              page: 137
            - p: 20
              text: The church is not an institution. It is not a business. It is
                not a social club. Connect recognizes the church as a family—a family
                Paul calls “the pillar and foundation of the truth” (1 Timothy 3:15,
                NLT). As church leaders it is our job to help facilitate this because
                it helps the members of our congregations form relationships with
                one another.
              kind: prose
              UID: MIN171.12.1.1.P.20
              page: 138
            - p: 21
              text: Jesus told us that in this life, we will have trouble. The storms
                of life will come—personal storms, financial storms, relational storms,
                physical, and health storms. If you do not have a good foundation
                and some support, those storms are going to wash away whatever you
                have built in your life. The church exists on the earth to share the
                gospel and to be a support and foundation upon which we can build
                our lives and relationships by facilitating people’s relationship
                with the Rock, Jesus Christ.
              kind: prose
              UID: MIN171.12.1.1.P.21
              page: 138
            - p: 22
              text: The Christian life is more than belief and action—it is relationship.
                It is connection, belonging, and community.
              kind: prose
              UID: MIN171.12.1.1.P.22
              page: 138
            - p: 23
              text: It is family.
              kind: prose
              UID: MIN171.12.1.1.P.23
            - p: 24
              text: Sometimes I hear individuals say, “I am a Christian, but I do
                not need a church.” That is like saying you want to play football
                in the NFL but you do not want to be part of a team, or you want to
                be a soldier but not be in an army, or you want to play a tuba but
                not be in an orchestra.
              kind: prose
              UID: MIN171.12.1.1.P.24
              page: 138
            - p: 25
              text: A Christian without a church family is an orphan. Orphans lack
                the support and foundation necessary to make it through rough times,
                and they grow up disassociating with society, feeling burdened by
                trust issues, and missing out on the power and support of family.
              kind: prose
              UID: MIN171.12.1.1.P.25
              page: 138
            - p: 26
              text: It is a tragic thing to be orphaned—to be left without family.
                It is worse to actively choose to be an orphan, yet millions do so
                every Sunday while we sit in our pews, oblivious to the plight of
                “orphans” around the world.
              kind: prose
              UID: MIN171.12.1.1.P.26
              page: 138
            citations:
            - citekey: schwarz1996
              pandoc: '[@schwarz1996]'
              intext: (Schwarz 1996)
              paragraph: MIN171.12.1.1.P.4
              UID: MIN171.12.1.1.C.1
            - citekey: shattuck2015
              pandoc: '[@shattuck2015]'
              intext: (Shattuck 2015)
              paragraph: MIN171.12.1.1.P.11
              UID: MIN171.12.1.1.C.2
            interactive_questions:
            - p: 1
              text: Why is our love for one another critical to fulfilling Christ’s
                mission?
              response: To love one another is the command Jesus prioritizes. He told
                us that when we love one another, we reveal Him and demonstrate our
                connection to Him.
              UID: MIN171.12.1.1.IQ.1
            - p: 2
              text: What evidences do we see in the early church of believers loving
                one another?
              response: In the early church, they broke bread together in their homes,
                shared their possessions with one another as they had need, shared
                their lives with one another, and prayed with one another.
              UID: MIN171.12.1.1.IQ.2
            - p: 3
              text: Which of the reasons in which people do not attend church concerns
                you most and why?
              response: Answers may vary, but the belief that they do not need God
                should be most concerning to us.
              UID: MIN171.12.1.1.IQ.3
            - p: 4
              text: What are some positive ways that the church can be like a family?
              response: Answers will vary.
              UID: MIN171.12.1.1.IQ.4
            - p: 5
              text: In what other ways might a Christian without a church family be
                like an orphan?
              response: Answers will vary but could include loneliness, lack of needed
                leadership, and questioning whether they truly belong anywhere.
              UID: MIN171.12.1.1.IQ.5
            last_modified: '2026-03-27'
