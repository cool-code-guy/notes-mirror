    - last_modified: '2026-03-27'
      title: 16 - Worship
      lessons:
      - last_modified: '2026-03-27'
        title: The Essence of Worship
        subobjectives:
          16.1.1:
            body:
            - p: 1
              text: When we say “worship,” most pastors and many churchgoers automatically
                think about songs and music. While these are elements of worship,
                they only express one facet of a concept that is far bigger than the
                song service or the latest worship song topping the Christian music
                charts.
              kind: prose
              UID: MIN171.16.1.1.P.1
              page: 200
            - p: 2
              text: The word worship actually comes from the old English word “worthship.”
                For us, it means living in a way that shows we value God above all
                else. He is worthy of our love, our loyalty, our efforts, and our
                courage—of everything we do each day, not just for an hour on Sunday
                morning.
              kind: prose
              UID: MIN171.16.1.1.P.2
              page: 200
            - p: 3
              text: Worship is not an event. It is a lifestyle.
              kind: prose
              UID: MIN171.16.1.1.P.3
            - p: 4
              text: The many things we do to honor God—from singing meaningful songs,
                to praying, to giving, to serving—are merely expressions of worship,
                leaving us to ask what worship really is at its most basic. An archaic
                Webster’s dictionary provides, perhaps, one of the best definitions
                I have seen by stating that worship is “to honor with extravagant
                love and extreme submission.” Worship is less about the expressions
                we use and more about the heart of the one expressing them and the
                One to whom we give our extravagant love and extreme submission.
              kind: prose
              UID: MIN171.16.1.1.P.4
              page: 200
            - p: 5
              text: This is not the book for an in-depth look at the nature of God
                or why He deserves our worship, but David eloquently touched on it
                in when he wrote, “Worship the Lord in the splendor of his holiness;
                tremble before him, all the earth” (Psalm 96:9, NIV). In a word, we
                worship God because He is holy . Our worship is the direct result
                and the only right outcome of serving a holy God, and while it may
                take many forms, worship is about demonstrating a sincere heart toward
                an unequaled God.
              kind: prose
              UID: MIN171.16.1.1.P.5
              page: 200
            - p: 6
              text: 'Quoting David again, our worship is the hunger and thirst of
                a soul longing for restoration to the One who created us:'
              kind: prose
              UID: MIN171.16.1.1.P.6
              page: 200
            - p: 7
              text: Worship is the expression of our hearts as we give glory to a
                holy God.
              kind: prose
              UID: MIN171.16.1.1.P.7
              page: 200
            - p: 8
              text: Worship in Context
              kind: heading
              UID: MIN171.16.1.1.P.8
              page: 201
            - p: 9
              text: The church has gone through many phases, and in recent years,
                we have focused on musical worship and celebration. In some ways,
                this has been a good thing. In other ways, as we have focused on music,
                we have neglected evangelism and discipleship. Hillsong made amazing
                musical worship mainstream, and as it became a focus and emphasis,
                many churches lost the vision of the missional church and the growth
                of the discipling church.
              kind: prose
              UID: MIN171.16.1.1.P.9
              page: 201
            - p: 10
              text: With the emphasis on an emotional worship experience, we find
                ourselves wondering why we are producing disciples who are shallow
                spiritually and who live out of their emotions instead of out of the
                Word. When asked, average churchgoers say that the Sunday morning
                service is their chief source of discipleship, and in many churches,
                they give more time to praise and worship than to preaching or teaching
                of the Bible. In short, things are out of balance, and our evangelism
                and discipleship statistics reflect this clearly.
              kind: prose
              UID: MIN171.16.1.1.P.10
              page: 201
            - p: 11
              text: Worshipping God through music is a wonderful thing, but music
                is not the only form of worship. The five functions God gave the first-century
                church were not multiple choice—we do not get to pick worship at the
                expense of everything else.
              kind: prose
              UID: MIN171.16.1.1.P.11
              page: 201
            - p: 12
              text: One of our Acts 2 team members recently visited a church in California
                pastored by a man whose son leads one of the most iconic Christian
                musical groups of the last few decades. He was surprised their musical
                worship lasted only ten minutes, so he asked the pastor about it afterward.
              kind: prose
              UID: MIN171.16.1.1.P.12
              page: 201
            - p: 13
              text: “I cannot compete with my kids,” he answered. “I cannot buy enough
                lights or pump enough smoke. I cannot make it enough of a concert.
                But church was never meant to be a concert.”
              kind: prose
              UID: MIN171.16.1.1.P.13
              page: 201
            - p: 14
              text: He revealed that the Millennials of his church had said they were
                hungry for more of God’s Word, and they thought the praise service
                was too long. “They told me they could sing anywhere, all day long,”
                he said, “but they could not receive discipleship, pray with other
                believers, or get personalized teaching like they could in the service.”
              kind: prose
              UID: MIN171.16.1.1.P.14
              page: 201
            - p: 15
              text: “They do not want to just get emotional about music,” he went
                on. “They do not want to walk out not knowing anything about God’s
                Word.”
              kind: prose
              UID: MIN171.16.1.1.P.15
              page: 201
            - p: 16
              text: This church that birthed an incredible musical artist, now has
                a short music worship time; however, the body prays together for almost
                fifteen minutes each service. Twenty-somethings now fill the seats
                and even the aisles, eagerly writing on pages of message notes or
                on their iPads and smartphones; these devices glow in the darkened
                sanctuary.
              kind: prose
              UID: MIN171.16.1.1.P.16
              page: 201
            - p: 17
              text: In this church, the emphasis on worship through music has come
                full circle, swinging the emphasis around again to prayer and discipleship
                that had been de-emphasized far too long.
              kind: prose
              UID: MIN171.16.1.1.P.17
              page: 201
            - p: 18
              text: I do not share this with you to cast a negative light on long
                worship services or to say that worshipping God in song is not wonderful.
                However, our churches have been in the midst of a music fad for decades,
                and the evidence shows that we have failed to give adequate attention
                to making disciples who make disciples.
              kind: prose
              UID: MIN171.16.1.1.P.18
            - p: 19
              text: How can we expect to have healthy churches without a healthy perspective
                on worship in all its forms? That healthy perspective comes when we
                see worship (especially music-based worship) within a larger context
                of the other functions of the church. Music is just one form of worship—not
                the primary one.
              kind: prose
              UID: MIN171.16.1.1.P.19
              page: 202
            - p: 20
              text: Worship for Those Who Cannot Sing
              kind: heading
              UID: MIN171.16.1.1.P.20
              page: 202
            - p: 21
              text: During our Acts 2 Journeys, we frequently bring up that the church
                has to be about Him and about “them”—the people outside our churches
                with whom we should be building relationships. The minute we get focused
                on us, we begin to do a lousy job of worshipping Him and an even worse
                job of reaching out to them . When we seek first the kingdom of God,
                He takes care of us.
              kind: prose
              UID: MIN171.16.1.1.P.21
              page: 202
            - p: 22
              text: As we help pastors through the Acts 2 process, we encounter many
                people who are looking for better answers. I mentioned earlier that
                the problem is that we do not need better answers; we need to ask
                better questions. We are not going to get the answers we need if our
                questions are focused on “us.”
              kind: prose
              UID: MIN171.16.1.1.P.22
              page: 202
            - p: 23
              text: Many churches are asking, “What kind of music will help us grow?”
                or “How do we keep everyone happy?” We try to shift the focus outward
                to ask questions like, “How can we worship God more fully?” or “How
                can we demonstrate God’s love to people who need Him?” When we do
                this, the answers get much easier—and a lot more powerful for the
                church.
              kind: prose
              UID: MIN171.16.1.1.P.23
              page: 202
            - p: 24
              text: 'Here is a prime example of a better question: What do you do
                with the person in your church who does not sing? What does that individual
                do in the midst of your music?'
              kind: prose
              UID: MIN171.16.1.1.P.24
              page: 202
            - p: 25
              text: A friend tells of an experience in his church with one such young
                man. He was reverent, but he did not do what everyone else was doing
                during the worship time because he did not sing. He told my friend
                that he did not care about “all that other stuff” and just came to
                hear him preach. It really challenged my friend with the burning question
                of how to help this young man engage in worship.
              kind: prose
              UID: MIN171.16.1.1.P.25
              page: 202
            - p: 26
              text: 'That question created some powerful answers, one of which was
                that my friend started standing up at an opportune moment during the
                music and saying to the congregation, “Let us pause just a minute
                here. Finish this sentence: ‘I am so glad that God is __________.’”
                Then he prompted the congregation for verbal responses, and like popcorn,
                people began saying things out loud.'
              kind: prose
              UID: MIN171.16.1.1.P.26
            - p: 27
              text: One person said they were glad that God is forgiving, another
                that He is merciful, and so forth. The pastor then said, “Let us take
                just a minute to grab on to one of these things and tell God we are
                glad for that. Just talk to God about it.”
              kind: prose
              UID: MIN171.16.1.1.P.27
              page: 203
            - p: 28
              text: As they pursued answers like this to the question of what to do
                for people who were not engaged in the singing, my friend watched
                the young man out in the congregation. He could see that in the midst
                of these moments, the young man was actually talking to God in a deep
                and meaningful way; he was worshipping God in spite of the fact that
                he could not sing. He was talking to God from his heart, and this
                is assuredly a deep and meaningful act of worship.
              kind: prose
              UID: MIN171.16.1.1.P.28
              page: 203
            - p: 29
              text: Worship is more than the ten, twenty, thirty, or however many
                minutes your church spends on music. While worship certainly includes
                music, it is something we can do in everyday life apart from music.
              kind: prose
              UID: MIN171.16.1.1.P.29
              page: 203
            - p: 30
              text: Worship is about how we live .
              kind: prose
              UID: MIN171.16.1.1.P.30
              page: 203
            interactive_questions:
            - p: 1
              text: What does the word “worship” actually mean?
              response: Worship is “to honor with extravagant love and extreme submission.”
                Worship is a lifestyle that honors and glorifies God. Worship is about
                demonstrating a sincere heart toward an unequaled God. Additional
                answers may vary.
              UID: MIN171.16.1.1.IQ.1
            - p: 2
              text: What can lead to imbalance in worship?
              response: Too much emphasis on emotional worship experiences can produce
                disciples who live out of their emotions instead of living out of
                the Word of God. Over-emphasizing worship can lead to a neglect of
                evangelism and discipleship. Worship can also become a ritual, rather
                than meaningful expressions of praise to God. Additional answers may
                vary.
              UID: MIN171.16.1.1.IQ.2
            - p: 3
              text: How can a church keep a healthy perspective on worship?
              response: A healthy perspective comes when we see worship (especially
                music-based worship) within the larger context of the other functions
                of the church.
              UID: MIN171.16.1.1.IQ.3
            - p: 4
              text: What does it mean to shift the focus of worship outward?
              response: Shifting the focus of worship outward first means that we
                are focused, not on ourselves, but on God. It, then, asks how can
                we worship God more fully and how can we demonstrate His love to people
                who need Him?
              UID: MIN171.16.1.1.IQ.4
