    - last_modified: '2026-03-27'
      title: 17 - Putting it all Together
      lessons:
      - last_modified: '2026-03-27'
        title: Initiating the Strategic Plan
        subobjectives:
          17.1.1:
            body:
            - p: 1
              text: Whether your church is in the heart of a city, the suburbs, or
                in a rural area, the principles upon which Christ founded the first-century
                church will work, because God is the One who designed the plan. Whether
                your church is a small, healthy congregation or a large, struggling
                one, the process within Acts 2 can help your church grow in health
                and impact.
              kind: prose
              UID: MIN171.17.1.1.P.1
              page: 212
            - p: 2
              text: 'This is where it all comes together. You have read about the
                foundation upon which this is all built: every believer is a priest.
                You have seen that the mission Jesus gave us in the Great Commission
                is universal and not optional. You know that God has a plan for your
                church and that the Holy Spirit wants to share that vision with you.
                You also understand that core values represent the identity of your
                church and reflect how your congregation will get to that preferred
                future.'
              kind: prose
              UID: MIN171.17.1.1.P.2
              page: 212
            - p: 3
              text: You build your strategic plan around the functions of the church
                as listed in Acts 2:42–47 that we have communicated in connect, grow,
                serve, go, and worship. I pray that you can use the contents of the
                chapter on each of these functions to begin asking the right questions
                for your church.
              kind: prose
              UID: MIN171.17.1.1.P.3
              page: 212
            - p: 4
              text: What does God say to you through each of these functions? How
                does your vision incorporate the mission of the church, your church’s
                strengths, and its core values? How will you demonstrate the values
                (behaviors) necessary to fulfill your vision using the five functions
                of the first-century church? What growth steps will you take to fulfill
                a vision of each of the five functions over the next three to five
                years?
              kind: prose
              UID: MIN171.17.1.1.P.4
              page: 212
            - p: 5
              text: These are just a few of the primary journey points to assist your
                church in going to the next level. Every church will have its own
                unique journey to get from where you are to where you want to be,
                but what you have just read is the process that I lacked in my early
                years as a pastor.
              kind: prose
              UID: MIN171.17.1.1.P.5
              page: 212
            - p: 6
              text: 'I hope you see that the five functions I have presented are a
                road map for accomplishing our mission on earth: to make disciples,
                to reach the ends of the world, to develop our ministry gifts, to
                grow in relationships though connections, to discover how God made
                us, and to share our faith with others.'
              kind: prose
              UID: MIN171.17.1.1.P.6
              page: 212
            - p: 7
              text: Remember, the five functions do not stand alone. God gave them
                to us to work in concert with each other at all times. They are simultaneous,
                not sequential. Too often, we try to separate the functions or focus
                on some to the exclusion of others when God intended for them to work
                together for our strength and harmony.
              kind: prose
              UID: MIN171.17.1.1.P.7
              page: 213
            - p: 8
              text: Impact
              kind: heading
              UID: MIN171.17.1.1.P.8
              page: 213
            - p: 9
              text: The Acts 2 process is seeing results. Ninety-five percent of pastors
                feel better equipped to lead their congregations after going through
                it, and 88 percent see their teams functioning more effectively than
                ever before. Sixty-two percent of declining churches are no longer
                declining after implementing the Acts 2 Journey, and more than half
                are already experiencing growth. (These statistics are based on outcome
                studies from Acts 2 Journey churches.)
              kind: prose
              UID: MIN171.17.1.1.P.9
              page: 213
            - p: 10
              text: These church leaders are seeing results because they are working
                the process and engaging with the timeless functions upon which Jesus
                founded the church.
              kind: prose
              UID: MIN171.17.1.1.P.10
              page: 213
            - p: 11
              text: The results you experience personally hinge on your willingness
                to embrace change. You must decide whether or not you will accept
                both the Spirit’s empowerment and the process God gave us in Acts
                2. If you do, your church can begin to see greater impact in your
                community as a Spirit-empowered church with an Acts 2 vision.
              kind: prose
              UID: MIN171.17.1.1.P.11
              page: 213
            - p: 12
              text: It is All About People
              kind: heading
              UID: MIN171.17.1.1.P.12
              page: 213
            - p: 13
              text: Throughout the course of this book, we have been on a journey
                toward the next level of spiritual health. It is a process—one that
                continues throughout the life of a church and is renewed with new
                life and vision as new leaders come in and old leaders are renewed.
              kind: prose
              UID: MIN171.17.1.1.P.13
              page: 213
            - p: 14
              text: The journey does not end with this book, and it does not end when
                you craft a strategic plan for your church that uses the five functions
                as a template. As you grow and the church grows, as leaders come and
                go, and as society changes, the need for reviewing this process will
                come again and again.
              kind: prose
              UID: MIN171.17.1.1.P.14
              page: 213
            - p: 15
              text: 'One thing will never change: This is all about people.'
              kind: prose
              UID: MIN171.17.1.1.P.15
            - p: 16
              text: The church is not a building. You and your people are the church.
                But you are more than the church and the hope of the world . . . you
                are the Spirit-empowered church, and you have exactly what a lost
                and hurting world needs most. Now, it is time for you to put all of
                this together and use it for your church. It is time to train the
                next generation of disciples and equip the saints for the work of
                the ministry, for we are all truly part of a royal priesthood of believers!
              kind: prose
              UID: MIN171.17.1.1.P.16
              page: 213
            - p: 17
              text: 'Epilogue: Hope Found'
              kind: heading
              UID: MIN171.17.1.1.P.17
              page: 213
            - p: 18
              text: Across America and the world, churches and church leaders are
                looking for hope. We want to be relevant and effective, and we want
                to leave a powerful legacy of hope for future generations. The choices
                we make today will shape the church of tomorrow.
              kind: prose
              UID: MIN171.17.1.1.P.18
            - p: 19
              text: Will it be strong, or will it be crumbling?
              kind: prose
              UID: MIN171.17.1.1.P.19
            - p: 20
              text: We have not lost our faith—we still believe in the truth of God’s
                Word, the Great Commission, and the Great Commandment. We still believe
                in the power of the Holy Spirit, and our hearts still yearn to see
                God’s kingdom advance on the earth.
              kind: prose
              UID: MIN171.17.1.1.P.20
              page: 214
            - p: 21
              text: But all too often what we have lost is our hope.
              kind: prose
              UID: MIN171.17.1.1.P.21
            - p: 22
              text: In my own life, I stared this in the face as my mom, such a long-standing
                anchor of faith and hope for our family, pointed her finger in my
                face and told me never to pray in her presence again. It reduced me
                to tears as I drove home and later as I prayed that night.
              kind: prose
              UID: MIN171.17.1.1.P.22
              page: 214
            - p: 23
              text: My dad lay near death; he had not spoken a word in months and
                had not been coherent in years. Though he and my mom had ministered
                to many people and had seen many great moves of God, all of our prayers
                for Dad seemed to have gone unanswered.
              kind: prose
              UID: MIN171.17.1.1.P.23
              page: 214
            - p: 24
              text: It had taken a great toll on my mom.
              kind: prose
              UID: MIN171.17.1.1.P.24
            - p: 25
              text: 'I was afraid she had lost her faith, but in my tearful prayers
                that night, the Holy Spirit showed me the truth: She had not lost
                her faith at all. Her decades of service to Christ had forged in her
                a faith that would never be lost. She knew in her mind that God’s
                promises are true . . . but in her despair, she had lost hope.'
              kind: prose
              UID: MIN171.17.1.1.P.25
              page: 214
            - p: 26
              text: Final Word
              kind: heading
              UID: MIN171.17.1.1.P.26
              page: 214
            - p: 27
              text: Four days after my mother’s angry, bitter, and hopeless outburst,
                she went back to the hospital to visit Dad. There, to her astonishment,
                she felt the presence of God.
              kind: prose
              UID: MIN171.17.1.1.P.27
              page: 214
            - p: 28
              text: “I did not want to feel it,” she told me later, “but it was like
                an anointing cloud.”
              kind: prose
              UID: MIN171.17.1.1.P.28
              page: 214
            - p: 29
              text: In the Old Testament, they called it the Shekinah glory. God is
                so powerfully real that He has an essence about Him we can sometimes
                sense. It was this essence of God’s Spirit that came over my mother
                when she walked into Dad’s room—and accompanying that essence, she
                heard a voice speak to her heart.
              kind: prose
              UID: MIN171.17.1.1.P.29
              page: 214
            - p: 30
              text: Four days earlier, I had heard the voice of the enemy trying to
                destroy my hope, but this day, the voice of the Holy Spirit whispered
                to my mother.
              kind: prose
              UID: MIN171.17.1.1.P.30
              page: 214
            - p: 31
              text: He said, “Get ready; he is going to talk to you today.”
              kind: prose
              UID: MIN171.17.1.1.P.31
            - p: 32
              text: That was crazy! The doctors had already told us Dad was gone.
                Even if he came out of the coma, it had been months since he had spoken.
                His speech leading up to this crisis had been unintelligible for months.
              kind: prose
              UID: MIN171.17.1.1.P.32
              page: 214
            - p: 33
              text: My mother had lost all hope, but the voice of the Spirit was nudging
                her hope gauge just a little bit, and it began to swell from empty
                to full. She sat down by Dad’s bed and waited with anticipation for
                what he would say.
              kind: prose
              UID: MIN171.17.1.1.P.33
              page: 214
            - p: 34
              text: “I don’t know if I waited three minutes or three hours,” she told
                me later, “but I was looking into his eyes when they cleared up, and
                he looked right at me.” Her own eyes glowed as she told me, “His mouth
                began to move, and with a strong voice he said, ‘You know what, honey?
                God still answers prayer.’”
              kind: prose
              UID: MIN171.17.1.1.P.34
              page: 214
            - p: 35
              text: For the next ten minutes, my dad lay there, praying in an unknown
                tongue under the power of the Holy Spirit. Finally, he slid back into
                the coma.
              kind: prose
              UID: MIN171.17.1.1.P.35
              page: 214
            - p: 36
              text: Soon afterward, he died.
              kind: prose
              UID: MIN171.17.1.1.P.36
              page: 214
            - p: 37
              text: “Son, nobody else could have spoken that phrase to me,” my mother
                declared afterward. “Not you, not any preacher, not any prophet—nobody
                could have spoken that phrase and had it mean anything to me. The
                only man who could say that and have it mean anything to me was your
                daddy, and he was brain-dead—but God let him preach one more message!
                And it restored my hope!”
              kind: prose
              UID: MIN171.17.1.1.P.37
              page: 215
            - p: 38
              text: The Hope of the World
              kind: heading
              UID: MIN171.17.1.1.P.38
              page: 215
            - p: 39
              text: Today, we stand at a crossroads in our culture and in our churches.
                The devil wants to stop the church, and to do that, he tries to take
                us out individually. He knows it is easier to prey on our emotions
                than it is to defeat us scripturally, so he manipulates the way we
                think about our circumstances to make it appear that hope is lost.
              kind: prose
              UID: MIN171.17.1.1.P.39
              page: 215
            - p: 40
              text: However, he cannot alter the Word of God, and he cannot resist
                the power of the Holy Spirit.
              kind: prose
              UID: MIN171.17.1.1.P.40
              page: 215
            - p: 41
              text: God shares a process in Acts 2 that offers any church hope, because
                it is His original blueprint. In our shifting, changing world, God’s
                Word remains, and His plan for the original church has not changed
                to fit the times. It is as timeless as our mission.
              kind: prose
              UID: MIN171.17.1.1.P.41
              page: 215
            - p: 42
              text: God has given us His Word so we might stand firm and have hope.
                Paul tells us, “For whatever was written in earlier times was written
                for our instruction, so that through perseverance and the encouragement
                of the Scriptures we might have hope” (Romans 15:4, NASB). And in
                another place, he writes, “Three things will last forever—faith, hope,
                and love” (1 Corinthians 13:13, NLT).
              kind: prose
              UID: MIN171.17.1.1.P.42
              page: 215
            - p: 43
              text: The devil can try. He can lie, he can cheat, he can steal—but
                in the end, he does not have the authority to take our hope.
              kind: prose
              UID: MIN171.17.1.1.P.43
              page: 215
            - p: 44
              text: So we must not give it to him.
              kind: prose
              UID: MIN171.17.1.1.P.44
            - p: 45
              text: My father’s miraculous final words restored my mother’s hope.
                As you face the challenges of leading a church, what will restore
                your hope, friend?
              kind: prose
              UID: MIN171.17.1.1.P.45
              page: 215
            - p: 46
              text: Trying times have come before, and the Lord has graciously breathed
                life over the coals, bringing revitalization just when it seemed all
                was lost. Just as He breathed life into humankind and upon those gathered
                in the upper room, His breath of life is all that is necessary for
                us to spring up into flame again! He yearns to empower His church
                and see us make a great impact on our world!
              kind: prose
              UID: MIN171.17.1.1.P.46
              page: 215
            - p: 47
              text: It has happened before, and great moves of God have swept across
                the face of the world to push back tides of darkness. If it has happened
                before, it can happen again. But we must pray for it and seek His
                empowerment.
              kind: prose
              UID: MIN171.17.1.1.P.47
              page: 215
            - p: 48
              text: The gates of hell will not prevail against the Spirit-empowered
                church God placed on this earth to win the lost. May we be found doing
                this mission faithfully and be told, “Well done, good and faithful
                servants.”
              kind: prose
              UID: MIN171.17.1.1.P.48
              page: 215
            - p: 49
              text: So where do we look to restore our hope? New ministry strategies?
                Old traditions recovered?
              kind: prose
              UID: MIN171.17.1.1.P.49
              page: 215
            - p: 50
              text: No. We cannot look to our own ingenuity, intellect, and human
                effort. Our hope is not in a program or even a process—it is in a
                Person.
              kind: prose
              UID: MIN171.17.1.1.P.50
              page: 216
            - p: 51
              text: 'Hundreds of years before Christ, Isaiah prophesied a word that
                Jesus fulfilled. Matthew records the fulfillment of the prophetic
                word:'
              kind: prose
              UID: MIN171.17.1.1.P.51
              page: 216
            - p: 52
              text: He will not crush the weakest reed
              kind: prose
              UID: MIN171.17.1.1.P.52
            - p: 53
              text: or put out a flickering candle.
              kind: prose
              UID: MIN171.17.1.1.P.53
            - p: 54
              text: Finally he will cause justice to be victorious.
              kind: prose
              UID: MIN171.17.1.1.P.54
            - p: 55
              text: And his name will be the hope
              kind: prose
              UID: MIN171.17.1.1.P.55
            - p: 56
              text: of all the world. (Matthew 12:20–21, NLT)
              kind: prose
              UID: MIN171.17.1.1.P.56
            - p: 57
              text: We have hope because we have Jesus. Now, let us give that hope
                away to the lost people of this world as a church empowered by the
                very Spirit that raised Christ from the dead.
              kind: prose
              UID: MIN171.17.1.1.P.57
            - p: 58
              text: Beginning with the following page, we will move towards implementing
                a strategic plan based on the Acts 2 process. This will give you the
                opportunity to put to work the principles covered in the previous
                chapters, and apply them to your local situation. May you be guided
                by the Holy Spirit, as you continue this journey.
              kind: prose
              UID: MIN171.17.1.1.P.58
              page: 216
            interactive_questions:
            - p: 1
              text: Around what framework should a strategic plan be built?
              response: a) form the pathway from mission to values. b) form the pathway
                from values to vision. c) form the pathway from the strategic plan
                to the mission. d) describe the difference between the vision and
                the values.
              UID: MIN171.17.1.1.IQ.1
            - p: 2
              text: What should a church’s vision incorporate?
              response: a) revise the mission of the church to make it more effective.
                b) take passion for God and channel it in the right direction. c)
                take the inward focus of the church to the next level. d) alter the
                values of the church.
              UID: MIN171.17.1.1.IQ.2
            - p: 3
              text: What does the author mean by stating that the five functions work
                in concert together at all times?
              response: a) how to develop enduring values. b) the successful implementation
                of new ministries. c) to nurture people to become all that God wants
                them to be. d) how to connect the values of the church to the leadership
                team.
              UID: MIN171.17.1.1.IQ.3
            - p: 4
              text: What two things is the devil powerless to overcome?
              response: a) the biblical functions known as connect , grow, serve,
                go , and worship . b) the vision and mission of the leader. c) a numerical
                growth plan in progressive stages. d) the biblical priority of spiritual
                gifts.
              UID: MIN171.17.1.1.IQ.4
            - p: 5
              text: For what reason do we have hope?
              response: a) connecting the mission with the vision. b) connecting the
                strategic plan with the mission. c) horizontal relationships with
                people and a vertical relationship with God. d) the connection between
                people and the values of the church.
              UID: MIN171.17.1.1.IQ.5
