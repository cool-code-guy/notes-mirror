      - last_modified: '2026-03-27'
        title: Live|Dead
        subobjectives:
          6.3.1:
            body:
            - p: 1
              text: We cannot build disciples in our churches until we first experience
                this empowerment of the Spirit ourselves and demonstrate it to a hungry
                world. Passionate leaders are living Christ’s call to the church quite
                vibrantly throughout the body of Christ, and lives are changing.
              kind: prose
              UID: MIN171.6.3.1.P.1
              page: 77
            - p: 2
              text: One of these cutting-edge ministries is the Live|Dead movement
                where young people are committing their lives to God so radically
                that they strongly desire to go to the hardest mission fields—places
                where they could be persecuted and even killed. Young, empowered disciples
                are signing up by the hundreds to sell out to God, give everything
                they have to abide with Christ, reach the unreached, and abandon anything
                that holds them back. They are learning that we will obey the Lord
                Jesus and His commission as we return to the simplicity of abiding
                with Him, advance together to plant a church where the church does
                not exist, and embrace suffering and persecution for Jesus’ sake as
                our normal reality.
              kind: prose
              UID: MIN171.6.3.1.P.2
              page: 77
            - p: 3
              text: These young men and women are hungry for an authentic connection
                with the Holy Spirit. They are not seeking something easy, and they
                do not want to be preoccupied with materialism. They want to experience
                the reality of the gospel lived out in the most hostile parts of the
                world. As of this writing, it has not happened though they are willing
                to die for this—to Live|Dead.
              kind: prose
              UID: MIN171.6.3.1.P.3
              page: 77
            - p: 4
              text: 'A member of the Live|Dead team in North Africa writes:'
              kind: prose
              UID: MIN171.6.3.1.P.4
              page: 77
            - p: 5
              text: When our missionaries are imprisoned or killed, we will send more
                missionaries. When our missionaries fail and our teams implode, we
                will repent, revise our structure, improve our preparation, training,
                and pastoral care, and send new teams.
              kind: quote
              UID: MIN171.6.3.1.P.5
            - p: 6
              text: Neither spiritual nor physical attacks will deter us from living
                among resistant people and lovingly proclaiming the gospel to them
                in Jesus’ name.
              kind: quote
              UID: MIN171.6.3.1.P.6
            - p: 7
              text: We will not retreat!
              kind: quote
              UID: MIN171.6.3.1.P.7
            - p: 8
              text: People who are on fire for God let the Holy Spirit take the limits
                off what they think God can do. They are ready for anything, including
                dying for what they believe.
              kind: prose
              UID: MIN171.6.3.1.P.8
            - p: 9
              text: What would happen if our churches had this kind of Spirit-inspired
                passion? What would happen in your town or city if the people in your
                church were willing to live as ones who are dead to reach the hurting
                and lost?
              kind: prose
              UID: MIN171.6.3.1.P.9
              page: 77
            - p: 10
              text: It will never happen with emotionally fanned messages or programs
                or initiatives, and it is too much to do by ourselves. However, it
                can happen when the Holy Spirit fans our spirits into flame, because
                God is ready to empower disciples of Christ all across our hurting
                world.
              kind: prose
              UID: MIN171.6.3.1.P.10
              page: 77
            interactive_questions:
            - p: 1
              text: Is full consecration to Christ intended for every disciple or
                just for the few?
              response: Christ’s call to each of us is to “take up our cross and follow
                Him.” While how He will use us in His mission will vary, there seems
                to be no biblical evidence of a commitment less than giving our lives
                to Him being sufficient for a disciple of Jesus. Assessment 7 CHAPTER
              UID: MIN171.6.3.1.IQ.1
            last_modified: '2026-03-27'
            text: Describe how total consecration to Christ demonstrates that we are
              a part of a "kingdom not of this world."
            glossary: []
    - last_modified: '2026-03-27'
      title: 7 - Assessment
      print_page: 1
      lessons:
      - last_modified: '2026-03-27'
        title: Assessing Our Current Status
        subobjectives:
          7.1.1:
            body:
            - p: 1
              text: If an Acts 2-modeled, Spirit-empowered, transformative congregation
                is the goal, we must ask ourselves what we are experiencing in our
                churches. If it is anything less than this, what must change? You
                must be honest with yourself about your current spiritual realities.
              kind: prose
              UID: MIN171.7.1.1.P.1
              page: 82
            - p: 2
              text: God’s will is for His church to be healthy and to accomplish His
                mission. The road to a healthy church, regardless of size or age demographics,
                begins with asking the right questions of ourselves and assessing
                our current status as Spirit-empowered disciples.
              kind: prose
              UID: MIN171.7.1.1.P.2
              page: 82
            - p: 3
              text: Are We Healthy?
              kind: heading
              UID: MIN171.7.1.1.P.3
              page: 82
            - p: 4
              text: Are we healthy? Can we even agree on the definition of a “healthy
                church”? Perhaps even more fundamentally, do we have the courage to
                assess ourselves honestly? We must look at what has happened in our
                congregations in the last three years and recognize that this is a
                likely predictor of what will happen in the next three years.
              kind: prose
              UID: MIN171.7.1.1.P.4
              page: 82
            - p: 5
              text: If we want to change our results, God must change our hearts.
                Then, with His guidance, we must change our direction, our relationships,
                and our activities. A rigorous, honest assessment is the starting
                point. If what we are doing is not working, we must question it. If
                we are not experiencing the Spirit’s power, we must eagerly seek revitalization
                for ourselves as well as our churches.
              kind: prose
              UID: MIN171.7.1.1.P.5
              page: 82
            - p: 6
              text: Part of the Acts 2 process is using assessment tools designed
                to help churches determine their current condition and then prescribe
                a path to health, but these tools will do nothing for us if we do
                not have the courage to be honest and then act on our findings.
              kind: prose
              UID: MIN171.7.1.1.P.6
              page: 82
            - p: 7
              text: We must ask ourselves why our churches exist, both in a bigger
                context and as a local body. What is our mission? What are we doing
                to fulfill the Great Commission and the Great Commandment?
              kind: prose
              UID: MIN171.7.1.1.P.7
              page: 82
            - p: 8
              text: We must assess our direction—where are we going? Do we have a
                vision and, if so, what is it? How does it fit with God’s picture
                of our envisioned future? What is our unique personality as a church?
              kind: prose
              UID: MIN171.7.1.1.P.8
              page: 82
            - p: 9
              text: How are we behaving as Spirit-empowered disciples? How does our
                church behave? Do we demonstrate our values in a way that lost and
                hurting people can see them?
              kind: prose
              UID: MIN171.7.1.1.P.9
              page: 82
            - p: 10
              text: What is our plan for the future? What results have we seen so
                far, and are they leading us in the right direction? Do we have a
                strategy to get where we need to go?
              kind: prose
              UID: MIN171.7.1.1.P.10
              page: 82
            - p: 11
              text: Finally, we must honestly ask ourselves if we are the right leaders
                for this time and place. Do we have a divine call to this church?
                Is the church our client, or is God our client? We must question ourselves
                and ask who we are trying to please—people or God. And, critically,
                if we are pastoring churches that have plateaued or are declining,
                we must decide if we are willing to seek help.
              kind: prose
              UID: MIN171.7.1.1.P.11
              page: 82
            - p: 12
              text: 'Interactive Question #2 : Why is it important to assess current
                reality and review a church’s plans for the future?'
              kind: prose
              UID: MIN171.7.1.1.P.12
              page: 87
            - p: 13
              text: The future success of our churches and the corporate church hinges
                on our answers to these questions and many others. Our willingness
                to be honest and unreserved in answering these assessment questions
                will go a long way towards determining the types of answers we get
                and whether or not they are helpful.
              kind: prose
              UID: MIN171.7.1.1.P.13
              page: 83
            - p: 14
              text: Congregational Assessment
              kind: prose
              UID: MIN171.7.1.1.P.14
              page: 219
            - p: 15
              text: When I began leading pastors, God inspired me to equip and encourage
                them and their churches in a specific way. We developed a survey for
                our pastors, and we identified eight needs they had. I built a curriculum
                to address those eight needs. Every month, I would have a teaching
                day, and I and other presenters would address one of those needs.
                We went through the year and then repeated the cycle so as many pastors
                as possible could participate.
              kind: prose
              UID: MIN171.7.1.1.P.15
              page: 83
            - p: 16
              text: In Chapter 17 of this book you will find a number of tools, assessments,
                and other resources that have been developed from the Acts 2 Journey.
                These will be used in a step by step process in which senior pastors
                can lead their teams in order to prayerfully develop a vision and
                a strategic plan for their churches. You may wish to preview the congregational
                assessment. It only takes a few minutes to fill out. You will discover
                which of the five functions your church does well and which need some
                attention.
              kind: prose
              UID: MIN171.7.1.1.P.16
              page: 83
            - p: 17
              text: The congregational assessment will help you “take the temperature”
                of your leaders, and perhaps, each team of leaders in your church.
                With the information you derive, you and your leaders will be able
                to form strategic plans based on solid feedback, not just guesses
                about the church’s needs and goals. When using the congregational
                assessment in the process that begins in Chapter 17, it will be important
                to ask people to be completely honest in their responses. You may
                also go to the Acts 2 Journey website (https:// acts2journey.com )
                for additional resources as you work through this process.
              kind: prose
              UID: MIN171.7.1.1.P.17
              page: 83
            interactive_questions:
            - p: 1
              text: Describe the need for an assessment as a starting point for church
                transformation.
              response: Asking honest questions first identifies where we are and
                can then open our eyes to ways in which things must change if we are
                to fulfill our intended mission.
              UID: MIN171.7.1.1.IQ.1
            - p: 2
              text: Complete the Congregational Assessment on pages 219-221 for your
                congregation. If you are a leader in your local church, consider this
                tool’s potential benefit for your leadership team. If you are not
                currently a part of the leadership team, becoming familiar with this
                tool will be beneficial whenever you do serve in such a role.
              response: Student will complete the Congregational Assessment on pages
                219-221.
              UID: MIN171.7.1.1.IQ.2
            last_modified: '2026-03-27'
