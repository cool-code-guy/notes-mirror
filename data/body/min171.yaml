      - last_modified: '2026-03-27'
        title: Implementing the Strategic Plan Based on the Acts 2 Process
        subobjectives:
          17.2.1:
            body:
            - p: 1
              text: Reading the preceding chapters of A Spirit-Empowered Church has
                given you the nuts and bolts of the Acts 2 process as well as the
                key principles regarding the mission, core values, and vision of local
                churches.
              kind: prose
              UID: MIN171.17.2.1.P.1
              page: 216
            - p: 2
              text: In the pages that follow, you will be given a step-by-step process
                to develop a strategic plan that will enable your church to clarify
                its ministry vision and take steps of action consistent with that
                vision. The help of the Holy Spirit is crucial in this process, so
                prayer needs to be foundational in each part of the journey.
              kind: prose
              UID: MIN171.17.2.1.P.2
              page: 216
            - p: 3
              text: 'As a special note to ministerial students who are taking this
                course, there are two different approaches to this step-by-step process
                depending on whether or not you are a senior pastor:'
              kind: prose
              UID: MIN171.17.2.1.P.3
              page: 216
            - p: 4
              text: (1) Senior pastors are strongly encouraged to take the key leaders
                of their congregation through this process in order to brainstorm
                and discuss issues while completing the congregational assessment,
                dream statement, vision statement, values assessment, and strategic
                plan together. A vision is most effective when it is prayerfully developed
                by the pastoral leadership and other congregational leaders and then
                communicated to the congregation.
              kind: hang
              UID: MIN171.17.2.1.P.4
            - p: 5
              text: Many leadership groups have set aside special times of prayer
                while going through the Acts 2 Journey together. It is helpful to
                set aside specific times for corporate prayer as well as personal
                intercession.
              kind: hang
              UID: MIN171.17.2.1.P.5
            - p: 6
              text: (2) If you are not a senior pastor, it is important that you work
                through this process as a vision or guideline of how you would imagine
                yourself to lead a congregation of your own in these areas for a future
                time. You should not go through these exercises in reference to the
                current church you attend or involve others in the congregation in
                this process. The reason for this is that it is problematic when someone
                other than the senior pastor attempts to lead people in a congregation
                through the Acts 2 Journey because the senior pastor is the leader
                who must lead the way in this process.
              kind: hang
              UID: MIN171.17.2.1.P.6
              page: 217
            - p: 7
              text: Senior pastors, these printed copies may also be shared with your
                ministry team. It is recommended that you work through the worksheets
                in the remainder of this chapter together and write down the statements
                or assessments on the pages you have printed out.
              kind: prose
              UID: MIN171.17.2.1.P.7
              page: 217
            - p: 8
              text: On the following pages are key components to help you prayerfully
                develop a strategic plan with your leaders. We developed this list
                of questions to stir your thoughts and your hearts on a deeper level.
                As you proceed on this adventure, your answers will help to chart
                your course as your team moves forward with your goals clearly in
                mind.
              kind: prose
              UID: MIN171.17.2.1.P.8
              page: 217
            - p: 9
              text: Ten Essential Questions
              kind: heading
              UID: MIN171.17.2.1.P.9
              page: 218
            - p: 10
              text: God has a plan for each and every church, and the Acts 2 Journey
                exists to help church leaders find that plan and fulfill it. No church
                has a future unless its dreams are bigger than its memories, and we
                desire to help churches dream the dream that God has for each of them.
                The process of discovering that plan is what we have pioneered with
                our Acts 2 Journeys—a process that has helped literally hundreds of
                churches to discover and fulfill God’s destiny for them. The Acts
                2 Journey helps churches and leaders address ten key questions. These
                questions are addressed in the chapters shown below.
              kind: prose
              UID: MIN171.17.2.1.P.10
              page: 218
            - p: 11
              text: 1. Why do we exist?
              kind: prose
              UID: MIN171.17.2.1.P.11
            - p: 12
              text: (Mission—chapter 8)
              kind: prose
              UID: MIN171.17.2.1.P.12
