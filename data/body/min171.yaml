              - ref: 1 Thessalonians 5:11
                key: 1thessalonians.5.11
                bib_gate: https://www.biblegateway.com/passage/?search=1%20Thessalonians%205%3A11&version=NIV
              paragraph: MIN171.12.2.1.P.10
              UID: MIN171.12.2.1.S.2
            - intext: 1 Peter 3:8
              version: TLB
              refs:
              - ref: 1 Peter 3:8
                key: 1peter.3.8
                bib_gate: https://www.biblegateway.com/passage/?search=1%20Peter%203%3A8&version=TLB
              paragraph: MIN171.12.2.1.P.15
              UID: MIN171.12.2.1.S.3
            text: Explain how our connection with one another contributes to our worship
              and connection with God.
