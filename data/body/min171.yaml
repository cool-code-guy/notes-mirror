            - p: 197
              text: Creating a Vision Statement
              kind: heading
              UID: MIN171.17.2.1.P.197
              page: 224
            - p: 198
              text: A vision statement flows naturally from what you believe God is
                dreaming or envisioning for the future of your congregation. This
                vision can be clarified over time, but it is helpful to capture the
                big picture of how you can see God developing your congregation in
                the five functions of the Acts 2 process. The information and questions
                below will help you to discern God’s vision in these five areas, and
                then to develop a concise vision statement that is a vivid summary
                of the vision—one that will be easy to remember and refer to. As you
                work through this process, consider the following aspects of vision.
              kind: prose
              UID: MIN171.17.2.1.P.198
              page: 224
            - p: 199
              text: The vision of any church will seek to fulfill the biblical mission
                of the church in a specific location and time. Recall that the mission
                of the church is not optional; it can be summarized as fulfilling
                the Great Commission to go and make disciples of all nations (Matthew
                28:19–20) and the Great Commandment, which is loving God with all
                of your heart and loving your neighbor as yourself (Matthew 22:36–37).
                Our vision can show the world what a life connected to God looks like,
                as we carry out His mission for the church (Garrison 2015, 102).
              kind: prose
              UID: MIN171.17.2.1.P.199
              page: 224
            - p: 200
              text: God’s Vision Discerned
              kind: heading
              UID: MIN171.17.2.1.P.200
              page: 224
            - p: 201
              text: Casting a vision for your church is not about pulling visionary
                material out of yourself but about seeing what God is already dreaming
                for your church (Garrison 2015, 109).
              kind: prose
              UID: MIN171.17.2.1.P.201
              page: 224
            - p: 202
              text: True vision is God’s vision for our churches, our neighborhoods,
                and our cities (2015, 109).
              kind: prose
              UID: MIN171.17.2.1.P.202
            - p: 203
              text: 'A vision catches God’s dream for your church, which means that
                writing a good one must include the church’s universal mission and
                the five functions God gave the first-century church...A full vision
                for your church will incorporate love for God and love for others,
                and it will be lived out in the five functions: connect , grow , serve
                , go , and worship (Garrison 2015, 114).'
              kind: prose
              UID: MIN171.17.2.1.P.203
              page: 224
            - p: 204
              text: The Five Functions
              kind: heading
              UID: MIN171.17.2.1.P.204
              page: 19
            - p: 205
              text: The first part of creating a vision statement will be creating
                a statement of what you believe God’s vision is for your church in
                each of the five functions of the Acts 2 process. Then, you will be
                able to create a concise vision statement that captures the essence
                of your vision in a brief but memorable statement.
              kind: prose
              UID: MIN171.17.2.1.P.205
              page: 224
            - p: 206
              text: 'Prayerfully consider and answer these questions when discerning
                God’s plan for your church regarding the five functions of the Acts
                2 process:'
              kind: prose
              UID: MIN171.17.2.1.P.206
              page: 224
            - p: 207
              text: What is God’s vision for the people in your church? How does God
                want to develop them, prepare them, and enable them to use their gifts
                in ministry?
              kind: prose
              UID: MIN171.17.2.1.P.207
              page: 224
            - p: 208
              text: What is God’s vision for the people in your community? How might
                He want you to connect with them, and build relationships with them?
              kind: prose
              UID: MIN171.17.2.1.P.208
              page: 224
            - p: 209
              text: What is God’s vision for your church in each of the five areas
                of Connect (fellowship / hospitality), Grow (discipleship), Serve
                (gift-oriented ministry), Go (evangelism), and Worship (praise and
                prayer)?
              kind: prose
              UID: MIN171.17.2.1.P.209
              page: 224
            - p: 210
              text: Keep in mind that a healthy church (1) engages and maintains loving
                relationships ( Connect ); (2) develops and mobilizes the people (
                Grow ); (3) acts with clear direction and outward focus ( Serve );
                (4) reproduces and multiplies His mission in other peoples and places
                ( Go ); and (5) pursues and obeys God passionately ( Worship ).
              kind: prose
              UID: MIN171.17.2.1.P.210
              page: 224
            - p: 211
              text: What is God’s Vision for Your Church for the Five Functions of
                the Acts 2 Process?
              kind: heading
              UID: MIN171.17.2.1.P.211
              page: 225
            - p: 212
              text: To describe what you believe God’s vision is for your church in
                each of these Acts 2 functions, refer to your dream statement. Then,
                prayerfully consider how to translate those dreams into positive statements
                that capture God’s vision for your church for the future in those
                areas. Write a statement for each of the five functions in the chart
                below.
              kind: prose
              UID: MIN171.17.2.1.P.212
              page: 225
            - p: 213
