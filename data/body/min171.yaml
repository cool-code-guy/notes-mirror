    - last_modified: '2026-03-27'
      title: 6 - Creating Spirit-Empowered Disciples
      print_page: 1
      lessons:
      - last_modified: '2026-03-27'
        title: Sound Doctrine and Discipleship
        subobjectives:
          6.1.1:
            body:
            - p: 1
              text: Undeniably, sound doctrine is foundational to the strength and
                effectiveness of the church, and it is impossible to have sound disciples
                without sound doctrine. The truth of God shapes and molds the people
                of God for life and service.
              kind: prose
              UID: MIN171.6.1.1.P.1
              page: 72
            - p: 2
              text: While many churches are satisfied with their discipleship process,
                alarming research statistics indicate that many churches have discipleship
                deficiencies, that upcoming generations are leaving the faith at an
                alarming rate, and that professing Christians know less and less about
                the content of the Bible. The results are frightening.
              kind: prose
              UID: MIN171.6.1.1.P.2
              page: 72
            - p: 3
              text: Dave Kinnaman (2007), president of the Barna Group, states, “In
                virtually every study we conduct, representing thousands of interviews
                every year, born-again Christians fail to display much attitudinal
                or behavioral evidence of transformed lives” (79).
              kind: prose
              UID: MIN171.6.1.1.P.3
              page: 72
            - p: 4
              text: Seminary president Dr. Albert Mohler (2016) writes on his website,
                “Christians who lack biblical knowledge are the products of churches
                that marginalize biblical knowledge. Bible teaching now often accounts
                for only a diminishing fraction of the local congregation’s time and
                attention.”
              kind: prose
              UID: MIN171.6.1.1.P.4
              page: 72
            - p: 5
              text: Many of our churches have abandoned Sunday school as a means of
                discipleship but are not offering a replacement for systematic study
                of God’s Word. In short, our ability to create Spirit-empowered disciples
                hinges on our ability to disciple.
              kind: prose
              UID: MIN171.6.1.1.P.5
              page: 72
            - p: 6
              text: Just as with the Great Commission, this is an impossible task
                in our own strength and ingenuity. So if we are not being reinvigorated
                and empowered for our tasks by the Holy Spirit, we will not be able
                to create an environment for upcoming generations to experience the
                power and presence of the Lord in a way that also teaches them sound
                doctrine.
              kind: prose
              UID: MIN171.6.1.1.P.6
              page: 72
            - p: 7
              text: But we do not need a few more programs. We need disciples experiencing
                the Spirit’s power.
              kind: prose
              UID: MIN171.6.1.1.P.7
              page: 72
            - p: 8
              text: What do we need to do in order to accomplish this task of discipleship?
                Well, Jesus told His disciples to “wait.”
              kind: prose
              UID: MIN171.6.1.1.P.8
              page: 72
            - p: 9
              text: Are we still waiting?
              kind: prose
              UID: MIN171.6.1.1.P.9
              page: 72
            - p: 10
              text: Wait
              kind: heading
              UID: MIN171.6.1.1.P.10
              page: 72
            - p: 11
              text: Interestingly, one of Jesus’ last words was not “go” but “wait.”
                What were His disciples waiting for?
              kind: prose
              UID: MIN171.6.1.1.P.11
              page: 72
            - p: 12
              text: 'He had no intention for them to begin fulfilling the Great Commission
                without the power to accomplish the task. He said to wait in the city
                (Luke 24:49) and “You will be baptized with the Holy Spirit not many
                days from now” (Acts 1:5, ESV). Jesus knew they could not do it with
                their own ingenuity. They needed immersion. In Acts 1:8 (NKJ), we
                read this promise: “But you shall receive power.” Followers of Jesus
                need Spirit-empowerment.'
              kind: prose
              UID: MIN171.6.1.1.P.12
              page: 72
            - p: 13
              text: It appears that many people today have traded the Pentecostal
                experience for respectability. Because we have seen some goofiness
                (from people who were goofy before they were filled with the Spirit),
                many have rejected the experience of encountering the power of the
                Holy Spirit. Sound teaching in the classroom is a key element, but
                it should never replace the prayer room and the revitalizing empowerment
                that comes from seeking God and His resource to us—His Holy Spirit.
              kind: prose
              UID: MIN171.6.1.1.P.13
              page: 73
            - p: 14
              text: Remember, what Jesus wants us to do is impossible. We are not
                capable of loving our enemies, forgiving those who have wronged us,
                creating Spirit-empowered disciples, or walking a supernatural path
                to take the good news to every corner of the world on our own. We
                have severe capacity issues. We must believe powerful stories are
                still being written, and then we must write them in our churches,
                large and small—and the lives of Spirit-filled disciples are our letters.
              kind: prose
              UID: MIN171.6.1.1.P.14
              page: 73
            - p: 15
              text: In the previous chapter, I shared that I have never really felt
                ready for the tasks God has assigned to me. As we contemplate the
                tasks ahead of us, we must understand that God is not waiting to equip
                us with more power in the moment of each task. No, if we have the
                Holy Spirit, we already have all the power we need!
              kind: prose
              UID: MIN171.6.1.1.P.15
              page: 73
            - p: 16
              text: He Is Not Our Last Resort
              kind: heading
              UID: MIN171.6.1.1.P.16
              page: 73
            - p: 17
              text: This may sound like subtle semantics, but stay with me—I believe
                Spirit-empowerment is more about “pre” than “post.” Let me explain.
              kind: prose
              UID: MIN171.6.1.1.P.17
              page: 73
            - p: 18
              text: Many Old Testament stories reveal the people of God continually
                getting into desperate situations and calling out to Him—then the
                Red Sea splits, the ax head floats, a shepherd boy conquers a giant,
                manna appears, or some other miraculous occurrence rescues them.
              kind: prose
              UID: MIN171.6.1.1.P.18
              page: 73
            - p: 19
              text: 'We have reinforced a similar behavior with our disciples. We
                say, “God, when I run out of gas, exhaust all options, and can go
                no further, come rescue me.” Yes, there are times when we need miracles,
                but think about this: If God wants us to build a church, change a
                life, restore a broken family, or reach an unreached people group,
                would it not be easier if He just did it himself? Or maybe He should
                let us try and try, and when we run out of steam, He could swoop down
                and perform the impossible.'
              kind: prose
              UID: MIN171.6.1.1.P.19
              page: 73
            - p: 20
              text: He did exactly that many times before the day of Pentecost. Jesus
                could have launched His disciples with the guarantee that He would
                show up in unexpected moments and handle their challenging situations.
                Instead, He said they would receive power—the same power of the Spirit
                that Jesus claimed as His own power source—before they got into those
                situations. The Holy Spirit came upon them, His power indwelled them,
                and that is how they grew the church.
              kind: prose
              UID: MIN171.6.1.1.P.20
              page: 73
            - p: 21
              text: In the Old Testament, the anointing came upon individuals sporadically
                when they were depleted or desperate. Under the New Covenant, the
                anointing is available continually and in advance of the need, providing
                the necessary resource for every Spirit-empowered disciple of Christ.
                John tells us, “The Holy One has given you his Spirit” (1 John 2:20,
                NLT).
              kind: prose
              UID: MIN171.6.1.1.P.21
            - p: 22
              text: We already have Him. We do not have to operate in our own strength,
                stumble, fall, and ask for rescue. We can pray and proceed out of
                the Spirit’s enablement to move forward under His guidance, direction,
                and empowerment to carry out God’s tasks for us on the earth.
              kind: prose
              UID: MIN171.6.1.1.P.22
              page: 74
            - p: 23
              text: Spirit-empowerment should be our first thought, hope, and desire—not
                our last resort.
              kind: prose
              UID: MIN171.6.1.1.P.23
              page: 74
            - p: 24
              text: Transformed Disciples
              kind: prose
              UID: MIN171.6.1.1.P.24
            - p: 25
              text: Earlier, we discussed the importance of the transformative work
                of the Holy Spirit. We will revisit this again in the context of the
                Spirit-empowered disciple—specifically, one of a generation hungry
                for experience.
              kind: prose
              UID: MIN171.6.1.1.P.25
              page: 74
            - p: 26
              text: Spirit-empowered disciples do not experience an isolated event
                but a process of complete transformation. Paul describes this in his
                words, “And we all, with unveiled face, beholding the glory of the
                Lord, are being transformed into the same image from one degree of
                glory to another. For this comes from the Lord who is the Spirit”
                (2 Corinthians 3:18, ESV).
              kind: prose
              UID: MIN171.6.1.1.P.26
              page: 74
            - p: 27
              text: 'We each progress through a spiritual journey. On this journey,
                we have a biblical directive to keep growing. To illustrate this pattern
                of growth, we have defined five classes of people who attend our churches
                each week:'
              kind: prose
              UID: MIN171.6.1.1.P.27
              page: 74
            - p: 28
              text: • Unbelievers—People who have not received Christ as Lord and
                Savior of their lives.
              kind: list
              UID: MIN171.6.1.1.P.28
            - p: 29
              text: • Believers—People who have received Christ as Lord (belief system)
                but have not yet become learners who obey God’s Word (behavior).
              kind: list
              UID: MIN171.6.1.1.P.29
            - p: 30
              text: • Disciples—People who adhere to the teachings and practices of
                growing in Christ and demonstrate a lifestyle corresponding to God’s
                Word.
              kind: list
              UID: MIN171.6.1.1.P.30
            - p: 31
              text: • Servant-Leaders—People who have grown in the direction, ways,
                and timing of the Lord and share their knowledge of Christ with others
                so they, too, can learn His direction, ways, and timing. They are
                involved in different aspects of church life (bus drivers, altar workers,
                greeters, deacons, Sunday school teachers, and so forth).
              kind: list
              UID: MIN171.6.1.1.P.31
            - p: 32
              text: • Reproducers—People who mentor others through relationship to
                the point where they become servant-leaders.
              kind: list
              UID: MIN171.6.1.1.P.32
            - p: 33
              text: The goal is for each believer to continually grow and mature,
                going from glory to glory. The classic example of this process is
                the life of Peter—the disciple who had such incredible highs and lows.
                Peter recognized Jesus as the Messiah, but moments later Jesus rebuked
                him for speaking for Satan. Peter is infamous as the disciple who
                stepped out of the boat and then sank when he took his eyes off Jesus
                and as the one who spoke so bravely about never leaving Jesus’ side
                but then ran off and later denied Jesus three times.
              kind: prose
              UID: MIN171.6.1.1.P.33
              page: 75
            - p: 34
              text: 'This same man, who could not find his voice in front of a servant
                girl, found apophthengomai —Spirit-inspired speech that empowered
                him to speak to thousands after Pentecost. He is also the same man
                who hypocritically associated with Judaizers, neglecting the Gentile
                believers after being the one who saw the vision of a sheet let down
                from heaven. This paved the way for the gospel to go to Gentiles.
                He is the same man who wrote 1 Peter and 2 Peter and who, according
                to tradition, is the first head of the church on earth. Peter knew
                the source of true spiritual life: the gospel of grace. In his second
                letter, he described a process of spiritual growth from virtuous choices
                to authentic love and then explained:'
              kind: prose
              UID: MIN171.6.1.1.P.34
              page: 75
            - p: 35
              text: For if these things are yours and abound, you will be neither
                barren nor unfruitful in the knowledge of our Lord Jesus Christ. For
                he who lacks these things is shortsighted, even to blindness, and
                has forgotten that he was cleansed from his old sins. Therefore, brethren,
                be even more diligent to make your call and election sure, for if
                you do these things you will never stumble; for so an entrance will
                be supplied to you abundantly into the everlasting kingdom of our
                Lord and Savior Jesus Christ. (2 Peter 1:8–11, NKJV)
              kind: quote
              UID: MIN171.6.1.1.P.35
              page: 75
            - p: 36
              text: This surely is the testimony of a man whose life as a believer
                was not a one-time event but a transformation process over time. He
                was never the same after Pentecost, nor was he a finished product—this
                fact should give all of us hope.
              kind: prose
              UID: MIN171.6.1.1.P.36
              page: 75
            - p: 37
              text: Like the process of spiritual growth Peter described, we are all
                in a state of becoming—none of us has arrived. We are discipleship
                works in progress.
              kind: prose
              UID: MIN171.6.1.1.P.37
              page: 75
            - p: 38
              text: We Have What They Want
              kind: heading
              UID: MIN171.6.1.1.P.38
              page: 75
            - p: 39
              text: This generation is hungry for experiences; today’s people are
                fascinated with the paranormal, superhuman, and mystical. They are
                hungry for heroes and powers greater than themselves, flocking to
                movies like Spider-Man, Superman, The Lord of the Rings, The Avengers,
                Twilight Saga, and even Star Wars and Star Trek.
              kind: prose
              UID: MIN171.6.1.1.P.39
              page: 75
            - p: 40
              text: A generation craving for experiences beyond the natural is looking
                for power and is preoccupied with the paranormal. From the brooding
                teen vampires of the Twilight Saga to the curious adolescent wizards
                in Harry Potter, stories of characters with extraordinary powers abound.
                Audiences may recognize the mythical nature of the stories, but they
                are entertained and inspired by heroes who rise above the masses and
                the challenges of a shifting, uncertain world.
              kind: prose
              UID: MIN171.6.1.1.P.40
              page: 75
            - p: 41
              text: 'All of the myths point to a fantastic story that is absolutely
                true: A great King has come to rescue His people. A great conflict
                threatens us all, but the King is the ultimate hero who sacrificed
                himself for us. Thankfully, our story is not a made-up myth. It is
                completely, absolutely, and wonderfully true! I believe this generation
                understands an underlying life truth—we know a reality beyond the
                material world and a greater power is at work in this universe.'
              kind: prose
              UID: MIN171.6.1.1.P.41
              page: 76
            - p: 42
              text: They are ripe for a transformative experience.
              kind: prose
              UID: MIN171.6.1.1.P.42
            - p: 43
              text: We should see ourselves as privileged to live in this time. Beyond
                gleaning symbolic truth from mythical characters, as followers of
                Christ we can experience a real presence and power beyond human capacity.
                We can be Spirit empowered.
              kind: prose
              UID: MIN171.6.1.1.P.43
              page: 76
            - p: 44
              text: What this generation desires, we possess—and can experience on
                a daily basis. And even more, through Spirit-empowered discipleship,
                we can impart this same transformative experience to a hungry generation!
              kind: prose
              UID: MIN171.6.1.1.P.44
              page: 76
            - p: 45
              text: Church leaders talk about how to reach Millennials (those born
                after 1980) and many are making church experiences seeker-friendly.
                I believe the key to staying relevant is not just changing up our
                worship services but also creating an environment where they can experience
                the power of the Holy Spirit.
              kind: prose
              UID: MIN171.6.1.1.P.45
              page: 76
            - p: 46
              text: We are all looking for better answers; however, it is not better
                answers we need but better questions. Our questions have focused on
                us—the people inside the church. The better questions are about them—the
                people outside our churches with whom we should be building relationships.
                The right questions will focus on them, and those better questions
                will give us the answers we need.
              kind: prose
              UID: MIN171.6.1.1.P.46
              page: 76
            - p: 47
              text: We must ask ourselves how well we are demonstrating this experience
                and how well we are participating in it. We have what this generation
                is hungry for, but do they even know we have it? Are we so busy being
                seeker-friendly that we are afraid to talk about the Holy Spirit when
                He should be our calling card with a generation that is hungry to
                experience His power?
              kind: prose
              UID: MIN171.6.1.1.P.47
              page: 76
            citations:
            - citekey: kinnaman2007
              pandoc: '[@kinnaman2007]'
