      - last_modified: '2026-03-27'
        title: Real Transformation
        subobjectives:
          5.2.1:
            body:
            - p: 1
              text: Transformation occurs at both a personal level and a corporate
                one. Though our Western mindset tends to focus on the individual,
                without whom there would be no group, a few people being transformed
                with the empowerment of the Holy Spirit are simply not enough to carry
                out the Great Commission by themselves. Corporate, congregational
                transformation and Spirit-empowerment are necessary to ensure that
                our churches, regardless of size, are healthy and experiencing relationship
                with Christ.
              kind: prose
              UID: MIN171.5.2.1.P.1
              page: 61
            - p: 2
              text: Congregational transformation is more than the process of changing
                beliefs and behaviors, more than just changing goals, technologies,
                or systems, and more than examining our present condition and asking
                the right questions. Transformation is the necessary work of the Spirit
                that creates these processes and forms relationship at a corporate
                level—and it is this relationship that engenders lasting change or
                ushers in revival.
              kind: prose
              UID: MIN171.5.2.1.P.2
              page: 61
            - p: 3
              text: Transformation is a biblical concept found throughout the Word.
                It is rooted in the principles of spiritual renewal and formation
                into the image of Christ. It is also the favorite concept the apostle
                Paul used to describe the radical change involved in salvation and
                the work of the Holy Spirit in believers’ lives.
              kind: prose
              UID: MIN171.5.2.1.P.3
              page: 61
            - p: 4
              text: Transformation is the result of the empowering work of the Holy
                Spirit. More knowledge and better behaviors can be the (temporary)
                results of hard work and personal initiative, but transformation happens
                only when the Spirit fosters an intimate relationship between the
                believer and the Lord.
              kind: prose
              UID: MIN171.5.2.1.P.4
              page: 61
            - p: 5
              text: At the center of the Acts 2 Journey is the belief that congregational-level
                transformation is still possible. Everywhere we turn, we find leaders
                who want their churches to grow and thrive. When I see their hearts
                and visions for the future, I know the church’s best years are still
                ahead. Often, it seems, we can believe that miracles, promises, and
                the power of God occurred for people in the Bible, in the historical
                past, or on distant mission fields, but they are not true for us personally
                or for the modern Western church. But if the Bible, history, and reports
                of miracles abroad do anything, they should encourage us to see that
                if it has happened before, God can do it again, for nothing is impossible
                with Him!
              kind: prose
              UID: MIN171.5.2.1.P.5
              page: 62
            - p: 6
              text: Transformation begins in the hearts of the people—in the hearts
                of the congregants. It begins internally within individuals’ hearts
                and minds and spreads as they are discipled, they disciple others
                in turn, and they share with others through Spirit-inspired speech.
                It begins as they connect, grow, serve, go, and worship. It begins
                as an internal process that combines knowledge, behavior, and relationship
                in order to transition a believer forward into a new or revitalized
                life in the Spirit.
              kind: prose
              UID: MIN171.5.2.1.P.6
              page: 62
            - p: 7
              text: Transformation is possible for any congregation, but it does not
                happen overnight. It is a process, not an event. It is a journey,
                not a destination. Just as the metamorphic transformation that Paul
                speaks of renews hearts and minds over time, congregational transformation
                is not an instant result pressed upon people; it is a journey that
                begins from within and is only possible over time.
              kind: prose
              UID: MIN171.5.2.1.P.7
              page: 62
            - p: 8
              text: Revitalization
              kind: heading
              UID: MIN171.5.2.1.P.8
              page: 62
            - p: 9
              text: 'A revitalized church is one that pursues and obeys God passionately,
                and the revitalization process we see before us has its genesis in
                the functions Luke wrote about: fellowship, discipleship, gift-oriented
                ministry, evangelism, and worship. A healthy church is one that .
                . .'
              kind: prose
              UID: MIN171.5.2.1.P.9
              page: 62
            - p: 10
              text: • Engages and maintains loving relationships ( connect )
              kind: list
              UID: MIN171.5.2.1.P.10
            - p: 11
              text: • Develops and mobilizes the people ( grow )
              kind: list
              UID: MIN171.5.2.1.P.11
            - p: 12
              text: • Acts with clear direction and outward focus ( serve )
              kind: list
              UID: MIN171.5.2.1.P.12
            - p: 13
              text: • Reproduces and multiplies His mission in other peoples and places
                ( go )
              kind: list
              UID: MIN171.5.2.1.P.13
            - p: 14
              text: • Pursues and obeys God passionately ( worship )
              kind: list
              UID: MIN171.5.2.1.P.14
            - p: 15
              text: These functions impact how we encounter God and each other as
                individuals, but they are just elements of another program without
                the anointing of the Holy Spirit.
              kind: prose
              UID: MIN171.5.2.1.P.15
            - p: 16
              text: 'Since the turn of the century, Pentecostalism has been a leader
                in world evangelism and discipleship. The growth rate for the Renewal
                Movement from 1910 to 2010 was nearly four times the prior growth
                rate of both Christianity as a whole and the world’s population. From
                2010 to 2025, the growth rate is expected to be twice as fast for
                both. Many churches are vibrant, healthy, and growing, and virtually
                every leader is eager to learn how to have the greatest possible impact
                for the kingdom of God. No matter how large or small a church may
                be, we face a daunting task: winning the unreached and under-churched
                people of the world. We desperately need divine empowerment. We need
                extra ability beyond our own capability. We need churches that are
                united, free of dissension, biblically designed, and Spirit-anointed.'
              kind: prose
              UID: MIN171.5.2.1.P.16
              page: 63
            - p: 17
              text: We need to become like the church in Acts 2.
              kind: prose
              UID: MIN171.5.2.1.P.17
              page: 63
            interactive_questions:
            - p: 1
              text: What are some key aspects of transformation?
              response: Transformation is rooted in the principles of spiritual renewal
                and formation into the image of Christ. It is the result of the empowering
                work of the Holy Spirit. Transformation occurs on both an individual
                and corporate level. It includes processes and practices that lead
                to spiritual renewal in the church. It involves the radical change
                at salvation and the ongoing work of the Holy Spirit in believers’
                lives.
              UID: MIN171.5.2.1.IQ.1
            - p: 2
              text: What is meant by “transformation begins in the hearts of people”?
              response: Change in our church starts with change in us. Unless we are
                willing for God to change us as He desires, He will not be able to
                bring change to our church.
              UID: MIN171.5.2.1.IQ.2
            - p: 3
              text: What are five dimensions of a healthy church?
              response: A healthy church (1) engages and maintains loving relationships
                (connect); (2) develops and mobilizes the people (grow); (3) acts
                with clear direction and outward focus (serve); (4) reproduces and
                multiplies His mission in other peoples and places (go); and (5) pursues
                and obeys God passionately (worship).
              UID: MIN171.5.2.1.IQ.3
            last_modified: '2026-03-27'
