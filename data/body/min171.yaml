      - last_modified: '2026-03-27'
        title: From Infants to Reproductive Believers
        subobjectives:
          13.3.1:
            body:
            - p: 1
              text: We are not born again as mature Christians. We are born again
                as spiritual infants, and through the process of discipleship we grow
                and mature. In many ways, it mirrors physical growth and maturation.
              kind: prose
              UID: MIN171.13.3.1.P.1
              page: 159
            - p: 2
              text: The way children grow up is so common and predictable we often
                take it for granted. Many parents simply think they can stand back
                and watch it happen, and, most of the time, they may be right. Ron
                Bennett shares in his book Intentional Disciplemaking (2001) that
                this was not the case for him and his wife, Mary, when they had their
                first child, Bryan. Shortly after Bryan was born, the doctor informed
                them that Bryan was having difficulty breathing—it was a problem with
                the baby’s brain.
              kind: prose
              UID: MIN171.13.3.1.P.2
              page: 159
            - p: 3
              text: When Bryan was twenty-five years old, Ron wrote, “Although he
                has logged about 300 months—9,125 days—on earth, he has never walked,
                never seen the sun, and never said ‘dad’ or ‘mom’; he has never played
                baseball, run through a sprinkler, or given us a hug. Immediately
                after his birth, Bryan became a prisoner in his own body when severe
                brain damage created multiple handicaps that permanently jammed his
                maturation process. Consequently, he has twenty-five years of living
                but only nine months of normal, healthy development” (Bennett 2001,
                12–13).
              kind: prose
              UID: MIN171.13.3.1.P.3
              page: 159
            - p: 4
              text: Bryan’s disability robbed him of the ability to mature, and parents
                of disabled children everywhere understand the pain that Ron and Mary
                felt for their son. While they loved him deeply, they could not help
                but wonder what life would have been like if Bryan had developed normally.
              kind: prose
              UID: MIN171.13.3.1.P.4
              page: 159
            - p: 5
              text: I believe that God, our heavenly Father, must have similar feelings
                when His children get stuck in spiritual infancy. He wants so much
                more for us than to stay spiritual infants.
              kind: prose
              UID: MIN171.13.3.1.P.5
              page: 159
            - p: 6
              text: When our children are born, it is completely natural for us to
                do everything for them and to expect very little from them. We dress
                them and bathe them and feed them. However, we expect our children
                to grow up and eventually do these things for themselves—that is natural
                and normal.
              kind: prose
              UID: MIN171.13.3.1.P.6
              page: 159
            - p: 7
              text: Similarly, new believers typically experience an infancy period.
                We spoon-feed them spiritually and ask very little of them. But just
                as we do not want to be bathing and dressing our children when they
                are teenagers, we expect new believers to grow and mature. This happens
                best through the process of discipleship.
              kind: prose
              UID: MIN171.13.3.1.P.7
              page: 159
            - p: 8
              text: What can we do if we are producing spiritual infants in our churches
                who never grow and mature spiritually? What do we do if they have
                not learned to feed themselves from the Word or to clothe themselves
                in the righteousness of Christ?
              kind: prose
              UID: MIN171.13.3.1.P.8
              page: 160
            - p: 9
              text: The first step is to evaluate the effectiveness of our discipleship
                processes. We must honestly ask ourselves if our people are growing
                spiritually and if we even have the capability of accurately assessing
                whether we are creating new disciples or simply adding converts. Discipleship
                spans a continuum from cradle to grave, and we are either advancing
                or backsliding through that continuum until death. (Remember, if you
                change the children, you will change the world, and the sooner you
                start investing, the greater the payoff.)
              kind: prose
              UID: MIN171.13.3.1.P.9
              page: 160
            - p: 10
              text: Be willing to ask hard questions in order to get honest answers
                of how good a job your church is doing in its discipleship efforts.
              kind: prose
              UID: MIN171.13.3.1.P.10
              page: 160
            - p: 11
              text: I do not believe there is such a thing as discipleship without
                a systematic study of God’s Word. We have no standard without the
                Bible; there is no target to aim for without the Scriptures, and any
                teaching that does not include the Bible is secondhand information
                at best. Whether it is delivered in a class, small group, or one-on-one,
                it is vital to develop a scope and sequence for teaching the meta-narrative
                of the Bible. The Word is milk for infants and meat for spiritually
                mature adults, and we should provide both for all ages.
              kind: prose
              UID: MIN171.13.3.1.P.11
              page: 160
            - p: 12
              text: Spoon-feeding the Bible to disciples will not make them mature.
                They must take personal ownership for studying the Word and learning
                to “feed” themselves. (My dad used to say, “I don’t mind giving you
                the bottle [of milk], but I get tired of having to part whiskers to
                get it in your mouth.”) We want our people to become wise, and this
                means we must teach them to study the Bible and rely on the Holy Spirit
                to guide them.
              kind: prose
              UID: MIN171.13.3.1.P.12
              page: 160
            - p: 13
              text: Discipleship Starts in the Nursery
              kind: heading
              UID: MIN171.13.3.1.P.13
              page: 160
            - p: 14
              text: Statistics show that adults tend to stop growing spiritually in
                the fifth to seventh year of their Christian experience. Statistics
                also show that we need deliberate programs in place for our children,
                students, and youth. If we do not emphasize discipleship, starting
                with the nursery—yes, babies!—we are missing an irreplaceable opportunity
                to help develop lifelong followers of Christ.
              kind: prose
              UID: MIN171.13.3.1.P.14
              page: 160
            - p: 15
              text: When a child goes from children’s church to the youth ministries,
                we should continue building on the foundations created in the earlier
                years. In many churches, too little consideration is given to connecting
                children and youth ministries effectively, but this is a vital discipleship
                step we must not overlook. I cannot say enough about the importance
                of starting young, so it is time to take a critical look at your nursery,
                children, and youth programs.
              kind: prose
              UID: MIN171.13.3.1.P.15
              page: 160
            - p: 16
              text: Just as you assessed your church earlier, it is time to assess
                discipleship from the nursery through Sunday school for senior saints.
                Ask yourself if your church environments are conducive to learning
                and evaluate the teaching materials you use.
              kind: prose
              UID: MIN171.13.3.1.P.16
              page: 161
            - p: 17
              text: To help you assess your discipleship environments with fresh eyes,
                pretend you are a visitor and consider what that person might see.
                Remember, discipleship begins in the nursery, so ask yourself if the
                signage and system for parents is clear and if there are greeters
                or other volunteers with good attitudes ready to help them find their
                way. These things may seem unimportant, but they allow parents and
                children to have productive, positive experiences, and these issues
                are magnified in the eyes of new visitors.
              kind: prose
              UID: MIN171.13.3.1.P.17
              page: 161
            - p: 18
              text: Ask yourself similar questions of the discipleship opportunities
                you have for adults. How would a new believer feel when getting plugged
                into a class or small group? What can be done to integrate people
                more smoothly? Who is teaching, and are they operating in their gifts?
              kind: prose
              UID: MIN171.13.3.1.P.18
              page: 161
            - p: 19
              text: Appearance can set the tone and often reflects how much attention
                we pay to our discipleship programs. Ask yourself if your facility
                is clean, neat, and painted attractively, creating an environment
                that promotes learning. Do your nurseries and areas for little ones
                have new toys or equipment to stimulate these little disciples? Is
                the church engaging the minds and spirits of older children? Do the
                youth want to come, or would they rather be somewhere else? What can
                you do to create a contemporary, stimulating environment with volunteers
                who can identify with the young people and their unique needs?
              kind: prose
              UID: MIN171.13.3.1.P.19
              page: 161
            - p: 20
              text: While it is helpful to assess the environments for discipleship
                with fresh eyes, it is perhaps even more critical to assess what you
                are teaching. How long has it been since you reviewed the children’s
                curriculum as a leadership team? You might be surprised to find out
                how few people know what the church is teaching! Take what you learn
                in this book and do your best to implement it, not just for adults
                but to build a foundation of discipleship, evangelism, and worship
                in children.
              kind: prose
              UID: MIN171.13.3.1.P.20
              page: 161
            - p: 21
              text: We strongly advocate printing or gathering all the church’s discipleship
                materials—kids through adults—and going over them, using what you
                learn in the Acts 2 process. You can adapt each part of the strategic
                plan for every stage of discipleship.
              kind: prose
              UID: MIN171.13.3.1.P.21
              page: 161
            - p: 22
              text: Discipleship changes with each phase of life, but the need for
                it never wanes. Above all, we want people in our churches who become
                more like Jesus and who minister, serve, disciple, and reproduce the
                abundant life they enjoy.
              kind: prose
              UID: MIN171.13.3.1.P.22
              page: 161
            - p: 23
              text: The Process of Maturity
              kind: heading
              UID: MIN171.13.3.1.P.23
              page: 161
            - p: 24
              text: When we consider what it means to be a Christ-follower, we must
                embrace a holistic approach that focuses on spiritual formation and
                transformation. Just as we must first be Spirit-empowered if we want
                to reproduce Spirit-empowered disciples, so we must first be committed
                to spiritual formation before we promote it to others. Spirit-filled
                leadership that makes disciples only happens when the Holy Spirit
                transforms pastors and leaders themselves into disciples.
              kind: prose
              UID: MIN171.13.3.1.P.24
              page: 161
            - p: 25
              text: Spiritual maturity is not a destination; it is a process. It requires
                time, commitment, and effort to grow spiritually . . . and there are
                no shortcuts.
              kind: prose
              UID: MIN171.13.3.1.P.25
              page: 162
            - p: 26
              text: When you create empowered disciples, the living and life-giving
                relationship they have with the Holy Spirit will not let them stay
                immature; it will urge them forward from glory to glory. They will
                not be dependent on spiritual leaders to spoon-feed them, correct
                them, or clean up after them. They will be mature, Spirit-filled disciples
                who can accomplish these things any time of the day or night—for the
                rest of their lives.
              kind: prose
              UID: MIN171.13.3.1.P.26
              page: 162
            - p: 27
              text: This connecting relationship is the key to spiritual growth. When
                we disciple individuals with a plan of passing on spiritual empowerment,
                we will not create spiritual children who are dependent on us for
                every little thing. Instead, we will help maturing disciples grow
                and develop into future generations of disciple-makers.
              kind: prose
              UID: MIN171.13.3.1.P.27
              page: 162
            - p: 28
              text: 'In our work to help leaders develop the five functions in the
                Acts 2 model of ministry, many have asked a simple but profound question:
                “What does a Spirit-empowered disciple look like?” In other words,
                how can church leaders measure spiritual, emotional, and relational
                growth of individuals, as well as their effectiveness in serving?
                To answer their question, we have developed a set of “Forty Indicators
                of a Spirit-Empowered Disciple.” You will find this list in Appendix
                B of this book. Also, the Resources page at the back tells you how
                to access this tool and many others.'
              kind: prose
              UID: MIN171.13.3.1.P.28
              page: 162
