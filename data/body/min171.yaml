              page: '153'
              paragraph: MIN171.13.2.2.P.44
              UID: MIN171.13.2.2.C.2
            interactive_questions:
            - p: 1
              text: What are the three steps in becoming a Spirit-empowered disciple?
              response: 'The steps are (1) Belong: “Come, follow me” (Matthew 4:19);
                (2) Believe: “You are the Christ” (Matthew 16:16); and (3) Become:
                “Lord, teach us to pray” (Luke 11:1).'
              UID: MIN171.13.2.2.IQ.1
            - p: 2
              text: In what way does relationship open the door to true discipleship?
              response: We want to embrace God’s truth through relationship, both
                with Him and with one another. Moments of decision and commitment
                along with times of receiving from God’s Spirit make His work personal
                in the new believer’s life.
              UID: MIN171.13.2.2.IQ.2
            - p: 3
              text: At what point does much of local church discipleship break down?
              response: Numerous studies indicate that the process of discipleship
                has broken down between stages two and three. We desire disciples
                to experience and express.
              UID: MIN171.13.2.2.IQ.3
            - p: 4
              text: How can children move along the path of genuine discipleship?
              response: Children and young adults can embrace the truths of the faith
                in a personal way. They need to be able to explore truths of faith
                in the safety of accepting relationships. They can grow in their relationship
                with Christ, experience the transforming work of the Spirit, and express
                the truths of the faith to others. Additional answers may vary.
              UID: MIN171.13.2.2.IQ.4
            - p: 5
              text: What are four key dimensions of Spirit-empowered discipleship?
              response: The four dimensions are (1) fresh encounters with Jesus (2)
                experiencing and expressing the transforming truths of Scripture (3)
                ongoing fullness of the Spirit (4) faithful engagement with God’s
                people.
              UID: MIN171.13.2.2.IQ.5
            - p: 6
              text: What effects have you seen or experienced that effectively provide
                an environment for creating powerful relational connections?
              response: Answers are personal and will vary.
              UID: MIN171.13.2.2.IQ.6
            - p: 7
              text: What is the key component that may be missing from discipleship
                programs?
              response: The relationship component is key to deepening relationship
                with Christ and connecting with others in the body of Christ. These
                relational dimensions require the ongoing work of the Spirit
              UID: MIN171.13.2.2.IQ.7
