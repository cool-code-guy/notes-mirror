      - last_modified: '2026-03-27'
        title: Connecting Is God’s Design
        subobjectives:
          12.2.1:
            body:
            - p: 1
              text: 'Have you ever pondered why God designed the church? Take a moment
                to honestly consider it. Two answers are readily apparent to me: for
                His glory and for humankind’s benefit. One of the most powerful ways
                we connect with Him and with one another is in the context of a church
                family.'
              kind: prose
              UID: MIN171.12.2.1.P.1
              page: 139
            - p: 2
              text: The church fulfills many purposes, and it can be constructive
                to examine every ministry, vision, core value, and strategy to ensure
                they are fulfilling these purposes. Think about how church helps us
                feel God, face our problems, fill up, give back, and fulfill our mission
                in life.
              kind: prose
              UID: MIN171.12.2.1.P.2
            - p: 3
              text: One of the most foundational purposes of church is helping us
                experience God. We can easily go all day without even thinking about
                Him—even people who have been Christians many years! God knows we
                have a tendency to lose focus on Him, so He created a Sabbath for
                us to pause, rest, and refocus on Him. The Bible promises blessings
                for keeping the Sabbath. (See Isaiah 58:13–14.)
              kind: prose
              UID: MIN171.12.2.1.P.3
              page: 140
            - p: 4
              text: Experiencing God refocuses us. We have a word for this experience—worship.
              kind: prose
              UID: MIN171.12.2.1.P.4
              page: 140
            - p: 5
              text: A sad truth is that many people have never felt God because they
                have never truly worshipped Him. Worship is honoring God with extravagant
                love and extreme submission, creating an environment where we intimately
                connect with God vertically. This can be amazing when we do so with
                other believers with whom we are connected horizontally.
              kind: prose
              UID: MIN171.12.2.1.P.5
              page: 140
            - p: 6
              text: Worship’s purpose is to glorify and honor God. When we refocus
                like this, it changes our perspective on our problems and lives because
                it helps us focus on how great He is.
              kind: prose
              UID: MIN171.12.2.1.P.6
              page: 140
            - p: 7
              text: While music is only one component of worship (we will consider
                this further in a later chapter), it is perhaps the most significant.
                Music provides a vehicle that helps us focus our attention on God
                and on the act of worship, orienting our hearts toward Him. Music
                stirs our souls in amazing ways; it truly is a gift from the Lord.
                When we use the creative power of music to worship our Creator, we
                can experience Him in a way that ties us in with the rest of creation.
                He is constantly worshipped around His heavenly throne, and it is
                a privilege to join our songs to the melodies of heaven.
              kind: prose
              UID: MIN171.12.2.1.P.7
              page: 140
            - p: 8
              text: Find Help in Times of Trouble
              kind: heading
              UID: MIN171.12.2.1.P.8
              page: 140
            - p: 9
              text: Earlier, we established that church is to be a pillar and a foundation.
                Without it, our lives are exposed when the storms come. Someone has
                rightly said that you are either in a problem right now, have just
                come out of one, or are ready to go into one. This may sound pessimistic,
                but it is actually realistic—the optimism is in how we handle the
                problems, not in whether or not we have them. We can all get discouraged,
                fatigued, and drained, and in these times, more so than in others,
                we must be able to turn to something sturdy and reliable.
              kind: prose
              UID: MIN171.12.2.1.P.9
              page: 140
            - p: 10
              text: 'While we can turn to God in prayer individually, He knows it
                is important for us to have resources with flesh on (other people).
                He wants those people to be from our church family. According to Paul,
                we are to encourage each other and give each other strength (see 1
                Thessalonians 5:11). Larry Crabb (1997) puts this in his unique perspective:'
              kind: prose
              UID: MIN171.12.2.1.P.10
              page: 140
            - p: 11
              text: When two people connect . . . something is poured out of one and
                into the other that has the power to heal the soul of its deepest
                wounds and restore it to health. People experience the life-changing
                force of healing relationships when something powerful comes out of
                one and touches something good in another. (93)
              kind: quote
              UID: MIN171.12.2.1.P.11
            - p: 12
              text: We do not want to face problems alone but often we do not know
                how to ask for help. At these times, even more so than others, we
                need a church family. From the loss of a loved one, to a negative
                report from the doctor, to marriage problems, we need strong support
                during the storms of life.
              kind: prose
              UID: MIN171.12.2.1.P.12
            - p: 13
              text: A church is not supposed to be a social club or a common meeting
                place; it is supposed to be family—a loving, living community. Yes,
                we come together to worship God, but we also come together to connect
                with one another. Where better to find encouraging and godly friends
                than within a church family? Would we rather find our friends at work,
                among the neighbors, or in some other setting? There are certainly
                wonderful people in those settings, but the people we worship and
                fellowship with are uniquely qualified to bear us up during times
                of trouble and to encourage our relationship with God.
              kind: prose
              UID: MIN171.12.2.1.P.13
              page: 141
            - p: 14
              text: We need one another—we cannot make it through life alone. The
                devil likes nothing better than to isolate us, cutting us out from
                the herd when we are weakest and most vulnerable. Like any predator,
                he seeks to inflict his damage when we are isolated.
              kind: prose
              UID: MIN171.12.2.1.P.14
              page: 141
            - p: 15
              text: 'Peter put it like this: “You should be like one big happy family,
                full of sympathy toward each other, loving one another with tender
                hearts and humble minds” (1 Peter 3:8, TLB). Simply being friendly
                is not enough to bind us together; we must make deep, meaningful friendships
                because compassion flows out of friendship.'
              kind: prose
              UID: MIN171.12.2.1.P.15
              page: 141
            citations:
            - citekey: crabb1997
              pandoc: '[@crabb1997]'
              intext: (Crabb 1997)
              paragraph: MIN171.12.2.1.P.10
              UID: MIN171.12.2.1.C.1
            interactive_questions:
            - p: 1
              text: What is worship?
              response: Worship is honoring God with extravagant love and extreme
                submission.
              UID: MIN171.12.2.1.IQ.1
            - p: 2
              text: In what way is trouble our expectation?
              response: Jesus told us we would have trouble in this world. We know
                that times of trouble give us a place to demonstrate our faith and
                they help us grow in relationship with God, so we should anticipate
                such times as necessary to our journey of discipleship.
              UID: MIN171.12.2.1.IQ.2
            - p: 3
              text: Why is isolation one of Satan’s most effective weapons?
              response: When we feel alone, we are more easily driven by our emotions
                and lack both the wisdom and support we can find in others.
              UID: MIN171.12.2.1.IQ.3
            last_modified: '2026-03-27'
            scripture:
