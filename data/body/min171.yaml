      - last_modified: '2026-03-27'
        title: Consumers or Contributors
        subobjectives:
          3.2.1:
            body:
            - p: 1
              text: As people love and serve out of overflowing hearts, they will
                have the joy of seeing God use them to mend broken hearts and lead
                lost people home to God. Suddenly, “sacrifice” becomes a privilege,
                and people give more time and money because their hearts have been
                transformed. When people become contributors, the jobs of leaders
                change. We have the responsibility to place them in roles where they
                can be effective and then equip them so they can thrive. We help them
                find “the sweet spot” of their desires to serve in a particular role,
                their God-given ability, and an open door of opportunity.
              kind: prose
              UID: MIN171.3.2.1.P.1
              page: 43
            - p: 2
              text: 'However, not every person who sits in church will grasp the wonder
                of God’s grace and be transformed to become a contributor. Some people
                will remain consumers, no matter how beautifully and powerfully you
                explain the grace of God to them. In fact, some of them will resist
                your message of God’s love, forgiveness, and power. Be aware: People
                who are only about themselves may head to the next feeding trough
                when you no longer cater to their whims. They are not your responsibility.
                Your job is to equip the saints for the work of the ministry.'
              kind: prose
              UID: MIN171.3.2.1.P.2
              page: 43
            - p: 3
              text: However, those who buy in will find that God provides an amazing
                side benefit when we serve—an unforese en blessing. While this is
                not supposed to be our sole motivation, those who h ave this paradigm
                shift will find that it is incredibly rewarding.
              kind: prose
              UID: MIN171.3.2.1.P.3
              page: 43
            - p: 4
              text: In Chapter 14, on the Acts 2 function we call serve , we will
                develop other aspects of this further, such as helping people find
                their spiritual gifts and discovering where they are best suited.
                First, we needed a biblical foundation because this shift in thinking
                must come before we discuss the rest of the Acts 2 process.
              kind: prose
              UID: MIN171.3.2.1.P.4
              page: 43
            - p: 5
              text: One final element of the priesthood of all believers I would like
                to cover, however, is that while you will not pay these priestly volunteers,
                you must create a culture of accountability. At a job, someone can
                be fired for poor performance. I have found it helpful to have ministry
                agreements with those who serve that describe what is expected of
                them, so that if any correction needs to take place, you have clearly
                defined parameters and can have constructive conversations. When you
                give people your expectations up front, they understand what they
                need to do and can decide if they are committed to meeting them or
                not. Also, I always provide a sunset—a time frame for their service
                and a reevaluation. At this time, we restudy the ministry agreement
                and see if that avenue of service is a good fit.
              kind: prose
              UID: MIN171.3.2.1.P.5
              page: 43
            - p: 6
              text: Many smaller churches we work with have not thought of this, worrying
                perhaps that it might deter volunteers when they are desperate for
                people to serve. I understand this, but I believe the clarity of communication
                that will come later is worth it.
              kind: prose
              UID: MIN171.3.2.1.P.6
              page: 44
            - p: 7
              text: A pastor of a small church came to me after I had advocated asking
                volunteers to sign ministry agreements. He said, “You got me in trouble!”
                I asked him what he meant, and he told me, “Well, when I began teaching
                that volunteers needed to be faithful in attendance and faithful in
                tithing, a lady in the choir came unglued! She said I could not force
                her to do that—she had been there for twenty-five years!”
              kind: prose
              UID: MIN171.3.2.1.P.7
              page: 44
            - p: 8
              text: I asked, “Did you tell her it was a biblical principle?”
              kind: prose
              UID: MIN171.3.2.1.P.8
            - p: 9
              text: He said, “No, I did not get to that.”
              kind: prose
              UID: MIN171.3.2.1.P.9
            - p: 10
              text: “Did you tell her that you are trying to create a new culture
                and explain the priesthood of all believers?”
              kind: prose
              UID: MIN171.3.2.1.P.10
            - p: 11
              text: He shook his head. “No, I did not tell her that.”
              kind: prose
              UID: MIN171.3.2.1.P.11
            - p: 12
              text: I asked, “Well, what did you tell her?”
              kind: prose
              UID: MIN171.3.2.1.P.12
            - p: 13
              text: “I told her that you made me do it,” he replied.
              kind: prose
              UID: MIN171.3.2.1.P.13
            - p: 14
              text: This is an amusing story that gets a laugh when I share it, but
                the reality is you cannot just tell people that the pastor told you
                to do it. You must believe strongly enough that you are training a
                kingdom of priests—and that as such, there are some reasonable expectations—if
                you want to create a new culture of service and ownership in your
                church. This can be done in a nice way; you do not need to be demanding
                or dogmatic. You may need to grandfather in some of your older saints,
                but you can teach the new people what you expect from your “priests.”
                They will thank you for the clarity, and you will be glad for it,
                too, if you ever need to correct or guide them.
              kind: prose
              UID: MIN171.3.2.1.P.14
              page: 44
            - p: 15
              text: Holding people accountable in a church setting is different from
                a business environment. The volunteers at a church need direction
                and encouragement with gentle correction when necessary. Paul wrote
                to the Christians in Thessalonica, “Now we exhort you, brethren, warn
                those who are unruly, comfort the fainthearted, uphold the weak, be
                patient with all” (1 Thessalonians 5:14, NKJV).
              kind: prose
              UID: MIN171.3.2.1.P.15
              page: 44
            - p: 16
              text: Remember, the key is that as a leader, you are not there to do
                all of the ministry. Your primary role is to equip the saints for
                the work of ministry so that they edify the body of Christ. When you
                help your people with this paradigm shift, watch out—your church’s
                ability to minister will explode, just as it did for the church of
                the first century.
              kind: prose
              UID: MIN171.3.2.1.P.16
            - p: 17
              text: Jim and Mindy Howes
              kind: heading
              UID: MIN171.3.2.1.P.17
              page: 45
            - p: 18
              text: When they came to our Acts 2 Journey Discovery Weekend, Pastors
                Jim and Mindy Howes were struggling to lead their church in North
                Rose, New York. They were leading a congregation of about twenty-five
                people, and half of them were teenagers—the result of Jim’s impact
                as a youth pastor.
              kind: prose
              UID: MIN171.3.2.1.P.18
              page: 45
            - p: 19
              text: When they brought their team to the weekend, five of the eight
                people were high school students. In spite of the lack of adult leadership,
                Jim created and launched a strategic plan to reach unchurched people
                in the community. And they came! The results were so dramatic that
                several graduating students decided to attend a local college instead
                of moving away to a bigger university. They did not want to miss out
                on what God was doing at the church.
              kind: prose
              UID: MIN171.3.2.1.P.19
              page: 45
            - p: 20
              text: Today, North Rose is a struggling community, but the church is
                thriving. More than fifty people regularly attend services each week,
                and some weeks, there are more than eighty in the congregation. Nearly
                all the new faces are people who were not going to church before someone
                contacted them. Jim, Mindy, and their fine young leaders are discipling
                a congregation of eager new believers.
              kind: prose
              UID: MIN171.3.2.1.P.20
              page: 45
            interactive_questions:
            - p: 1
              text: How should a pastor respond to those who insist on remaining consumers,
                even for years?
              response: Many pastors choose to cater to these long-term consumers,
                trying to somehow keep them attending or even giving to the church.
                But a pastor shouldn’t take such responsibility for those who refuse
                to engage God’s purpose. Soon consumers will do what consumers do
                and move from place to place to keep themselves in focus.
              UID: MIN171.3.2.1.IQ.1
            - p: 2
              text: What is a culture of accountability?
              response: A culture of accountability includes having well-defined parameters
                for all ministry roles and clearly stated expectations for fulfilling
                those roles.
              UID: MIN171.3.2.1.IQ.2
            - p: 3
              text: What are some advantages of having a written ministry assignment?
              response: A ministry agreement provides people the expectations for
                their roles up front, so they understand what they need to do and
                can decide whether or not to commit to the ministry assignment. The
                ministry agreement also provides a frame of reference for later discourse
                if adjustments are needed.
              UID: MIN171.3.2.1.IQ.3
            - p: 4
              text: What is the best approach to holding people accountable?
              response: The best approach is to provide clear direction and encouragement,
                along with gentle correction when necessary. Hope 4 CHAPTER
              UID: MIN171.3.2.1.IQ.4
