              paragraph: MIN171.6.1.1.P.35
              UID: MIN171.6.1.1.S.6
            text: Explain the evidence of lacking sound doctrine in our discipleship
              efforts today.
            glossary: []
          6.1.2:
            body:
            - p: 1
              text: Undeniably, sound doctrine is foundational to the strength and
                effectiveness of the church, and it is impossible to have sound disciples
                without sound doctrine. The truth of God shapes and molds the people
                of God for life and service.
              kind: prose
              UID: MIN171.6.1.2.P.1
              page: 72
            - p: 2
              text: While many churches are satisfied with their discipleship process,
                alarming research statistics indicate that many churches have discipleship
                deficiencies, that upcoming generations are leaving the faith at an
                alarming rate, and that professing Christians know less and less about
                the content of the Bible. The results are frightening.
              kind: prose
              UID: MIN171.6.1.2.P.2
              page: 72
            - p: 3
              text: Dave Kinnaman (2007), president of the Barna Group, states, “In
                virtually every study we conduct, representing thousands of interviews
                every year, born-again Christians fail to display much attitudinal
                or behavioral evidence of transformed lives” (79).
              kind: prose
              UID: MIN171.6.1.2.P.3
              page: 72
            - p: 4
              text: Seminary president Dr. Albert Mohler (2016) writes on his website,
                “Christians who lack biblical knowledge are the products of churches
                that marginalize biblical knowledge. Bible teaching now often accounts
                for only a diminishing fraction of the local congregation’s time and
                attention.”
              kind: prose
              UID: MIN171.6.1.2.P.4
              page: 72
            - p: 5
              text: Many of our churches have abandoned Sunday school as a means of
                discipleship but are not offering a replacement for systematic study
                of God’s Word. In short, our ability to create Spirit-empowered disciples
                hinges on our ability to disciple.
              kind: prose
              UID: MIN171.6.1.2.P.5
              page: 72
            - p: 6
              text: Just as with the Great Commission, this is an impossible task
                in our own strength and ingenuity. So if we are not being reinvigorated
                and empowered for our tasks by the Holy Spirit, we will not be able
                to create an environment for upcoming generations to experience the
                power and presence of the Lord in a way that also teaches them sound
                doctrine.
              kind: prose
              UID: MIN171.6.1.2.P.6
              page: 72
            - p: 7
              text: But we do not need a few more programs. We need disciples experiencing
                the Spirit’s power.
              kind: prose
              UID: MIN171.6.1.2.P.7
              page: 72
            - p: 8
              text: What do we need to do in order to accomplish this task of discipleship?
                Well, Jesus told His disciples to “wait.”
              kind: prose
              UID: MIN171.6.1.2.P.8
              page: 72
            - p: 9
              text: Are we still waiting?
              kind: prose
              UID: MIN171.6.1.2.P.9
              page: 72
            - p: 10
              text: Wait
              kind: heading
              UID: MIN171.6.1.2.P.10
              page: 72
            - p: 11
              text: Interestingly, one of Jesus’ last words was not “go” but “wait.”
                What were His disciples waiting for?
              kind: prose
              UID: MIN171.6.1.2.P.11
              page: 72
            - p: 12
              text: 'He had no intention for them to begin fulfilling the Great Commission
                without the power to accomplish the task. He said to wait in the city
                (Luke 24:49) and “You will be baptized with the Holy Spirit not many
                days from now” (Acts 1:5, ESV). Jesus knew they could not do it with
                their own ingenuity. They needed immersion. In Acts 1:8 (NKJ), we
                read this promise: “But you shall receive power.” Followers of Jesus
                need Spirit-empowerment.'
              kind: prose
              UID: MIN171.6.1.2.P.12
              page: 72
            - p: 13
              text: It appears that many people today have traded the Pentecostal
                experience for respectability. Because we have seen some goofiness
                (from people who were goofy before they were filled with the Spirit),
                many have rejected the experience of encountering the power of the
                Holy Spirit. Sound teaching in the classroom is a key element, but
                it should never replace the prayer room and the revitalizing empowerment
                that comes from seeking God and His resource to us—His Holy Spirit.
              kind: prose
              UID: MIN171.6.1.2.P.13
              page: 73
            - p: 14
              text: Remember, what Jesus wants us to do is impossible. We are not
                capable of loving our enemies, forgiving those who have wronged us,
                creating Spirit-empowered disciples, or walking a supernatural path
                to take the good news to every corner of the world on our own. We
                have severe capacity issues. We must believe powerful stories are
                still being written, and then we must write them in our churches,
                large and small—and the lives of Spirit-filled disciples are our letters.
              kind: prose
              UID: MIN171.6.1.2.P.14
              page: 73
            - p: 15
              text: In the previous chapter, I shared that I have never really felt
                ready for the tasks God has assigned to me. As we contemplate the
                tasks ahead of us, we must understand that God is not waiting to equip
                us with more power in the moment of each task. No, if we have the
                Holy Spirit, we already have all the power we need!
              kind: prose
              UID: MIN171.6.1.2.P.15
              page: 73
            - p: 16
              text: He Is Not Our Last Resort
              kind: heading
              UID: MIN171.6.1.2.P.16
              page: 73
