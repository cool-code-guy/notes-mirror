    - last_modified: '2026-03-27'
      title: 5 - Empowered
      print_page: 5
      lessons:
      - last_modified: '2026-03-27'
        title: Empowerment
        subobjectives:
          5.1.1:
            body:
            - p: 1
              text: The Holy Spirit helps us to be more than we are; He empowers us.
                The same Spirit that rested on a murderer, turning him into a deliverer;
                on a shepherd boy, turning him into a king; and on a long-haired womanizer,
                turning him into a judge, does not momentarily “rest” upon us. The
                Holy Spirit stayed with fishermen and turned them into disciples.
                He converted a religious murderer, indwelled him, and enabled him
                to write much of the New Testament. And most notably, the Spirit lived
                in and through a carpenter who is the Savior of the world. The Spirit
                empowers every believer who accepts His saving grace and humbly makes
                himself available to be used by God.
              kind: prose
              UID: MIN171.5.1.1.P.1
              page: 58
            - p: 2
              text: The Holy Spirit will also help you say more than you know. Most
                obviously, those who received the Holy Spirit in Acts 2 began speaking
                with other tongues as the Spirit gave them utterance. This word “utterance”
                is the Greek apophthengomai that means “Spirit-inspired speech,” and
                it can empower words in our normal language as surely as speaking
                in tongues.
              kind: prose
              UID: MIN171.5.1.1.P.2
              page: 58
            - p: 3
              text: Emboldened by the Holy Spirit, Peter may be the best example of
                this. Right after the Spirit fell in the upper room, he stood up from
                among the eleven disciples, raised his voice, and addressed the crowd
                in a Spirit-inspired speech. The results were nothing short of miraculous;
                they baptized and added three thousand people to the church that day.
              kind: prose
              UID: MIN171.5.1.1.P.3
              page: 58
            - p: 4
              text: The Holy Spirit helped Peter beyond his natural ability, and the
                listeners went from wondering why the believers were speaking in other
                tongues to asking, “What should we do?” to receive Christ. That same
                inspiration and empowerment are what enable us to share the gospel
                effectively.
              kind: prose
              UID: MIN171.5.1.1.P.4
              page: 58
            - p: 5
              text: More Than Our Own Ability
              kind: heading
              UID: MIN171.5.1.1.P.5
              page: 58
            - p: 6
              text: The Holy Spirit also helps us do more than we can. Before commissioning
                us to share the gospel, Jesus promised us power. He said, “But you
                shall receive power when the Holy Spirit has come upon you; and you
                shall be witnesses to Me in Jerusalem, and in all Judea and Samaria,
                and to the end of the earth” (Acts 1:8, NKJV).
              kind: prose
              UID: MIN171.5.1.1.P.6
              page: 58
            - p: 7
              text: The Spirit’s power is the fulfillment of Jesus’ promise that those
                who believe in Him would do the same works He did—and even greater.
              kind: prose
              UID: MIN171.5.1.1.P.7
              page: 58
            - p: 8
              text: Examples of God’s power encourage us to believe the supernatural.
                After the Holy Spirit fell, the disciples performed many miracles,
                including, but not limited to, healing the sick, casting out demons,
                and discipling untold thousands. And unlike Spirit-touched heroes
                of the Old Testament who momentarily enjoyed His power, the believers
                in the Acts 2 church experienced the lingering, indwelling power of
                the Holy Spirit.
              kind: prose
              UID: MIN171.5.1.1.P.8
              page: 58
            - p: 9
              text: Building on a First-Century Blueprint
              kind: heading
              UID: MIN171.5.1.1.P.9
              page: 59
            - p: 10
              text: The first-century church was founded in prayer. In Acts 1, we
                read that Jesus’ church-development core team consisted of Peter,
                James, John (the big three), the rest of the remaining disciples,
                His mother and brothers, and several women who helped support His
                earthly ministry. They all joined together in prayer.
              kind: prose
              UID: MIN171.5.1.1.P.10
              page: 59
            - p: 11
              text: 'The results of this prayer and founding blueprint were nothing
                short of miraculous. Imagine these things being true in each of our
                churches: these first-century church believers received the Holy Spirit
                willingly, demonstrated power supernaturally, were led effectively,
                prayed fervently, fellowshipped regularly, taught sound doctrine consistently,
                preached the gospel passionately, shared resources liberally, and
                grew exponentially. This last result was a consequence of all those
                factors that preceded it, perhaps, most notably, the empowerment those
                in the upper room first received when the Holy Spirit came upon them
                at Pentecost, the first event recorded in Acts 2.'
              kind: prose
              UID: MIN171.5.1.1.P.11
              page: 59
            - p: 12
              text: 'The entire book of Acts is an account of the birth and growth
                of the first-century church. It recounts how Holy Spirit-empowered
                small groups of believers were devoted to the apostles in their teaching,
                fellowship, sharing of meals (including the Lord’s Supper), prayer,
                and living out the Great Commission that Jesus gave in some of His
                last earthly words. A global movement resulted that took the gospel
                story around the known world and the one that endures today. Jesus’
                command to go into all the world and preach the gospel was the vision
                at the forefront, and Peter voiced their objective:'
              kind: prose
              UID: MIN171.5.1.1.P.12
              page: 59
            - p: 13
              text: Repent and be baptized, every one of you, in the name of Jesus
                Christ for the forgiveness of your sins. And you will receive the
                gift of the Holy Spirit. The promise is for you and your children
                and for all who are far off—for all whom the Lord our God will call.
                (Acts 2:38–39, NIV)
              kind: quote
              UID: MIN171.5.1.1.P.13
              page: 59
            - p: 14
              text: We read that they had a sense of awe as they saw the Spirit move
                on the disciples, enabling them to perform miraculous signs and wonders.
                (And if you do not think that sharing their property, possessions,
                and finances with those in need was a miracle, you try it!) Their
                days consisted of worshipping together, sharing meals with great joy
                and generosity, praising God, and enjoying the goodwill of their community.
              kind: prose
              UID: MIN171.5.1.1.P.14
              page: 59
            - p: 15
              text: And as they lived out this organic, Spirit-empowered life, God
                exploded their numbers.
              kind: prose
              UID: MIN171.5.1.1.P.15
              page: 59
            - p: 16
              text: What Spirit-Empowerment Is and Is Not
              kind: heading
              UID: MIN171.5.1.1.P.16
              page: 60
            - p: 17
              text: Experiencing Spirit-empowered discipleship means understanding
                that our relationship goes beyond mere belief or the washing away
                of sins. (These are the means whereby Christ makes a relationship
                possible, but a life of following Him and knowing Him intimately yet
                awaits.) It is not about doing more for God, performing at a higher
                level, or even experiencing signs and wonders.
              kind: prose
              UID: MIN171.5.1.1.P.17
              page: 60
            - p: 18
              text: It is about knowing God. In Jesus’ great prayer, He explained,
                “And this is eternal life, that they may know You, the only true God,
                and Jesus Christ whom You have sent” (John 17:3, NKJV). Paul perfectly
                understood this goal and privilege. To the believers in Philippi,
                he related that no power, prestige, or wealth could compete with the
                thrill of knowing God. Compared to the wonder and joy of his relationship
                with God, he explained that everything else is only “rubbish.” He
                wrote,
              kind: prose
              UID: MIN171.5.1.1.P.18
              page: 60
            - p: 19
              text: But what things were gain to me, these I have counted loss for
                Christ. Yet indeed I also count all things loss for the excellence
                of the knowledge of Christ Jesus my Lord, for whom I have suffered
                the loss of all things, and count them as rubbish, that I may gain
                Christ and be found in Him, not having my own righteousness, which
                is from the law, but that which is through faith in Christ, the righteousness
                which is from God by faith; that I may know Him and the power of His
                resurrection, and the fellowship of His sufferings, being conformed
                to His death. (Philippians 3:7–10, NKJV)
              kind: quote
              UID: MIN171.5.1.1.P.19
              page: 60
            - p: 20
              text: Every spiritual discipline, every behavioral truth, every spiritual
                activity rings hollow without a growing relationship with Christ—and
                will eventually bring frustration, disappointment, or burnout. We
                cannot expect to operate in our own strength in order to accomplish
                God’s work on the earth. All of our good motivations, our pumped-up
                willpower, and our carefully crafted habits are insufficient. Learning
                and doing, apart from a growing relationship with God, will only tend
                to enlarge our pride—or crush us with disappointment.
              kind: prose
              UID: MIN171.5.1.1.P.20
              page: 60
            - p: 21
              text: When we are Spirit-empowered, every act of service and devotion,
                every discipline, every behavior is a by-product of our relationship
                with Christ and reflects His work within us made possible through
                His Holy Spirit.
              kind: prose
              UID: MIN171.5.1.1.P.21
              page: 60
            - p: 22
              text: In the Old Testament, they made a house for the Lord, and His
                presence filled the Holy of Holies. To enter meant being exposed to
                so much of His holy presence that it was death to anyone but the high
                priest. In short, the God of the Old Testament was not a God to touch.
              kind: prose
              UID: MIN171.5.1.1.P.22
              page: 61
            - p: 23
              text: That has all changed, for the Spirit came upon flesh, filling
                us; God no longer only occupies buildings and does not need to rest
                on select people, temporarily or intermittently. He indwells us in
                a relationship of great intimacy and depth, something far beyond the
                moments of temporary Spirit-empowerment described in the Old Testament.
                God now engages those who follow Him in a relationship that gives
                the necessary context for every subsequent step of belief and behavior,
                knowing and doing.
              kind: prose
              UID: MIN171.5.1.1.P.23
              page: 61
            - p: 24
              text: Because He is in us and we are in Him, we want to know Him more
                and serve Him with our whole hearts—and then experience it. This is
                true transformation!
              kind: prose
              UID: MIN171.5.1.1.P.24
              page: 61
            interactive_questions:
            - p: 1
              text: What differences can be seen in Peter once he has been baptized
                in the Holy Spirit?
              response: When previously he had denied knowing Jesus because he was
                afraid to be identified with Jesus, now he stands before the crowds
                proclaiming Jesus and accusing them of killing the son of God.
              UID: MIN171.5.1.1.IQ.1
            - p: 2
              text: Why is the disciples’ priority on prayer in Acts 1 significant?
              response: When they did not know what to do, they prayed. They continually
                demonstrated their dependence on God for whatever next steps were
                ahead.
              UID: MIN171.5.1.1.IQ.2
            - p: 3
              text: What do you find most fascinating or significant about the early
                church in the book of Acts?
              response: 'Answers will vary but could include at least one of the following:
                these first-century church believers received the Holy Spirit willingly,
                demonstrated power supernaturally, were led effectively, prayed fervently,
                fellowshipped regularly, taught sound doctrine consistently, preached
                the gospel passionately, shared resources liberally, and grew exponentially.'
              UID: MIN171.5.1.1.IQ.3
            - p: 4
              text: What does the focus on being together reveal about the early church?
              response: The church is us, and will always function at its best when
                our connection to one another is strongest. We must be connected,
                one to another, if we will truly grow in Christ.
              UID: MIN171.5.1.1.IQ.4
            - p: 5
              text: What is the center of the Spirit-empowered life?
              response: Knowing God personally and a growing relationship with Christ
                are at the center of the Spirit-empowered life.
              UID: MIN171.5.1.1.IQ.5
            - p: 6
              text: How does the Spirit’s presence in us enlarge the potential of
                every day we live?
              response: The same power that drove the early church is in each of us,
                making every day and every encounter a place where God can work through
                us.
              UID: MIN171.5.1.1.IQ.6
