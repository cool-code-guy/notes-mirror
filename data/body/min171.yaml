          D: is described in the words of the Great Commission.
        answer: D
      - uid: MIN171.8.2.1.F.1
        subobj: 8.2.1
        type: final
        question: The relational dimension of Scripture
        choices:
          A: is not as important as the behavioral dimension of Scripture.
          B: should take priority over the rational meaning of Scripture.
          C: is crucial for developing an intimate relationship with Christ.
          D: is secondary to the mission described in Scripture.
        answer: C
      - uid: MIN171.8.3.1.F.1
        subobj: 8.3.1
        type: final
        question: Revitalization can begin
        choices:
          A: when a significant number of the people align themselves with the mission.
          B: only when a unified church accepts the vision.
          C: with just one person who recognizes the need for Spirit empowerment to
            accomplish God's mission.
          D: as a process of translating the values of the church into the leadership
            vision.
        answer: C
      - uid: MIN171.8.3.1.F.2
        subobj: 8.3.1
        type: final
        question: God's mission for the church
        choices:
          A: is defined through the collective gifts of the congregation.
          B: is supported by the united effort of the body of believers as well as
            individual callings.
          C: is based on the vision of the current body of Christ.
          D: cannot be hindered by individual failings.
        answer: B
      - uid: MIN171.9.1.1.F.1
        subobj: 9.1.1
        type: final
        question: According to the author, vision is the skill of
        choices:
          A: seeing what is not there.
          B: pulling visionary material out of yourself.
          C: connecting the mission to the growth process.
          D: dreaming the future into the present.
        answer: A
      - uid: MIN171.9.2.1.F.1
        subobj: 9.2.1
        type: final
        question: Looking at people
        choices:
          A: will always hinder your vision.
          B: is the first step in giving them a new mission.
          C: leads to discouragement and disillusionment.
          D: can help you to connect with God's vision for them.
        answer: D
      - uid: MIN171.9.3.1.F.1
        subobj: 9.3.1
        type: final
        question: A vision for the church should incorporate
        choices:
          A: the church's universal mission and the five functions of Acts 2.
          B: the steps outlined in the strategic plan.
          C: the ways that the gifts of specific people will be utilized.
          D: alternative plans in case of unforeseen change.
        answer: A
      - uid: MIN171.10.1.1.F.1
        subobj: 10.1.1
        type: final
        question: Core values
        choices:
          A: are unrelated to priorities.
          B: provide boundaries and parameters for how a church behaves.
          C: establish the purpose for the church's existence.
          D: are unrelated to vision.
        answer: B
      - uid: MIN171.10.2.1.F.1
        subobj: 10.2.1
        type: final
        question: A church's strengths are
        choices:
          A: a higher priority than core values.
          B: usually unrelated to core values.
          C: used to help identify core values.
          D: usually related to its mission rather than core values.
        answer: C
      - uid: MIN171.10.3.1.F.1
        subobj: 10.3.1
        type: final
        question: Solid core values can help a church to
        choices:
          A: avoid being led in the wrong direction by people's personal preferences.
          B: focus on people's personal happiness.
          C: translate biblical theology into an acceptable format.
          D: operate more effectively based on personal convictions.
        answer: A
      - uid: MIN171.11.1.2.F.1
        subobj: 11.1.2
        type: final
        question: A strategic plan should
        choices:
          A: revise the mission of the church to make it more effective.
          B: improve the values of the church.
          C: take passion for God and channel it in the right direction.
          D: not be connected to the processes of the church.
        answer: C
      - uid: MIN171.11.2.1.F.1
        subobj: 11.2.1
        type: final
        question: A strategic plan should be built around
        choices:
          A: the biblical functions described as Connect, Grow, Serve, Go, and Worship.
          B: the vision and mission of the leader.
          C: a numerical growth plan in progressive stages.
          D: the biblical priority of spiritual gifts.
        answer: A
      - uid: MIN171.11.2.1.F.2
        subobj: 11.2.1
        type: final
        question: If a congregation is like a car, then our strategic plan is
        choices:
          A: the gasoline that fuels the car.
          B: how we are going to get to our preferred future.
          C: what is going on inside the car.
          D: our vision of the future.
        answer: B
      - uid: MIN171.12.1.1.F.1
        subobj: 12.1.1
        type: final
        question: Connect refers to
        choices:
          A: connecting the mission with the vision.
          B: connecting the strategic plan with the mission.
          C: horizontal relationships with people and a vertical relationship with
            God.
          D: the connection between people and the values of the church.
        answer: C
      - uid: MIN171.12.1.1.F.2
        subobj: 12.1.1
        type: final
        question: Connect focuses on the church as
        choices:
          A: a family.
          B: a value-driven organization.
          C: an apologetics-based institution.
          D: a vehicle for inspiring truth.
        answer: A
      - uid: MIN171.12.2.1.F.1
        subobj: 12.2.1
        type: final
        question: According to the author, giving and receiving help during times
          of difficulty are key aspects of
        choices:
          A: the Acts 2 process known as connect.
          B: strategic planning for end-times enterprises.
          C: end-times visionary thinking.
          D: the Acts 2 process known as worship.
        answer: A
      - uid: MIN171.13.1.1.F.1
        subobj: 13.1.1
        type: final
        question: Systematic discipleship programs have often missed the
        choices:
          A: biblical studies component.
          B: missions component.
          C: dimension of behavioral activity.
          D: dimension of life in the Spirit.
        answer: D
      - uid: MIN171.13.2.1.F.1
        subobj: 13.2.1
        type: final
        question: Belonging before believing
        choices:
          A: is a problem that hinders conversion.
          B: is an example of wrong priorities in the church.
          C: is a practice that facilitates having a safe place for exploring truth.
          D: should be the primary focus for short-term missions strategies.
        answer: C
      - uid: MIN171.13.3.1.F.1
        subobj: 13.3.1
        type: final
        question: A key focus of Spirit-empowered discipleship processes should be
        choices:
          A: how the people in the church can contribute to the vision plan.
          B: developing disciples who are able to feed themselves spiritually from
            God's Word.
          C: developing personal convictions and preferences that will stand the test
            of time.
          D: one-on-one study of God's Word rather than small group Bible study.
        answer: B
      - uid: MIN171.14.1.1.F.1
        subobj: 14.1.1
        type: final
        question: Open communication and having common goals are basic dimensions
          of
        choices:
          A: moving from Serve to Connect.
          B: a dynamic team.
          C: a laity-based church.
          D: process discipleship.
        answer: B
      - uid: MIN171.14.2.1.F.1
        subobj: 14.2.1
        type: final
        question: Discovering your purpose is directly facilitated by
        choices:
          A: following the vision of the church.
          B: following the example of godly leaders.
          C: accepting your values.
          D: discovering your gifts and using them in service.
        answer: D
      - uid: MIN171.14.3.1.F.1
        subobj: 14.3.1
        type: final
        question: Assessment tools to help people discover their gifts
        choices:
          A: should be utilized to discover the values of the church.
          B: should be utilized in defining the mission of the church.
          C: are useful in the process known as Serve.
          D: form the pathway from values to secondary goals.
        answer: C
      - uid: MIN171.15.1.1.F.1
        subobj: 15.1.1
        type: final
        question: Go is an Acts 2 process which
        choices:
          A: takes priority over all other processes.
          B: focuses primarily on discipleship ministry.
          C: helps believers to serve one another.
          D: changes a church's inward focus to an outward focus.
        answer: D
      - uid: MIN171.15.2.1.F.1
        subobj: 15.2.1
        type: final
        question: In the textbook, second-hand evangelism means
        choices:
          A: evangelizing without an ongoing relationship connection.
          B: evangelizing through good works.
          C: evangelizing without a clear purpose.
          D: witnessing to people at work.
        answer: A
      - uid: MIN171.15.3.1.F.1
        subobj: 15.3.1
        type: final
        question: The primary goal of utilizing the strengths of the church is to
        choices:
          A: build the financial base of support for future ministry.
          B: build friendships and connections in order to meet needs.
          C: use the strengths to fix weak areas in the church.
          D: bring the church into complete unity.
        answer: B
      - uid: MIN171.16.1.1.F.1
        subobj: 16.1.1
        type: final
        question: Worship should be
        choices:
          A: emphasized prior to the Serve function.
          B: taking place prior to the Connect function.
          C: kept in balance with the other functions of the Acts 2 process.
          D: promoted as the primary emphasis of Connect.
        answer: C
      - uid: MIN171.16.2.1.F.1
        subobj: 16.2.1
        type: final
        question: Worship and prayer are
        choices:
          A: unrelated to Connect.
          B: unrelated to Go.
          C: primarily corporate in nature.
          D: relational in nature.
        answer: D
      - uid: MIN171.17.1.1.F.1
        subobj: 17.1.1
        type: final
        question: The five functions of the Acts 2 process are
        choices:
          A: the complete vision that God gives to every church.
          B: the mission that God gives to every church.
          C: a roadmap for accomplishing the church's mission on earth.
          D: the destination point for a personal vision.
        answer: C
      - uid: MIN171.17.2.1.F.1
        subobj: 17.2.1
        type: final
        question: What is it that should drive priorities, shape attitudes and actions,
          direct processes, and govern relationships?
        choices:
          A: Ministry preferences
          B: The strategic plan
          C: Core values
          D: Ministry agreements
        answer: C
      - uid: MIN171.17.2.1.F.2
        subobj: 17.2.1
        type: final
        question: Which of the following is not an accurate statement?
        choices:
          A: A team vision develops through many hours of prayer, study, and preparation.
          B: The vision is universal, while the mission is specific to a local church.
          C: Team members can have a great impact by supporting the vision.
          D: The vision of the church is greatly impacted by how it is communicated.
        answer: B
