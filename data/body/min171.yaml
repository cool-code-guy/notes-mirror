            - p: 140
              text: Creating a Dream Statement
              kind: heading
              UID: MIN171.17.2.1.P.140
              page: 222
            - p: 141
              text: God has a plan for each and every church, and we want to help
                church leaders find that plan and fulfill it. No church has a future
                unless its dreams are bigger than its memories, and we desire to help
                churches dream the dream that God has for each of them (Garrison 2015,
                39).
              kind: prose
              UID: MIN171.17.2.1.P.141
              page: 222
            - p: 142
              text: Leadership teams who engage in the Acts 2 process—working, praying,
                and dreaming through it together—will change churches. When you develop
                your understanding of God’s plan and purpose as a team, the chances
                of success skyrocket. When church leaders work together with empowered
                teams, our experience shows that about 80 percent report significant
                progress (Garrison 2015, 41).
              kind: prose
              UID: MIN171.17.2.1.P.142
              page: 222
            - p: 143
              text: God’s dream for your church always involves people (Garrison 2015,
                109).
              kind: prose
              UID: MIN171.17.2.1.P.143
            - p: 144
              text: Creating a dream statement is a helpful first step in identifying
                or clarifying God’s vision for your congregation. The steps below
                will help you create a dream statement together with your team that
                will help capture what you believe God is dreaming for your congregation.
              kind: prose
              UID: MIN171.17.2.1.P.144
              page: 222
            - p: 145
              text: Discovering the Dreamscape for the Vision
              kind: heading
              UID: MIN171.17.2.1.P.145
              page: 222
            - p: 146
              text: 'The vision is the dream of the church that is given by God. “Dreaming
                big” can provide the beginning point for finding God’s vision. Discuss
                the following for each of the five functions of the church, and use
                this discussion with your team to help you craft a dream statement
                as indicated below:'
              kind: prose
              UID: MIN171.17.2.1.P.146
              page: 222
            - p: 147
              text: '1. Connect : I dream of a church where fellowship (hospitality)
                is ….'
              kind: prose
              UID: MIN171.17.2.1.P.147
            - p: 148
              text: '2. Grow : I dream of a church where discipleship is ….'
              kind: prose
              UID: MIN171.17.2.1.P.148
            - p: 149
              text: '3. Serve : I dream of a church where gift-oriented ministry is
                ….'
              kind: prose
              UID: MIN171.17.2.1.P.149
            - p: 150
              text: '4. Go : I dream of a church where evangelism is ….'
              kind: prose
              UID: MIN171.17.2.1.P.150
            - p: 151
              text: '5. Worship : I dream of a church where worship is ….'
              kind: prose
              UID: MIN171.17.2.1.P.151
            - p: 152
              text: 'Brainstorm words that you associate with each function. Some
                examples are provided below:'
              kind: prose
              UID: MIN171.17.2.1.P.152
              page: 222
            - p: 153
              text: 'Connect : welcome, connections, community, compassion, hospitable,
                kind, warm, greeters, friendship'
              kind: prose
              UID: MIN171.17.2.1.P.153
            - p: 154
              text: 'Grow : teaching, growth track, intentional, challenging, accountability,
                resource, training'
              kind: prose
              UID: MIN171.17.2.1.P.154
            - p: 155
              text: 'Serve : servant-hearted, empowered, trained, equipping others
                to serve, gifts and talents, teams'
              kind: prose
              UID: MIN171.17.2.1.P.155
            - p: 156
              text: 'Go : marketplace evangelism, compassion, generous, relationships,
                life-changing'
              kind: prose
              UID: MIN171.17.2.1.P.156
            - p: 157
              text: 'Worship : alive, vibrant, life-changing, permeating, transformation,
                all-encompassing'
              kind: prose
              UID: MIN171.17.2.1.P.157
            - p: 158
              text: Use the words you came up with to begin crafting a one- or two-sentence
                dream statement for each of the five functions in the chart on the
                following page. As a senior pastor leading a team, you would continue
                working to finalize these dream statements together with your team.
              kind: prose
              UID: MIN171.17.2.1.P.158
