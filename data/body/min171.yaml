              paragraph: MIN171.11.1.1.P.7
              UID: MIN171.11.1.1.S.3
            - intext: Acts 2
              version: NIV
              refs:
              - ref: Acts 2
                key: acts.2
                bib_gate: https://www.biblegateway.com/passage/?search=Acts%202&version=NIV
              paragraph: MIN171.11.1.1.P.13
              UID: MIN171.11.1.1.S.4
            text: Describe the local church's need for a strategic plan and why some
              may resist such an effort.
            glossary: []
          11.1.2:
            body:
            - p: 1
              text: We established that our mission is universal, we began to build
                a vision around people, and we identified the core values and behaviors
                that reflect those values. Now, it is time to put it all together
                into a strategic plan that will help you get from where you are (your
                values) to where you want to go (your vision).
              kind: prose
              UID: MIN171.11.1.2.P.1
              page: 126
            - p: 2
              text: Now we return to the five biblical functions of the first-century
                church. Described in detail in Acts 2:42–47, these functions form
                the pathway from values to vision. The five functions are actually
                a template you can use to develop a plan for your church, so consider
                this chapter a primer, introducing you to these functions as a way
                to help you discover God’s plan.
              kind: prose
              UID: MIN171.11.1.2.P.2
              page: 126
            - p: 3
              text: However, before we get into the functions, we must recognize that
                without Holy Spirit empowerment in our churches, the mission, vision,
                values, and plans merely amount to programs. Before we talk further
                about a strategy for building a plan from the five functions, it is
                vital to understand that any strategic plan finds its genesis in the
                inspiration of the Holy Spirit. We must focus first on becoming inspired
                (think about the indwelled disciples and Peter’s preaching on Pentecost)
                and reinvigorated—only then will we have the necessary power and perspective
                to implement any sort of strategy.
              kind: prose
              UID: MIN171.11.1.2.P.3
              page: 126
            - p: 4
              text: The odd thing is that in some churches, we see resistance to calls
                for revitalization while others resist the idea of planning. Some
                do not see the need for the work of the Holy Spirit or feel their
                churches have enough of the Spirit already, and others act like the
                Holy Spirit has no place in a planning meeting. The truth is that
                we need Him in every component of our lives and churches.
              kind: prose
              UID: MIN171.11.1.2.P.4
              page: 126
            - p: 5
              text: Every church can use more of the Spirit. Needing revitalization
                does not necessarily imply your church is dead and lifeless. Whatever
                the condition of our church, we can all cry with Isaiah,
              kind: prose
              UID: MIN171.11.1.2.P.5
              page: 126
            - p: 6
              text: Oh, that You would rend the heavens! That You would come down!
                That the mountains might shake at Your presence . . . to make Your
                name known to Your adversaries, that the nations may tremble at Your
                presence! When You did awesome things for which we did not look, You
                came down, the mountains shook at Your presence. (Isaiah 64:1–3, NKJV)
              kind: quote
              UID: MIN171.11.1.2.P.6
            - p: 7
              text: 'In speaking to John the Baptist’s followers, Jesus explained
                how He was revitalizing the Jews: The blind saw, the lame walked,
                the lepers were cleansed, and the deaf heard. The dead rose up, and
                people received the gospel. Then He said something curious: “And blessed
                is he who is not offended because of Me” (Matthew 11:6, NKJV). That
                is the message we would give to each and every church: Blessed is
                the church that is not offended because of Him.'
              kind: prose
              UID: MIN171.11.1.2.P.7
            - p: 8
              text: We do ourselves a great disservice if we think that because we
                are in a Spirit-filled church we have nothing to gain by praying for,
                seeking, and expecting revitalization. We can miss out if we assume
                we are already as full of the Holy Spirit in our personal lives and
                services as we can be. Do not be offended by this talk of revitalization
                if you are in a church that is already experiencing the Holy Spirit.
                Instead, see this as an opportunity to bring it to a higher spiritual
                level by being hungry for more of Him!
              kind: prose
              UID: MIN171.11.1.2.P.8
              page: 126
            - p: 9
              text: In addition, do not think that the Holy Spirit has no place in
                a strategic plan because the Spirit who can inspire us spontaneously
                is the same Spirit who helps us learn God’s plans for our churches.
              kind: prose
              UID: MIN171.11.1.2.P.9
              page: 127
            - p: 10
              text: Spirit and Strategy in Harmony
              kind: heading
              UID: MIN171.11.1.2.P.10
              page: 127
            - p: 11
              text: One of the churches that participated in the Acts 2 Journey had
                an amazing and unique story—a case study in what can happen when the
                Spirit and the strategic work together.
              kind: prose
              UID: MIN171.11.1.2.P.11
              page: 127
            - p: 12
              text: When we began working with them, there were exactly twenty-eight
                people in the congregation. Interestingly, fifteen of them were high
                school students. The pastor had been a youth pastor, and this was
                his first lead role. The church was in a virtual ghost town, and the
                church building may have been the only functioning public building
                that remained in this particular community. The pastor had brought
                a team of people with him, and five of them were high school students.
                What further stood out about these students was that they were very
                intense in their prayers.
              kind: prose
              UID: MIN171.11.1.2.P.12
              page: 127
            - p: 13
              text: One of our Acts 2 team members visited their church on a Sunday
                morning for the prayer service that preceded the 10:15 a.m. service.
                He arrived a little late because he missed a turn, but he walked into
                one of the most intense prayer meetings he had ever been in—and teenagers
                led it! The young man leading was a high school senior, and the atmosphere
                was like a youth camp, even though there were some older folks present
                as well. Students sat in the front rows of the church, and the older
                saints sat behind them supportively.
              kind: prose
              UID: MIN171.11.1.2.P.13
              page: 127
            - p: 14
              text: The dream team that came to the Acts 2 Journey consisted of the
                pastor, his wife, the dad of one of the students, and five high school
                students. Their dream team proceeded to build a plan together, and
                they were just as intense about building that plan as they were about
                praying before their services. They launched their plan right before
                several of the young people graduated from high school.
              kind: prose
              UID: MIN171.11.1.2.P.14
              page: 127
            - p: 15
              text: The students who graduated were leaving for college just as the
                fruit of their plan began to grow. Soon the church began to grow in
                health and numbers. All of the new people were unchurched families
                from the area, and the pastor found himself in need of basic discipleship
                tools because he had many people who had never opened a Bible before.
              kind: prose
              UID: MIN171.11.1.2.P.15
              page: 127
            - p: 16
              text: These were exactly the kind of people the students had dreamed
                of reaching!
              kind: prose
              UID: MIN171.11.1.2.P.16
            - p: 17
              text: Completely against prevailing trends where young people leave
                their rural communities and never return, several of these students
                decided to change their college plans and go to school closer to home.
                They wanted to be a part of what God was doing in that church as a
                result of the plans they had helped to form.
              kind: prose
              UID: MIN171.11.1.2.P.17
              page: 127
            - p: 18
              text: This is a wonderful example of what can happen when the Spirit
                and the strategic come together in harmony. Having a plan does not
                replace passion for God; it shapes that passion into a focused plan
                and then executes it.
              kind: prose
              UID: MIN171.11.1.2.P.18
              page: 128
            - p: 19
              text: We sometimes act like anything from the Holy Spirit has to be
                last minute and that making plans is antithetical to being led by
                the Spirit. We confuse being Spirit-led with being spontaneous.
              kind: prose
              UID: MIN171.11.1.2.P.19
              page: 128
            - p: 20
              text: Some leaders fail to realize that the same Holy Spirit who directs
                us in the moment can also inspire us during the planning stages. Worship
                services are terrific examples of this. Most worship leaders will
                plan the songs they are going to sing even though they want their
                worship to be Spirit-led. The compromise is having a plan but remaining
                flexible; if the Spirit spontaneously puts a song on the worship leader’s
                or pastor’s heart, we must be able to flow with the change.
              kind: prose
              UID: MIN171.11.1.2.P.20
              page: 128
            - p: 21
              text: A vision without a plan to carry it out is nothing more than a
                dream. However, when we create our plans under the inspiration of
                the Holy Spirit, we position ourselves to catch God’s plan for us
                and our churches.
              kind: prose
              UID: MIN171.11.1.2.P.21
              page: 128
            interactive_questions:
            - p: 1
              text: How do the five functions from Acts 2 help lead you to vision?
              response: These functions form the pathway from values to vision. The
                five functions are a template you can use to develop a plan for your
                church.
              UID: MIN171.11.1.2.IQ.1
            - p: 2
              text: Why should God’s people always be hungry for more of the Spirit’s
                presence and power?
              response: We should never be satisfied or think that we have no further
                need for the Spirit to work in us. Our hunger should always be for
                everything God desires to do in us and through us.
              UID: MIN171.11.1.2.IQ.2
            - p: 3
              text: What must we do to assure that pursuing the Holy Spirit and developing
                a plan work together?
              response: We must recognize that they need to be pursued simultaneously.
                We want the Holy Spirit’s plan for our church. That is the only plan
                that can lead us to our greatest impact.
              UID: MIN171.11.1.2.IQ.3
            last_modified: '2026-03-27'
