    course_objectives:
    - 1. Describe the need for a process to guide the church in vision and ministry.
    - 2. Identify the five functions of the Acts 2 process and explain their roles
      in the Spirit-empowered church.
    - 3. Explain the need for both strategic planning and the empowerment of the Spirit
      for church revitalization.
    - 4. Explain the value of the priesthood of all believers and how utilizing every
      believer’s gifts can impact ministry in the local church.
    - 5. Describe the necessity of an honest assessment of a local church’s strengths
      and weaknesses in order to grow that church in the five functions of the Acts
      2 process.
    - 6. Analyze the biblically based mission of the church and its role in vision
      and strategic planning.
    - 7. Analyze the significance of both the Great Commandment and the Great Commission
      in fulfilling the mission of the church.
    - 8. Describe the process for developing a God-inspired vision for the local church
      as it intersects with people’s needs in your community.
    - 9. Identify the core values of your church, and write them down.
    - 10. Develop a strategic plan for your church, utilizing the five functions in
      Acts 2 that are based on (1) the core values of the church and (2) a God-inspired
      vision for ministry.
