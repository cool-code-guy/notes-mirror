      - last_modified: '2026-03-27'
        title: An Age-Stage Process
        subobjectives:
          13.2.1:
            body:
            - p: 1
              text: 'Our first encounter with Jesus, His Word, and His people is not
                our last. It is a process. A Spirit-empowered process will produce
                Spirit-empowered outcomes. Our Task Force has identified forty Spirit-empowered
                outcomes and organized them around four main categories:'
              kind: prose
              UID: MIN171.13.2.1.P.1
              page: 153
            - p: 2
              text: • Loving the Lord
              kind: list
              UID: MIN171.13.2.1.P.2
            - p: 3
              text: • Loving the Word
              kind: list
              UID: MIN171.13.2.1.P.3
            - p: 4
              text: • Loving people
              kind: list
              UID: MIN171.13.2.1.P.4
            - p: 5
              text: • Loving God’s mission
              kind: list
              UID: MIN171.13.2.1.P.5
            - p: 6
              text: The goal is not to live these outcomes only on Sunday but each
                day of the week. This cannot be done without the power of the Holy
                Spirit. You cannot listen to and hear God without being tuned into
                the Spirit of God. You can memorize Bible verses, but you need the
                power of the Holy Spirit to combat life’s pressures and to be a Great
                Commission and Great Commandment Christian.
              kind: prose
              UID: MIN171.13.2.1.P.6
              page: 153
            - p: 7
              text: 'The path to becoming a Spirit-empowered disciple is known. First-century
                faith followed a pattern of belong-believe-become:'
              kind: prose
              UID: MIN171.13.2.1.P.7
              page: 153
            - p: 8
              text: • “Come, follow me” (Matthew 4:19, NIV) – belong
              kind: list
              UID: MIN171.13.2.1.P.8
            - p: 9
              text: • “You are the Christ” (Matthew 16:16, NKJV) – believe
              kind: list
              UID: MIN171.13.2.1.P.9
            - p: 10
              text: • “Lord, teach us to pray” (Luke 11:1, NIV) – become
              kind: list
              UID: MIN171.13.2.1.P.10
            - p: 11
              text: This is the process of faith formation. More than Sunday-only
                Christianity, it is an everyday walk with Christ.
              kind: prose
              UID: MIN171.13.2.1.P.11
              page: 154
            - p: 12
              text: We want disciples to explore truths of the faith in the safety
                of accepting relationship. This allows belonging before believing.
                We need to return to God’s people experiencing God’s Word. These Acts
                2 “this is that” moments allow seekers of all ages to explore God’s
                truth in a safe place.
              kind: prose
              UID: MIN171.13.2.1.P.12
              page: 154
            - p: 13
              text: • Accepting people before they change (like Zacchaeus and others)
                is critical to a safe place for exploring truth.
              kind: list
              UID: MIN171.13.2.1.P.13
            - p: 14
              text: • Humble, vulnerable servant-leaders create safe places to explore
                God’s truths as they share Colossians 3:16 moments of how the Word
                has dwelled deeply within them.
              kind: list
              UID: MIN171.13.2.1.P.14
            - p: 15
              text: • Intergenerational times of Spirit-gifted ministry allow exploration
                of Spirit-empowered living.
              kind: list
              UID: MIN171.13.2.1.P.15
            - p: 16
              text: We want people to embrace truths of the faith in a personal way.
                The imperative is moments of personal decision, encounters, and application.
                Moments of decision and commitment along with times of receiving from
                God’s Spirit make His work personal in the new believer’s life. Expressions
                of His Spirit in giftedness and worship allow followers to make their
                intimacy personal with Jesus and their life in His Spirit. An effective
                Stage Model of discipleship will inform our approaches to community
                engagement, evangelism, and new believer and new member strategies.
              kind: prose
              UID: MIN171.13.2.1.P.16
            - p: 17
              text: Numerous studies indicate that the process of discipleship has
                broken down between stages two and three (that is, what we have explored
                and personally embraced has not become an experienced lifestyle and
                thus is not part of the believer’s identity). We desire disciples
                to experience and to express.
              kind: prose
              UID: MIN171.13.2.1.P.17
              page: 155
            - p: 18
              text: 'We want them to experience truths of the faith in everyday life—not
                just on Sunday, but every day of the week. This is where discipleship
                too often breaks down. It is not just about memorizing Scripture but
                asking what Bible verses have I experienced today, for instance:'
              kind: prose
              UID: MIN171.13.2.1.P.18
              page: 155
            - p: 19
              text: • Ministering to the Lord with a glad heart (based on Psalm 100:2)
              kind: list
              UID: MIN171.13.2.1.P.19
            - p: 20
              text: • Being still to pray, “Speak Lord, for your servant is listening”
                (1 Samuel 3:8–9, NIV)
              kind: list
              UID: MIN171.13.2.1.P.20
            - p: 21
              text: • Apologizing (confessing) when you have been wrong (based on
                James 5:16)
              kind: list
              UID: MIN171.13.2.1.P.21
            - p: 22
              text: 'Similarly, we want them to express truths to others as Spirit-empowered
                disciples. An individual like this does these things:'
              kind: prose
              UID: MIN171.13.2.1.P.22
            - p: 23
              text: • Listens to and hears God
              kind: list
              UID: MIN171.13.2.1.P.23
            - p: 24
              text: • Lives life through experiencing Scripture
              kind: list
              UID: MIN171.13.2.1.P.24
            - p: 25
              text: • Shares His love with those who are near, beginning at home
              kind: list
              UID: MIN171.13.2.1.P.25
            - p: 26
              text: • Yields to the Spirit for intimacy and discernment, direction,
                and empowerment
              kind: list
              UID: MIN171.13.2.1.P.26
            - p: 27
              text: This is not new. Early church followers used “stage” terms such
                as seeker, hearer, kneeler, and faithful. This is based on The Apostolic
                Tradition, written around AD 215 by Hippolytus, Bishop of Rome (cited
                in Webber 2001, 11–15).
              kind: prose
              UID: MIN171.13.2.1.P.27
            - p: 28
              text: This is effective not only within every stage of our formation
                but with the developmental process of age maturation. It also works
                at home.
              kind: prose
              UID: MIN171.13.2.1.P.28
              page: 155
            - p: 29
              text: Age Model
              kind: heading
              UID: MIN171.13.2.1.P.29
              page: 156
            - p: 30
              text: Every believer, no matter at what age they enter the kingdom of
                God, begins a process of growing through stages. Similarly, children
                grow through identifiable stages of human development. We connect
                these two processes as we produce a discipleship plan for kids to
                mature in their faith.
              kind: prose
              UID: MIN171.13.2.1.P.30
              page: 156
            - p: 31
              text: We want our preschool children to explore truths of the faith
                in the safety of accepting relationships. This may look like a preschooler
                leaving Sunday school and a mom asking, “Did you make something in
                class today?” (This is a common question.) Imagine how thrilled her
                mom would be when little Amy replies, “I heard God tell me how to
                love my brother better!” (This is a relational response.)
              kind: prose
              UID: MIN171.13.2.1.P.31
              page: 156
            - p: 32
              text: Our elementary-school children can embrace the truths of the faith
                in a personal way. What if their class had an encounter with Jesus?
                The children may meditate on the image of Jesus praying. The Spirit
                could take a Bible verse deeply into a heart, the young child realizing
                that “He is now interceding for me” (based on Romans 8:34).
              kind: prose
              UID: MIN171.13.2.1.P.32
              page: 156
            - p: 33
              text: 'Similarly, our middle-school children can experience truths of
                the faith in everyday life. At this age, the students are asking the
                Holy Spirit to help them experience Scripture—actually “doing the
                Book.” They are practicing Scriptures, such as 2 Timothy 2:22 (ESV):
                “So flee youthful passions and pursue righteousness, faith, love,
                and peace, along with those who call on the Lord from a pure heart.”
                The Holy Spirit can help these young people ask questions, like “Who
                should I have as friends?” or “Are my friends helping me be more loving,
                peaceful, and faithful to my convictions?”'
              kind: prose
              UID: MIN171.13.2.1.P.33
            - p: 34
              text: As our children mature into young adults, they can express truths
                of the faith to others through their identity as Christ-followers.
              kind: prose
              UID: MIN171.13.2.1.P.34
              page: 157
            - p: 35
              text: The Lifestyle of Discipleship
              kind: heading
              UID: MIN171.13.2.1.P.35
              page: 157
            - p: 36
              text: Let me repeat, Spirit-empowered discipleship requires a lifestyle
                of fresh encounters with Jesus. We must never get too busy working
                for Him that we lose our relationship with Him. Paul said, “I count
                all things to be loss in view of the surpassing value of knowing Christ
                Jesus my Lord” (Philippians 3:8, NASB).
              kind: prose
              UID: MIN171.13.2.1.P.36
              page: 157
            - p: 37
              text: 'Jesus longs for our praise—praise from those He has blessed,
                healed, comforted, and encouraged. Picture Him uttering these words:
                “Where are the other nine?” (Luke 17:17, NIV).'
              kind: prose
              UID: MIN171.13.2.1.P.37
              page: 157
            - p: 38
              text: Another way to have a productive encounter with Jesus is to be
                attentive to His voice—listen to Him. Luke wrote, “Mary . . . sat
                at the Lord’s feet and listened to his teaching” (Luke 10:39, ESV).
                If we get quiet, we will hear Him speak. His instructions never mislead
                us.
              kind: prose
              UID: MIN171.13.2.1.P.38
              page: 157
            - p: 39
              text: Secondly, to be a Spirit-empowered disciple, we need frequent
                experiences of Scriptures. We cannot give out what we have not received.
                If we love God, we will love His Word. It is good to know doctrine
                and even to memorize the Bible, but it is more consequential to practice
                the Scriptures daily. That should be our goal.
              kind: prose
              UID: MIN171.13.2.1.P.39
              page: 157
            - p: 40
              text: Peter teaches us, “Since you have in obedience to the truth purified
                your souls for a sincere love of the brethren, fervently love one
                another from the heart” (1 Peter 1:22, NASB). Are we practicing that
                daily? We can practice it by rejoicing with a friend when they have
                received a great blessing or by comforting a person in their sorrow
                or by weeping “with those who weep” (Romans 12:15, NKJV). This is
                “doing the Book”!
              kind: prose
              UID: MIN171.13.2.1.P.40
              page: 157
            - p: 41
              text: 'Anyone who applies the Bible this way is achieving a Spirit-empowered
                outcome: “Being a living epistle in reverence and awe as His Word
                becomes real in my life.”'
              kind: prose
              UID: MIN171.13.2.1.P.41
              page: 157
            - p: 42
              text: 'Let me say it again: A Spirit-empowered lifestyle requires the
                fullness of the Spirit. In Ephesians 5:18, Paul says we are to be
                filled with the Spirit—not a one-time event but a continuous activity.
                Much of what God requires of disciples cannot be done by human effort—and
                we certainly need the transforming work of the Spirit to change our
                motives from wanting our own glory to wanting to honor God. We need
                the supernatural heart and ability provided by the Holy Spirit.'
              kind: prose
              UID: MIN171.13.2.1.P.42
              page: 157
            - p: 43
              text: Finally, a Spirit-empowered lifestyle requires faithful engagement
                with God’s people. We must see people as God sees them, or we will
                never love them as He loves them. We must see people as both fallen
                and alone. They have spiritual needs as well as relational needs.
              kind: prose
              UID: MIN171.13.2.1.P.43
              page: 157
            - p: 44
              text: My friend, Dr. Ferguson, pointed something out in Scripture that
                I had never seen before—aloneness actually came before fallenness.
                In Genesis 2:18 (NKJV), God says that Adam was alone and it was “not
                good.” Several verses before Adam and Eve fell into sin (Genesis 3:6),
                God declared it was not good that Adam was alone. Ferguson (2004)
                observes, “Ministering acceptance and removing a person’s aloneness
                does not mean that we condone sin. Rather, it means that we look deeper
                in order to see people’s needs” (153).
              kind: prose
              UID: MIN171.13.2.1.P.44
              page: 158
            - p: 45
              text: I am convinced that the path to becoming a Spirit-empowered disciple
                begins with loving God and loving others, and this is something we
                cannot accomplish without the assistance of the Holy Spirit.
              kind: prose
              UID: MIN171.13.2.1.P.45
              page: 158
            - p: 46
              text: 'Every church leader needs to ask, “What environments are we creating
                to allow for powerful, relational connections to occur?” Different
                churches answer this question in different ways, but churches with
                effective discipleship always have a clear answer. Many use small
                groups to encourage heart-to-heart and life-on-life connections. Some
                have mentoring programs to select and equip rising leaders. Some use
                Sunday school, classes, seminars, and retreats to bring people together,
                to deepen relationships, and to impart spiritual truth. Yet these
                environments are not enough. Powerful ministries and growing churches
                always have two additional ingredients in their discipleship process:
                ministry activities where people apply what they are learning by reaching
                out to others and a vision to multiply leadership by equipping disciples
                to disciple others (2 Timothy 2:2). A clear vision for discipleship
                means that virtually every event is designed to enhance relationships
                and equip people to love God with all their hearts, serve God gladly
                and effectively, and multiply themselves in the lives of others.'
              kind: prose
              UID: MIN171.13.2.1.P.46
              page: 158
            - p: 47
              text: Measuring Spiritual Growth
              kind: heading
              UID: MIN171.13.2.1.P.47
              page: 158
            - p: 48
              text: The difficulty of discipleship is that there is an inherent danger
                in applying any organizational model to the church or to the life
                of the believer. It can be all too easy for the focus to shift from
                an organic expression of vibrant life and faith to a legalistic list
                of steps or tasks that can be devoid of the very life we seek to promote.
              kind: prose
              UID: MIN171.13.2.1.P.48
              page: 158
            - p: 49
              text: This does not detract from the sacredness of spiritual disciplines
                such as prayer, Bible reading, church attendance, witnessing, or stewardship.
                Followers of Christ throughout the ages have used these and other
                methods to grow deeper in their walk and fellowship with God. But
                better questions about spiritual growth focus on whether or not our
                disciples are exploring, embracing, experiencing, and expressing rather
                than on how many verses they have memorized. We must ask the right
                questions if we want to get the right answers.
              kind: prose
              UID: MIN171.13.2.1.P.49
              page: 158
            - p: 50
              text: It is valuable to define certain outcomes for disciples—goals
                and ideals to aim for. If we fail to set goals, we will miss them
                every time. But while Scripture is clear about what a disciple should
                know (believe) and how a disciple should act (behave), these are not
                sufficient and require the added component of relationship, both between
                believers and between an individual and Christ.
              kind: prose
              UID: MIN171.13.2.1.P.50
              page: 158
            - p: 51
              text: Becoming a better disciple is not about doing more and knowing
                more. We cannot grade disciples by how many Scriptures they have memorized
                or use such a principle to define whether one disciple is more spiritually
                advanced than another. Human effort alone cannot produce effective
                disciples or discipleship outcomes—though it can appear to do so for
                a time, by some measures. We must have the empowering relationship
                the Holy Spirit offers each and every believer.Our goal is to make
                disciples who make disciples—Spirit-empowered disciples.
              kind: prose
              UID: MIN171.13.2.1.P.51
              page: 159
            citations:
