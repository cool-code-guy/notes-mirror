                Spirit-empowered disciple—specifically, one of a generation hungry
                for experience. Spirit-empowered disciples do not experience an isolated
                event but a process of complete transformation. Paul describes this
                in his words, “And we all, with unveiled face, beholding the glory
                of the Lord, are being transformed into the same image from one degree
                of glory to another. For this comes from the Lord who is the Spirit”
                (2 Corinthians 3:18, ESV). We each progress through a spiritual journey.
                On this journey, we have a biblical directive to keep growing. To
                illustrate this pattern of growth, we have defined five classes of
                people who attend our churches each week: •\tUnbelievers—People who
                have not received Christ as Lord and Savior of their lives. •\tBelievers—People
                who have received Christ as Lord (belief system) but have not yet
                become learners who obey God’s Word (behavior). •\tDisciples—People
                who adhere to the teachings and practices of growing in Christ and
                demonstrate a lifestyle corresponding to God’s Word. •\tServant-Leaders—People
                who have grown in the direction, ways, and timing of the Lord and
                share their knowledge of Christ with others so they, too, can learn
                His direction, ways, and timing. They are involved in different aspects
                of church life (bus drivers, altar workers, greeters, deacons, Sunday
                school teachers, and so forth). •\tReproducers—People who mentor others
                through relationship to the point where they become servant-leaders."
