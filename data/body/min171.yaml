              kind: prose
              UID: MIN171.17.2.1.P.30
            - p: 31
              text: Congregational Assessment
              kind: heading
              UID: MIN171.17.2.1.P.31
              page: 219
            - p: 32
              text: To what degree is your church fulfilling the five functions of
                the Acts 2 process?
              kind: heading
              UID: MIN171.17.2.1.P.32
              page: 219
            - p: 33
              text: The Acts 2 Journey is not a program. A program is something you
                can start and stop. The Acts 2 Journey is based on a biblical process
                found in Acts 2. The process found in Acts 2 is replicable because
                it is based on Christ’s model for the church that is found in the
                book of Acts. The Acts 2 process includes key functions of the early
                church that are identified in Acts 2:42–47. The key functions are
                continued later in Acts as well.
              kind: prose
              UID: MIN171.17.2.1.P.33
              page: 219
            - p: 34
              text: And they continued steadfastly in the apostles’ doctrine and fellowship,
                in the breaking of bread, and in prayers. Then fear came upon every
                soul, and many wonders and signs were done through the apostles. Now
                all who believed were together, and had all things in common, and
                sold their possessions and goods, and divided them among all, as anyone
                had need. So continuing daily with one accord in the temple, and breaking
                bread from house to house, they ate their food with gladness and simplicity
                of heart, praising God and having favor with all the people. And the
                Lord added to the church daily those who were being saved. (Acts 2:42–47,
                NKJV)
              kind: quote
              UID: MIN171.17.2.1.P.34
            - p: 35
              text: 'The Five Functions based on the model in Acts 2:42–47 are:'
              kind: quote
              UID: MIN171.17.2.1.P.35
            - p: 36
              text: 1. Connect (fellowship, hospitality, and welcoming people)
              kind: list
              UID: MIN171.17.2.1.P.36
            - p: 37
              text: 2. Grow (Spirit-empowered discipleship)
              kind: list
              UID: MIN171.17.2.1.P.37
              page: 225
            - p: 38
              text: 3. Serve (gift-oriented ministry)
              kind: list
              UID: MIN171.17.2.1.P.38
              page: 233
            - p: 39
              text: 4. Go (evangelism)
              kind: list
              UID: MIN171.17.2.1.P.39
              page: 234
            - p: 40
              text: 5. Worship (praise and prayer)
              kind: list
              UID: MIN171.17.2.1.P.40
              page: 234
            - p: 41
              text: The Congregational Assessment (on the following pages) is designed
                to help your church evaluate how engaged it is in carrying out the
                five functions of the Acts 2 process. After reading each statement,
                mark the box that most accurately describes the current state of your
                congregation. Please note, each statement may not perfectly describe
                your congregation. Use your best judgment to make an objective assessment.
              kind: prose
              UID: MIN171.17.2.1.P.41
            - p: 42
              text: 'For senior pastors and their ministry teams : After each person
                completes an assessment individually, team members should compare
                results and determine the consensus for performance in each core function.'
              kind: list
              UID: MIN171.17.2.1.P.42
            - p: 43
              text: 'For those who are not senior pastors : Complete the congregational
                assessment in one of the following ways: (1) as a private and confidential
                assessment of the condition of a church you are currently aware of.
                (This should not be shared with others in the church), OR (2) as a
                practice assessment of a church you previously attended. The goal
                of this exercise is to help you evaluate a church based on the five
                functions of the Acts 2 process.'
              kind: list
              UID: MIN171.17.2.1.P.43
