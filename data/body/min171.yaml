      - last_modified: '2026-03-27'
        title: The Functions Are Not Multiple Choice
        subobjectives:
          7.2.1:
            body:
            - p: 1
              text: We ask every church that goes through the Acts 2 Journey which
                of the five functions—connect, grow, serve, go, or worship—they think
                is their greatest strength. Almost every church says they are strongest
                in worship or connect (fellowship), and almost everyone lists go (evangelism)
                as their weakest function.
              kind: prose
              UID: MIN171.7.2.1.P.1
              page: 83
            - p: 2
              text: One particular church’s response to this question was telling
                because it exposed the need for honest assessment. When asked this
                question, the ten or twelve older adults on the pastor’s dream team
                said that worship was their strongest function. When asked why, they
                said, “Oh, our worship music is just wonderful! Everybody just feels
                the presence of the Lord. It is amazing!
              kind: prose
              UID: MIN171.7.2.1.P.2
            - p: 3
              text: However, the young couple in the group both firmly shook their
                heads “no.” It was obvious they shared a different view from the older
                people on the team. Everyone looked at them, and it was an embarrassing
                moment, but they needed to recognize the disconnection. The young
                couple was the youth leadership team, and they pointed out that the
                older saints loved worship hymns but these songs were not resonating
                with the younger people in the church.
              kind: prose
              UID: MIN171.7.2.1.P.3
              page: 84
            - p: 4
              text: Over the course of a year, this church worked hard to figure out
                a strategy for getting where they wanted to be, but it could only
                start when they honestly assessed where they were.
              kind: prose
              UID: MIN171.7.2.1.P.4
              page: 84
            - p: 5
              text: An older gentleman from another church began the Acts 2 Journey
                with his arms firmly crossed. He seemed to be there against his will.
                However, during the assessment, he began to break down and weep as
                he saw the results that would play out should they continue in the
                direction they were taking. This same man ultimately became a leader
                for their entire effort to ask “better” questions.
              kind: prose
              UID: MIN171.7.2.1.P.5
              page: 84
            - p: 6
              text: Their questions had all been about “us”—the people already at
                the church. The better questions were about “them”—the people they
                wanted to bring into their church.
              kind: prose
              UID: MIN171.7.2.1.P.6
              page: 84
            - p: 7
              text: When they stopped asking the wrong questions, they started getting
                the right answers.
              kind: prose
              UID: MIN171.7.2.1.P.7
              page: 84
            - p: 8
              text: Near the end of their effort to affect changes, they made a video
                featuring this older leader, who had been in the church for at least
                thirty years. The video showed him standing at the fork of a gravel
                road. In the video, he said it was time for the church to take a new
                path. He asked everyone to follow him, and that was how this church
                introduced a new vision and direction for their congregation.
              kind: prose
              UID: MIN171.7.2.1.P.8
              page: 84
            - p: 9
              text: It was time for them to get healthy, but they first had to ask
                the right questions and make an honest assessment. Without these hard
                questions and perhaps harder answers, they were never going to make
                the necessary changes.
              kind: prose
              UID: MIN171.7.2.1.P.9
              page: 84
            - p: 10
              text: 'That same choice is before each of us: Will we be willing to
                face the truth and do what is necessary to bring change to our church?'
              kind: prose
              UID: MIN171.7.2.1.P.10
              page: 85
            - p: 11
              text: Assumptions
              kind: heading
              UID: MIN171.7.2.1.P.11
              page: 85
            - p: 12
              text: We have some key considerations when gauging the health of a church,
                large or small. The first of these is whether the size of a church
                is the most telling indicator of health. While logic says a healthy
                church will be growing numerically, it is also true that disciples
                may be growing spiritually in a church that is not increasing in attendance.
                We have a tendency to think that “bigger is better.” The fact is that
                small congregations can be healthy, missional, and effective in making
                a difference in their communities. They may sometimes be the only
                church body impacting those communities.
              kind: prose
              UID: MIN171.7.2.1.P.12
              page: 85
            - p: 13
              text: The truth is that bigger just means larger. A church is not necessarily
                better or more effective simply because it is larger. Our desire is
                to have healthy, vibrant churches of every size that are being revitalized
                by the power of the Holy Spirit.
              kind: prose
              UID: MIN171.7.2.1.P.13
              page: 85
            - p: 14
              text: You are reading this book because you want to be a better leader
                and you want your church to grow—in depth and in size. It is best,
                however, to focus on creating a healthy environment, a hothouse where
                people can grow in their love for God, for each other, and for people
                outside the church. If you create a healthy environment and trust
                God for the growth, it will come.
              kind: prose
              UID: MIN171.7.2.1.P.14
              page: 85
            interactive_questions:
            - p: 1
              text: What are some of the challenges of conducting an honest assessment?
              response: Some people may hold back from an honest assessment because
                they do not want to be “negative” or cause problems. Others may state
                things too negatively because of their temperament or because of past
                problems. Additional answers may vary.
              UID: MIN171.7.2.1.IQ.1
            - p: 2
              text: Why is it essential to have congregational leaders approve the
                need for new direction and change?
              response: Congregational leaders need to see solid reasons for change
                in order to provide support. Congregational leaders are influencers
                who will help lead the congregation in the new vision. If various
                levels of leadership buy in and see the vision, it will strengthen
                the unity of the congregation. Additional answers may vary.
              UID: MIN171.7.2.1.IQ.2
            - p: 3
              text: How does our focus change when we ask questions about the people
                we want to reach?
              response: If you only ask questions about what people in the church
                want, you will only be addressing those needs and your focus will
                be inward. If you ask questions about the people you want to reach,
                you will start making plans and identifying ways to minister to them
                and keep your focus outward. Additional answers may vary.
              UID: MIN171.7.2.1.IQ.3
            - p: 4
              text: Why can it be misleading to only focus on church size as an indication
                of health?
              response: Churches in smaller communities have fewer people to draw
                from and may be healthy with a smaller number of people than a large
                city church. Larger churches can also have significant church-health
                issues that need to be addressed. Additional answers may vary. Mission
                8 CHAPTER
              UID: MIN171.7.2.1.IQ.4
            last_modified: '2026-03-27'
            text: Explain how honest an assessment can prepare the hearts of our leaders
              and congregation for necessary change.
            glossary: []
    - last_modified: '2026-06-17'
      title: 8 - Mission
      print_page: 1
      lessons:
      - last_modified: '2026-03-27'
        title: Great Commission and Great Commandment
        subobjectives:
          8.1.1:
            body:
            - p: 1
              text: 'Our mission, the Great Commission, was established with Christ’s
                words on the Mount of Ascension: “Therefore go and make disciples
                of all nations, baptizing them in the name of the Father and of the
                Son and of the Holy Spirit, and teaching them to obey everything I
                have commanded you. And surely I am with you always, to the very end
                of the age” (Matthew 28:19–20, NIV).'
              kind: prose
              UID: MIN171.8.1.1.P.1
              page: 90
            - p: 2
              text: The Great Commission focuses on the belief system Christ taught,
                and it establishes the purpose for the church’s existence. We are
                commissioned to worship the Lord with all we have, to win the lost,
                to train believers to become disciples, to use our ministry gifts,
                and to find environments of fellowship for connection.
              kind: prose
              UID: MIN171.8.1.1.P.2
              page: 90
            - p: 3
              text: 'What we often call the Great Commandment serves as a guide for
                our beliefs—our attitudes and actions—how we go about this Great Commission.
                Jesus spelled out the Great Commandment, and love was front and center:
                “‘Love the Lord your God with all your heart and with all your soul
                and with all your mind.’ This is the first and greatest commandment.
                And the second is like it: ‘Love your neighbor as yourself’” (Matthew
                22:37–39, NIV).'
              kind: prose
              UID: MIN171.8.1.1.P.3
              page: 90
            - p: 4
              text: In the light of our mission to make disciples, we can sometimes
                neglect that love is the guiding force that should govern how we pursue
                our mission. Paul admonishes us that without love, evidence of Spirit-empowerment—such
                as speaking in tongues, prophecy, and faith to move mountains—is hollow
                and nothing but a clanging cymbal, profiting us nothing.
              kind: prose
              UID: MIN171.8.1.1.P.4
              page: 90
            - p: 5
              text: It is as vital to have love guiding our mission as it is to have
                the Holy Spirit empowering us to complete it.
              kind: prose
              UID: MIN171.8.1.1.P.5
              page: 90
            - p: 6
              text: The mission of the church continues through each of us. As leaders,
                it is our responsibility to disciple the people who can bring this
                message to those who are searching for truth and looking for hope.
              kind: prose
              UID: MIN171.8.1.1.P.6
              page: 90
            - p: 7
              text: My friend Denny Miller has written extensively about the Holy
                Spirit and the mission of God. In his book, The Spirit of God in Missions
                (2012), he writes, “The church faces a great challenge. More than
                two thousand years ago, Jesus commissioned His church to take the
                gospel to every nation and people on earth. Today, as never before,
                that goal is within reach. Missiologists today talk of closure, or
                completing Christ’s commission” (233).
              kind: prose
              UID: MIN171.8.1.1.P.7
              page: 90
            - p: 8
              text: How could that happen? Is it possible? It is possible, but only
                with God’s enabling. Let us believe in fresh renewal and empowerment
                to accomplish our mission.
              kind: prose
              UID: MIN171.8.1.1.P.8
              page: 91
            citations:
            - citekey: miller2012
              pandoc: '[@miller2012]'
              intext: (Miller 2012)
              paragraph: MIN171.8.1.1.P.7
              UID: MIN171.8.1.1.C.1
            interactive_questions:
            - p: 1
              text: Why must the Great Commandment guide our efforts to complete the
                Great Commission?
              response: Love must guide how we go about fulfilling the Great Commission.
                Love must be the motivation for all aspects of evangelism and discipleship.
                Love provides a witness to the reality of Christ’s work in people’s
                lives. Additional answers may vary.
              UID: MIN171.8.1.1.IQ.1
            - p: 2
              text: How does Spirit-empowerment relate to the Great Commission?
              response: Without love, evidence of Spirit-empowerment—such as speaking
                in tongues, prophecy, and faith to move mountains—is hollow and nothing
                but a clanging cymbal. Love must guide and motivate all aspects of
                Spirit-empowerment, including evangelism, preaching, witnessing, and
                the use of spiritual gifts.
              UID: MIN171.8.1.1.IQ.2
            - p: 3
              text: Take a few moments to memorize the Great Commission (Matthew 28:19-20)
                and the Great Commandment (Matthew 22:37-39).
              UID: MIN171.8.1.1.IQ.3
            last_modified: '2026-03-27'
            scripture:
            - intext: Matthew 28:19–20
              version: NIV
              refs:
              - ref: Matthew 28:19-20
                key: matthew.28.19-20
                bib_gate: https://www.biblegateway.com/passage/?search=Matthew%2028%3A19-20&version=NIV
              paragraph: MIN171.8.1.1.P.1
              UID: MIN171.8.1.1.S.1
            - intext: Matthew 22:37–39
              version: NIV
              refs:
              - ref: Matthew 22:37-39
                key: matthew.22.37-39
                bib_gate: https://www.biblegateway.com/passage/?search=Matthew%2022%3A37-39&version=NIV
              paragraph: MIN171.8.1.1.P.3
              UID: MIN171.8.1.1.S.2
            text: Define and explain the essential components of the biblical mission
              of the Church.
            glossary: []
      - last_modified: '2026-03-27'
        title: A People of Mission
        subobjectives:
          8.2.1:
            body:
            - p: 1
              text: 'When considering any passage of Scripture, we must look at the
                rational meaning and extract behavioral applications from the text,
                but we also need to look deeper into the passage. We must always ask
                ourselves this question: What is revealed in the text about the character,
                person, and heart of God? We must then allow the Spirit to lead us
                into a heartfelt response. This relational perspective is critical
                to developing a more intimate relationship with the One who is Truth.'
              kind: prose
              UID: MIN171.8.2.1.P.1
              page: 91
            - p: 2
              text: It all comes back to relationship—one of the core elements that
                separates Christianity from religions that are all about human efforts
                to reach God. Everything stems from or is initiated by a relationship
                with Christ through the Holy Spirit. It all starts with knowing Him
                and engaging the personal relationship He offers through faith in
                Christ’s sacrifice.
              kind: prose
              UID: MIN171.8.2.1.P.2
              page: 91
            - p: 3
              text: We can too easily be distracted by “doing good things for God”
                instead of knowing Him and serving Him out of an overflowing heart.
                People may engage in disciplines and exert effort to fulfill the commands
                of Scripture, but those who engage in a lot of spiritual activity
                without a growing relationship with Christ will be frustrated and
                disappointed—eventually, they will burn out. When we operate in our
                own strength, we soon find our motivations, willpower, and habits
                to be insufficient. The longer we appear to pull it off without trusting
                in God’s purpose and power, the more our pride grows.
              kind: prose
              UID: MIN171.8.2.1.P.3
              page: 91
            - p: 4
              text: For the Spirit-empowered disciple, knowledge and acts of service
                are the products of a relationship with Christ. They reflect His work
                within us rather than being goals in and of themselves.
              kind: prose
              UID: MIN171.8.2.1.P.4
              page: 91
            - p: 5
              text: Make the Mission Human
              kind: heading
              UID: MIN171.8.2.1.P.5
              page: 92
            - p: 6
              text: Love is how we carry out the mission, but relationship is what
                makes the mission human—giving it flesh and bone, faces and personalities.
                When the people walking through a church’s doors are its most valuable
                commodity, an attitude of “nickels and noses” will not cut it. Those
                people will only feel a call toward discipleship as they are embraced
                in relationship and promoted in their own relationships with Christ
                Jesus.
              kind: prose
              UID: MIN171.8.2.1.P.6
              page: 92
            - p: 7
              text: For many people, those relationships require a sense of ownership—they
                have to be invested in order to feel they are a part of things. When
                I was at First Assembly of God in Little Rock, we were going through
                a building process. Curiously, it was not the architect who made one
                of the most interesting contributions to the design phase of the project.
              kind: prose
              UID: MIN171.8.2.1.P.7
              page: 92
            - p: 8
              text: We lived in the parsonage the first two years at First Assembly,
                and a congregant named Verl Simpson lived next door to us. Our houses
                were conveniently located across the street from the church but in
                an interesting part of town. Up the road one way was Memorial Hospital,
                and two blocks away was the VA Hospital. The VA Hospital had a unit
                for people with mental challenges, and sometimes, those people would
                wander the neighborhood when they got out, knocking on doors and asking
                for money. Verl Simpson nominated himself as the protector for my
                wife and daughter, particularly if I was not there.
              kind: prose
              UID: MIN171.8.2.1.P.8
              page: 92
            - p: 9
              text: An early riser, Verl was always urging me to get up earlier—never
                mind that he had to take a nap at 11:00 a.m.! We would banter good-naturedly
                about it, and I (a notorious night owl) teased him that if I wanted
                to sleep my day away, I would get up as early as he did.
              kind: prose
              UID: MIN171.8.2.1.P.9
              page: 92
            - p: 10
              text: One day he told my wife, Johanna, “That husband of yours is intent
                on moving this church, is he not?” He did not wait for a response
                before telling her, “Well, I am not going. Whoever he sells this church
                to, that is what I am going to become. If it is to a Baptist church,
                I am going to become a Baptist. If he sells it to Catholics, I am
                going to become Catholic.”
              kind: prose
              UID: MIN171.8.2.1.P.10
              page: 92
            - p: 11
              text: Verl was not the only dissenter; the church had been divided about
                what to do with this property for years before I even got there. So
                when it was nearly time to start construction, I knew I needed to
                get more people on board. I invited a group of people to the church
                for refreshments in order to show them samples of everything that
                would be in the new building. I had cuttings of the carpet, pew samples,
                and all the drawings up on the wall. The architect was present to
                answer questions and explain the drawings. I hoped that this would
                take away the fears and misgivings of the holdouts.
              kind: prose
              UID: MIN171.8.2.1.P.11
              page: 92
            - p: 12
              text: Well, Uncle Verl, as we called him, decided to show up. He had
                his hands stuffed deeply into his pockets and a scowl on his face.
                He just walked around looking at everything and not saying a word.
                I watched him out of the corner of my eye and wondered what he was
                thinking. I noticed that when he got to the structural drawings, he
                studied them for a long time.
              kind: prose
              UID: MIN171.8.2.1.P.12
              page: 92
            - p: 13
              text: After he got through studying the architect’s drawings, he came
                over to me and asked, “Pastor, where is the architect? I have a question
                for him.”
              kind: prose
              UID: MIN171.8.2.1.P.13
              page: 93
            - p: 14
              text: I groaned inside but brought the architect over to talk with us.
                “I am looking at the platform, right?” Verl asked. The architect confirmed
                that as correct, so Verl went on. “Well, it looks to me like you have
                the audio-visual in good shape, but I do not think you have drawn
                an adequate distribution for the airflow over the platform. My pastor
                deserves to be cool when he preaches.”
              kind: prose
              UID: MIN171.8.2.1.P.14
              page: 93
            - p: 15
              text: The architect’s eyebrows went up, but the two men took a closer
                look at the drawings. The architect finally said, “You know, Mr. Simpson,
                I believe you are right. I think that is an oversight we need to correct.”
              kind: prose
              UID: MIN171.8.2.1.P.15
              page: 93
            - p: 16
              text: A massive smile broke out on Verl’s face. His chest seemed to
                swell, and his attitude was completely different. He had made a contribution;
                he had challenged the man and won!
              kind: prose
              UID: MIN171.8.2.1.P.16
              page: 93
            - p: 17
              text: Verl was on my side the rest of the way, helping advocate for
                the new building he had “helped design.” He and his wonderful wife
                even moved to be closer to the new church, and he continued to serve
                as an usher. We gave Verl Simpson all the credit for his contribution,
                and when we moved into the new building, I would frequently say that
                if it were not for him, I would be sweating while I preached.
              kind: prose
              UID: MIN171.8.2.1.P.17
              page: 93
            - p: 18
              text: People make all the difference, and when they buy in and take
                ownership, you will be amazed at what they can do! It may seem ridiculous
                to think that the success or failure of an endeavor can hinge on one
                person, but it definitely does hinge on individuals.
              kind: prose
              UID: MIN171.8.2.1.P.18
              page: 93
            - p: 19
              text: Can one person change everything? Well, a very unlikely person
                changed a small but key component of our new building, and his contribution
                helped keep me cool and collected while we pursued God’s mission and
                vision for our church.
              kind: prose
              UID: MIN171.8.2.1.P.19
              page: 93
            - p: 20
              text: The church is composed of individuals, each one bearing Christ’s
                assignment on the earth and each one capable of receiving His vision
                for their lives and for the lives they touch. Each one of us can make
                a difference as we show the world our vision for what a life connected
                to God can look like, carrying out His mission for the church.
              kind: prose
              UID: MIN171.8.2.1.P.20
              page: 93
            interactive_questions:
            - p: 1
              text: Why must discipleship involve more than just learning and doing?
              response: The Gospel invites us into relationship with God by the gift
                of His grace. Our obedience to His Word is our response to that gift,
                but not the full measure of that relationship. We are invited to know
                Him and truly walk with Him.
              UID: MIN171.8.2.1.IQ.1
            - p: 2
              text: How can our efforts of extending relationship to others help illustrate
                God’s invitation to relationship with Him?
              response: When we love others sacrificially, we demonstrate the nature
                of Christ and people can begin to see Him and His love in us. If we
                refuse to offer relationship to others, how are we then to demonstrate
                a kingdom based on love.
              UID: MIN171.8.2.1.IQ.2
            - p: 3
              text: How can our openness to the contributions of others strengthen
                the church?
              response: When people are able to contribute their gifts and abilities,
                our efforts are strengthened and maximized, and their contribution
                demonstrates their value and significance to Christ’s work.
              UID: MIN171.8.2.1.IQ.3
            - p: 4
              text: Why are relationships enhanced when people know their contributions
                really matter?
              response: Answers will vary and be unique to the individual.
              UID: MIN171.8.2.1.IQ.4
            last_modified: '2026-03-27'
            text: Explain how relationship with Christ is the primary focus of biblical
              discipleship.
            glossary: []
      - last_modified: '2026-06-17'
        title: Can Just One Person Make a Difference
        subobjectives:
          8.3.1:
            body:
            - p: 1
              text: Can one person change everything?
              kind: prose
              UID: MIN171.8.3.1.P.1
            - p: 2
              text: I think we could say with confidence that Abraham Lincoln changed
                his world, from writing his Gettysburg Address that inspired a nation,
                to seeing our country through a brutal civil war that helped abolish
                slavery. Winston Churchill saw England and the Allies through dark
                days and some of the worst moments in World War II and inspired free
                nations to continue to fight against the tyranny of Hitler’s Germany.
                Certainly, the world would be different if Hitler had crossed the
                English Channel. We could probably all agree that Nelson Mandela,
                who spent twenty years in jail for his opposition to apartheid, helped
                bring healing to an entire country with his magnanimous attitude toward
                former enemies when he emerged from prison a matured man and became
                an influential president in South Africa. Mother Teresa’s life of
                poverty and outreach to others was so powerful that it did not just
                change the lives of the people in India but provided a platform for
                her compassion to change the lives of countless millions around the
                world.
              kind: prose
              UID: MIN171.8.3.1.P.2
              page: 94
            - p: 3
              text: One person can make a difference. The names I have listed are
                just a few heroes of humanity, but you do not have to be one of these
                paragons to make a difference.
              kind: prose
              UID: MIN171.8.3.1.P.3
              page: 94
            - p: 4
              text: Is it possible that even the young daughter of a drug addict could
                do the same?
              kind: prose
              UID: MIN171.8.3.1.P.4
              page: 94
            - p: 5
              text: The Mason Jar
              kind: heading
              UID: MIN171.8.3.1.P.5
              page: 94
            - p: 6
              text: Can one person really adopt the Great Commission and the Great
                Commandment?
              kind: prose
              UID: MIN171.8.3.1.P.6
              page: 94
            - p: 7
              text: Years ago, I was receiving a missions offering, and a six-year-old
                girl brought me a Mason fruit jar with twelve dollars and forty-five
                cents in it. She told me, “I have been saving money to buy my mommy
                a house, but I want to give it to you for these Bibles.” Her mother
                was a drug addict, strung out on methamphetamines and facing twenty-three
                felony counts and three years in prison. The little girl had no idea
                that what she could save in a jar would never buy a house. All she
                knew was that something was broken in her home, and she was trying
                to help fix it.
              kind: prose
              UID: MIN171.8.3.1.P.7
              page: 94
            - p: 8
              text: I did not want to take that money from the little girl, and I
                tried to give it back to her because I knew a bit about her situation.
                I knew her grandfather, who was a pastor. Her mother, the pastor’s
                daughter, had been raised in church, had attended Sunday school, and
                had been a regular at church camp. But she had lost her way and had
                become a dysfunctional individual. Her little daughter was present
                that night at her grandfather’s church where I was speaking because
                the court had taken her children from her care and placed them with
                the grandparents. That is what I knew and why I could not bear to
                take the contents of her Mason jar.
              kind: prose
              UID: MIN171.8.3.1.P.8
            - p: 9
              text: She was so insistent and passionate, however, that I took that
                Mason jar and gave the money to buy Bibles for China. Her unselfish
                act of generosity was an inspiration to others. Later, I took her
                and her grandparents to a missions banquet where we were raising funds
                to buy more Bibles—and by telling her story, those present were moved
                to pledge more than two million dollars for Bibles.
              kind: prose
              UID: MIN171.8.3.1.P.9
              page: 95
            - p: 10
              text: The power of one little girl’s faith changed countless lives.
                She filled one Mason jar with twelve dollars and forty-five cents,
                but it was a seed, like the widow’s mite, in the hands of God. She
                was thinking of buying a house, but the Holy Spirit was thinking of
                restoring a home. She planted a seed, and it not only inspired millions
                of dollars for Bibles but produced fruit within her own family.
              kind: prose
              UID: MIN171.8.3.1.P.10
              page: 95
            - p: 11
              text: 'Miraculously, when her mother stood before the judge to face
                the consequences of her actions, she did not receive what she expected.
                “You deserve no mercy,” he told her. “Your parole officer says you
                were the worst case he has ever dealt with. You have lost your home,
                your husband, your job, your dignity, and your children—they have
                been taken away from you.” He paused, considering, before saying something
                unexpected: “I do not know why I am doing this . . . but I am going
                to give you one more chance.”'
              kind: prose
              UID: MIN171.8.3.1.P.11
              page: 95
            - p: 12
              text: She went to a halfway house instead of prison, and the real harvest
                of that little girl’s seed was that her mother was saved and delivered.
              kind: prose
              UID: MIN171.8.3.1.P.12
              page: 95
            - p: 13
              text: Ten years later, that mother is a worship leader in church and
                sings praises to the Lord nearly every week. They have had trouble,
                including relapses, but the power of one little girl’s faith meant
                a world of difference to her mother and continues to inspire others
                every time I share her story.
              kind: prose
              UID: MIN171.8.3.1.P.13
              page: 95
            - p: 14
              text: We have a mission as a corporate church, but we cannot fulfill
                it without individuals.
              kind: prose
              UID: MIN171.8.3.1.P.14
              page: 95
            - p: 15
              text: The Power of One
              kind: heading
              UID: MIN171.8.3.1.P.15
              page: 95
            - p: 16
              text: When we talk about the church, we think of a body of individuals
                who seek and serve the Lord together. We think of the power of “together”
                and what the Lord can do through a passionate leader and a group of
                Spirit-empowered believers.
              kind: prose
              UID: MIN171.8.3.1.P.16
              page: 95
            - p: 17
              text: While it is necessary for us to understand the power of “together,”
                “together” cannot occur if one person does not volunteer.
              kind: prose
              UID: MIN171.8.3.1.P.17
              page: 95
            - p: 18
              text: “Together” begins with just one person.
              kind: prose
              UID: MIN171.8.3.1.P.18
              page: 95
            - p: 19
              text: 'Talking about “one” makes me think of a song I referenced in
                a sermon called “The Pied Piper.” The song included this line, “One
                is the Loneliest Number.” While the songwriters had it right that
                one person can be lonely and ineffectual, they were not completely
                correct. You see, it only takes one person adopting the universal
                mission of the church to make an extraordinary difference. Throughout
                church history, God has used the vision, love, and courage of individuals
                to change the course of history. In many cases, these people appeared
                to be the most unlikely candidates for greatness, but they were humble
                enough to recognize two essential facts: their inadequacy and God’s
                supreme adequacy. Trusting Him, they changed the world.'
              kind: prose
              UID: MIN171.8.3.1.P.19
              page: 96
            - p: 20
              text: 'The revitalization of any church begins when even one person
                catches the dream of the Holy Spirit’s empowerment to accomplish His
                mission on the earth. One person cannot save the world, but one person
                with hope can start something else: revitalization.'
              kind: prose
              UID: MIN171.8.3.1.P.20
              page: 96
            interactive_questions:
            - p: 1
              text: List the names of ten people who have made a significant difference
                in your life.
              response: Answers will vary and be unique to the individual.
              UID: MIN171.8.3.1.IQ.1
            - p: 2
              text: 'How do you respond to the statement: The kingdom of God isn’t
                about numbers but about stories.'
              response: Answers will vary, but should affirm the statement and the
                celebration of how God rewrites people’s stories for His glory.
              UID: MIN171.8.3.1.IQ.2
            - p: 3
              text: What are some ways you have seen one person make a difference
                in church transformation?
              response: Answers will vary but should address the contributions of
                individuals to the kingdom of God through the local church. Vision
                9 CHAPTER
              UID: MIN171.8.3.1.IQ.3
            last_modified: '2026-06-17'
            text: Describe the importance of every individual in the cause of Christ.
            glossary: []
    - last_modified: '2026-03-27'
      title: 9 - Vision
      print_page: 1
      lessons:
      - last_modified: '2026-03-27'
        title: The Need for Vision
        subobjectives:
          9.1.1:
            body:
            - p: 1
              text: 'Vision is often a misunderstood word, but for our purposes, a
                vision is our current understanding of God’s preferred future for
                a person, group, or congregation. Stephen Covey defines it this way:
                “Vision is the best manifestation of creative imagination and the
                primary motivation of human action. It is the ability to see beyond
                our present reality, to create, to invent what does not yet exist,
                and to become what we not yet are. It gives us capacity to live out
                our imagination instead of our memory” (Covey, Merrill, and Merrill
                1997, 103).'
              kind: prose
              UID: MIN171.9.1.1.P.1
              page: 100
            - p: 2
              text: Vision is the ability to courageously explore possibilities. It
                understands who we are and what we are uniquely designed to do. It
                answers “Where are we going?” and “Why are we doing it?” Vision imagines
                life beyond present boundaries. It is based on truth, but it transcends
                current reality. It unites people, helps them focus on a destination,
                and dares them to push against the status quo.
              kind: prose
              UID: MIN171.9.1.1.P.2
              page: 100
            - p: 3
              text: 'Vision always involves risk and invites criticism, especially
                for the individuals into whom God breathes the dream that becomes
                a vision. Erwin McManus, pastor of Mosaic Church in Los Angeles, writes
                this:'
              kind: prose
              UID: MIN171.9.1.1.P.3
              page: 100
            - p: 4
              text: From the beginning, God has raised up men and women who have had
                the power of seeing. They understood the times in which they lived.
                They understood the context to which they were called. They had the
                ability to understand change and create change. They could both perceive
                and foresee. (cited by Marti 2009, 78)
              kind: quote
              UID: MIN171.9.1.1.P.4
            - p: 5
              text: One of the primary problems in churches—especially those whose
                growth has become stunted—is the loss of vision. People forget why
                they are there. Often it is not the pastor who is without vision;
                it is the people who have lost track of their purpose as a church.
                Decline always follows, and it is the result of inward focus.
              kind: prose
              UID: MIN171.9.1.1.P.5
            - p: 6
              text: The church has a mission, but we also have a vision for what the
                world would look like reconnected to God. Our vision is our dream—that
                everyone would come to the saving knowledge of Christ and be restored
                to relationship with the Father. Our vision must be outward focused,
                thinking of them and not us. Without this, we perish (Proverbs 29:18,
                KJV).
              kind: prose
              UID: MIN171.9.1.1.P.6
              page: 100
            - p: 7
              text: Seeing What Is Not There
              kind: heading
              UID: MIN171.9.1.1.P.7
              page: 100
            - p: 8
              text: I have spoken with many church leaders who are afraid of the word
                vision, typically because they do not understand it or find the idea
                of setting a vision for a church intimidating. I frequently talk to
                leaders who tell me they are not sure how to even find a vision, so
                I like to help demystify the process of describing a vision.
              kind: prose
              UID: MIN171.9.1.1.P.8
            - p: 9
              text: I try to simplify it for them by asking, “What would your church
                look like if God was in charge and could do whatever He wanted to
                do?” Some miss the point and say He is already in charge, but if we
                are truly honest, we can admit there are things in every church God
                would like to work on.
              kind: prose
              UID: MIN171.9.1.1.P.9
              page: 101
            - p: 10
              text: Vision, very simply, is the skill of seeing what is not there.
              kind: prose
              UID: MIN171.9.1.1.P.10
            - p: 11
              text: 'How do we learn to do this? The only way to see what is not there
                is through the eyes of the Spirit. Casting a vision for your church
                is not about pulling visionary material out of yourself but about
                seeing what God is already dreaming for your church. I will give you
                a hint: God’s dream for your church always involves people.'
              kind: prose
              UID: MIN171.9.1.1.P.11
              page: 101
            citations:
            - citekey: covey1997
              pandoc: '[@covey1997, 103]'
              intext: (Covey et al. 1997, 103)
              page: '103'
              paragraph: MIN171.9.1.1.P.1
              UID: MIN171.9.1.1.C.1
            - citekey: marti2009
              pandoc: '[@marti2009, 78]'
              intext: (Marti 2009, 78)
              page: '78'
              paragraph: MIN171.9.1.1.P.4
              UID: MIN171.9.1.1.C.2
            interactive_questions:
            - p: 1
              text: What two questions are answered by vision?
              response: The questions are “Where are we going?” and “Why are we doing
                it?”
              UID: MIN171.9.1.1.IQ.1
            - p: 2
              text: In what way does vision invite criticism?
              response: Anytime a leader chooses a direction, someone will want to
                go another way.
              UID: MIN171.9.1.1.IQ.2
            - p: 3
              text: What role do you suppose the Holy Spirit will play in finding
                vision for your church?
              response: It is the Holy Spirit who will reveal God’s vision for the
                church; therefore, we must seek Him and the insight only He can provide.
              UID: MIN171.9.1.1.IQ.3
            last_modified: '2026-03-27'
            scripture:
            - intext: Proverbs 29:18
              version: KJV
              refs:
              - ref: Proverbs 29:18
                key: proverbs.29.18
                bib_gate: https://www.biblegateway.com/passage/?search=Proverbs%2029%3A18&version=KJV
              paragraph: MIN171.9.1.1.P.6
              UID: MIN171.9.1.1.S.1
            text: Describe what vision is and why it is crucial for the church.
            glossary: []
      - last_modified: '2026-03-27'
        title: See Vision by Looking at People
        subobjectives:
          9.2.1:
            body:
            - p: 1
              text: A friend of mine was a perfect example of a pastor intimidated
                by setting a vision for his church. He had just been selected as the
                new pastor, and he found out that on his sixth Sunday—the day of his
                official installation as pastor—the message would be in three parts.
                A retired minister and longtime member of the congregation would share
                for ten minutes, talking about where the church had been. Then the
                superintendent would take ten minutes to describe what the church
                should be, and after that the new pastor would share his vision for
                the church’s future.
              kind: prose
              UID: MIN171.9.2.1.P.1
              page: 101
            - p: 2
              text: Upon finding out the plan, my friend panicked—he did not have
                a hint of a vision for the church. He had barely unpacked his belongings
                and had met only a few members of the congregation in the short time
                he had been there! He began to pray, and his prayers became more desperate
                as the big day approached.
              kind: prose
              UID: MIN171.9.2.1.P.2
              page: 101
            - p: 3
              text: On that day, my friend still had no idea what to share. The aged
                minister beautifully described the eight-decade history of the church,
                the superintendent masterfully explained the purpose and mission of
                the corporate church, and my friend walked up to the pulpit still
                clueless about what to say.
              kind: prose
              UID: MIN171.9.2.1.P.3
              page: 101
            - p: 4
              text: He stood there awkwardly for a few moments before suddenly catching
                sight of the smiling face of a seven-year-old girl he had met earlier,
                Amanda. He stepped down off the platform and walked to where she was
                sitting with her parents. Without really knowing what he was doing,
                he asked her to stand up and began to talk to her. He told her what
                he wanted to see happen in her life because she was a part of this
                church family. He said he wanted her to grow up to be a great woman
                of God, and always to know her church family loved her. He wanted
                her to feel she always belonged and someday meet the godly young man
                with whom she could spend the rest of her life there in that church.
                When he sat her back down, her mother and many others were wiping
                away tears.
              kind: prose
              UID: MIN171.9.2.1.P.4
              page: 101
            - p: 5
              text: My friend then had a young military man stand up and told him
                what he would find because he was part of the church. He said he hoped
                the young man would always feel welcome, would be a godly example,
                and that he and his fiancée would get married and see their dreams
                come to fruition there in that church. My friend spoke similarly to
                a young couple, then to a single mom and her children. He concluded
                by speaking to an elderly widower on the second row.
              kind: prose
              UID: MIN171.9.2.1.P.5
              page: 102
            - p: 6
              text: My friend later confessed that throughout all this, he did not
                understand what was happening—until the aged minister was hugging
                him with tears in his eyes and the superintendent was vigorously shaking
                his hand and congratulating him on “the best vision I have ever heard.”
              kind: prose
              UID: MIN171.9.2.1.P.6
              page: 102
            - p: 7
              text: 'Repeated over and over with each person was a similar refrain
                that someone actually had to point out to my friend: “You said you
                wanted each of them to know that they belonged here. That is the only
                thing you repeated, and you said that to each of them.”'
              kind: prose
              UID: MIN171.9.2.1.P.7
              page: 102
            - p: 8
              text: 'Over the next few years, a clear vision for the church emerged:
                It would be a place of belonging where people could wrap their arms
                around anyone, connect with them, help them, and always make them
                feel welcome—no matter the choices they had made or the lives they
                had lived. It would be a place where “belonging is the beginning of
                believing and becoming,” as they put it.'
              kind: prose
              UID: MIN171.9.2.1.P.8
              page: 102
            - p: 9
              text: My friend learned that fateful Sunday that you cannot find God’s
                vision for your life or your church until you look at people. For
                you see, they are what God is looking at!
              kind: prose
              UID: MIN171.9.2.1.P.9
              page: 102
            - p: 10
              text: Vision is not buildings, plans, or numbers. It is not about programs
                or ministry tools. Vision is about being the kind of people and the
                kind of church God wants us to be.
              kind: prose
              UID: MIN171.9.2.1.P.10
              page: 102
            - p: 11
              text: The Amanda Game
              kind: heading
              UID: MIN171.9.2.1.P.11
              page: 102
            - p: 12
              text: After telling this story, we like to play what we call the Amanda
                Game at our Acts 2 Journeys. We basically do what my friend did for
                Amanda; we ask a table full of leaders from a church to each take
                a turn speaking vision to a designated “Amanda” at the table. Each
                person in the room may take thirty seconds or a few minutes to share
                their hopes for their “Amanda’s” future.
              kind: prose
              UID: MIN171.9.2.1.P.12
              page: 102
            - p: 13
              text: 'Of course, the real value of the game is not the exercise during
                the Journey but implementing it when the participants return to their
                churches. We give them an assignment: Play the Amanda Game in your
                heads at your churches. We urge them to let their thoughts begin to
                flow for people they do not even know and then gather the leadership
                team to share the results of the exercise.'
              kind: prose
              UID: MIN171.9.2.1.P.13
            - p: 14
              text: We urge them not to limit this undercover vision-casting to Sundays
                at church but to make the exercise a chance to move their focus outward—for
                people in their community, and then to share their vision for their
                communities. Imagine how powerful your vision can become when a team
                of like-minded leaders is vision-casting for an entire community!
              kind: prose
              UID: MIN171.9.2.1.P.14
              page: 103
            - p: 15
              text: We urge the church leaders to understand that these are not just
                their own “nice thoughts” for people. The visions the teams share
                are pieces of God’s vision for their church and community!
              kind: prose
              UID: MIN171.9.2.1.P.15
              page: 103
            - p: 16
              text: This is the secret to vision. It is not just our own dreams and
                ambitions for our church and community. True vision is God’s vision
                for our churches, our neighborhoods, and our cities. He puts these
                things on our hearts when we train ourselves to listen. It is already
                there, but we must mine it out.
              kind: prose
              UID: MIN171.9.2.1.P.16
              page: 103
            - p: 17
              text: Ask yourself right now what you would say to your “Amandas.” Start
                playing the Amanda Game with people you see in your church and people
                you pass in your everyday life—the single mom at the grocery store,
                the pierced barista at the coffee shop, the homeless man on the corner
                with his cardboard sign.
              kind: prose
              UID: MIN171.9.2.1.P.17
              page: 103
            - p: 18
              text: What is God’s vision for these people? Mine it out of your spirit
                and then continue this practice every day. Play the game with your
                fellow church leaders and then compare notes. When you look at the
                commonalities, you will begin to see a vision take shape.
              kind: prose
              UID: MIN171.9.2.1.P.18
              page: 103
            - p: 19
              text: Do not be discouraged or intimidated by setting a vision for your
                church. Vision is not a scary word. It is not ill-defined and vaporous,
                hard to grasp, and easy to lose. It is not something to go find; it
                is something we discover in our spirits. It is in the heart of God.
                He offers it to your spirit through His Spirit, and He is waiting
                for you to draw it out and act on it.
              kind: prose
              UID: MIN171.9.2.1.P.19
              page: 103
            - p: 20
              text: As a side note, little seven-year-old Amanda has since graduated
                from high school as her class’s valedictorian and is in medical school.
                At her speech to her graduating class, she shared many of the same
                things that my friend said to her that Sunday. The funny thing is
                that since she was only seven years old at the time, she cannot remember
                what he actually said—she only remembers standing up on a chair.
              kind: prose
              UID: MIN171.9.2.1.P.20
              page: 103
            - p: 21
              text: Yet at her speech, she unconsciously repeated the fulfillment
                of nearly everything in the vision he cast over her that day. That
                vision by her worried, over-awed pastor has proven to be from the
                heart of God for her. What lives will you speak vision into today?
              kind: prose
              UID: MIN171.9.2.1.P.21
            - p: 22
              text: 'People: Obstacles or Assets?'
              kind: heading
              UID: MIN171.9.2.1.P.22
              page: 104
            - p: 23
              text: We have no single right way to develop or lead a church. If God
                takes a person and knits his or her heart together with a congregation,
                and they work together on a common goal built on a shared vision and
                inspired by the Spirit, that church is going to thrive. It does not
                need to look like any other church in the area. If the leader God
                has raised up and the people are together, a church can have an amazing
                impact. This is the power of sharing the glimpses of God’s heart that
                you and your ministry team receive from playing the Amanda Game.
              kind: prose
              UID: MIN171.9.2.1.P.23
              page: 104
            - p: 24
              text: 'But we must ask this question: If our impact is less than we
                dreamed it would be, does our vision need to be recharged? It may
                need fresh life. After all, if a vision is our current understanding
                of God’s preferred future but our vision is old and outdated, it is
                no longer current, is it?'
              kind: prose
              UID: MIN171.9.2.1.P.24
              page: 104
            - p: 25
              text: As we endeavor to execute a vision for ourselves or for a body
                of believers, we will face many challenges, any of which can derail
                or delay the vision. For better or worse, though it takes a group
                to pursue a corporate vision, the people within that group can be
                some of the biggest obstacles to achieving the vision. They can also
                be the biggest catalysts for achieving God’s vision.
              kind: prose
              UID: MIN171.9.2.1.P.25
              page: 104
            - p: 26
              text: Everyone who has tried to lead nearly anyone to do almost anything
                knows that people will not always share your vision for your church.
                And when they do not, it can be trouble.
              kind: prose
              UID: MIN171.9.2.1.P.26
              page: 104
            interactive_questions:
            - p: 1
              text: How did the pastor from the story tap into God’s vision for the
                church?
              response: He focused on God’s vision for individuals in relation to
                that specific church.
              UID: MIN171.9.2.1.IQ.1
            - p: 2
              text: What is vision?
              response: Vision is about desiring to be the kind of people and the
                kind of church God wants us to be.
              UID: MIN171.9.2.1.IQ.2
            - p: 3
              text: Why is it wise to seek God’s vision for the community as well
                as for the church?
              response: God has dreams and visions for people’s lives in the community,
                and the church can tap into that vision in order to minister to them.
              UID: MIN171.9.2.1.IQ.3
            - p: 4
              text: Where is vision to be found?
              response: God has likely already placed His vision in our hearts. After
                all, He has purposefully brought us together, filled us with His Spirit,
                and aimed us into the community around us.
              UID: MIN171.9.2.1.IQ.4
            - p: 5
              text: What elements, working together, allow a local church to thrive?
              response: A pastor, a congregation, working together on a common goal,
                a shared vision, inspired by the Holy Spirit will allow the church
                to thrive.
              UID: MIN171.9.2.1.IQ.5
            last_modified: '2026-03-27'
            text: Describe how vision can be found by focusing our eyes on the people
              in our church and community.
            glossary: []
      - last_modified: '2026-03-27'
        title: Developing a God-Inspired Vision
        subobjectives:
          9.3.1:
            body:
            - p: 1
              text: God’s vision for the church is always about people. It is not
                about buildings, programs, or initiatives.
              kind: prose
              UID: MIN171.9.3.1.P.1
              page: 104
            - p: 2
              text: I like to ask people what they would want their church to be if
                failure were not a factor. Most of the time, church leaders respond
                with programs, but a program is not a vision. Other times, people
                respond by giving me a slogan. A vision is not a slogan.
              kind: prose
              UID: MIN171.9.3.1.P.2
              page: 104
            - p: 3
              text: 'A vision catches God’s dream for your church; this means that
                writing a good one must include the church’s universal mission and
                the five functions God gave the first-century church. As you learn
                more about each of these in the following chapters, keep this in mind:
                You will be casting vision for each of the functions, and they are
                not multiple choice. A full vision for your church will incorporate
                love for God and love for others, and it will be lived out in the
                five functions: connect, grow, serve, go, and worship.'
              kind: prose
              UID: MIN171.9.3.1.P.3
              page: 104
            - p: 4
              text: Your vision statement is your chance to define your church, but
                be aware that you may get exactly what you ask for! For example, a
                church with compassionate leaders had a vision to care for hurting
                people. They became a magnet for the broken and the brokenhearted,
                and many people received love and practical care. However, the church
                did not have a clear vision to help these people grow to maturity
                and serve others. Soon the pastors and other leaders felt overwhelmed
                with all the needs! The church was wonderfully successful in connecting
                with hurting people, but they struggled with the other functions of
                a thriving church.
              kind: prose
              UID: MIN171.9.3.1.P.4
            - p: 5
              text: Are You Willing to Change Your Reality?
              kind: heading
              UID: MIN171.9.3.1.P.5
              page: 105
            - p: 6
              text: As we seek to develop God-inspired vision, we must recognize a
                few things that can prevent us from seeing possibilities and opportunities.
                These “blinders” may include denial, complacency, past successes,
                past failures, personal agendas, and generalized assumptions or preconceptions.
                A church that has had financial problems but is finally secure may
                be hesitant to take financial risks. A pastor who is an outstanding
                teacher may rely on his ability to draw a crowd instead of building
                a great team of leaders and volunteers. A church that has just gone
                through a building campaign may be too exhausted to do anything but
                rest for a season. In these and many other instances, people can lose
                their vision to do what God has called them to do.
              kind: prose
              UID: MIN171.9.3.1.P.6
              page: 105
            - p: 7
              text: The Acts 2 process is partly about eliminating these blinders.
                This is why honesty in the assessment phase and being Spirit-led are
                critical to effectiveness. Quite frankly, it is a large part of why
                we need a process in the first place and why we put such an emphasis
                at the beginning of the book on being willing to change.
              kind: prose
              UID: MIN171.9.3.1.P.7
              page: 105
            - p: 8
              text: We must exchange blinders for spiritual lenses because how we
                perceive things shapes our current reality. Learning to look at life
                and change in the light of God’s Word will help us see what God has
                purposed for us. Learning to listen to Him through His Word, the witness
                of the Holy Spirit, and godly counsel will help us discern His vision.
              kind: prose
              UID: MIN171.9.3.1.P.8
              page: 105
            - p: 9
              text: It is essential to note that a God-inspired vision does not ignore
                truth or reality. We must be willing to honestly assess circumstances
                in order to bridge the gap between the present reality and the future
                possibilities of our vision.
              kind: prose
              UID: MIN171.9.3.1.P.9
              page: 105
            - p: 10
              text: A vision is our current understanding of God’s preferred future,
                and that future is all about people. It does not ignore reality; it
                changes reality for those who are touched by the vision. Those same
                people can be the single biggest obstacle to the vision, but they
                are also its greatest assets.
              kind: prose
              UID: MIN171.9.3.1.P.10
              page: 105
            - p: 11
              text: 'The questions for each of us are twofold: “Are we willing to
                love and pray for those who resist vision, asking God to turn them
                from our greatest hindrances into our greatest allies?” and “Will
                we cast a vision they can buy into and become a part of?”'
              kind: prose
              UID: MIN171.9.3.1.P.11
              page: 106
            - p: 12
              text: If we will, we can enable people to become empowered disciples
                who carry out the church’s mission and God’s vision on the earth.
              kind: prose
              UID: MIN171.9.3.1.P.12
              page: 106
            interactive_questions:
            - p: 1
              text: Why should each of the five functions be considered when defining
                vision?
              response: They represent our full assignment and work as a congregation.
                None can be overlooked as we pursue God’s plan for our church.
              UID: MIN171.9.3.1.IQ.1
            - p: 2
              text: Why should our vision ask, “Why aren’t we there already?"
              response: This question will help us recognize blinders or other things
                that are currently hindering us from being the church we believe God
                wants us to be.
              UID: MIN171.9.3.1.IQ.2
            - p: 3
              text: Develop a vision statement. If you are a church leader, prepare
                a vision statement for the congregation or ministry that you lead.
                If you are not a church leader, write a vision statement that captures
                your desire for the Church and your heart for people.
              response: Core Values 10 CHAPTER
              UID: MIN171.9.3.1.IQ.3
            last_modified: '2026-03-27'
            scripture:
            - intext: Acts 2
              version: NIV
              refs:
              - ref: Acts 2
                key: acts.2
                bib_gate: https://www.biblegateway.com/passage/?search=Acts%202&version=NIV
              paragraph: MIN171.9.3.1.P.7
              UID: MIN171.9.3.1.S.1
            text: Identify the key components for developing a God-inspired vision.
            glossary: []
    - last_modified: '2026-03-27'
      title: 10 - Core Values
      print_page: 1
      lessons:
      - last_modified: '2026-03-27'
        title: The Purpose of Core Values
        subobjectives:
          10.1.1:
            body:
            - p: 1
              text: A church’s set of core values gives its members a sense of direction
                and awareness of what matters most to their church. The values drive
                priorities; shape behaviors, attitudes, and actions; direct processes;
                govern relationships; and articulate what the church stands for. More
                than mission or vision, core values tell those inside and outside
                the congregation what is distinctive and foremost about that church.
              kind: prose
              UID: MIN171.10.1.1.P.1
              page: 110
            - p: 2
              text: Churches focus their energies on their core values because these
                are most dear to their calling and vision. Similarly, values establish
                priorities for how churches go about ministering to people.
              kind: prose
              UID: MIN171.10.1.1.P.2
              page: 110
            - p: 3
              text: 'In Ministry Nuts and Bolts (2009), Aubrey Malphurs expands this
                idea by making this observation:'
              kind: prose
              UID: MIN171.10.1.1.P.3
              page: 110
            - p: 4
              text: Core values are fundamental to all that the organization does.
                They are ministry defining and have everything to do with a ministry’s
                distinctiveness. They are what distinguishes one ministry from another,
                and they explain why some people are attracted to your church while
                others are repelled. (17)
              kind: quote
              UID: MIN171.10.1.1.P.4
            - p: 5
              text: Previously, we mentioned how the power of togetherness begins
                with just one individual. Interestingly, values help determine when
                a person will buy into a vision and get involved. Malphurs goes on
                to say that values “dictate personal involvement. If an individual’s
                core values align with the ministry’s core values, that individual
                is more likely to invest his or her life in that ministry.”
              kind: prose
              UID: MIN171.10.1.1.P.5
            - p: 6
              text: Our core values are those things we believe are paramount and
                that we demonstrate in our behaviors. When a congregation truly buys
                in, the people will live out a church’s core values in their daily
                lives. It is not enough to state values; our true priorities are those
                things we both speak and live.
              kind: prose
              UID: MIN171.10.1.1.P.6
              page: 110
            - p: 7
              text: 'Every church has the ability to cast vision, but if the values
                cannot support the vision or are not being lived, that vision will
                fail. Eventually, the church will create another vision statement,
                but without strong values they will not fulfill this vision either
                because they have not learned a key lesson: How we act determines
                where we go.'
              kind: prose
              UID: MIN171.10.1.1.P.7
              page: 110
            - p: 8
              text: Doers of the Word
              kind: heading
              UID: MIN171.10.1.1.P.8
              page: 110
            - p: 9
              text: 'While each church establishes its identity through its unique
                combination of core values, some values are nonnegotiable parts of
                the biblical Acts 2 model. We must never abandon our foundational
                doctrines. As some denominations and ministers in our nation are challenging
                bedrock principles, we must reaffirm our commitment to core biblical
                principles: We are committed to fulfill the Great Commission and the
                Great Commandment, and that is completely and thoroughly Pentecostal.'
              kind: prose
              UID: MIN171.10.1.1.P.9
              page: 110
            - p: 10
              text: This includes but covers more than just a style of worship—it
                is about the gifts of the Spirit disseminated at Pentecost. Those
                gifts are wonderful, necessary, and biblical. But so is Pentecostal
                fruit—love, joy, peace, forbearance, kindness, goodness, faithfulness,
                gentleness, and self-control. A church must be empowered and anointed
                if we expect individuals to be. We must never depend on programs,
                plans, and procedures alone but on the power of the Holy Spirit. As
                leaders, we can model incorporating the supernatural with the pragmatic.
              kind: prose
              UID: MIN171.10.1.1.P.10
              page: 111
            - p: 11
              text: If we are truly people of the Book, we must be doers of the Word
                as well as hearers. This does not just include the popular, socially
                acceptable gospel. It also means we tackle the difficult issues and
                the controversial standards—with love and grace but firmly and unequivocally.
                While some who have walked away from their traditional values discount
                or cover up the sins of the flesh, we keep in mind that sins of the
                spirit can be just as destructive, if not more so. David’s adultery
                with Bathsheba and the subsequent murder of her husband were horrendous
                sins, but the consequences of those sins pale in comparison to the
                consequences of his pride when he numbered the people to feed his
                own ego. Seventy thousand people died because of that pride, and we
                must be just as quick to embrace repentance and restorative healing
                for the oftentimes less obvious sins of the spirit as we are for the
                more blatant sins of the flesh.
              kind: prose
              UID: MIN171.10.1.1.P.11
              page: 111
            - p: 12
              text: We must not allow people who embrace an unrepentant lifestyle
                of pride, jealousy, and gossip to destroy our churches. Insidious,
                undermining issues like mean-spiritedness, divisiveness, and protracted
                and unrepentant anger have no place in our congregations or in our
                pulpits. Conversely, our demonstrations of grace, mercy, and repentance
                show people that we understand human frailties and our focus is on
                restoration, not finger-pointing.
              kind: prose
              UID: MIN171.10.1.1.P.12
              page: 111
            - p: 13
              text: We carry a particular burden to model this as leaders because
                our own failings can be magnified in the pulpit. We may teach what
                we know, but we will reproduce who we are.
              kind: prose
              UID: MIN171.10.1.1.P.13
              page: 111
            - p: 14
              text: Relationships Make Us Better
              kind: heading
              UID: MIN171.10.1.1.P.14
              page: 111
            - p: 15
              text: We have spent considerable time talking about the relational component
                of truth, and I believe it is essential that our churches embrace
                relational vitality. Relationship is not only a key to reaching Millennials
                and future generations; it is also a vital component for building
                agreement within churches and between denominations. We may never
                totally agree on everything stylistically, but we can embrace the
                spirit of agreement. It is possible for us to disagree about nonessential
                components—without becoming disagreeable! All Christians are part
                of one big family.
              kind: prose
              UID: MIN171.10.1.1.P.15
              page: 111
            - p: 16
              text: We must desire to make one another better, to be resources for
                one another instead of impediments. Recent statistics show that an
                increasing number of pastors do not feel they have friends with whom
                they can talk freely and share their deepest concerns, fears, or temptations.
                This type of isolation sets pastors up for potential failure. What
                would happen if we embraced the core value of open, vital relationships
                that build bridges instead of erect walls?
              kind: prose
              UID: MIN171.10.1.1.P.16
              page: 112
            citations:
            - citekey: malphurs2009
              pandoc: '[@malphurs2009]'
              intext: (Malphurs 2009)
              paragraph: MIN171.10.1.1.P.3
              UID: MIN171.10.1.1.C.1
            interactive_questions:
            - p: 1
              text: In what ways are core values key to people connecting with a church?
              response: Core values reveal the priorities of a local church and are
                necessary to pursuing the church’s vision. As such, people will find
                that they “fit” here because their own hearts are aligned with the
                vision and the values.
              UID: MIN171.10.1.1.IQ.1
            - p: 2
              text: What values are essential to all Spirit-empowered churches?
              response: Every Spirit-empowered church must be committed to biblical
                truth, to fulfilling the Great Commission and Great Commandment, and
                to be thoroughly Pentecostal.
              UID: MIN171.10.1.1.IQ.2
            - p: 3
              text: What sort of people must we guard against if we want to maintain
                biblical values?
              response: We must respond appropriately to those who embrace an unrepentant
                lifestyle, jealousy, gossiping, mean-spiritedness, divisiveness, and
                protracted, unrepentant anger.
              UID: MIN171.10.1.1.IQ.3
            last_modified: '2026-03-27'
            scripture:
            - intext: Acts 2
              version: NIV
              refs:
              - ref: Acts 2
                key: acts.2
                bib_gate: https://www.biblegateway.com/passage/?search=Acts%202&version=NIV
              paragraph: MIN171.10.1.1.P.9
              UID: MIN171.10.1.1.S.1
            text: Define core values and explain their contribution to the pursuit
              of vision.
            glossary: []
      - last_modified: '2026-03-27'
        title: Discovering Your Core Values
        subobjectives:
          10.2.1:
            body:
            - p: 1
              text: In the Acts 2 Journey, we walk church leaders through the process
                of developing their core values. Remember, core values are your church’s
                identity, so it is essential to take the time to pick four or five
                beliefs or principles that your church strongly embraces.
              kind: prose
              UID: MIN171.10.2.1.P.1
              page: 112
            - p: 2
              text: Next, list the top six to eight greatest strengths of your church.
                What related behaviors make these things strengths? The idea is to
                find the values a church holds based on behavior. When you have a
                list of values, strengths, and behaviors, you have the basic components
                to discover your church’s core values.
              kind: prose
              UID: MIN171.10.2.1.P.2
              page: 112
            - p: 3
              text: Church leaders will tell us what their core values are, such as
                being missions-oriented or Spirit-empowered, winning souls or pursuing
                transparency and accountability. They may tell us how much they give
                to missions or the emphasis they put on teaching new believers about
                the baptism of the Holy Spirit.
              kind: prose
              UID: MIN171.10.2.1.P.3
              page: 112
            - p: 4
              text: We then challenge them to give examples of behaviors in their
                churches that are holding them back from maximizing these strengths.
                It is one thing to determine what you think your church is about;
                it is another entirely to identify the changes necessary to go from
                where you are to where you want to be.
              kind: prose
              UID: MIN171.10.2.1.P.4
              page: 112
            - p: 5
              text: After leaders have identified the unhealthy behaviors, we ask
                them to discuss behaviors they would like to embrace in the future.
                When they have defined these behaviors, they have a clearer picture
                not only of where their church is but what is holding them back and
                where they would like to go in the future. The results of these three
                exercises form the genesis of a core value statement.
              kind: prose
              UID: MIN171.10.2.1.P.5
              page: 112
            - p: 6
              text: Write Your Values
              kind: heading
              UID: MIN171.10.2.1.P.6
              page: 112
            - p: 7
              text: It is a powerful technique to write out your values over the course
                of multiple retreats with a dream team of church leaders, and I encourage
                you to do this exercise—together with other leaders from your church
                if possible—as you read this book. Take a few moments to jot down
                some current strengths of your church, and then ask yourself what
                behaviors make these things strengths for the church you lead. Write
                down the behaviors that are holding your church back, and then list
                some behaviors you would like to embrace moving forward.
              kind: prose
              UID: MIN171.10.2.1.P.7
              page: 112
            - p: 8
              text: As you write, the core values of your church will emerge. Like
                me, you may have subconsciously known what takes shape on the page.
                However, what I lacked was the process.
              kind: prose
              UID: MIN171.10.2.1.P.8
              page: 113
            - p: 9
              text: It is not enough to be aware of core values subconsciously. If
                you want them to help your church stand for something, you must write
                them down and help others to grasp them.
              kind: prose
              UID: MIN171.10.2.1.P.9
              page: 113
            - p: 10
              text: 'What you write may look something like this: “We desire to be
                a learning church, a loving church, a praying church, a humble church,
                a supernatural church, a unified church, a generous church, a committed
                church, a fun church, a worshipping church, an influential church,
                and an outward-focused church.”'
              kind: prose
              UID: MIN171.10.2.1.P.10
              page: 113
            - p: 11
              text: Whatever your church’s core values are, their unique shape and
                priority are what give your church its individual identity. When you
                become more aware of them and actively embrace them, you give your
                priesthood of believers a church identity they can truly embrace and
                own.
              kind: prose
              UID: MIN171.10.2.1.P.11
              page: 113
            - p: 12
              text: A church without core values can be influenced by the loudest
                voices and will try to be all things to all people, but this is a
                recipe for being too spread out and scattered to be truly effective.
                Your church will continually be presented with opportunities. People
                will present you with causes and ways to spend your money and your
                time. If you have not identified your core values, these people will
                get you off track with all manner of things.
              kind: prose
              UID: MIN171.10.2.1.P.12
              page: 113
            - p: 13
              text: Your core values will dictate how you spend your time, ministry
                resources, and money. With clearly defined values you will know precisely
                what the highest priorities are to your church.
              kind: prose
              UID: MIN171.10.2.1.P.13
              page: 113
            - p: 14
              text: The fact is that nearly every church has core values. However,
                many have not written them down, although this simple process is extremely
                valuable.
              kind: prose
              UID: MIN171.10.2.1.P.14
              page: 113
            - p: 15
              text: Remember that your vision for your church will only be as strong
                as the values that support it. A train can only go as fast as the
                tracks will permit it, and a river is only as powerful as the banks
                that contain it. When a train goes too fast for its tracks, it derails;
                when a river overflows its banks, the surrounding land floods. The
                behaviors your church practices must be able to support the vision
                you cast or the results will end in disaster.
              kind: prose
              UID: MIN171.10.2.1.P.15
              page: 113
            - p: 16
              text: We see the same principle in a leader’s character—if the flaws
                in a person’s character undermine their ministry, it shows that they
                are not maturing spiritually. The values revealed by your church’s
                behaviors illustrate your potential.
              kind: prose
              UID: MIN171.10.2.1.P.16
              page: 113
            - p: 17
              text: Do not underestimate how fundamental this is. Grasping your core
                values does not block you in or put limits on you. Values show you
                the path forward to fulfill your vision; but if you do not create
                specific core values, this will sabotage the rest of your process.
              kind: prose
              UID: MIN171.10.2.1.P.17
              page: 114
            - p: 18
              text: Confusion Leads to Conflict
              kind: heading
              UID: MIN171.10.2.1.P.18
              page: 114
            - p: 19
              text: We have seen many leaders become confused about their core values.
                It is not unusual for a church to confuse core values with ministry
                models, programs, traditions, and practices.
              kind: prose
              UID: MIN171.10.2.1.P.19
              page: 114
            - p: 20
              text: For instance, a church may say, “We value small groups,” but they
                may not recognize that groups are a ministry model, not a core value.
                While ministry models can provide a cohesive approach to ministry,
                putting too much emphasis on the model can lock the congregation into
                a model even as the real value ebbs away.
              kind: prose
              UID: MIN171.10.2.1.P.20
              page: 114
            - p: 21
              text: It is necessary to reassess periodically what made a ministry
                model valuable. We must ask what made it part of the church’s DNA
                in the first place and question honestly whether or not that is still
                the case. When you answer these questions, you can rediscover the
                core values behind ministry models.
              kind: prose
              UID: MIN171.10.2.1.P.21
              page: 114
            - p: 22
              text: Successful programs often end up on a church’s list of core values
                as well. However, programs exist for a purpose, and if we examine
                that purpose, the core value is often underneath. The church may say,
                “We value Royal Rangers,” when the real reason they chose to implement
                the program was to minister to the next generation of young men in
                the congregation. We must be careful that our values focus on why
                we do what we do, not on the method or program itself.
              kind: prose
              UID: MIN171.10.2.1.P.22
              page: 114
            - p: 23
              text: While most churches would not list a tradition as a core value,
                a church’s behavior can clearly demonstrate this perspective. A church
                might say they never deviate from their service order, thinking consistency
                demonstrates a cherished value. But when we continue patterns without
                purpose, those traditions have overtaken our values. Such a condition
                will not let a church respond effectively to changing needs. Questioning
                traditions--whether they have outlived their purpose and are limiting
                the church’s ability to meet changing needs--helps us remove them
                from the altar and replace them with more responsive value systems.
              kind: prose
              UID: MIN171.10.2.1.P.23
              page: 114
            - p: 24
              text: 'Interactive Question #7 : What types of things are often confused
                with core values?'
              kind: prose
              UID: MIN171.10.2.1.P.24
              page: 114
            - p: 25
              text: Church practices communicate what we value but are not intrinsically
                core values. Healthy churches are intentional about living true values
                and making ministry adjustments to fit those values rather than making
                their values fit their practices.
              kind: prose
              UID: MIN171.10.2.1.P.25
              page: 114
            interactive_questions:
            - p: 1
              text: What are the three exercises that form the genesis of a core values
                statement?
              response: 'Here are the three exercises: (1) List the top six to eight
                strengths of your church; (2) Give examples of behaviors in the church
                that are holding it back from maximizing these strengths; (3) Describe
                behaviors you would like to embrace in the future.'
              UID: MIN171.10.2.1.IQ.1
            - p: 2
              text: What tends to happen if a church does not clearly identify its
                core values?
              response: The church gets sidetracked by a multitude of options that
                are vying for attention. This can keep the church from fulfilling
                God’s purposes and vision.
              UID: MIN171.10.2.1.IQ.2
            - p: 3
              text: What do core values represent in relation to vision?
              response: Core values show you the path forward to fulfill your vision.
              UID: MIN171.10.2.1.IQ.3
            last_modified: '2026-03-27'
            text: Describe a process for identifying your core values.
            glossary: []
      - last_modified: '2026-03-27'
        title: Core Values vs. Personal Preference
        subobjectives:
          10.3.1:
            body:
            - p: 1
              text: A friend of mine pastored a church that had signs in the front
                of the parking lot reserving certain parking spots for senior adults.
                Additional signs in the auditorium signaled that the front row of
                chairs was reserved for seniors.
              kind: prose
              UID: MIN171.10.3.1.P.1
              page: 115
            - p: 2
              text: My friend was a relatively new pastor at this church, and one
                night at a meeting of deacons, one of the older church leaders passionately
                shared his heart to reach young people. He was a high school teacher,
                and God moved his heart as he saw students every day in the hallway.
                “Pastor, we have got to find a way to reach kids,” he said with deep
                conviction.
              kind: prose
              UID: MIN171.10.3.1.P.2
              page: 115
            - p: 3
              text: Toward the end of the meeting, my pastor friend asked if there
                was anything else for the group to discuss. The man who was so passionate
                about teenagers spoke up and said that there was a problem.
              kind: prose
              UID: MIN171.10.3.1.P.3
              page: 115
            - p: 4
              text: “Some of our teenagers are sitting in the front seats that are
                reserved for senior adults, and we need to do something about that,”
                the man said.
              kind: prose
              UID: MIN171.10.3.1.P.4
              page: 115
            - p: 5
              text: No one said anything for a time, but while my friend did not want
                to offend this elder, he felt he needed to point out the obvious.
                The pastor said, “You know, in every church where I have been in the
                past, we thought it was a good thing that the teenagers sat in the
                front row.”
              kind: prose
              UID: MIN171.10.3.1.P.5
              page: 115
            - p: 6
              text: The man actually got up and walked out of the room. The rest of
                the people in the meeting sat around looking at one another for a
                few moments before wrapping up the final few pieces of business.
              kind: prose
              UID: MIN171.10.3.1.P.6
              page: 115
            - p: 7
              text: About five minutes later, the man came back in—carrying all the
                plastic signs from the chairs. He tossed them in the trash can and
                looked at the pastor. “You do not know where those went,” he said
                with a smile.
              kind: prose
              UID: MIN171.10.3.1.P.7
              page: 115
            - p: 8
              text: 'Sometimes, what we are passionate about is not what people see.
                That church was undergoing a transition: They were passionate about
                reaching young people, but their signals sent a message to young visitors
                that the focus was on seniors, not youth. The church kept its parking
                lot signs because it was interested in honoring older believers, but
                their tradition needed to catch up with their core values.'
              kind: prose
              UID: MIN171.10.3.1.P.8
              page: 115
            - p: 9
              text: Sometimes, what seems like a core value may actually be something
                completely different—a personal preference or “conviction.” While
                people in our churches do not typically think in terms of core values,
                they definitely understand convictions. True biblical convictions
                are boundaries for our core values that are created by Scripture and
                directed by the Holy Spirit.
              kind: prose
              UID: MIN171.10.3.1.P.9
              page: 115
            - p: 10
              text: However, it is possible for core values to be disconnected or
                wrongly derived from Scripture, and in these cases, unhealthy convictions
                can take over. These convictions are not as connected to the Holy
                Spirit as we may suppose, and they often stem from personal issues
                and wounds masked as personal convictions. When leaders fail to discern
                the differences between biblical convictions and personal convictions,
                dominant voices (or silent influencers) can redirect a church’s vision
                and move it in unhealthy directions.
              kind: prose
              UID: MIN171.10.3.1.P.10
              page: 115
            - p: 11
              text: Biblical absolutes, community standards, and personal convictions
                are all subject to scriptural directives and should supplant personal
                beliefs and behaviors. However, when churches do not operate with
                strong, established core values, people within the church can easily
                substitute their personal preferences and convictions. These beliefs
                are deeply ingrained and develop over a person’s lifetime and Christian
                journey. They are rarely questioned, are unwritten, and are typically
                invisible until conflict arises with the church’s vision.
              kind: prose
              UID: MIN171.10.3.1.P.11
              page: 116
            - p: 12
              text: When personal preferences and convictions replace core values,
                a leader’s efforts often shift to focus on making people happy—and
                to giving in to what is unhealthy by allowing immature Christians
                to dictate the leadership direction of the church. Some examples of
                this may include a worship style, seasonal or calendar events, the
                role and authority of the pastor, leadership or control by certain
                individuals or families, and other minor theological positions.
              kind: prose
              UID: MIN171.10.3.1.P.12
              page: 116
            - p: 13
              text: I Just Came to Have Church
              kind: heading
              UID: MIN171.10.3.1.P.13
              page: 116
            - p: 14
              text: I told you in the beginning of this book that when I first went
                to First Assembly in North Little Rock, I had never done much “pastoring”—lots
                of preaching, but none of the pastoral duties that are so common.
                I had also never led a body of believers in more than a song.
              kind: prose
              UID: MIN171.10.3.1.P.14
              page: 116
            - p: 15
              text: When I arrived at First Assembly, they wanted to know if I was
                going to push for a building program. My answer was, “I did not come
                to build a building. I came to have church.”
              kind: prose
              UID: MIN171.10.3.1.P.15
              page: 116
            - p: 16
              text: The previous pastor had been there only a year before leaving.
                His predecessor had been there three years, and his predecessor had
                been there five years. This trend was alarming, and I was thirty-nine
                with no experience. I was not eager to dive into a building program
                with a plateaued church and uncertain footing, and I felt under a
                lot of pressure to make people happy. Different parties in the church
                tried to exert their influence, and I knew I had to resist the temptation
                to let their personal preferences set the church’s direction.
              kind: prose
              UID: MIN171.10.3.1.P.16
              page: 116
            - p: 17
              text: The pastor who had been there three years had talked the church
                into buying property—it passed by one vote—but the dissension from
                that never calmed down, and he did not survive. The next pastor did
                not like the property and wanted new property, but some of the congregants,
                who had not liked the property previously, now liked it and disliked
                him for wanting something new. Out he went as well.
              kind: prose
              UID: MIN171.10.3.1.P.17
              page: 116
            - p: 18
              text: I had walked into a mess!
              kind: prose
              UID: MIN171.10.3.1.P.18
            - p: 19
              text: However, the church soon began to grow. We moved to two services.
                The bottom line is that they talked me into moving forward with a
                new building.
              kind: prose
              UID: MIN171.10.3.1.P.19
              page: 116
            - p: 20
              text: Needless to say, some of the older congregants did not like the
                idea of change—especially the eldest living charter member whom we
                affectionately called, “Mamma Gregg.” She did not attend church often
                because she was frail, but she only lived a half block away in her
                little white frame house. Several of her friends lived close by in
                two high rise apartments designed for seniors.
              kind: prose
              UID: MIN171.10.3.1.P.20
            - p: 21
              text: I knew she was resistant, so I thought I would walk over and convince
                her. As I came in, she said, “Pastor, are you going to stay with us
                at our church, or are you going to go with them to that new church?”
              kind: prose
              UID: MIN171.10.3.1.P.21
              page: 117
            - p: 22
              text: “Mamma Gregg,” I said, “you know, there is only going to be one
                church. We are all going to go.”
              kind: prose
              UID: MIN171.10.3.1.P.22
              page: 117
            - p: 23
              text: “Oh, no,” she said, “you do not understand.” She looked at me
                firmly and said, “The glory resides at 22nd and Franklin.” (This was
                the location of the existing building.)
              kind: prose
              UID: MIN171.10.3.1.P.23
              page: 117
            - p: 24
              text: I tried to explain to her that this was not my vision—that the
                church had owned the property long before I got there—and that it
                was the church’s vision to move. She said, “You all may go, but some
                of us are not leaving. We are staying right here.”
              kind: prose
              UID: MIN171.10.3.1.P.24
              page: 117
            - p: 25
              text: 'I tried again: “Mamma Gregg, everybody is going to the new building.”'
              kind: prose
              UID: MIN171.10.3.1.P.25
            - p: 26
              text: She said, “Well, I just want to know, are you going to pastor
                them, or are you going to pastor us?”
              kind: prose
              UID: MIN171.10.3.1.P.26
            - p: 27
              text: We spoke back and forth like this for a time, and then she finally
                fixed me with her pale eyes and said, “You may go, and there may be
                a lot of people who go with you, but let me promise you one thing.
                When you get over there to that new building, ‘Icky-bod’ (this was
                how she pronounced Ichabod) (1 Samuel 4:21) is going to be writ on
                the door.”
              kind: prose
              UID: MIN171.10.3.1.P.27
              page: 117
            - p: 28
              text: How could I argue with the oldest living charter member? I left,
                frustrated and uncertain about how I could win her over—and how much
                influence she would have.
              kind: prose
              UID: MIN171.10.3.1.P.28
              page: 117
            - p: 29
              text: As I walked out with my youth pastor, Charlie, he asked, “Why
                didn’t you explain it to her?”
              kind: prose
              UID: MIN171.10.3.1.P.29
              page: 117
            - p: 30
              text: “Why don’t you go back in there and explain it to her?” I countered.
              kind: prose
              UID: MIN171.10.3.1.P.30
            - p: 31
              text: He wisely declined.
              kind: prose
              UID: MIN171.10.3.1.P.31
            - p: 32
              text: How was I going to lead this woman—and her sixty or so friends
                who felt the same way—to support the move to our new location? I did
                not want to argue with her, so I prayed instead.
              kind: prose
              UID: MIN171.10.3.1.P.32
            - p: 33
              text: Eventually, God gave me an idea. We had bought a big people mover—a
                van to help transport people the five miles to the new building—and
                we picked up a group of the older people from the retirement communities
                near the church and bought them dinner at a cafeteria. After the dinner,
                we took them over to the new site where all we had was a concrete
                slab. On that slab was a chalk outline.
              kind: prose
              UID: MIN171.10.3.1.P.33
              page: 117
            - p: 34
              text: It showed them where the classroom was for their Sunday school
                class. I talked to them about the church and the vision and I said,
                “Now, I cannot point out to you where my office is going to be. I
                do not even know exactly where the nursery is going to be or where
                the youth room is going to be. But I know where your classroom is
                going to be. It is right here.”
              kind: prose
              UID: MIN171.10.3.1.P.34
              page: 117
            - p: 35
              text: I worked to ease their fears and show them we would not leave
                them behind.
              kind: prose
              UID: MIN171.10.3.1.P.35
            - p: 36
              text: Construction on the new building was completed and the time to
                move arrived.
              kind: prose
              UID: MIN171.10.3.1.P.36
            - p: 37
              text: At the final service in the old building, Mamma Gregg made it
                to church. People had been getting up and saying how excited they
                were about the new location, and then Mamma Gregg appeared, wheeled
                to the front by her son, Paul.
              kind: prose
              UID: MIN171.10.3.1.P.37
            - p: 38
              text: She wanted to say something.
              kind: prose
              UID: MIN171.10.3.1.P.38
            - p: 39
              text: I was mortified. I was certain she was going to suck the joy out
                of the room by pronouncing that “Icky-bod” would be writ on the door.
                But I could not deny the eldest living charter member!
              kind: prose
              UID: MIN171.10.3.1.P.39
              page: 118
            - p: 40
              text: I walked over and handed her the mike. “Number one,” she said,
                just dragging it out, “always pay your tithe.” I wondered where that
                came from and clapped and cheered. But she had more to say. Dear Lord,
                here it comes, I thought. I could almost hear the drum roll before
                the firing squad.
              kind: prose
              UID: MIN171.10.3.1.P.40
              page: 118
            - p: 41
              text: Pausing for dramatic effect, she finally said, “Always follow
                our pastor wherever God leads him.”
              kind: prose
              UID: MIN171.10.3.1.P.41
              page: 118
            - p: 42
              text: She sealed the deal right there. The elderly people within her
                sphere of influence could have caused division within the church—and
                no doubt would have. It could have derailed the entire vision for
                the church. Instead, God turned that moment into a chance to unify
                our body behind a single vision going forward, and it was partly because
                one woman bought into it.
              kind: prose
              UID: MIN171.10.3.1.P.42
              page: 118
            - p: 43
              text: No matter how much you think people have disagreed with you and
                no matter how much you think they are trying to destroy the vision,
                sometimes it is not the vision but the price and the pace that frighten
                people or cause division.
              kind: prose
              UID: MIN171.10.3.1.P.43
              page: 118
            - p: 44
              text: Often, people are just afraid. They may want to buy into the vision
                but they are afraid it is going to cost them too much or is happening
                too fast. Mamma Gregg and other older saints were resistant to change
                because they did not know where it would leave them—and whether it
                would leave them out.
              kind: prose
              UID: MIN171.10.3.1.P.44
              page: 118
            - p: 45
              text: You cannot argue and rationalize with fear. With Mamma Gregg,
                I had to bring her friends around her to help her understand and accept
                the vision. I had to assure them that the pace and the price were
                going to be okay, and that they were not going to be left behind.
              kind: prose
              UID: MIN171.10.3.1.P.45
              page: 118
            - p: 46
              text: Mostly, though, I had to pray—because nothing short of the Holy
                Spirit was going to change that sister’s mind at her age!
              kind: prose
              UID: MIN171.10.3.1.P.46
              page: 118
            - p: 47
              text: The temptation to let their personal preferences set the direction
                of the church was strong in those early years, but I had to remain
                firm and cling to the vision God had given me for the church.
              kind: prose
              UID: MIN171.10.3.1.P.47
              page: 118
            - p: 48
              text: You will face people who want to influence the direction of the
                church, your decisions, and the church’s values. It is prudent to
                have a trusted team, co-ministers of the gospel, working beside you,
                but be wary of letting anyone overly influence you or the church.
              kind: prose
              UID: MIN171.10.3.1.P.48
              page: 118
            - p: 49
              text: Pastors have a responsibility to set down clear values for the
                rest of the church, and when combined with our universal mission and
                God’s vision for our churches, we can create church environments that
                foster ownership, discipleship, and growth.
              kind: prose
              UID: MIN171.10.3.1.P.49
              page: 118
            - p: 50
              text: Hopefully you took this opportunity to write down your church’s
                core values, because in the next chapter we will put your mission,
                vision, and core values together into a strategic plan to get your
                church from where it is to where you want it to be.
              kind: prose
              UID: MIN171.10.3.1.P.50
              page: 119
            interactive_questions:
            - p: 1
              text: How can unhealthy convictions replace biblical convictions?
              response: When core values are wrongly derived from Scripture or disconnected
                from Scripture, unhealthy convictions can take over.
              UID: MIN171.10.3.1.IQ.1
            - p: 2
              text: Why can personal preferences easily take priority over core values?
              response: Personal preferences are deeply ingrained and develop over
                a person’s lifetime and Christian journey. They are rarely questioned.
              UID: MIN171.10.3.1.IQ.2
            - p: 3
              text: How do core values, the biblical mission, and God-inspired vision
                work together?
              response: Together they create a church environment that fosters ownership,
                discipleship, and growth.
              UID: MIN171.10.3.1.IQ.3
            - p: 4
              text: Write a list of 5-7 core values that are essential to fulfilling
                the vision statement you wrote in Chapter 9, Question 11.
              response: UNIT 3
              UID: MIN171.10.3.1.IQ.4
            last_modified: '2026-03-27'
            scripture:
            - intext: 1 Samuel 4:21
              version: NIV
              refs:
              - ref: 1 Samuel 4:21
                key: 1samuel.4.21
                bib_gate: https://www.biblegateway.com/passage/?search=1%20Samuel%204%3A21&version=NIV
              paragraph: MIN171.10.3.1.P.27
              UID: MIN171.10.3.1.S.1
            text: Explain the difference between core values and personal preferences.
            glossary: []
    - last_modified: '2026-03-27'
      title: 11 - Balancing the Spiritual and the Strategic
      lessons:
      - last_modified: '2026-03-27'
        title: The Need for a Strategic Plan
        subobjectives:
          11.1.1:
            body:
            - p: 1
              text: We established that our mission is universal, we began to build
                a vision around people, and we identified the core values and behaviors
                that reflect those values. Now, it is time to put it all together
                into a strategic plan that will help you get from where you are (your
                values) to where you want to go (your vision).
              kind: prose
              UID: MIN171.11.1.1.P.1
              page: 126
            - p: 2
              text: Now we return to the five biblical functions of the first-century
                church. Described in detail in Acts 2:42–47, these functions form
                the pathway from values to vision. The five functions are actually
                a template you can use to develop a plan for your church, so consider
                this chapter a primer, introducing you to these functions as a way
                to help you discover God’s plan.
              kind: prose
              UID: MIN171.11.1.1.P.2
              page: 126
            - p: 3
              text: However, before we get into the functions, we must recognize that
                without Holy Spirit empowerment in our churches, the mission, vision,
                values, and plans merely amount to programs. Before we talk further
                about a strategy for building a plan from the five functions, it is
                vital to understand that any strategic plan finds its genesis in the
                inspiration of the Holy Spirit. We must focus first on becoming inspired
                (think about the indwelled disciples and Peter’s preaching on Pentecost)
                and reinvigorated—only then will we have the necessary power and perspective
                to implement any sort of strategy.
              kind: prose
              UID: MIN171.11.1.1.P.3
              page: 126
            - p: 4
              text: The odd thing is that in some churches, we see resistance to calls
                for revitalization while others resist the idea of planning. Some
                do not see the need for the work of the Holy Spirit or feel their
                churches have enough of the Spirit already, and others act like the
                Holy Spirit has no place in a planning meeting. The truth is that
                we need Him in every component of our lives and churches.
              kind: prose
              UID: MIN171.11.1.1.P.4
              page: 126
            - p: 5
              text: Every church can use more of the Spirit. Needing revitalization
                does not necessarily imply your church is dead and lifeless. Whatever
                the condition of our church, we can all cry with Isaiah,
              kind: prose
              UID: MIN171.11.1.1.P.5
              page: 126
            - p: 6
              text: Oh, that You would rend the heavens! That You would come down!
                That the mountains might shake at Your presence . . . to make Your
                name known to Your adversaries, that the nations may tremble at Your
                presence! When You did awesome things for which we did not look, You
                came down, the mountains shook at Your presence. (Isaiah 64:1–3, NKJV)
              kind: quote
              UID: MIN171.11.1.1.P.6
            - p: 7
              text: 'In speaking to John the Baptist’s followers, Jesus explained
                how He was revitalizing the Jews: The blind saw, the lame walked,
                the lepers were cleansed, and the deaf heard. The dead rose up, and
                people received the gospel. Then He said something curious: “And blessed
                is he who is not offended because of Me” (Matthew 11:6, NKJV). That
                is the message we would give to each and every church: Blessed is
                the church that is not offended because of Him.'
              kind: prose
              UID: MIN171.11.1.1.P.7
            - p: 8
              text: We do ourselves a great disservice if we think that because we
                are in a Spirit-filled church we have nothing to gain by praying for,
                seeking, and expecting revitalization. We can miss out if we assume
                we are already as full of the Holy Spirit in our personal lives and
                services as we can be. Do not be offended by this talk of revitalization
                if you are in a church that is already experiencing the Holy Spirit.
                Instead, see this as an opportunity to bring it to a higher spiritual
                level by being hungry for more of Him!
              kind: prose
              UID: MIN171.11.1.1.P.8
              page: 126
            - p: 9
              text: In addition, do not think that the Holy Spirit has no place in
                a strategic plan because the Spirit who can inspire us spontaneously
                is the same Spirit who helps us learn God’s plans for our churches.
              kind: prose
              UID: MIN171.11.1.1.P.9
              page: 127
            - p: 10
              text: Spirit and Strategy in Harmony
              kind: heading
              UID: MIN171.11.1.1.P.10
              page: 127
            - p: 11
              text: One of the churches that participated in the Acts 2 Journey had
                an amazing and unique story—a case study in what can happen when the
                Spirit and the strategic work together.
              kind: prose
              UID: MIN171.11.1.1.P.11
              page: 127
            - p: 12
              text: When we began working with them, there were exactly twenty-eight
                people in the congregation. Interestingly, fifteen of them were high
                school students. The pastor had been a youth pastor, and this was
                his first lead role. The church was in a virtual ghost town, and the
                church building may have been the only functioning public building
                that remained in this particular community. The pastor had brought
                a team of people with him, and five of them were high school students.
                What further stood out about these students was that they were very
                intense in their prayers.
              kind: prose
              UID: MIN171.11.1.1.P.12
              page: 127
            - p: 13
              text: One of our Acts 2 team members visited their church on a Sunday
                morning for the prayer service that preceded the 10:15 a.m. service.
                He arrived a little late because he missed a turn, but he walked into
                one of the most intense prayer meetings he had ever been in—and teenagers
                led it! The young man leading was a high school senior, and the atmosphere
                was like a youth camp, even though there were some older folks present
                as well. Students sat in the front rows of the church, and the older
                saints sat behind them supportively.
              kind: prose
              UID: MIN171.11.1.1.P.13
              page: 127
            - p: 14
              text: The dream team that came to the Acts 2 Journey consisted of the
                pastor, his wife, the dad of one of the students, and five high school
                students. Their dream team proceeded to build a plan together, and
                they were just as intense about building that plan as they were about
                praying before their services. They launched their plan right before
                several of the young people graduated from high school.
              kind: prose
              UID: MIN171.11.1.1.P.14
              page: 127
            - p: 15
              text: The students who graduated were leaving for college just as the
                fruit of their plan began to grow. Soon the church began to grow in
                health and numbers. All of the new people were unchurched families
                from the area, and the pastor found himself in need of basic discipleship
                tools because he had many people who had never opened a Bible before.
              kind: prose
              UID: MIN171.11.1.1.P.15
              page: 127
            - p: 16
              text: These were exactly the kind of people the students had dreamed
                of reaching!
              kind: prose
              UID: MIN171.11.1.1.P.16
            - p: 17
              text: Completely against prevailing trends where young people leave
                their rural communities and never return, several of these students
                decided to change their college plans and go to school closer to home.
                They wanted to be a part of what God was doing in that church as a
                result of the plans they had helped to form.
              kind: prose
              UID: MIN171.11.1.1.P.17
              page: 127
            - p: 18
              text: This is a wonderful example of what can happen when the Spirit
                and the strategic come together in harmony. Having a plan does not
                replace passion for God; it shapes that passion into a focused plan
                and then executes it.
              kind: prose
              UID: MIN171.11.1.1.P.18
              page: 128
            - p: 19
              text: We sometimes act like anything from the Holy Spirit has to be
                last minute and that making plans is antithetical to being led by
                the Spirit. We confuse being Spirit-led with being spontaneous.
              kind: prose
              UID: MIN171.11.1.1.P.19
              page: 128
            - p: 20
              text: Some leaders fail to realize that the same Holy Spirit who directs
                us in the moment can also inspire us during the planning stages. Worship
                services are terrific examples of this. Most worship leaders will
                plan the songs they are going to sing even though they want their
                worship to be Spirit-led. The compromise is having a plan but remaining
                flexible; if the Spirit spontaneously puts a song on the worship leader’s
                or pastor’s heart, we must be able to flow with the change.
              kind: prose
              UID: MIN171.11.1.1.P.20
              page: 128
            - p: 21
              text: A vision without a plan to carry it out is nothing more than a
                dream. However, when we create our plans under the inspiration of
                the Holy Spirit, we position ourselves to catch God’s plan for us
                and our churches.
              kind: prose
              UID: MIN171.11.1.1.P.21
              page: 128
            interactive_questions:
            - p: 1
              text: How do the five functions from Acts 2 help lead you to vision?
              response: These functions form the pathway from values to vision. The
                five functions are a template you can use to develop a plan for your
                church.
              UID: MIN171.11.1.1.IQ.1
            - p: 2
              text: Why should God’s people always be hungry for more of the Spirit’s
                presence and power?
              response: We should never be satisfied or think that we have no further
                need for the Spirit to work in us. Our hunger should always be for
                everything God desires to do in us and through us.
              UID: MIN171.11.1.1.IQ.2
            - p: 3
              text: What must we do to assure that pursuing the Holy Spirit and developing
                a plan work together?
              response: We must recognize that they need to be pursued simultaneously.
                We want the Holy Spirit’s plan for our church. That is the only plan
                that can lead us to our greatest impact.
              UID: MIN171.11.1.1.IQ.3
            last_modified: '2026-03-27'
