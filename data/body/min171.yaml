      - last_modified: '2026-03-27'
        title: A Church in Decline
        subobjectives:
          4.2.1:
            body:
            - p: 1
              text: How many believers are like my mother? For many church leaders,
                it is not a loved one’s sickness that has sapped their hope; it is
                the state of their churches. Some are thriving, but the workload is
                crushing the pastor. Others are stagnant, and it takes all the pastor’s
                time and attention to keep them from declining. And a few churches
                are in the process of decline. In our denomination alone, over 8,400
                churches have plateaued or are declining. * Many of these churches
                have been beaten down and have lost their passion. They may have had
                fifteen pastors in the last twenty years. They have lost hope.
              kind: prose
              UID: MIN171.4.2.1.P.1
              page: 53
            - p: 2
              text: A look at the church worldwide may make many leaders stop and
                ask some hard questions that seem to have grim answers. We hear the
                Accuser’s voice saying the church is no longer relevant to our postmodern
                culture, that new generations will no longer fill sanctuaries as their
                parents did, and that secularization will see people walk away from
                their faith. Some may say there is little hope.
              kind: prose
              UID: MIN171.4.2.1.P.2
              page: 53
            - p: 3
              text: 'For many church leaders, the conventional wisdom is that growth
                is the default indicator of a church’s health. After all, a healthy
                church is growing—and eventually a growing church will increase in
                numbers and spiritual vitality. That is the nature of growth: healthy
                plants and animals inevitably grow, but unhealthy plants and animals
                decline and eventually die.'
              kind: prose
              UID: MIN171.4.2.1.P.3
              page: 53
            - p: 4
              text: God invites you and your congregation, regardless of size, to
                share a mission that matches both the mission field where He has placed
                you and the strengths with which He has blessed you, regardless of
                church size. Unlike many church leaders, He is not obsessed with size
                as a measure of the effectiveness of a church. He desires small churches
                to be healthy just as much as He desires big churches to be healthy,
                and He desires that all churches be full of hope.
              kind: prose
              UID: MIN171.4.2.1.P.4
              page: 53
            - p: 5
              text: Looking for Hope
              kind: heading
              UID: MIN171.4.2.1.P.5
              page: 53
            - p: 6
              text: The church is the body of Christ, and Christ is the hope of the
                world. If we lose our hope for the future, what possible chance does
                the world have?
              kind: prose
              UID: MIN171.4.2.1.P.6
              page: 53
            - p: 7
              text: Remember the story of my mother’s lost hope, for we will come
                back to it later at the end of the book. The question I had within
                my spirit was whether or not she could find hope again. And this is
                the same question we must ask of the church. Within this book, we
                will provide some answers to that question.
              kind: prose
              UID: MIN171.4.2.1.P.7
              page: 54
            - p: 8
              text: While this book is an exploration of hope for the church, it is
                not a grim tide of numbers and statistics we must fight against. The
                fight is for hope itself.
              kind: prose
              UID: MIN171.4.2.1.P.8
              page: 54
            - p: 9
              text: We have not passed out of relevance, attendance in our congregations
                around the world is not doomed to decline, and future generations
                will encounter relationship with Jesus Christ in new and vibrant ways
                through the vehicle that He established on this earth before He ascended
                to heaven. We have access to the same foundation and power as the
                first-century church, and from the lessons we will study in the Acts
                2 process and the empowerment of the Holy Spirit, we will find our
                hope again.
              kind: prose
              UID: MIN171.4.2.1.P.9
              page: 54
            - p: 10
              text: Terri Blanchett
              kind: heading
              UID: MIN171.4.2.1.P.10
              page: 54
            - p: 11
              text: Terri Blanchett became the pastor at Newell, South Dakota, only
                three weeks before she began her Acts 2 Journey. When she arrived
                at the church, only seven people attended. The district had planned
                to close the church, but Terri had girlhood memories of riding the
                bus to the Newell church each Sunday. She trusted God to keep the
                doors open and bring in more people.
              kind: prose
              UID: MIN171.4.2.1.P.11
              page: 54
            - p: 12
              text: Throughout the Acts 2 Journey, Terri and her team of three women
                sensed God wanted to breathe “new life” into the church. In a common
                biblical principle, new life would begin with those who had lost hope.
                Newell is near an Indian reservation, and many people in the community
                suffered from abuse. Terri and her team realized they could be a light
                and a healing balm to abuse victims, so they received training to
                care for the lost and the least in the community.
              kind: prose
              UID: MIN171.4.2.1.P.12
              page: 54
            - p: 13
              text: They renamed the church “Dakota Life” to emphasize the hope God
                offers. Before the Journey ended, many people had responded to the
                love Terri and her team provided for them, and thirty-five people
                attended the church.
              kind: prose
              UID: MIN171.4.2.1.P.13
              page: 54
            interactive_questions:
            - p: 1
              text: How does knowing God has a plan for your church that matches your
                strengths and mission field open the door to hope?
              response: Because it is the truth, regardless of what we may currently
                see. God has a plan and His Word will not return empty if we do not
                lose heart and give up.
              UID: MIN171.4.2.1.IQ.1
            - p: 2
              text: So, is low morale in a church the product of fear and disappointment
                in its circumstances or because we truly have no hope of success?
              response: Low morale is an understandable response to fear and disappointment,
                but can be overcome through perseverance and character built on God’s
                truth. Empowered 5 CHAPTER
              UID: MIN171.4.2.1.IQ.2
            last_modified: '2026-03-27'
