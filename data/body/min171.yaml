    - last_modified: '2026-03-27'
      title: 13 - Grow
      lessons:
      - last_modified: '2026-03-27'
        title: A New Model of Discipleship
        subobjectives:
          13.1.1:
            body:
            - p: 1
              text: Too many people start at the wrong point, and that guarantees
                a wrong result. In theological terms, they are rooted in anthropology
                (the nature of humankind) instead of pneumatology (the nature of the
                Spirit). These models call on the disciple to know rational knowledge
                (learning, memorization, and course work) and how to do behavioral
                activity (how to act, what to do).
              kind: prose
              UID: MIN171.13.1.1.P.1
              page: 150
            - p: 2
              text: Knowledge and behavior are essential, but they do not transform!
              kind: prose
              UID: MIN171.13.1.1.P.2
            - p: 3
              text: Knowledge stops short of the Holy Spirit’s destination of loving
                God and loving others. Behavioral effort (doing more or behaving better)
                cancels grace and creates Pharisees.
              kind: prose
              UID: MIN171.13.1.1.P.3
              page: 150
            - p: 4
              text: In too many churches, life in the Spirit is the missing imperative.
                We must experience the presence and the power of the living God. We
                need to deconstruct discipleship as it exists today, exchanging rational
                / behavioral models for relational / experiential models. However,
                these bold, nearly radical statements are counterintuitive to everything
                many of us were taught about discipleship.
              kind: prose
              UID: MIN171.13.1.1.P.4
              page: 150
            - p: 5
              text: Let me explain my journey. I serve on a Global Discipleship Task
                Force commissioned by Empowered 21 and led by a friend and mentor,
                Dr. David Ferguson. His book Relational Foundations (2004) introduced
                the relational model the Task Force has been working on for the past
                several years. It has been an exciting journey. Dr. Ferguson’s teaching
                and writings and the work of the Discipleship Task Force have inspired
                this section on discipleship.
              kind: prose
              UID: MIN171.13.1.1.P.5
              page: 150
            - p: 6
              text: The Relational Foundation
              kind: heading
              UID: MIN171.13.1.1.P.6
              page: 150
            - p: 7
              text: Would you recognize a Spirit-empowered disciple if you saw one?
                Let us explore the rational theology and the behavioral theology I
                mentioned earlier.
              kind: prose
              UID: MIN171.13.1.1.P.7
              page: 150
            - p: 8
              text: Paul wrote, “All scripture is breathed out by God and profitable
                for teaching, for reproof, for correction, and for training in righteousness”
                (2 Timothy 3:16, ESV).
              kind: prose
              UID: MIN171.13.1.1.P.8
              page: 150
            - p: 9
              text: One significant purpose of God’s Word is to teach us what we should
                believe (doctrine). The light of Scripture pierces the darkness of
                human philosophies and belief systems. Universalism claims there are
                multiple paths to eternal life, but the light of Scripture declares,
                “And there is salvation in no one else, for there is no other name
                under heaven given among men by which we must be saved” (Acts 4:12,
                ESV).
              kind: prose
              UID: MIN171.13.1.1.P.9
              page: 150
            - p: 10
              text: 'A second valuable purpose of God’s Word is to reveal to us how
                we should live. Paul said Scripture has been given for reproof (to
                confront what is wrong) and correction (to define what is right and
                to equip us to do it). The rebukes of Scripture help us identify areas
                of darkness while the corrections of Scripture point us toward the
                light. Paul wrote:'
              kind: prose
              UID: MIN171.13.1.1.P.10
              page: 150
            - p: 11
              text: 'Now the works of the flesh are evident: sexual immorality, impurity,
                sensuality, idolatry, sorcery, enmity, strife, jealousy, fits of anger,
                rivalries, dissensions, division, envy, drunkenness, orgies, and things
                like these. I warn you, as I warned you before, that those who do
                such things will not inherit the kingdom of God. (Galatians 5:19–21,
                ESV)'
              kind: quote
              UID: MIN171.13.1.1.P.11
              page: 150
            - p: 12
              text: In Ephesians 4:29, Paul speaks of not letting any unwholesome
                talk come out of our mouths (reproof) but only what is helpful for
                building others up (correction). To revile, judge, or gossip with
                our words is to fall outside of the boundary of right living; these
                are sins.
              kind: prose
              UID: MIN171.13.1.1.P.12
              page: 151
            - p: 13
              text: These two purposes of truth are critical for life and ministry,
                but they are not sufficient in themselves. These purposes of truth
                set boundaries for what we are to believe and how we are to live.
                God has given these boundaries in order to direct our journey toward
                a relationship with Him and with those He loves. We might consider
                these boundaries for doctrine and behavior as the “curbs” alongside
                our road to intimacy with God. As Paul explains, one of the primary
                purposes of the law is to be our tutor or our instructor to show us
                our need for a Savior (Galatians 3:24).
              kind: prose
              UID: MIN171.13.1.1.P.13
              page: 151
            - p: 14
              text: People stand between those two curbs—trying to learn more and
                trying to behave better. Many end up frustrated, confused, and ineffective
                as a disciple growing in Christ. Dr. Ferguson (2004) observes, “Week
                by week, they leave church knowing what to believe and how to behave,
                but never take the journey into a deeper relationship with the God
                of the Bible” (72–74). What they need is to take the center path into
                loving God and loving others revealed in the Great Commandment.
              kind: prose
              UID: MIN171.13.1.1.P.14
            - p: 15
              text: 'Certainly, Scripture has an objective meaning, but it also has
                a relational significance. In his book Relational Discipleship , Dr.
                Ferguson (2005) explains:'
              kind: prose
              UID: MIN171.13.1.1.P.15
              page: 152
            - p: 16
              text: As we have seen, there is a rational purpose of truth and a behavioral
                purpose of truth, but there is also a relational purpose of truth.
                In order to understand this relational purpose, we must consider the
                fourth function of Scripture Paul mentions to Timothy in 2 Timothy
                3:16—that of training us in righteousness, or, more literally, “parenting”
                us. Derived from the Greek word for “children” (padeia), the word
                “training” (paedeian) suggests being raised into spiritual maturity
                by Scripture in a manner similar to being raised by a loving family
                into physical and emotional maturity.
              kind: prose
              UID: MIN171.13.1.1.P.16
              page: 152
            - p: 17
              text: Scripture has given us the boundaries of right doctrine and right
                behavior, much like parents give boundaries to their children. But
                do such boundaries and guidelines—the rules, the “thou shalt nots”—actually
                raise or mature us? The loving relationships that exist within the
                boundaries are necessary. A family can have rules, restrictions, and
                guidelines, but if it lacks love-filled relationships, maturity is
                hindered. So also it is with our approach to Scripture. Scripture
                is God-breathed, living, and active, and intended to be experienced
                in loving relationship with the One who wrote it!
              kind: prose
              UID: MIN171.13.1.1.P.17
              page: 152
            - p: 18
              text: 'Jesus said that Scripture (“the law and the prophets”) hangs,
                or depends, upon two commandments: Love God, and love others (Matthew
                22:35–40). Scripture has a relational purpose: to lead us into maturity
                through deepened love relationships with the God who breathed it and
                with those He loves. As the Holy Spirit brings revelation concerning
                this relational purpose, it seems to “come alive,” spurring us to
                love others, to realize that we are loved, and, above all, to love
                the One who has given the Word to us. (96)'
              kind: prose
              UID: MIN171.13.1.1.P.18
              page: 152
            - p: 19
              text: This Spirit-empowered, relational framework proposes a transforming
                journey for all ages and stages of spiritual development where the
                Holy Spirit leads us in a relational journey with God’s Son, God’s
                Word, and God’s people.
              kind: prose
              UID: MIN171.13.1.1.P.19
              page: 152
            - p: 20
              text: 'Spirit-empowered discipleship requires a lifestyle of the following:'
              kind: prose
              UID: MIN171.13.1.1.P.20
            - p: 21
              text: • Fresh encounters with Jesus (John 8:12)
              kind: prose
              UID: MIN171.13.1.1.P.21
            - p: 22
              text: • Frequent experiences of Scripture (Psalm 119:105)
              kind: prose
              UID: MIN171.13.1.1.P.22
            - p: 23
              text: • Fullness of the Spirit (Ephesians 5:18)
              kind: prose
              UID: MIN171.13.1.1.P.23
            - p: 24
              text: • Faithful engagement with God’s people (Matthew 5:14)
              kind: prose
              UID: MIN171.13.1.1.P.24
            - p: 25
              text: The ultimate goal of discipleship is Christ-likeness. Models based
                upon knowing and doing are incomplete; they lack the empowerment of
                a life of loving and living intimately with Christ. Spirit-empowered
                discipleship outcomes must be relational and are impossible to realize
                apart from the special work of the Spirit. Thus, a Spirit-empowered
                discipleship outcome, such as listening to and hearing God, is relational
                and requires the Holy Spirit’s work.
              kind: prose
              UID: MIN171.13.1.1.P.25
              page: 153
            - p: 26
              text: Relevant discipleship does not begin with doctrines or teaching,
                parables or principles, church polity or stewardship. It begins with
                loving the Lord with all your heart, mind, soul, and strength. The
                Spirit calls us to a life of loving intimately and empowers us in
                it.
              kind: prose
              UID: MIN171.13.1.1.P.26
              page: 153
            - p: 27
              text: As we have freely received, we then freely give. As God gives
                to us, we give out. When the Holy Spirit is our source, we never have
                capacity issues.
              kind: prose
              UID: MIN171.13.1.1.P.27
              page: 153
            citations:
            - citekey: ferguson2004
              pandoc: '[@ferguson2004]'
              intext: (Ferguson 2004)
              paragraph: MIN171.13.1.1.P.5
              UID: MIN171.13.1.1.C.1
            - citekey: ferguson2004
              pandoc: '[@ferguson2004, 72–74]'
              intext: (Ferguson 2004, 72–74)
              page: 72–74
              paragraph: MIN171.13.1.1.P.14
              UID: MIN171.13.1.1.C.2
            - citekey: ferguson2005
              pandoc: '[@ferguson2005]'
              intext: (Ferguson 2005)
              paragraph: MIN171.13.1.1.P.15
              UID: MIN171.13.1.1.C.3
            interactive_questions:
            - p: 1
              text: What are two crucial purposes of God’s Word?
              response: God’s Word reveals what to believe and how to live.
              UID: MIN171.13.1.1.IQ.1
            - p: 2
              text: Why are the boundaries of what to believe and how to live insufficient
                in themselves?
              response: Disciples also need the transforming power of the Spirit.
                The relational dimension of discipleship focuses on the transforming
                relationship we have with Christ as well as the empowerment of the
                Spirit. The Spirit empowers us to live according to the truth of God’s
                Word.
              UID: MIN171.13.1.1.IQ.2
            - p: 3
              text: How does relationship with God prevent knowledge from becoming
                pride and service becoming exhaustion?
              response: Answers will vary.
              UID: MIN171.13.1.1.IQ.3
            - p: 4
              text: How does the Spirit lead us on a transformational journey?
              response: The Holy Spirit leads us in a relational journey with God’s
                Son, God’s Word, and God’s people. The Spirit leads us to fresh encounters
                with Jesus (John 8:12); frequent experiences of Scripture (Psalm 119:105);
                fullness of the Spirit (Ephesians 5:18); and faithful engagement with
                God’s people (Matthew 5:14). The Spirit leads us into transformation.
                The ultimate goal of the discipleship journey is Christ-likeness.
              UID: MIN171.13.1.1.IQ.4
            last_modified: '2026-03-27'
