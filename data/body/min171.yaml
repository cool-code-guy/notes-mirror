              page: 19
            - p: 7
              text: We will take a quick look at each of these action steps to frame
                our understanding of them.
              kind: prose
              UID: MIN171.1.2.2.P.7
              page: 19
            - p: 8
              text: Connect
              kind: heading
              UID: MIN171.1.2.2.P.8
              page: 20
            - p: 9
              text: 'Connect focuses on the vertical and horizontal relationships
                in life. It begins with the process of salvation and continues through
                building spiritually strong relationships. Vertical relationship focuses
                on the process that connects people to God in all aspects of life.
                Horizontal relationship creates an atmosphere for relationship building
                person-to-person. Horizontal relationships consist of connections
                in every facet of life: family, church, local community, and global
                community.'
              kind: prose
              UID: MIN171.1.2.2.P.9
              page: 20
            - p: 10
              text: Grow
              kind: heading
              UID: MIN171.1.2.2.P.10
              page: 20
            - p: 11
              text: 'Grow is about discipleship. It is how your church promotes spiritual
                formation in the lives of individuals, ministry teams, and the congregation.
                It is about answering the following question: “How do we grow to be
                more like Jesus?” Grow centers on belief and behavior, whereas connect
                is about the relationship.'
              kind: prose
              UID: MIN171.1.2.2.P.11
              page: 20
            - p: 12
              text: Serve
              kind: heading
              UID: MIN171.1.2.2.P.12
              page: 20
            - p: 13
              text: The Bible teaches that when we become children of God, He also
                makes us His priests to represent Him to everyone around us. Many
                believers have never heard this magnificent truth, and their willingness
                and eagerness to serve is clouded by confusion and the desire for
                self-glory. Churches of every size need to move lay people from being
                spectators in the pews to becoming involved in the ministry of their
                churches. This is where the serve component comes in. As we help people
                learn about their gifts and abilities and what their passions are,
                we can help align them with ways of serving God and others that will
                be a good fit for them. Serve is about giving people outlets for the
                use of their gifts and abilities and giving them an opportunity to
                find their place in ministry.
              kind: prose
              UID: MIN171.1.2.2.P.13
              page: 20
            - p: 14
              text: Go
              kind: heading
              UID: MIN171.1.2.2.P.14
              page: 20
            - p: 15
              text: Go is evangelism, reaching out to those who are next door and
                those on the other side of the globe. The evangelism component prepares
                and equips people to share their faith and accept the God-given mission
                for them and the local church. Go not only brings focus to the power
                of evangelism, but it also offers missional direction for individuals
                and the church body, including mission trips abroad and at home, long-term
                world missions, stewardship opportunities, relationship building with
                missionaries, and understanding the global perspective. It puts a
                great deal of emphasis on relational evangelism. This is where your
                church becomes more outwardly focused instead of staying inwardly
                focused, and that is incredibly crucial.
              kind: prose
              UID: MIN171.1.2.2.P.15
              page: 20
            - p: 16
              text: Worship
              kind: heading
              UID: MIN171.1.2.2.P.16
              page: 21
            - p: 17
              text: Worship is the intimacy and reality of the presence of Christ
                when leadership teams and the congregation see the character of Christ
                and the power of Christ connecting to individuals in their daily lives
                and corporately through the church family. Worship is far more than
                music, although that is a component. It also includes prayer and powerful
                preaching.
              kind: prose
              UID: MIN171.1.2.2.P.17
              page: 21
            - p: 18
              text: It Is Not One or the Other
              kind: heading
              UID: MIN171.1.2.2.P.18
              page: 21
            - p: 19
              text: These five functions provide the framework necessary to help us
                discover God’s plan for how we handle fellowship, discipleship, ministry,
                evangelism, and worship. These functions were the heart of God’s original
                plan for the church. He had a plan—a process—but the plan was always
                and only to be carried out with the Holy Spirit’s power.
              kind: prose
              UID: MIN171.1.2.2.P.19
              page: 21
            - p: 20
              text: Some leaders mistakenly assume it is an either / or proposition—either
                we are strategic and have a plan or we are Spirit-led and spontaneous.
                That is not correct; it is both / and . Some pastors do not like to
                plan, so they gravitate toward spontaneous spiritual expressions.
                Other church leaders become so focused on their plans they do not
                leave room for God’s leading or His transforming power. For a church
                to be what God wants it to be, both are essential. The first-century
                church was empowered by the Spirit, but Jesus had a plan for those
                He was leaving behind. He revealed that plan through the power of
                His Spirit, and He accomplishes the plan through the Spirit’s power.
              kind: prose
              UID: MIN171.1.2.2.P.20
              page: 21
            - p: 21
              text: Every church—small or large, urban or suburban or rural, American
                or international, and with whatever blend of ethnicity—needs both
                the power of the Spirit and a process of growth. Spiritual experiences
                are wonderful, but without a plan, you will find yourself wondering
                how to take your church from where you are to where it needs to be.
              kind: prose
              UID: MIN171.1.2.2.P.21
              page: 21
            - p: 22
              text: The Acts 2 church had Jesus as its foundation and the Holy Spirit
                as its force. If we are to have healthy churches today, we need the
                same foundation, Jesus, and the same force, the Holy Spirit.
              kind: prose
              UID: MIN171.1.2.2.P.22
              page: 21
            - p: 23
              text: The power of the Holy Spirit is necessary for us to be more than
                we actually are. The anointing will help us say more than we actually
                know. The anointing will also help us do more than we can actually
                do. We need all of this if we are to effectively minister the gospel.
              kind: prose
              UID: MIN171.1.2.2.P.23
              page: 21
            - p: 24
              text: If we want healthy churches, we must embrace the source of power
                that enabled the first-century church to explode in the midst of fierce
                persecution. As it embraced these five functions under the empowerment
                of the Spirit, the church experienced exponential growth. As we have
                focused on these same functions, we have seen churches reinvigorated
                across the country. We have refined our own understanding of the process
                by working with hundreds of churches through what we call Acts 2 Journeys;
                they are multi-weekend experiences for pastors and their dream teams.
                In this setting, we walk them through the Acts 2 process. We are seeing
                great results as pastors grow in confidence because they feel better
                equipped, their teams come together behind a unified vision, and their
                churches experience a profound impact. In short, what worked for the
                first-century church continues to work today because the Builder,
                Christ, used a sound blueprint when He founded the church in Acts.
              kind: prose
              UID: MIN171.1.2.2.P.24
              page: 22
            - p: 25
              text: The Acts 2 process in this book is for pastors and the members
                of their “dream teams”—the people in leadership at their church—to
                help them (and you) understand the process that my father and I and
                so many other pastors once lacked.
              kind: prose
              UID: MIN171.1.2.2.P.25
              page: 22
            - p: 26
              text: This book is about how to have a church modeled after the one
                Jesus founded—the same church that overcame incredible persecution
                to spread the gospel message to the then-known world.
              kind: prose
              UID: MIN171.1.2.2.P.26
              page: 22
            - p: 27
              text: The process God revealed to me out of Acts 2 is biblical, transferable,
                and replicable. It will work in rural areas, urban areas, and suburbia.
                It will work for large churches and small ones, healthy churches and
                unhealthy ones. Why? Because it is not mine—it is the model Christ
                used originally. It worked for the church I pastored, and it has worked
                for many others.
              kind: prose
              UID: MIN171.1.2.2.P.27
              page: 22
            - p: 28
              text: It can happen in your church too. Further information can be found
                at https://acts2journey.com/.
              kind: prose
              UID: MIN171.1.2.2.P.28
            - p: 29
              text: The Acts 2 Model
              kind: heading
              UID: MIN171.1.2.2.P.29
              page: 14
            interactive_questions:
            - p: 1
              text: What five key verbs provide the five functions of the Acts 2 Model?
              response: The five key verbs are Connect, Grow, Serve, Go, Worship .
              UID: MIN171.1.2.2.IQ.1
            - p: 2
              text: Do you think serve intends serving those in the church, outside
                the church, or both? Why?
              response: While it is clear that both are important as Jesus modeled
                serving one another but then focused our mission outward, many churches
                today are focused most heavily on the serving that is to be done inside
                their walls. In truth, it is outward focus that will keep the church
                on mission and on the path to greater health.
              UID: MIN171.1.2.2.IQ.2
            - p: 3
              text: Do you think churches today are more focused on going or hoping
                the unchurched will come to them?
              response: The evidence suggests that most expect people to come to their
                church if they desire answers or hope. Few see themselves as sent
                by Jesus to impact the people in their lives wherever they might be
                found.
              UID: MIN171.1.2.2.IQ.3
            - p: 4
              text: Why is the pursuit of the Holy Spirit critical to Spirit-empowered
                church leaders?
              response: The assignment we have been given is far greater than our
                abilities or capacity. We are no more capable in ourselves than were
                those in the early Church. We cannot do what Jesus commanded without
                the power of the Holy Spirit leading and equipping us.
              UID: MIN171.1.2.2.IQ.4
            - p: 5
              text: Why is strategy critical for Spirit-empowered church leaders?
              response: A plan puts good intentions into action. Since we know that
                God has a plan for our lives, the question is not should we have a
                plan, but do we think God wants to reveal His plan to us? Surely,
                that is His desire for us. Change Is Possible 2 CHAPTER
              UID: MIN171.1.2.2.IQ.5
