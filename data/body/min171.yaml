            glossary: []
      - last_modified: '2026-03-27'
        title: Finding Purpose
        subobjectives:
          14.2.1:
            body:
            - p: 1
              text: Earlier in the book, I talked about purpose and how critical it
                is to help those we disciple to discover the reason God put them on
                earth. Serving is directly related to purpose, and God has given us
                spiritual gifts and talents to use them for His glory and to accomplish
                our purpose. Your gifts, natural abilities, and personality form a
                composite—a unique combination that is as specific to you as your
                fingerprint. It is the way God wired you, and it makes you qualified
                for the calling He puts on your life.
              kind: prose
              UID: MIN171.14.2.1.P.1
              page: 171
            - p: 2
              text: Generally, we see three different categories of gifts in the Bible.
                The first are manifestation gifts, drawn out of 1 Corinthians (most
                Pentecostals and charismatics typically think of these when we speak
                of “gifts”). Next are ministry gifts, found in Ephesians 4. Finally,
                we have motive gifts in Romans 12 that we can sometimes overlook because
                they are similar to natural abilities.
              kind: prose
              UID: MIN171.14.2.1.P.2
            - p: 3
              text: Some of these gifts tend to operate more in a corporate sense
                than within individuals. We would probably say that the gift of healing
                operates in our church rather than in the life of an individual, who
                may exercise a gift but may not always possess it.
              kind: prose
              UID: MIN171.14.2.1.P.3
              page: 172
            - p: 4
              text: Each individual has spiritual gifts, natural abilities, distinct
                passions, and unique life experiences, all of them go into creating
                his or her personality, view of the world, and ability to accomplish
                his or her God-given purpose. Helping congregants discover their spiritual
                gifts can open doors they never knew existed and may help them discover
                untapped potential and opportunities for service. Many spiritual-gift
                tests and programs are available for anyone to take and to discover
                their giftings and abilities (we will discuss this later), and this
                can be an excellent means of discipleship formation.
              kind: prose
              UID: MIN171.14.2.1.P.4
              page: 172
            - p: 5
              text: Operating within your gifts and natural abilities is like writing
                with your dominant hand. Have you ever broken or injured your dominant
                hand and had to write with your other hand? It takes much longer,
                and it never looks quite right. It is uncomfortable. Something similar
                happens when people serve in an area that is not in line with their
                gifts. One of our goals is to help volunteers find where they can
                serve most comfortably and effectively.
              kind: prose
              UID: MIN171.14.2.1.P.5
              page: 172
            - p: 6
              text: That does not mean we are not obligated to forms of service that
                are mundane simply because we are not “gifted” in that area. There
                is not a chance in the world that Jesus would have listed “feet washing”
                on His spiritual-gift test! Yet He was a servant of all and demonstrated
                clearly that the most humbling acts of service are befitting for even
                the highest leader. I try never to ask someone to do something that
                I am not willing to do or have not done personally.
              kind: prose
              UID: MIN171.14.2.1.P.6
              page: 172
            - p: 7
              text: One church I know of had the policy that any pastor who wished
                to serve had to first work on the janitorial staff as a “green shirt.”
                There are few things more basic than serving a congregation by cleaning
                the restrooms after services, and I imagine it gave the ministry staff
                a unique perspective on Jesus’ foot washing ministry!
              kind: prose
              UID: MIN171.14.2.1.P.7
              page: 172
            - p: 8
              text: So while we serve to meet church needs—regardless of whether or
                not we are “gifted” to change diapers, welcome visitors, or help with
                the youth—we want to help people find their fit and serve out of their
                gifts. We want people who can carry a tune to sing in the worship
                team, people who are friendly to welcome others at the door, and trustworthy
                individuals to usher and collect our offerings.
              kind: prose
              UID: MIN171.14.2.1.P.8
              page: 172
            - p: 9
              text: Humble Origins, Amazing Service
              kind: heading
              UID: MIN171.14.2.1.P.9
              page: 172
            - p: 10
              text: We can enrich lives and open amazing doors of service by helping
                people understand their natural abilities and how these abilities
                complement their personalities, connect with their passions, and fit
                in the context of their life experiences. We can use assessment tools,
                books, and small-group settings to help develop these points in our
                discipleship programs, but again, our example in this is Christ, who
                made himself a servant of all.
              kind: prose
              UID: MIN171.14.2.1.P.10
              page: 172
            - p: 11
              text: It can also be helpful to think of people throughout the Bible
                who had great destinies but started off in lowly positions. David’s
                father did not even bring him in from the fields when the prophet
                Samuel came and asked to see his sons. As the youngest, David was
                an afterthought, relegated to the lowly duties of being a shepherd.
                This was not a noble calling; it was some of the lowest work, reserved
                for servants. David was not a low man on the totem pole; he was left
                off the pole entirely!
              kind: prose
              UID: MIN171.14.2.1.P.11
              page: 173
            - p: 12
              text: Yet God saw much more in David than anyone else possibly could,
                and those times of menial labor with stupid, smelly sheep proved to
                be the foundation of a poet’s soul in a warrior’s body. David was
                Israel’s greatest king, but he got his start as a lowly servant.
              kind: prose
              UID: MIN171.14.2.1.P.12
              page: 173
            - p: 13
              text: Gideon is also an excellent example. Hiding in a depression in
                the ground and doing manual labor, this fearful son of an unimportant
                man found God prophetically calling him a mighty warrior! God saw
                something in Gideon no one could see from his hidden workplace—a willing
                tool for bringing victory to His people.
              kind: prose
              UID: MIN171.14.2.1.P.13
              page: 173
            - p: 14
              text: Does that describe us? Is that an accurate view of our own ego
                and opinion of ourselves? Are we content to let God call us out of
                a hidden threshing floor and use us as His tool? Or do we seek to
                promote ourselves?
              kind: prose
              UID: MIN171.14.2.1.P.14
              page: 173
            - p: 15
              text: No discussion of service can happen without a right understanding
                of humility because without humility as a foundation stone, successful
                service can go to our heads. This is as true of any congregation member
                as it is of those in leadership, but we bear an extra burden not only
                to maintain humble hearts ourselves but to reproduce humility in those
                we disciple.
              kind: prose
              UID: MIN171.14.2.1.P.15
              page: 173
            - p: 16
              text: A friend tells an amusing anecdote of praising one of the parking
                lot attendants at his church and creating a joking title of “Captain
                Parking Lot Attendant.” The next week, the man showed up with a ridiculously
                bright flashlight, a garish sports coat, and a hat befitting a cruise
                line captain. He looked ridiculous—and provided his pastor an uncomfortable
                opportunity to explain the value of humility in serving.
              kind: prose
              UID: MIN171.14.2.1.P.16
              page: 173
            - p: 17
              text: We do not want anyone to be Captain Parking Lot Attendant. Do
                not let successful service go to your head, and train those you disciple
                to minister in humility and keep the right opinion of themselves as
                they serve.
              kind: prose
              UID: MIN171.14.2.1.P.17
              page: 173
            interactive_questions:
            - p: 1
              text: In what way is helping others discover their spiritual gift(s)
                an essential part of equipping them for ministry?
              response: When we discover peoples’ spiritual gifts, we find the places
                of ministry in which God has equipped them to serve.
              UID: MIN171.14.2.1.IQ.1
            - p: 2
              text: Why is it possible to overlook people’s potential?
              response: People’s gifts may as yet be undiscovered and undeveloped
                and, as a result, will not be noticed. Or individuals may have a difficult
                background or problems that keep us from seeing their potential. Additional
                answers may vary.
              UID: MIN171.14.2.1.IQ.2
            - p: 3
              text: What can happen without a foundation of humility?
              response: Without a foundation of humility, a person’s service can lead
                to pride and self-importance. Pride can lead to a fall or the misuse
                of one’s gifts. Pride can lead to conflict in the church. Additional
                answers may vary.
              UID: MIN171.14.2.1.IQ.3
            last_modified: '2026-07-15'
