      - last_modified: '2026-03-27'
        title: People with a Plan
        subobjectives:
          11.2.1:
            body:
            - p: 1
              text: 'The church in Acts 2 was a Spirit-filled church led by disciples
                who were Spirit-baptized and Spirit-directed. We read about their
                empowerment in Acts 2:4 (NKJV): “And they were all filled with the
                Holy Spirit and began to speak with other tongues, as the Spirit gave
                them utterance.” Peter later confirmed that this was what the prophet
                Joel had described—God was pouring out His Spirit on all flesh (see
                Acts 2:14–21). This outpouring was what the disciples had waited for;
                it was the promised power to witness (Acts 1:8).'
              kind: prose
              UID: MIN171.11.2.1.P.1
              page: 128
            - p: 2
              text: This was God’s plan for His people on earth. Contrary to some
                thinking, the presence and flow of the Holy Spirit does not imply
                a complete loss of order. God established a plan for His Spirit-empowered
                church, and we can read about it in Acts 2:42–47. That passage clarifies
                the functions or activities of the newly formed church. The plan hinges
                on fellowship, discipleship, gift-oriented ministry, evangelism, and
                worship. (Interestingly, revival is what the church first experiences;
                evangelism is what the church then engages in. Revival is periodic;
                evangelism is continuous. Revival cannot last; evangelism must not
                stop.)
              kind: prose
              UID: MIN171.11.2.1.P.2
              page: 128
            - p: 3
              text: God does nothing out of order. He has a divine purpose in all
                He does. Similarly, He did not establish a pattern on this earth devoid
                of order and motivated only by how we individually interpret the Spirit’s
                promptings. No, God had something in mind, and because we have His
                blueprint, we are people of that plan.
              kind: prose
              UID: MIN171.11.2.1.P.3
              page: 129
            - p: 4
              text: 'When you have established your mission, vision, and values, it
                is time to develop a strategic plan based on God’s model. If your
                vision is where you or your church are going in the next three to
                five years and your core values determine your actions and your identity,
                then the strategic plan is how you get from where you are (values)
                to where you want to go (vision). We build a strategic plan around
                the functions of the church: connect, grow, serve, go, and worship.'
              kind: prose
              UID: MIN171.11.2.1.P.4
              page: 129
            - p: 5
              text: A congregation is like people in a car. Our vision of the preferred
                future is where we are going. Our mission is why we are going on the
                journey together. Connect, grow, serve, go, and worship are what is
                going on inside the car, and our values and chosen priorities are
                the rules of the road and the road itself. Finally, the strategic
                plan is how we are going to get to our preferred future.
              kind: prose
              UID: MIN171.11.2.1.P.5
              page: 129
            - p: 6
              text: We go forward with both the power of the Spirit and a plan.
              kind: prose
              UID: MIN171.11.2.1.P.6
              page: 129
            - p: 7
              text: Community Pastors
              kind: heading
              UID: MIN171.11.2.1.P.7
              page: 129
            - p: 8
              text: One of the more interesting The Acts 2 Journey stories resulted
                from a scholarship to the Journey that I gave away at a gathering
                in Phoenix. I said that the first one who got up to the front would
                get the scholarship, and a guy in the front row ran forward immediately.
                His wife, Kassie, was actually the pastor, but she and Greg were both
                Bible school graduates who were pastoring in a little town in the
                mountains of northeastern Arizona—a place where people go to hide
                from the government.
              kind: prose
              UID: MIN171.11.2.1.P.8
              page: 129
            - p: 9
              text: The community consisted predominantly of heavily armed survivalists
                or extreme Mormons, and, for a host of reasons, 60 of the 180 children
                in the elementary school had no official address. Many people did
                not have Social Security numbers because they were living off the
                grid.
              kind: prose
              UID: MIN171.11.2.1.P.9
              page: 129
            - p: 10
              text: It is difficult to establish a church there because the people
                are afraid to be known. Imagine trying to build a church in a place
                where as soon as you get to know people a little bit, they disappear
                into hiding!
              kind: prose
              UID: MIN171.11.2.1.P.10
              page: 129
            - p: 11
              text: When Greg and Kassie received the scholarship, the church had
                seven people in it—not even large enough to engage in the Journey.
                But we determined that their scholarship would include paying for
                one of our team members to go out there for a weekend to help them
                build a strategy. He went out for the weekend, met with the couple,
                and discovered that they were a great, praying, and passionate couple.
                Still, it was difficult to come up with a plan for how they could
                effectively minister to their community.
              kind: prose
              UID: MIN171.11.2.1.P.11
              page: 129
            - p: 12
              text: One of the seven people in the church was a woman who taught fifth
                grade at the elementary school where they met for Sunday services.
                They began to build a plan around the idea of connecting to the community
                through its children. In fact, the goal was not to build the church
                at all. The plan that came together was for this couple to become
                pastors of the community. They realized they might never get people
                to come to their church, so they would go to the people.
              kind: prose
              UID: MIN171.11.2.1.P.12
              page: 130
            - p: 13
              text: The strategy centered on partnering with the elementary school,
                and the pastor and her husband sought to respond to members of the
                community in moments when they needed spiritual help.
              kind: prose
              UID: MIN171.11.2.1.P.13
              page: 130
            - p: 14
              text: The following year, this little church was incredibly excited
                to have more than thirty people in attendance on Easter Sunday. The
                best part was that nearly two dozen people come forward for salvation!
                A couple of years later, Greg went to work for a drug and alcohol
                rehabilitation program as a counselor and chaplain. Kassie pastors
                the church and works in a convenience store, but throughout that community
                they are known as Pastor Kassie and Pastor Greg. Everyone knows where
                to turn when they need spiritual help.
              kind: prose
              UID: MIN171.11.2.1.P.14
              page: 130
            - p: 15
              text: Having a plan was a key element in this amazing story. Although
                our traditional thinking dictated that the church was too small for
                the Acts 2 Journey, it was not too small for God! He had to reveal
                a plan to us because “traditional thinking” was not going to work
                in that community. Their plan required a revival in their thinking,
                and the Holy Spirit led them to an unconventional solution for reaching
                lives.
              kind: prose
              UID: MIN171.11.2.1.P.15
              page: 130
            - p: 16
              text: The Plan Is about People
              kind: heading
              UID: MIN171.11.2.1.P.16
              page: 130
            - p: 17
              text: 'The strategic plan’s primary focus should be to nurture people
                to become all that God wants them to be—not merely to facilitate our
                programs. The strategic plan uses the programs and ministries of the
                church, but remember this point: It is all about the people.'
              kind: prose
              UID: MIN171.11.2.1.P.17
              page: 130
            - p: 18
              text: A vision takes the mission and biblical systems of the church
                and articulates them towards a preferred future, communicating where
                the church is going. In the next few chapters, we will spend more
                time on these biblical functions as part of the process that takes
                us from where we are to where we want to be. Your challenge will be
                to define what each of the five functions means for your church in
                order to develop a vision statement for each.
              kind: prose
              UID: MIN171.11.2.1.P.18
              page: 130
            - p: 19
              text: Using the template of the five biblical functions, you will begin
                to uncover God’s plan. For many pastors and leaders, this will be
                the clearest plan that you have ever completed for your church, and
                that is what makes this so unique and amazing. The model from Acts
                2 is not about constricting churches; it is about helping them hear
                from God and providing a template to articulate His plan.
              kind: prose
              UID: MIN171.11.2.1.P.19
            interactive_questions:
            - p: 1
              text: What does the Holy Spirit’s plan for His Spirit-empowered churches
                center on?
              response: The plan hinges on fellowship, discipleship, gift-oriented
                ministry, evangelism, and worship. These are the five areas of the
                Acts 2 model.
              UID: MIN171.11.2.1.IQ.1
            - p: 2
              text: What is the relationship between the five functions and the strategic
                plan?
              response: The five functions provide the framework or structure for
                our plan. Then, the strategic steps we take can be organized according
                to the primary function they seek to achieve.
              UID: MIN171.11.2.1.IQ.2
            - p: 3
              text: How does our need of a plan open the door to the creativity of
                the Holy Spirit?
              response: The Holy Spirit knows how to reach people, and at times He
                may use an unconventional approach to do that. This can be seen in
                the ministry of Jesus; He reached out to the woman at the well and
                on another occasion joined a despised tax collector for dinner. Answers
                may vary.
              UID: MIN171.11.2.1.IQ.3
            - p: 4
              text: What is the primary focus of a strategic plan?
              response: The strategic plan’s primary focus should be to nurture people
                to become all that God wants them to be.
              UID: MIN171.11.2.1.IQ.4
            - p: 5
              text: What do the arrows in the graphic suggest?
              response: The arrows suggest that the five functions are inter-related.
                They are not linear in that one precedes another, but they work together
                and enhance one another. Connect 12 CHAPTER
              UID: MIN171.11.2.1.IQ.5
