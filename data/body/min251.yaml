    - last_modified: '2026-03-27'
      title: 9 - Principles of Leadership
      print_page: 13
      intro_body:
      - text: You are a leader, and this means the primary responsibility of the church
          under God rests with you. To be effective leaders we must follow the principles
          that will enable us to grow to effectively lead others. No doubt the weight
          of leading God’s people can seem an overwhelming burden; however, remember
          that leadership is an occupation to which God has called you. This fact
          brings the promise of His help through the ministry of the Holy Spirit.
          An effective leader knows they need help. Good leaders are never lone wolves.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: MIN251.CH9.INTRO.P.1
      - text: In addition to maintaining a consistent prayer life to receive God’s
          guidance and maintaining continual contact with the people you lead, the
          effective leader must know their needs and frequently remind them of the
          ultimate goal.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: MIN251.CH9.INTRO.P.2
      - text: Increasing your knowledge of the principles of leadership in this chapter
          will give you confidence. Retaining them at the center of your thought life
          will equip you with the fundamental, biblical resources that have proven
          successful for seasoned leaders of God’s people.
        kind: prose
        cls: IST_Chapter-Intro-Intro-Text
        UID: MIN251.CH9.INTRO.P.3
