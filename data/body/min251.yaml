    course_objectives:
    - 1. Identify biblical examples of leadership and explain lessons that can be
      learned from these leaders.
    - 2. Explain the characteristics of a leader’s heart and how they are cultivated.
    - 3. Explain the requirements of the godly leader for guiding the church of Jesus
      Christ.
    - 4. Identify the various tests of leadership and what they seek to develop in
      a leader’s life.
    - 5. Explain the mission of the church as provided in God’s Word.
    - 6. Explain the process of vision from its inception to its communication to
      the body.
    - 7. Describe the recommendations of Moses’ father-in-law and how they apply to
      modern leadership.
    - 8. Explain the five levels of leadership and how we can progress to the highest
      levels.
    - 9. Describe how people skills impact leadership and explain the ways in which
      such skills are developed.
    - 10. Identify and explain key principles concerning time management and how a
      person can focus his or her greatest energy on the highest of his or her priorities.
