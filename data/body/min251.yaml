    - last_modified: '2026-05-28'
      title: 4 - The Leadership Test for Potential and Maturity
      print_page: 53
      intro_body:
      - text: Test me, O Lord, and try me, examine my heart and my mind. (Psalm 26:2)
        kind: quote
        cls: IST_Body-Block-Quote
        UID: MIN251.CH4.INTRO.P.1
      - text: Potentially, nearly every moment of life is a test. However, we can
          also encounter seasons of testing, and during those prolonged times, if
          we are alert to them, God will strengthen us to pass the tests. The book
          of James warns us that leaders will experience more scrutiny, testing, and
          judgment than followers do (3:1).
        kind: prose
        cls: IST_Body-Indent
        md: Potentially, nearly every moment of life is a test. However, we can also
          encounter *seasons* of testing, and during those prolonged times, if we
          are alert to them, God will strengthen us to pass the tests. The book of
          James warns us that leaders will experience more scrutiny, testing, and
          judgment than followers do (3:1).
        UID: MIN251.CH4.INTRO.P.2
      - text: Tests are common. Tests are administered daily in schools. Objects are
          tested too; many products and appliances are tested before they are sold.
          Nearly every part of a new car is put through intensive tests to check for
          safety and performance. Similarly when God tests leaders, He takes them
          through a type of crucial screening that reveals what they are made of.
          These screenings make us better leaders.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH4.INTRO.P.3
      - text: All the biblical leaders who were mightily used of God were also tested.
          Some went through prolonged seasons of testing. Abraham, Moses, Esther,
          Job, David, Samuel, and Paul are but a few of the examples. Testing often
          came in the area of their faith, to see if they would trust God regardless
          of the circumstances or the forces arrayed against them. Would they trust
          God when everything seemed hopeless? Would they trust God when delays seemed
          to be the order of the day? Would they trust and obey Him when friends and
          family members were giving up and they had to stand alone? Would they be
          willing to risk all for His kingdom’s sake?
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH4.INTRO.P.4
      - text: Testing also came their way in the motives arena. Would they serve God
          faithfully even if no one noticed? Would they be willing to serve in dark,
          difficult, lonely places with no applause from others? What were their true
          motivations for serving?
        kind: prose
        cls: IST_Body-Indent
        md: Testing also came their way in the *motives* arena. Would they serve God
          faithfully even if no one noticed? Would they be willing to serve in dark,
          difficult, lonely places with no applause from others? What were their true
          motivations for serving?
        UID: MIN251.CH4.INTRO.P.5
      lessons:
