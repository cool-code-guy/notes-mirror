    - last_modified: '2026-05-28'
      title: 3 - The High Calling of Leadership
      print_page: 41
      intro_body:
      - text: “Men ought to regard us as servants of Christ and as those entrusted
          with the secret things of God. Now it is required that those who have been
          given a trust must prove faithful.” (1 Corinthians 4:1–2)
        kind: quote
        cls: IST_Body-Bible-Verse-Sub-Head
        md: '*“Men ought to regard us as servants of Christ and as those entrusted
          with the secret things of God. Now it is required that those who have been
          given a trust must prove faithful.”* (1 Corinthians 4:1–2)'
        UID: MIN251.CH3.INTRO.P.1
      - text: 'About four hundred individuals in the Bible were given leadership responsibilities,
          but only about 25 percent of them finished their lives in the will of God.
          That is, approximately one hundred of those leaders completed their journey
          on earth in a context of obedience to His will. All who finished strong
          had this in common: they were lifelong learners. Obviously, our leadership
          example is Jesus, and Luke said this of Him: “Jesus grew in wisdom and stature,
          and in favor with God and men” (Luke 2:52). Our Lord, in His sinless perfection,
          grew obediently and conclusively.'
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH3.INTRO.P.2
      - text: Years ago, an internationally known news correspondent was asked by
          a journalism student, “What advice can you give to aspiring journalists?”
          He replied, “Read the great writers and listen to good talkers.” That is
          great advice for aspiring leaders too. The leaders who most positively impact
          societies around the world are lifelong learners. They never stop growing
          in their desire to better their lives and increase their knowledge. They
          read great writers and listen to good talkers.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH3.INTRO.P.3
      - text: The apostle Paul was a lifelong learner. He told the Philippians that
          even though he was well educated, he had not yet attained all of the spiritual
          and eternal realities his heart longed for in this life. Paul’s hunger for
          learning was evident even toward the end of his life while in prison. We
          read Paul’s request to Timothy to bring him his “scrolls” (books) and “parchments”
          (the Scriptures) (2 Timothy 4:13) so he could continue to read, learn, and
          stay encouraged.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH3.INTRO.P.4
      - text: During his years of ministry, Paul wrote extensively on the subject
          of leadership. Some of his writings focused on leadership directly, in which
          he gave clear instructions about what leaders should and should not do.
          He reminded the young pastors that their examples should be the models for
          all. Other writings indirectly warned the local believers against taking
          leaders and their support for granted, instructing them to treat leaders
          with respect, according to their God-given authority. Regardless of place
          or context, Paul knew the value of leadership.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH3.INTRO.P.5
      - text: In 1 Corinthians 4, Paul provides some significant insights about what
          a Christian leader should look like. One of the many principles the Bible
          emphasizes is that leadership is not bound in a title, but it is formed
          in the heart of a godly leader. Paul believed that if a leader would faithfully
          follow his recommendations, outlined in verses 1–2, that servant would finish
          their life on earth in glorifying obedience to God.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH3.INTRO.P.6
      - text: 'The first two verses of 1 Corinthians 4 are actually a continuation
          of the previous chapter, which has spiritual maturity as its primary focus:
          “You are of Christ, and Christ is of God.” By the time the reader begins
          chapter 4, Paul has clearly described what those who belong to Christ (and
          have been given leadership roles) need to remember and to execute in their
          lives. The call to leadership includes a calling to high standards.'
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH3.INTRO.P.7
