    - last_modified: '2026-05-28'
      title: 12 - Teamwork
      print_page: 1
      intro_body:
      - text: Have you ever stopped to consider that one is too small of a number
          to accomplish anything great? When you think about great movements throughout
          history, God always used teams of people working together to change the
          world. He usually does not call lone rangers. He calls members of the body
          of Christ. God wants us to work together.
        kind: prose
        cls: IST_Body-Indent
        md: Have you ever stopped to consider that *one* is too small of a number
          to accomplish anything great? When you think about great movements throughout
          history, God always used teams of people working together to change the
          world. He usually does not call lone rangers. He calls members of the body
          of Christ. God wants us to work together.
        UID: MIN251.CH12.INTRO.P.1
      - text: When lightning struck Wayne Burkholder’s barn near Farmerstown, Ohio,
          it burned down in a hurry. When seven hundred men in his Amish community
          showed up two weeks later to help him rebuild his new barn, it went up in
          a hurry too. The men began arriving in their Amish buggies right after breakfast,
          and the roof was on the barn when they broke for lunch. What nature ruined
          in less than six hours, teamwork was able to raise in less than six hours
          (Elmore 2001, 78).
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH12.INTRO.P.2
      - text: 'How foreign this approach may sound to the independent mindset Americans
          have. Yet God did not create us for the kinds of things we often celebrate
          in this country: the maverick spirit , the renegade, the individual, and
          the lone ranger. We have adopted a do-it-on-your-own mentality, yet ministry
          was not designed to be done alone.'
        kind: prose
        cls: IST_Body-Indent
        md: 'How foreign this approach may sound to the independent mindset Americans
          have. Yet God did not create us for the kinds of things we often celebrate
          in this country: the **maverick spirit**, the renegade, the individual,
          and the lone ranger. We have adopted a do-it-on-your-own mentality, yet
          ministry was not designed to be done alone.'
        UID: MIN251.CH12.INTRO.P.3
      - text: All good leaders are driven by a dream. But every leader will need to
          take part in making that dream a reality. God did not design leadership
          in the body of Christ to take place in a vacuum, isolated and alone. In
          order to make the dream work, you need teamwork. Jesus selected a team of
          twelve. Paul traveled with a team of workers made up of Luke, Timothy, Barnabas,
          Silas, Mark, Demas, and others. In the Old Testament, Moses had his team
          of elders, David had his mighty men, and Elijah had his school of prophets.
          Ministry was designed to take place in teams. We are to do it together (Elmore
          2001, 78).
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH12.INTRO.P.4
      - text: Imagine how long it would have taken Wayne Burkholder to rebuild his
          barn had he been left to do it on his own. Without a team coming together
          to help rebuild his barn, the Burkholder barn might still be in ruins. Dreams
          are much harder to get off the ground when tackled alone, but when a team
          is brought together it is astounding what can be accomplished. Not only
          does teamwork get the job done more effectively than one person can, but
          a community is formed out of it. People find meaning in being part of a
          team not just by arriving at the goal, but in the relationships that are
          formed in the process of getting there.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH12.INTRO.P.5
