    - last_modified: '2026-03-27'
      title: 10 - Cultivating People Skills in Your Leadership
      print_page: 1
      intro_body:
      - text: In John 13:15, Jesus said, “I have set you an example that you should
          do as I have done for you.” Clearly, no one exemplified people skills better
          than Jesus did. Everywhere He went, people followed Him. Why? Because it
          was obvious that people were His passion. He met their needs wherever He
          encountered them. Jesus touched people physically, spiritually, and emotionally.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH10.INTRO.P.1
      - text: Likewise, the basis of leadership is people. An old adage states, “He
          who thinks he leads, but has no followers, is only taking a walk.” If you
          cannot relate to and connect with people, they will not follow you. Relationships
          will make or break a leader over time. Effective leaders avoid focusing
          on themselves and their own success. They are others-minded, helping others
          reach their maximum potential. Inability to get along with people can seriously
          cripple one’s leadership effectiveness. As John Maxwell often says, “People
          will not go along with you if they cannot get along with you.”
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH10.INTRO.P.2
      - text: Perhaps the most useful person of all is the one who knows how to get
          along with people. After all, pastors and other Christian workers are in
          the people business . We must learn to understand people and their personalities
          and temperaments, and then we should find effective ways to connect with
          them.
        kind: prose
        cls: IST_Body-Indent
        md: Perhaps the most useful person of all is the one who knows how to get
          along with people. After all, pastors and other Christian workers are in
          the *people business*. We must learn to understand people and their personalities
          and temperaments, and then we should find effective ways to connect with
          them.
        UID: MIN251.CH10.INTRO.P.3
      - text: We must learn to serve others and to add value and blessing to them.
          We add value to others when we
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH10.INTRO.P.4
      - text: highly value them as unique and special gifts from God.
        kind: list
        cls: IST_Body-Bullet-2
        UID: MIN251.CH10.INTRO.P.5
      - text: make ourselves more valuable by continuing in our personal and professional
          growth and development.
        kind: list
        cls: IST_Body-Bullet-2
        UID: MIN251.CH10.INTRO.P.6
      - text: know and relate to what others value.
        kind: list
        cls: IST_Body-Bullet-2
        UID: MIN251.CH10.INTRO.P.7
      - text: value what God values.
        kind: list
        cls: IST_Body-Bullet-2
        UID: MIN251.CH10.INTRO.P.8
      - text: (Maxwell 2004, 80–81)
        kind: prose
        cls: IST_Body-Indent-3
        UID: MIN251.CH10.INTRO.P.9
