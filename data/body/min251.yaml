    - last_modified: '2026-05-28'
      title: 2 - The Heart of a Leader
      print_page: 27
      intro_body:
      - text: “David shepherded them with integrity of heart; with skillful hands
          he led them.” (Psalm 78:72)
        kind: quote
        cls: IST_Body-Bible-Verse-Sub-Head
        md: '*“David shepherded them with integrity of heart; with skillful hands
          he led them.”* (Psalm 78:72)'
        UID: MIN251.CH2.INTRO.P.1
      - text: Every leader has an opportunity to make a positive difference in society.
          Tragically, there are times when a properly equipped leader does not arise
          to face a given challenge and everyone loses. Why is this so? Many times,
          it is because people have not prepared their hearts to serve.
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH2.INTRO.P.2
      - text: Leadership skills are essential and must be learned and nurtured, but
          the first step is to address the heart because the being part of leadership
          must come before the doing part of leadership. Leadership skills can be
          harmful in the hands of a person whose heart is not right toward God, so
          this chapter will focus on developing the heart of a leader, particularly
          the Christian leader.
        kind: prose
        cls: IST_Body-Indent
        md: Leadership skills are essential and must be learned and nurtured, but
          the first step is to address the heart because the *being* part of leadership
          must come before the *doing* part of leadership. Leadership skills can be
          harmful in the hands of a person whose heart is not right toward God, so
          this chapter will focus on developing the heart of a leader, particularly
          the Christian leader.
        UID: MIN251.CH2.INTRO.P.3
      - text: 'A godly heart is foundational to Christian leadership. Of course, a
          good heart does not automatically produce an effective leader. It is entirely
          possible for a leader to possess a Christlike heart, a love for God, and
          a desire to make a difference, yet not be effective in leading others. While
          a Christlike heart is the foundation of leadership, it is not the end of
          the journey. In Acts 9:3–6; 22:6–10, Paul is traveling to Damascus when
          he has a dramatic encounter with Jesus. Paul responds by asking the right
          questions in the right order: “Who are you, Lord?” and then, “What shall
          I do, Lord?” These questions should still guide the lives of leaders today.'
        kind: prose
        cls: IST_Body-Indent
        UID: MIN251.CH2.INTRO.P.4
