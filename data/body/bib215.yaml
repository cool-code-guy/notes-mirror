    course_objectives:
    - 1. Discuss key events in the life and ministry of the apostle Paul, including
      the background issues that prompted his letter to the Roman church.
    - 2. Defend Paul’s right to be called an apostle, missionary, theologian, and
      servant of Jesus Christ.
    - 3. Describe how Paul develops in his letter to the Romans the gospel message
      involving people’s need of a Savior, God’s provision of a Savior, God’s shaping
      process, and the Holy Spirit’s empowering of the believer.
    - 4. Evaluate Paul’s discourse on Israel’s election, unbelief, and restoration
      and relate this to his primary ministry to Gentiles.
    - 5. Apply in your cultural context and in your own life Paul’s practical teaching
      with respect to living the Christian life and relating to all people, including
      non-Christians, authorities, and other believers.
    - 6. Preach or teach the gospel message as expounded by the apostle Paul in his
      letter to the Roman church.
