      - uid: BIB215.5.1.3.F.1
        subobj: 5.1.3
        type: final
        question: In Romans 8, Paul declared that those who live according to the
          sinful nature will
        choices:
          A: have troubles.
          B: be free.
          C: die.
          D: feel guilty.
        answer: C
      - uid: BIB215.5.1.4.F.1
        subobj: 5.1.4
        type: final
        question: According to Romans 8:14, a distinguishing trait of God’s children
          is
        choices:
          A: an inferior status like that of a child.
          B: the leading of the Spirit of God.
          C: an attitude of self-confidence.
          D: fear of God’s wrath.
        answer: B
      - uid: BIB215.5.2.1.F.1
        subobj: 5.2.1
        type: final
        question: The consummation of believers’ adoption into the family of God is
        choices:
          A: the seal of our inheritance.
          B: an inward groaning of anticipation.
          C: the confession of past sins.
          D: the redemption of their bodies.
        answer: D
      - uid: BIB215.5.3.1.F.1
        subobj: 5.3.1
        type: final
        question: God works in all things for the good of those who love Him in order
          to
        choices:
          A: relieve their suffering.
          B: prevent bad things from happening to them.
          C: give them a testimony of God’s deliverance.
          D: conform them to the likeness of His Son.
        answer: D
      - uid: BIB215.5.3.3.F.1
        subobj: 5.3.3
        type: final
        question: The question, “If God be for us, who can be against us?” implies
          that
        choices:
          A: those who love God will have no enemies.
          B: believers cannot be certain that God is for them.
          C: believers have been redeemed from the Law’s curse.
          D: with God for believers, no one can prevail against them.
        answer: D
      - uid: BIB215.6.1.1.F.1
        subobj: 6.1.1
        type: final
        question: The content of Romans 9-11 is best described as
        choices:
          A: the sinful condition of all people.
          B: life in the Spirit.
          C: faith versus works.
          D: Israel’s divine purpose in history.
        answer: D
      - uid: BIB215.6.1.2.F.1
        subobj: 6.1.2
        type: final
        question: According to Romans 2, a “true Jew” is one who
        choices:
          A: has experienced the Jewish rite of circumcision.
          B: obeys the Law faithfully.
          C: has a heart that is right with God.
          D: was born of Jewish parents.
        answer: C
      - uid: BIB215.6.1.2.F.2
        subobj: 6.1.2
        type: final
        question: The statement, “[God] hardens whom he wants to harden” demonstrates
          that
        choices:
          A: God’s actions are sometimes arbitrary and undeserved.
          B: God does not harden anyone who does not first harden him or herself.
          C: Pharaoh had no control over God hardening his heart.
          D: often God hardens those who do not resist His leading.
        answer: B
      - uid: BIB215.6.2.1.F.1
        subobj: 6.2.1
        type: final
        question: When Paul said the Jews “stumbled over the stumbling stone,” he
          meant that they
        choices:
          A: turned from God to idolatry.
          B: did not interpret the Law correctly.
          C: took no responsibility for their sins.
          D: rejected Christ and trusted in works.
        answer: D
      - uid: BIB215.6.3.1.F.1
        subobj: 6.3.1
        type: final
        question: According to Romans 10, there can be no salvation, no calling, no
          believing, no hearing, and no preaching unless
        choices:
          A: people pray.
          B: God wills it.
          C: someone is sent.
          D: sinners respond.
        answer: C
      - uid: BIB215.7.1.1.F.1
        subobj: 7.1.1
        type: final
        question: According to Romans 12, to put their faith into practice, believers
          must
        choices:
          A: be examples in their religious zeal.
          B: conform to the accepted patterns of this world.
          C: continue to earn their salvation by good works.
          D: give their body, mind, and will to God.
        answer: D
      - uid: BIB215.7.1.1.F.2
        subobj: 7.1.1
        type: final
        question: To “be transformed by the renewing” of their minds (Romans 12:2),
          believers must
        choices:
          A: use their minds to change themselves for good.
          B: cooperate as the Holy Spirit works to renew them.
          C: be passive and uninvolved in the changing process.
          D: withdraw from the world and all its influences.
        answer: B
      - uid: BIB215.7.1.1.F.3
        subobj: 7.1.1
        type: final
        question: In Romans 12:1, the term living sacrifice refers to
        choices:
          A: a willingness to die for Christ.
          B: giving up pleasurable things.
          C: death to the old self when one accepts Christ.
          D: what Jesus did on the cross.
        answer: C
      - uid: BIB215.7.1.2.F.1
        subobj: 7.1.2
        type: final
        question: In relation to Romans 12, the example of the vine and the branches
          in John 15 illustrates that a believer’s fruitfulness depends on
        choices:
          A: how long he or she has been a Christian.
          B: his or her spiritual gifts.
          C: union with Christ.
          D: ministry to others.
        answer: C
      - uid: BIB215.7.1.2.F.2
        subobj: 7.1.2
        type: final
        question: Which of these is distributed to each believer as the Spirit determines?
        choices:
          A: Power to overcome
          B: The fruit of the Spirit
          C: Opportunities to witness
          D: Spiritual gifts
        answer: D
      - uid: BIB215.7.2.1.F.1
        subobj: 7.2.1
        type: final
        question: According to Romans 13:8, the law is fulfilled when a person
        choices:
          A: obeys those in authority.
          B: outwardly conforms to the Law.
          C: tries to live at peace with others.
          D: loves his or her fellow humanity.
        answer: D
      - uid: BIB215.7.3.1.F.1
        subobj: 7.3.1
        type: final
        question: Paul’s warning against passing judgment on “disputable matters”
          in Romans 14:1 refers to
        choices:
          A: fundamentals of salvation.
          B: opinions of right and wrong.
          C: clearly defined teaching.
          D: worldly practices and customs.
        answer: B
      - uid: BIB215.7.3.1.F.2
        subobj: 7.3.1
        type: final
        question: Among believers, doing what leads to peace and mutual edification
          means
        choices:
          A: trying to control or limit the activities of weaker believers.
          B: being passive and permissive in relations with other believers.
          C: avoiding anything that might cause someone else to stumble.
          D: living in harmony and building up fellow believers.
        answer: D
      - uid: BIB215.8.1.1.F.1
        subobj: 8.1.1
        type: final
        question: When describing his ministry, Paul focused on
        choices:
          A: his accomplishments through preaching Christ.
          B: others’ praise concerning his accomplishments.
          C: his physical challenges while preaching the gospel.
          D: what Christ had accomplished through him.
        answer: D
      - uid: BIB215.8.1.1.F.2
        subobj: 8.1.1
        type: final
        question: Paul’s missionary strategy was to
        choices:
          A: stay in one place preaching for many years.
          B: build strong churches in small villages.
          C: minister in churches already established by others.
          D: preach the gospel where Christ was not known.
        answer: D
      - uid: BIB215.8.2.1.F.1
        subobj: 8.2.1
        type: final
        question: Most of the people Paul greeted in Romans 16 were
        choices:
          A: of the lower strata of society.
          B: Jewish relatives of Paul.
          C: high-ranking Gentiles living in Rome.
          D: Greeks associated with the ruling class.
        answer: A
      - uid: BIB215.8.2.1.F.2
        subobj: 8.2.1
        type: final
        question: From Paul’s greetings to individuals in the Roman church (Romans
          16), we learn that
        choices:
          A: the members were all from the same ethnic group.
          B: workers in the church included women.
          C: there were no Jews in this church.
          D: he had visited the church more than once.
        answer: B
      - uid: BIB215.8.2.2.F.1
        subobj: 8.2.2
        type: final
        question: One argument against the Ephesus theory that Romans ends at 15:33
          is that
        choices:
          A: Paul could not have had as many friends in Rome as chapter 16 suggests.
          B: as an outsider, Paul would not have written the admonitions in 16:17-20
            to the Roman church.
          C: Paul’s doxology actually was written at the end of chapter 15, not 16.
          D: it was Paul’s pattern to greet people by name solely in churches he had
            not founded.
        answer: D
      - uid: BIB215.8.3.1.F.1
        subobj: 8.3.1
        type: final
        question: In his final instructions, Paul advises the Roman believers to
        choices:
          A: be moderate in the use of spiritual gifts in the church.
          B: be open-minded about what is taught or preached by outsiders.
          C: watch out for those who cause division and preach false doctrines.
          D: be suspicious of others within the church until they have proven to be
            trustworthy.
        answer: C
