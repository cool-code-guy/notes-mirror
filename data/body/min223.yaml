    course_objectives:
    - 1. Justify the importance of preaching as it relates to other aspects of the
      ministry.
    - 2. Define the purpose of preaching.
    - 3. Establish clear goals in your preaching ministry.
    - 4. Be more aware of your own sense of calling and its effect on the urgency
      of preaching.
    - 5. Develop an effective weekly work schedule for sermon preparation.
    - 6. Create a year’s preaching calendar.
    - 7. Analyze a passage of Scripture and determine the best structure or form for
      a particular sermon.
    - 8. Distinguish between topical, textual, and expository sermons, and determine
      the appropriate use of each one.
    - 9. Apply the principles of sermon preparation in building sermons.
    - 10. Construct and preach sound biblical sermons.
